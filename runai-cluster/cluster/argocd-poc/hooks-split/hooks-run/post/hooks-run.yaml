#
# The resource that makes the post Application go OutOfSync. Change runId (and
# version, on an upgrade) to run the post hooks again; nothing else starts them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: runai-cluster-post-hooks-run
  namespace: runai
data:
  version: "<CLUSTER_VERSION>"
  runId: "<RUN_ID>"
