#
# The resource that makes the uninstall Application go OutOfSync, so that its
# pre-delete hook runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: runai-cluster-uninstall-hooks-run
  namespace: runai
data:
  runId: "<RUN_ID>"
