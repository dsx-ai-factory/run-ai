#
# The runai-cluster release without the chart's own hooks. The hook-handler Jobs
# are the only part that needs the short-lived bootstrap token, so syncing this
# Application, including by self-heal, no longer depends on it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runai-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: <ARGO_PROJECT>
  sources:
    - repoURL: <CHART_REPO_URL>
      chart: runai-cluster
      targetRevision: <CLUSTER_VERSION>
      helm:
        releaseName: runai-cluster
        skipCrds: true
        valueFiles:
          - $values/values/runai-cluster.yaml
        parameters:
          - name: hooks.render
            value: none
    - repoURL: <GITOPS_REPO_URL>
      targetRevision: <GITOPS_BRANCH>
      ref: values
  destination:
    namespace: runai
    server: https://kubernetes.default.svc
  ignoreDifferences:
    # The offline render generates a new webhook certificate each time.
    - group: ""
      kind: Secret
      name: runai-pod-group-assigner-tls-secret
      namespace: runai
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: kai-pod-group-mutation
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      # The CRDs are installed by the pre Application's hooks, after Argo CD has
      # validated this Application's resources.
      - SkipDryRunOnMissingResource=true
