#
# Values shared by the four Applications. Credentials are never written here:
# the cluster uid and bootstrap token come from a Secret created beforehand.
openShift:
  mode: Disabled

controlPlane:
  url: "<CONTROL_PLANE_URL>"
  existingSecret: runai-cluster-credentials
  secretKeys:
    clientSecret: ""
    bootstrapToken: bootstrap-token
    clusterUid: cluster-uid

cluster:
  url: "<CONTROL_PLANE_URL>"
