  schemas:
    DatavolumeRequestType:
      description: "Which datavolumes to return in the GET datavolumes response. Originated\
        \ - datavolumes that are originated in the permitted scopes of the caller.\
        \ UsableInProject - datavolumes that can be used in a specific project; if\
