      - Ready
      - NotReady
      - Creating
      - Deleting
      - Unknown
      example: Ready
      type: string
    Condition:
      properties:
        type:
          description: "The type of the condition, such as Failed or Available. See\
            \ Types of domain status conditions."
          example: PvcsCreated
          type: string
        status:
          description: "The status of the condition, such as True, False or Unknown."
          example: "False"
          type: string
        message:
          description: "An optional, human-readable message providing more details\
            \ about the condition."
          example: Failed to create pvc in namespace 'runai-proj1'
          type: string
        reason:
          description: The reason for the Failed condition. Not applicable to other
            types of condition.
          example: ErrorCreatingPvc
          type: string
        lastTransitionTime:
          description: A timestamp of when the condition was created or the last time
            time the condition transitioned from one status to another.
          example: 2022-01-01T03:49:52.531Z
          format: date-time
          nullable: true
          type: string
      required:
      - status
      - type
      type: object
