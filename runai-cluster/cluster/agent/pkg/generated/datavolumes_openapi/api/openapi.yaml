      required: false
      schema:
        default: 50
        format: int32
        maximum: 500
        minimum: 1
        type: integer
      style: form
    DatavolumesSortBy:
      description: Sort results by a parameters.
      explode: true
      in: query
      name: sortBy
      required: false
      schema:
        enum:
        - name
        - projectId
        - clusterId
        - departmentId
        - projectName
        - createdAt
        - createdBy
        - phase
        type: string
      style: form
    SortOrder:
      description: Sort results in descending or ascending order.
      explode: true
      in: query
      name: sortOrder
      required: false
      schema:
        default: asc
        enum:
        - asc
        - desc
        type: string
      style: form
    DatavolumesFilter:
      description: "Filter results by a parameter. Use the format field-name operator\
        \ value. Operators are == Equals, != Not equals, <= Less than or equal, >=\
        \ Greater than or equal, =@ contains, !@ Does not contains, =^ Starts with\
        \ and =$ Ends with. Dates are in ISO 8601 timestamp format and available for\
        \ operators ==, !=, <= and >=."
      explode: false
      in: query
      name: filterBy
      required: false
      schema:
        example:
        - name!=some-datavolume-name
        items:
          pattern: ^(name|projectId|clusterId|departmentId|projectName|createdAt|createdBy|phase)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
          type: string
        type: array
      style: form
