    DatavolumesSyncRequest:
      example:
        datavolumes:
        - null
        - null
        from: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        clusterId: 71f69d83-ba66-4822-adf5-55ce55efd210
        to: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        datavolumes:
          items:
            $ref: '#/components/schemas/DatavolumeStatusForSync'
          type: array
        clusterId:
          description: The id of the cluster.
          example: 71f69d83-ba66-4822-adf5-55ce55efd210
          format: uuid
          type: string
        from:
          description: "the first datavolume id to sync. if empty, all datavolumes\
            \ before the first one sent will be deleted."
          format: uuid
          type: string
        to:
          description: "the last datavolume to sync. if empty, all datavolumes after\
            \ the last one sent will be deleted."
          format: uuid
          type: string
      required:
      - clusterId
      - datavolumes
      type: object
    ClusterIdOptional:
      description: The id of the cluster.
      example: 71f69d83-ba66-4822-adf5-55ce55efd210
      format: uuid
      minLength: 1
      nullable: true
      type: string
    DepartmentIdOptional:
      description: The id of the department.
      example: "2"
      minLength: 1
      nullable: true
      type: string
    Ancestors:
      description: The ancestors of an org unit.
      example:
        tenant_id: "1"
        cluster_uuid: 71f69d83-ba66-4822-adf5-55ce55efd210
        department_id: "2"
        project_id: "1"
      properties:
        tenant_id:
          example: "1"
          type: string
        cluster_uuid:
          description: The id of the cluster.
          example: 71f69d83-ba66-4822-adf5-55ce55efd210
          format: uuid
          minLength: 1
          nullable: true
          type: string
        department_id:
          description: The id of the department.
          example: "2"
          minLength: 1
          nullable: true
          type: string
        project_id:
          example: "1"
          nullable: true
          type: string
      required:
      - tenant_id
      type: object
    InternalDatavolumeCreationFields:
      example:
        scope: null
        departmentId: "4500001"
        name: datavolume-a
        description: Results of experiment X
        clusterId: cf8c8ea0-94e4-4177-a050-bbf9b10d9cc5
        originPvcName: pvc-a
      properties:
        name:
          example: datavolume-a
          maxLength: 63
          pattern: "^[a-z][-a-z0-9]{0,62}$"
          type: string
        scope:
          $ref: '#/components/schemas/ScopeType'
        departmentId:
          description: The ID of the department that in its namespace the origin pvc
            is located (mandatory if scope is department)
          example: "4500001"
          type: string
        clusterId:
          description: The ID of the cluster that in its namespace the origin pvc
            is located (mandatory if scope is cluster)
          example: cf8c8ea0-94e4-4177-a050-bbf9b10d9cc5
          format: uuid
          type: string
        description:
          example: Results of experiment X
          maxLength: 127
          type: string
        originPvcName:
          description: The name of the PVC that the datavolume is based on
          example: pvc-a
          type: string
      required:
      - name
      - originPvcName
      - scope
      type: object
    InternalEnrichmentDataFields:
      properties:
        departmentId:
          example: "4500001"
          type: string
        clusterId:
          description: The id of the cluster.
          example: 71f69d83-ba66-4822-adf5-55ce55efd210
          format: uuid
          type: string
      type: object
    InternalDatavolume:
      allOf:
      - $ref: '#/components/schemas/BaseFields'
      - $ref: '#/components/schemas/InternalDatavolumeCreationFields'
      - $ref: '#/components/schemas/InternalEnrichmentDataFields'
      - $ref: '#/components/schemas/Datavolume_allOf'
    DatavolumeSortFilterFields:
      enum:
      - name
      - projectId
      - clusterId
      - departmentId
      - projectName
      - createdAt
      - createdBy
      - phase
      type: string
    TenantId:
      description: The id of the tenant.
      example: 1001
      format: int32
      type: integer
    ComplianceIssues:
      nullable: true
      properties:
        complianceIssues:
          items:
            $ref: '#/components/schemas/ComplianceIssues_complianceIssues_inner'
          type: array
      type: object
    SubmissionError:
      allOf:
      - $ref: '#/components/schemas/Error'
      - $ref: '#/components/schemas/ComplianceIssues'
    get_datavolumes_200_response:
      example:
        next: 1
        datavolumes:
        - null
        - null
      properties:
        next:
          example: 1
          type: integer
        datavolumes:
          items:
            $ref: '#/components/schemas/DatavolumeNoSharedScopes'
          type: array
          x-schema-name: DatavolumesNoSharedScopes
      required:
      - datavolumes
      type: object
    get_used_pvcs_from_datavolumes_200_response:
      example:
        boundPVCs:
        - boundPVCs
        - boundPVCs
      properties:
        boundPVCs:
          items:
            type: string
          type: array
      type: object
    count_datavolumes_200_response:
      example:
        count: 1
      properties:
        count:
          example: 1
          format: int64
          type: integer
      required:
      - count
      type: object
    get_datavolumes_internal_200_response:
      example:
        next: 1
        datavolumes:
        - null
        - null
      properties:
        next:
          example: 1
          type: integer
        datavolumes:
          items:
            $ref: '#/components/schemas/DatavolumeInternal'
          type: array
          x-schema-name: Datavolumes
      required:
      - datavolumes
      type: object
    DatavolumeNoSharedScopes_allOf:
      properties:
        status:
          $ref: '#/components/schemas/DatavolumeStatus'
      required:
      - status
      type: object
    SharedScope_allOf:
      properties:
        scopeName:
          description: The name of the scope
          example: project-a
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          example: user@run.ai
          type: string
      required:
      - scopeName
      type: object
    Datavolume_allOf:
      properties:
        sharedScopes:
          description: Will be returned only if the user has the required permissions
            to view those scopes
          items:
            $ref: '#/components/schemas/SharedScope'
          type: array
        status:
          $ref: '#/components/schemas/DatavolumeStatus'
      required:
      - status
      type: object
    DatavolumeStatusInternal_allOf:
      properties:
        isDeleted:
          description: "If true, the datavolume is deleted in the cluster and 'phase'\
            \ field is irrelevant."
          example: false
          nullable: true
          type: boolean
      type: object
    DatavolumeInternal_allOf:
      properties:
        sharedScopes:
          description: Will be returned only if the user has the required permissions
            to view those scopes
          items:
            $ref: '#/components/schemas/SharedScope'
          type: array
        phase:
          $ref: '#/components/schemas/DatavolumePhase'
      type: object
    DatavolumeStatusForSync_allOf:
      properties:
        datavolumeId:
          description: The id of the datavolume
          example: 71f69d83-ba66-4822-adf5-55ce55efd210
          format: uuid
          type: string
      required:
      - datavolumeId
      type: object
    ComplianceIssues_complianceIssues_inner:
      properties:
        field:
          example: compute.gpuDevicesRequest
          type: string
        details:
          example: value must be no less than 3
          type: string
      required:
      - details
      - field
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Bearer authentication
      scheme: bearer
