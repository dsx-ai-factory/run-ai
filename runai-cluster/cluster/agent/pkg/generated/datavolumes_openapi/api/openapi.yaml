      properties:
        id:
          example: 71f69d83-ba66-4822-adf5-55ce55efd210
          format: uuid
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        createdBy:
          example: user@run.ai
          type: string
        updatedBy:
          example: user@run.ai
          type: string
      required:
      - id
      type: object
    DatavolumeCreationFields:
      example:
        name: datavolume-a
        description: Results of experiment X
        originPvcName: pvc-a
        shouldDeleteOriginalVolume: false
        useOriginalVolume: true
        projectId: "5"
      properties:
        name:
          description: The name of the new data volume.
          example: datavolume-a
          maxLength: 63
          pattern: "^[a-z][-a-z0-9]{0,62}$"
          type: string
        description:
          description: A brief description of the data volume and its purpose.
          example: Results of experiment X
          maxLength: 127
          type: string
        originPvcName:
          description: The name of the existing PVC that the new data volume is based
            on.
          example: pvc-a
          type: string
        projectId:
          description: The ID of the project whose namespace contains the origin PVC.
          example: "5"
          type: string
        shouldDeleteOriginalVolume:
          default: false
          description: True is not supported. This parameter will be removed in a
            future release.
          example: false
          type: boolean
        useOriginalVolume:
          default: true
          description: "If true, the original storage volume will be used together\
            \ with the data volume. Default true as long as \"shouldDeleteOriginalVolume\"\
            \ is false."
          example: true
          nullable: true
          type: boolean
      required:
      - name
      - originPvcName
      - projectId
      type: object
    ClusterId:
      description: The id of the cluster.
      example: 71f69d83-ba66-4822-adf5-55ce55efd210
      format: uuid
      type: string
