  /api/v1/datavolumes/name-availability:
    get:
      description: "Check if a given data volume name creates naming conflicts under\
        \ the given scope. Returns conflict (409) in case the name is not available,\
        \ or 204 (no content) if it is ok."
      operationId: datavolume_name_availability
      parameters:
      - description: the name of the datavolume
        explode: true
        in: query
        name: dataName
        required: true
        schema:
          minLength: 1
          type: string
        style: form
      - description: The id of the cluster
        explode: true
        in: query
        name: clusterId
        required: true
        schema:
          example: d73a738f-fab3-430a-8fa3-5241493d7128
          format: uuid
          type: string
        style: form
      responses:
        "204":
          description: The name is available to use
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "409":
          content:
            application/json:
              example:
                code: 409
                message: Resource with this name already exists
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource already exists
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Data volumes name availability.
      tags:
      - Datavolumes
      x-runai-team: Viper
      x-test-coverage:
      - src/test/suites/advancedSuite/datavolumes/datavolumesApi.test.ts
      x-authorize:
        resource-type: datavolumes
        action: read
