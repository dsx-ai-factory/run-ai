openapi: 3.0.0
info:
  contact:
    email: support@run.ai
  description: An API for managing datavolumes
  title: datavolumes-service
  version: 2.0.0
servers:
- url: https://app.run.ai
- url: https://staging.run.ai
- url: https://test.run.ai
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /:
    get:
      operationId: health
      responses:
        "200":
          description: Executed successfully.
      summary: health check
      tags:
      - Health
      x-runai-team: Suricata
      x-no-authorization: true
    x-internal: true
  /api/v1/datavolumes:
    get:
      description: Get requested datavolumes.
      operationId: get_datavolumes
      parameters:
      - description: "Which datavolumes would be returned in the response. Originated\
          \ - datavolumes that are originated in the permitted scopes of the caller.\
          \ UsableInProject - datavolumes that can be used in a specific project;\
          \ if you use this value, you must also provide the project ID in the \"\
          usableInProjectId\" query param."
        explode: true
        in: query
        name: requestType
        required: true
        schema:
          $ref: '#/components/schemas/DatavolumeRequestType'
        style: form
      - description: Only when using "UsableInProject" requestType; Filter results
          for only datavolumes that are shared with - or originated in - the project.
        explode: true
        in: query
        name: usableInProjectId
        required: false
        schema:
          example: "5"
          type: string
        style: form
      - description: The offset of the first item returned in the collection.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          example: 100
          format: int32
          type: integer
        style: form
      - description: The maximum number of entries to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 500
          minimum: 1
          type: integer
        style: form
      - description: Sort results by a parameters.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          enum:
          - name
          - projectId
          - clusterId
          - departmentId
          - projectName
          - createdAt
          - createdBy
          - phase
          type: string
        style: form
      - description: Sort results in descending or ascending order.
        explode: true
        in: query
        name: sortOrder
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: "Filter results by a parameter. Use the format field-name operator\
          \ value. Operators are == Equals, != Not equals, <= Less than or equal,\
          \ >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts\
          \ with and =$ Ends with. Dates are in ISO 8601 timestamp format and available\
          \ for operators ==, !=, <= and >=."
        explode: false
        in: query
        name: filterBy
        required: false
        schema:
          example:
          - name!=some-datavolume-name
          items:
            pattern: ^(name|projectId|clusterId|departmentId|projectName|createdAt|createdBy|phase)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
            type: string
          type: array
        style: form
      - description: Filter results by a free text search.
        explode: true
        in: query
        name: search
        required: false
        schema:
          example: test project
          type: string
        style: form
      - description: Whether the query should include data volumes that were created
          internally
        explode: true
        in: query
        name: includeInternal
        required: false
        schema:
          default: false
          type: boolean
        style: form
        x-internal: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_datavolumes_200_response'
          description: Executed successfully.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: List datavolumes in permitted scopes
      tags:
      - Datavolumes
      x-runai-team: Suricata
      x-test-coverage:
      - src/test/suites/advancedSuite/datavolumes/datavolumesApi.test.ts
      x-authorize:
        resource-type: datavolumes
        action: read
    post:
      operationId: create_datavolume
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatavolumeCreationFields'
        description: The datavolume to create.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
