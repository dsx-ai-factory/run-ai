  /api/v1/authorization/access-rules:
    get:
      operationId: get_access_rules
      parameters:
      - description: The type of resource we want to filter by.
        explode: true
        in: query
        name: subjectType
        required: false
        schema:
          example: user
          type: string
        style: form
      - description: Part of the subject id that we want to filter by.
        explode: true
        in: query
        name: subjectIdFilter
        required: false
        schema:
          example: some.user
          type: string
        style: form
      - description: The ids of the subjects to filter the response for.
        explode: false
        in: query
        name: subjectIds
        required: false
        schema:
          items:
            example: some.user@run.ai
            type: string
          type: array
        style: form
      - description: The maximum number of entries to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          example: 1000
          format: int32
          type: integer
        style: form
      - description: The offset of the first item returned in the collection.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          example: 4000
          format: int32
          type: integer
        style: form
      - description: Filter by last update time.
        explode: true
        in: query
        name: lastUpdated
        required: false
        schema:
          example: 2021-12-14T16:04:15.099Z
          type: string
        style: form
      - description: True to include deleted objects in the result.
        explode: true
        in: query
        name: includeDeleted
        required: false
        schema:
          default: false
          example: false
          type: boolean
        style: form
      - description: The cluster id to filter the response for.
        explode: true
        in: query
        name: clusterId
        required: false
        schema:
          example: 7daba6ee-2aa9-4ab3-b735-a3d4bcdff72f
          format: uuid
          type: string
        style: form
      - description: The type of resource we want to filter by.
        explode: true
        in: query
        name: scopeType
        required: false
        schema:
          example: project
          type: string
        style: form
      - description: The scope resource id that we want to filter by.
        explode: true
        in: query
        name: scopeId
        required: false
        schema:
          example: "2"
          type: string
        style: form
      - description: The role id we want to filter by.
        explode: true
        in: query
        name: roleId
        required: false
        schema:
          format: int32
          minimum: 1
          type: integer
        style: form
