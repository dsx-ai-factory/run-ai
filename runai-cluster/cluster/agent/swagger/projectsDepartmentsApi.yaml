################################## IMPORTANT NOTE ###########################################
# If you change anything in this file, please also generate client-sdk for the cluster-sync
# using swagger codegen, and add it under pkg/swagger-runai-backend-client folder in the
# cluster-sync repo.
#############################################################################################

openapi: "3.0.0"
info:
  version: 1.5.1
  description: |
    The aggregated API of Run:AI backend projects and departments
  title: Project and Department service API
  license:
    name: Run:AI
servers:
  - url: 'https://app.run.ai'
  - url: 'https://staging.run.ai'
  - url: 'https://test.run.ai'
security:
  - bearerAuth: [ ]
paths:
  # region projects
  /v1/k8s/clusters/{clusterId}/projects:
    post:
      tags:
        - Projects
      summary: Create a new project.
      description:
        Create a new project in the cluster.
        This endpoint requires EDITOR or RESEARCH MANAGER role.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        200:
          description: "Project created successfully."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        400:
          description: Bad Project request.
        409:
          description: Project failed to be created.

    get:
      tags:
        - Projects
      summary: List all projects.
      description:
        List all the projects managed by the tenant on a specific cluster.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
        - in: query
          name: memoryUnitMb
          schema:
            type: boolean
          required: false
          description: should memory be returned in MB. default is "false", in which case it will be returned in MiB.
          example: true
      responses:
        '200':
          description: A list of projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
  /v1/k8s/clusters/{clusterId}/projects/{id}:
    put:
      tags:
        - Projects
      summary: Update a project.
      description:
        Updates project details.
        This endpoint requires EDITOR or RESEARCH MANAGER role.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The unique project-id identifying the project.
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        200:
          description: An updated project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        404:
          description: Project not found.
        400:
          description: Bad project request.
        409:
            description: Could not update the project.
    delete:
      tags:
        - "Projects"
      summary: Delete a project.
      description: Delete a project from the cluster. This endpoint requires EDITOR or RESEARCH MANAGER  role.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: The unique id identifying the project.
          example: 2
      responses:
        "200":
          description: Project deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        404:
          description: Project not found.

    get:
      tags:
        - Projects
      summary: Get a specific project.
      description:
        Get information about a specific project. This endpoint requires view permissions to the requested project.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The unique project-id identifying the project.
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      responses:
        200:
          description: A project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        404:
          description: Project not found.
  ### start-exclude-from-docs
  /v1/k8s/clusters/{clusterId}/projects/status:
    x-internal: true
    put:
      tags:
        - Projects
      summary: Update Project status
      operationId: updateProjectStatus
      parameters:
        - name: clusterId
          in: path
          description: Unique identifier of the cluster
          required: true
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusRequest'
        required: true
      responses:
        201:
          description: Project updated successfully.
        400:
          description: Bad Project request.
        404:
          description: Project not found.
  ### stop-exclude-from-docs
  # endregion
  # region departments
  /v1/k8s/clusters/{clusterId}/departments/{department-id}:
    get:
      tags:
        - "Departments"
      summary: "Get a department."
      description: "Get a specific department by the ID."
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: department-id
          schema:
            type: integer
          required: true
          description: The unique id identifying the department.
          example: 2
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      responses:
        "200":
          description: "Departments returned successfully."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
    put:
      tags:
        - Departments
      summary: "Update a department."
      description: "Update a department in the cluster. This endpoint requires EDITOR role."
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: department-id
          schema:
            type: integer
          required: true
          description: The unique id identifying the department.
          example: 2
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
      responses:
        "200":
          description: "Department updated successfully."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
    delete:
      tags:
        - "Departments"
      summary: "Delete a department."
      description: "Delete a department from the cluster. This endpoint requires EDITOR role."
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: department-id
          schema:
            type: integer
          required: true
          description: The unique id identifying the department.
          example: 2
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      responses:
        "200":
          description: "Department deleted successfully."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
  /v1/k8s/clusters/{clusterId}/departments:
    get:
      tags:
        - "Departments"
      summary: "Get all departments."
      description: "Get list of all the department in the cluster."
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
        - in: query
          name: memoryUnitMb
          schema:
            type: boolean
          required: false
          description: should memory be returned in MB. default is "false", in which case it will be returned in MiB.
          example: true
      responses:
        "200":
          description: "Departments list returned successfully."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
    post:
      tags:
        - "Departments"
      summary: "Create a new department."
      description: "Create a new department in the cluster. This endpoint requires EDITOR role."
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUserDefinedProperties'
      responses:
        "200":
          description: "Department created successfully."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
  /v1/k8s/clusters/{clusterId}/departments/{department-id}/access-control:
    put:
      tags:
        - "Departments"
      summary: "Set the department admins."
      description: "Set the department admins. This endpoint requires EDITOR role."
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: department-id
          schema:
            type: integer
          required: true
          description: The unique id identifying the department.
          example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentAccessControl'
      responses:
        "201":
          description: "Department admin set successfully."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentAccessControl'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
# endregion
components:
  securitySchemes:
    bearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT    # o
  parameters:
    limit:
      name: limit
      in: query
      required: false
      description: The maximum number of entries to return.
      schema:
        type: integer
        format: int32
        example: 1000
    offset:
      name: offset
      in: query
      required: false
      description: The offset of the first item returned in the collection.
      schema:
        type: integer
        format: int32
        example: 4000
    lastUpdated:
      name: lastUpdated
      in: query
      required: false
      description: The last timestamp of the previously received items.
      schema:
        type: string
        format: date-time
        example: '2021-12-14T16:04:15.099Z'
    includeDeleted:
      name: includeDeleted
      in: query
      required: false
      description: True to include deleted objects in the result.
      schema:
        type: boolean
        example: false
        default: false
  schemas:
    Error:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    ProjectCreateRequest:
      properties:
        name:
          type: string
          description: Project Name
          example: team-a
        departmentId:
          type: integer
          format: int32
          description: ID of the department owning the project
          example: 2
        deservedGpus:
          type: number
          description: The project GPU allocation that it is deserved to get in case the cluster has those resources
          example: 3
        maxAllowedGpus:
          type: number
          description: An upper limit for the amount of GPUs the project can get (Even if over quota is allowed and resources are available)
          example: 5
        gpuOverQuotaWeight:
          type: number
          description: The priority the project gets for over quota resources
          maximum: 3
          minimum: 0
          example: 1
        swapEnabled:
          type: boolean
          description: Flag for enabling thin provisioning for jobs of this project
          example: false
        defaultNodePools:
          type: array
          description: Default node pools for workload submission under this project (If a workload doesnt specify node pools list, this list will be used).
          items:
            type: string
          example: [ "default" ]
        interactiveJobTimeLimitSecs:
          type: number
          description: A limit for the duration of interactive jobs from this project in seconds
          example: 3600
        interactiveJobMaxIdleDurationSecs:
          type: number
          description: Maximum time duration in seconds that interactive job can be idle before it will be terminated
          example: 3000
        interactivePreemptibleJobMaxIdleDurationSecs:
          type: number
          description: Maximum time duration in seconds that interactive preemptible job can be idle before it will be terminated
          example: 3000
        trainingJobTimeLimitSecs:
          type: number
          description: A limit for the duration of training jobs from this project in seconds. Available only from cluster version 2.12
          example: 3600
        trainingJobMaxIdleDurationSecs:
          type: number
          description: Maximum time duration in seconds that training job can be idle before it will be terminated
          example: 3000
        nodeAffinity:
          $ref: '#/components/schemas/JobsNodeAffinity'
          description: Node affinity configuration for jobs of this project
        permissions:
          $ref: '#/components/schemas/ResourcePermissions'
          description: Permissions for users to do CRUD operations on jobs of this project
        resources:
          $ref: '#/components/schemas/AssignedResources'
          description: Total resources assigned to this Project. If Node Pool feature is on, the resources are the sum of all Node Pool Resources.
        nodePoolsResources:
          type: array
          items:
            $ref: '#/components/schemas/NodePoolAssignedResources'
          description: Resources assigned to this Project per Node Pool
        namespace:
          type: string
          description: The name of an existing namespace to use for the project in the cluster.
          example: ns-proj1
    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectCreateRequest'
        - properties:
            id:
              type: integer
              format: int32
              description: The project id
              readOnly: true
              example: 5
            tenantId:
              type: integer
              format: int32
              description: ID of the tenant owning the project
              example: 2
            clusterUuid:
              type: string
              format: uuid
              description: ID of the cluster owning the project
              example: 71f69d83-ba66-4822-adf5-55ce55efd210
            departmentName:
              type: string
              description: Name of the department owning the project
              example: department-a
            interactiveNodeAffinity:
              type: string
              example: none
            trainNodeAffinity:
              type: string
              example: none
            createdAt:
              type: string
              description: The creation date of the project
              format: date-time
              example: 2021-12-14T16:04:15.099Z
            status:
              $ref: '#/components/schemas/ProjectStatus'
            phase:
              type: string
              description: project's phase
              example: Ready
    ResourcePermissions:
      properties:
        users:
          type: array
          items:
            type: string
          description: Names of users that have permissions to the project
        groups:
          type: array
          items:
            type: string
          description: Names of groups that have permissions to the project
        applications:
          type: array
          items:
            type: string
          description: Names of applications that have permissions to the project
    JobsNodeAffinity:
      properties:
        train:
          $ref: '#/components/schemas/NodeAffinity'
          description: Node affinity configuration for train jobs
        interactive:
          $ref: '#/components/schemas/NodeAffinity'
          description: Node affinity configuration for interactive jobs
    NodeAffinity:
      properties:
        affinityType:
          type: string
          enum:
            - no_limit
            - only_selected
          description: The type of affinity of the jobs to the nodes
        selectedTypes:
          type: array
          items:
            $ref: '#/components/schemas/NodeTypeForProject'
    NodeTypeForProject:
      properties:
        id:
          type: number
        name:
          type: string
    AssignedResources:
      properties:
        id:
          type: number
        gpu:
          $ref: '#/components/schemas/Resource'
          description: GPU number resources assigned to the project
        cpu:
          $ref: '#/components/schemas/Resource'
          description: CPU in Millicores assigned assigned to the project
        memory:
          $ref: '#/components/schemas/Resource'
          description: Memory in Mib assigned to the project
    NodePoolAssignedResources:
      properties:
        id:
          type: number
        nodePool:
          $ref: '#/components/schemas/NodePoolResources'
          description: the node pool which the assigned resources refer to
        gpu:
          $ref: '#/components/schemas/Resource'
          description: GPU number assigned to the project in the node pool
        cpu:
          $ref: '#/components/schemas/Resource'
          description: CPU in Millicores assigned to the project in the node pool
        memory:
          $ref: '#/components/schemas/Resource'
          description: Memory in Mib assigned to the project in the node pool
    Resource:
      properties:
        deserved:
          type: number
          description: The project resource allocation that it is deserved to get in case the cluster has those resources
          example: 0
        maxAllowed:
          type: number
          description: Maximum amount of resources the project can get
          example: 1000
        overQuotaWeight:
          type: number
          description: The priority the project gets for over quota resources
          example: 2
    NodePoolResources:
      properties:
        id:
          type: number
          description: node pool id
          example: 3
        name:
          type: string
          description: node pool name
          example: default
    ProjectStatusRequest:
      properties:
        status:
          type: string
          description: A json representing the project's status
          example: "{\"namespace\":\"runai-team-a\"}"
        name:
          type: string
          description: Project Name
          example: team-a
        departmentName:
          type: string
          description: name of the department owning the project
          example: default
        quotaStatuses:
          $ref: '#/components/schemas/NodePoolsQuotaStatuses'
    ProjectStatus:
      properties:
        namespace:
          type: string
          description: The namespace of the project
          example: runai-team-a
        message:
          type: string
          description: Detailed phase message
          example: NamespaceHandlerFailed
        quotaStatuses:
          $ref: '#/components/schemas/NodePoolsQuotaStatuses'
    NodePoolsQuotaStatuses:
      type: array
      items:
        $ref: '#/components/schemas/NodePoolQuotaStatus'
      description: The current quota status for each nodepool. Supported only for cluster versions 2.15+.
    NodePoolQuotaStatus:
      properties:
        nodePoolName:
          type: string
          description: the node pool name which the current quota status refers to
        allocated:
          $ref: '#/components/schemas/QuotaStatusResourceList'
        allocatedNonPreemptible:
          $ref: '#/components/schemas/QuotaStatusResourceList'
        requested:
          $ref: '#/components/schemas/QuotaStatusResourceList'
    QuotaStatusResourceList:
      properties:
        gpu:
          type: number
          description: The number of GPUs (allocated/requested/...).
          example: 0
        cpu:
          type: number
          description: CPU in Millicores (allocated/requested/...).
          example: 1000
        memory:
          type: number
          description: Memory in Mib (allocated/requested/...).
          example: 1000
    DepartmentUserDefinedProperties:
      properties:
        name:
          type: string
          description: The name of the department.
          example: default
        deservedGpus:
          type: number
          description: Deserved GPUs for the department.
          example: 2
        allowOverQuota:
          type: boolean
          description: Is over quota allowed for the department.
          example: false
        maxAllowedGpus:
          type: number
          description: Max allowed GPUs for the department.
          example: 2
        resources:
          $ref: '#/components/schemas/AssignedResources'
          description: Total resources assigned to the Department. If Node Pool feature is on, the resources are the sum of all Node Pool Resources.
        nodePoolsResources:
          type: array
          items:
            $ref: '#/components/schemas/NodePoolAssignedResources'
          description: Resources assigned to the Department per node pool
    DepartmentAccessControl:
      properties:
        departmentId:
          type: integer
          format: int32
          description: The unique id identifying the department.
          example: 2
        departmentAdmins:
          type: array
          items:
            type: string
          description: Id's of users with department admin role that are assigned to managed the department
    Department:
      allOf:
        - $ref: '#/components/schemas/DepartmentUserDefinedProperties'
        - properties:
            tenantId:
              type: integer
              description: The tenant id this cluster belongs to.
              example: 42
            clusterUuid:
              type: string
              description: The cluster UUID this department belongs to.
              example: UUID
            createdAt:
              type: string
              description: The creation date of the department.
              format: date-time
              example: "2021-12-14T16:04:15.099Z"
            id:
              type: integer
              format: int32
              description: The unique id identifying the department.
              example: 2
            projects:
              type: array
              items:
                $ref: '#/components/schemas/Project'
              description: Projects under this department.
              example: [{id: 16, name: "team-a", deserved_gpus: 3}]
            projectsDeservedGpus:
              type: string
              description: Total deserved GPUs of the projects under this department - as string.
              example: "3.00"
            departmentAdmins:
              type: array
              items:
                type: string
              description: Id's of users with department admin role that are assigned to managed the department
