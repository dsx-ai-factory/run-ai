suite: Test RunAI KAI resource reservation namespace

templates:
  - charts/kai-resource-management/charts/kai-scheduler/templates/services/resourcereservation-namespace.yaml

tests:
  - it: should render the namespace referenced by the RunAI-owned KAI Config
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: runai-reservation
