suite: Test Custom CA

excludeTemplates:
  # Excluding
  - charts/kai-scheduler
  - charts/karta

tests:
  - it: should render deployments with custom CA volume and mount when customCA is enabled
    set:
      global.customCA.enabled: true
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: runai-ca-cert
            secret:
              items:
                - key: runai-ca.pem
                  path: runai-ca.pem
              optional: true
              secretName: runai-ca-cert
  - it: should configure the pre-install hook to trust the custom CA directory
    set:
      global.customCA.enabled: true
    templates:
      - templates/hooks/pre-install-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_DIR
            value: /etc/ssl/certs/runai-ca
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/ssl/certs/runai-ca
            name: runai-ca-cert
  - it: should configure the pre-upgrade hook to trust the custom CA directory
    set:
      global.customCA.enabled: true
    templates:
      - templates/hooks/pre-upgrade-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_DIR
            value: /etc/ssl/certs/runai-ca
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /etc/ssl/certs/runai-ca
            name: runai-ca-cert
