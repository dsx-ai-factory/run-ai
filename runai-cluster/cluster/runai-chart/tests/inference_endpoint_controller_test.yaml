suite: Inference endpoint controller RBAC
templates:
  - templates/clusterroles/inference-endpoint-controller.yaml
release:
  namespace: custom-runai
tests:
  - it: binds the controller service account in the release namespace
    documentSelector:
      path: kind
      value: ClusterRoleBinding
    asserts:
      - equal:
          path: roleRef.name
          value: runai-inference-endpoint-controller
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: inference-endpoint-controller
              namespace: custom-runai
  - it: keeps the cluster-wide role read-only on child resources
    # The ClusterRoleBinding shares this name, so select the role by the pods
    # rule only the cluster-wide ClusterRole carries.
    documentSelector:
      path: rules[1].resources[0]
      value: pods
    asserts:
      - equal:
          path: metadata.name
          value: runai-inference-endpoint-controller
      - contains:
          path: rules
          content:
            apiGroups: [inference.platform.run.ai]
            resources: [inferenceendpoints/status]
            verbs: [get, patch, update]
      - contains:
          path: rules
          content:
            apiGroups: [inference.networking.x-k8s.io]
            resources: [inferencemodelrewrites, inferenceobjectives]
            verbs: [get, list, watch]
      - equal:
          path: rules[?(@.resources[0]=="deployments")].verbs
          value: [get, list, watch]
      - equal:
          path: rules[?(@.resources[0]=="rolebindings")].verbs
          value: [get, list, watch]
      - equal:
          path: rules[?(@.resources[0]=="configmaps")].verbs
          value: [get, list, watch]
      - equal:
          path: rules[?(@.resources[0]=="networkpolicies")].verbs
          value: [get, list, watch]
  - it: grants child resource writes only through the project-scoped role
    documentSelector:
      path: metadata.name
      value: runai-inference-endpoint-controller-project
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [deployments]
            verbs: [create, delete, patch, update]
      - contains:
          path: rules
          content:
            apiGroups: [rbac.authorization.k8s.io]
            resources: [rolebindings, roles]
            verbs: [create, delete, patch, update]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [configmaps, serviceaccounts, services]
            verbs: [create, delete, patch, update]
      - contains:
          path: rules
          content:
            apiGroups: [inference.networking.x-k8s.io]
            resources: [inferencemodelrewrites, inferenceobjectives]
            verbs: [create, delete, patch, update]
      - contains:
          path: rules
          content:
            apiGroups: [networking.k8s.io]
            resources: [networkpolicies]
            verbs: [create, delete, patch, update]
      - notContains:
          path: rules
          content:
            apiGroups: [inference.platform.run.ai]
            resources: [inferenceendpoints]
            verbs: [create, delete, get, list, patch, update, watch]
  - it: scopes leader election to the controller namespace
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-runai
      - contains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [get, list, watch, create, update, patch, delete]
