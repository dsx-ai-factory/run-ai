suite: Test Additional Image Pull Secrets Args

tests:
  - it: should not add runai-reg-creds by default in pre-install-job
    set:
      helmHooksHandler.enabled: true
    templates:
      - templates/hooks/pre-install-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--additional-image-pull-secrets="
      - equal:
          path: spec.template.spec.imagePullSecrets
          value: []

  - it: should pass explicit additionalImagePullSecrets in pre-install-job
    set:
      helmHooksHandler.enabled: true
      global.additionalImagePullSecrets:
        - "extra-1"
        - "extra-2"
    templates:
      - templates/hooks/pre-install-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--additional-image-pull-secrets=extra-1,extra-2"
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: extra-1
            - name: extra-2

  - it: should pass explicit additionalImagePullSecrets in pre-upgrade-job
    set:
      helmHooksHandler.enabled: true
      global.additionalImagePullSecrets:
        - "extra-1"
        - "extra-2"
    templates:
      - templates/hooks/pre-upgrade-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--additional-image-pull-secrets=extra-1,extra-2"
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: extra-1
            - name: extra-2

  - it: should not add runai-reg-creds by default in pre-crd-upgrade-job
    set:
      helmHooksHandler.enabled: true
    templates:
      - templates/hooks/pre-crd-upgrade-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--additional-image-pull-secrets="
      - equal:
          path: spec.template.spec.imagePullSecrets
          value: []

  - it: should pass explicit additionalImagePullSecrets in pre-crd-upgrade-job
    set:
      helmHooksHandler.enabled: true
      global.additionalImagePullSecrets:
        - "tenant-registry-secret"
    templates:
      - templates/hooks/pre-crd-upgrade-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--additional-image-pull-secrets=tenant-registry-secret"
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: tenant-registry-secret

  - it: should use explicit additionalImagePullSecrets for hook pod pulls without adding runai-reg-creds
    set:
      helmHooksHandler.enabled: true
      global.additionalImagePullSecrets:
        - "tenant-registry-secret"
    templates:
      - templates/hooks/post-install-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: tenant-registry-secret
