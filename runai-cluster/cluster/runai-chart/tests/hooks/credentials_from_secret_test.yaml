suite: Test hook credentials sourced from an existing secret

templates:
  - templates/hooks/pre-install-job.yaml
  - templates/hooks/post-install-job.yaml
  - templates/hooks/pre-upgrade-job.yaml
  - templates/hooks/post-upgrade-job.yaml

tests:
  - it: should pass bootstrap token and cluster uid as values by default
    set:
      helmHooksHandler.enabled: true
      controlPlane.bootstrapToken: "literal-token"
      cluster.uid: "literal-uid"
    documentSelector:
      path: kind
      value: Job
      matchMany: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--control-plane-client-secret=@/runai/config/client_secret"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--control-plane-bootstrap-token=literal-token"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--cluster-uid=literal-uid"

  - it: should read bootstrap token and cluster uid from the existing secret
    set:
      helmHooksHandler.enabled: true
      controlPlane.bootstrapToken: "literal-token"
      cluster.uid: "literal-uid"
      controlPlane.existingSecret: my-secret
      controlPlane.secretKeys.clientSecret: ""
      controlPlane.secretKeys.bootstrapToken: bootstrap-token
      controlPlane.secretKeys.clusterUid: cluster-uid
    documentSelector:
      path: kind
      value: Job
      matchMany: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--control-plane-bootstrap-token=@/runai/config/bootstrap_token"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--cluster-uid=@/runai/config/cluster_uid"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--control-plane-client-secret=@/runai/config/client_secret"
      - contains:
          path: spec.template.spec.volumes[0].projected.sources
          content:
            secret:
              name: my-secret
              items:
                - key: bootstrap-token
                  path: bootstrap_token
                - key: cluster-uid
                  path: cluster_uid

  - it: should keep reading the client secret from an existing secret when no new keys are set
    set:
      helmHooksHandler.enabled: true
      controlPlane.existingSecret: my-secret
      controlPlane.bootstrapToken: "literal-token"
      cluster.uid: "literal-uid"
    documentSelector:
      path: kind
      value: Job
      matchMany: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--control-plane-client-secret=@/runai/config/client_secret"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--control-plane-bootstrap-token=literal-token"
