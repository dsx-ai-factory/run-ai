suite: Test NMC Service Account Args

tests:
  - it: should return only serviceAccountName when allowedServiceAccounts is not set
    set:
      helmHooksHandler.enabled: true
      global.serviceAccountName: "main-account"
      global.nmc.enabled: true
      global.nmc.remoteCluster.apiServer.url: "https://example.com"
    templates:
      - templates/hooks/post-install-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--nmc-allowed-service-accounts=main-account"

  - it: should return combined serviceAccountName and allowedServiceAccounts when both are set
    set:
      helmHooksHandler.enabled: true
      global.serviceAccountName: "main-account"
      global.nmc.enabled: true
      global.nmc.remoteCluster.apiServer.url: "https://example.com"
      global.nmc.allowedServiceAccounts:
        - "additional-account-1"
        - "additional-account-2"
    templates:
      - templates/hooks/post-install-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--nmc-allowed-service-accounts=main-account,additional-account-1,additional-account-2"

  - it: should work correctly in pre-install-job
    set:
      helmHooksHandler.enabled: true
      global.serviceAccountName: "test-account"
      global.nmc.enabled: true
      global.nmc.remoteCluster.apiServer.url: "https://example.com"
      global.nmc.allowedServiceAccounts:
        - "extra-account"
    templates:
      - templates/hooks/pre-install-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--nmc-allowed-service-accounts=test-account,extra-account"

  - it: should work correctly in pre-upgrade-job
    set:
      helmHooksHandler.enabled: true
      global.serviceAccountName: "test-account"
      global.nmc.enabled: true
      global.nmc.remoteCluster.apiServer.url: "https://example.com"
      global.nmc.allowedServiceAccounts:
        - "extra-account"
    templates:
      - templates/hooks/pre-upgrade-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--nmc-allowed-service-accounts=test-account,extra-account"

  - it: should work correctly in post-upgrade-job
    set:
      helmHooksHandler.enabled: true
      global.serviceAccountName: "test-account"
      global.nmc.enabled: true
      global.nmc.remoteCluster.apiServer.url: "https://example.com"
      global.nmc.allowedServiceAccounts:
        - "extra-account"
    templates:
      - templates/hooks/post-upgrade-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--nmc-allowed-service-accounts=test-account,extra-account"

  - it: should work correctly in pre-crd-upgrade-job
    set:
      helmHooksHandler.enabled: true
      global.serviceAccountName: "test-account"
      global.nmc.enabled: true
      global.nmc.remoteCluster.apiServer.url: "https://example.com"
      global.nmc.allowedServiceAccounts:
        - "extra-account"
    templates:
      - templates/hooks/pre-crd-upgrade-job.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - isKind:
          of: Job
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--nmc-allowed-service-accounts=test-account,extra-account"
