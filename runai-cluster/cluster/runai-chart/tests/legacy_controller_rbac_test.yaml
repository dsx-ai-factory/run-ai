suite: Test legacy controller RBAC lifecycle

tests:
  - it: should omit workload-controller RBAC on a fresh 3.0 install
    chart:
      appVersion: 3.0.0
    templates:
      - templates/clusterroles/base.yaml
    documentSelector:
      path: apiVersion
      value: rbac.authorization.k8s.io/v1
      matchMany: true
    asserts:
      - notEqual:
          path: metadata.name
          value: workload-controller-rw

  - it: should omit inference-workload-controller RBAC on a fresh 3.0 install
    chart:
      appVersion: 3.0.0
    templates:
      - templates/clusterroles/inference-workload-controller.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should omit job-controller RBAC on a fresh 3.0 install
    chart:
      appVersion: 3.0.0
    templates:
      - templates/clusterroles/base.yaml
    documentSelector:
      path: apiVersion
      value: rbac.authorization.k8s.io/v1
      matchMany: true
    asserts:
      - notEqual:
          path: metadata.name
          value: runai-job-controller-project

  - it: should omit legacy RBAC on install regardless of chart version
    chart:
      appVersion: 2.26.0
    templates:
      - templates/clusterroles/base.yaml
    documentSelector:
      path: apiVersion
      value: rbac.authorization.k8s.io/v1
      matchMany: true
    asserts:
      - notEqual:
          path: metadata.name
          value: workload-controller-rw

  - it: should retain legacy RBAC when an upgrade cannot read controller flags
    chart:
      appVersion: 3.0.0
    release:
      upgrade: true
    templates:
      - templates/clusterroles/base.yaml
    documentSelector:
      path: metadata.name
      value: workload-controller-rw
    asserts:
      - isKind:
          of: ClusterRole

  - it: should preserve surviving researcher RBAC on a fresh 3.0 install
    chart:
      appVersion: 3.0.0
    templates:
      - templates/clusterroles/base.yaml
    documentSelector:
      path: metadata.name
      value: researcher-service-rw
    asserts:
      - isKind:
          of: ClusterRole
