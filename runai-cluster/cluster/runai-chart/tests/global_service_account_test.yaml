suite: Test Global Service Account

excludeTemplates:
  - charts/kai-resource-management
  - charts/karta

tests:
  - it: should set `runai-operator` service account when global.serviceAccountName is empty
    set:
      global.serviceAccountName: ""
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.serviceAccountName
          value: runai-operator

  - it: should set service account on all deployments when global.serviceAccountName is specified
    set:
      global.serviceAccountName: "custom-sa"
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa

  - it: should set service account on all cronjobs when global.serviceAccountName is specified
    set:
      global.serviceAccountName: "custom-sa"
    documentSelector:
      path: kind
      value: CronJob
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: custom-sa
