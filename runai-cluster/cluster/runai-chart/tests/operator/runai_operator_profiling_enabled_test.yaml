suite: Test runai-operator enableProfiling flag

tests:
  - it: should render runai-operator Deployment without the profiling flag when disabled
    set:
      development.enableProfiling: false
    templates:
      - templates/deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: runai-operator
      - equal:
          path: spec.template.spec.containers[0].args
          value: null
  - it: should render runai-operator Deployment with the profiling flag when enabled
    set:
      development.enableProfiling: true
    templates:
      - templates/deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: runai-operator
      - contains:
          path: spec.template.spec.containers[0].args
          content: '--enable-profiler'
