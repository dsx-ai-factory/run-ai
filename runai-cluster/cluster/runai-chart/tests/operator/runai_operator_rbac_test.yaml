suite: Test runai-operator RBAC

templates:
  - templates/rbac.yaml

tests:
  - it: should let the operator create and bind the accessrule-controller Role
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.name
          value: runai-operator
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - roles
            verbs:
              - escalate
      - contains:
          path: rules
          content:
            apiGroups:
              - rbac.authorization.k8s.io
            resources:
              - roles
            resourceNames:
              - accessrule-controller
            verbs:
              - bind
