suite: Test runai-operator third-party images

templates:
  - templates/deployment.yaml

tests:
  - it: should pass chart images to the operator
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_GIT_SYNC_REGISTRY
            value: registry.k8s.io
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_GIT_SYNC_REPOSITORY
            value: git-sync/git-sync
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_GIT_SYNC_TAG
            value: v4.7.0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_OAUTH2_PROXY_REGISTRY
            value: quay.io
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_OAUTH2_PROXY_REPOSITORY
            value: oauth2-proxy/oauth2-proxy
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_OAUTH2_PROXY_TAG
            value: v7.15.4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_VALKEY_REGISTRY
            value: docker.io
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_VALKEY_REPOSITORY
            value: valkey/valkey
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_VALKEY_TAG
            value: 9.0.4
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_WAIT_UBI_MINIMAL_REGISTRY
            value: registry.access.redhat.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_WAIT_UBI_MINIMAL_REPOSITORY
            value: ubi9/ubi-minimal
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_WAIT_UBI_MINIMAL_TAG
            value: "9.8"

  - it: should pass overridden oauth2-proxy images to the operator
    set:
      thirdPartyImages.oauth2-proxy.registry: registry.example.com
      thirdPartyImages.oauth2-proxy.repository: mirror/oauth2-proxy
      thirdPartyImages.oauth2-proxy.tag: custom-tag
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_OAUTH2_PROXY_REGISTRY
            value: registry.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_OAUTH2_PROXY_REPOSITORY
            value: mirror/oauth2-proxy
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IMG_THIRD_PARTY_OAUTH2_PROXY_TAG
            value: custom-tag
