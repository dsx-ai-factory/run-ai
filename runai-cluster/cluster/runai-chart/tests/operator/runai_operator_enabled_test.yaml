suite: Test runai-operator enabled flag

tests:
  - it: should render runai-operator Deployment by default
    templates:
      - templates/deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: runai-operator
  - it: should render runai-operator Deployment when enabled is true
    set:
      runai-operator.enabled: true
    templates:
      - templates/deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: runai-operator
  - it: should render runai-operator Service when enabled is true
    set:
      runai-operator.enabled: true
    templates:
      - templates/deployment.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: runai-operator
  - it: should not render runai-operator Deployment or Service when enabled is false
    set:
      runai-operator.enabled: false
    templates:
      - templates/deployment.yaml
    asserts:
      - notExists: {}
