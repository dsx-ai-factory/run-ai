suite: Test Registry Secret Ownership Migration

templates:
  - templates/runai-reg-creds-migration.yaml

tests:
  - it: preserves a registry Secret owned by the current release
    release:
      name: runai-cluster
      namespace: runai
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: runai-reg-creds
            namespace: runai
            labels:
              app.kubernetes.io/managed-by: Helm
            annotations:
              meta.helm.sh/release-name: runai-cluster
              meta.helm.sh/release-namespace: runai
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: eyJhdXRocyI6e319
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: runai-reg-creds
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6e319

  - it: ignores an externally managed registry Secret
    release:
      name: runai-cluster
      namespace: runai
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: runai-reg-creds
            namespace: runai
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: eyJhdXRocyI6e319
    asserts:
      - notExists: {}

  - it: renders nothing when the registry Secret does not exist
    release:
      name: runai-cluster
      namespace: runai
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects: []
    asserts:
      - notExists: {}

  - it: ignores an owned Secret without docker configuration data
    release:
      name: runai-cluster
      namespace: runai
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: runai-reg-creds
            namespace: runai
            labels:
              app.kubernetes.io/managed-by: Helm
            annotations:
              meta.helm.sh/release-name: runai-cluster
              meta.helm.sh/release-namespace: runai
          type: kubernetes.io/dockerconfigjson
          data: {}
    asserts:
      - notExists: {}
