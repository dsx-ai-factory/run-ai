apiVersion: v2
name: runai-cluster
description: "Run:ai Cluster Installation"
version: 0.0.0-dev
appVersion: CHART_APP_VERSION
kubeVersion: '>=1.30.0-0'
dependencies:
  - name: kai-resource-management
    condition: kai-resource-management.enabled
    repository: oci://ghcr.io/kai-scheduler/kai-resource-management
    version: "~0.18.0"
  - name: karta
    condition: karta.enabled
    repository: oci://ghcr.io/dsx-ai-factory/workload-map
    version: 0.2.6
  - name: crds
    condition: development.includeCRDsInReleaseManifest
    repository: file://charts/crds
    version: 0.0.0
