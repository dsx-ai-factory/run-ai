apiVersion: v2
name: runai-cluster
description: "Run:ai Cluster Installation"
version: 0.0.0-dev
appVersion: CHART_APP_VERSION
kubeVersion: '>=1.30.0-0'
dependencies:
  - name: kai-scheduler
    condition: kai-scheduler.enabled
    repository: oci://ghcr.io/kai-scheduler/kai-scheduler
    version: v0.16.9
  - name: karta
    condition: karta.enabled
    # Dev test build, not for merge: points at a personal test artifact to
    # validate karta reading global.fipsMode (run-ai/karta#360) before it
    # ships as a real karta release. Revert to oci://ghcr.io/run-ai/karta
    # before merging.
    repository: oci://ghcr.io/nshidlansik/karta
    version: 0.0.0-v02globalfips-63d37d9
  - name: crds
    condition: development.includeCRDsInReleaseManifest
    repository: file://charts/crds
    version: 0.0.0
