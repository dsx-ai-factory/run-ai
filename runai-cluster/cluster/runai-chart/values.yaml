global:
  # Quote it: a bare `on` is a YAML bool, which KAI rejects. Being global it
  # reaches KRM and the bundled kai-scheduler on its own.
  fipsMode: "off"
  customCA:
    enabled: false
    secret:
      name: runai-ca-cert
      key: runai-ca.pem
      optional: true
  additionalImagePullSecrets: []
  image: {}
  #registry:
  affinity: {}
  tolerations: []
  additionalJobLabels: {}
  additionalJobAnnotations: {}
  # Metrics configuration
  metrics:
    # Enable or disable remote writing of infrastructure metrics
    # Infrastructure metrics include cluster resource usage, node metrics, and system-level monitoring data
    disableInfrastructureMetricsRemoteWrite: false
  # !!! INTERNAL USE ONLY !!!
  # Changing this value may cause undefined behavior.
  # If set, used by all helm-managed components.
  serviceAccountName: ""
  confidentialComputing:
    enabled: false
# Cluster configuration applied to RunaiConfig using JSON Merge Patch (RFC 7396).
# Allows overriding specific fields without replacing the entire configuration.
# Null values will delete the corresponding field.
# 
# Example:
# global:
#   runtime: containerd
clusterConfig: {}
thirdPartyImages:
  git-sync:
    registry: registry.k8s.io
    repository: git-sync/git-sync
    tag: v4.7.0
  oauth2-proxy:
    registry: quay.io
    repository: oauth2-proxy/oauth2-proxy
    tag: v7.15.4
  valkey:
    registry: docker.io
    repository: valkey/valkey
    tag: 9.0.4
  wait-ubi-minimal:
    registry: registry.access.redhat.com
    repository: ubi9/ubi-minimal
    tag: "9.8"
crdUpgrader:
  enabled: true
  establishedTimeout: 5m
  image:
    registry: nvcr.io/nvidia/runai
    name: runai-crd-upgrader
    tag: 0.0.0-dev
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 100m
      memory: 512Mi
ccPrecheck:
  nodeSelector: ""
  parallelism: 20
  requirements:
    - cc
  anyOf:
    - gpu-cc
    - gpu-ppcie
  gpuModels: []
  cache:
    enabled: true
    hostPath: /var/lib/krab/preflight
  probeImage:
    registry: ghcr.io/fidencio
    name: krab-preflight
    tag: 0.2.2
    pullPolicy: IfNotPresent
  collectorImage:
    registry: ghcr.io/fidencio
    name: krab-collector
    tag: 0.2.2
    pullPolicy: IfNotPresent
  dispatcherImage:
    registry: ghcr.io/kata-containers
    name: k8s-job-dispatcher
    tag: 0.4.0
    pullPolicy: IfNotPresent

helmHooksHandler:
  enabled: true
  image:
    registry: nvcr.io/nvidia/runai
    name: helm-hooks-handler
    tag: 0.0.0-dev
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
      ephemeral-storage: 1Gi
    limits:
      cpu: 100m
      memory: 512Mi
      ephemeral-storage: 2Gi
openShift:
  # Mode controls OpenShift-specific resource rendering:
  #   AutoDetect (default): Automatically detects OpenShift via CRD lookup (only works with 'helm install', not ArgoCD)
  #   Enabled: Force enable OpenShift resources (required for ArgoCD deployments on OpenShift)
  #   Disabled: Force disable OpenShift resources (for non-OpenShift clusters)
  mode: AutoDetect
  securityContextConstraints:
    create: true
runai-operator:
  image:
    name: go-operator
    registry: nvcr.io/nvidia/runai
    # Overrides the image tag during creation
    tag: 0.0.0-dev
    pullPolicy: Always
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  replicas: 1
  enabled: true
  config: {}
  networkPolicy:
    ## @param runai-operator.networkPolicy.enabled Specifies whether a NetworkPolicy should be created
    ##
    enabled: true
  metrics:
    serviceMonitor:
      enabled: false
trainingOperatorImageTags:
  v1-d6eb98e: 1.9.3
  v1-3f15cb8: 1.9.2
  v1-5c0e763: 1.9.1
  v1-5170a36: 1.9.0
  v1-04f9f13: 1.8.1
  v1-9e52eb7: 1.8.0
  v1-855e096: 1.7.0
# Run:AI Control Plane configuration.
controlPlane:
  # URL of the Run:AI control plane (e.g. tenant-name.run.ai).
  url: ""
  # Client ID used to authenticate with the control plane.
  clientID: "runai-internal.installer"
  # Client Secret used to authenticate with the control plane.
  # Ignored if existingSecret is set.
  clientSecret: ""
  # Bootstrap token used to authenticate with the control plane.
  # Takes precedence over clientSecret when both are set.
  # Ignored if existingSecret is set.
  bootstrapToken: ""
  # Name of an existing secret to use for the client secret
  existingSecret: ""
  # Key names in the existingSecret (only used if existingSecret is set)
  secretKeys:
    clientSecret: client-secret
cluster:
  uid: ""
  rbac:
    escalate: true
operands:
  trainingOperator:
    enabled: true
  rbac:
    base:
      create: true
    researcherService:
      create: true
    clusterAPI:
      create: true
    prometheus:
      create: true
userAuth:
  rbac:
    # Create RBAC entities for Run:AI user kubectl access
    create: true
# Development flags, only used for development reasons, should not be used in production
development:
  # Install a cluster without control-plane communication
  headless: false
  # Include CRDs in the release manifest
  includeCRDsInReleaseManifest: false
  # Skip dependency checks
  skipDependeciesChecks: false
  # Enable profiling in the runai-operator
  enableProfiling: false
kai-resource-management:
  enabled: true
  # Helm resolves subchart values before templates render, so this cannot be
  # derived from openShift.mode. KRM autodetects the platform by looking up the
  # clusterversions CRD, which covers an ordinary install; set this to true
  # alongside openShift.mode=Enabled when that autodetect is being overridden.
  openshift: false
  # go-operator owns the KRMConfig singleton, so neither of the chart's own
  # managers may create it. Both off is KRM's "external" mode.
  krmConfigDeployer:
    enabled: false
  krmConfig:
    render: false
  commonArgs:
    namespaceProjectLabelKey: runai/queue
  nodePoolController:
    # Node pool validation is covered by the control-plane and agent reconcile.
    webhook:
      nodepool: false
  projectController:
    webhook:
      project: false
      department: false
  podGroupAssigner:
    # Pod mutation is done by runai's admission-controller.
    webhook:
      pod: false
  # The agent syncs node pools from the control plane, including the default one,
  # so KRM must not create its own: the two write different specs for the same
  # object, and KRM's carries a resource-policy that survives uninstall.
  defaultNodePool:
    enabled: false
  kai-scheduler:
    gpu-fractioning:
      metricsAgent:
        metricNames:
          gpuSmUtilizationPercent: runai_pod_gpu_utilization
          gpuMemoryUsedBytes: runai_pod_gpu_memory_used_bytes
    global:
      # RunAI owns node-scale enablement and its scaling namespace. Keep KAI's
      # chart-level autoscaling switch off so it does not imply enablement.
      clusterAutoscaling: false
      # Keep resource reservation aligned with the chart-owned service account,
      # RBAC, and pull-secret propagation.
      resourceReservation:
        namespace: runai-reservation
        serviceAccount: runai-reservation
      nvFractions:
        set: true
    operator:
      resources:
        limits:
          cpu: 100m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 256Mi
    defaultQueue:
      createDefaultQueue: false
    defaultShard:
      enabled: false
    defaultPriorityClasses:
      enabled: false
    # go-operator owns the KAIConfig singleton too, so neither of KAI's own
    # managers may create it. Both off is KAI's "external" mode.
    kaiConfigDeployer:
      enabled: false
    kaiConfig:
      render: false
    nodescaleadjuster:
      scalingPodNamespace: runai-scale-adjust
karta:
  enabled: true
  operator:
    enabled: true
  # The operator pins runAsUser 65532 upstream. Do not try to unset it from here:
  # Helm discards null values when coalescing a parent chart's values.yaml into a
  # subchart, so the subchart default always wins (RUN-41722). On OpenShift the UID
  # is allowed by the runai-karta-operator SCC in templates/ocp/scc.yaml.
# Karta migration job: runs as Helm pre/post-upgrade hooks to copy
# legacy ResourceInterface CRs into Karta CRs and (post-upgrade) clean up RIs.
# Skipped on fresh installs (RI CRD not present).
kartaMigrate:
  enabled: true
  removeRid: false
  activeDeadlineSeconds: 600
  # Pod retries on failure (default 3 = 4 total attempts: initial + 3 retries,
  # with exponential backoff between them: 10s, 20s, 40s, ...). The migration is
  # idempotent on rerun - already-converged Kartas are skipped, stale ones are
  # reconciled.
  backoffLimit: 3
  image:
    registry: nvcr.io/nvidia/runai
    name: karta-migrate
    tag: 0.0.0-dev
    pullPolicy: Always
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
# Engine -> KAI scheduler migration. When enabled, the pre-crd-upgrade
# hook tears down leftover engine SchedulingShards (and their schedulers) before
# the upgrade brings up the KAI scheduler, so the two never run at once. Set to
# true only by the cutover release; the hook self-gates on engine SchedulingShards
# still existing, so it runs once and no-ops thereafter.
engineToKaiMigration:
  enabled: true

# Gates the pre-resource-management-upgrade hook, which migrates legacy departments
# (scheduling.run.ai/v2alpha2) to kai departments (kai.resources/v1alpha1). Set
# true only by the release performing the resource-management migration; the
# hook self-gates on the legacy department CRD still being installed, so it runs
# once and no-ops thereafter. Not a customer-facing toggle.
resourceManagementMigration:
  enabled: true
  cleanup: true
  # nodepoolsEnabled / nodepoolsCleanup gate the legacy nodepool migration
  # independently of the department/project migration above, so it can be rolled out
  # on its own. Self-gating: no-op when the legacy nodepool CRD is absent.
  nodepoolsEnabled: true
  nodepoolsCleanup: true
