{{- if and (not .Values.global.serviceAccountName) .Values.helmHooksHandler.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runai-pre-install
  namespace: runai
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    run.ai/hook: pre-install
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-pre-install
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    run.ai/hook: pre-install
rules:
  - apiGroups:
      - ''
    resources:
      - namespaces
    verbs:
      - get
      - patch
  - apiGroups:
      - 'operator.openshift.io'
    resources:
      - ingresscontrollers
    verbs:
      - get
      - patch
  - apiGroups:
    - management.cattle.io
    resources:
    - projects
    verbs:
    - updatepsa
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
    resourceNames:
      - runai-research-manager
    verbs:
      - get
      - list
      - delete
  - apiGroups:
      - config.openshift.io
    resources:
      - clusterversions
    verbs:
      - get
    resourceNames:
      - version
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: runai-pre-install
  namespace: runai
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    run.ai/hook: pre-install
subjects:
  - kind: ServiceAccount
    name: runai-pre-install
    namespace: runai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-pre-install
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runai-pre-install
  namespace: runai
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    run.ai/hook: pre-install
rules:
  - apiGroups:
      - ''
    resources:
      - configmaps
      - secrets
    verbs:
      - get
      - delete
      - update
      - create
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: runai-pre-install
  namespace: runai
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    run.ai/hook: pre-install
subjects:
  - kind: ServiceAccount
    name: runai-pre-install
    namespace: runai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runai-pre-install
{{- end }}
