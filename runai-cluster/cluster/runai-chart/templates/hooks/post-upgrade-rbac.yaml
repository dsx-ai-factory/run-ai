{{- if and (not .Values.global.serviceAccountName) .Values.helmHooksHandler.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runai-post-upgrade
  namespace: runai
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    run.ai/hook: post-upgrade
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runai-post-upgrade
  namespace: runai
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    run.ai/hook: post-upgrade
rules:
  - apiGroups:
      - run.ai
    resources:
      - runaiconfigs
    verbs:
      - get
      - create
      - update
      - delete
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - update
      - get
      - delete
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - update
      - list
      - patch
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: runai-post-upgrade
  namespace: runai
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    run.ai/hook: post-upgrade
subjects:
  - kind: ServiceAccount
    name: runai-post-upgrade
    namespace: runai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runai-post-upgrade
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-post-upgrade
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    run.ai/hook: post-upgrade
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
  - apiGroups:
      - scheduling.run.ai
    resources:
      - departments
    verbs:
      - list
      - patch
      - delete
  - apiGroups:
      - run.ai
    resources:
      - projects
      - nodepools
    verbs:
      - list
      - patch
      - delete
  - apiGroups:
      - run.ai
    resources:
      - managednodesconfigs
    verbs:
      - get
      - delete
  - apiGroups:
      - kai.resources
    resources:
      - departments
      - projects
      - nodepools
      - managednodesconfigs
    verbs:
      - get
  - apiGroups:
      - run.ai
    resources:
      - remoteconfigs
      - remoteconfigsyncs
      - clusters
    verbs:
      - get
      - create
      - update
      - delete
  - apiGroups:
      - scheduling.run.ai
    resources:
      - queues
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - engine.run.ai
    resources:
      - configs
    verbs:
      - get
      - delete
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
    verbs:
      - get
      - delete
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: runai-post-upgrade
  namespace: runai
  annotations:
    "helm.sh/hook": post-upgrade
