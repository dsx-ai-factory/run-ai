{{- if .Values.helmHooksHandler.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: runai-hooks-secret
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
data:
{{- if not .Values.controlPlane.existingSecret }}
  client-secret: {{ .Values.controlPlane.clientSecret | b64enc | quote }}
{{- end }}
{{- end }}
