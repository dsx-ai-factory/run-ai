# consider moving this secret to be managed by the operator
{{- if and (index .Values "runai-operator" "config" "grafanaLab") (eq (include "isOpenShift" .) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: runai-grafana-secret
  namespace: openshift-monitoring
type: Opaque
data:
  grafanaLabUsername: {{ index .Values "runai-operator" "config" "grafanaLab" "username" | toString | b64enc }}
  grafanaLabPassword: {{ index .Values "runai-operator" "config" "grafanaLab" "password" | toString | b64enc }}
{{- end }}
