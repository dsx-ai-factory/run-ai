{{- if .Values.operands.rbac.base.create }}
# Run:AI NodePool Controller
# KRM grants the controller everything else it needs. This one rule stays because
# KRM deliberately grants no access for the CR named by --uninstall-detection-ref,
# treating that as the installer's job: without it the uninstall check silently
# does nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-nodepool-controller
rules:
  - apiGroups:
      - run.ai
    resources:
      - clusters
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-nodepool-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-nodepool-controller
subjects:
  - kind: ServiceAccount
    name: nodepool-controller
    namespace: runai
{{- end }}
