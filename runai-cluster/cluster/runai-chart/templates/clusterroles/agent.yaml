{{- if .Values.operands.rbac.base.create }}
# Run:AI Agent
# Connects between the Run:AI GPU cluster and the Run:AI Backend. Creates Project CRDs
# This ClusterRole has no associated ClusterRoleBinding (only RoleBinding at the project level)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-agent-project
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - replicasets
      - daemonsets
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - kubeflow.org
    resources:
      - mpijobs
      - pytorchjobs
      - tfjobs
      - xgboostjobs
      - jaxjobs
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - machinelearning.seldon.io
    resources:
      - seldondeployments
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - serving.knative.dev
    resources:
      - services
      - revisions
      - configurations
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ray.io
    resources:
      - rayclusters
      - rayjobs
      - rayservices
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
      - taskruns
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - kubevirt.io
    resources:
      - virtualmachines
      - virtualmachineinstances
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - amlarc.azureml.com
    resources:
      - amljobs
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - workspace.devfile.io
    resources:
      - devworkspaces
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - leaderworkerset.x-k8s.io
    resources:
      - leaderworkersets
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - apps.nvidia.com
    resources:
      - nimcaches
      - nimservices
    verbs:
      - create
      - update
      - patch
      - get
      - list
      - watch
      - delete
---
