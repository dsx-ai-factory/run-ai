
# Run:AI ApplicationController
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-application-controller
rules:
  - apiGroups:
      - run.ai
    resources:
      - applications
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - run.ai
    resources:
      - applications/status
    verbs:
      - get
      - update
      - patch
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
      - namespaces
      - services
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - run.ai
    resources:
      - externalworkloads
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - run.ai
    resources:
      - projects
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kai.resources
    resources:
      - projects
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - nvidia.com
    resources:
      - dynamographdeployments
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
      - ingresses
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - elasticsearch.k8s.elastic.co
    resources:
      - elasticsearches
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-application-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-application-controller
subjects:
  - kind: ServiceAccount
    name: application-controller
    namespace: runai
