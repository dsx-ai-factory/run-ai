{{- if .Values.operands.rbac.base.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-project-controller-resources-patcher
rules:
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - secrets
      - configmaps
      - serviceaccounts
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-project-controller-resources-patcher
  namespace: runai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-project-controller-resources-patcher
subjects:
  - kind: ServiceAccount
    name: runai-project-controller
    namespace: runai
{{- end }}
