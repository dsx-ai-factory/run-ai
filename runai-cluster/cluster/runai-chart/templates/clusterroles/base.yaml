## Creation of custom certificates
## Relevant for regular Kubernetes. Not relevant for Openshift installations.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: runai-init-ca
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - update
      - patch
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs:
      - get
      - watch
      - list
      - create
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs:
      - update
      - patch
      - delete
    # Keep legacy webhook names so init-ca can remove them during upgrades.
    resourceNames: ["assets-sync", "application-validation", "runai-assets-sync-validation", "runai-secret-pvc-validation", "runai-pod", "runai-pod-controller-mutation", "runai-interactive-workload-mutation", "runai-training-workload-mutation", "runai-distributed-workload-mutation", "runai-inference-workload-mutation", "runai-inference-workload-mutation-old", "runai-distributed-inference-workload-mutation", "runai-pod-group-mutation", "runai-workload-ownership-mutation", "inference-workload-ownership-mutation", "runai-anyworkload-mutation", "runai-pod-controller-validation", "runai-interactive-policy-validation", "runai-interactive-workload-validation", "runai-training-policy-validation", "runai-training-workload-validation", "runai-distributed-policy-validation", "runai-distributed-workload-validation", "runai-inference-policy-validation-old", "runai-inference-policy-validation", "runai-inference-workload-validation-old", "runai-inference-workload-validation", "runai-distributed-inference-workload-validation", "runai-accessrule-validation", "runai-workload-ownership-protection-validation","runai-inference-workload-ownership-mutation", "runai-inference-workload-ownership-protection-validation", "runai-queue-validation", "runai-queue-validation-v2", "runai-queue-validation-v2alpha1", "runai-queue-validation-v2alpha2", "runai-project-validation", "runai-anyworkload-validation", "runai-restartrequest-validation", "runai-advice-restart-dw-mutation"]

  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["anyworkload-controller"]
    verbs: ["get"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["get", "watch", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/approval", "certificatesigningrequests/status"]
    verbs: ["update"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames: ["kubernetes.io/legacy-unknown", "kubernetes.io/kubelet-serving"]
    verbs: ["approve"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-init-ca
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: runai-init-ca
subjects:
  - kind: ServiceAccount
    namespace: runai
    name: init-ca
---

