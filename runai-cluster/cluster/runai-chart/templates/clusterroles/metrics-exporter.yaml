{{- if .Values.operands.rbac.base.create }}
# Run:AI Metrics Exporter
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-exporter
rules:
  - apiGroups:
      - scheduling.run.ai
    resources:
      - queues
    verbs:
      - list
      - get
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
      - events
    verbs:
      - list
      - get
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - list
      - get
      - watch
  - apiGroups:
      - scheduling.run.ai
    resources:
      - podgroups
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - scheduling.k8s.io
    resources:
      - priorityclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
      - get
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-exporter
subjects:
  - kind: ServiceAccount
    name: metrics-exporter
    namespace: runai
{{- end }}
