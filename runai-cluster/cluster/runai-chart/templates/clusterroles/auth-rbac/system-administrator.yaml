{{- if .Values.userAuth.rbac.create }}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: runai-system-administrator
rules:
  - apiGroups:
      - run.ai
      - scheduling.run.ai
    resources:
      - projects
      - nodepools
      - accessrules
      - departments
      - datavolumes
    verbs:
      - get
      - list
  # kai.resources twin of the nodepools grant above. Granted unconditionally so the
  # role keeps read access across the resource-management migration, whichever CRD
  # the node pools currently live on.
  # TODO: fold into the rule above once the legacy run.ai NodePool CRD is removed
  - apiGroups:
      - kai.resources
    resources:
      - nodepools
      - projects
      - departments
    verbs:
      - get
      - list
  - apiGroups: {{ include "$extraJobsDeploymentsReadClusteredApiGroups" . | nindent 4 }}
    resources: {{ include "$extraJobsDeploymentsReadClusteredResources" . | nindent 4 }}
    verbs: {{ include "$readVerbs" . | nindent 4 }}
  - apiGroups: [""]
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: runai-system-administrator-ns-internal
  labels:
    run.ai/aggregate-to-system-admin-ns: "true"
rules:
  - apiGroups: {{ include "$jobsPodsApiGroups" . | nindent 4 }}
    resources: {{ include "$jobsPodsResources" . | nindent 4 }}
    verbs: {{ include "$CRUDVerbs" . | nindent 4 }}
  - apiGroups: {{ include "$runaiApiGroups" . | nindent 4 }}
    resources: {{ include "$runaijobsPodgroupsResources" . | nindent 4 }}
    verbs: {{ include "$CRUDVerbs" . | nindent 4 }}
  - apiGroups: {{ include "$extraJobsDeploymentsReadNamespacedApiGroups" . | nindent 4 }}
    resources: {{ include "$extraJobsDeploymentsReadNamespacedResources" . | nindent 4 }}
    verbs: {{ include "$readVerbs" . | nindent 4 }}
  - apiGroups: {{ include "$extraJobsDeploymentsWatchNamespacedApiGroups" . | nindent 4 }}
    resources: {{ include "$extraJobsDeploymentsWatchNamespacedResources" . | nindent 4 }}
    verbs:
      - watch
  - apiGroups: {{ include "$extraJobsDeploymentsCRUDNamespacedApiGroups" . | nindent 4 }}
    resources: {{ include "$extraJobsDeploymentsCRUDNamespacedResources" . | nindent 4 }}
    verbs: {{ include "$CRUDVerbs" . | nindent 4 }}
  - apiGroups: {{ include "$dataSourcesApiGroups" . | nindent 4 }}
    resources: {{ include "$dataSourcesResources" . | nindent 4 }}
    verbs: {{ include "$CRUDVerbs" . | nindent 4 }}
  - apiGroups: {{ include "$policiesAndTemplatesApiGroups" . | nindent 4 }}
    resources: {{ include "$policiesAndTemplatesResources" . | nindent 4 }}
    verbs: {{ include "$CRUDVerbs" . | nindent 4 }}
  - apiGroups: {{ include "$credentialsApiGroups" . | nindent 4 }}
    resources: {{ include "$credentialsResources" . | nindent 4 }}
    verbs: {{ include "$CRUDVerbs" . | nindent 4 }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: runai-system-administrator-ns
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        run.ai/aggregate-to-system-admin-ns: "true"
    - matchLabels:
        run.ai/additional-workload-gvks-crud: "true"
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: runai-system-administrator-runai
rules:
  - apiGroups: {{ include "$runaiCliIndexMapEditorApiGroups" . | nindent 4 }}
    resources: {{ include "$runaiCliIndexMapEditorResources" . | nindent 4 }}
    resourceNames: {{ include "$runaiCliIndexMapEditorResourceNames" . | nindent 4 }}
    verbs: {{ include "$runaiCliIndexMapEditorVerbs" . | nindent 4 }}
  - apiGroups: {{ include "$policiesAndTemplatesApiGroups" . | nindent 4 }}
    resources: {{ include "$policiesAndTemplatesResources" . | nindent 4 }}
    verbs: {{ include "$readVerbs" . | nindent 4 }}
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "list", "get" ]
  - apiGroups: [ "" ]
    resources: [ "pods/log" ]
    verbs: [ "get" ]
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: runai-system-administrator-runai-cs
rules:
  - apiGroups: {{ include "$dataSourcesApiGroups" . | nindent 4 }}
    resources: {{ include "$dataSourcesResources" . | nindent 4 }}
    verbs: {{ include "$CRUDVerbs" . | nindent 4 }}
  - apiGroups: {{ include "$policiesAndTemplatesApiGroups" . | nindent 4 }}
    resources: {{ include "$policiesAndTemplatesResources" . | nindent 4 }}
    verbs: {{ include "$CRUDVerbs" . | nindent 4 }}
  - apiGroups: {{ include "$credentialsApiGroups" . | nindent 4 }}
    resources: {{ include "$credentialsResources" . | nindent 4 }}
    verbs: {{ include "$CRUDVerbs" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-system-administrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-system-administrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-system-administrator-runai
  namespace: runai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-system-administrator-runai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-system-administrator-runai-cs
  namespace: runai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-system-administrator-runai-cs

---
# =========================================
# Namespace-level permissions for runai-cli
# =========================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-system-administrator-logs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
# Runai-backend
{{- if (lookup "v1" "Namespace" "" "runai-backend") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-system-administrator-logs
  namespace: runai-backend
roleRef:
  kind: ClusterRole
  name: runai-system-administrator-logs
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
# Runai-reservation
{{- if (lookup "v1" "Namespace" "" "runai-reservation") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-system-administrator-logs
  namespace: runai-reservation
roleRef:
  kind: ClusterRole
  name: runai-system-administrator-logs
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
# Training-operator
{{- if (lookup "v1" "Namespace" "" "training-operator") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-system-administrator-logs
  namespace: training-operator
roleRef:
  kind: ClusterRole
  name: runai-system-administrator-logs
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
# Knative
{{- if (lookup "v1" "Namespace" "" "knative") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-system-administrator-logs
  namespace: knative
roleRef:
  kind: ClusterRole
  name: runai-system-administrator-logs
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
# Gpu-operator
{{- if (lookup "v1" "Namespace" "" "gpu-operator") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-system-administrator-logs
  namespace: gpu-operator
roleRef:
  kind: ClusterRole
  name: runai-system-administrator-logs
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
# Nim-operator
{{- if (lookup "v1" "Namespace" "" "nim-operator") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-system-administrator-logs
  namespace: nim-operator
roleRef:
  kind: ClusterRole
  name: runai-system-administrator-logs
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
{{- end }}