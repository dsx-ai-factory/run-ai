apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runai-anyworkload-controller-serviceaccounts
  namespace: runai
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    resourceNames:
      - runai-agent
      - runtime-rules
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-anyworkload-controller-serviceaccounts
  namespace: runai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runai-anyworkload-controller-serviceaccounts
subjects:
  - kind: ServiceAccount
    name: anyworkload-controller
    namespace: runai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-anyworkload-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-anyworkload-controller
subjects:
  - kind: ServiceAccount
    name: anyworkload-controller
    namespace: runai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-anyworkload-controller-additional-workload-gvks-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-additional-workload-gvks-read
subjects:
  - kind: ServiceAccount
    name: anyworkload-controller
    namespace: runai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-anyworkload-controller-additional-workload-gvks-crud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-additional-workload-gvks-crud
subjects:
  - kind: ServiceAccount
    name: anyworkload-controller
    namespace: runai
