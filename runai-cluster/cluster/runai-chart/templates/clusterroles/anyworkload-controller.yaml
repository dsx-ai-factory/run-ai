apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-anyworkload-controller-project
rules:
  - apiGroups: [inference.platform.run.ai]
    resources: [inferenceendpoints]
    verbs: [get, create, update, patch, delete]
  - apiGroups:
      - run.ai
    resources:
      - workloadrunners
      - workloadrunners/status
      - workloadrunners/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - resource.nvidia.com
    resources:
      - computedomains
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
      - update
  # The project controller binds this ClusterRole with a RoleBinding in each
  # managed project namespace. Keep destructive networking permissions here
  # rather than on the cluster-wide controller binding.
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - delete
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - delete
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - delete
---
