{{- if (index .Values "kai-resource-management" "enabled") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kai-operator-runai-webhooks
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    resourceNames:
      - mutating-engine-admission
      - validating-engine-admission
      - runai-queue-validation-v2
      - runai-podgroup-validation-v2alpha2
    verbs: [delete, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kai-operator-runai-webhooks
subjects:
  - kind: ServiceAccount
    name: kai-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kai-operator-runai-webhooks
{{- end }}
