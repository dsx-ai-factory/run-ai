{{- if .Values.operands.rbac.base.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-project-controller-rolebinding-creation
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    verbs:
      - bind
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-project-controller-rolebinding-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-project-controller-rolebinding-creation
subjects:
  - kind: ServiceAccount
    name: runai-project-controller
    namespace: runai
---
# Do not remove the following RoleBinding! It is needed for a feature.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-project-controller-rolebinding-creation
  namespace: runai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-project-controller-rolebinding-creation
subjects:
  - kind: ServiceAccount
    name: runai-project-controller
    namespace: runai
{{- end }}
