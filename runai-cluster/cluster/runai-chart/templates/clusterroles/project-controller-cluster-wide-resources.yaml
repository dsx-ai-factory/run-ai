{{- if .Values.operands.rbac.base.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-project-controller-cluster-secret
rules:
  - apiGroups:
      - run.ai
    resources:
      - projects
      - projects/finalizers
    verbs:
      - '*'
  - apiGroups:
      - scheduling.run.ai
      - scheduling.incubator.k8s.io
    resources:
      - queues
    verbs:
      - '*'
  - apiGroups:
      - ""
    resources:
      - secrets
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-project-controller-cluster-secret
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-project-controller-cluster-secret
subjects:
  - kind: ServiceAccount
    name: runai-project-controller
    namespace: runai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-project-controller-cluster-secret-per-project
rules:
  - apiGroups:
      - ""
    resourceNames:
      - default
    resources:
      - serviceaccounts
    verbs:
      - update
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
      - secrets/finalizers
    verbs:
      - update
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-project-controller-cluster-configmap-per-project
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - configmaps/finalizers
    verbs:
      - update
      - create
      - delete
      - list
      - watch
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-project-controller-cluster-pvc
rules:
  - apiGroups:
      - run.ai
    resources:
      - projects
      - projects/finalizers
    verbs:
      - '*'
  - apiGroups:
      - scheduling.run.ai
      - scheduling.incubator.k8s.io
    resources:
      - queues
    verbs:
      - '*'
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-project-controller-cluster-pvc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-project-controller-cluster-pvc
subjects:
  - kind: ServiceAccount
    name: runai-project-controller
    namespace: runai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-project-controller-cluster-pvc-per-project
rules:
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - persistentvolumeclaims/finalizers
    verbs:
      - update
      - create
      - delete
      - list
      - watch
      - patch
{{- end }}
