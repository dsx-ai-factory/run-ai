apiVersion: v1
kind: ServiceAccount
metadata:
  name: runai-crd-validator
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-crd-validator
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-crd-validator
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-crd-validator
subjects:
- kind: ServiceAccount
  name: runai-crd-validator
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Pod
metadata:
  name: validate-crds
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
spec:
  containers:
    - name: validator
      image: {{ include "crdUpgrader.image" . }}
      command: ["/bin/sh", "-c"]
      args: ["kubectl diff -f /crds || (echo 'CRD validation failed, please run `helm upgrade` to fix the CRDs' && exit 1)"]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
  serviceAccountName: runai-crd-validator
  restartPolicy: Never
