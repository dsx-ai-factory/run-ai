{{- if eq (include "isOpenShift" .) "true" }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: runai-pod-controller-mutation
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    app: runai
webhooks:
  - name: runai-admission-controller.runai.svc.cluster.local
    admissionReviewVersions: [ "v1" ]
    sideEffects: None
    namespaceSelector:
      matchExpressions:
        - key: runai/queue
          operator: Exists
    failurePolicy: Fail
    clientConfig:
      service:
        name: runai-admission-controller
        namespace: runai
        path: "/mutate-pod-controller"
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["statefulsets", "jobs", "deployments"]
        scope: "Namespaced"
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: runai-pod
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    app: runai
webhooks:
  - name: runai-admission-controller.runai.svc.cluster.local
    admissionReviewVersions: [ "v1" ]
    sideEffects: None
    namespaceSelector:
      matchExpressions:
        - key: runai/queue
          operator: Exists
    failurePolicy: Fail
    clientConfig:
      service:
        name: runai-admission-controller
        namespace: runai
