---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: runai-project-validation
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    app: runai
webhooks:
  - name: runai-project-controller.runai.svc
    admissionReviewVersions: [ "v1" ]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: runai-agent
        namespace: runai
        path: "/validate-project"
        port: 9443
    rules:
      - operations: ["CREATE", "UPDATE", "DELETE"]
        apiGroups: ["run.ai", "kai.resources"]
        apiVersions: ["*"]
        resources: ["projects"]
      - operations: ["CREATE", "UPDATE", "DELETE"]
        apiGroups: ["scheduling.run.ai", "kai.resources"]
        apiVersions: ["*"]
        resources: ["departments"]
---
