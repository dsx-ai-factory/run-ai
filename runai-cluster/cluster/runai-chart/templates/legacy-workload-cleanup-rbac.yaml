apiVersion: v1
kind: ServiceAccount
metadata:
  name: runai-legacy-workload-cleanup
  namespace: runai
  labels:
    app: runai-legacy-workload-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runai-legacy-workload-cleanup
  namespace: runai
  labels:
    app: runai-legacy-workload-cleanup
rules:
  - apiGroups: ["run.ai"]
    resources: ["runaiconfigs"]
    resourceNames: ["runai"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runai-legacy-workload-cleanup
  namespace: runai
  labels:
    app: runai-legacy-workload-cleanup
subjects:
  - kind: ServiceAccount
    name: runai-legacy-workload-cleanup
    namespace: runai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runai-legacy-workload-cleanup
