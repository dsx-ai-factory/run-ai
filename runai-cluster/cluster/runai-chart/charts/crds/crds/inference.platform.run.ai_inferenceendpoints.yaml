---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: inferenceendpoints.inference.platform.run.ai
spec:
  group: inference.platform.run.ai
  names:
    kind: InferenceEndpoint
    listKind: InferenceEndpointList
    plural: inferenceendpoints
    singular: inferenceendpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.routing.gatewayRef.name
      name: Gateway
      type: string
    - jsonPath: .spec.routing.hostnames
      name: Hostnames
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          InferenceEndpoint is the Schema for the inferenceendpoints API.
          One InferenceEndpoint produces one routing stack: an InferencePool selecting
          the workload pods, an endpoint picker deployment, and an HTTPRoute on an
          existing Gateway.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of InferenceEndpoint
            properties:
              epp:
                description: epp configures the endpoint picker.
                properties:
                  profile:
                    description: profile selects a versioned configuration, image,
                      startup flags and ports.
                    enum:
                    - gie-v1.5
                    type: string
                  scheduling:
                    description: scheduling tunes pod selection.
                    properties:
                      scorers:
                        description: scorers and their weights. Defaults to queue
                          30, kvCache 20, prefixCache 10.
                        items:
                          description: ScorerSpec is one scoring signal and how much
                            it counts.
                          properties:
                            type:
                              description: type of the scorer.
                              enum:
                              - queue
                              - kvCache
                              - prefixCache
                              type: string
                            weight:
                              description: |-
                                weight of this scorer relative to the others. 0 keeps the scorer loaded
                                but ignores its opinion.
                              format: int32
                              maximum: 100
                              minimum: 0
                              type: integer
                          required:
                          - type
                          - weight
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - type
                        x-kubernetes-list-type: map
                    type: object
                required:
                - profile
                type: object
              routing:
                description: routing describes the Gateway attachment.
                properties:
                  gatewayRef:
                    description: gatewayRef is the Gateway the generated HTTPRoute
                      attaches to.
                    properties:
                      name:
                        description: name of the Gateway.
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          namespace of the Gateway. Defaults to the namespace of the
                          InferenceEndpoint.
                        type: string
                    required:
                    - name
                    type: object
                  hostnames:
                    description: |-
                      hostnames the HTTPRoute matches. At least one is required so that two
                      endpoints on the same Gateway never collide on the shared path prefix.
                    items:
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  pathPrefix:
                    default: /v1
                    description: |-
                      pathPrefix is the request path whose requests go through the EPP.
                      Requests outside it do not match the route and return 404 at the
                      Gateway.
                    maxLength: 1024
                    pattern: ^/
                    type: string
                required:
                - gatewayRef
                - hostnames
                type: object
              workload:
                description: workload identifies the serving pods.
                properties:
                  port:
                    description: |-
                      port is the container port the pods listen on. The EPP returns
                      podIP:port to the Gateway.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  selector:
                    description: |-
                      selector picks the pods that serve this endpoint. It becomes the
                      InferencePool selector.
                    properties:
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: matchLabels must all be present on a pod for
                          it to be selected.
                        minProperties: 1
                        type: object
                    required:
                    - matchLabels
                    type: object
                required:
                - port
                - selector
                type: object
            required:
            - epp
            - routing
            - workload
            type: object
          status:
            description: status defines the observed state of InferenceEndpoint
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the InferenceEndpoint.
                  Types: Ready, RouteAccepted.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the spec generation the conditions
                  describe.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
