apiVersion: v1
kind: Service
metadata:
  name: my-service
  namespace: runai-test
  ownerReferences:
  - apiVersion: run.ai/v1alpha1
    kind: WorkloadRunner
    name: auth-disabled-workload
    uid: test-uid-12345
  resourceVersion: "1"
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: my-app
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8g
  name: my-ingress
  namespace: runai-test
  ownerReferences:
  - apiVersion: run.ai/v1alpha1
    kind: WorkloadRunner
    name: auth-disabled-workload
    uid: test-uid-12345
  resourceVersion: "1"
spec:
  ingressClassName: nginx
  rules:
  - host: my-app.example.com
    http:
      paths:
      - backend:
          service:
            name: my-service
            port:
              number: 8080
        path: /
        pathType: Prefix
status:
  loadBalancer: {}
