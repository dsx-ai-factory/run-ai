apiVersion: v1
kind: Service
metadata:
  labels:
    app: nim-workload-auth-proxy
    run.ai/workload-runner: nim-workload
  name: nim-workload-auth-proxy
  namespace: runai-test
  ownerReferences:
  - apiVersion: run.ai/v1alpha1
    kind: WorkloadRunner
    name: nim-workload
    uid: test-uid-12345
  resourceVersion: "1"
spec:
  ports:
  - name: http
    port: 80
    targetPort: 4180
  selector:
    app: nim-workload-auth-proxy
    run.ai/workload-runner: nim-workload
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nim-workload-auth-proxy
    run.ai/workload-runner: nim-workload
  name: nim-workload-auth-proxy
  namespace: runai-test
  ownerReferences:
  - apiVersion: run.ai/v1alpha1
    kind: WorkloadRunner
    name: nim-workload
    uid: test-uid-12345
  resourceVersion: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nim-workload-auth-proxy
      run.ai/workload-runner: nim-workload
  strategy: {}
  template:
    metadata:
      labels:
        app: nim-workload-auth-proxy
        run.ai/workload-runner: nim-workload
    spec:
      containers:
      - args:
        - --provider=keycloak-oidc
        - --upstream=http://nim-workload.runai-test.svc.cluster.local:8000
        - --redirect-url=https://nim.example.com/api/v1/team-a/nim-workload/oauth2/callback
        - --oidc-issuer-url=https://auth.example.com
        - --scope=openid
        - --http-address=0.0.0.0:4180
        - --proxy-prefix=/oauth2
        - --reverse-proxy=true
        - --skip-provider-button=true
        - --whitelist-domain=nim.example.com
        - --cookie-domain=nim.example.com
        - --cookie-httponly=true
        - --cookie-secure=true
        - --code-challenge-method=S256
        - --cookie-refresh=10m
        - --cookie-samesite=lax
        - --skip-jwt-bearer-tokens=true
        - --extra-jwt-issuers=https://auth.example.com=runai
        - --custom-templates-dir=/usr/share/oauth2-proxy
        - --pass-authorization-header=false
        - --cookie-name=nim-workload-auth-proxy
        - --email-domain=*
        env:
        - name: OAUTH2_PROXY_COOKIE_PATH
          value: /api/v1/team-a/nim-workload
        envFrom:
        - secretRef:
            name: oauth2-proxy-secret
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
        imagePullPolicy: IfNotPresent
        name: oauth2-proxy
        ports:
        - containerPort: 4180
          name: port-4180
          protocol: TCP
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /etc/runai/auth/users
          name: runai-auth
      volumes:
      - emptyDir: {}
        name: runai-auth
status: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8g
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  name: nim-workload
  namespace: runai-test
  ownerReferences:
  - apiVersion: run.ai/v1alpha1
    kind: WorkloadRunner
    name: nim-workload
    uid: test-uid-12345
  resourceVersion: "1"
spec:
  ingressClassName: nginx
  rules:
  - host: nim.example.com
    http:
      paths:
      - backend:
          service:
            name: nim-workload-auth-proxy
            port:
              number: 80
        path: /api/v1/team-a/nim-workload(/|$)(.*)
        pathType: ImplementationSpecific
status:
  loadBalancer: {}
