runner:
  name: nim-workload
  namespace: runai-test

networking:
  services:
  - ref:
      name: nim-workload
      port: 8000
    auth:
      authorizationType: authenticatedUsers
  externalAccess:
    ingress:
      metadata:
        name: nim-workload
        annotations:
          nginx.ingress.kubernetes.io/rewrite-target: /$2
      spec:
        rules:
          - host: nim.example.com
            http:
              paths:
                - path: /api/v1/team-a/nim-workload(/|$)(.*)
                  pathType: ImplementationSpecific
                  backend:
                    service:
                      name: nim-workload
                      port:
                        number: 8000
