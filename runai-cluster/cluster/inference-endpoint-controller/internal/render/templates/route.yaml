# Derived from test/testdata/golden/05-httproute.yaml. Type is upstream Gateway API, the instance is ours.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-route" .Name | toJSON }}
  namespace: {{ .Namespace | toJSON }}
spec:
  parentRefs:
  - name: {{ .GatewayName | toJSON }}          # admin's Gateway, referenced by name only
    namespace: {{ .GatewayNamespace | toJSON }}
  hostnames:
{{- range .Hostnames }}
  - {{ . | toJSON }}
{{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/"                    # every path, as the composed route it replaces
    backendRefs:
{{- if .AuthProxy }}
    - name: {{ .AuthProxy.ServiceName | toJSON }}   # protected: the auth proxy forwards to the EPP's Envoy
      port: {{ .AuthProxy.ServicePort }}
{{- else }}
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: {{ printf "%s-pool" .Name | toJSON }}
{{- end }}
    timeouts:
      request: 300s
