# InferenceEndpoint field reference, including its optional fields.
# This is a field reference, not a minimal configuration.
# Prerequisites: the namespace, Gateway, and matching model-serving Pods exist;
# the Pods serve on port 8000.
apiVersion: inference.platform.run.ai/v1alpha1
kind: InferenceEndpoint
metadata:
  name: llama3-all-fields
  namespace: model-serving
spec:
  workload: # Required. Selects existing Pods; does not create or modify them.
    selector:
      matchLabels: # Required, at least one label; all labels must match.
        app: vllm-llama3
    port: 8000 # Required, 1–65535. One serving port is currently supported.

  routing: # Required. Configures the generated HTTPRoute.
    gatewayRef:
      name: inference-agw # Required. References an existing Gateway.
      namespace: model-serving # Optional; defaults to this endpoint's namespace.
    hostnames: # Required, at least one hostname; entries must be unique.
    - llama3-all-fields.test
    - llama3-all-fields-alias.test
    pathPrefix: /v1 # Optional; default /v1. Requests under it go through the EPP; other paths return 404.

  epp: # Required.
    profile: gie-v1.5 # Required. Pins the GIE v1.5.0 image, configuration, ports and startup flags.
    scheduling: # Optional. Config changes replace EPP Pods (Recreate strategy).
      scorers: # Omitted/empty = defaults below; a nonempty list selects exactly these scorers.
      - type: queue # Required. Prefers Pods with fewer queued requests.
        weight: 30 # Required, 0–100. Relative influence, not a traffic percentage.
      - type: kvCache # Prefers Pods with more free KV cache.
        weight: 20
      - type: prefixCache # Prefers Pods already holding the prompt prefix.
        weight: 10
      # Each type may occur once. Weight 0 keeps a scorer loaded but ignores its score.

# Controller-written status: illustrative output only, not user configuration.
