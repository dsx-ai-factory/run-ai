# GIE v1.5 InferenceEndpoint field reference, including its optional fields.
# Experimental llm-d-v0.10 profile scheduling is in inference_v1alpha1_inferenceendpoint_profiles.yaml.
# This is a field reference, not a minimal configuration.
# Prerequisites: the namespace, Gateway, and matching model-serving Pods exist;
# the Pods serve both llama3 and llama3-v2 on port 8000.
apiVersion: inference.platform.run.ai/v1alpha1
kind: InferenceEndpoint
metadata:
  name: llama3-all-fields
  namespace: model-serving
spec:
  workload: # Required. Selects existing Pods; does not create or modify them.
    selector:
      matchLabels: # Required, at least one label; all labels must match.
        app: vllm-llama3
    port: 8000 # Required, 1–65535. One serving port is currently supported.

  routing: # Required. Configures the generated HTTPRoute.
    gatewayRef:
      name: inference-agw # Required. References an existing Gateway.
      namespace: model-serving # Optional; defaults to this endpoint's namespace.
    hostnames: # Required, at least one hostname; entries must be unique.
    - llama3-all-fields.test
    - llama3-all-fields-alias.test

  epp: # Required. At least one of profile or image must be present.
    profile: gie-v1.5 # Optional. Pins the GIE v1.5.0 contract; llm-d-v0.10 is experimental.
    # Optional with a profile; included here to show every field.
    # When both are set, image must exactly equal the profile's pinned image.
    # Without a profile, only this approved GIE v1.5.0 image is allowed.
    image: registry.k8s.io/gateway-api-inference-extension/epp:v1.5.0
    scheduling: # Optional. Config changes replace EPP Pods (Recreate strategy).
      scorers: # Omitted/empty = defaults below; a nonempty list selects exactly these scorers.
      - type: queue # Required. Prefers Pods with fewer queued requests.
        weight: 30 # Required, 0–100. Relative influence, not a traffic percentage.
      - type: kvCache # Prefers Pods with more free KV cache.
        weight: 20
      - type: prefixCache # Prefers Pods already holding the prompt prefix.
        weight: 10
      # Each type may occur once. Weight 0 keeps a scorer loaded but ignores its score.

  rewrites: # Optional. Changes apply live without restarting EPP Pods.
  - model: llama3 # Required; exact model name in the client's request body.
    targets: # Required, at least one target. Multiple targets form a weighted canary.
    - model: llama3 # Required; a model actually served by Pods in this pool.
      weight: 90 # Required, >=1. Relative share; weights need not sum to 100.
    - model: llama3-v2
      weight: 10
  - model: chat-alias # A second rule demonstrates a one-target alias.
    targets:
    - model: llama3
      weight: 1
  # Each source model may occur once. Removing all rules deletes the generated rewrite.

