---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: nodepools.kai.resources
spec:
  group: kai.resources
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    shortNames:
    - np
    singular: nodepool
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NodePool is the Schema for the nodepools.kai API.
          A NodePool is cluster-scoped and its default instance ("default") must always exist.
          The finalizer kai.finalizers.nodepool is managed by the controller.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NodePoolSpec defines the desired state of NodePool.
              labelKey and labelValue identify the pool's nodes and cannot change after
              creation, including by adding or dropping a field.
            properties:
              labelKey:
                description: LabelKey is the label key a node must have to be assigned
                  to this nodepool.
                type: string
              labelValue:
                description: LabelValue is the label value a node must have to be
                  assigned to this nodepool.
                type: string
              preferredNetworkTopologyName:
                description: PreferredNetworkTopologyName is the name of the NetworkTopology
                  attached to the nodepool.
                type: string
              schedulingShardConfig:
                description: |-
                  SchedulingShardConfig holds all per-shard scheduler settings for this NodePool.
                  Unset fields fall back to cluster SchedulerDefaults, then KAI SetDefaultsWhereNeeded.
                properties:
                  actions:
                    additionalProperties:
                      description: ActionConfig allows overriding action settings
                        in the scheduler configuration.
                      properties:
                        enabled:
                          description: Enabled controls whether this action is active.
                            Defaults to true.
                          type: boolean
                        priority:
                          description: |-
                            Priority controls the ordering of this action. Higher values run first.
                            Built-in actions use priorities in the range 0-10000, spaced by 100.
                          type: integer
                      type: object
                    description: Actions allows overriding action configuration. Keys
                      are action names.
                    type: object
                  args:
                    additionalProperties:
                      type: string
                    description: |-
                      Args are free-form CLI flags passed to the scheduler (e.g. verbosity, QPS, CSI flags).
                      Keys match the scheduler's flag names exactly.
                    type: object
                  minRuntime:
                    description: MinRuntime specifies the minimum guaranteed runtime
                      before a job can be preempted or reclaimed.
                    properties:
                      preemptMinRuntime:
                        description: PreemptMinRuntime specifies the minimum runtime
                          of a job in queue before it can be preempted
                        type: string
                      reclaimMinRuntime:
                        description: ReclaimMinRuntime specifies the minimum runtime
                          of a job in queue before it can be reclaimed
                        type: string
                    type: object
                  placementStrategy:
                    description: PlacementStrategy is the GPU/CPU bin-pack or spread
                      strategy for this shard.
                    properties:
                      cpu:
                        description: CPU scheduling strategy (binpack/spread)
                        type: string
                      gpu:
                        description: GPU scheduling strategy (binpack/spread)
                        type: string
                    type: object
                  plugins:
                    additionalProperties:
                      description: PluginConfig allows overriding plugin settings
                        in the scheduler configuration.
                      properties:
                        arguments:
                          additionalProperties:
                            type: string
                          description: |-
                            Arguments are key-value pairs passed to the plugin. When specified, they fully replace
                            the default arguments for the plugin.
                          type: object
                        enabled:
                          description: Enabled controls whether this plugin is active.
                            Defaults to true.
                          type: boolean
                        priority:
                          description: |-
                            Priority controls the ordering of this plugin. Higher values run first.
                            Built-in plugins use priorities in the range 0-10000, spaced by 100.
                          type: integer
                      type: object
                    description: Plugins allows overriding plugin configuration. Keys
                      are plugin names.
                    type: object
                  queueDepthPerAction:
                    additionalProperties:
                      type: integer
                    description: QueueDepthPerAction is the maximum number of jobs
                      tried per action per queue.
                    type: object
                  timeBasedFairShare:
                    description: |-
                      TimeBasedFairShare configures usage-aware fairness for the nodepool.
                      The controller compiles this into the shard's kValue + usageDBConfig.
                    properties:
                      enabled:
                        description: |-
                          Enabled activates usage-aware fairness. When false, scheduling uses current
                          queue state only.
                        type: boolean
                      halfLifePeriod:
                        description: |-
                          HalfLifePeriod is the half-life of past usage. 0 = no decay (all history weighted equally).
                          Format: duration string such as "24h", "7d", "0".
                        pattern: ^(0|([0-9]+(\.[0-9]+)?(m|h|d))+)$
                        type: string
                      historicalUsageWeight:
                        description: |-
                          HistoricalUsageWeight determines how strongly past usage lowers current fair-share.
                          0 = ignore history; 1.0 = strong; >1 = stronger. Maps to shard kValue.
                        minimum: 0
                        type: number
                      sampling:
                        description: |-
                          Sampling configures advanced usage-sampling tuning. Defaults are sensible;
                          most users leave this unset.
                        properties:
                          fetchInterval:
                            description: FetchInterval is how often usage is fetched.
                              Default 1m.
                            type: string
                          stalenessPeriod:
                            description: StalenessPeriod is when fetched usage is
                              considered stale. Default 5m.
                            type: string
                          waitTimeout:
                            description: WaitTimeout is the fetch wait timeout. Default
                              1m.
                            type: string
                        type: object
                      window:
                        description: Window defines the time window over which usage
                          is evaluated.
                        properties:
                          cronString:
                            description: CronString is a cron expression defining
                              the window. Only used when Type=cron.
                            type: string
                          size:
                            description: |-
                              Size is the window length. sliding: rolling period (e.g. "7d").
                              tumbling: cycle length. Default 7d.
                            pattern: ^(0|([0-9]+(\.[0-9]+)?(m|h|d))+)$
                            type: string
                          tumblingStartTime:
                            description: |-
                              TumblingStartTime is the anchor timestamp for tumbling windows (RFC-3339).
                              Only used when Type=tumbling.
                            format: date-time
                            type: string
                          type:
                            description: |-
                              Type is the window aggregation style.
                              sliding: rolling period. tumbling: fixed resetting buckets. cron: custom schedule.
                            enum:
                            - sliding
                            - tumbling
                            - cron
                            type: string
                        type: object
                    type: object
                type: object
            type: object
            x-kubernetes-validations:
            - message: labelKey and labelValue are immutable
              rule: has(self.labelKey) == has(oldSelf.labelKey) && (!has(self.labelKey)
                || self.labelKey == oldSelf.labelKey) && has(self.labelValue) == has(oldSelf.labelValue)
                && (!has(self.labelValue) || self.labelValue == oldSelf.labelValue)
          status:
            description: NodePoolStatus defines the observed state of NodePool.
            properties:
              conditions:
                description: Conditions is an array of current observed nodepool conditions.
                items:
                  description: NodePoolCondition contains condition information for
                    a NodePool.
                  properties:
                    lastHeartbeatTime:
                      description: LastHeartbeatTime is when the condition was last
                        updated.
                      format: date-time
                      nullable: true
                      type: string
                    lastTransitionTime:
                      description: LastTransitionTime is when the condition last changed
                        status.
                      format: date-time
                      type: string
                    message:
                      description: Message is a human-readable description of the
                        condition's last transition.
                      type: string
                    reason:
                      description: Reason is a brief machine-readable reason for the
                        condition's last transition.
                      type: string
                    status:
                      description: Status of the condition (True, False, Unknown).
                      type: string
                    type:
                      description: Type of nodepool condition.
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message is a human-readable description of the current
                  phase.
                type: string
              nodes:
                description: Nodes lists the nodes assigned to this nodepool and their
                  individual status.
                items:
                  description: NodeInNodePool describes an individual node that is
                    part of a NodePool.
                  properties:
                    name:
                      type: string
                    status:
                      description: NodeInNodePoolStatus is the status of an individual
                        node within a nodepool.
                      type: string
                    topologyMismatch:
                      description: TopologyMismatch is true when the node is missing
                        NetworkTopology node-level labels.
                      type: boolean
                  type: object
                type: array
              phase:
                description: Phase is the recently observed lifecycle phase of the
                  nodepool.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
