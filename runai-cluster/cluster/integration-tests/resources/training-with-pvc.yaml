apiVersion: run.ai/v2alpha1
kind: TrainingWorkload
metadata:
  name: {{WORKLOAD_NAME}}
  namespace: {{WORKLOAD_NAMESPACE}}
spec:
  name:
    value: {{POD_NAME_PREFIX}}
  image:
    value: ubuntu
  command:
      value: sleep infinity
  pvcs:
    items:
      pvc:
        value:
          claimName: {{PVC_NAME}}
          existingPvc: false
          path: /home/local
          readOnly: false
          size: 1G