                  StartTime represents the time when the workloads job first pod started running
                  It is not guaranteed to be set in happens-before order across separate operations.
                  It is represented in RFC3339 form and is in UTC.
                format: date-time
                type: string
              succeededPods:
                description: SucceededPods represents the number of pods complete
                  successfully
                format: int32
                type: integer
              syncStatus:
                description: WorkloadSyncStatus defines the status of the sync, reported
                  by cluster-sync
                properties:
                  lastAttemptedSyncGeneration:
                    description: the last generation that was attempted to be synced
                      - in case sync failed
                    format: int64
                    type: integer
                  lastAttemptedSyncStatusChangeTime:
                    description: the last statusChangeTime that was attempted to be
                      synced - in case sync failed
                    format: date-time
                    type: string
                  lastSyncGeneration:
                    description: the last object Generation that was observed and
                      synced to control-plane - "Generation" is only for spec fields
                    format: int64
                    type: integer
                  lastSyncStatusChangeTime:
                    description: the last status change time that was observed and
                      synced to control-plane.
                    format: date-time
                    type: string
                  lastSyncStatusChecksum:
                    description: the last observed and synced status change time (LastStatusChangeTime)
                    format: int32
                    type: integer
                  lastSyncTimestamp:
                    description: cluster-sync will set this value when syncing the
                      object to control-plane
                    format: date-time
                    type: string
                  syncErrorMsg:
                    description: in case of an error - a string describing the error
                    type: string
                type: object
              totalAllocatedGPU:
                description: TotalAllocatedGPU represents the total number of allocated
                  GPU
                type: string
              totalAllocatedGPUMemory:
                description: TotalAllocatedGPUMemory represents the total amount of
                  allocated GPU memory
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
