apiVersion: run.ai/v2alpha1
kind: DeploymentWorkload
metadata:
  name: sample
  namespace: runai-team-a
spec:
  usage: Submit

  namePrefix:
    value: "ofer"

  gpu:
    value: "0"

  image:
    value: "ubuntu"

  memory:
    value: 123m

  volumes:
   items:
      researcher-volume:
        value:
          sourcePath: /srcy
          targetPath: /targety


  environment:
    items:
      MY_ENV_VAR:
        value: my_value
      HOME1:
        deleted: true


