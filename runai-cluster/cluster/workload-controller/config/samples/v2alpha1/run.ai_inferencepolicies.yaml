apiVersion: run.ai/v2alpha1
kind: InferencePolicy

metadata:

  name: inferencepolicy1
  namespace: runai-team-a

spec:

  minScale:
    rules:
      required: true
      min: 0

  maxScale:
    rules:
      required: false
      min: 0

  metric:
    value: "latency"

  target:
    value: 80

  image:
    value: "ubuntu"

  ports:
    itemRules:
      container:
        min: 30000
        max: 32767
      external:
        max: 32767
    items:
      admin-port:
        rules:
          canRemove: false
        value:
          container: 30100
          external: 8080

  volumes:
    items:
      admin-volume:
        rules:
          canRemove: false
          canEdit: false
        value:
          sourcePath: /srcx
          targetPath: /targetx
          readOnly: false

  environment:
    items:
      HOME:
        rules:
          canRemove: false
        value: /home
      USER:
        rules:
          canEdit: false
          canRemove: false
        value: $USER

