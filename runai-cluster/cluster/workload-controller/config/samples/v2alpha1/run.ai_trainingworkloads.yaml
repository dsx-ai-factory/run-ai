apiVersion: run.ai/v2alpha1
kind: TrainingWorkload
metadata:
  name: sample
  namespace: runai-team-a
spec:
  usage: Submit

  namePrefix:
    value: "ofer"

  gpu:
    value: "0"

  image:
    value: "ubuntu"

  memory:
    value: 123m

  ports:
    items:
      researcher-port:
        value:
          container: 30500
          external: 4444

  volumes:
   items:
      researcher-volume:
        value:
          sourcePath: /srcy
          targetPath: /targety
          nfsServer: nfs.server.com

  environment:
    items:
      MY_ENV_VAR:
        value: my_value
      HOME1:
        deleted: true


