apiVersion: run.ai/v2alpha1
kind: DeploymentPolicy
metadata:
  name: deployment-policy
  namespace: runai
spec:

  image:
    value: "ubuntu"

  environment:
    items:
      HOME:
        rules:
          canRemove: false
        value: /home
      USER:
        rules:
          canEdit: false
          canRemove: false
        value: $USER

