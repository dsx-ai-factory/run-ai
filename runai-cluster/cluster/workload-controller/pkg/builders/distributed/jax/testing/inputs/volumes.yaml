apiVersion: run.ai/v2alpha1
kind: DistributedWorkload
metadata:
  name: job-1
  namespace: runai-team-a
  uid: b5efa366-77be-4da3-ac9b-b59483d02a99
spec:
  jobType: JAXJob
  noMaster:
    value: true
  name:
    value: job-1
  pvcs:
    items:
      pvc--0:
        value:
          path: /tmp/ofer
          readOnly: false
          size: 10M
          storageClass: storage
  gitSync:
    items:
      git-public-repo:
        value:
          directory: /tmp/repoa
          repository: http://github.com/repoa
          branch: custom
      git-secret-repo:
        value:
          directory: /tmp/repob
          repository: http://github.com/repob
          branch: custom
          secretName: k8s-secret-b
          password: pass-key
          username: user-key
      git-password-repo:
        value:
          directory: /tmp/repoc
          repository: http://github.com/repoc
          branch: custom
          secretName: k8s-secret-c
          authenticatingMethod: password
          password: pass-key
          username: user-key
      git-ssh-repo:
        value:
          directory: /tmp/repod
          repository: http://github.com/repod
          branch: custom
          secretName: k8s-secret-d
          authenticatingMethod: ssh-key
  workers:
    value: 1
  username:
    value: user.name
  volumes:
    items:
      vol--mypath:
        value:
          readOnly: true
          sourcePath: /myvol
          targetPath: /mypath
