apiVersion: run.ai/v2alpha1
kind: DistributedWorkload
metadata:
  name: job-1
  namespace: runai-team-a
  uid: b5efa366-77be-4da3-ac9b-b59483d02a99
spec:
  jobType: XGBoostJob
  image:
    value: ubuntu
  name:
    value: job-1
  username:
    value: user.name
  workers:
    value: 3
masterSpec:
  image:
    value: ubuntu
  command:
    value: cmd1 cmd2 cmd3
  arguments:
    value: arg1 arg2 arg3
