  podAffinity:
    value: true
  podAffinityTopology:
    value: pod_affinity_topology_value
  podAffinitySchedulingRule:
    value: requiredDuringSchedulingIgnoredDuringExecution
  ports:
    items:
      port-80:
        value:
          autoGenerate: false
