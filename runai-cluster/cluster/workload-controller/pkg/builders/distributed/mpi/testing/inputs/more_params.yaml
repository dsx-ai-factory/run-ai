apiVersion: run.ai/v2alpha1
kind: DistributedWorkload
metadata:
  name: dist-0
  namespace: runai-team-a
  uid: b5efa366-77be-4da3-ac9b-b59483d02a99
spec:
  jobType: MPIJob
  cpu:
    value: "3"
  createHomeDir:
    value: true
  gpu:
    value: "0.5"
  hostIpc:
    value: true
  hostNetwork:
    value: true
  image:
    value: ubuntu
  mpiJob:
    values:
      slotsPerWorker:
        value: 1
      sshAuthMountPath:
        value: /home
  name:
    value: job-0
  allowPrivilegeEscalation:
    value: true
  preemptible:
    value: true
  workers:
    value: 3
  runAsGid:
    value: 20
  runAsUid:
    value: 501
  runAsUser:
    value: true
  dropAllCapabilities:
    value: true
  stdin:
    value: true
  supplementalGroups:
    value: 20;30;40
  tty:
    value: true
  username:
    value: user.name
  workingDir:
    value: /tmp/work
  runPolicy:
    values:
      backoffLimit:
        value: 3
      cleanPodPolicy:
        value: None
  nodeAffinityRequired:
    nodeSelectorTerms:
    - matchExpressions:
      - key: key1
        operator: In
        values:
        - a
    - matchExpressions:
      - key: key2
        operator: Exists