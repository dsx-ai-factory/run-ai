apiVersion: run.ai/v2alpha1
kind: DistributedWorkload
metadata:
  name: probes
  namespace: runai-team-a
  uid: b5efa366-77be-4da3-ac9b-b59483d02a99
spec:
  jobType: MPIJob
  name:
    value: probes
  workers:
    value: 1
  username:
    value: user.name
  readinessProbe:
    values:
      initialDelaySeconds:
        value: 1
      periodSeconds:
        value: 2
      timeoutSeconds:
        value: 3
      successThreshold:
        value: 4
      failureThreshold:
        value: 5
      httpGetPort:
        value: 8080
      httpGetPath:
        value: /ready
      httpGetHost:
        value: my.domain.com
      httpGetScheme:
        value: HTTPS
