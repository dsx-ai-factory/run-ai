apiVersion: run.ai/v2alpha1
kind: DistributedWorkload
metadata:
  name: job-1
  namespace: runai-team-a
  uid: b5efa366-77be-4da3-ac9b-b59483d02a99
spec:
  jobType: MPIJob
  image:
    value: ubuntu
  name:
    value: job-1
  pvcs:
    items:
      pvc--0:
        value:
          path: /tmp/ofer
          readOnly: false
          size: 10M
          storageClass: storage
      pvc--1:
        value:
          path: this/should/not/be/ignored
          claimName: scratch-volume
          size: 10M
          readWriteMany: true
          storageClass: scratch-storage-class
          ephemeral: true
  workers:
    value: 1
  username:
    value: user.name


