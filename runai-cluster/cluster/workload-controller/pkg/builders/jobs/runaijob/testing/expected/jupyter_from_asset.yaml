- apiVersion: run.ai/v1
  kind: RunaiJob
  metadata:
    annotations:
      template: job-0
      workloadApiVersion: run.ai/v2alpha1
    creationTimestamp: "2022-02-22T17:00:00Z"
    deletionTimestamp: "2022-02-22T17:00:00Z"
    labels:
      app: runaijob
      createdBy: RunaiJob
      kai.scheduler/preemptibility: non-preemptible
      priorityClassName: build
      project: team-a
      release: job-0
      workloadKind: InteractiveWorkload
      workloadName: job-0
    name: job-0
    namespace: runai-team-a
  spec:
    activeDeadlineSeconds: 120
    backoffLimit: 0
    completions: 1
    maxIdleDurationSeconds: 1200
    parallelism: 1
    template:
      metadata:
        annotations:
          user: user.name
        labels:
          app: runaijob
          createdBy: RunaiJob
          kai.scheduler/preemptibility: non-preemptible
          priorityClassName: build
          project: team-a
          release: job-0
          run.ai/top-owner-uid: ""
          workloadKind: InteractiveWorkload
          workloadName: job-0
      spec:
        containers:
        - command:
          - start-notebook.sh
          - --NotebookApp.base_url=/team-a/job-0
          - --NotebookApp.token=
          - --NotebookApp.password=
          env:
          - name: CHROME_HOME
            value: "yes"
          - name: CHROME_HOME_OPTS
            value: -R
          - name: NB_GID
            value: "20"
          - name: NB_UID
            value: "501"
          - name: HOME
            value: /home/runai-home
          - name: LDAP_UID
            value: "0"
          - name: LDAP_GID
            value: "0"
          image: jupyter/scipy-notebook
          imagePullPolicy: IfNotPresent
          name: job-0
          resources: {}
          securityContext:
            runAsGroup: 0
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - mountPath: /home/runai-home
            name: user-data
          - mountPath: /tmp/repoa
            name: code-sync-0
        initContainers:
        - env:
          - name: GITSYNC_REPO
            value: http://github.com/repoa
          - name: GITSYNC_USERNAME
            value: myuser
          - name: GITSYNC_PASSWORD
            value: mypassword
          - name: GITSYNC_ROOT
            value: /code-git-a
          - name: GITSYNC_ONE_TIME
            value: "true"
          - name: HOME
            value: /tmp
          image: registry.k8s.io/git-sync/git-sync:v4.7.0
          name: git-sync-git-a
          resources: {}
          securityContext:
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
          - mountPath: /code-git-a
            name: code-sync-0
        restartPolicy: Never
        schedulerName: runai-scheduler
        securityContext:
          fsGroup: 0
        volumes:
        - emptyDir: {}
          name: user-data
        - emptyDir: {}
          name: code-sync-0
  status: {}
