apiVersion: run.ai/v2alpha1
kind: InteractiveWorkload
metadata:
  name: test-configmap-volume
  namespace: runai-team-a
spec:
  usage: Submit
  emptyDirVolumes:
    items:
      emptydir-1:
        value:
          path: /mnt/ed1
      emptydir-2:
        value:
          path: /mnt/ed2
          medium: Memory
          sizeLimit: 256Mi
      emptydir-3:
        value:
          path: /mnt/ed3
          medium: ""
      emptydir-4:
        value:
          path: /mnt/ed4
          sizeLimit: 1Gi
  image:
    value: ubuntu
  imagePullPolicy:
    value: Always
  name:
    value: job-3
  runAsGid:
    value: 20
  runAsUid:
    value: 501
  serviceType:
    value: ClusterIP
  supplementalGroups:
    value: 20;12;61;79;80;81;98;33;100;204;250;395;101;399;400;701
  username:
    value: user.name
