apiVersion: run.ai/v2alpha1
kind: InteractiveWorkload
metadata:
  name: job-3
  namespace: runai-team-a
spec:
  gpu:
    value: "1"
  image:
    value: jupyter/scipy-notebook
  jupyter:
    value: true
  ingressUrl:
    value: https://app.run.ai/_PROJECT_NAME_/_JOB_NAME_
  runAsUser:
    value: true
  runAsGid:
    value: 20
  runAsUid:
    value: 501
  supplementalGroups:
    value: 20;12;61;79;80;81;98;33;100;204;250;395;101;399;400;701
  username:
    value: user.name
  gitSync:
    items:
      git-a:
        value:
          directory: /tmp/repoa
          password: mypassword
          repository: http://github.com/repoa
          username: myuser