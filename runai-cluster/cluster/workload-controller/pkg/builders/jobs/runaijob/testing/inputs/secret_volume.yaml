apiVersion: run.ai/v2alpha1
kind: InteractiveWorkload
metadata:
  name: test-configmap-volume
  namespace: runai-team-a
spec:
  usage: Submit
  secretVolumes:
    items:
      secret-volume-1:
        value:
          name: secret-account-key
          mountPath: /etc/account
      secret-volume-2:
        value:
          name: secret-another-key
          mountPath: /etc/another
  image:
    value: ubuntu
  imagePullPolicy:
    value: Always
  name:
    value: job-3
  runAsGid:
    value: 20
  runAsUid:
    value: 501
  serviceType:
    value: ClusterIP
  supplementalGroups:
    value: 20;12;61;79;80;81;98;33;100;204;250;395;101;399;400;701
  username:
    value: user.name
