apiVersion: run.ai/v2alpha1
kind: InteractiveWorkload
metadata:
  creationTimestamp: null
  name: probes
  namespace: runai-team-a
spec:
  usage: Submit
  image:
    value: ubuntu
  imagePullPolicy:
    value: Always
  name:
    value: probes
  readinessProbe:
    values:
      initialDelaySeconds:
        value: 1
      periodSeconds:
        value: 2
      timeoutSeconds:
        value: 3
      successThreshold:
        value: 4
      failureThreshold:
        value: 5
      httpGetPort:
        value: 8080
      httpGetPath:
        value: /ready
      httpGetHost:
        value: my.domain.com
      httpGetScheme:
        value: HTTPS
