apiVersion: run.ai/v2alpha1
kind: InteractiveWorkload
metadata:
  name: env
  namespace: runai-team-a
spec:
  usage: Submit
  image:
    value: http://gcr.io/runai/test
  name:
    value: ofer
  environment:
    items:
      env-1:
        value: user.name
      env-2:
        value: "SECRET:xxx"
      env-3:
        value: "SECRET:xxx,yyy"
      env-4:
        value: "CONFIGMAP:aaa,bbb"
      env-5:
        value: "PODFIELDREF:cccc"
      env-6:
        value: "USERCREDENTIAL:my-user-credential,my-user-key"
