apiVersion: run.ai/v2alpha1
kind: InteractiveWorkload
metadata:
  name: test-git
  namespace: runai-team-a
spec:
  usage: Submit
  gitSync:
    items:
      git--tmp-repoa:
        value:
          directory: /tmp/repoa
          password: mypassword
          repository: http://github.com/repoa
          username: myuser
      git--tmp-repob:
        value:
          directory: /tmp/repob
          repository: http://github.com/repob
          rev: "1.2"
  image:
    value: http://gcr.io/runai/test
  imagePullPolicy:
    value: Always
  name:
    value: job-3
  runAsGid:
    value: 20
  runAsUid:
    value: 501
  serviceType:
    value: ClusterIP
  supplementalGroups:
    value: 20;12;61;79;80;81;98;33;100;204;250;395;101;399;400;701
  username:
    value: user.name
