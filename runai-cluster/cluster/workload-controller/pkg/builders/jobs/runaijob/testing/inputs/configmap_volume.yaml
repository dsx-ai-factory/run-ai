apiVersion: run.ai/v2alpha1
kind: InteractiveWorkload
metadata:
  name: test-configmap-volume
  namespace: runai-team-a
spec:
  usage: Submit
  configMapVolumes:
    items:
      configmap-volume-1:
        value:
          name: cm-db-setting
          mountPath: /etc/db.conf
      configmap-volume-2:
        value:
          name: cm-app-setting
          mountPath: /etc/app.conf
  image:
    value: ubuntu
  imagePullPolicy:
    value: Always
  runAsGid:
    value: 20
  runAsUid:
    value: 501
  serviceType:
    value: ClusterIP
  supplementalGroups:
    value: 20;12;61;79;80;81;98;33;100;204;250;395;101;399;400;701
  username:
    value: user.name
