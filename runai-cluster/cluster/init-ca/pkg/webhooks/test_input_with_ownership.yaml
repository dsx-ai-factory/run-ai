  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: anyworkload-controller
      namespace: runai
      path: /mutate-workloadrunner
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["run.ai"]
    apiVersions: ["v1alpha1"]
    resources: ["workloadrunners"]
- name: workloadrunner-ownership.anyworkload-controller.runai.svc
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: anyworkload-controller
      namespace: runai
      path: /mutate-workload-ownership
  rules:
  - operations: ["UPDATE"]
    apiGroups: ["run.ai"]
    apiVersions: ["v1alpha1"]
    resources: ["workloadrunners"]
---
