apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: runai-training-workload-validation
  labels:
    app: runai
webhooks:
- name: workload-controller.runai.svc
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: workload-controller
      namespace: runai
      path: /validate-run-ai-v2alpha1-trainingworkload
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["run.ai"]
    apiVersions: ["v2alpha1"]
    resources: ["trainingworkloads"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: runai-training-workload-mutation
  labels:
    app: runai
webhooks:
- name: workload-controller.runai.svc
  admissionReviewVersions: ["v1"]
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: workload-controller
      namespace: runai
      path: /mutate-training-workload
  rules:
  - operations: ["CREATE"]
    apiGroups: ["run.ai"]
    apiVersions: ["v2alpha1"]
    resources: ["trainingworkloads"]
