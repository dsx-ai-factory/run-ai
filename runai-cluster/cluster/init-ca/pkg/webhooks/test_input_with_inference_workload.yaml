---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: runai-inference-policy-validation
  labels:
    app: runai
webhooks:
- name: inference-workload-controller.runai.svc
  admissionReviewVersions: [ "v1" ]
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: inference-workload-controller
      namespace: runai
      path: "/validate-run-ai-v1-inferencepolicy"
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["*"]
    apiVersions: ["*"]
    resources: ["inferencepolicies"]
    scope: "Namespaced"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: runai-inference-workload-validation
  labels:
    app: runai
webhooks:
- name: inference-workload-controller.runai.svc
  admissionReviewVersions: [ "v1" ]
  sideEffects: None
  failurePolicy: Fail
  clientConfig:
    service:
      name: inference-workload-controller
      namespace: runai
      path: "/validate-run-ai-v1-inferenceworkload"
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["*"]
    apiVersions: ["*"]
    resources: ["inferenceworkloads"]
    scope: "Namespaced"
