apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: runai-pod-job
  labels:
    app: runai
webhooks:
  - name: runai-admission-controller.runai.svc
    admissionReviewVersions: [ "v1" ]
    sideEffects: None
    namespaceSelector:
      matchExpressions:
        - key: runai/queue
          operator: Exists
    failurePolicy: Fail
    clientConfig:
      service:
        name: runai-admission-controller
        namespace: runai
        path: "/mutate-pod"
    rules:
      - operations: ["CREATE"]
        apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["pods"]
        scope: "Namespaced"
    reinvocationPolicy: "IfNeeded"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: runai-pod-job
  labels:
    app: runai
webhooks:
- name: runai-admission-controller.runai.svc
  admissionReviewVersions: [ "v1" ]
  sideEffects: None
  namespaceSelector:
    matchExpressions:
    - key: runai/queue
      operator: Exists
  failurePolicy: Fail
  clientConfig:
    service:
      name: runai-admission-controller
      namespace: runai
      path: "/validate-pod-job"
  rules:
  - operations: ["CREATE"]
    apiGroups: ["*"]
    apiVersions: ["*"]
    resources: ["pods"]
    scope: "Namespaced"
---
