apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    workloadApiVersion: run.ai/v2alpha1
  creationTimestamp: "2022-02-22T17:00:00Z"
  deletionTimestamp: "2022-02-22T17:00:00Z"
  labels:
    project: team-a
    workloadKind: InferenceWorkload
    workloadName: basic-inference
  name: inference-0
  namespace: runai-team-a
spec:
  template:
    metadata:
      annotations:
        gpu-fraction-num-devices: "1"
        gpu-memory: "120"
        runai-nodepools: default nodepoola
        user: guy.shaibi
      labels:
        project: team-a
        release: basic-inference
        run.ai/inferenceworkload: basic-inference
        workloadKind: InferenceWorkload
        workloadName: basic-inference
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: runai/node-pool
                operator: DoesNotExist
            - matchExpressions:
              - key: test-key
                operator: In
                values:
                - test-value
      containers:
      - args:
        - --model-store=/mnt/models
        - -v
        command:
        - tritonserver
        image: image
        imagePullPolicy: Always
        name: ""
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: "1"
          requests:
            cpu: "1"
            memory: "1"
        securityContext:
          capabilities:
            drop:
            - all
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /tmp/claim0
          name: data-volume-0
          readOnly: true
      enableServiceLinks: false
      schedulerName: runai-scheduler
      tolerations:
      - key: aaa
        operator: Exists
      volumes:
      - name: data-volume-0
        persistentVolumeClaim:
          claimName: data-volume-pvc
status: {}
