apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    workloadApiVersion: run.ai/v2alpha1
  creationTimestamp: "2022-02-22T17:00:00Z"
  deletionTimestamp: "2022-02-22T17:00:00Z"
  labels:
    project: team-a
    workloadKind: InferenceWorkload
    workloadName: basic-inference
  name: inference-0
  namespace: runai-team-a
spec:
  template:
    metadata:
      annotations:
        runai-nodepools: default nodepoola
        user: user.name
      labels:
        project: team-a
        release: basic-inference
        run.ai/inferenceworkload: basic-inference
        workloadKind: InferenceWorkload
        workloadName: basic-inference
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: runai/node-pool
                operator: DoesNotExist
            - matchExpressions:
              - key: test-key
                operator: In
                values:
                - test-value
      containers:
      - image: image
        imagePullPolicy: Always
        name: ""
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          limits:
            memory: "1"
          requests:
            cpu: "1"
      - args:
        - --provider=keycloak-oidc
        - --upstream=http://localhost:3000
        - --redirect-url=https://cluster-domain.mock/team-a/inference-0/oauth2/callback
        - --oidc-issuer-url=/auth/realms/runai
        - --scope=openid
        - --http-address=0.0.0.0:4180
        - --proxy-prefix=/team-a/inference-0/oauth2
        - --skip-provider-button=true
        - --whitelist-domain=cluster-domain.mock
        - --cookie-domain=cluster-domain.mock
        - --cookie-httponly=true
        - --cookie-secure=true
        - --code-challenge-method=S256
        - --cookie-refresh=10m
        - --cookie-samesite=lax
        - --skip-jwt-bearer-tokens=true
        - --extra-jwt-issuers=/auth/realms/runai=runai
        - --custom-templates-dir=/usr/share/oauth2-proxy
        - --pass-authorization-header=false
        - --cookie-name=InferenceWorkload-runai-team-a-basic-inference-0
        - --session-store-type=redis
        - --redis-connection-url=redis://cluster-redis.runai.svc.cluster.local:6379
        - --allowed-group=group-a
        - --allowed-group=group-b
        - --email-domain=*
        env:
        - name: OAUTH2_PROXY_COOKIE_PATH
          value: /team-a/inference-0
        envFrom:
        - secretRef: {}
        imagePullPolicy: IfNotPresent
        name: runai-oauth2-proxy-0
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /etc/runai/auth/users
          name: runai-auth
      enableServiceLinks: false
      schedulerName: runai-scheduler
      volumes:
      - emptyDir: {}
        name: runai-auth
status: {}
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: "2022-02-22T17:00:00Z"
  labels:
    app: service
    createdBy: Service
    project: team-a
    release: basic-inference
    workloadKind: InferenceWorkload
    workloadName: basic-inference
  name: infw-inference-0-0
  namespace: runai-team-a
spec:
  ports:
  - name: port-inference-0-4180-0
    port: 80
    protocol: TCP
    targetPort: 4180
  selector:
    release: basic-inference
  type: ClusterIP
status:
  loadBalancer: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8g
  creationTimestamp: "2022-02-22T17:00:00Z"
  labels:
    app: service
    createdBy: Service
    project: team-a
    release: basic-inference
    workloadKind: InferenceWorkload
    workloadName: basic-inference
  name: infw-inference-0-0
  namespace: runai-team-a
spec:
  rules:
  - host: cluster-domain.mock
    http:
      paths:
      - backend:
          service:
            name: infw-inference-0-0
            port:
              number: 80
        path: /team-a/inference-0
        pathType: Prefix
status:
  loadBalancer: {}
