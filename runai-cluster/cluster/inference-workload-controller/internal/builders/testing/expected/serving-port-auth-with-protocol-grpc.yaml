apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    workloadApiVersion: run.ai/v2alpha1
  creationTimestamp: "2022-02-22T17:00:00Z"
  deletionTimestamp: "2022-02-22T17:00:00Z"
  labels:
    project: team-a
    workloadKind: InferenceWorkload
    workloadName: serving-port-auth
  name: serving-port-auth
  namespace: runai-team-a
spec:
  template:
    metadata:
      annotations:
        user: shay.asoolin
      labels:
        project: team-a
        release: serving-port-auth
        run.ai/inferenceworkload: serving-port-auth
        workloadKind: InferenceWorkload
        workloadName: serving-port-auth
    spec:
      containers:
      - image: ubuntu
        name: ""
        resources: {}
      - args:
        - --provider=keycloak-oidc
        - --upstream=http://localhost:80
        - --redirect-url=http://serving-port-auth.runai-team-a.svc.cluster.local/oauth2/callback
        - --oidc-issuer-url=/auth/realms/runai
        - --scope=openid
        - --http-address=0.0.0.0:4180
        - --proxy-prefix=/oauth2
        - --skip-provider-button=true
        - --whitelist-domain=serving-port-auth.runai-team-a.svc.cluster.local
        - --cookie-domain=serving-port-auth.runai-team-a.svc.cluster.local
        - --cookie-httponly=true
        - --cookie-secure=true
        - --code-challenge-method=S256
        - --cookie-refresh=10m
        - --cookie-samesite=lax
        - --skip-jwt-bearer-tokens=true
        - --extra-jwt-issuers=/auth/realms/runai=runai
        - --custom-templates-dir=/usr/share/oauth2-proxy
        - --pass-authorization-header=false
        - --cookie-name=InferenceWorkload-runai-team-a-serving-port-auth-0
        - --session-store-type=redis
        - --redis-connection-url=redis://cluster-redis.runai.svc.cluster.local:6379
        - --force-json-errors=true
        - --email-domain=*
        env:
        - name: OAUTH2_PROXY_COOKIE_PATH
          value: /
        envFrom:
        - secretRef: {}
        imagePullPolicy: IfNotPresent
        name: runai-oauth2-proxy-0
        ports:
        - containerPort: 4180
          name: h2c
        readinessProbe:
          tcpSocket:
            port: 80
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /etc/runai/auth/users
          name: runai-auth
      enableServiceLinks: false
      schedulerName: runai-scheduler
      volumes:
      - emptyDir: {}
        name: runai-auth
status: {}
