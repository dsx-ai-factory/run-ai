        - sh
        - -c
        - echo -e "c2hheTNAcnVuLmFpCnNoYXk0QHJ1bi5haQ==" | base64 -d > /etc/runai/auth/users/YQ==
        image: registry.access.redhat.com/ubi9/ubi-minimal:9.8
        imagePullPolicy: IfNotPresent
        name: runai-auth-user-loader
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
          requests:
            cpu: 50m
            memory: 50Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
        volumeMounts:
        - mountPath: /etc/runai/auth/users
          name: runai-auth
      schedulerName: runai-scheduler
      volumes:
      - emptyDir: {}
