apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    run.ai/inference-workload-model-swap: '{"models": ["vendor/model-1", "vendor/model-2"],
      "server-type": "tgi"}'
    workloadApiVersion: run.ai/v2alpha1
  creationTimestamp: "2022-02-22T17:00:00Z"
  deletionTimestamp: "2022-02-22T17:00:00Z"
  labels:
    project: team-a
    workloadKind: InferenceWorkload
    workloadName: model-swap
  name: model-swap
  namespace: runai-team-a
spec:
  template:
    metadata:
      annotations:
        run.ai/inference-workload-model-swap: '{"models": ["vendor/model-1", "vendor/model-2"],
          "server-type": "tgi"}'
      labels:
        project: team-a
        release: model-swap
        run.ai/inferenceworkload: model-swap
        workloadKind: InferenceWorkload
        workloadName: model-swap
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - |-
          cat <<EOF > /tmp/proxy_server_config.yaml
          model_list:
            - model_name: vendor/model-1
              litellm_params:
                model: openai/vendor/model-1
                api_base: http://0.0.0.0:8000/v1
                api_key: sk-1234
            - model_name: vendor/model-2
              litellm_params:
                model: openai/vendor/model-2
                api_base: http://0.0.0.0:8001/v1
                api_key: sk-1234
          EOF
          litellm --port 4000 --config /tmp/proxy_server_config.yaml
        image: litellm:latest
        name: llm-gateway
        ports:
        - containerPort: 4000
          protocol: TCP
        readinessProbe:
          httpGet:
            port: 4000
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
      - args:
        - --model-id
        - vendor/model-1
        - --port
        - "8000"
        image: ghcr.io/huggingface/text-generation-inference:3.0.0
        name: llm-0
        readinessProbe:
          httpGet:
            port: 8000
        resources:
          limits:
            nvidia.com/gpu: "1"
          requests:
            cpu: 200m
      - args:
        - --model-id
        - vendor/model-2
        - --port
        - "8001"
        image: ghcr.io/huggingface/text-generation-inference:3.0.0
        name: llm-1
        readinessProbe:
          httpGet:
            port: 8001
        resources:
          limits:
            nvidia.com/gpu: "1"
          requests:
            cpu: 200m
      enableServiceLinks: false
      schedulerName: runai-scheduler
status: {}
