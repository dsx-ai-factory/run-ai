apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    workloadApiVersion: run.ai/v2alpha1
  creationTimestamp: "2022-02-22T17:00:00Z"
  deletionTimestamp: "2022-02-22T17:00:00Z"
  labels:
    project: team-a
    workloadKind: InferenceWorkload
    workloadName: pod-affinity
  name: pod-affinity
  namespace: runai-team-a
spec:
  template:
    metadata:
      annotations:
        gpu-fraction-num-devices: "1"
        gpu-memory: "120"
        runai-nodepools: nodepoola
        user: guy.shaibi
      labels:
        project: team-a
        release: pod-affinity
        run.ai/inferenceworkload: pod-affinity
        workloadKind: InferenceWorkload
        workloadName: pod-affinity
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: test-key
                operator: In
                values:
                - test-value
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: release
                operator: In
                values:
                - pod-affinity
            topologyKey: pod_affinity_topology_value
      containers:
      - command:
        - tritonserver
        image: image
        imagePullPolicy: Always
        name: ""
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
      enableServiceLinks: false
      schedulerName: runai-scheduler
status: {}
