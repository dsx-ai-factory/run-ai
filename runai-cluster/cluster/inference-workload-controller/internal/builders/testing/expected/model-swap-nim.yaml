apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    run.ai/inference-workload-model-swap: '{"models": ["vendor/model-1", "vendor/model-2"],
      "server-type": "nim"}'
    workloadApiVersion: run.ai/v2alpha1
  creationTimestamp: "2022-02-22T17:00:00Z"
  deletionTimestamp: "2022-02-22T17:00:00Z"
  labels:
    project: team-a
    workloadKind: InferenceWorkload
    workloadName: model-swap
  name: model-swap
  namespace: runai-team-a
spec:
  template:
    metadata:
      annotations:
        run.ai/inference-workload-model-swap: '{"models": ["vendor/model-1", "vendor/model-2"],
          "server-type": "nim"}'
      labels:
        project: team-a
        release: model-swap
        run.ai/inferenceworkload: model-swap
        workloadKind: InferenceWorkload
        workloadName: model-swap
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - |-
          cat <<EOF > /tmp/proxy_server_config.yaml
          model_list:
            - model_name: vendor/model-1
              litellm_params:
                model: openai/vendor/model-1
                api_base: http://0.0.0.0:8000/v1
                api_key: sk-1234
            - model_name: vendor/model-2
              litellm_params:
                model: openai/vendor/model-2
                api_base: http://0.0.0.0:8001/v1
                api_key: sk-1234
          EOF
          litellm --port 4000 --config /tmp/proxy_server_config.yaml
        image: litellm:latest
        name: llm-gateway
        ports:
        - containerPort: 4000
          protocol: TCP
        readinessProbe:
          httpGet:
            port: 4000
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
      - env:
        - name: HOME
          value: /home/runai-home
        - name: NIM_SERVER_PORT
          value: "8000"
        image: nvcr.io/nim/nvidia/vendor/model-1
        name: llm-0
        readinessProbe:
          httpGet:
            port: 8000
        resources:
          limits:
            nvidia.com/gpu: "2"
        securityContext:
          runAsGroup: 1000
          runAsUser: 1000
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /home/runai-home
          name: user-data
      - env:
        - name: HOME
          value: /home/runai-home
        - name: NIM_SERVER_PORT
          value: "8001"
        image: nvcr.io/nim/nvidia/vendor/model-2
        name: llm-1
        readinessProbe:
          httpGet:
            port: 8001
        resources:
          limits:
            nvidia.com/gpu: "2"
        securityContext:
          runAsGroup: 1000
          runAsUser: 1000
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /home/runai-home
          name: user-data
      enableServiceLinks: false
      schedulerName: runai-scheduler
      securityContext:
        fsGroup: 1000
      volumes:
      - emptyDir:
          medium: Memory
        name: dshm
      - emptyDir: {}
        name: user-data
status: {}
