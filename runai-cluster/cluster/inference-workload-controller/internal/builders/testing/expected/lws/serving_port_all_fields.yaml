apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  annotations:
    workloadApiVersion: run.ai/v1alpha1
  creationTimestamp: "2022-02-22T17:00:00Z"
  deletionTimestamp: "2022-02-22T17:00:00Z"
  labels:
    project: team-a
    release: test-lws
    run.ai/top-owner-uid: ""
    workloadKind: DistributedInferenceWorkload
    workloadName: test-lws
  name: test-lws
  namespace: runai-team-a
spec:
  leaderWorkerTemplate:
    leaderTemplate:
      metadata:
        labels:
          run.ai/top-owner-uid: ""
      spec:
        containers:
        - args:
          - --provider=keycloak-oidc
          - --upstream=http://localhost:8080
          - --redirect-url=https://custom-endpoint.example.com/oauth2/callback
          - --oidc-issuer-url=/auth/realms/runai
          - --scope=openid
          - --http-address=0.0.0.0:4180
          - --proxy-prefix=/oauth2
          - --skip-provider-button=true
          - --whitelist-domain=custom-endpoint.example.com
          - --cookie-domain=custom-endpoint.example.com
          - --cookie-httponly=true
          - --cookie-secure=true
          - --code-challenge-method=S256
          - --cookie-refresh=10m
          - --cookie-samesite=lax
          - --skip-jwt-bearer-tokens=true
          - --extra-jwt-issuers=/auth/realms/runai=runai
          - --custom-templates-dir=/usr/share/oauth2-proxy
          - --pass-authorization-header=false
          - --cookie-name=dinfw-test-lws-sp-0
          - --session-store-type=redis
          - --redis-connection-url=redis://
          - --force-json-errors=true
          - --authenticated-emails-file=/etc/runai/auth/users/c2VydmluZy1wb3J0
          env:
          - name: OAUTH2_PROXY_COOKIE_PATH
            value: /
          envFrom:
          - secretRef: {}
          imagePullPolicy: IfNotPresent
          name: runai-oauth2-proxy-0
          ports:
          - containerPort: 4180
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          volumeMounts:
          - mountPath: /etc/runai/auth/users
            name: runai-auth
        - image: image
          name: leader
          ports:
          - containerPort: 8080
            name: port-8080
            protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8080
          resources: {}
        initContainers:
        - command:
          - sh
          - -c
          - echo -e "dXNlcjEKdXNlcjI=" | base64 -d > /etc/runai/auth/users/c2VydmluZy1wb3J0
          image: registry.access.redhat.com/ubi9/ubi-minimal:9.8
          imagePullPolicy: IfNotPresent
          name: runai-auth-user-loader
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 50m
              memory: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
          - mountPath: /etc/runai/auth/users
            name: runai-auth
        schedulerName: runai-scheduler
        volumes:
        - emptyDir: {}
          name: runai-auth
    workerTemplate:
      metadata:
        labels:
          run.ai/top-owner-uid: ""
      spec:
        containers:
        - image: image
          name: worker
          resources: {}
        schedulerName: runai-scheduler
  rolloutStrategy:
    type: RollingUpdate
  startupPolicy: LeaderCreated
status: {}
