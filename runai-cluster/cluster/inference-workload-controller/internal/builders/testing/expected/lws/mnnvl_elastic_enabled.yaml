apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  annotations:
    workloadApiVersion: run.ai/v1alpha1
  creationTimestamp: "2022-02-22T17:00:00Z"
  deletionTimestamp: "2022-02-22T17:00:00Z"
  labels:
    project: team-a
    release: test-lws
    run.ai/top-owner-uid: ""
    workloadKind: DistributedInferenceWorkload
    workloadName: test-lws
  name: test-lws
  namespace: runai-team-a
spec:
  leaderWorkerTemplate:
    leaderTemplate:
      metadata:
        annotations:
          runai-nodepools: mnnvl-node-1 mnnvl-node-2
        labels:
          run.ai/MNNVL: Required
          run.ai/top-owner-uid: ""
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: nodepool-key-1
                  operator: In
                  values:
                  - nodepool-value-1
                - key: nvidia.com/gpu.imex-domain
                  operator: Exists
              - matchExpressions:
                - key: nodepool-key-2
                  operator: In
                  values:
                  - nodepool-value-2
                - key: custom.run.ai/mnnvl-key
                  operator: Exists
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    run.ai/top-owner-uid: ""
                topologyKey: nvidia.com/gpu.imex-domain
              weight: 10
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    run.ai/top-owner-uid: ""
                topologyKey: custom.run.ai/mnnvl-key
              weight: 10
        containers:
        - image: leader-image:latest
          name: leader
          resources:
            claims:
            - name: compute-domain
            limits:
              nvidia.com/gpu: "5"
        resourceClaims:
        - name: compute-domain
          resourceClaimTemplateName: cd-dinfw-test-lws
        schedulerName: runai-scheduler
    size: 2
    workerTemplate:
      metadata:
        annotations:
          runai-nodepools: mnnvl-node-1 mnnvl-node-2
        labels:
          run.ai/MNNVL: Required
          run.ai/top-owner-uid: ""
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: nodepool-key-1
                  operator: In
                  values:
                  - nodepool-value-1
                - key: nvidia.com/gpu.imex-domain
                  operator: Exists
              - matchExpressions:
                - key: nodepool-key-2
                  operator: In
                  values:
                  - nodepool-value-2
                - key: custom.run.ai/mnnvl-key
                  operator: Exists
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    run.ai/top-owner-uid: ""
                topologyKey: nvidia.com/gpu.imex-domain
              weight: 10
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    run.ai/top-owner-uid: ""
                topologyKey: custom.run.ai/mnnvl-key
              weight: 10
        containers:
        - image: worker-image:latest
          name: worker
          resources:
            claims:
            - name: compute-domain
            limits:
              nvidia.com/gpu: "9"
        resourceClaims:
        - name: compute-domain
          resourceClaimTemplateName: cd-dinfw-test-lws
        schedulerName: runai-scheduler
  replicas: 2
  rolloutStrategy:
    type: RollingUpdate
  startupPolicy: LeaderCreated
status: {}
---
apiVersion: v1beta1
kind: ComputeDomain
metadata:
  creationTimestamp: "2022-02-22T17:00:00Z"
  labels:
    app: leaderworkerset
    createdBy: LeaderWorkerSet
    project: team-a
    release: test-lws
    workloadKind: DistributedInferenceWorkload
    workloadName: test-lws
  name: dinfw-test-lws
  namespace: runai-team-a
  ownerReferences:
  - apiVersion: run.ai/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: DistributedInferenceWorkload
    name: test-lws
    uid: ""
spec:
  channel:
    resourceClaimTemplate:
      name: cd-dinfw-test-lws
  numNodes: 0
status:
  status: ""
