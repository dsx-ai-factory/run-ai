apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  annotations:
    workloadApiVersion: run.ai/v1alpha1
  creationTimestamp: "2022-02-22T17:00:00Z"
  deletionTimestamp: "2022-02-22T17:00:00Z"
  labels:
    project: team-a
    release: test-lws
    run.ai/top-owner-uid: ""
    workloadKind: DistributedInferenceWorkload
    workloadName: test-lws
  name: test-lws
  namespace: runai-team-a
spec:
  leaderWorkerTemplate:
    leaderTemplate:
      metadata:
        labels:
          run.ai/top-owner-uid: ""
      spec:
        containers:
        - image: leader-image:latest
          name: leader
          resources: {}
          volumeMounts:
          - mountPath: /etc/account
            name: secret-volume-0
          - mountPath: /etc/another
            name: secret-volume-1
        schedulerName: runai-scheduler
        volumes:
        - name: secret-volume-0
          secret:
            secretName: secret-account-key
        - name: secret-volume-1
          secret:
            secretName: secret-another-key
    size: 2
    workerTemplate:
      metadata:
        labels:
          run.ai/top-owner-uid: ""
      spec:
        containers:
        - image: worker-image:latest
          name: worker
          resources: {}
          volumeMounts:
          - mountPath: /etc/worker
            name: secret-volume-0
        schedulerName: runai-scheduler
        volumes:
        - name: secret-volume-0
          secret:
            secretName: secret-worker-key
  replicas: 1
  rolloutStrategy:
    type: RollingUpdate
  startupPolicy: LeaderCreated
status: {}
