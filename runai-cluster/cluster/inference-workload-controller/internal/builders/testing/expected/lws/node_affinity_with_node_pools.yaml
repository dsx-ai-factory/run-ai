    leaderTemplate:
      metadata:
        annotations:
          runai-nodepools: nodepoola default
        labels:
          run.ai/top-owner-uid: ""
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: key1
                  operator: In
                  values:
                  - a
                - key: test-key
                  operator: In
                  values:
                  - test-value
              - matchExpressions:
                - key: key1
                  operator: In
                  values:
                  - a
                - key: runai/node-pool
                  operator: DoesNotExist
              - matchExpressions:
                - key: key2
                  operator: Exists
                - key: test-key
                  operator: In
                  values:
                  - test-value
              - matchExpressions:
                - key: key2
                  operator: Exists
                - key: runai/node-pool
                  operator: DoesNotExist
        containers:
        - image: leader-image:latest
          name: leader
          resources: {}
        schedulerName: runai-scheduler
    size: 2
    workerTemplate:
      metadata:
        annotations:
          runai-nodepools: nodepoola default
        labels:
          run.ai/top-owner-uid: ""
      spec:
        affinity:
