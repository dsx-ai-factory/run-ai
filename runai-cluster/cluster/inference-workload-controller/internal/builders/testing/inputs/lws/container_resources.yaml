apiVersion: run.ai/v1alpha1
kind: DistributedInferenceWorkload
metadata:
  name: test-lws
  namespace: runai-team-a
spec:
  workers:
    value: 1
  replicas: 
    value: 1
leaderSpec:
  image: 
    value: leader-image:latest
  gpuDevices:
    value: 2
  gpuMemory:
    value: 100M
  cpu:
    value: "1"
  cpuLimit:
    value: "2"
  memory:
    value: 200M
  memoryLimit:
    value: 300M
workerSpec:
  image:
    value: worker-image:latest
  gpu:
    value: "0.5"
