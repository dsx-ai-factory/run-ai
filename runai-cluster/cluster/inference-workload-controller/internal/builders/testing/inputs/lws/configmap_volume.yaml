apiVersion: run.ai/v1alpha1
kind: DistributedInferenceWorkload
metadata:
  name: test-lws
  namespace: runai-team-a
spec:
  workers:
    value: 1
  replicas:
    value: 1
leaderSpec:
  image:
    value: leader-image:latest
  configMapVolumes:
    items:
      configmap-volume-leader-1:
        value:
          name: configmap-account-key
          mountPath: /etc/account
      configmap-volume-leader-2:
        value:
          name: configmap-another-key
          mountPath: /etc/another
workerSpec:
  image:
    value: worker-image:latest
  configMapVolumes:
    items:
      configmap-volume-worker:
        value:
          name: configmap-worker-key
          mountPath: /etc/worker
