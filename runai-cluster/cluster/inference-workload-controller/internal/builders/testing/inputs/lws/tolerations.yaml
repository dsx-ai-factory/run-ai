apiVersion: run.ai/v1alpha1
kind: DistributedInferenceWorkload
metadata:
  name: test-lws
  namespace: runai-team-a
spec:
  workers:
    value: 1
  replicas: 
    value: 1
leaderSpec:
  image: 
    value: leader-image:latest
  tolerations:
    items:
      tol-a:
        value:
          operator: Equal
          tolerationKey: key1
          tolerationValue: aaa
          effect: NoSchedule
      tol-b:
        value:
          operator: Exists
          tolerationKey: key2
          effect: NoExecute
      tol-c:
        value:
          operator: Equal
          tolerationKey: key3
          effect: PreferNoSchedule
      tol-d:
        value:
          tolerationKey: key4
          seconds: 5

