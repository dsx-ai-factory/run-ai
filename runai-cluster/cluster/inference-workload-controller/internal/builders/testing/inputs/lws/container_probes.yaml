apiVersion: run.ai/v1alpha1
kind: DistributedInferenceWorkload
metadata:
  name: test-lws
  namespace: runai-team-a
spec:
  workers:
    value: 1
  replicas: 
    value: 1
leaderSpec:
  image: 
    value: leader-image:latest
  readinessProbe:
    values:
      initialDelaySeconds:
        value: 1
      periodSeconds:
        value: 2
      timeoutSeconds:
        value: 3
      successThreshold:
        value: 4
      failureThreshold:
        value: 5
      httpGetPort:
        value: 8080
      httpGetPath:
        value: /ready
      httpGetScheme:
        value: HTTPS
workerSpec:
  image:
    value: worker-image:latest
