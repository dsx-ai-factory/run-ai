apiVersion: run.ai/v1alpha1
kind: DistributedInferenceWorkload
metadata:
  name: test-lws
  namespace: runai-team-a
spec:
  workers:
    value: 1
  replicas:
    value: 1
leaderSpec:
  image:
    value: leader-image:latest
  pvcs:
    items:
      pvc-existing-leader:
        value:
          path: /tmp/existing-leader
          readOnly: true
          claimName: existing-leader
          existingPvc: true
workerSpec:
  image:
    value: worker-image:latest
  pvcs:
    items:
      pvc-existing-worker:
        value:
          path: /tmp/existing-worker
          readOnly: true
          claimName: existing-worker
          existingPvc: true

