apiVersion: run.ai/v1alpha1
kind: DistributedInferenceWorkload
metadata:
  name: test-lws
  namespace: runai-team-a
spec:
  workers:
    value: 1
  replicas:
    value: 1
leaderSpec:
  image:
    value: leader-image:latest
  emptyDirVolumes:
    items:
      emptydir-leader-1:
        value:
          path: /mnt/ed-leader-1
      emptydir-leader-2:
        value:
          path: /mnt/ed-leader-2
          medium: Memory
          sizeLimit: 256Mi
workerSpec:
  image:
    value: worker-image:latest
  emptyDirVolumes:
    items:
      emptydir-worker-1:
        value:
          path: /mnt/ed-worker-1
          medium: ""
      emptydir-worker-2:
        value:
          path: /mnt/ed-worker-2
          sizeLimit: 1Gi
