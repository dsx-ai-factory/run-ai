apiVersion: run.ai/v1alpha1
kind: DistributedInferenceWorkload
metadata:
  name: test-lws
  namespace: runai-team-a
spec:
  workers:
    value: 1
  replicas:
    value: 1
leaderSpec:
  image:
    value: leader-image:latest
  secretVolumes:
    items:
      secret-volume-leader-1:
        value:
          name: secret-account-key
          mountPath: /etc/account
      secret-volume-leader-2:
        value:
          name: secret-another-key
          mountPath: /etc/another
workerSpec:
  image:
    value: worker-image:latest
  secretVolumes:
    items:
      secret-volume-worker:
        value:
          name: secret-worker-key
          mountPath: /etc/worker
