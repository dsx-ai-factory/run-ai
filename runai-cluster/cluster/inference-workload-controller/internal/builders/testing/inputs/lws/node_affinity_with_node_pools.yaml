apiVersion: run.ai/v1alpha1
kind: DistributedInferenceWorkload
metadata:
  name: test-lws
  namespace: runai-team-a
spec:
  workers:
    value: 1
  replicas: 
    value: 1
  nodePools:
    value: nodepoola default
leaderSpec:
  image: 
    value: leader-image:latest
  nodeAffinityRequired:
    nodeSelectorTerms:
      - matchExpressions:
          - key: key1
            operator: In
            values:
              - a
      - matchExpressions:
          - key: key2
            operator: Exists
workerSpec:
  image:
    value: worker-image:latest
