apiVersion: run.ai/v1alpha1
kind: DistributedInferenceWorkload
metadata:
  name: test-lws
  namespace: runai-team-a
spec:
  workers:
    value: 1
  replicas:
    value: 1
leaderSpec:
  image:
    value: leader-image:latest
  pvcs:
    items:
      pvc1-existing:
        value:
          path: /tmp/existing-1
          readOnly: true
          claimName: existing-1
          existingPvc: true
      pvc2-new:
        value:
          path: /tmp/new-1
          readOnly: false
          size: 20M
          storageClass: storage
      pvc3-existing:
        value:
          path: /tmp/existing-2
          readOnly: true
          claimName: existing-2
          existingPvc: true
      pvc4-new:
        value:
          path: /tmp/new-2
          readOnly: false
          size: 30M
          storageClass: storage

