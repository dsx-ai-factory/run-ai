apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: base1
  namespace: runai-team-a
  uid: some-interactive-uid
spec:
  usage: Submit
  image:
    value: ubuntu
  imagePullPolicy:
    value: Always
  imagePullSecrets:
    value: 'workload-secret USERCREDENTIAL:my-user-credential'
  ports:
    items:
      port-80:
        value:
          serviceType: ServingPort
          container: 80
status: {}