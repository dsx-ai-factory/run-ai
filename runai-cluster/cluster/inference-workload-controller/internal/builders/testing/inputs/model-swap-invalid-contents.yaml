apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: model-swap
  namespace: runai-team-a
spec:
  annotations:
    items:
      run.ai/inference-workload-model-swap:
        value: '{"models": ["cant use spaces/    model-1"]}'
  image:
    value: vllm/vllm-openai:latest
  gpu:
    value: "1"
  ports:
    items:
      port-4000:
        value:
          serviceType: ServingPort
          container: 4000