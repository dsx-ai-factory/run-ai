apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: ephemeral-pvc
  namespace: runai-team-a
spec:
  pvcs:
    items:
      pvc--0:
        value:
          path: /tmp/ofer
          readOnly: false
          size: 10M
          storageClass: storage
          ephemeral: true
  ports:
    items:
      port-80:
        value:
          serviceType: ServingPort
          container: 80
  usage: Submit
  image:
    value: image
  imagePullPolicy:
    value: Always
  name:
    value: ephemeral-pvc
  gpu:
    value: "1"
  username:
    value: user.name
status: {}