apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: basic-inference
  namespace: runai-team-a
spec:
  usage: Submit
  image:
    value: image
  imagePullPolicy:
    value: Always
  name:
    value: inference-0
  gpu:
    value: "1"
  gpuMemory:
    value: 120M
  cpu:
    value: "1"
  cpuLimit:
    value: "1"
  memory:
    value: "1"
  nodePools:
    value: default nodepoola
  memoryLimit:
    value: "1"
  username:
    value: guy.shaibi
  command:
    value: "tritonserver"
  arguments:
    value: "--model-store=/mnt/models -v"
  exposedUrls:
    items:
      b:
        value:
          containerPort: 3000
      c:
        value:
          containerPort: 80
          url: http://this.is.port/to/port
          customUrl: true
  tolerations:
    items:
      tol-a:
        value:
          tolerationKey: aaa
  ports:
    items:
      port-80:
        name: port-80
        value:
          serviceType: ServingPort
          container: 80
status: {}