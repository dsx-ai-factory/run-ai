apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: autoscale
  namespace: runai-team-a
spec:
  usage: Submit
  image:
    value: ubuntu
  name:
    value: autoscale-0
  memoryLimit:
    value: "1"
  username:
    value: user.name
  metric:
    value: throughput
  target:
    value: 100
  targetUtilizationPercentage:
    value: "80"
  minScale:
    value: 0
  maxScale:
    value: 5
  initialScale:
    value: 2
  activationScale:
    value: 3
  scaleToZeroRetentionSeconds:
    value: 200
  scaleDownDelaySeconds:
    value: 300
  initializationTimeoutSeconds:
    value: 400
  concurrencyHardLimit:
    value: 3
  ports:
    items:
      port-80:
        value:
          serviceType: ServingPort
          container: 80
status: {}