apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: pod-affinity
  namespace: runai-team-a
spec:
  usage: Submit
  image:
    value: image
  imagePullPolicy:
    value: Always
  name:
    value: pod-affinity
  gpu:
    value: "1"
  gpuMemory:
    value: 120M
  username:
    value: guy.shaibi
  nodePools:
    value: nodepoola
  command:
    value: "tritonserver"
  ports:
    items:
      port-80:
        value:
          serviceType: ServingPort
          container: 80
  podAffinity:
    value: true
  podAffinityTopology:
    value: pod_affinity_topology_value
  podAffinitySchedulingRule:
    value: requiredDuringSchedulingIgnoredDuringExecution
