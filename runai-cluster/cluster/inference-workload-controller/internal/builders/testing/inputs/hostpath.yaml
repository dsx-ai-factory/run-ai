apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: hostpath
  namespace: runai-team-a
spec:
  volumes:
    items:
      hostpath-1:
        value:
          sourcePath: "/source"
          targetPath: "/target"
  usage: Submit
  image:
    value: image
  imagePullPolicy:
    value: Always
  name:
    value: hostpath
  gpu:
    value: "1"
  username:
    value: user.name
  ports:
    items:
      port-80:
        value:
          serviceType: ServingPort
          container: 80
status: {}