apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: capabilities-inference
  namespace: runai-team-a
spec:
  image:
    value: image
  name:
    value: inference-0
  capabilities:
    items:
      "cap-1":
        value:
          capability: AUDIT_CONTROL
      "cap-2":
        value:
          capability: IPC_LOCK
  dropAllCapabilities:
    value: true
  runAsGid:
    value: 20
  runAsUid:
    value: 501
  runAsUser:
    value: true
  supplementalGroups:
    value: 20;12;61;79;80;81;98;33;100;204;250;395;101;399;400;701
  seccompProfileType:
    value: RuntimeDefault
  ports:
    items:
      port-80:
        name: port-80
        value:
          serviceType: ServingPort
          container: 80

