apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: model-swap
  namespace: runai-team-a
spec:
  annotations:
    items:
      run.ai/inference-workload-model-swap:
        value: '{"models": ["vendor/model-1", "vendor/model-2"], "server-type": "vllm"}'
  image:
    value: vllm/vllm-openai:latest
  arguments:
    value: --arg1 --arg2
  gpu:
    value: "1"
  cpu:
    value: "0.3"
  memory:
    value: "300M"
  ports:
    items:
      port-4000:
        value:
          serviceType: ServingPort
          container: 4000