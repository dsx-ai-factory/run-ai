apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: inference
  namespace: runai-team-a
spec:
  usage: Submit
  image:
    value: gcr.io/knative-samples/helloworld-go
  name:
    value: inference-0
  username:
    value: user.name
  configMapVolumes:
    items:
      configmap-volume-1:
        value:
          name: cm-db-setting
          mountPath: /etc/db.conf
      configmap-volume-2:
        value:
          name: cm-app-setting
          mountPath: /etc/app.conf
  ports:
    items:
      port-80:
        name: port-8080
        value:
          serviceType: ServingPort
          container: 8080
          
status: {}