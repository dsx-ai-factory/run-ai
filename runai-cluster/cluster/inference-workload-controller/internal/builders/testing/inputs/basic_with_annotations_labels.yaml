apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: basic-inference-with-annotations-labels
  namespace: runai-team-a
spec:
  usage: Submit
  image:
    value: image
  imagePullPolicy:
    value: Always
  name:
    value: inference-0
  gpu:
    value: "1"
  annotations:
    items:
      annotation-1:
        value: annotation-value-1
  labels:
    items:
      label-1:
        value: label-value-1
  username:
    value: guy.shaibi
  ports:
    items:
      port-80:
        value:
          serviceType: ServingPort
          container: 80

status: {}