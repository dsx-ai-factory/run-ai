apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: gitsync
  namespace: runai-team-a
spec:
  gitSync:
    items:
      git--tmp-repo:
        value:
          directory: /tmp/repo
          repository: http://github.com/repo
          secretName: mysecret
          authenticatingMethod: ssh-key
  usage: Submit
  image:
    value: image
  imagePullPolicy:
    value: Always
  name:
    value: gitsync
  ports:
    items:
      port-80:
        value:
          serviceType: ServingPort
          container: 80
  gpu:
    value: "1"
  username:
    value: user.name
status: {}
