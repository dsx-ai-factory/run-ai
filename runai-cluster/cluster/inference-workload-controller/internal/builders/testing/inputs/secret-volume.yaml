apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: inference
  namespace: runai-team-a
spec:
  usage: Submit
  image:
    value: gcr.io/knative-samples/helloworld-go
  name:
    value: inference-0
  username:
    value: user.name
  secretVolumes:
    items:
      secret-volume-1:
        value:
          name: secret-account-key
          mountPath: /etc/account
      secret-volume-2:
        value:
          name: secret-another-key
          mountPath: /etc/another
  ports:
    items:
      port-80:
        name: port-8080
        value:
          serviceType: ServingPort
          container: 8080
          
status: {}