apiVersion: run.ai/v2alpha1
kind: InferenceWorkload
metadata:
  name: autoscale
  namespace: runai-team-a
spec:
  usage: Submit
  image:
    value: ubuntu
  name:
    value: autoscale-0
  memoryLimit:
    value: "1"
  username:
    value: user.name
  minScale:
    value: 0
  maxScale:
    value: 5
  metric:
    value: no-such-metric
  target:
    value: 100
  ports:
    items:
      autoscale-test-port-80:
        value:
          serviceType: ServingPort
          container: 80
status: {}