      description: Filter using the Universally Unique Identifier (UUID) of the cluster.
      explode: true
      in: query
      name: clusterId
      required: false
      schema:
        example: d73a738f-fab3-430a-8fa3-5241493d7128
        format: uuid
        type: string
      style: form
    originFilter:
      description: "filter by the origin of the resource. by default, we have to list\
        \ only customer existing resources (to preserve backward compatibility) to\
        \ list both existing pvc and assets related pvcs use 'all'."
      explode: true
      in: query
      name: origin
      required: false
      schema:
        enum:
        - all
        - assets
        - existing
        type: string
      style: form
