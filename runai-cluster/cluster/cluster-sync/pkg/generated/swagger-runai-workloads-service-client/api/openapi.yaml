openapi: 3.0.3
info:
  contact:
    email: support@run.ai
    name: Run.AI
    url: https://www.run.ai/
  description: An API for managing RunAi scheduler managed workloads.
  title: WorkloadsService
  version: "1.0"
servers:
- url: https://app.run.ai
- url: https://staging.run.ai
- url: https://test.run.ai
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
