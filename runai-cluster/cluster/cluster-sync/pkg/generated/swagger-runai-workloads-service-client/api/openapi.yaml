      summary: health check
      tags:
      - Health
      x-no-authorization: true
    x-internal: true
  /internal/workloads:
    post:
      operationId: internal_create_workload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadCreationFields'
        description: The workload info in the control plane.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workload'
          description: Created successfully.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "409":
          content:
            application/json:
              example:
                code: 409
                message: Resource with this name already exists
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource already exists
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Create a workload by the control plane.
      tags:
      - Workloads
      x-internal: true
      x-no-authorization: true
