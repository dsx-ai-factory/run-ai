  /api/v1/workloads:
    get:
      operationId: get_workloads
      parameters:
      - description: "if true, return only deleted resources."
        explode: true
        in: query
        name: deleted
        required: false
        schema:
          type: boolean
        style: form
      - description: The offset from which to start fetching records.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: The limit of returned records count.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: Sort results by a descending or ascending order.
        explode: true
        in: query
        name: sortOrder
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: Sort results by a parameters.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          enum:
          - type
          - name
          - clusterId
          - projectId
          - projectName
          - departmentId
          - departmentName
          - createdAt
          - deletedAt
          - submittedBy
          - phase
          - completedAt
          type: string
        style: form
      - description: "Filter results by a parameter. Use the format field-name operator\
          \ value. Operators are == Equals, != Not equals, <= Less than or equal,\
          \ >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts\
          \ with and =$ Ends with. Dates are in ISO 8601 timestamp format and available\
          \ for operators ==, !=, <= and >=."
        explode: true
        in: query
        name: filterBy
        required: false
        schema:
          example:
          - name!=some-workload-name
          items:
            pattern: ^(type|name|clusterId|projectId|projectName|departmentId|departmentName|createdAt|deletedAt|submittedBy|phase|completedAt)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_workloads_200_response'
          description: Executed successfully.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: issuer is not familiar
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: "List workloads. [Experimental]"
      tags:
      - Workloads
      x-authorize:
        resource-type: workloads
        action: read
    post:
