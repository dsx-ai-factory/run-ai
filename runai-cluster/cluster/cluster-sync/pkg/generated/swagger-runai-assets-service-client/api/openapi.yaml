openapi: 3.0.0
info:
  contact:
    email: support@run.ai
  description: An API for managing assets
  title: Assets
  version: 2.0.0
servers:
- url: https://app.run.ai
- url: https://staging.run.ai
- url: https://test.run.ai
security:
- bearerAuth: []
tags:
- description: Assets for specifying workload compute options.
  name: Compute
- description: Credentials for accessing various services.
  name: Credentials
- description: Data source assets.
  name: Datasources
- description: Assets for specifying workload environment.
  name: Environment
- description: Assets for specifying git data sources.
  name: Git
- description: Assets for specifying host path data sources.
  name: HostPath
- description: Assets for specifying NFS path data sources.
  name: NFS
- description: Assets for specifying PVC data sources.
  name: PVC
- description: Assets for specifying S3-compatible data sources.
  name: S3
- description: A template for specifying an asset that references other assets.
  name: Template
- description: Specification for workspaces.
  name: Workspace
- description: Specification for trainings.
  name: Training
- description: Specification for workloads.
  name: Workload
- description: Internal interface for synchronizing assets between the clusters and the control plane.
  name: Synchronization
- description: Images registry to enable listing of repositories and tags.
  name: Registry
- description: Assets for specifying ConfigMap data sources.
  name: ConfigMap
paths:
  /api/v1/inference:
    post:
      description: Creates a inference workload from a given set of assets. The set must include one environment asset and can include one compute asset and multiple datasource assets.
      operationId: create_inference
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadCreationRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inference'
          description: Request completed successfully.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: issuer is not familiar
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Create inference workload.
      tags:
      - Inference
      x-no-authorization: true
  /api/v1/inference/{id}:
    get:
      description: "Retrieves the content of the inference, i.e. its set of assets and specific env. The response is similar to that of a template, so it can be loaded to the inference creation form"
      operationId: get_inference_by_id
      parameters:
      - description: Unique identifier of the inference.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          minLength: 1
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inference'
          description: Request completed successfully.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: issuer is not familiar
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                code: 404
                message: Resource id was not found
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource was not found
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get inference content.
      tags:
      - Inference
      x-no-authorization: true
  /api/v1/asset/model:
    get:
      description: Returns a list of model assets.
      operationId: list_model_assets
      parameters:
      - description: Filter results by name.
        explode: true
        in: query
        name: name
        required: false
        schema:
          type: string
        style: form
      - description: Filter results by scope.
        explode: true
        in: query
        name: scope
        required: false
        schema:
          type: string
        style: form
      - description: "Filter results by project id. if scope filter is project, only assets from the specific project will be included in the response. otherwise, the response will include both project, department, cluster and tenant assets."
        explode: true
        in: query
        name: projectId
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Filter results by department id. if scope filter is department, only assets from the specific department will be included in the response. otherwise, the response will include department, cluster and tenant scope assets."
        explode: true
        in: query
        name: departmentId
        required: false
        schema:
          type: string
        style: form
      - description: "Filter results by cluster id. if scope filter is cluster, only assets from the specific cluster will be included in the response. otherwise, the response will include cluster and tenant scope assets."
        explode: true
        in: query
        name: clusterId
        required: false
        schema:
          type: string
        style: form
      - description: Whether the query should include asset usage information as part of the response.
        explode: true
        in: query
        name: usageInfo
        required: false
        schema:
          type: boolean
        style: form
      - description: "Include workload creation compliance information of an asset, for a given project, as part of the response. To check compliance, you need to provide both project id and workload type."
        explode: true
        in: query
        name: complyToProject
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Include workload creation compliance information of an asset, for a given workload type, as part of the response. To check compliance, you need to provide both project id and workload type."
        explode: true
        in: query
        name: complyToWorkloadType
        required: false
        schema:
          enum:
          - Workspace
          - Training
          type: string
        style: form
      - description: The id of the environment to which the asset belongs.
        explode: true
        in: query
        name: environmentId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
          description: Request completed successfully.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: issuer is not familiar
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: List model assets.
      tags:
      - Model
      x-no-authorization: true
    post:
      description: Creates a model asset.
      operationId: create_model_asset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreationRequest'
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelAsset'
          description: Request accepted successfully.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: issuer is not familiar
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
