openapi: 3.0.0
info:
  title: Project and Department service API
  description: |
    The aggregated API of Run:AI backend projects and departments
  license:
    name: Run:AI
  version: 1.5.1
servers:
- url: https://app.run.ai
- url: https://staging.run.ai
- url: https://test.run.ai
security:
- bearerAuth: []
paths:
  /v1/k8s/clusters/{clusterId}/projects:
    get:
      tags:
      - Projects
      summary: List all projects.
      description: List all the projects managed by the tenant on a specific cluster.
      parameters:
      - name: clusterId
        in: path
        description: The unique uuid identifying the cluster.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
      - name: excludePermissions
        in: query
        description: filter permissions
        required: false
        style: form
        explode: true
        schema:
          type: boolean
        example: true
      responses:
        "200":
          description: A list of projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
                x-content-type: application/json
    post:
      tags:
      - Projects
      summary: Create a new project.
      description: Create a new project in the cluster. This endpoint requires EDITOR
        or RESEARCH MANAGER role.
      parameters:
      - name: clusterId
        in: path
        description: The unique uuid identifying the cluster.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
      - name: excludePermissions
        in: query
        description: filter permissions
        required: false
        style: form
        explode: true
        schema:
          type: boolean
        example: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
        required: true
      responses:
        "200":
          description: Project created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "400":
          description: Bad Project request.
        "409":
          description: Project failed to be created.
  /v1/k8s/clusters/{clusterId}/projects/{id}:
    get:
      tags:
      - Projects
      summary: Get a specific project.
      description: Get information about a specific project. This endpoint requires
        view permissions to the requested project.
      parameters:
      - name: clusterId
        in: path
        description: The unique uuid identifying the cluster.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
      - name: id
        in: path
        description: The unique project-id identifying the project.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: excludePermissions
        in: query
        description: filter permissions
        required: false
        style: form
        explode: true
        schema:
          type: boolean
        example: true
      responses:
        "200":
          description: A project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "404":
          description: Project not found.
    put:
      tags:
      - Projects
      summary: Update a project.
      description: Updates project details. This endpoint requires EDITOR or RESEARCH
        MANAGER role.
      parameters:
      - name: id
        in: path
        description: The unique project-id identifying the project.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: clusterId
        in: path
        description: The unique uuid identifying the cluster.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
      - name: excludePermissions
        in: query
        description: filter permissions
        required: false
        style: form
        explode: true
        schema:
          type: boolean
        example: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      responses:
        "200":
          description: An updated project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "404":
          description: Project not found.
        "400":
          description: Bad project request.
        "409":
          description: Could not update the project.
    delete:
      tags:
      - Projects
      summary: Delete a project.
      description: Delete a project from the cluster. This endpoint requires EDITOR
        or RESEARCH MANAGER  role.
      parameters:
      - name: clusterId
        in: path
        description: The unique uuid identifying the cluster.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
      - name: id
        in: path
        description: The unique id identifying the project.
        required: true
        style: simple
        explode: false
        schema:
          type: integer
        example: 2
      responses:
        "200":
          description: Project deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "404":
          description: Project not found.
  /v1/k8s/clusters/{clusterId}/projects/status:
    put:
      tags:
      - Projects
      summary: Update Project status
      operationId: updateProjectStatus
      parameters:
      - name: clusterId
        in: path
        description: Unique identifier of the cluster
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusRequest'
        required: true
      responses:
        "201":
          description: Project updated successfully.
        "400":
          description: Bad Project request.
        "404":
          description: Project not found.
    x-internal: true
  /v1/k8s/clusters/{clusterId}/departments/{department-id}:
    get:
      tags:
      - Departments
      summary: Get a department.
      description: Get a specific department by the ID.
      parameters:
      - name: clusterId
        in: path
        description: The unique uuid identifying the cluster.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
      - name: department-id
        in: path
        description: The unique id identifying the department.
        required: true
        style: simple
        explode: false
        schema:
          type: integer
        example: 2
      - name: excludePermissions
        in: query
        description: filter permissions
        required: false
        style: form
        explode: true
        schema:
          type: boolean
        example: true
      responses:
        "200":
          description: Departments returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
    put:
      tags:
      - Departments
      summary: Update a department.
      description: Update a department in the cluster. This endpoint requires EDITOR
        role.
      parameters:
      - name: clusterId
        in: path
        description: The unique uuid identifying the cluster.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
      - name: department-id
        in: path
        description: The unique id identifying the department.
        required: true
        style: simple
        explode: false
        schema:
          type: integer
        example: 2
      - name: excludePermissions
        in: query
        description: filter permissions
        required: false
        style: form
        explode: true
        schema:
          type: boolean
        example: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department'
        required: true
      responses:
        "200":
          description: Department updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
    delete:
      tags:
      - Departments
      summary: Delete a department.
      description: Delete a department from the cluster. This endpoint requires EDITOR
        role.
      parameters:
      - name: clusterId
        in: path
        description: The unique uuid identifying the cluster.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
      - name: department-id
        in: path
        description: The unique id identifying the department.
        required: true
        style: simple
        explode: false
        schema:
          type: integer
        example: 2
      - name: excludePermissions
        in: query
        description: filter permissions
        required: false
        style: form
        explode: true
        schema:
          type: boolean
        example: true
      responses:
        "200":
          description: Department deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
  /v1/k8s/clusters/{clusterId}/departments:
    get:
      tags:
      - Departments
      summary: Get all departments.
      description: Get list of all the department in the cluster.
      parameters:
      - name: clusterId
        in: path
        description: The unique uuid identifying the cluster.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
      - name: excludePermissions
        in: query
        description: filter permissions
        required: false
        style: form
        explode: true
        schema:
          type: boolean
        example: true
      responses:
        "200":
          description: Departments list returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
                x-content-type: application/json
    post:
      tags:
      - Departments
      summary: Create a new department.
      description: Create a new department in the cluster. This endpoint requires
        EDITOR role.
      parameters:
      - name: clusterId
        in: path
        description: The unique uuid identifying the cluster.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
      - name: excludePermissions
        in: query
        description: filter permissions
        required: false
        style: form
        explode: true
        schema:
          type: boolean
        example: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUserDefinedProperties'
        required: true
      responses:
        "200":
          description: Department created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
  /v1/k8s/clusters/{clusterId}/departments/{department-id}/access-control:
    put:
      tags:
      - Departments
      summary: Set the department admins.
      description: Set the department admins. This endpoint requires EDITOR role.
      parameters:
      - name: clusterId
        in: path
        description: The unique uuid identifying the cluster.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
      - name: department-id
        in: path
        description: The unique id identifying the department.
        required: true
        style: simple
        explode: false
        schema:
          type: integer
        example: 2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentAccessControl'
        required: true
      responses:
        "201":
          description: Department admin set successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentAccessControl'
        "400":
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    ProjectCreateRequest:
      properties:
        name:
          type: string
          description: Project Name
          example: team-a
        departmentId:
          type: integer
          description: ID of the department owning the project
          format: int32
          example: 2
        deservedGpus:
          type: number
          description: The project GPU allocation that it is deserved to get in case
            the cluster has those resources
          example: 3
        maxAllowedGpus:
          type: number
          description: An upper limit for the amount of GPUs the project can get (Even
            if over quota is allowed and resources are available)
          example: 5
        gpuOverQuotaWeight:
          maximum: 3
          minimum: 0
          type: number
          description: The priority the project gets for over quota resources
          example: 1
        swapEnabled:
          type: boolean
          description: Flag for enabling thin provisioning for jobs of this project
          example: false
        defaultNodePools:
          type: array
          description: "Default node pools for workload submission under this project\
            \ (If a workload doesnt specify node pools list, this list will be used)."
          example:
          - default
          items:
            type: string
        interactiveJobTimeLimitSecs:
          type: number
          description: A limit for the duration of interactive jobs from this project
            in seconds
          example: 3600
        interactiveJobMaxIdleDurationSecs:
          type: number
          description: Maximum time duration in seconds that interactive job can be
            idle before it will be terminated
          example: 3000
        interactivePreemptibleJobMaxIdleDurationSecs:
          type: number
          description: Maximum time duration in seconds that interactive preemptible
            job can be idle before it will be terminated
          example: 3000
        trainingJobTimeLimitSecs:
          type: number
          description: A limit for the duration of training jobs from this project
            in seconds. Available only from cluster version 2.12
          example: 3600
        trainingJobMaxIdleDurationSecs:
          type: number
          description: Maximum time duration in seconds that training job can be idle
            before it will be terminated
          example: 3000
        nodeAffinity:
          $ref: '#/components/schemas/JobsNodeAffinity'
        permissions:
          $ref: '#/components/schemas/ResourcePermissions'
        resources:
          $ref: '#/components/schemas/AssignedResources'
        nodePoolsResources:
          type: array
          description: Resources assigned to this Project per Node Pool
          items:
            $ref: '#/components/schemas/NodePoolAssignedResources'
        namespace:
          type: string
          description: The name of an existing namespace to use for the project in
            the cluster.
          example: ns-proj1
    Project:
      allOf:
      - $ref: '#/components/schemas/ProjectCreateRequest'
      - properties:
          id:
            type: integer
            description: The project id
            format: int32
            readOnly: true
            example: 5
          tenantId:
            type: integer
            description: ID of the tenant owning the project
            format: int32
            example: 2
          clusterUuid:
            type: string
            description: ID of the cluster owning the project
            format: uuid
            example: 71f69d83-ba66-4822-adf5-55ce55efd210
          departmentName:
            type: string
            description: Name of the department owning the project
            example: department-a
          interactiveNodeAffinity:
            type: string
            example: none
          trainNodeAffinity:
            type: string
            example: none
          createdAt:
            type: string
            description: The creation date of the project
            format: date-time
            example: 2021-12-14T16:04:15.099Z
          status:
            $ref: '#/components/schemas/ProjectStatus'
          phase:
            type: string
            description: project's phase
            example: Ready
    ResourcePermissions:
      properties:
        users:
          type: array
          description: Names of users that have permissions to the project
          items:
            type: string
        groups:
          type: array
          description: Names of groups that have permissions to the project
          items:
            type: string
        applications:
          type: array
          description: Names of applications that have permissions to the project
          items:
            type: string
    JobsNodeAffinity:
      properties:
        train:
          $ref: '#/components/schemas/NodeAffinity'
        interactive:
          $ref: '#/components/schemas/NodeAffinity'
    NodeAffinity:
      properties:
        affinityType:
          type: string
          description: The type of affinity of the jobs to the nodes
          enum:
          - no_limit
          - only_selected
        selectedTypes:
          type: array
          items:
            $ref: '#/components/schemas/NodeTypeForProject'
    NodeTypeForProject:
      properties:
        id:
          type: number
        name:
          type: string
    AssignedResources:
      properties:
        id:
          type: number
        gpu:
          $ref: '#/components/schemas/Resource'
        cpu:
          $ref: '#/components/schemas/Resource'
        memory:
          $ref: '#/components/schemas/Resource'
    NodePoolAssignedResources:
      properties:
        id:
          type: number
        nodePool:
          $ref: '#/components/schemas/NodePoolResources'
        gpu:
          $ref: '#/components/schemas/Resource'
        cpu:
          $ref: '#/components/schemas/Resource'
        memory:
          $ref: '#/components/schemas/Resource'
    Resource:
      properties:
        deserved:
          type: number
          description: The project resource allocation that it is deserved to get
            in case the cluster has those resources
          example: 0
        maxAllowed:
          type: number
          description: Maximum amount of resources the project can get
          example: 1000
        overQuotaWeight:
          type: number
          description: The priority the project gets for over quota resources
          example: 2
    NodePoolResources:
      properties:
        id:
          type: number
          description: node pool id
          example: 3
        name:
          type: string
          description: node pool name
          example: default
    ProjectStatusRequest:
      properties:
        status:
          type: string
          description: A json representing the project's status
          example: "{\"namespace\":\"runai-team-a\"}"
        name:
          type: string
          description: Project Name
          example: team-a
        departmentName:
          type: string
          description: name of the department owning the project
          example: default
        quotaStatuses:
          $ref: '#/components/schemas/NodePoolsQuotaStatuses'
    ProjectStatus:
      properties:
        namespace:
          type: string
          description: The namespace of the project
          example: runai-team-a
        message:
          type: string
          description: Detailed phase message
          example: NamespaceHandlerFailed
        quotaStatuses:
          $ref: '#/components/schemas/NodePoolsQuotaStatuses'
    NodePoolsQuotaStatuses:
      type: array
      description: The current quota status for each nodepool. Supported only for
        cluster versions 2.15+.
      items:
        $ref: '#/components/schemas/NodePoolQuotaStatus'
      x-schema-name: NodePoolsQuotaStatuses
    NodePoolQuotaStatus:
      properties:
        nodePoolName:
          type: string
          description: the node pool name which the current quota status refers to
        allocated:
          $ref: '#/components/schemas/QuotaStatusResourceList'
        allocatedNonPreemptible:
          $ref: '#/components/schemas/QuotaStatusResourceList'
        requested:
          $ref: '#/components/schemas/QuotaStatusResourceList'
    QuotaStatusResourceList:
      properties:
        gpu:
          type: number
          description: The number of GPUs (allocated/requested/...).
          example: 0
        cpu:
          type: number
          description: CPU in Millicores (allocated/requested/...).
          example: 1000
        memory:
          type: number
          description: Memory in Mib (allocated/requested/...).
          example: 1000
    DepartmentUserDefinedProperties:
      properties:
        name:
          type: string
          description: The name of the department.
          example: default
        deservedGpus:
          type: number
          description: Deserved GPUs for the department.
          example: 2
        allowOverQuota:
          type: boolean
          description: Is over quota allowed for the department.
          example: false
        maxAllowedGpus:
          type: number
          description: Max allowed GPUs for the department.
          example: 2
        resources:
          $ref: '#/components/schemas/AssignedResources'
        nodePoolsResources:
          type: array
          description: Resources assigned to the Department per node pool
          items:
            $ref: '#/components/schemas/NodePoolAssignedResources'
    DepartmentAccessControl:
      properties:
        departmentId:
          type: integer
          description: The unique id identifying the department.
          format: int32
          example: 2
        departmentAdmins:
          type: array
          description: Id's of users with department admin role that are assigned
            to managed the department
          items:
            type: string
      example:
        departmentId: 2
        departmentAdmins:
        - departmentAdmins
        - departmentAdmins
    Department:
      allOf:
      - $ref: '#/components/schemas/DepartmentUserDefinedProperties'
      - properties:
          tenantId:
            type: integer
            description: The tenant id this cluster belongs to.
            example: 42
          clusterUuid:
            type: string
            description: The cluster UUID this department belongs to.
            example: UUID
          createdAt:
            type: string
            description: The creation date of the department.
            format: date-time
            example: 2021-12-14T16:04:15.099Z
          id:
            type: integer
            description: The unique id identifying the department.
            format: int32
            example: 2
          projects:
            type: array
            description: Projects under this department.
            example:
            - id: 16
              name: team-a
              deserved_gpus: 3
            items:
              $ref: '#/components/schemas/Project'
          projectsDeservedGpus:
            type: string
            description: Total deserved GPUs of the projects under this department
              - as string.
            example: "3.00"
          departmentAdmins:
            type: array
            description: Id's of users with department admin role that are assigned
              to managed the department
            items:
              type: string
  parameters:
    limit:
      name: limit
      in: query
      description: The maximum number of entries to return.
      required: false
      style: form
      explode: true
      schema:
        type: integer
        format: int32
        example: 1000
    offset:
      name: offset
      in: query
      description: The offset of the first item returned in the collection.
      required: false
      style: form
      explode: true
      schema:
        type: integer
        format: int32
        example: 4000
    lastUpdated:
      name: lastUpdated
      in: query
      description: The last timestamp of the previously received items.
      required: false
      style: form
      explode: true
      schema:
        type: string
        format: date-time
        example: 2021-12-14T16:04:15.099Z
    includeDeleted:
      name: includeDeleted
      in: query
      description: True to include deleted objects in the result.
      required: false
      style: form
      explode: true
      schema:
        type: boolean
        example: false
        default: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
