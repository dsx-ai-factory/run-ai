openapi: 3.0.3
info:
  version: 1.0.0
  title: Cluster API
  description: An API for proxying k8s commands on workloads.
  contact:
    email: support@run.ai
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    x-internal: true
    get:
      summary: health check
      x-no-authorization: true
      x-runai-team: Fox
      operationId: health
      tags:
        - Health
      responses:
        '200':
          description: Executed successfully.
  /cluster-api/status:
    x-internal: true
    get:
      summary: status check
      x-no-authorization: true
      x-runai-team: Fox
      operationId: status
      tags:
        - Status
      responses:
        '200':
          description: Executed successfully.
  /cluster-api/api/v1/{projectName}/workloads/{workloadType}/{workloadFramework}/{workloadName}/status:
    get:
      summary: Get the status of a workload
      description: Get the status of a workload
      operationId: get_workload_status
      tags:
        - Cluster API
      x-runai-team: Fox
      x-no-authorization: true
      x-internal: true
      parameters:
        - $ref: '#/components/parameters/ProjectName'
        - $ref: '#/components/parameters/WorkloadType'
        - $ref: '#/components/parameters/WorkloadName'
        - $ref: '#/components/parameters/WorkloadFramework'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadStatus'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /cluster-api/api/v2/workloads/{workloadId}/object:
    get:
      summary: Get the k8s object of a workload
      description: |
        Returns a point-in-time snapshot of the workload's top-level Kubernetes custom resource, as read from the Kubernetes API server. The response is sanitized and wrapped with the retrieval timestamp.
      operationId: GetWorkloadObject
      tags:
        - K8sObject
      x-runai-team: Suricata
      x-no-authorization: true
      x-internal: true
      parameters:
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /cluster-api/api/v2/workloads/{workloadId}/pods/{podId}/object:
    get:
      summary: Get the k8s object of a pod within a workload
      description: |
        Returns a point-in-time snapshot of the Kubernetes Pod object for the specified pod belonging to a workload, as read from the Kubernetes API server. The response is sanitized and wrapped with the retrieval timestamp.
      operationId: GetPodObject
      tags:
        - K8sObject
      x-runai-team: Suricata
      x-no-authorization: true
      x-internal: true
      parameters:
        - $ref: '#/components/parameters/WorkloadId'
        - $ref: '#/components/parameters/PodId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /cluster-api/api/v2/workloads/{workloadId}/elements/{elementId}/object:
    get:
      summary: Get the k8s object of an element within a workload
      description: |
        Returns a point-in-time snapshot of the Kubernetes object for the specified element within a workload, as read from the Kubernetes API server. The response is sanitized and wrapped with the retrieval timestamp.
      operationId: GetElementObject
      tags:
        - K8sObject
      x-runai-team: Suricata
      x-no-authorization: true
      x-internal: true
      parameters:
        - $ref: '#/components/parameters/WorkloadId'
        - $ref: '#/components/parameters/ElementId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer authentication
  parameters:
    ProjectName:
      name: projectName
      in: path
      required: true
      description: The project name
      example: project1
      schema:
        type: string
    WorkloadType:
      name: workloadType
      in: path
      required: true
      description: The workload type
      schema:
        type: string
        enum:
          - workspace
          - training
          - distributed
    WorkloadName:
      name: workloadName
      in: path
      required: true
      description: The workload name
      example: jp
      schema:
        type: string
    WorkloadFramework:
      name: workloadFramework
      in: path
      required: true
      description: The workload framework
      schema:
        type: string
        enum:
          - runai
          - mpi
          - pytorch
          - tf
          - xgboost
          - any
          - jax
    WorkloadId:
      name: workloadId
      in: path
      required: true
      description: The unique identifier (UUID) of the workload.
      schema:
        type: string
        format: uuid
    PodId:
      name: podId
      in: path
      required: true
      description: The unique identifier (UUID) of the pod within the workload.
      schema:
        type: string
        format: uuid
    ElementId:
      name: elementId
      in: path
      required: true
      description: The unique identifier (UUID) of the element within the workload.
      schema:
        type: string
        format: uuid
  schemas:
    WorkloadStatus:
      type: object
      properties:
        status:
          description: Status of a workload
          type: string
          enum:
            - Creating
            - Initializing
            - Running
            - Degraded
            - Pending
            - Stopped
            - Completed
            - Failed
            - Terminating
            - Unknown
    Error:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          minimum: 100
          maximum: 599
        message:
          type: string
        details:
          type: string
      example:
        code: 400
        message: Bad request - Resource should have a name
    Object:
      type: object
      required:
        - object
        - retrievedAt
      properties:
        object:
          type: object
          additionalProperties: true
          description: The raw k8s object after sanitization (metadata.managedFields and last-applied-configuration annotation are stripped).
        retrievedAt:
          type: string
          format: date-time
          description: RFC3339 timestamp captured immediately after the k8s API server returned the object.
  responses:
    400BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Required parameter is missing
    401Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Issuer is not familiar.
    403Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: You do not have sufficient permissions.
    404NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Resource id not found.
    500InternalServerError:
      description: unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 500
            message: Something went wrong.
    503ServiceUnavailable:
      description: unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 503
            message: Please try again in few minutes.
