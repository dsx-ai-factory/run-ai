# permissions for end users to view departments.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: department-viewer-role
rules:
- apiGroups:
  - scheduling.run.ai
  resources:
  - departments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scheduling.run.ai
  resources:
  - departments/status
  verbs:
  - get
