# permissions for end users to view accessrules.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: accessrule-viewer-role
rules:
- apiGroups:
  - run.ai
  resources:
  - accessrules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - run.ai
  resources:
  - accessrules/status
  verbs:
  - get
