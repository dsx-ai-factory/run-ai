# permissions for end users to edit externalworkloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: externalworkload-editor-role
rules:
- apiGroups:
  - run.ai
  resources:
  - externalworkloads
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - run.ai
  resources:
  - externalworkloads/status
  verbs:
  - get
