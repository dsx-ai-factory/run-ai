# permissions for end users to view externalworkloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: externalworkload-viewer-role
rules:
- apiGroups:
  - run.ai
  resources:
  - externalworkloads
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - run.ai
  resources:
  - externalworkloads/status
  verbs:
  - get
