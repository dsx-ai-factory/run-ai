---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: nodepools.run.ai
spec:
  group: run.ai
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    singular: nodepool
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodePool is the Schema for the nodepools API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NodePoolSpec defines the desired state of NodePool
            properties:
              gpuNetworkAccelerationDetection:
                default: Auto
                description: |-
                  GPUNetworkAccelerationDetection is a strategy to use for GPU Network Acceleration detection,
                  possible values are: Auto (default), Use, DontUse
                enum:
                - Auto
                - Use
                - DontUse
                type: string
              gpuNetworkAccelerationLabelKey:
                default: nvidia.com/gpu.clique
                description: GPUNetworkAccelerationLabelKey - Label key by which to
                  determine GPUNetworkAccelerationDetection nodes
                type: string
              labelKey:
                description: LabelKey is the label key a node needs to have to be
                  assigned to the nodepool
                type: string
              labelValue:
                description: LabelValue is the label value a node needs to have to
                  be assigned to the nodepool
                type: string
              minGuaranteedRuntime:
                description: |-
                  MinGuaranteedRuntime - the minimum duration (e.g., 5d8h40m) that a preemptible workload is
                  guaranteed to run once scheduled and bound to a node
                type: string
              networkTopologyName:
                description: NetworkTopologyName - the name of the Topology atached
                  to the nodepool
                type: string
              numaAwareScheduling:
                description: |-
                  NumaAwareScheduling - when enabled, the Scheduler places workloads so that GPU, CPU,
                  and CPU memory are allocated within the same NUMA node where possible.
                type: boolean
              placementStrategy:
                description: PlacementStrategy is the placement scheduler strategy
                properties:
                  cpu:
                    description: Cpu scheduling strategy
                    type: string
                  gpu:
                    description: Gpu scheduling strategy for node-level placement
                    type: string
                  gpuDevice:
                    description: GpuDevice scheduling strategy for device-level placement
                      within a node
                    type: string
                type: object
              timeBasedFairShare:
                description: TimeBasedFairShare - Time-based fairshare scheduling
                  configuration
                properties:
                  decayHalfLife:
                    description: 'Set the half-life time to define the decay rate
                      of a project’s historical resource usage. The half-life defines
                      how long it takes for past usage to diminish to half of its
                      original influence on a project''s fairshare.  - 0: disables
                      decay; all historical usage is weighted equally.  - > 0: older
                      usage gradually contributes less over time (e.g., with a 24-hour
                      half-life, usage from 24 hours ago contributes 50%, from 48
                      hours ago 25%, and so on).'
                    type: string
                  enabled:
                    description: Enables time-based scheduling for the node pool.
                      When true, the Scheduler adjusts fairshare based on historical
                      resource usage over a defined time window, allowing past consumption
                      to influence scheduling order. When false, scheduling is based
                      only on the current queue state.
                    type: boolean
                  historicalUsageWeight:
                    description: 'Set the weight value that determines how a project’s
                      historical resource usage affects its fairshare.  - 0.0: Ignore
                      historical usage data (100% current usage).  - 1.0: Historical
                      usage data has higher impact, it may cause fairshare to be 0.  -
                      Values between 0.0 and 1.0 combine historical and current usage
                      to maintain a balanced fairshare  - Values above 1 will cause
                      historical usage to have an even higher impact on fairshare.'
                    type: number
                  tumblingWindowStartTime:
                    description: An RFC-3339 timestamp that defines the start time
                      for all tumbling windows. Used only when windowType = Tumbling.
                      This timestamp marks the beginning of the first fixed window,
                      and subsequent windows repeat at intervals equal to the configured
                      WindowDuration. For example, with a 7-day window, an anchor
                      of 2025-01-06T08:00:00Z produces weekly windows starting every
                      Monday at 08:00 UTC.
                    format: date-time
                    type: string
                  windowDuration:
                    description: The time period over which historical usage is evaluated.
                      Only usage within this window contributes to fairshare. For
                      sliding windows, this is a rolling period (e.g., 7d = always
                      the last 7 days). For tumbling windows, this is the cycle duration
                      before reset.
                    type: string
                  windowType:
                    description: TimeBasedFairShareWindowType defines the type of
                      time window for aggregating usage data
                    type: string
                required:
                - enabled
                type: object
            type: object
          status:
            description: NodePoolStatus defines the observed state of NodePool
            properties:
              conditions:
                description: Conditions is an array of current observed nodepool conditions.
                items:
                  description: NodeCondition contains condition information for a
                    node.
                  properties:
                    lastHeartbeatTime:
                      description: Last time we got an update on a given condition.
                      format: date-time
                      type: string
                    lastTransitionTime:
                      description: Last time the condition transit from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: Human readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: (brief) reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type of nodepool condition.
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              gpuNetworkAccelerationDetected:
                description: Signals to all relevant parties about GPUNetworkAcceleration
                  being detected in some nodepool's nodes
                type: boolean
              message:
                description: A human readable message indicating details about why
                  the nodepool is in this condition.
                type: string
              nodes:
                description: List of Nodes that are assigned to this nodepool
                items:
                  properties:
                    name:
                      type: string
                    status:
                      type: string
                    topologyMismatch:
                      description: TopologyMismatch when true - means the node missing
                        Nodepool Topology nodeLevels in its labels
                      type: boolean
                  type: object
                type: array
              phase:
                description: NodePoolPhase is the recently observed phase of the nodepool.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
