apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: runai
  annotations:
  name: runai-admission-controller
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: runai
  name: runai-admission-controller
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["namespaces"]
  verbs: ["get"]
- apiGroups: ["scheduling.run.ai"]
  resources: ["queues"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-admission-controller
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: runai-admission-controller
subjects:
- kind: ServiceAccount
  name: runai-admission-controller
  namespace: runai