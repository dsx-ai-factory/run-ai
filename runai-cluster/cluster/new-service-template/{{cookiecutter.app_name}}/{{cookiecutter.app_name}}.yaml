{%- if cookiecutter.add_project_based_rolebinding -%}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-{{cookiecutter.app_name}}-project
rules:
  - apiGroups:
      - <CHANGE_THIS>
    resources:
      - <CHANGE_THIS>
    verbs:
      - <CHANGE_THIS>
---
{% endif %}
# Run:AI {{cookiecutter.__app_name_camel_case_upper}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runai-{{cookiecutter.app_name}}
rules:
  - apiGroups:
      - run.ai
    resources:
      - <CHANGE_THIS>
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runai-{{cookiecutter.app_name}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runai-{{cookiecutter.app_name}}
subjects:
  - kind: ServiceAccount
    name: {{cookiecutter.app_name}}
    namespace: runai