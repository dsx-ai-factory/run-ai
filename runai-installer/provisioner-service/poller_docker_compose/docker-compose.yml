services:
  provisioner-service:
    image: nvcr.io/nvidia/runai/runai-provisioner:latest
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      - SECRETS_MOUNT_PATH=/etc/secrets
      - PORT=${PORT:-8080}
      - RUNAI_TLS_CERT_PATH=/var/runai/tls/tls.crt
      - RUNAI_TLS_KEY_PATH=/var/runai/tls/tls.key
      - RUNAI_CA_CHAIN_PATH=${CA_CHAIN_PATH:+/var/runai/ca/ca.crt}
      - RUNAI_WILDCARD_TLS_CERT_PATH=/var/runai/wildcard/tls.crt
      - RUNAI_WILDCARD_TLS_KEY_PATH=/var/runai/wildcard/tls.key
      - RUNAI_CLUSTER_NAME=${RUNAI_CLUSTER_NAME:-runai-cluster}
      - RUNAI_CP_VERSION=${RUNAI_CP_VERSION:-}
      - RUNAI_CLUSTER_VERSION=${RUNAI_CLUSTER_VERSION:-}
      - RUNAI_STEP_TIMEOUT_MINUTES=${RUNAI_STEP_TIMEOUT_MINUTES:-15}
    volumes:
      - ${TLS_CERT_PATH:-./runai-secrets/tls.crt}:/var/runai/tls/tls.crt:ro
      - ${TLS_KEY_PATH:-./runai-secrets/tls.key}:/var/runai/tls/tls.key:ro
      - ${CA_CHAIN_PATH:-/dev/null}:/var/runai/ca/ca.crt:ro
      - ${WILDCARD_CERT_PATH:-./runai-secrets/wildcard.crt}:/var/runai/wildcard/tls.crt:ro
      - ${WILDCARD_KEY_PATH:-./runai-secrets/wildcard.key}:/var/runai/wildcard/tls.key:ro
      - ${SECRETS_PATH:-./runai-secrets}:/etc/secrets:ro
      - ${KUBECONFIG:-./runai-secrets/kubeconfig}:/home/nonroot/.kube/config:ro

  poller:
    image: python:3.14-slim
    command: sh -c "pip install requests && python /app/poll.py"
    volumes:
      - ./poll.py:/app/poll.py:ro
    environment:
      - BASE_URL=http://provisioner-service:8080
      - DOMAIN=${DOMAIN:-}
      - WILDCARD_DOMAIN=${WILDCARD_DOMAIN:-}
      - PROVISIONING_MODE=${PROVISIONING_MODE:-}
      - KUBERNETES_DISTRIBUTION=${KUBERNETES_DISTRIBUTION:-}
      - USER_EMAIL=${USER_EMAIL:-}
      - POLL_INTERVAL=${POLL_INTERVAL:-5}
    depends_on:
      - provisioner-service
