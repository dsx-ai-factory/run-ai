dir: '{{.InterfaceDir}}/mocks'
filename: '{{.InterfaceName}}.go'
structname: 'Mock{{.InterfaceName}}'
pkgname: mocks
template: testify
packages:
  github.com/dsx-ai-factory/run-ai/runai-installer/installer/internal/prereq/components:
    interfaces:
      Prerequisite: {}
  github.com/dsx-ai-factory/run-ai/runai-installer/installer/internal/prereq/steps:
    interfaces:
      CRDChecker: {}
      TrainingOperatorExecutor: {}
  github.com/dsx-ai-factory/run-ai/runai-installer/installer/internal/step:
    interfaces:
      HelmInstaller: {}
      InstallStep: {}
  github.com/dsx-ai-factory/run-ai/runai-installer/installer/internal/tui/inputs:
    interfaces:
      Input: {}
  github.com/dsx-ai-factory/run-ai/runai-installer/installer/internal/tui/screens/common:
    interfaces:
      Options: {}
      OptionsSelector: {}
      Screen: {}
  github.com/dsx-ai-factory/run-ai/runai-installer/installer/internal/tui/screens/screen_component:
    interfaces:
      ScreenFrame:
        config:
          # Tests use the name the interface had when the mock was first generated.
          structname: MockScreenComponent
  github.com/dsx-ai-factory/run-ai/runai-installer/installer/internal/utils/cert:
    interfaces:
      CertHandler: {}
  github.com/dsx-ai-factory/run-ai/runai-installer/installer/internal/utils/helmclient:
    interfaces:
      HelmClientAPI: {}
  github.com/dsx-ai-factory/run-ai/runai-installer/installer/internal/utils/k8sclient:
    interfaces:
      K8sClients: {}
