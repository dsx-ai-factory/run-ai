version: "2"
run:
  issues-exit-code: 0
  tests: true
output:
  formats:
    text:
      path: stdout
    json:
      path: linter.json
linters:
  enable:
    - goconst
    - lll
    - mnd
    - wsl
  settings:
    lll:
      line-length: 220
      tab-width: 1
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - generated
      - third_party$
      - builtin$
      - examples$
severity:
  default: error
formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - generated
      - third_party$
      - builtin$
      - examples$
