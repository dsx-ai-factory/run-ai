accepted_risks:
  - slug: "threat-s3-sidecar-privileged-user-controlled-image"
    threat: >-
      runai-cluster/cluster/workload-common/builders/s3.go unconditionally sets
      SecurityContext.Privileged=true on every S3 filesystem sidecar and honors
      per-bucket s3bucket.Image when set, so a privileged container is created
      alongside every workload that mounts an S3 bucket, outside the Privileged
      ACL policy applied to the main workload container.
    severity: "high"
    reason: >-
      Accepted as intentional platform behavior (won't-do), not a false positive.
      Privileged mode is required for the trusted goofys FUSE mount and is called
      out in the SECURITY.md threat model (item 3). The sidecar image customers
      receive is the cluster-admin-configured goofys image from RunaiConfig /
      S3_FILE_SYSTEM_IMAGE (see DefaultS3FileSystemImage and the control-plane
      composer init_containers/s3.go, which always uses cfg.S3FsImage() and never
      a per-workload image). S3bucketItemValue.Image is reserved for internal
      purposes and is not reachable from the customer-facing workload submit /
      REST compose path (neither the CLI nor the control-plane composer sets it).
      The residual risk — a privileged sidecar on the node for S3-mounting
      workloads — is knowingly retained pending a rootless FUSE alternative.
    triaged_by: "security-team"
    date: "2026-08-23"

  - slug: "threat-device-code-grant-not-supported"
    threat: >-
      OAuth 2.0 Device Authorization Grant (device_code, RFC 8628) was evaluated
      as a login option for runai-cli to remove the manual paste-back step in
      the `runai login sso` / remote-browser flow.
      Won't-do: not implemented. identity-manager keeps
      oauth2.device.authorization.grant.enabled=false unconditionally for every
      client; no per-client-type exception has been introduced.
    severity: "medium"
    reason: >-
      Rejected due to security tradeoffs: (1) device codes
      are valid ~10 minutes vs. near-instant code exchange in the existing local-
      redirect and remote-browser flows, a materially longer interception window;
      (2) "device code phishing" is a documented real-world attack pattern
      against this grant — an attacker starts their own device-flow session and
      socially engineers a victim into approving the attacker's user_code on the
      real IdP login page, hijacking the victim's session; (3) supporting it
      would broaden identity-manager's policy surface by introducing a new
      per-client-type exception to today's strict, unconditional deny of this
      grant. The UX benefit (no copy/paste) did not outweigh these risks. If
      reconsidered, requires: verification_uri_complete, short code TTL, clear
      client-name display on the consent screen, and rate limiting on the
      device-authorization endpoint.
    triaged_by: "security-team"
    date: "2026-08-30"

suppressed_cves: []
