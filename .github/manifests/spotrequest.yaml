apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: spotrequests.egx.nvidia.io
spec:
  conversion:
    strategy: None
  group: egx.nvidia.io
  names:
    kind: SPOTRequest
    listKind: SPOTRequestList
    plural: spotrequests
    shortNames:
      - sr
    singular: spotrequest
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: Type of the SPOT Request
          jsonPath: .spec.action
          name: spot-action
          type: string
        - description: Status of the SPOTRequest CR on the backend
          jsonPath: .status.requestStatus
          name: status
          type: string
        - description: NVIDIA CloudAccount ID of the SPOTRequest in NVCF
          jsonPath: .spec.ncaId
          name: nca_id
          type: string
        - description: Age of this resource
          jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
        - description: FunctionVersionId of the SPOT Request in NVCF
          jsonPath: .spec.functionVersionId
          name: function_version_id
          type: string
      name: v1
      schema:
        openAPIV3Schema:
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
          required:
            - spec
          type: object
      served: true
      storage: true