apiVersion: runai.dgxc.nvidia.com/v1beta1
kind: RunaiAcceleratedComputeEnvironment
metadata:
  name: ${CLUSTER_NAME}
  namespace: runai-${ENV}
spec:
  csp:
    aws:
      account: "058264542444"
      availabilityZones:
        system1: us-east-1a
        system2: us-east-1b
      capacityReservation: cr-0ed0719339ddc5844
      capacityReservationZone: us-east-1e
      region: ${AWS_REGION}
    type: ${CSP_TYPE}
  environment: ${ENV}
  infra:
    cpuNodeCount: ${CPU_NODE_COUNT}
    cpuNodeMaxCount: ${CPU_NODE_COUNT}
    cpuNodeMinCount: ${CPU_NODE_COUNT}
    cpuNodeType: r5.16xlarge
    gpuNodeCount: ${GPU_NODE_COUNT}
    gpuNodeMaxCount: ${GPU_NODE_COUNT}
    gpuNodeMinCount: ${GPU_NODE_COUNT}
    gpuNodeType: p5.48xlarge
    kubernetesVersion: "${KUBERNETES_VERSION}"
    version: v1.3.0
  platform:
    version: ${RUNAI_VERSION}
  runtime:
    version: release/1.3.x
  tenant:
    admins:
    - ${ADMIN_EMAIL}
    controlPlaneDomain: staging.run.ai
    createComputeResource: true
    id: ${TENANT_ID}
    ingressCIDRs:
    - 216.228.127.130/32
    - 212.59.70.99/32
    - 44.194.246.26/32
    - 54.208.245.244/32
    - 72.44.41.26/32
    - 52.200.80.70/32
    - 75.101.213.8/32
    - 54.88.208.236/32
    - 20.102.221.80/28 
    - 52.161.51.0/28
    - 4.236.232.96/29
    - 20.99.172.200/29
    name: Run:AI MVP QA
    offboardingDate: "2099-01-02T15:04:05Z"
    onboardingDate: "2025-03-24T14:29:35Z"
    orgName: run:ai mvp qa
    realm: ${REALM}
  tier: dev0
---
apiVersion: v1
data:
  APP_ID: ${APP_ID}
  APP_SECRET: ${APP_SECRET}
kind: Secret
metadata:
  name: ${TENANT_ID}
  namespace: runai-${ENV}
type: Opaque
