name: E2E public checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'e2e/**'
      - '.github/workflows/e2e-checks.yaml'

permissions:
  contents: read

concurrency:
  group: e2e-public-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: E2E public checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: ./node_modules/.bin/eslint . --ignore-path .eslintignore --ext .ts --quiet

      - name: Type-check
        run: npm run typecheck

      - name: Run offline tests
        run: npm run test:unit
