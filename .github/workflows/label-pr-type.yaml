name: Label PR type

# Every pull request gets one type/* label taken from its title, which is what
# .github/release.yml groups the generated release notes by. Leading bracket
# tags such as "[release-3.0] " are skipped, and a "!" before the colon marks
# a breaking change:
#
#   feat(identity-manager): add ServiceAccount client type   -> type/feat
#   [release-3.0] docs: add workflow tutorial                -> type/docs
#   fix(release-3.0): initialize replica policy maps         -> type/fix
#   feat(api)!: drop the v1 workloads endpoint               -> type/breaking
#   Revert "feat(x): ..."                                    -> type/revert
#
# Manual dependency bumps get type/deps, so they sit with the Renovate updates
# at the bottom of the notes instead of among the fixes and features:
#
#   chore(deps): bump kai-resource-management to v0.18.4     -> type/deps
#   fix(frontend): bump follow-redirects to 1.16.2           -> type/deps
#   chore: bump runai-telemetry to 1.2.29 [main]             -> type/deps
#   bump runai telemetry v1.1.23                             -> type/deps
#   update KRM to 0.18.2                                     -> type/deps
#
# A bump only counts as a dependency update in an untyped, fix, chore or build
# title; "feat(...): ... bump client to v1.3.0" or "docs: update Dynamo to
# 1.5.x" keep their own type.
#
# A bump, or an otherwise untyped title, that names a security advisory (CVE,
# GHSA, BDSA) is a fix users need to see, so it gets type/fix and stays under
# Bug Fixes:
#
#   fix(go-operator): bump prometheus to clear GHSA-wg65-...  -> type/fix
#   fix CVE-2026-111943: bump all Go modules to 1.27.3        -> type/fix
#   RUN-43188: bump golang.org/x/text and x/crypto to fix CVEs -> type/fix
#
# Titles without a known prefix get no type label and show under
# "Other Changes". Renovate PRs (labelled `renovate`) are left alone; they
# already go to the dependency section.
#
# When a title is edited, the old type/* label is swapped for the new one.
# The workflow never checks out or runs PR code, so pull_request_target is safe
# here and lets PRs from forks be labelled too.

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions: {}

jobs:
  label:
    name: Label PR by title type
    if: github.event.action != 'edited' || github.event.changes.title != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const current = pr.labels.map((l) => l.name);

            if (current.includes('renovate')) {
              core.info(`#${pr.number} is a Renovate PR - no type label.`);
              return;
            }

            const TYPES = new Set([
              'feat', 'fix', 'perf', 'docs', 'refactor', 'test',
              'build', 'ci', 'chore', 'style', 'revert',
            ]);
            // Types under which "bump X" / "update X to vN" means a dependency update.
            const DEP_TYPES = new Set(['fix', 'chore', 'build']);
            const BUMP = /^(?:bump|upgrade)\b|^update\b.*(?:\bto v?\d|\bdependenc)/i;
            const SECURITY = /\b(?:CVE|GHSA|BDSA)(?:-|s\b)/i;

            const stripped = pr.title.replace(/^(?:\s*\[[^\]]*\])*\s*/, '');
            const m = stripped.match(/^([a-z]+)(?:\(([^)]*)\))?(!)?:\s*(.*)$/i);
            const known = m && TYPES.has(m[1].toLowerCase());
            const type = known ? m[1].toLowerCase() : null;
            const scope = known ? (m[2] || '') : '';
            const subject = known ? m[4] : stripped;
            // Also look past a non-conventional prefix, e.g. "fix CVE-123: bump ...".
            const lastClause = subject.split(/:\s+/).pop();

            let wanted = null;
            if (/^revert\b/i.test(stripped)) {
              wanted = 'type/revert';
            } else if (known && m[3]) {
              wanted = 'type/breaking';
            } else if (/^deps(-dev)?$/i.test(scope)
              || ((!type || DEP_TYPES.has(type)) && (BUMP.test(subject) || BUMP.test(lastClause)))) {
              wanted = SECURITY.test(pr.title) ? 'type/fix' : 'type/deps';
            } else if (type) {
              wanted = `type/${type}`;
            } else if (SECURITY.test(pr.title)) {
              wanted = 'type/fix';
            }

            for (const name of current) {
              if (name.startsWith('type/') && name !== wanted) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
              }
            }

            if (!wanted) {
              core.info(`#${pr.number} "${pr.title}" has no conventional-commit type - no label.`);
              return;
            }
            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [wanted] });
            }
            core.info(`#${pr.number} labelled ${wanted}.`);
