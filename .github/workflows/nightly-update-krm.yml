name: Nightly KRM Update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GO_VERSION: "1.26.3"
  GOPRIVATE: "github.com/run-ai/*,github.com/kai-scheduler/*"
  KRM_REPO: "kai-scheduler/kai-resource-management"
  VERSION_FILE: "runai-cluster/kai-scheduler/kai-version.yaml"

jobs:
  update-krm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_HUB_OSS }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Configure private Go module access
        run: |
          git config --global url."https://${{ secrets.GIT_HUB_OSS }}@github.com/".insteadOf "https://github.com/"

      # Tracks KRM releases, not KAI main: the scheduler version is KRM's to
      # choose now, and the update script derives our KAI Go pin from it.
      - name: Check if update is needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GIT_HUB_OSS }}
        run: |
          set -euo pipefail
          LATEST="$(gh release list --repo "${KRM_REPO}" --limit 1 \
            --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName')"
          if [ -z "$LATEST" ]; then
            echo "No published KRM release found on ${KRM_REPO}" >&2
            exit 1
          fi
          CURRENT="$(yq '.krm.chart-version' "${VERSION_FILE}")"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "KRM is already up-to-date ($CURRENT)"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update available: $CURRENT -> $LATEST"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run update script
        if: steps.check.outputs.needed == 'true'
        run: runai-cluster/kai-scheduler/update-krm-version.sh '${{ steps.check.outputs.latest }}'

      - name: Create PR with auto-merge
        id: create_pr
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GIT_HUB_OSS }}
        run: |
          set -euo pipefail
          LATEST='${{ steps.check.outputs.latest }}'

          if git diff --quiet; then
            echo "No file changes produced by the update; skipping PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="nightly/update-krm"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(deps): update KRM to ${LATEST}"
          git push --force origin "$BRANCH"

          TITLE="chore(deps): update KRM to ${LATEST}"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #${EXISTING_PR}"
            gh pr edit "$EXISTING_PR" --title "$TITLE"
          else
            gh pr create \
              --title "$TITLE" \
              --body "Automated nightly update of the \`kai-resource-management\` chart pin to ${LATEST}, via \`runai-cluster/kai-scheduler/update-krm-version.sh\`. The KAI Go module and \`kai-version.yaml\` are re-pinned to whatever that KRM release bundles, so the Go types stay in step with the deployed scheduler." \
              --base main \
              --head "$BRANCH"
            EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number')
          fi

          gh pr review "$EXISTING_PR" --approve || true
          gh pr merge "$EXISTING_PR" --auto --squash

          PR_URL=$(gh pr view "$EXISTING_PR" --json url --jq '.url')
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
