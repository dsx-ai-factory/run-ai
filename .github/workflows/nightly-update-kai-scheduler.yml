name: Nightly KAI-Scheduler Update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GO_VERSION: "1.26.3"
  GOPRIVATE: "github.com/run-ai/*,github.com/kai-scheduler/*"
  KAI_MODULE: "github.com/kai-scheduler/KAI-scheduler"
  VERSION_FILE: "runai-cluster/kai-scheduler/kai-version.yaml"

jobs:
  update-kai-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_HUB_OSS }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Configure private Go module access
        run: |
          git config --global url."https://${{ secrets.GIT_HUB_OSS }}@github.com/".insteadOf "https://github.com/"

      - name: Check if update is needed
        id: check
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          LATEST="$(cd "$tmp_dir" && go mod init kai-version-check >/dev/null 2>&1 \
            && go list -m -f '{{.Origin.Hash}}' "${KAI_MODULE}@main")"
          rm -rf "$tmp_dir"
          CURRENT="$(yq '.kai.commit-hash' "${VERSION_FILE}")"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "KAI-scheduler is already up-to-date ($CURRENT)"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update available: $CURRENT -> $LATEST"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run update script
        if: steps.check.outputs.needed == 'true'
        run: runai-cluster/kai-scheduler/update-kai-version.sh main

      - name: Create PR with auto-merge
        id: create_pr
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GIT_HUB_OSS }}
        run: |
          set -euo pipefail
          LATEST='${{ steps.check.outputs.latest }}'
          SHORT_SHA="${LATEST:0:12}"

          if git diff --quiet; then
            echo "No file changes produced by the update; skipping PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="nightly/update-kai-scheduler"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(deps): update KAI-scheduler to ${SHORT_SHA}"
          git push --force origin "$BRANCH"

          TITLE="chore(deps): update KAI-scheduler to latest main (${SHORT_SHA})"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base master --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #${EXISTING_PR}"
            gh pr edit "$EXISTING_PR" --title "$TITLE"
          else
            gh pr create \
              --title "$TITLE" \
              --body "Automated nightly update of the KAI-scheduler dependency (Go module, Helm chart, and \`kai-version.yaml\`) to the latest commit on KAI-scheduler \`main\`, via \`runai-cluster/kai-scheduler/update-kai-version.sh main\`." \
              --base master \
              --head "$BRANCH"
            EXISTING_PR=$(gh pr list --head "$BRANCH" --base master --json number --jq '.[0].number')
          fi

          gh pr review "$EXISTING_PR" --approve || true
          gh pr merge "$EXISTING_PR" --auto --squash

          PR_URL=$(gh pr view "$EXISTING_PR" --json url --jq '.url')
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
