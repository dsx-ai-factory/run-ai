name: Inference endpoint controller

on:
  pull_request:
    paths:
      - 'runai-cluster/cluster/inference-endpoint-controller/**'
      - '.github/workflows/inference-endpoint-controller.yaml'
      - 'build/makefile/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-endpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: runai-cluster/cluster/inference-endpoint-controller
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: runai-cluster/cluster/inference-endpoint-controller/go.mod
          cache-dependency-path: runai-cluster/cluster/inference-endpoint-controller/go.sum
      - name: Install Kind
        run: go install sigs.k8s.io/kind@v0.31.0
      - name: Verify generated manifests and packaged CRDs
        run: make validate
      - name: Run controller and renderer tests
        run: make test-dev
      - name: Run Kind smoke test
        run: make test-e2e
