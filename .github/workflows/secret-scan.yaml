name: Secret scan

on:
  pull_request:
    branches:
      - "master"
      - "main"
      - "v*.*"
      - "release-*.*"
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TRUFFLEHOG_VERSION: 3.96.0
  # sha256 of trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz, from the
  # release's signed checksums manifest. Bump both together.
  TRUFFLEHOG_SHA256: 7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      # Full clone. base.sha is the current base tip, not the PR's merge base, so
      # a shallow fetch never contains it and `--since-commit` cannot resolve.
      # blob:none is not an option: TruffleHog clones the workspace internally and
      # a partial clone cannot serve a promisor fetch.
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/trufflehog.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  /tmp/trufflehog.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trufflehog.tar.gz -C /tmp trufflehog
          sudo install -m 0755 /tmp/trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      - name: Scan commits in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          trufflehog git "file://$(pwd)" \
            --since-commit "$BASE_SHA" \
            --branch "$HEAD_SHA" \
            --results=verified \
            --fail \
            --fail-on-scan-errors \
            --no-update

          trufflehog git "file://$(pwd)" \
            --since-commit "$BASE_SHA" \
            --branch "$HEAD_SHA" \
            --include-detectors=PrivateKey \
            --results=verified,unknown,unverified \
            --fail \
            --fail-on-scan-errors \
            --no-update
