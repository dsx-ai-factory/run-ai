# Tags the shared packages and service clients, with the same make targets developers
# use -- they work out the next version themselves. AUTO_TAG: no prompt; apidiff decides
# -- patch for an API-compatible change, minor for a breaking one. Renovate takes patches
# only, so a minor is published but consumers move to it deliberately.
#
# When: once a week, every module changed since its last release. Nothing is tagged on
# push, so a package does not cut a release -- and fan out to every consumer -- for each
# change; whoever needs a release sooner tags it (make package-bump-version /
# client-bump-version, or a manual run of this workflow).
name: Package auto-tag

on:
  schedule:
    - cron: "0 5 * * 0"   # Sunday 05:00 UTC
  workflow_dispatch:
    inputs:
      modules:
        description: "Module directories, comma separated (e.g. runai-common-packages/cache, control-plane/audit-service/pkg/client). Empty: every module changed since its last release, as the weekly run does"
        required: false
      dry_run:
        description: "Dry run: report the tags without creating them"
        type: boolean
        default: true
      force_minor:
        description: "Force a minor release, even where apidiff finds no breaking change"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: modules
        env:
          INPUT: ${{ inputs.modules }}
        run: |
          # A package is its top-level directory; a client is its service's pkg/client.
          # Generated mocks don't change what a module ships, so they release nothing.
          to_modules() {
            grep -v '/mocks/' \
              | grep -oE '^(runai-(common|application)-packages/[^/]+|control-plane/[^/]+/pkg/client)/' \
              | sed 's#/$##' | sort -u \
              | while read -r m; do [ -f "$m/go.mod" ] && echo "$m"; done || true
          }
          # Everything changed since its last release. A module never tagged is
          # skipped: its first version is a decision.
          weekly() {
            git ls-files '*/go.mod' | to_modules \
              | while read -r m; do
                  tag=$(git tag -l "$m/v*" | grep -v -- '-dev' | sort -V | tail -1 || true)
                  if [ -n "$tag" ] && [ -n "$(git log -1 --format=%H "$tag..HEAD" -- "$m" ":(exclude,glob)$m/**/mocks/**")" ]; then echo "$m"; fi
                done
          }
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [ -z "${INPUT//[[:space:],]/}" ]; then
                modules=$(weekly)
              else
                modules=$(echo "$INPUT" | tr ',' '\n' | sed 's#[[:space:]]##g; s#/*$#/x#' | to_modules)
              fi ;;
            schedule)
              modules=$(weekly) ;;
          esac
          echo "modules=$(echo "$modules" | jq -R . | jq -sc 'map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          echo "$modules"

  tag:
    needs: scope
    if: needs.scope.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.scope.outputs.modules) }}
    # One run per module at a time. A newer queued run replaces an older one, which
    # loses nothing: the bump tags the tip of main, which includes both changes.
    concurrency:
      group: package-auto-tag-${{ matrix.module }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # A named `main` at origin/main: versioning.mk refuses to tag from anything else.
      # Runs as devops-runai, the one identity the tag rulesets let through. Not
      # GITHUB_TOKEN: a bypass for it would cover every workflow in the repository.
      # (GIT_HUB_OSS is a run-ai org token with no access to this repository.)
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.DEVOPS_RUNAI_TOKEN }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Bump ${{ matrix.module }}
        env:
          MODULE: ${{ matrix.module }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          AUTO_TAG: "1"
          FORCE_MINOR: ${{ github.event_name == 'workflow_dispatch' && inputs.force_minor && '1' || '' }}
          GOPRIVATE: github.com/run-ai/*,github.com/dsx-ai-factory/*
          TOKEN: ${{ secrets.DEVOPS_RUNAI_TOKEN }}
        run: |
          # Go fetches the repository's own modules with this; set for this step's
          # processes only, not written to the runner's git config.
          export GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="url.https://x-access-token:${TOKEN}@github.com/.insteadOf" \
            GIT_CONFIG_VALUE_0="https://github.com/"
          case "$MODULE" in
            control-plane/*/pkg/client) bump() { make -C "${MODULE%/pkg/client}" client-bump-version; } ;;
            *) bump() { make -C "$MODULE" package-bump-version; } ;;
          esac
          # versioning.mk refuses when main moved during the run, and the push that moved
          # it may not touch this module -- so catch up with main and bump again.
          for _ in 1 2 3; do
            if bump 2>&1 | tee bump.log; [ "${PIPESTATUS[0]}" -eq 0 ]; then exit 0; fi
            grep -q "not up to date with origin/main" bump.log || exit 1
            git fetch -q origin main && git reset -q --hard origin/main
          done
          exit 1
