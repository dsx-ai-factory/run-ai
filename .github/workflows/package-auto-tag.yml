# Publishes the shared Go packages. A change to runai-common-packages or
# runai-application-packages only reaches the services once the package is tagged, and
# until now that was manual -- so fixes, Renovate's included, sat unpublished while every
# consumer kept pinning the old tag (nats-server v2.11.1 via cache/v2.4.3, long after
# cache itself moved to v2.15.0).
#
# Each run tags, from the tip of main, every package with commits since its latest prod
# tag, through the same `make package-bump-version` developers use. PATCH_ONLY: only
# API-compatible changes are tagged; a breaking change stops for a person instead.
name: Package auto-tag

on:
  push:
    branches: [main]
    paths:
      - "runai-common-packages/**"
      - "runai-application-packages/**"
  workflow_dispatch:
    inputs:
      packages:
        description: "Package directories, comma separated (e.g. runai-common-packages/cache). Empty: every package with commits since its latest tag."
        required: false
        default: ""
      dry_run:
        description: "Report the tags without creating them"
        type: boolean
        default: true

permissions:
  contents: read

# One run at a time. GitHub keeps a single queued run per group and drops older ones,
# which loses nothing here: each run works out what is pending from the repository,
# not from the push that started it.
concurrency:
  group: package-auto-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # A named `main` branch at origin/main: versioning.mk refuses to tag a prod release
      # from anything else.
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GIT_HUB_OSS }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # apidiff loads the previous tag's module graph, which includes this repository's
      # own modules; they are internal, so Go has to fetch them with credentials.
      - name: Let Go fetch the repository's own modules
        env:
          TOKEN: ${{ secrets.GIT_HUB_OSS }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Tag changed packages
        env:
          PACKAGES: ${{ inputs.packages }}
          # Pushes always tag for real; a manual run defaults to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          PATCH_ONLY: "1"
          GOPRIVATE: github.com/run-ai/*,github.com/dsx-ai-factory/*
        run: bash build/scripts/package-auto-tag.sh
