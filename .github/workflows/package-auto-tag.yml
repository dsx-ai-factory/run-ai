# Tags the shared packages and service clients a push to main changed, with the same
# make targets developers use -- they work out the next version themselves. PATCH_ONLY:
# an API-compatible change is tagged as a patch; a breaking one fails the job untagged,
# for a person to decide.
name: Package auto-tag

on:
  push:
    branches: [main]
    paths:
      - "runai-common-packages/**"
      - "runai-application-packages/**"
      - "control-plane/*/pkg/client/**"
  workflow_dispatch:
    inputs:
      modules:
        description: "Module directories, comma separated (e.g. runai-common-packages/cache, control-plane/audit-service/pkg/client)"
        required: true
      dry_run:
        description: "Report the tags without creating them"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: modules
        env:
          INPUT: ${{ inputs.modules }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT" ]; then
            files=$(echo "$INPUT" | tr ',' '\n' | sed 's#[[:space:]]##g; s#/*$#/x#')
          else
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          # A package is its top-level directory; a client is its service's pkg/client.
          modules=$(echo "$files" \
            | grep -oE '^(runai-(common|application)-packages/[^/]+|control-plane/[^/]+/pkg/client)/' \
            | sed 's#/$##' | sort -u \
            | while read -r m; do [ -f "$m/go.mod" ] && echo "$m"; done)
          echo "modules=$(echo "$modules" | jq -R . | jq -sc 'map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          echo "$modules"

  tag:
    needs: scope
    if: needs.scope.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.scope.outputs.modules) }}
    # One run per module at a time. A newer queued run replaces an older one, which
    # loses nothing: the bump tags the tip of main, which includes both changes.
    concurrency:
      group: package-auto-tag-${{ matrix.module }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # A named `main` at origin/main: versioning.mk refuses to tag from anything else.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GIT_HUB_OSS }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Let Go fetch the repository's own modules
        env:
          TOKEN: ${{ secrets.GIT_HUB_OSS }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Bump ${{ matrix.module }}
        env:
          MODULE: ${{ matrix.module }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          PATCH_ONLY: "1"
          GOPRIVATE: github.com/run-ai/*,github.com/dsx-ai-factory/*
        run: |
          case "$MODULE" in
            control-plane/*/pkg/client) bump() { make -C "${MODULE%/pkg/client}" client-bump-version; } ;;
            *) bump() { make -C "$MODULE" package-bump-version; } ;;
          esac
          # versioning.mk refuses when main moved during the run, and the push that moved
          # it may not touch this module -- so catch up with main and bump again.
          for attempt in 1 2 3; do
            if bump 2>&1 | tee bump.log; [ "${PIPESTATUS[0]}" -eq 0 ]; then exit 0; fi
            grep -q "not up to date with origin/main" bump.log || exit 1
            git fetch -q origin main && git reset -q --hard origin/main
          done
          exit 1
