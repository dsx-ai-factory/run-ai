name: Label community issues

# Every issue opened by someone without write permission to this repository
# gets the `community` label when it is created. "Write permission" means the
# author's effective role here is write, maintain or admin, as reported by the
# collaborator permission API; it covers direct collaborators and team members
# alike. Organization membership on its own does not count.
#
# Issues opened by bots are left alone. The label is never removed by this
# workflow, so a maintainer may still add or drop it by hand.
#
# With the label in place, GitHub's own search is the live view, for example:
#
#   is:issue label:community                            everything from the community
#   is:issue label:community is:open                    what is waiting on us
#   is:issue label:community label:bug reason:completed closed:>=@today-14d
#                                                       escaped bugs of the last two weeks

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  label:
    name: Label issues opened from outside the team
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMUNITY_LABEL: community
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const login = issue.user.login;
            const label = process.env.COMMUNITY_LABEL;

            // `permission` is the effective base level: admin, write, read or
            // none. A maintain role reports as write and a triage role as read,
            // so this single field is enough to tell the team from everyone else.
            let permission = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: login,
              });
              permission = data.permission;
            } catch (error) {
              // Accounts GitHub cannot resolve as collaborators (deleted users,
              // some apps) return 404; they are not part of the team either.
              if (error.status !== 404) throw error;
            }

            if (permission === 'admin' || permission === 'write') {
              core.info(`#${issue.number} was opened by ${login} (${permission}) - no label.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: [label],
            });
            core.info(`Labelled #${issue.number} "${label}": ${login} has ${permission} permission.`);
