name: DCO

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dco-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.x'

      - run: "pip install --only-binary :all: dco-check==0.5.1"

      - name: Verify DCO sign-off on every PR commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dco-check \
            --verbose \
            --exclude-pattern '(renovate\[bot\]@users\.noreply\.github\.com|ci-bot@run\.ai)'
