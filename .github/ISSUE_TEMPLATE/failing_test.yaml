name: Failing test
description: Report a CI / e2e / unit test that is failing or flaky.
title: "[flake] "
labels: ["kind/flake", "triage/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for tests failing in CI on `master` or a release branch, or for tests that are flaky (pass and fail intermittently). For test failures **only on your local machine**, file a regular bug report instead.

  - type: input
    id: test-name
    attributes:
      label: Test name
      description: Fully qualified test name or the path to the test file plus the test case.
      placeholder: "e2e/scheduler/TestPreemption"
    validations:
      required: true

  - type: input
    id: workflow-url
    attributes:
      label: Failing run URL
      description: Link to the GitHub Actions run (or other CI run) where the failure was observed.
      placeholder: "https://github.com/dsx-ai-factory/run-ai/actions/runs/..."
    validations:
      required: false

  - type: input
    id: commit-sha
    attributes:
      label: Commit SHA
      description: The commit the failure was observed against. The first failing run's commit if known.
      placeholder: "abc123def"
    validations:
      required: false

  - type: dropdown
    id: failure-mode
    attributes:
      label: Failure mode
      description: How does this test fail?
      options:
        - Consistently failing (every run)
        - Flaky (passes sometimes, fails sometimes)
        - Slow / timing out
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: failure-log
    attributes:
      label: Failure log / output
      description: Paste the relevant portion of the test output. Trim to the assertion failure plus surrounding context. Use ``` fenced code blocks.
      render: shell
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: How many times have you seen this fail? Any pattern (specific runners, time of day, parallelism)? Related issues?
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](../blob/HEAD/CODE_OF_CONDUCT.md).
          required: true
