name: Documentation request or correction
description: Request new documentation, or report a problem with existing documentation.
title: "[docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the docs. If you can, include the exact page URL and the section header so maintainers can locate the issue quickly.

  - type: input
    id: page-url
    attributes:
      label: Documentation page URL
      description: Link to the docs page where the issue appears. If it's a docstring or in-repo markdown, paste the file path instead. Write "Missing" if requesting new documentation.
      placeholder: "https://docs.run.ai/..."
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What's wrong or missing?
      description: Describe the issue — incorrect information, outdated example, missing step, unclear wording, broken link, etc.
    validations:
      required: true

  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix
      description: How should it be corrected? A rewrite of the affected paragraph is ideal but optional.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Run:ai version, related pages, screenshots — anything else that helps.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same documentation problem.
          required: true
        - label: I agree to follow this project's [Code of Conduct](../blob/HEAD/CODE_OF_CONDUCT.md).
          required: true
