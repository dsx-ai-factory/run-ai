# =============================================================================
# Shared YAML anchors
# =============================================================================
# Host for the standard Go-service exclusion globs (test files, integration
# tests, mocks). The `all:` wrapper with an impossible head-branch regex
# ensures this label never fires. Do NOT create a real label named
# "_yaml_anchor_definitions" in this repo.

_yaml_anchor_definitions:
  - head-branch: '^___yaml_anchor_holder_never_matches___$'
  - changed-files:
    - all-globs-to-any-file:
      - &no-test-go '!**/*_test.go'
      - &no-tests-dir '!**/tests/**'
      - &no-integration-tests-dir '!**/integration-tests/**'
      - &no-integration_tests-dir '!**/integration_tests/**'
      - &no-mocks-dir '!**/mocks/**'
      - '!**/*'
# !**/* is needed to prevent the "no globs" case from matching all files, which would cause all PRs to be labeled with all labels that use these anchors.

