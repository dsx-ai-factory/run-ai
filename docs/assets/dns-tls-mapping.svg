  <line x1="28" y1="201" x2="732" y2="201" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="28"  cy="201" r="3.5" fill="#CBD5E1"/>
  <circle cx="732" cy="201" r="3.5" fill="#CBD5E1"/>

  <!-- ════════════════════════════════════════
       ROW 3  (y band 226–320, mid-value row: y=254, connector: y=294)
       ════════════════════════════════════════ -->

  <!-- Values -->
  <text x="114" y="254" text-anchor="middle"
        font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#1E293B">
