  <line x1="28" y1="108" x2="732" y2="108" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="28"  cy="108" r="3.5" fill="#CBD5E1"/>
  <circle cx="732" cy="108" r="3.5" fill="#CBD5E1"/>

