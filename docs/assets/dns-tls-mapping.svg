  <rect x="627" y="149" width="104" height="24" rx="12"
        fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.25"/>
  <text x="679" y="165" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#0F766E">
