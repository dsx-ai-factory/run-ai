<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320">

  <!-- White background -->
  <rect width="760" height="320" fill="#FFFFFF"/>

  <!-- ── Row backgrounds ── -->
  <rect x="0" y="40"  width="760" height="93" fill="#FFFFFF"/>
  <rect x="0" y="133" width="760" height="93" fill="#F8FAFC"/>
  <rect x="0" y="226" width="760" height="94" fill="#FFFFFF"/>

  <!-- ── Header background ── -->
  <rect x="0" y="0" width="760" height="40" fill="#F1F5F9"/>

  <!-- ── Horizontal dividers ── -->
  <line x1="0" y1="40"  x2="760" y2="40"  stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" y1="133" x2="760" y2="133" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="0" y1="226" x2="760" y2="226" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ── Vertical column dividers ── -->
  <line x1="228" y1="0" x2="228" y2="320" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="416" y1="0" x2="416" y2="320" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="598" y1="0" x2="598" y2="320" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ── Outer border ── -->
  <rect x="0.5" y="0.5" width="759" height="319" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- ════════════════════════════════════════
       COLUMN HEADERS
       Col 1 center: 114  Col 2 center: 322  Col 3 center: 507  Col 4 center: 679
       ════════════════════════════════════════ -->
  <text x="114" y="25" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">
    Request Hostname
  </text>
  <text x="322" y="25" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">
    DNS Record
  </text>
  <text x="507" y="25" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">
    TLS Certificate
  </text>
  <text x="679" y="25" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569">
    Destination
  </text>

  <!-- ════════════════════════════════════════
       ROW 1  (y band 40–133, mid-value row: y=68, connector: y=108)
       ════════════════════════════════════════ -->

  <!-- Values -->
  <text x="114" y="68" text-anchor="middle"
        font-family="'Courier New', Courier, monospace" font-size="11" fill="#1E293B">
    runai.example.com
  </text>
  <text x="322" y="68" text-anchor="middle"
        font-family="'Courier New', Courier, monospace" font-size="11" fill="#1E293B">
    runai.example.com
  </text>
  <text x="507" y="68" text-anchor="middle"
        font-family="'Courier New', Courier, monospace" font-size="11" fill="#1E293B">
    runai.example.com
  </text>

  <!-- Destination pill — blue (control plane) -->
  <rect x="613" y="56" width="132" height="24" rx="12"
        fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.25"/>
  <text x="679" y="72" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#1D4ED8">
    Run:ai control plane
  </text>

  <!-- Dashed vertical drops → connector -->
  <line x1="114" y1="74" x2="114" y2="108" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2.5"/>
  <line x1="322" y1="74" x2="322" y2="108" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2.5"/>
  <line x1="507" y1="74" x2="507" y2="108" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2.5"/>
  <line x1="679" y1="81" x2="679" y2="108" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2.5"/>

