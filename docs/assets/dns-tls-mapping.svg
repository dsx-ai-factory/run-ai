  </text>
  <text x="507" y="254" text-anchor="middle"
        font-family="'Courier New', Courier, monospace" font-size="11" fill="#1E293B">
    *.inference.example.com
  </text>

  <!-- Destination pill — purple (model endpoint) -->
  <rect x="617" y="242" width="124" height="24" rx="12"
        fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.25"/>
  <text x="679" y="258" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6D28D9">
