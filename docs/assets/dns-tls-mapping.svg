  </text>

  <!-- Dashed vertical drops → connector -->
  <line x1="114" y1="167" x2="114" y2="201" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2.5"/>
  <line x1="322" y1="167" x2="322" y2="201" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2.5"/>
  <line x1="507" y1="167" x2="507" y2="201" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2.5"/>
  <line x1="679" y1="174" x2="679" y2="201" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2.5"/>

