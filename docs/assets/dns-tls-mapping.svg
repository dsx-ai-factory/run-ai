  <!-- Dashed vertical drops → connector -->
  <line x1="114" y1="260" x2="114" y2="294" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2.5"/>
  <line x1="322" y1="260" x2="322" y2="294" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2.5"/>
  <line x1="507" y1="260" x2="507" y2="294" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2.5"/>
  <line x1="679" y1="267" x2="679" y2="294" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3,2.5"/>

  <!-- Horizontal connector -->
  <line x1="28" y1="294" x2="732" y2="294" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="28"  cy="294" r="3.5" fill="#CBD5E1"/>
  <circle cx="732" cy="294" r="3.5" fill="#CBD5E1"/>

</svg>
