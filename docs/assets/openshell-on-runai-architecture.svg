<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 470" width="1010" height="470">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1210" height="470" fill="#FFFFFF" rx="6"/>

  <!-- Title -->
  <text x="505" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">OpenShell on NVIDIA Run:ai</text>

  <!-- ── LEFT: user ── -->
  <rect x="30" y="76" width="190" height="96" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="42" y="68" width="120" height="20" rx="4" fill="#94A3B8"/>
  <text x="102" y="82" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">User (team-a)</text>
  <rect x="46" y="98" width="158" height="58" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="46" y="98" width="5" height="58" rx="4" fill="#94A3B8"/>
  <text x="127" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">openshell CLI</text>

  <!-- ── LEFT: identity provider ── -->
  <rect x="30" y="262" width="190" height="110" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="42" y="254" width="168" height="20" rx="4" fill="#94A3B8"/>
  <text x="126" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Your identity provider</text>
  <rect x="46" y="284" width="158" height="74" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="46" y="284" width="5" height="74" rx="4" fill="#94A3B8"/>
  <text x="127" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">OIDC</text>
  <text x="127" y="338" text-anchor="middle" font-size="11" fill="#64748B">Users and groups</text>

  <!-- ── CLUSTER ── -->
  <rect x="340" y="62" width="640" height="372" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 4"/>
  <rect x="352" y="54" width="250" height="20" rx="4" fill="#94A3B8"/>
  <text x="477" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Kubernetes cluster</text>

  <!-- Namespace: openshell -->
  <rect x="360" y="96" width="400" height="128" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="372" y="88" width="190" height="18" rx="4" fill="#64748B"/>
  <text x="467" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Namespace: openshell</text>

  <!-- Gateway -->
  <rect x="380" y="118" width="200" height="88" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="380" y="118" width="5" height="88" rx="4" fill="#94A3B8"/>
  <text x="482" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">OpenShell gateway</text>
  <text x="482" y="163" text-anchor="middle" font-size="11" fill="#64748B">(operator mode)</text>
  <text x="482" y="187" text-anchor="middle" font-size="10.5" fill="#64748B">Checks the token's groups claim</text>

  <!-- Workspace -->
  <rect x="612" y="118" width="128" height="88" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="612" y="118" width="5" height="88" rx="4" fill="#94A3B8"/>
  <text x="680" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">OpenShell</text>
  <text x="680" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">workspace</text>
  <text x="680" y="180" text-anchor="middle" font-size="11" fill="#64748B">runai-team-a</text>

  <!-- Namespace: runai-team-a -->
  <rect x="360" y="266" width="400" height="150" rx="8" fill="#F1F8E9" stroke="#AED581" stroke-width="1.5"/>
  <rect x="372" y="258" width="320" height="18" rx="4" fill="#8BB85B"/>
  <text x="532" y="271" text-anchor="middle" font-size="11" font-weight="600" fill="#000000" fill-opacity="0.87">NVIDIA Run:ai project namespace: runai-team-a</text>
  <text x="380" y="296" font-size="11" fill="#64748B">The user's agents (OpenShell sandbox)</text>

  <rect x="380" y="304" width="170" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="380" y="304" width="5" height="40" rx="4" fill="#94A3B8"/>
  <text x="468" y="329" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">Agent pod</text>

  <rect x="570" y="304" width="170" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="570" y="304" width="5" height="40" rx="4" fill="#94A3B8"/>
  <text x="658" y="329" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">Supervisor pod</text>

  <rect x="380" y="358" width="360" height="46" rx="8" fill="#FFFFFF" stroke="#AED581" stroke-width="1.5"/>
  <rect x="380" y="358" width="5" height="46" rx="4" fill="#AED581"/>
  <text x="560" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">NVIDIA Run:ai scheduler</text>
  <text x="560" y="394" text-anchor="middle" font-size="10.5" fill="#64748B">Schedules and monitors these pods under the project's quota</text>

  <!-- ── ARROWS ── -->
  <!-- workspace -> project namespace -->
  <line x1="680" y1="206" x2="680" y2="266" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="672" y="239" text-anchor="end" font-size="11" font-weight="600" fill="#64748B">Maps to the</text>
  <text x="672" y="253" text-anchor="end" font-size="11" font-weight="600" fill="#64748B">project namespace</text>

  <!-- CLI -> gateway: gRPC + OIDC via ingress -->
  <polyline points="204,127 290,127 290,142 380,142" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="247" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">gRPC + OIDC</text>
  <text x="247" y="124" text-anchor="middle" font-size="10.5" fill="#64748B">(via ingress)</text>

  <!-- CLI -> IdP: company sign-in -->
  <line x1="127" y1="172" x2="127" y2="254" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="139" y="206" font-size="11" font-weight="600" fill="#64748B">Company sign-in</text>
  <text x="139" y="220" font-size="10.5" fill="#64748B">(SSO)</text>

  <!-- IdP -> gateway: token -->
  <polyline points="204,321 300,321 300,175 380,175" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="252" y="313" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">Token</text>

  <!-- Model: inference workload served on NVIDIA Run:ai (inside the cluster) -->
  <rect x="790" y="96" width="170" height="128" rx="8" fill="#F1F8E9" stroke="#AED581" stroke-width="1.5"/>
  <rect x="802" y="88" width="150" height="18" rx="4" fill="#8BB85B"/>
  <text x="877" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#000000" fill-opacity="0.87">NVIDIA Run:ai project</text>
  <rect x="806" y="118" width="138" height="88" rx="8" fill="#FFFFFF" stroke="#AED581" stroke-width="1.5"/>
  <rect x="806" y="118" width="5" height="88" rx="4" fill="#AED581"/>
  <text x="878" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#000000" fill-opacity="0.87">Model endpoint</text>
  <text x="878" y="167" text-anchor="middle" font-size="10.5" fill="#64748B">Inference workload</text>

  <!-- supervisor pod -> model endpoint -->
  <polyline points="740,314 775,314 775,175 806,175" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="785" y="262" font-size="11" font-weight="600" fill="#64748B">Model API (via supervisor)</text>

  <!-- Legend -->
  <rect x="30" y="396" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="52" y="407" font-size="11" fill="#64748B">OpenShell</text>
  <rect x="30" y="418" width="14" height="14" rx="3" fill="#F1F8E9" stroke="#AED581" stroke-width="1.5"/>
  <text x="52" y="429" font-size="11" fill="#64748B">NVIDIA Run:ai</text>

  <!-- Footer note -->
  <text x="505" y="452" text-anchor="middle" font-size="11" fill="#64748B">A platform administrator creates the OpenShell workspace and adds each user to it.</text>
</svg>
