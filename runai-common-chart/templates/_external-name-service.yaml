{{- define "common.externalNameService.tpl" -}}
{{- $top := first . }}
{{- $service := index . 1 }}
{{- $obj := index . 2 }}
apiVersion: v1
kind: Service
metadata:
  {{- include "common.metadata" (list $top $obj) | nindent 2 }}
  name: {{ include "common.fullname" $top }}-{{ $obj.name }}
spec:
  type: {{ $service.type }}
  externalName: {{ $service.externalName }}
  ports:
  - port: {{ $service.port }}
{{- end }}

{{- define "common.externalNameService" -}}
{{- include "common.utils.merge" (append . "common.externalNameService.tpl") }}
{{- end }}
