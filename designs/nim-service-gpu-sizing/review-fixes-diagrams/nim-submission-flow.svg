<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1900" viewBox="0 0 2200 1900">
  <rect x="0" y="0" width="2200" height="1900" rx="0" fill="#F5F7FB" />
  <text x="70" y="74" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#132C42" text-anchor="start" dominant-baseline="central">NIM GPU type · submission flow</text>
  <text x="70" y="131" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#52677D" text-anchor="start" dominant-baseline="central">PR #3715 | CLI → policy → recommendation → persistence → node placement</text>
  <rect x="80" y="200" width="960" height="160" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="104" y="236" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">1  CLI input → canonical GPU label</text>
  <text x="104" y="281" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Tab / lookup use paginated minimal node-pool inventory.</text>
  <text x="104" y="317" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Exact match wins; unique case-insensitive match restores casing.</text>
  <polyline points="560,360 560,450" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
  <polygon points="560,450 568.0,433.0 552.0,433.0" fill="#52677D" />
  <rect x="80" y="450" width="960" height="160" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="104" y="486" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">2  API submission → policy defaults</text>
  <text x="104" y="531" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">NIM Service only. Apply project policy defaults first.</text>
  <text x="104" y="567" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">No GPU type or existing allocation → skip recommendation.</text>
  <polyline points="560,610 560,700" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
  <polygon points="560,700 568.0,683.0 552.0,683.0" fill="#52677D" />
  <rect x="80" y="700" width="960" height="190" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="104" y="736" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">3  Autosize only when needed</text>
  <text x="104" y="781" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Use project cluster + tagged image + selected GPU type.</text>
  <text x="104" y="817" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Catalog selects profile and allocation; submit adds no headroom.</text>
  <text x="104" y="853" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Pin runtime profile and optional NIMCache profile.</text>
  <polyline points="560,890 560,980" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
  <polygon points="560,980 568.0,963.0 552.0,963.0" fill="#52677D" />
  <rect x="80" y="980" width="960" height="160" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="104" y="1016" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">4  Validate final spec against policy</text>
  <text x="104" y="1061" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Validate recommended allocation after policy defaults.</text>
  <text x="104" y="1097" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Explicit resources and policy-default resources take precedence.</text>
  <polyline points="560,1140 560,1230" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
  <polygon points="560,1230 568.0,1213.0 552.0,1213.0" fill="#52677D" />
  <rect x="80" y="1230" width="960" height="160" rx="20" fill="#EAF6EF" stroke="#23784E" stroke-width="2" />
  <text x="104" y="1266" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#23784E" text-anchor="start" dominant-baseline="central">5  Persist accepted submission</text>
  <text x="104" y="1311" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Save resolved allocation and profile for later updates.</text>
  <text x="104" y="1347" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Unrelated updates do not rerun recommendation.</text>
  <polyline points="560,1390 560,1480" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
  <polygon points="560,1480 568.0,1463.0 552.0,1463.0" fill="#52677D" />
  <rect x="80" y="1480" width="960" height="160" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="104" y="1516" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">6  Compose NIMService placement</text>
  <text x="104" y="1561" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">GPU type → nodeSelector["nvidia.com/gpu.product"].</text>
  <text x="104" y="1597" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Omitted GPU type keeps existing placement behavior.</text>
  <polyline points="80,530 35,530 35,1060 80,1060" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
  <polygon points="80,1060 63.0,1052.0 63.0,1068.0" fill="#52677D" />
  <rect x="1230" y="200" width="890" height="160" rx="20" fill="#FFF0F2" stroke="#B32D42" stroke-width="2" />
  <text x="1254" y="236" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#B32D42" text-anchor="start" dominant-baseline="central">CLI error — stop</text>
  <text x="1254" y="281" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Inventory fetch failure or ambiguous casing.</text>
  <text x="1254" y="317" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Fix inventory access or use exact label casing.</text>
  <polyline points="1040,280 1230,280" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1230,280 1213.0,272.0 1213.0,288.0" fill="#52677D" />
  <rect x="1230" y="450" width="890" height="160" rx="20" fill="#EEF1F5" stroke="#52677D" stroke-width="2" />
  <text x="1254" y="486" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#52677D" text-anchor="start" dominant-baseline="central">Catalog owns recommendation policy</text>
  <text x="1254" y="531" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Profile / precision eligibility and validated multi-GPU sizing.</text>
  <text x="1254" y="567" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">One configurable 90% sharing cutoff; no extra headroom.</text>
  <rect x="1230" y="700" width="890" height="190" rx="20" fill="#FFF0F2" stroke="#B32D42" stroke-width="2" />
  <text x="1254" y="736" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#B32D42" text-anchor="start" dominant-baseline="central">Sizing error — no workload created</text>
  <text x="1254" y="781" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Invalid flags, missing result, or conflicting profile → 400.</text>
  <text x="1254" y="817" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Malformed allocation / response → 502.</text>
  <text x="1254" y="853" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Dependency HTTP error preserved; transport failure → 503.</text>
  <polyline points="1040,795 1230,795" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1230,795 1213.0,787.0 1213.0,803.0" fill="#52677D" />
  <rect x="1230" y="980" width="890" height="160" rx="20" fill="#FFF0F2" stroke="#B32D42" stroke-width="2" />
  <text x="1254" y="1016" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#B32D42" text-anchor="start" dominant-baseline="central">Policy rejection — no workload created</text>
  <text x="1254" y="1061" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Recommended allocation must satisfy policy limits.</text>
  <text x="1254" y="1097" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Example: 33 GB recommendation &gt; 20 GB maximum.</text>
  <polyline points="1040,1060 1230,1060" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1230,1060 1213.0,1052.0 1213.0,1068.0" fill="#52677D" />
  <rect x="1230" y="1480" width="890" height="160" rx="20" fill="#FFF5E0" stroke="#986313" stroke-width="2" />
  <text x="1254" y="1516" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#986313" text-anchor="start" dominant-baseline="central">Scheduler evaluates eligible nodes</text>
  <text x="1254" y="1561" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Matching nodes + available resources → placement.</text>
  <text x="1254" y="1597" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Insufficient capacity / no matching node → may stay pending.</text>
  <polyline points="1040,1560 1230,1560" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1230,1560 1213.0,1552.0 1213.0,1568.0" fill="#52677D" />
  <text x="80" y="1730" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Current implementation. Solid cards: implemented flow; gray: adjacent catalog service.</text>
  <text x="80" y="1780" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Blue: processing   Green: accepted   Amber: scheduling outcome   Red: failure</text>
  <text x="80" y="1830" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Scope: single-node autosizing. Node placement does not establish cache availability, model readiness, or runtime guarantees.</text>
</svg>