  <text x="94" y="1596" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">Automatic sizing dependency fails</text>
  <text x="94" y="1641" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">HTTP error, transport, malformed response</text>
  <rect x="790" y="1560" width="620" height="160" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="814" y="1596" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">Preserve failure category</text>
  <text x="814" y="1641" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">No fallback recommendation</text>
  <rect x="1510" y="1560" width="620" height="160" rx="20" fill="#FFF0F2" stroke="#B32D42" stroke-width="2" />
  <text x="1534" y="1596" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#B32D42" text-anchor="start" dominant-baseline="central">HTTP error / 503 / 502</text>
  <text x="1534" y="1641" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">No workload; resolve dependency failure</text>
