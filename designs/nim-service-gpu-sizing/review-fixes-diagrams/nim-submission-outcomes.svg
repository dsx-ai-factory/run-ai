  <text x="94" y="1156" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">GPU type + invalid combination</text>
  <text x="94" y="1201" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Limits only; or multi-device memory</text>
  <rect x="790" y="1120" width="620" height="160" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="814" y="1156" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">Reject unsupported request</text>
  <text x="814" y="1201" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Avoid CPU-only / lost-count manifests</text>
  <rect x="1510" y="1120" width="620" height="160" rx="20" fill="#FFF0F2" stroke="#B32D42" stroke-width="2" />
  <text x="1534" y="1156" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#B32D42" text-anchor="start" dominant-baseline="central">400 · fix resource flags</text>
  <text x="1534" y="1201" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Use whole devices or count + fraction</text>
