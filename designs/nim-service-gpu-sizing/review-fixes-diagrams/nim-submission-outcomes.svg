  <text x="70" y="195" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">INPUT</text>
  <text x="790" y="195" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">HANDLING</text>
  <text x="1510" y="195" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">RESULT</text>
  <text x="70" y="2040" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">All successful paths still pass policy and normal submission validation. Automatic multi-node sizing is rejected.</text>
  <text x="70" y="2090" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Below 90%: memory allocation. 90–100%: whole GPU. Above one-device capacity: catalog requires a validated multi-GPU profile.</text>
  <text x="70" y="2140" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Blue: processing   Green: accepted path   Amber: existing behavior   Red: failure. Solid cards describe current behavior.</text>
  <rect x="70" y="1780" width="620" height="160" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="94" y="1816" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">Clear GPU type on update</text>
  <text x="94" y="1861" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">fieldsToRemove: ["gpuType"]</text>
  <rect x="790" y="1780" width="620" height="160" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="814" y="1816" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">Remove product selector</text>
  <text x="814" y="1861" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Preserve allocation and profile</text>
  <rect x="1510" y="1780" width="620" height="160" rx="20" fill="#EAF6EF" stroke="#23784E" stroke-width="2" />
  <text x="1534" y="1816" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#23784E" text-anchor="start" dominant-baseline="central">Update accepted</text>
  <text x="1534" y="1861" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Other placement constraints still apply</text>
