  <text x="94" y="1421" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Profile mismatch; capacities disagree</text>
  <rect x="790" y="1340" width="620" height="160" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="814" y="1376" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">Reject ambiguous allocation</text>
  <text x="814" y="1421" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Selector cannot distinguish capacities</text>
  <rect x="1510" y="1340" width="620" height="160" rx="20" fill="#FFF0F2" stroke="#B32D42" stroke-width="2" />
  <text x="1534" y="1376" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#B32D42" text-anchor="start" dominant-baseline="central">400 · choose explicit resources</text>
  <text x="1534" y="1421" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Keep runtime and sizing profile consistent</text>
  <polyline points="690,1420 790,1420" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
  <polygon points="790,1420 773.0,1412.0 773.0,1428.0" fill="#52677D" />
  <polyline points="1410,1420 1510,1420" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
