  <text x="94" y="981" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Missing result or no_recommendation</text>
  <rect x="790" y="900" width="620" height="160" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="814" y="936" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">Stop automatic sizing</text>
  <text x="814" y="981" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Use catalog reason when available</text>
  <rect x="1510" y="900" width="620" height="160" rx="20" fill="#FFF0F2" stroke="#B32D42" stroke-width="2" />
  <text x="1534" y="936" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#B32D42" text-anchor="start" dominant-baseline="central">400 · no workload created</text>
  <text x="1534" y="981" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Provide explicit resources or fix sizing inputs</text>
  <polyline points="690,980 790,980" fill="none" stroke="#52677D" stroke-width="4" stroke-linejoin="round" />
  <polygon points="790,980 773.0,972.0 773.0,988.0" fill="#52677D" />
