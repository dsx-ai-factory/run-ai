apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: etcd-metrics-proxy
  namespace: runai
spec:
  selector:
    matchLabels:
      app: etcd-metrics-proxy
  template:
    metadata:
      labels:
        app: etcd-metrics-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      # hostNetwork is required: etcd serves metrics on the node's loopback (127.0.0.1:2381),
      # which is only reachable from the host network namespace. The proxy therefore shares the
      # node's network stack, and its pod IP is the node's primary IP. Prometheus scrapes that IP
      # via the headless Service below, so the listener is bound to it explicitly rather than to
      # 0.0.0.0, keeping etcd metrics off every other interface on the control-plane node.
      hostNetwork: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: socat
          image: alpine/socat:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args:
            - TCP-LISTEN:2382,bind=$(POD_IP),reuseaddr,fork
            - TCP:127.0.0.1:2381
          ports:
            - name: metrics
              containerPort: 2382
              hostPort: 2382
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-metrics-proxy
  namespace: runai
  labels:
    app: etcd-metrics-proxy
spec:
  clusterIP: None
  selector:
    app: etcd-metrics-proxy
  ports:
    - name: metrics
      port: 2382
      targetPort: 2382
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: etcd-metrics-proxy
  namespace: runai
spec:
  selector:
    matchLabels:
      app: etcd-metrics-proxy
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
