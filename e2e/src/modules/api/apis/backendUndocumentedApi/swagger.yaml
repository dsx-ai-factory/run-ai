openapi: 3.0.0
info:
    title: 'RUN:AI API'
    version: 1.0.0
    description: 'RUN:AI API for managing clusters, departments, projects and users.'
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    schemas:
        Application:
            allOf:
                - $ref: '#/components/schemas/AuthEntity'
                - properties:
                      clientId:
                          type: string
                          description: A unique id of the application.
                          example: 71f69d83-ba66-4822-adf5-55ce55efd210
                      createdAt:
                          type: string
                          description: Recent update date of the application.
                          example: '2021-12-14T16:04:15.099Z'
                      revoked:
                          type: boolean
                          description: 'If set to true, the application will be blocked from receiving authentication tokens.'
                          example: true
        AppSecret:
            properties:
                type:
                    type: string
                    enum:
                        - secret
                value:
                    type: string
                    description: the secret of the application.
                    example: 12475576-dfbf-440f-834e-d79a8fc443f7
        AuditLogRecord:
            allOf:
                - properties:
                      id:
                          type: integer
                          description: The unique id of the audit log.
                          example: 12
                      tenantId:
                          type: integer
                          description: The tenant id this cluster belongs to.
                          example: 42
                      happenedAt:
                          type: string
                          format: date-time
                          description: The date and time in which the event happened.
                          example: '2022-06-08T11:28:24.131Z'
                      action:
                          type: string
                          description: The action that was performed by the user.
                          example: Create
                      version:
                          type: string
                          description: The version of the audit log record.
                          example: 1
                      entityId:
                          type: string
                          description: The id of the action related entity.
                          example: 51
                      entityType:
                          type: string
                          description: The type of the action related entity.
                          example: Department
                      entityName:
                          type: string
                          description: The name of the action related entity.
                          example: MyDepartment123
                      sourceType:
                          type: string
                          description: The type of the source of the action.
                          example: User
                      sourceId:
                          type: string
                          description: The id of the source of the action.
                          example: 96a4382e-afa5-4604-9eb1-c3071aa021fc
                      sourceName:
                          type: string
                          description: The name of the source of the action.
                          example: test@run.ai
                      error:
                          type: string
                          description: 'In case of a failed action, the corresponding error'
                          example: '{"status":404,"description":"Cluster with uuid ''19519f4b-e3a5-45c7-9451-0def7b931546 does not exist","errorType":"BackendError"}'
                      context:
                          type: object
                          description: The context of the action.
                          example:
                              user_agent: 'Thunder Client (https://www.thunderclient.com)'
        DepartmentUserDefinedProperties:
            properties:
                name:
                    type: string
                    description: The name of the department.
                    example: default
                deservedGpus:
                    type: number
                    description: Deserved GPUs for the department.
                    example: 2
                allowOverQuota:
                    type: boolean
                    description: Is over quota allowed for the department.
                    example: false
                maxAllowedGpus:
                    type: number
                    description: Max allowed GPUs for the department.
                    example: 2
        Department:
            allOf:
                - $ref: '#/components/schemas/DepartmentUserDefinedProperties'
                - properties:
                      tenantId:
                          type: integer
                          description: The tenant id this cluster belongs to.
                          example: 42
                      clusterUuid:
                          type: string
                          description: The cluster UUID this department belongs to.
                          example: UUID
                      createdAt:
                          type: string
                          description: The creation date of the department.
                          format: date-time
                          example: '2021-12-14T16:04:15.099Z'
                      id:
                          type: integer
                          description: The unique id identifying the department.
                          example: 2
                      projects:
                          type: array
                          description: Projects under this department.
                          example:
                              - id: 16
                                name: team-a
                                deserved_gpus: 3
                      projectsDeservedGpus:
                          type: string
                          description: Total deserved GPUs of the projects under this department - as string.
                          example: '3.00'
                      resources:
                          $ref: '#/components/schemas/AssignedResources'
                          description: Resources assigned to this project
        NodeType:
            type: object
            properties:
                id:
                    type: number
                    description: The NodeType ID.
                    example: 1
                    readOnly: true
                tenantId:
                    type: number
                    description: The tenant ID.
                    example: 1
                clusterUuid:
                    type: string
                    description: The cluster UUID.
                    example: aa889d0b-4752-450c-82a6-1e451e488970
                name:
                    type: string
                    description: The NodeType name.
                    example: gpu-workers
        NodeTypes:
            type: array
            items:
                $ref: '#/components/schemas/NodeType'
        ProjectCreateRequest:
            properties:
                name:
                    type: string
                    description: Project Name
                    example: team-a
                departmentId:
                    type: number
                    description: ID of the department owning the project
                    example: 2
                deservedGpus:
                    type: number
                    description: The project GPU allocation that it is deserved to get in case the cluster has those resources
                    example: 3
                maxAllowedGpus:
                    type: number
                    description: An upper limit for the amount of GPUs the project can get (Even if over quota is allowed and resources are available)
                    example: 5
                gpuOverQuotaWeight:
                    type: number
                    description: The priority the project gets for over quota resources
                    maximum: 3
                    minimum: 0
                    example: 1
                swapEnabled:
                    type: boolean
                    description: Flag for enabling thin provisioning for jobs of this project
                    example: false
                interactiveJobTimeLimitSecs:
                    type: number
                    description: A limit for the duration of interactive jobs from this project in seconds
                    example: 3600
                nodeAffinity:
                    $ref: '#/components/schemas/JobsNodeAffinity'
                    description: Node affinity configuration for jobs of this project
                permissions:
                    $ref: '#/components/schemas/ResourcePermissions'
                    description: Permissions for users to do CRUD operations on jobs of this project
                resources:
                    $ref: '#/components/schemas/AssignedResources'
                    description: Resources assigned to this project
        Project:
            allOf:
                - $ref: '#/components/schemas/ProjectCreateRequest'
                - properties:
                      id:
                          type: number
                          description: The project id
                          readOnly: true
                          example: 5
                      tenantId:
                          type: number
                          description: ID of the tenant owning the project
                          example: 2
                      clusterUuid:
                          type: string
                          format: uuid
                          description: ID of the cluster owning the project
                          example: 71f69d83-ba66-4822-adf5-55ce55efd210
                      departmentName:
                          type: string
                          description: Name of the department owning the project
                          example: department-a
                      createdAt:
                          type: string
                          description: The creation date of the project
                          format: date-time
                          example: '2021-12-14T16:04:15.099Z'
        ResourcePermissions:
            properties:
                users:
                    type: array
                    items:
                        type: string
                    description: Names of users that have permissions to the project
                groups:
                    type: array
                    items:
                        type: string
                    description: Names of groups that have permissions to the project
        JobsNodeAffinity:
            properties:
                train:
                    $ref: '#/components/schemas/NodeAffinity'
                    description: Node affinity configuration for train jobs
                interactive:
                    $ref: '#/components/schemas/NodeAffinity'
                    description: Node affinity configuration for interactive jobs
        NodeAffinity:
            properties:
                affinityType:
                    type: string
                    enum:
                        - no_limit
                        - only_selected
                    description: The type of affinity of the jobs to the nodes
                selectedTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/NodeTypeForProject'
        NodeTypeForProject:
            properties:
                id:
                    type: number
                name:
                    type: string
        AssignedResources:
            properties:
                gpu:
                    $ref: '#/components/schemas/Resource'
                    description: GPU resources assigned to the project
                cpu:
                    $ref: '#/components/schemas/Resource'
                    description: CPU resources assigned to the project
                memory:
                    $ref: '#/components/schemas/Resource'
                    description: The memory assigned to the project
        Resource:
            properties:
                deserved:
                    type: number
                    description: The project resource allocation that it is deserved to get in case the cluster has those resources
                    example: 3
                maxAllowed:
                    type: number
                    description: Maximum amount of resources the project can get
                    example: 1000
                overQuotaWeight:
                    type: number
                    description: The priority the project gets for over quota resources
                    example: 2
        ChangeDepartmentFromTo:
            properties:
                tenantId:
                    type: number
                    description: ID of the tenant owning the project
                    example: 2
                clusterUuid:
                    type: string
                    format: uuid
                    description: ID of the cluster owning the project
                    example: 71f69d83-ba66-4822-adf5-55ce55efd210
                from:
                    type: array
                    items:
                        type: string
                        format: uuid
                    description: an array of department IDs owning the projects that are about to move
                    example:
                        - 71f69d83-ba66-4822-adf5-55ce55efd210
                        - a89799c8-4912-403c-9e59-2413aa08fe76
                to:
                    type: string
                    format: uuid
                    description: ID of the destination department to move the projects to
                    example: ef4f423c-8672-45b5-a812-2ff1655b7dae
        Role:
            type: string
            enum:
                - admin
                - researcher
                - editor
                - viewer
                - research-manager
        AuthEntityType:
            type: string
            description: The type of authentication entity.
            enum:
                - regular-user
                - sso-user
                - app
                - group
                - internal-user
                - super-admin
            example: app
        AuthEntity:
            properties:
                entityType:
                    $ref: '#/components/schemas/AuthEntityType'
                tenantId:
                    type: integer
                    description: The tenant id this application belongs to.
                    example: 42
                userId:
                    type: string
                    description: Identifier of the service user account related to the application. It is used by the system for authorization purposes.
                    example: 0bec043c-4ed9-49de-85ca-5718181146b1
                permittedClusters:
                    type: array
                    description: A list of clusters that the user or application can access.
                    items:
                        type: string
                roles:
                    type: array
                    items:
                        $ref: '#/components/schemas/Role'
                name:
                    type: string
                    description: Identifier of the user or application.
                    example: myname
                createdAt:
                    type: string
                    description: The creation date of the application.
                    example: '2021-12-14T16:04:15.099Z'
        User:
            allOf:
                - $ref: '#/components/schemas/AuthEntity'
                - properties:
                      email:
                          type: string
                          description: Email address of the user.
                          example: user@email.com
                      needToChangePassword:
                          type: boolean
                          description: True if the user is requested to change his password upon next login.
                          example: true
                      password:
                          type: string
                          description: The user's password.
                          example: secret!123
                      lastLogin:
                          type: string
                          format: date-time
                          description: The last time the user logged into the system.
                          example: '2021-12-14T16:04:15.099Z'
        ChecksumResponse:
            properties:
                description:
                    type: string
                md5Hash:
                    type: string
                crc32c:
                    type: string
        Error:
            required:
                - code
                - message
            properties:
                code:
                    type: integer
                    format: int32
                message:
                    type: string
        Cluster:
            properties:
                uuid:
                    type: string
                    description: The cluster ID.
                    example: 067afc1b-8806-4ade-8bbd-e5a0c47a39a2
                createdAt:
                    type: string
                    description: The cluster's creation date.
                    example: '2021-12-14T16:04:15.099Z'
                domain:
                    type: string
                    description: The cluster's url.
                    example: 'https://my-cluster.com'
                tenantId:
                    type: number
                    format: integer
                    description: The tenant id this cluster belongs to.
                    example: 42
                name:
                    type: string
                    description: The cluster's name.
                    example: 'MY RUN:AI cluster'
                description:
                    type: string
                    description: The cluster's name.
                    example: deep-learning cluster*
                version:
                    type: string
                    description: "The cluster's  RUN:AI version."
                    example: 2.0.58
        CreateCluster:
            required:
                - name
            properties:
                name:
                    type: string
                    example: cluster-a
                description:
                    type: string
                    example: group-a-cluster
        DisplayedJob:
            type: object
            properties:
                JobId:
                    type: string
                    format: uuid
                    description: Unique identifier of the job.
                podGroupId:
                    type: string
                    format: uuid
                    description: Unique identifier of the pod group.
                jobName:
                    type: string
                    description: The name of the job.
                    example: job-0
                jobType:
                    type: string
                clusterId:
                    type: string
                    description: Unique identifier of the cluster.
                status:
                    type: string
                imageName:
                    type: string
                    description: The name of the image executed by the pod.
                    example: tensorflow
                user:
                    type: string
                    description: The owner of the job.
                project:
                    type: string
                    description: The project that the pod group belongs to.
                nodeId:
                    type: string
                    description: Unique identifier of the node.
                creationTime:
                    type: string
                    description: Creation time of the job.
                completionTime:
                    type: string
                    description: Completion time of the job.
                totalRuntime:
                    type: string
                totalWaitTime:
                    type: string
                pending:
                    type: number
                running:
                    type: number
                parallelism:
                    type: number
                completions:
                    type: number
                failed:
                    type: number
                succeeded:
                    type: number
                currentAllocatedGPUs:
                    type: number
                currentAllocatedGPUsMemory:
                    type: number
                currentRequestedGPUs:
                    type: number
                totalRequestedGPUs:
                    type: number
                requestedGPUsPerPodGroup:
                    type: number
                requestedGPUsMemoryPerPodGroup:
                    type: number
                parentWorkloadName:
                    type: string
                totalRequestedMemory:
                    type: number
                totalRequestedCPU:
                    type: number
                totalLimitCPU:
                    type: number
                totalLimitMemory:
                    type: number
                workloadKind:
                    type: number
                    description: Specifies the kind of k8s resource that owns the pod group.
                    example: runaijob
                cliCommand:
                    type: string
                requestedMigDevices:
                    type: string
                dynamicData:
                    type: object
                existsInCluster:
                    type: boolean
                isJupyter:
                    type: boolean
                    default: false
                    description: 'If true, it indicates that the pod group runs jupyter notebook.'
                jobUrl:
                    type: string
        DisplayedJobs:
            type: array
            items:
                $ref: '#/components/schemas/DisplayedJob'
        GrafanaResponse:
            title: GrafanaResponse
            x-stoplight:
                id: yme8j8tqb7zvs
            type: object
            properties:
                status:
                    type: string
                data:
                    $ref: '#/components/schemas/GrafanaData'
        GrafanaData:
            title: GrafanaData
            x-stoplight:
                id: 6iughv8suo79l
            type: object
            properties:
                resultType:
                    type: string
                result:
                    type: array
                    items:
                        $ref: '#/components/schemas/GrafanaResult'
        GrafanaResult:
            title: GrafanaResult
            x-stoplight:
                id: w6th0ga7bywu9
            type: object
            properties:
                metric:
                    $ref: '#/components/schemas/GrafanaMetric'
                value:
                    type: array
                    items:
                        type:
                            - string
                            - number
        GrafanaMetric:
            title: GrafanaMetric
            x-stoplight:
                id: 69s33nwrt4e3n
            type: object
            properties:
                __name__:
                    type: string
                clusterId:
                    type: string
                gpu:
                    type: string
                node:
                    type: string
                receive:
                    type: string
                tenant_id:
                    type: string
    parameters:
        version:
            in: path
            name: version
            description: 'run:ai version (semantic version)'
            required: true
            schema:
                type: string
                pattern: '^(v(0|[1-9]\\d*))\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$'
        os:
            in: path
            name: os
            description: The operating system
            required: true
            schema:
                type: string
                enum:
                    - linux
                    - darwin
        clusterId:
            name: clusterUuid
            required: true
            in: path
            schema:
                type: string
                format: uuid
                description: Unique identifier of the cluster.
        uuid:
            in: path
            name: uuid
            description: Unique identifier of the cluster
            required: true
            schema:
                type: string
                format: uuid
        jobId:
            name: jobId
            in: path
            description: Unique identifier of the job (UUID)
            required: true
            schema:
                type: string
                format: uuid
        podGroupId:
            name: podGroupId
            in: path
            description: Unique identifier of the podGroup (UUID)
            required: true
            schema:
                type: string
                format: uuid
    responses:
        BadRequest:
            description: Bad request.
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        NotFound:
            description: The specified resource was not found
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        serviceUnavailable:
            description: unexpected error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
        OK:
            description: OK
            content:
                application/json:
                    schema:
                        type: string
                        format: text
        CLIReleaseResponse:
            description: Get the CLI Release
            content:
                application/x-tar:
                    schema:
                        type: string
                        format: binary
        ChecksumResponse:
            description: return an object with hashes of a file for validation
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ChecksumResponse'
        Unauthorized:
            description: Unauthorized
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
security:
    - bearerAuth: []
paths:
    /v1/k8s/audit:
        get:
            tags:
                - Audit
            summary: Get audit logs
            description: Get audit logs based on query params filter
            parameters:
                - in: query
                  name: start
                  schema:
                      type: string
                  required: false
                  description: 'Starting date for audit logs retrieval. format yyyy-MM-dd for date yyyy-MM-ddTHH:mm:ss for date-time.'
                  example: '2022-06-07T09:01:02'
                - in: query
                  name: end
                  schema:
                      type: string
                  required: false
                  description: 'Ending date for audit logs retrieval. format yyyy-MM-dd for date yyyy-MM-ddTHH:mm:ss for date-time.'
                  example: '2022-06-07T09:01:02'
                - in: query
                  name: action
                  schema:
                      type: string
                  required: false
                  description: The action of the logged operation.
                  example: Create
                - in: query
                  name: source_type
                  schema:
                      type: string
                  required: false
                  description: The type of the source of the action.
                  example: User
                - in: query
                  name: source_id
                  schema:
                      type: string
                  required: false
                  description: The id of the source of the action.
                  example: 96a4382e-afa5-4604-9eb1-c3071aa021fc
                - in: query
                  name: source_name
                  schema:
                      type: string
                  required: false
                  description: The name of the source of the action.
                  example: test@run.ai
                - in: query
                  name: entity_type
                  schema:
                      type: string
                  required: false
                  description: The type of the action related entity.
                  example: Department
                - in: query
                  name: entity_id
                  schema:
                      type: string
                  required: false
                  description: The id of the action related entity.
                  example: 51
                - in: query
                  name: limit
                  schema:
                      type: integer
                  required: false
                  description: The quantity of records to fetch. (Default is 40)
                  example: 20
                - in: query
                  name: offset
                  schema:
                      type: integer
                  required: false
                  description: The offset from which to start fetching records.
                  example: 10
                - in: query
                  name: success
                  schema:
                      type: string
                  required: false
                  description: enter true for success audits and false for failures (leave blank for all)
                  example: true
                - in: query
                  name: download
                  schema:
                      type: string
                  required: false
                  description: enter true to download the logs into logs.json file
                  example: true
            responses:
                '200':
                    description: Filtered audit logs returned successfully
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/AuditLogRecord'
    '/v1/k8s/clusters/{clusterId}/departments/{department-id}':
        get:
            tags:
                - Departments
            summary: Get a department.
            description: Get a specific department by the ID.
            parameters:
                - in: path
                  name: clusterId
                  schema:
                      type: string
                  required: true
                  description: The unique uuid identifying the cluster.
                  example: 9f55255e-11ed-47c7-acef-fc4054768dbc
                - in: path
                  name: department-id
                  schema:
                      type: integer
                  required: true
                  description: The unique id identifying the department.
                  example: 2
            responses:
                '200':
                    description: Departments returned successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Department'
        put:
            tags:
                - Departments
            summary: Update a department.
            description: Update a department in the cluster. This endpoint requires EDITOR role.
            parameters:
                - in: path
                  name: clusterId
                  schema:
                      type: string
                  required: true
                  description: The unique uuid identifying the cluster.
                  example: 9f55255e-11ed-47c7-acef-fc4054768dbc
                - in: path
                  name: department-id
                  schema:
                      type: integer
                  required: true
                  description: The unique id identifying the department.
                  example: 2
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Department'
            responses:
                '200':
                    description: Department updated successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Department'
        delete:
            tags:
                - Departments
            summary: Delete a department.
            description: Delete a department from the cluster. This endpoint requires EDITOR role.
            parameters:
                - in: path
                  name: clusterId
                  schema:
                      type: string
                  required: true
                  description: The unique uuid identifying the cluster.
                  example: 9f55255e-11ed-47c7-acef-fc4054768dbc
                - in: path
                  name: department-id
                  schema:
                      type: integer
                  required: true
                  description: The unique id identifying the department.
                  example: 2
            responses:
                '200':
                    description: Department deleted successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Department'
    '/v1/k8s/clusters/{clusterId}/departments':
        get:
            tags:
                - Departments
            summary: Get all departments.
            description: Get list of all the department in the cluster.
            parameters:
                - in: path
                  name: clusterId
                  schema:
                      type: string
                  required: true
                  description: The unique uuid identifying the cluster.
                  example: 9f55255e-11ed-47c7-acef-fc4054768dbc
            responses:
                '200':
                    description: Departments list returned successfully.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Department'
        post:
            tags:
                - Departments
            summary: Create a new department.
            description: Create a new department in the cluster. This endpoint requires EDITOR role.
            parameters:
                - in: path
                  name: clusterId
                  schema:
                      type: string
                  required: true
                  description: The unique uuid identifying the cluster.
                  example: 9f55255e-11ed-47c7-acef-fc4054768dbc
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DepartmentUserDefinedProperties'
            responses:
                '200':
                    description: Department created successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Department'
    '/v1/k8s/clusters/{clusterId}/nodetypes':
        parameters:
            - $ref: '#/components/parameters/clusterId'
        get:
            tags:
                - NodeTypes
            summary: Get all cluster's NodeTypes.
