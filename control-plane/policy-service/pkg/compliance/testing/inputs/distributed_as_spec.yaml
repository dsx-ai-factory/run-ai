master:
  image: master_image

  annotations:
    - name: master_name1
      value: master_value1
    - name: master_name2
      exclude: true

  compute:
    cpuCoreLimit: 2.0
    extendedResources:
      - resource: nvidia/gpu
        quantity: 2M
      - resource: nvidia/cpu
        quantity: "3"

worker:
  image: worker_image

  annotations:
    - name: worker_name1
      value: worker_value1
    - name: worker_name2
      exclude: true

  compute:
    cpuCoreLimit: 5.0
    extendedResources:
      - resource: nvidia/gpu
        quantity: 10M
      - resource: nvidia/cpu
        quantity: "30"

  storage:
    pvc: null
