meta:
  scope: project
  projectId: 4500001
  name: my-policy
policy:
  defaults:
    image: ubuntu
    compute:
      cpuCoreRequest: 1
      cpuMemoryRequest: "1Gi"
  rules:
    image:
      options:
        - value: ubuntu
        - value: redhat
      required: true
      canEdit: false
    compute:
      # numeric bounds (number/integer rules) -> Range
      cpuCoreRequest:
        min: 0.5
        max: 8
        step: 0.5
        required: true
      gpuDevicesRequest:
        min: 1
        max: 4
      # quantity bounds (quantity rules) -> QuantityRange
      cpuMemoryRequest:
        min: "100Mi"
        max: "4Gi"
      # boolean field prevented from being set -> Blocked
      largeShmRequest:
        blocked: true
