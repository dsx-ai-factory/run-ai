  name: my-policy
policy:
  defaults:
    master:
      image: ubuntu
    worker:
      image: redhat
  rules:
    master:
      image:
        options:
          - value: ubuntu
          - value: ubuntu/latest
        required: true
        canEdit: false
    worker:
      image:
        options:
          - value: redhat
          - value: redhat/latest
        required: false
        canEdit: true