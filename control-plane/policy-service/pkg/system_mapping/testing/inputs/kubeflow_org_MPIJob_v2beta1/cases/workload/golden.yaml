apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  annotations:
    example.com/annotation: test-value
  labels:
    app: mpi-test
  name: test
spec:
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        metadata: {}
        spec:
          containers:
          - image: mpioperator/mpi-horovod:2.0
            name: mpi
          initContainers:
          - image: mpioperator/mpi-horovod:2.0
            name: init
    Worker:
      replicas: 2
      template:
        metadata: {}
        spec:
          containers:
          - image: mpioperator/mpi-horovod:2.0
            name: mpi
          initContainers:
          - image: mpioperator/mpi-horovod:2.0
            name: init
  runPolicy:
    activeDeadlineSeconds: 86400
    backoffLimit: 3
    cleanPodPolicy: Running
    suspend: false
    ttlSecondsAfterFinished: 3600
  slotsPerWorker: 2
