# Minimal valid apps/Deployment/v1 manifest used as the starting point for
# every Layer 3+4 case under cases/.
#
# Why these particular fields are pre-populated:
#
#   - containers[0].image and initContainers[0].image are set to the
#     placeholder "placeholder" so the skeleton itself validates against
#     the K8s OpenAPI schema (image is a required field). The container
#     case overrides both to the real value via SET rules.
#
#   - Container names are "test" so parameterised spec selectors
#     (appContainerByName / initContainerByName) match. No case currently
#     uses those selectors, but they are part of the mapping and the
#     skeleton is shared across every case.
#
# Note: selector.matchLabels and template.metadata.labels are populated by
# the workload policy case via matchLabelsSelector and labels fields.
# They MUST agree for K8s API server validation.
#
# The selector:{} stub is required because K8s OpenAPI schema requires
# selector for Deployment; without it, container/pod cases that don't
# SET selector fields would fail validation.
#
# Note: template.metadata is NOT pre-populated here. The podMetadata spec
# selector has a dependency declaration that ensures .spec.template.metadata
# is created automatically before SET actions execute.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test
spec:
  selector: {}
  template:
    spec:
      containers:
        - name: test
          image: placeholder
      initContainers:
        - name: test
          image: placeholder
