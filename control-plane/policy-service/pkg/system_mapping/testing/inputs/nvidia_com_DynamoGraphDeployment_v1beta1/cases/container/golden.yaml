apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: test-dynamo
spec:
  components:
  - name: component-a
    podTemplate:
      spec:
        containers:
        - image: placeholder
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              nvidia.com/gpu: "1"
        - image: placeholder
          imagePullPolicy: IfNotPresent
          name: sidecar
        initContainers:
        - image: placeholder
          imagePullPolicy: IfNotPresent
          name: init
        serviceAccountName: custom-sa
    replicas: 0
    type: worker
  - name: component-b
    podTemplate:
      spec:
        containers:
        - image: placeholder
          imagePullPolicy: IfNotPresent
          name: main
          resources:
            limits:
              nvidia.com/gpu: "1"
        - image: example/sidecar:test
          imagePullPolicy: IfNotPresent
          name: sidecar
        initContainers:
        - image: example/init:test
          imagePullPolicy: IfNotPresent
          name: init
    replicas: 1
    type: worker
  - name: component-c
    replicas: 1
    type: worker
  - multinode:
      nodeCount: 2
    name: component-d
    replicas: 1
    roles:
    - name: leader
      podTemplate:
        spec:
          containers:
          - image: placeholder
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              limits:
                nvidia.com/gpu: "1"
          - image: placeholder
            imagePullPolicy: IfNotPresent
            name: sidecar
          initContainers:
          - image: placeholder
            imagePullPolicy: IfNotPresent
            name: init
    - name: worker
      podTemplate:
        spec:
          containers:
          - image: placeholder
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              limits:
                nvidia.com/gpu: "1"
          - image: placeholder
            imagePullPolicy: IfNotPresent
            name: sidecar
          initContainers:
          - image: placeholder
            imagePullPolicy: IfNotPresent
            name: init
    type: worker
