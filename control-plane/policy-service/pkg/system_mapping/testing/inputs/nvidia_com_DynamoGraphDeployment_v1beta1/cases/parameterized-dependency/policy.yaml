description: Dynamo v1beta1 parameterized-dependency policy regression.
effectiveRules:
  - field: serviceAccountName
    specSelector: componentPodSpec
    selectorParams:
      componentName: component-c
    enforcements:
      - set:
          value: inference-sa
  - field: priorityClassName
    specSelector: componentPodSpec
    selectorParams:
      componentName: component-c
    enforcements:
      - set:
          value: high-priority
  - field: labels
    specSelector: componentPodMetadata
    selectorParams:
      componentName: component-c
    enforcements:
      - set:
          key: app
          value: inference
