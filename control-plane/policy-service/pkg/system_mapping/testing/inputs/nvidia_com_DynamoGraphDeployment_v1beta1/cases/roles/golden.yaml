apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: test-dynamo
spec:
  components:
  - name: component-a
    podTemplate:
      spec:
        containers:
        - image: placeholder
          name: main
        - image: placeholder
          name: sidecar
        initContainers:
        - image: placeholder
          name: init
        serviceAccountName: custom-sa
    replicas: 0
    type: worker
  - name: component-b
    podTemplate:
      spec:
        containers:
        - image: placeholder
          name: main
        - image: placeholder
          name: sidecar
        initContainers:
        - image: placeholder
          name: init
    replicas: 1
    type: worker
  - name: component-c
    replicas: 1
    type: worker
  - multinode:
      nodeCount: 2
    name: component-d
    replicas: 1
    roles:
    - name: leader
      podTemplate:
        metadata:
          labels:
            app: role-worker
        spec:
          containers:
          - image: placeholder
            imagePullPolicy: Always
            name: main
          - image: example/role-sidecar:test
            name: sidecar
          initContainers:
          - image: example/role-init:test
            name: init
          serviceAccountName: role-service-account
    - name: worker
      podTemplate:
        metadata:
          labels:
            app: role-worker
        spec:
          containers:
          - image: placeholder
            imagePullPolicy: Always
            name: main
          - image: example/role-sidecar:test
            name: sidecar
          initContainers:
          - image: example/role-init:test
            name: init
          serviceAccountName: role-service-account
    type: worker
