description: |
  Layer 3 case "container" for ray.io/RayService/v1. SETs podSpecContainer FG
  fields on every container (head + worker, app + init) via the
  non-parameterized allContainers selector.
effectiveRules:
  - field: image
    specSelector: allContainers
    enforcements: [{ set: { value: "rayproject/ray:2.11.0" } }]
  - field: imagePullPolicy
    specSelector: allContainers
    enforcements: [{ set: { value: IfNotPresent } }]
  - field: resourceLimits
    specSelector: allContainers
    enforcements: [{ set: { key: cpu, value: "4" } }]
  - field: resourceLimits
    specSelector: allContainers
    enforcements: [{ set: { key: memory, value: "8Gi" } }]
  - field: resourceRequests
    specSelector: allContainers
    enforcements: [{ set: { key: cpu, value: "2" } }]
  - field: runAsNonRoot
    specSelector: allContainers
    enforcements: [{ set: { value: true } }]
