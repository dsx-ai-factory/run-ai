# Minimal valid ray.io/RayService/v1 manifest used as the starting point for
# every Layer 3+4 case under cases/.
#
# RayService wraps a RayCluster under .spec.rayClusterConfig (head + workers).
# No submitter pod (unlike RayJob).
#
# Schema-required (per components.schemas.io.ray.v1.RayService):
#   - spec.rayClusterConfig
#   - rayClusterConfig.headGroupSpec.template
#   - rayClusterConfig.workerGroupSpecs[*].{groupName,minReplicas,maxReplicas,template}
#
# Engine-required stubs (SET cannot create intermediate paths):
#   - rayClusterConfig.workerGroupSpecs[0].rayStartParams: {} — worker case
#     SETs entries here
#   - rayClusterConfig.workerGroupSpecs[0].template.metadata: {} — worker case
#     SETs labels on the worker pod template
#
# minReplicas: 0 is intentional — see RayCluster skeleton.
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: test
spec:
  rayClusterConfig:
    headGroupSpec:
      template:
        spec:
          initContainers:
            - name: test
              image: placeholder-head-init
          containers:
            - name: test
              image: placeholder-head
    workerGroupSpecs:
      - groupName: test
        minReplicas: 0
        maxReplicas: 1
        rayStartParams: {}
        template:
          metadata: {}
          spec:
            initContainers:
              - name: test
                image: placeholder-worker-init
            containers:
              - name: test
                image: placeholder-worker
