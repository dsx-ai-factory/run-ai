apiVersion: kubeflow.org/v1
kind: XGBoostJob
metadata:
  name: test
spec:
  xgbReplicaSpecs:
    Master:
      replicas: 1
      template:
        metadata: {}
        spec:
          containers:
          - image: xgboost/xgboost:1.7.0
            imagePullPolicy: IfNotPresent
            name: xgboost
            resources:
              limits:
                cpu: "4"
                memory: 8Gi
              requests:
                cpu: "2"
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
          initContainers:
          - image: xgboost/xgboost:1.7.0
            imagePullPolicy: IfNotPresent
            name: init
            resources:
              limits:
                cpu: "4"
                memory: 8Gi
              requests:
                cpu: "2"
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
    Worker:
      replicas: 2
      template:
        metadata: {}
        spec:
          containers:
          - image: xgboost/xgboost:1.7.0
            imagePullPolicy: IfNotPresent
            name: xgboost
            resources:
              limits:
                cpu: "4"
                memory: 8Gi
              requests:
                cpu: "2"
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
          initContainers:
          - image: xgboost/xgboost:1.7.0
            imagePullPolicy: IfNotPresent
            name: init
            resources:
              limits:
                cpu: "4"
                memory: 8Gi
              requests:
                cpu: "2"
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
