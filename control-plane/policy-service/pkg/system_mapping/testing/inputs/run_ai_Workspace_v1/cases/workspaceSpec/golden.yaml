apiVersion: run.ai/v1
kind: Workspace
metadata:
  name: test
spec:
  annotations:
  - name: description
    value: annotated-by-all
  args: --verbose
  autoDeletionTimeAfterCompletionSeconds: 3600
  backoffLimit: 3
  category: training
  command: python main.py
  compute:
    cpuCoreLimit: 2
    cpuCoreRequest: 1
    cpuMemoryLimit: 2Gi
    cpuMemoryRequest: 1Gi
    extendedResources:
    - quantity: "2"
      resource: nvidia.com/gpu
    gpuDevicesRequest: 1
    gpuMemoryLimit: 8Gi
    gpuMemoryRequest: 4Gi
    gpuPortionLimit: 1
    gpuPortionRequest: 0.5
    gpuRequestType: portion
    largeShmRequest: true
  createHomeDir: true
  environmentVariables:
  - description: described-by-name
    name: ENV_VAR
    value: env-set-for-all
  exposedUrls:
  - authorizationType: authorizedGroups
    authorizedGroups:
    - group-a
    authorizedUsers:
    - user@example.com
    container: 8080
    name: web
    toolName: jupyter
    toolType: jupyter-notebook
    url: https://test.example.com
  image: test-image:latest
  imagePullPolicy: Always
  imagePullSecrets:
  - name: registry-secret
    userCredential: false
  labels:
  - name: app
    value: test-set-by-name
  nodeAffinityRequired:
    nodeSelectorTerms:
    - matchExpressions:
      - key: example.com/zone
        operator: In
        values:
        - us-west
  nodePools:
  - pool-1
  - pool-2
  nodeType: gpu
  podAffinity:
    key: kubernetes.io/hostname
    type: Required
  ports:
  - container: 8080
    external: 80
    name: http
    serviceType: NodePort
    toolName: jupyter
    toolType: jupyter-notebook
  preemptibility: preemptible
  priorityClass: high-priority
  probes:
    readiness:
      failureThreshold: 3
      handler:
        httpGet:
          path: /healthz
          port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 1
  relatedUrls:
  - name: docs
    type: external
    url: https://docs.example.com
  restartPolicy: Never
  security:
    allowPrivilegeEscalation: false
    capabilities:
    - NET_ADMIN
    hostIpc: false
    hostNetwork: false
    privileged: false
    readOnlyRootFilesystem: false
    runAsGid: 1000
    runAsNonRoot: true
    runAsUid: 1000
    seccompProfileType: RuntimeDefault
    supplementalGroups: 1000,2000
    uidGidSource: custom
  stdin: false
  storage:
    configMapVolume:
    - configMap: my-configmap
      defaultMode: "0644"
      mountPath: /etc/config-2
      name: config
      subPath: config.yaml
    dataVolume:
    - id: 123e4567-e89b-12d3-a456-426614174000
      mountPath: /mnt/data-2
    emptyDirVolume:
    - medium: Memory
      name: scratch
      path: /scratch
      sizeLimit: 2Gi
    git:
    - branch: release
      name: code-repo
      passwordSecret: git-secret
      path: /workspace/repo
      repository: https://github.com/example/repo
      revision: HEAD
      secretKeyOfPassword: password
      secretKeyOfUser: username
      secretRef:
        authenticationMethod: password
        name: git-secret-ref
        secretKeyOfPassword: password
        secretKeyOfUser: username
    hostPath:
    - mountPath: /mnt/host
      mountPropagation: None
      name: host-data
      path: /var/data
      readOnly: true
    nfs:
    - mountPath: /mnt/nfs
      name: nfs-share
      path: /export
      readOnly: true
      server: nfs.example.com
    pvc:
    - claimInfo:
        accessModes:
          readOnlyMany: false
          readWriteMany: false
          readWriteOnce: true
        addedAttrValues:
        - key: extra
          value: val
        size: 1G
        storageClass: standard
        volumeMode: Filesystem
      dataSharing: true
      ephemeral: false
      existingPvc: false
      name: data-pvc
      path: /data
      readOnly: true
    - claimName: existing-claim
      existingPvc: true
      name: existing-pvc
      path: /existing
      readOnly: true
    s3:
    - accessKeySecret: s3-secret
      awsSessionToken: token-secret
      bucket: my-bucket
      name: s3-bucket
      path: /datasets
      secretKeyOfAccessKeyId: access-key-id
      secretKeyOfSecretKey: secret-key
      url: https://s3.amazonaws.com
    secretVolume:
    - defaultMode: "0644"
      mountPath: /etc/secrets-2
      name: secrets
      secret: my-secret
  terminateAfterPreemption: false
  terminationGracePeriodSeconds: 30
  tolerations:
  - effect: NoExecute
    key: nvidia.com/gpu
    name: gpu-toleration
    operator: Equal
    seconds: 3600
    value: "true"
  tty: false
  workingDir: /app
