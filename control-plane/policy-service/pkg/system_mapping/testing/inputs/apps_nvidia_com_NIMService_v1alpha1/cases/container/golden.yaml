apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: test
spec:
  args:
  - --config=/etc/nim/config.yaml
  authSecret: placeholder
  command:
  - /opt/nim/start.sh
  env:
  - name: AS_VALUE
    value: somevalue
  - name: FROM_CM
    valueFrom:
      configMapKeyRef:
        key: key
        name: cm
        optional: false
  - name: FROM_FIELD
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: metadata.name
  - name: FROM_RESOURCE
    valueFrom:
      resourceFieldRef:
        containerName: test
        divisor: "1"
        resource: limits.cpu
  - name: FROM_SECRET
    valueFrom:
      secretKeyRef:
        key: key
        name: secret
        optional: false
  image:
    pullPolicy: IfNotPresent
    pullSecrets:
    - my-pull-secret
    repository: nvcr.io/nim/llm
    tag: 1.0.0
  resources:
    limits:
      cpu: "2"
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 4Gi
