# Minimal valid ray.io/RayCluster/v1 manifest used as the starting point for
# every Layer 3+4 case under cases/.
#
# Schema-required (per components.schemas.io.ray.v1.RayCluster):
#   - spec.headGroupSpec
#   - spec.headGroupSpec.template
#   - spec.workerGroupSpecs[*].groupName / minReplicas / maxReplicas / template
#
# Engine-required stubs (SET cannot create intermediate paths):
#   - workerGroupSpecs[0].rayStartParams: {} — worker case SETs entries here
#     (keyValueMap into a missing parent path produces a flat patch, not nested)
#   - workerGroupSpecs[0].template.metadata: {} — worker case SETs labels and
#     annotations on the worker pod template
#
# Container names are "test" (the default sentinel sampleArgs uses) so the
# *ContainerByName parameterised selectors match.
#
# minReplicas: 0 is intentional — the worker case SETs it to 1 and the test
# would otherwise pass even if the SET were silently dropped.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: test
spec:
  headGroupSpec:
    template:
      spec:
        initContainers:
          - name: test
            image: placeholder-head-init
        containers:
          - name: test
            image: placeholder-head
  workerGroupSpecs:
    - groupName: test
      minReplicas: 0
      maxReplicas: 1
      rayStartParams: {}
      template:
        metadata: {}
        spec:
          initContainers:
            - name: test
              image: placeholder-worker-init
          containers:
            - name: test
              image: placeholder-worker
