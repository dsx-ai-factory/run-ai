apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: test
spec:
  headGroupSpec:
    template:
      spec:
        containers:
        - image: rayproject/ray:2.11.0
          imagePullPolicy: IfNotPresent
          name: test
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
        initContainers:
        - image: rayproject/ray:2.11.0
          imagePullPolicy: IfNotPresent
          name: test
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
  workerGroupSpecs:
  - groupName: test
    maxReplicas: 1
    minReplicas: 0
    rayStartParams: {}
    template:
      metadata: {}
      spec:
        containers:
        - image: rayproject/ray:2.11.0
          imagePullPolicy: IfNotPresent
          name: test
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
        initContainers:
        - image: rayproject/ray:2.11.0
          imagePullPolicy: IfNotPresent
          name: test
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
