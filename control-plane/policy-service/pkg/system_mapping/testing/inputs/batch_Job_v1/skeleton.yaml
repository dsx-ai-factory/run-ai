# Minimal valid batch/Job/v1 manifest used as the starting point for every
# Layer 3+4 case.
#
# Why the skeleton is minimal:
#   - restartPolicy is set to Never because K8s requires a Job's pod template
#     restart policy be Never or OnFailure.
#   - Containers and initContainers have minimal entries for the "container"
#     test case to target.
#
# Note: template.metadata is created automatically by the dependency mechanism
# when a policy targets podMetadata with a SET action.
apiVersion: batch/v1
kind: Job
metadata:
  name: test
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: placeholder
      initContainers:
        - name: test
          image: placeholder
