description: |
  Layer 3 case "workload" for batch/CronJob/v1. SETs every field reachable
  through:
    * cronJobSpec field group (via cronjobSpec selector, rooted at .spec):
      schedule, timeZone, suspend, *JobsHistoryLimit, startingDeadlineSeconds,
      and concurrencyPolicy (enum-enforced via runai-cronJobSpec).
    * jobSpec + selector field groups (via workloadSpec, rooted at
      .spec.jobTemplate.spec): everything the Job "workload" case exercises —
      CronJob exposes the same fields under the same selector name for
      consistency with Job policies.

  Custom formatters used here:
    * concurrencyPolicy         (runai-cronJobSpec, enum)
    * completionMode,
      podReplacementPolicy      (runai-jobSpec, enum)
    * podFailurePolicyRules,
      successPolicyRules        (runai-jobSpec, whole-rule builders)
    * matchExprSelector         (runai-selector, one rule per match expression)

  Read together with cases/workload/golden.yaml.
effectiveRules:
  # ===== cronJobSpec (via cronjobSpec spec selector at .spec) =============
  - field: schedule
    specSelector: cronjobSpec
    enforcements: [{ set: { value: "0 */2 * * *" } }]
  - field: timeZone
    specSelector: cronjobSpec
    enforcements: [{ set: { value: "Etc/UTC" } }]
  - field: suspend
    specSelector: cronjobSpec
    enforcements: [{ set: { value: false } }]
  - field: startingDeadlineSeconds
    specSelector: cronjobSpec
    enforcements: [{ set: { value: 60 } }]
  - field: successfulJobsHistoryLimit
    specSelector: cronjobSpec
    enforcements: [{ set: { value: 3 } }]
  - field: failedJobsHistoryLimit
    specSelector: cronjobSpec
    enforcements: [{ set: { value: 1 } }]
  - field: concurrencyPolicy
    specSelector: cronjobSpec
    enforcements: [{ set: { value: Allow } }]

  # ===== jobSpec field group (via workloadSpec at .spec.jobTemplate.spec)
  - field: parallelism
    specSelector: workloadSpec
    enforcements: [{ set: { value: 1 } }]
  - field: completions
    specSelector: workloadSpec
    enforcements: [{ set: { value: 1 } }]
  - field: manualSelector
    specSelector: workloadSpec
    enforcements: [{ set: { value: false } }]
  - field: managedBy
    specSelector: workloadSpec
    enforcements: [{ set: { value: example.com/manager } }]
  # jobSpec and cronJobSpec both define a `suspend` field; the engine
  # routes each by (field, specSelector) so the two rules set different
  # paths (.spec.suspend vs .spec.jobTemplate.spec.suspend).
  - field: suspend
    specSelector: workloadSpec
    enforcements: [{ set: { value: false } }]
  - field: activeDeadlineSeconds
    specSelector: workloadSpec
    enforcements: [{ set: { value: 60 } }]
  - field: ttlSecondsAfterFinished
    specSelector: workloadSpec
    enforcements: [{ set: { value: 60 } }]
  - field: backoffLimit
    specSelector: workloadSpec
    enforcements: [{ set: { value: 1 } }]
  - field: backoffLimitPerIndex
    specSelector: workloadSpec
    enforcements: [{ set: { value: 1 } }]
  - field: maxFailedIndexes
    specSelector: workloadSpec
    enforcements: [{ set: { value: 1 } }]

  # ----- jobSpec enum-enforced -----
  - field: completionMode
    specSelector: workloadSpec
    enforcements: [{ set: { value: Indexed } }]
  - field: podReplacementPolicy
    specSelector: workloadSpec
    enforcements: [{ set: { value: Failed } }]

  # ----- jobSpec policies -----
  - field: podFailurePolicyRules
    specSelector: workloadSpec
    enforcements:
      - set:
          action: FailJob
          onExitCodes:
            containerName: test
            operator: In
            values: [1]
          onPodConditions:
            - type: Test
              status: "True"
  - field: successPolicyRules
    specSelector: workloadSpec
    enforcements:
      - set:
          succeededCount: 1
          succeededIndexes: "0-1"

  # ----- selector ----
  # matchLabelsSelector uses KeyValueMap to add entries to selector.matchLabels.
  # matchExprSelector uses runai-selector (one rule per match expression).
  - field: matchLabelsSelector
    specSelector: workloadSpec
    enforcements: [{ set: { key: "app", value: "test" } }]
  - field: matchExprSelector
    specSelector: workloadSpec
    enforcements:
      - set:
          key: test
          operator: In
          values: ["v1", "v2"]

  # ----- pod template metadata -----
  # Add a label via policy (must match selector.matchLabels for K8s validation)
  - field: labels
    specSelector: podMetadata
    enforcements: [{ set: { key: "app", value: "test" } }]
  - field: annotations
    specSelector: podMetadata
    enforcements: [{ set: { key: "example.com/annotation", value: "test-value" } }]
