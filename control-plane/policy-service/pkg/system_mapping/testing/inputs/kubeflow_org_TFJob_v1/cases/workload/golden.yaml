apiVersion: kubeflow.org/v1
kind: TFJob
metadata:
  annotations:
    example.com/annotation: test-value
  labels:
    app: tf-test
  name: test
spec:
  runPolicy:
    activeDeadlineSeconds: 86400
    backoffLimit: 3
    cleanPodPolicy: Running
    suspend: false
    ttlSecondsAfterFinished: 3600
  tfReplicaSpecs:
    Chief:
      replicas: 1
      template:
        metadata: {}
        spec:
          containers:
          - image: tensorflow/tensorflow:2.12.0
            name: tensorflow
          initContainers:
          - image: tensorflow/tensorflow:2.12.0
            name: init
    Evaluator:
      replicas: 1
      template:
        metadata: {}
        spec:
          containers:
          - image: tensorflow/tensorflow:2.12.0
            name: tensorflow
          initContainers:
          - image: tensorflow/tensorflow:2.12.0
            name: init
    PS:
      replicas: 3
      template:
        metadata: {}
        spec:
          containers:
          - image: tensorflow/tensorflow:2.12.0
            name: tensorflow
          initContainers:
          - image: tensorflow/tensorflow:2.12.0
            name: init
    Worker:
      replicas: 2
      template:
        metadata: {}
        spec:
          containers:
          - image: tensorflow/tensorflow:2.12.0
            name: tensorflow
          initContainers:
          - image: tensorflow/tensorflow:2.12.0
            name: init
