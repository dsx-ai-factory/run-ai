name: filterBy
in: query
required: false
description: Filter results by a parameter. Use the format field-name operator value. Filterable fields are `id`, `type` and `scope`. Operators are `==` Equals, `!=` Not equals, `<=` Less than or equal, `>=` Greater than or equal, `=@` contains, `!@` Does not contain, `=^` Starts with and `=$` Ends with. Dates are in ISO 8601 timestamp format and available for operators `==`, `!=`, `<=` and `>=`.
schema:
  type: array
  maxItems: 10
  items:
    type: string
    pattern: "^(id|type|scope)(==|!=|<=|>=|=@|!@|=\\^|=\\$).+$"
  example: ["scope==project"]
explode: false
