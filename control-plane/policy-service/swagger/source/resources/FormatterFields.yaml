delete:
  summary: Delete fields from a formatter. [experimental]
  description: Delete one or more fields from an existing formatter.
  operationId: delete_formatter_fields
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/service_mapping_formatter_test.go
  x-authorize:
    resource-type: policies
    action: update
  x-audit: true
  tags:
    - Spec mapping
  parameters:
    - $ref: "../parameters/path/FormatterNameParam.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/Mapping/FormatterDeleteFieldsRequest.yaml"
  responses:
    200:
      description: Field(s) removed from the formatter.
      content:
        application/json:
          schema:
            $ref: "../schemas/Mapping/Formatter.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

