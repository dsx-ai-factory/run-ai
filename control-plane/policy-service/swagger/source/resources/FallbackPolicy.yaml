patch:
  summary: Update workloads fallback policy.
  description: The rules and defaults of this policy serves as fallback for fields that do not have rules or defaults
    in the policy of the specific workload-type (workspace, training, etc)
  operationId: update_fallback_policy
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/apply_test.go
  x-no-authorization: true
  x-audit: true
  x-internal: true
  tags:
    - Policy
  parameters:
    - $ref: "../parameters/query/optional/ValidateOnly.yaml"
    - $ref: "../parameters/query/optional/ApproveClusterDeletion.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/Fallback/FallbackPolicyChangeRequest.yaml"
  responses:
    200:
      description: Policy applied.
      content:
        application/json:
          schema:
            $ref: "../schemas/Fallback/FallbackPolicy.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

