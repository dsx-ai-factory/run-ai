patch:
  summary: Update a distributed inference policy.
  description: Use to apply changes to a distributed inference policy for a given organizational unit.
  operationId: update_distributed_inference_policy_v2
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/apply_test.go
  x-no-authorization: true
  x-audit: true
  tags:
    - Policy
  parameters:
    - $ref: "../parameters/query/optional/ValidateOnly.yaml"
    - $ref: "../parameters/query/optional/ApproveClusterDeletion.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/DistributedInferenceV2/DistributedInferencePolicyChangeRequestV2.yaml"
  responses:
    200:
      description: Policy applied.
      content:
        application/json:
          schema:
            $ref: "../schemas/DistributedInferenceV2/DistributedInferencePolicyV2.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

put:
  summary: Overwrite a distributed inference policy.
  description: Use to apply a distributed inference policy for a given organizational unit.
  operationId: overwrite_distributed_inference_policy_v2
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/apply_test.go
  x-no-authorization: true
  x-audit: true
  tags:
    - Policy
  parameters:
    - $ref: "../parameters/query/optional/ValidateOnly.yaml"
    - $ref: "../parameters/query/optional/ApproveClusterDeletion.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/DistributedInferenceV2/DistributedInferencePolicyOverwriteRequestV2.yaml"
  responses:
    200:
      description: Policy applied.
      content:
        application/json:
          schema:
            $ref: "../schemas/DistributedInferenceV2/DistributedInferencePolicyV2.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

get:
  summary: Get a distributed inference policy.
  description: Retrieve the details of a distributed inference policy for a given organizational unit.
  operationId: get_distributed_inference_policy_v2
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/apply_test.go
    - control-plane/policy-service/pkg/services/get_test.go
  x-no-authorization: true
  tags:
    - Policy
  parameters:
    - $ref: "../parameters/query/mandatory/PolicyScope.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/FilterByDepartment.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/FilterByProject.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/FilterByCluster.yaml"
    - $ref: "../parameters/query/optional/NoCreationMode.yaml"
  responses:
    200:
      description: Request completed successfully.
      content:
        application/json:
          schema:
            $ref: "../schemas/DistributedInferenceV2/DistributedInferencePolicyV2.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

delete:
  summary: Delete a distributed inference policy.
  description: Use to delete a distributed inference policy for a given organizational unit.
  operationId: delete_distributed_inference_policy
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/delete_test.go
  x-no-authorization: true
  x-audit: true
