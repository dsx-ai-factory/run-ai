delete:
  summary: Delete rules from a policy. [experimental]
  description: Delete one or more rules from an existing policy by reference.
  operationId: delete_gvk_policy_rules
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/service_gvk_policies_test.go
  x-authorize:
    resource-type: policies
    action: update
  x-audit: true
  tags:
    - Policy
  parameters:
    - $ref: "../parameters/path/PolicyId.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/Policies/DeleteGvkPolicyRulesReq.yaml"
  responses:
    200:
      description: The updated policy with the referenced rules removed.
      content:
        application/json:
          schema:
            $ref: "../schemas/Policies/Policy.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
