get:
  summary: Get a formatter. [experimental]
  description: Retrieve formatter details by name.
  operationId: get_formatter
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/service_mapping_formatter_test.go
  x-authorize:
    resource-type: policies
    action: read
  tags:
    - Spec mapping
  parameters:
    - $ref: "../parameters/path/FormatterNameParam.yaml"
  responses:
    200:
      description: Formatter details.
      content:
        application/json:
          schema:
            $ref: "../schemas/Mapping/Formatter.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

delete:
  summary: Delete a formatter. [experimental]
  description: Delete an existing formatter by its name.
  operationId: delete_formatter
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/service_mapping_formatter_test.go
  x-authorize:
    resource-type: policies
    action: delete
  x-audit: true
  tags:
    - Spec mapping
  parameters:
    - $ref: "../parameters/path/FormatterNameParam.yaml"
  responses:
    204:
      $ref: "../../../../infra/openapi/docs/responses/204NoContent.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

patch:
  summary: Patch a formatter. [experimental]
  description: Update an existing formatter by its name.
  operationId: patch_formatter
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/service_mapping_formatter_test.go
  x-authorize:
    resource-type: policies
    action: update
  x-audit: true
  tags:
    - Spec mapping
  parameters:
    - $ref: "../parameters/path/FormatterNameParam.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/Mapping/FormatterUpdateRequest.yaml"
  responses:
    200:
      description: Formatter updated.
      content:
        application/json:
          schema:
            $ref: "../schemas/Mapping/Formatter.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

