get:
  summary: Get a policy. [experimental]
  description: Retrieve policy details by id, including both the declared rules and the effective rules.
  operationId: get_gvk_policy
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/service_gvk_policies_test.go
  x-authorize:
    resource-type: policies
    action: read
  tags:
    - Policy
  parameters:
    - $ref: "../parameters/path/PolicyId.yaml"
    - $ref: "../parameters/query/optional/Breakdown.yaml"
  responses:
    200:
      description: The requested policy.
      content:
        application/json:
          schema:
            $ref: "../schemas/Policies/GetGvkPolicyResp.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

put:
  summary: Replace a policy. [experimental]
  description: Replace an existing policy's rules and description.
  operationId: apply_gvk_policy
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/service_gvk_policies_test.go
  x-authorize:
    resource-type: policies
    action: update
  x-audit: true
  tags:
    - Policy
  parameters:
    - $ref: "../parameters/path/PolicyId.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/Policies/UpdateGvkPolicyReq.yaml"
  responses:
    200:
      description: The updated policy.
      content:
        application/json:
          schema:
            $ref: "../schemas/Policies/Policy.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

patch:
  summary: Patch a policy. [experimental]
  description: Merge rules into an existing policy, keyed by rule identity.
  operationId: patch_gvk_policy
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/service_gvk_policies_test.go
  x-authorize:
    resource-type: policies
    action: update
  x-audit: true
  tags:
    - Policy
  parameters:
    - $ref: "../parameters/path/PolicyId.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/Policies/UpdateGvkPolicyReq.yaml"
  responses:
    200:
      description: The updated policy.
      content:
        application/json:
          schema:
            $ref: "../schemas/Policies/Policy.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

delete:
  summary: Delete a policy. [experimental]
  description: Delete an existing policy and all of its rules.
  operationId: delete_gvk_policy
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/service_gvk_policies_test.go
  x-authorize:
    resource-type: policies
    action: delete
  x-audit: true
  tags:
    - Policy
  parameters:
    - $ref: "../parameters/path/PolicyId.yaml"
  responses:
    204:
      $ref: "../../../../infra/openapi/docs/responses/204NoContent.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

