get:
  summary: Get a field group. [experimental]
  description: Retrieve field group details by name.
  operationId: get_field_group
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/service_mapping_field_group_test.go
  x-authorize:
    resource-type: policies
    action: read
  tags:
    - Spec mapping
  parameters:
    - $ref: "../parameters/path/FieldGroupNameParam.yaml"
  responses:
    200:
      description: Field group details.
      content:
        application/json:
          schema:
            $ref: "../schemas/Mapping/FieldGroup.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

delete:
  summary: Delete a field group. [experimental]
  description: Delete an existing field group by its name.
  operationId: delete_field_group
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/service_mapping_field_group_test.go
  x-authorize:
    resource-type: policies
    action: delete
  x-audit: true
  tags:
    - Spec mapping
  parameters:
    - $ref: "../parameters/path/FieldGroupNameParam.yaml"
  responses:
    204:
      $ref: "../../../../infra/openapi/docs/responses/204NoContent.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

patch:
  summary: Patch a field group. [experimental]
  description: Update an existing field group by its name.
  operationId: patch_field_group
  x-service: policy-service
  x-test-coverage:
    - control-plane/policy-service/pkg/services/service_mapping_field_group_test.go
  x-authorize:
    resource-type: policies
    action: update
  x-audit: true
  tags:
    - Spec mapping
  parameters:
    - $ref: "../parameters/path/FieldGroupNameParam.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/Mapping/FieldGroupUpdateRequest.yaml"
  responses:
    200:
      description: Field group updated.
      content:
        application/json:
          schema:
            $ref: "../schemas/Mapping/FieldGroup.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

