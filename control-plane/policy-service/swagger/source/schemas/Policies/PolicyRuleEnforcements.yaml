type: object
required:
  - enforcements
properties:
  enforcements:
    description: >-
      The set of enforcements that define the rule's behavior. Each enforcement
      pairs an enforcement type with its value, and multiple enforcements may
      combine on a single rule to constrain the targeted field.
    type: array
    items:
      allOf:
        - $ref: "./PolicyRuleEnforcement.yaml"
