type: object
description: |
  A map of spec selectors.
  Map **keys** are selector names. OpenAPI `additionalProperties` only constrains the **value** shape (`SpecSelector`);
  it does **not** validate keys. The API enforces each key to match `SpecSelectorName` (1–63 chars,
  `^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$` — alphanumeric with optional internal hyphens; no leading/trailing hyphen).
additionalProperties:
  allOf:
    - $ref: "./SpecSelector.yaml"
    - $ref: "./MappingScopeOfElement.yaml"
