type: object
description: >-
  A formatter: a named bundle of fields, where each field carries JQ
  expressions that read (getExpr) and write (setExpr) that field's value in a
  workload spec, plus an optional arrayKey and argument type information.
required:
  - name
  - id
properties:
  name:
    $ref: "./FormatterName.yaml"
  description:
    $ref: "./MappingDescriptionOptional.yaml"

  fields:
    $ref: "./FormatterFields.yaml"
  id:
    $ref: "./FormatterId.yaml"
  scope:
    $ref: "./MappingScope.yaml"

  createdBy:
    description: The identifier of the user who created the formatter.
    type: string
    minLength: 1
  createdAt:
    description: The time at which the formatter was created.
    type: string
    minLength: 1
    format: date-time
  updatedBy:
    description: The identifier of the user who last updated the formatter.
    type: string
    minLength: 1
  updatedAt:
    description: The time at which the formatter was last updated.
    type: string
    minLength: 1
    format: date-time

example:
  id: d0eb98d0-9c23-4294-9b12-f13672251c33
  scope: system
  name: podSpec
  createdBy: someone
  createdAt: 2025-01-03T11:22:33.000Z
  updatedBy: someone.else
  updatedAt: 2025-01-05T12:34:56.000Z
  fields:
    - setExpr: |
        {"ports":[{"containerPort":$ARGS.named.containerPort,"protocol":$ARGS.named.protocol}]}
      getExpr: ".spec.containers[0].ports"
      arrayKey:
        argName: containerPort
      argsInfo:
        containerPort: integer
        hostIP: ipaddress
      argsEnum:
        protocol:
          - TCP
          - UDP