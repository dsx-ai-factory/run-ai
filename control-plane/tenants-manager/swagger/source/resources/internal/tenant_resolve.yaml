get:
  summary: Get tenant by name or alias
  x-service: tenants-manager
  x-test-coverage: not-applicable
  operationId: get_tenant_by_name_or_alias
  x-no-authorization: true
  tags:
    - Internal
  parameters:
    - name: tenantName
      in: query
      required: true
      description: The name or alias of the tenant to resolve
      schema:
        type: string
  responses:
    200:
      description: Tenant found
      content:
        application/json:
          schema:
            $ref: '../../schemas/Tenants/Tenant.yaml'
    400:
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    404:
      $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
