get:
  summary: Get tenant logo. (base64)
  description: Retrieve the base64 logo file. This endpoint is deprecated and will be removed in a future release. Use GET /api/v1/branding/settings/logo instead.
  x-test-coverage:
  - src/test/suites/tenantSuite/tenantUserApi/tenantSystemApi.test.ts
  x-service: tenants-manager
  operationId: get_tenant_logo
  x-no-authorization: true
  deprecated: true
  tags:
  - Logo
  parameters:
  - $ref: "../../parameters/query/tenantId.yaml"
  responses:
    200:
      description: Tenant logo (PNG or SVG).
      content:
        application/json:
          schema:
            type: object
            required:
            - logo
            properties:
              logo:
                type: string
    204:
      $ref: '../../../../../infra/openapi/docs/responses/204NoContent.yaml'
    400:
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
post:
  summary: Upload logo for tenant. (base64)
  description: Use to upload a base64 logo file (PNG or SVG). Max size 128kb. This endpoint is deprecated and will be removed in a future release. Use PUT /api/v1/branding/settings/logo instead.
  x-test-coverage:
  - src/test/suites/tenantSuite/tenantUserApi/tenantSystemApi.test.ts
  x-service: tenants-manager
  operationId: upload_tenant_logo
  x-authorize:
    resource-type: branding-settings
    action: update
  x-audit: true
  deprecated: true
  parameters:
  - $ref: "../../parameters/query/tenantId.yaml"
  tags:
  - Logo
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../schemas/Tenants/LogoCreationRequest.yaml'
  responses:
    200:
      description: Logo uploaded.
    400:
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
    413:
      $ref: '../../../../../infra/openapi/docs/responses/413RequestEntityTooLarge.yaml'
    415:
      $ref: '../../../../../infra/openapi/docs/responses/415UnsupportedMediaType.yaml'
    500:
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
