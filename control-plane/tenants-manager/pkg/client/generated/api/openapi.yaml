        name: tenantId
        required: true
        schema:
          format: int32
          minimum: 0
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
        description: The tenant properties to update.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          description: Tenant updated successfully.
        "400":
          content:
            application/json:
              example:
