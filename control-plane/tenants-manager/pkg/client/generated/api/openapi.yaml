openapi: 3.0.3
info:
  description: An API for managing tenants objects and their associated resources.
  title: Tenant Management
  version: "1.0"
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /:
    get:
      description: health check
      operationId: health
      responses:
        "200":
          description: Executed successfully.
      summary: health check
      tags:
      - health
      x-service: tenants-manager
      x-no-authorization: true
    x-internal: true
  /api/v1/tenants:
    get:
      description: Retrieve a list of tenants and their details.
      operationId: get_tenants
      parameters:
      - description: Include soft-deleted tenants in the response when `true`.
        explode: true
        in: query
        name: deleted
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Filter tenants by name
        explode: true
        in: query
        name: name
        required: false
        schema:
          type: string
        style: form
      - description: Filter tenants by alias
        explode: true
        in: query
        name: alias
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenants'
          description: Executed successfully.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get a list of tenants.
      tags:
      - Tenant
      x-service: tenants-manager
      x-test-coverage:
      - e2e/src/test/suites/sphinxSuite/tenant.test.ts
      x-authorize:
        resource-type: tenant
        action: read
    post:
      operationId: create_tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreationRequest'
        description: The tenant to create.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreationResponse'
          description: Created
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                code: 404
                message: Resource id not found.
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource was not found
        "409":
          content:
            application/json:
              example:
                code: 409
                message: Resource with this name already exists
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource already exists
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Create tenant
      tags:
      - Tenant
      x-service: tenants-manager
      x-test-coverage:
      - e2e/src/test/suites/sphinxSuite/tenant.test.ts
      x-authorize:
        resource-type: tenant
        action: create
    x-scope:
    - system
  /api/v1/tenants/{tenantId}:
    delete:
      operationId: delete_tenant_by_id
      parameters:
      - description: The id of the tenant to retrieve
        explode: false
        in: path
        name: tenantId
        required: true
        schema:
          format: int32
          minimum: 0
          type: integer
        style: simple
      - description: Boolean indicator for soft/hard delete
        explode: true
        in: query
