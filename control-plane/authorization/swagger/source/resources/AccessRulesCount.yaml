get:
  summary: Count access rules.
  description: Use to retrieve the number of access rules.
  operationId: count_access_rules
  x-service: authorization
  x-test-coverage:
    - e2e/src/test/suites/advancedSuite/authorization/authorizationUI.test.ts
  x-authorize:
    resource-type: access_rules
    action: read
  tags:
    - Access rules
  parameters:
    - $ref: '../parameters/query/IncludeDeleted.yaml'
    - $ref: '../parameters/query/AccessRulesFilter.yaml'
    - $ref: '../../../../infra/openapi/docs/parameters/query/optional/Search.yaml'
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            type: object
            required:
              - count
            properties:
              count:
                type: integer
                format: int64
                example: 1
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'