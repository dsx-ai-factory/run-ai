get:
  summary: Get an access rule.
  description: Use to retrieve the details of an access rule by id.
  operationId: get_access_rule
  x-service: authorization
  x-test-coverage:
    - e2e/src/test/suites/advancedSuite/permissions/accessRulesApi.test.ts
  x-authorize:
    resource-type: access_rules
    action: read
    resource-id: accessRuleId
  tags:
    - Access rules
  parameters:
    - $ref: "../parameters/path/AccessRuleId.yaml"
  responses:
    '200':
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../schemas/AccessRules/AccessRuleById.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
delete:
  summary: Delete an access rule.
  description: Use to delete the subject permissions assigned by access rule id.
  operationId: delete_access_rule
  x-service: authorization
  x-test-coverage:
    - e2e/src/test/suites/advancedSuite/permissions/accessRulesApi.test.ts
  x-authorize:
    resource-type: access_rules
    action: delete
    resource-id: accessRuleId
  x-audit: true
  tags:
    - Access rules
  parameters:
    - $ref: "../parameters/path/AccessRuleId.yaml"
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'