post:
  summary: Disable a role by id.
  description: Disables a specific role. Disabled roles cannot be assigned to users and do not grant any permissions.
  operationId: role_disable
  x-service: authorization
  x-test-coverage:
    - control-plane/authorization/pkg/services/role_api_test.go
  x-authorize:
    resource-type: roles
    action: update
  tags:
    - Roles
  parameters:
    - $ref: "../parameters/path/RoleIdPath.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/Roles/RoleEnabledDisabledFields.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'