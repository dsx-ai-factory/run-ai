delete:
  summary: Delete access rules that assigned to the requested subject.
  operationId: delete_subject_access_rules
  x-service: authorization
  x-test-coverage:
    - e2e/src/test/suites/parallel/applicationsV1/applicationsDeprecated.test.ts
    - e2e/src/test/suites/defaultSuite/usersV1/usersDeprecated.test.ts
  x-no-authorization: true
  tags:
    - Internal
  parameters:
    - $ref: "../parameters/query/SubjectType.yaml"
    - $ref: "../parameters/query/SubjectId.yaml"
    - $ref: '../../../../infra/openapi/docs/parameters/query/optional/DryRun.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
get:
  summary: List specific subject access rules.
  operationId: get_subject_access_rules
  x-service: authorization
  x-test-coverage:
    - e2e/src/test/suites/parallel/applicationsV1/applicationsDeprecated.test.ts
    - e2e/src/test/suites/defaultSuite/usersV1/usersDeprecated.test.ts
  x-no-authorization: true
  tags:
    - Internal
  parameters:
    - $ref: "../parameters/query/SubjectType.yaml"
    - $ref: "../parameters/query/SubjectIds.yaml"
  responses:
    '200':
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../schemas/AccessRules/AccessRules.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'