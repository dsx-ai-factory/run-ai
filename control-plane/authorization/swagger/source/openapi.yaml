  /internal/authorization/privilege-escalation/evaluate:
    x-internal: true
    $ref: './resources/PrivilegeEscalationEvaluate.yaml'

  /api/v1/authorization/settings:
    x-scope: [ system, tenant ]
    $ref: "./resources/Settings/AuthorizationSettings.yaml"
  /api/v1/authorization/settings/{key}:
    x-scope: [ system, tenant ]
