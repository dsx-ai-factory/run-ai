type: object
required:
  - id
  - createdAt
  - updatedAt
  - createdBy
  - custom
  - effectiveEnabled
  - permissions
properties:
  id:
    type: integer
    format: int32
    description: The ID of the role.
    example: 32
  createdAt:
    type: string
    description: The timestamp for when the role was created.
    format: date-time
  updatedAt:
    type: string
    description: The timestamp for the last time the role was updated.
    format: date-time
  deletedAt:
    type: string
    nullable: true
    format: date-time
    x-internal: true
  createdBy:
    type: string
    description: Identifier of the user who created the role.
    example: "user@run.ai"
  custom:
    type: boolean
    x-internal: true
  effectiveEnabled:
    type: boolean
    description: "Indicates whether the role is effectively enabled in the tenant. This reflects the role’s operational state after considering tenant-level configuration or restrictions. Default: true"
    default: true
  deprecated:
    type: boolean
    description: Indicates whether the role is deprecated. When set to true, the role is considered deprecated and should not be used for new assignments.
  permissions:
    $ref: './RolePermissions.yaml'