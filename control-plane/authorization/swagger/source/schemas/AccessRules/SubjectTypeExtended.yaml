type: string
description: |
  Subject type enum for access rule responses. Extends SubjectType with the built-in
  all-authenticated-users subject, which applies to every authenticated user and service account.

  Note: The 'app' subject type is DEPRECATED. Please use 'service-account' instead for service accounts.
enum:
  - user
  - app
  - service-account
  - group
  - all-authenticated-users
