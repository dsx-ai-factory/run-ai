  /api/v1/authorization/access-rules:
    get:
      description: Retrieve a list of access rules.
      operationId: get_access_rules
      parameters:
      - description: The type of resource we want to filter by.
        explode: true
        in: query
        name: subjectType
        required: false
        schema:
          example: user
          type: string
        style: form
      - description: The ids of the subjects to filter the response for.
        explode: false
        in: query
        name: subjectIds
        required: false
        schema:
          items:
            example: some.user@run.ai
            type: string
          maxItems: 100
          type: array
        style: form
      - description: The maximum number of entries to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 500
          minimum: 1
          type: integer
        style: form
      - description: The offset of the first item returned in the collection.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          example: 100
          format: int32
          type: integer
        style: form
      - description: Filter by last update time.
        explode: true
        in: query
        name: lastUpdated
        required: false
        schema:
          example: 2021-12-14T16:04:15.099Z
          type: string
        style: form
      - description: True to include deleted objects in the result.
        explode: true
        in: query
        name: includeDeleted
        required: false
        schema:
          default: false
          example: false
          type: boolean
        style: form
      - description: Filter using the Universally Unique Identifier (UUID) of the
          cluster.
        explode: true
        in: query
        name: clusterId
        required: false
        schema:
          example: d73a738f-fab3-430a-8fa3-5241493d7128
          format: uuid
          type: string
        style: form
      - description: The scope resource id that we want to filter by.
        explode: true
        in: query
        name: scopeId
        required: false
        schema:
          example: "2"
          type: string
        style: form
      - description: Sort results in descending or ascending order.
        explode: true
        in: query
        name: sortOrder
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
