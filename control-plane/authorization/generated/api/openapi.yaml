openapi: 3.0.3
info:
  contact:
    email: support@run.ai
    name: Run.AI
    url: https://www.run.ai/
  description: An API for managing RunAi authorization objects and perform as the
    RunAi authorization layer.
  title: Authorization
  version: "1.0"
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /:
    get:
      operationId: health
      responses:
        "200":
          description: Executed successfully.
      summary: health check
      tags:
      - Health
      x-no-authorization: true
      x-test-coverage: not-applicable
      x-service: authorization
    x-internal: true
    x-service: authorization
  /api/v2/authorization/roles:
    get:
      description: "Retrieves a list of all available roles, including both NVIDIA\
        \ Run:ai predefined roles and custom roles. Use this endpoint to review role\
        \ configurations, permission sets and permissions."
      operationId: get_roles
      parameters:
      - description: The maximum number of entries to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 500
          minimum: 1
          type: integer
        style: form
      - description: The offset of the first item returned in the collection.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          example: 100
          format: int32
          type: integer
        style: form
      - description: Sort results in descending or ascending order.
        explode: true
        in: query
        name: sortOrder
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: Sort results by a parameter.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          $ref: '#/components/schemas/RolesSortFilterFields'
        style: form
      - description: "Filter results by a parameter. Use the format field-name operator\
          \ value. Operators are == Equals, != Not equals, <= Less than or equal,\
          \ >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts\
          \ with and =$ Ends with. Dates are in ISO 8601 timestamp format and available\
          \ for operators ==, !=, <= and >=."
        example:
        - name!=some-access-rule-name
        - createdAt>=2023-01-01T00:00:00Z
        explode: false
        in: query
        name: filterBy
        required: false
        schema:
          items:
            pattern: ^(name|createdAt|createdBy|custom|scopeType|enabled)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
            type: string
          maxItems: 10
          type: array
        style: form
      - description: Filter results by a free text search.
        explode: true
        in: query
        name: search
        required: false
        schema:
          example: test project
          type: string
        style: form
      - explode: true
        in: query
        name: includeInternal
        required: false
        schema:
          default: false
          example: false
          type: boolean
        style: form
        x-internal: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_roles_200_response'
          description: Executed successfully.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get a list of roles.
      tags:
      - Roles
      x-service: authorization
      x-test-coverage:
      - e2e/src/test/suites/advancedSuite/permissions/applicationAggregatedApi.test.ts
      - e2e/src/test/suites/advancedSuite/permissions/accessRulesApi.test.ts
      - e2e/src/test/suites/playwright/serial/sphinx/systemScopedCostumeRoles.test.ts
      x-authorize:
        resource-type: roles
        action: read
    post:
      description: Creates a custom role with the specified permission sets.
      operationId: create_role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreationFieldsInternal'
        description: The role to create.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: Created
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Create a role.
      tags:
      - Roles
      x-service: authorization
      x-test-coverage:
      - e2e/src/test/suites/playwright/serial/sphinx/systemScopedCostumeRoles.test.ts
      x-authorize:
        resource-type: roles
        action: create
    x-scope:
    - system
    - tenant
