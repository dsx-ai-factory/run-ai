post:
  summary: upload the details of project-wide secret to the control plane
  operationId: create_project_secret
  tags:
    - Secrets
  x-internal: true
  x-authorize:
    resource-type: credentials
    action: sync
  x-service: k8s-objects-tracker
  x-test-coverage:
    - k8s-objects-tracker/pkg/services/api_secrets_service_test.go
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/ClusterUuid.yaml"
    - $ref: "../parameters/path/Namespace.yaml"
    - $ref: "../parameters/path/SecretName.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/Secrets/SecretCreationRequest.yaml'
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../schemas/Secrets/Secret.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
delete:
  summary: delete project secret
  operationId: delete_project_secret
  tags:
    - Secrets
  x-internal: true
  x-authorize:
    resource-type: credentials
    action: sync
  x-service: k8s-objects-tracker
  x-test-coverage:
    - k8s-objects-tracker/pkg/services/api_secrets_service_test.go
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/ClusterUuid.yaml"
    - $ref: "../parameters/path/Namespace.yaml"
    - $ref: "../parameters/path/SecretName.yaml"
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
