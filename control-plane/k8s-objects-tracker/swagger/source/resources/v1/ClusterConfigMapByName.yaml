post:
  summary: upload the details of cluster-wide ConfigMap to the control plane
  operationId: create_cluster_wide_configmap_v1
  tags:
    - ConfigMaps
  x-internal: true
  x-authorize:
    resource-type: cm-volume-assets
    action: sync
  x-service: k8s-objects-tracker
  x-test-coverage:
    - k8s-objects-tracker/pkg/services/api_configmaps_service_test.go
  parameters:
    - $ref: "../../../../../infra/openapi/docs/parameters/path/ClusterUuid.yaml"
    - $ref: "../../parameters/path/ConfigMapName.yaml"
  requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/ConfigMaps/ConfigMap.yaml'
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../../schemas/ConfigMaps/ConfigMap.yaml'
    400:
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
delete:
  summary: delete cluster-wide ConfigMap
  operationId: delete_cluster_wide_configmap_v1
  tags:
    - ConfigMaps
  x-internal: true
  x-authorize:
    resource-type: cm-volume-assets
    action: sync
  x-service: k8s-objects-tracker
  x-test-coverage:
    - k8s-objects-tracker/pkg/services/api_configmaps_service_test.go
  parameters:
    - $ref: "../../../../../infra/openapi/docs/parameters/path/ClusterUuid.yaml"
    - $ref: "../../parameters/path/ConfigMapName.yaml"
  responses:
    204:
      $ref: '../../../../../infra/openapi/docs/responses/204NoContent.yaml'
    401:
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
