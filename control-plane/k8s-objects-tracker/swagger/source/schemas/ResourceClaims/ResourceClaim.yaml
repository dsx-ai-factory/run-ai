type: object
description: >
  A ResourceClaim observed in a project namespace. Origin is always "existing"
  since claims are instantiated by the Kubernetes resource-claim controller,
  not created by Run.ai assets - the Run.ai control plane only owns the
  ResourceClaimTemplate the claim was derived from.
required:
  - name
  - namespace
properties:
  name:
    $ref: "./ResourceClaimName.yaml"
  namespace:
    type: string
    description: the namespace the ResourceClaim lives in
    minLength: 1
    maxLength: 253
    example: runai-project-foo
  resourceClaimTemplateName:
    type: string
    description: >
      Name of the ResourceClaimTemplate this claim was instantiated from, as
      reported by the agent. May be omitted when the agent could not resolve
      the template (e.g. the owning Pod was already gone).
    nullable: true
  spec:
    $ref: "./ResourceClaimSpec.yaml"
  issues:
    $ref: "../Common/Issues.yaml"
