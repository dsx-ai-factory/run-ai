type: object
required:
  - storage_class_name
properties:
  cluster_id:
    $ref: "../../../../../infra/openapi/docs/schemas/scopes/ReportingClusterId.yaml"
  storage_class_name:
    type: string
    description: Storage class name
    example: my-storage-class
  Spec:
    type: object
    required:
      - is_default
    properties:
      provisioner:
        type: string
        description: The provisioner type (unique name)
        example: kubernetes.io/aws-ebs
      allow_volume_expansion:
        type: boolean
        description: Indicates whether the storage class allows volume expansion
        example: true
      is_default:
        type: boolean
        description: Indicates whether the storage class is the default one
        example: false
