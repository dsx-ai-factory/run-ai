openapi: 3.0.3
info:
  version: 2.0.0
  description: |
    The aggregated API of Run:AI Control-Plane
  title: Runai API
  x-logo:
    url: ./redoc-runai-logo.png
    altText: 'Run:AI'
    backgroundColor: '#FAFAFA'
    href: 'https://run.ai'
  license:
    name: 'Run:AI'
    url: www.run.ai
servers:
  - url: 'https://app.run.ai'
  - url: 'https://staging.run.ai'
  - url: 'https://test.run.ai'
security:
  - bearerAuth: []
tags:
  - name: Jobs
    description: job related operations
  - name: Secrets
    description: secret related operations
  - name: Storage Classes
    description: storage class related operations
  - name: PVCs
    description: pvc related operations
  - name: Policy
    description: policy related operations
  - name: Pods
    description: pod related operations
  - name: Deployments
    description: deployment related operations
  - name: Workspaces
    description: workspaces related operations
  - name: Sso
    description: sso related operations
  - name: Authentication
    description: authentication related operations
  - name: Authorization
    description: authorization related operations
  - name: Application
    description: applications related operations
  - name: Tokens
    description: tokens related operations
  - name: Tenant
    description: tenant related operations
  - name: NodePools
    description: node pools related operations
  - name: Clusters
    description: clusters related operations
  - name: Metrics
    description: metrics related operations
  - name: Departments
    description: departments related operations
  - name: Projects
    description: projects related operations
  - name: Admin
    description: admin related operations
  - name: trials
    description: trials related operations
paths:
  '/internal/{resourceType}/{id}/ancestors':
    get:
      operationId: getAncestors
      tags:
        - Internal
      summary: Get scoped resource ancestors.
      description: Get the ancestors resource of a scoped resource.
      parameters:
        - $ref: '#/components/parameters/ResourceType'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The resource ancestors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ancestors'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  '/internal/{resourceType}/{id}/name':
    get:
      operationId: getScopeName
      tags:
        - Internal
      summary: Get scoped resource name.
      description: Get the name of a scoped resource.
      parameters:
        - $ref: '#/components/parameters/ResourceType'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The resource name.
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                properties:
                  name:
                    type: string
                    example: tenant-x
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/authorization/permissions:
    get:
      summary: Get user permissions summary.
      x-no-authorization: true
      operationId: get_permissions
      tags:
        - Permissions
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permissions'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '500':
          $ref: '#/components/responses/InternalServerError1'
        '503':
          $ref: '#/components/responses/ServiceUnavailable1'
  /api/v1/authorization/permitted-scopes:
    post:
      summary: Calculate user permitted scopes for an action on a resource.
      x-no-authorization: true
      operationId: get_permitted_scopes
      tags:
        - Permissions
      requestBody:
        description: The request parameters.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resourceType
              properties:
                resourceType:
                  $ref: '#/components/schemas/ResourceType'
                action:
                  nullable: true
                  type: string
                  enum:
                    - create
                    - read
                    - update
                    - delete
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermittedScopesActions'
        '401':
          $ref: '#/components/responses/Unauthorized1'
        '500':
          $ref: '#/components/responses/InternalServerError1'
        '503':
          $ref: '#/components/responses/ServiceUnavailable1'
  /internal/authorization/evaluate:
    x-internal: true
    post:
      summary: >-
        Evaluate user permission to the requested resource. The returned
        permitted scopes are the scopes that the action on the resource is
        permitted, with OR between the multiple scopes.
      x-no-authorization: true
      operationId: evaluate_permission
      tags:
        - Internal
      requestBody:
        description: The request parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackendEvaluationRequest'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermittedScopes'
        '204':
          $ref: '#/components/responses/NoContent'
        '403':
          $ref: '#/components/responses/Forbidden1'
        '500':
          $ref: '#/components/responses/InternalServerError1'
        '503':
          $ref: '#/components/responses/ServiceUnavailable1'
  /internal/authorization/admin-user:
    x-internal: true
    post:
      summary: Sets user as an admin user.
      x-no-authorization: true
      operationId: set_admin_user
      tags:
        - Internal
      requestBody:
        description: The request parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalCreateAccessRuleRequest'
      responses:
        '201':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRule'
        '500':
          $ref: '#/components/responses/InternalServerError1'
        '503':
          $ref: '#/components/responses/ServiceUnavailable1'
  /internal/authorization/cluster-app:
    x-internal: true
    post:
      summary: Create an access rule with a cluster app role.
      x-no-authorization: true
      operationId: set_cluster_app
      tags:
        - Internal
      requestBody:
        description: The request parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalCreateAccessRuleRequest'
      responses:
        '201':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRule'
        '500':
          $ref: '#/components/responses/InternalServerError1'
        '503':
          $ref: '#/components/responses/ServiceUnavailable1'
  /internal/authorization/installer-app:
    x-internal: true
    post:
      summary: Create an access rule with an installer app role.
      x-no-authorization: true
      operationId: set_installer_app
      tags:
        - Internal
      parameters:
        - name: X-Runai-Tenant-Id
          in: header
          required: true
          description: The id of the tenant
          example: 1
          schema:
            type: integer
            format: int32
            minimum: 0
      requestBody:
        description: The request parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalCreateAccessRuleRequest'
      responses:
        '201':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRule'
        '500':
          $ref: '#/components/responses/InternalServerError1'
        '503':
          $ref: '#/components/responses/ServiceUnavailable1'
  /internal/authorization/subject-access-rules:
    x-internal: true
    delete:
      summary: Delete access rules that assigned to the requested subject.
      operationId: delete_subject_access_rules
      x-no-authorization: true
      tags:
        - Internal
      parameters:
        - $ref: '#/components/parameters/SubjectType'
        - $ref: '#/components/parameters/SubjectId'
        - $ref: '#/components/parameters/lastUpdated'
        - $ref: '#/components/parameters/Roles1'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '500':
          $ref: '#/components/responses/InternalServerError1'
        '503':
          $ref: '#/components/responses/ServiceUnavailable1'
    get:
      summary: List specific subject access rules.
      operationId: get_subject_access_rules
      x-no-authorization: true
      tags:
        - Internal
      parameters:
        - $ref: '#/components/parameters/SubjectType'
        - $ref: '#/components/parameters/subjectIds'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRules'
        '500':
          $ref: '#/components/responses/InternalServerError1'
        '503':
          $ref: '#/components/responses/ServiceUnavailable1'
  /internal/authorization/scope-access-rules:
    x-internal: true
    delete:
      summary: Delete access rules that assigned to the requested scope resource
      operationId: delete_scope_access_rules
      x-no-authorization: true
      tags:
        - Internal
      parameters:
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/ScopeId'
        - $ref: '#/components/parameters/lastUpdated'
        - $ref: '#/components/parameters/Roles1'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '500':
          $ref: '#/components/responses/InternalServerError1'
        '503':
          $ref: '#/components/responses/ServiceUnavailable1'
    put:
      summary: Update access rules that assigned to the requested scope resource
      operationId: update_scope_access_rules
      x-no-authorization: true
      tags:
        - Internal
      parameters:
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/ScopeId'
      requestBody:
        description: The access rule fields to update.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scopeName
              properties:
                scopeName:
                  type: string
                  example: team-a
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '500':
          $ref: '#/components/responses/InternalServerError1'
        '503':
          $ref: '#/components/responses/ServiceUnavailable1'
    get:
      summary: Get access rules that assigned to the requested scope resource
      operationId: get_scope_access_rules
      x-no-authorization: true
      tags:
        - Internal
      parameters:
        - $ref: '#/components/parameters/ClusterId'
        - $ref: '#/components/parameters/Roles1'
        - $ref: '#/components/parameters/DepartmentIds'
        - $ref: '#/components/parameters/ProjectIds'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - totalRecords
                  - displayRecords
                  - accessRules
                properties:
                  totalRecords:
                    type: integer
                    example: 1
                  displayRecords:
                    type: integer
                    example: 1
                  accessRules:
                    $ref: '#/components/schemas/AccessRules'
        '500':
          $ref: '#/components/responses/InternalServerError1'
        '503':
          $ref: '#/components/responses/ServiceUnavailable1'
  '/v1/k8s/clusters/{clusterId}/projects':
    post:
      tags:
        - Projects
      summary: Create a new project.
      description: >-
        Create a new project in the cluster. This endpoint requires EDITOR or
        RESEARCH MANAGER role.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '200':
          description: Project created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project1'
        '400':
          description: Bad Project request.
        '409':
          description: Project failed to be created.
    get:
      tags:
        - Projects
      summary: List all projects.
      description: List all the projects managed by the tenant on a specific cluster.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
        - in: query
          name: memoryUnitMb
          schema:
            type: boolean
          required: false
          description: >-
            should memory be returned in MB. default is "false", in which case
            it will be returned in MiB.
          example: true
      responses:
        '200':
          description: A list of projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project1'
  '/v1/k8s/clusters/{clusterId}/projects/{id}':
    put:
      tags:
        - Projects
      summary: Update a project.
      description: >-
        Updates project details. This endpoint requires EDITOR or RESEARCH
        MANAGER role.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The unique project-id identifying the project.
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project1'
      responses:
        '200':
          description: An updated project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project1'
        '400':
          description: Bad project request.
        '404':
          description: Project not found.
        '409':
          description: Could not update the project.
    delete:
      tags:
        - Projects
      summary: Delete a project.
      description: >-
        Delete a project from the cluster. This endpoint requires EDITOR or
        RESEARCH MANAGER  role.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: The unique id identifying the project.
          example: 2
      responses:
        '200':
          description: Project deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project1'
        '404':
          description: Project not found.
    get:
      tags:
        - Projects
      summary: Get a specific project.
      description: >-
        Get information about a specific project. This endpoint requires view
        permissions to the requested project.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The unique project-id identifying the project.
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      responses:
        '200':
          description: A project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project1'
        '404':
          description: Project not found.
  '/v1/k8s/clusters/{clusterId}/projects/status':
    x-internal: true
    put:
      tags:
        - Projects
      summary: Update Project status
      operationId: updateProjectStatus
      parameters:
        - name: clusterId
          in: path
          description: Unique identifier of the cluster
          required: true
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusRequest'
        required: true
      responses:
        '201':
          description: Project updated successfully.
        '400':
          description: Bad Project request.
        '404':
          description: Project not found.
components:
  schemas:
    IdentityAlias:
      description: Alias for identity provider
      type: string
      example: saml
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          minimum: 100
          maximum: 599
        message:
          type: string
      example:
        code: 418
        message: I'm a teapot
    OAUTHSSO:
      properties:
        wellKnownOidcConfigUrl:
          type: string
          example: >-
            https://idp.example.com/auth/realms/example/.well-known/openid-configuration
        clientId:
          type: string
          example: example-client
        clientSecret:
          type: string
          example: test-client-secret-placeholder
        adminUser:
          type: string
          example: admin@example.com
    SAMLSSO:
      properties:
        metadataXmlUrl:
          type: string
          example: >-
            https://idp.example.com/auth/realms/example/protocol/saml/descriptor
        mappers:
          type: object
          example:
            GROUPS: groups
        adminUser:
          type: string
          example: admin@example.com
    Role:
      type: string
      enum:
        - admin
        - department_admin
        - researcher
        - editor
        - viewer
        - research_manager
        - ml_engineer
      example: viewer
    UserType:
      enum:
        - sso-user
        - regular-user
    AuthEntityType:
      type: string
      description: The type of authentication entity.
      enum:
        - regular-user
        - sso-user
        - app
        - group
        - internal-user
        - super-admin
      example: regular-user
    TenantId:
      type: integer
      description: The id of the tenant
      format: int32
      minimum: 1
      example: 1
    UserId:
      description: Unique identifier of the user
      type: string
      format: uuid
      example: 4008188b-ab50-4aa5-a3f2-b78091ccf92d
    ClusterId:
      description: Unique identifier of the cluster
      type: string
      format: uuid
      example: 4008188b-ab50-4aa5-a3f2-b78091ccf92d
    AuthEntity:
      properties:
        entityType:
          $ref: '#/components/schemas/AuthEntityType'
        tenantId:
          $ref: '#/components/schemas/TenantId'
        userId:
          $ref: '#/components/schemas/UserId'
        permitAllClusters:
          type: boolean
          example: false
        permittedClusters:
          type: array
          description: A list of clusters that the user or application can access.
          items:
            $ref: '#/components/schemas/ClusterId'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
          description: The creation date of the application.
          example: '2021-12-14T16:04:15.099Z'
    User:
      allOf:
        - $ref: '#/components/schemas/AuthEntity'
        - required:
            - email
        - properties:
            email:
              type: string
              description: Email address of the user.
              example: user@email.com
            lastLogin:
              type: string
              format: date-time
              description: The last time the user logged into the system.
              example: '2021-12-14T16:04:15.099Z'
    UserCreationRequest:
      required:
        - email
        - password
        - roles
      properties:
        email:
          type: string
          description: Email address of the user.
          example: user@email.com
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        entityType:
          $ref: '#/components/schemas/AuthEntityType'
        tenantId:
          $ref: '#/components/schemas/TenantId'
        password:
          type: string
          description: The user's password.
          example: secret!123
        needToChangePassword:
          type: boolean
          description: >-
            True if the user is requested to change his password upon next
            login.
          example: true
        permitAllClusters:
          type: boolean
          example: false
        userId:
          $ref: '#/components/schemas/UserId'
        permittedClusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterId'
    UserCreationResponse:
      allOf:
        - $ref: '#/components/schemas/UserCreationRequest'
    App:
      allOf:
        - $ref: '#/components/schemas/AuthEntity'
        - required:
            - name
        - properties:
            clientId:
              type: string
              description: The client ID of the application.
              example: 6d2894ba-f998-4039-bba1-caba57caf681
            name:
              type: string
              description: The name of the application.
              example: MyApplication
            revoked:
              type: boolean
              description: Whether the application has been revoked.
              example: false
    ClientId:
      description: Unique identifier of the app
      type: string
      format: uuid
      example: 4008188b-ab50-4aa5-a3f2-b78091ccf92d
    Secret:
      required:
        - name
      properties:
        secret:
          type: object
          description: The secret.
          properties:
            type:
              type: string
              description: The type of the secret.
              enum:
                - password
                - secret
                - certificate
              example: secret
            value:
              type: string
              description: The value of the secret.
              example: my-secret
    TenantName:
      type: string
      description: The name of the tenant
      example: runai
    Tenant:
      type: object
      required:
        - id
      properties:
        authSettingsId:
          type: integer
          example: 1
        displayName:
          type: string
          example: My Company
        ssoAuthSettingsId:
          type: integer
          example: 1
        authRealm:
          type: string
          example: runai
        id:
          $ref: '#/components/schemas/TenantId'
        name:
          type: string
          example: runai
        eulaSigningUser:
          type: string
          example: ...
        contractType:
          type: string
          example: normal
        smgEnabled:
          type: boolean
          example: true
        authClientID:
          type: string
          example: runai-admin-ui
        cliClientId:
          type: string
          example: runai-cli
    AuditLogRecord:
      properties:
        id:
          type: integer
          description: The unique id of the audit log.
          example: 12
        clusterUuid:
          type: string
          description: The uuid of the current cluster
          example: 123e4567-e89b-12d3-a456-426614174000
        tenantId:
          type: integer
          description: The tenant id this cluster belongs to.
          example: 42
        happenedAt:
          type: string
          format: date-time
          description: The date and time in which the event happened.
          example: '2022-06-08T11:28:24.131Z'
        action:
          type: string
          description: The action that was performed by the user.
          example: Create
        version:
          type: string
          description: The version of the audit log record.
          example: 1
        entityId:
          type: string
          description: The id of the action related entity.
          example: 51
        entityType:
          type: string
          description: The type of the action related entity.
          example: Department
        entityName:
          type: string
          description: The name of the action related entity.
          example: MyDepartment123
        sourceType:
          type: string
          description: The type of the source of the action.
          example: User
        sourceId:
          type: string
          description: The id of the source of the action.
          example: 96a4382e-afa5-4604-9eb1-c3071aa021fc
        sourceName:
          type: string
          description: The name of the source of the action.
          example: test@run.ai
        error:
          type: string
          description: 'In case of a failed action, the corresponding error'
          example: >-
            {"status":404,"description":"Cluster with uuid
            '19519f4b-e3a5-45c7-9451-0def7b931546' does not
            exist","errorType":"BackendError"}
        context:
          type: object
          description: The context of the action.
          example:
            user_agent: 'Thunder Client (https://www.thunderclient.com)'
        body:
          type: object
          description: The body of the action http request.
          example:
            name: test1
