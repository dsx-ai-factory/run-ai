        readOnlyMany: false
        readWriteMany: false
        readWriteOnce: true
      nullable: true
      properties:
        readWriteOnce:
          default: true
          description: Mount the volume as read/write by a single node.
          nullable: true
          type: boolean
        readOnlyMany:
          default: false
          description: Mount the volume as read-only by many nodes.
          nullable: true
          type: boolean
        readWriteMany:
          default: false
          description: Mount the volume as read/write by many nodes.
          nullable: true
          type: boolean
      type: object
    PvcSupportedAccessModes:
      description: Defines the access modes supported by the given storage class.
