openapi: 3.0.3
info:
  contact:
    email: support@run.ai
    name: Run.AI
    url: https://www.run.ai/
  description: An API for tracking k8s object in the cluster
  title: K8sObjectTracker
  version: "1.0"
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /:
    get:
      operationId: health
      responses:
        "200":
          description: Executed successfully.
      summary: health check
      tags:
      - Health
      x-no-authorization: true
      x-service: k8s-objects-tracker
  /api/v1/pvcs:
    get:
      operationId: list_pvcs
      parameters:
      - description: The type of resource we want to filter by.
        explode: true
        in: query
        name: scopeType
        required: false
        schema:
          example: project
          type: string
        style: form
      - description: filter by scope id
        explode: true
        in: query
        name: scopeId
        required: false
        schema:
          type: string
        style: form
      - description: filter by name
        explode: true
        in: query
        name: name
        required: false
        schema:
          type: string
        style: form
      - description: Filter using the Universally Unique Identifier (UUID) of the
          cluster.
        explode: true
        in: query
        name: clusterId
        required: false
        schema:
          example: d73a738f-fab3-430a-8fa3-5241493d7128
          format: uuid
          type: string
        style: form
      - description: "filter by the origin of the resource. by default, we have to\
          \ list only customer existing resources (to preserve backward compatibility)\
          \ to list both existing pvc and assets related pvcs use 'all'."
        explode: true
        in: query
        name: origin
        required: false
        schema:
          enum:
          - all
          - assets
          - existing
          type: string
        style: form
      - description: "include resources of both requested scope, and its ancestors.\
          \ for example, if project scope is requested with includeAncestors=true,\
          \ department and cluster scoped assets will be included in the response."
        explode: true
        in: query
        name: includeAncestors
        required: false
        schema:
          type: boolean
        style: form
      - description: Whether the query should include from all nested layers within
          the specified scope
        explode: true
        in: query
        name: includeDescendants
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PVCListResponse'
          description: Executed successfully.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                code: 404
                message: Resource id not found.
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource was not found
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: list details of pvcs
      tags:
      - PVCs
      x-no-authorization: true
      x-service: k8s-objects-tracker
      x-test-coverage:
      - k8s-objects-tracker/pkg/services/api_pvcs_service_test.go
  /api/v1/pvcs/{clusterUuid}:
    post:
      deprecated: true
      description: this API is used by cluster versions < 2.17
      operationId: sync_cluster_wide_pvc_names_v1
      parameters:
