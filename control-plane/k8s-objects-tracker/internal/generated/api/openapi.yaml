        \ and ephemeral=true, or (b) include PVC instances with isEphemeral=false\
        \ that use this storage class."
      nullable: true
      type: boolean
    AllowDataSharing:
      description: Allows creation of PVCs using a shared volume.
      nullable: true
      type: boolean
    StorageClassPermissions:
      description: Defines the access permissions and behavioral rules for this storage
        class.
      example:
        allowDataSharing: true
        allowedForWorkloads: true
        allowedForEphemeralVolumes: true
        allowedForPersistentVolumes: true
        allowedForAssets: true
      nullable: true
      properties:
        allowedForAssets:
          description: Determines whether PVC assets can be created using this storage
            class.
          nullable: true
          type: boolean
        allowedForWorkloads:
          description: "Allows workloads to include PVCs that use this storage class.\
            \ When disabled, users cannot (a) include non-existing PVC assets created\
            \ with this class in asset-based submissions, or (b) attach PVCs with\
            \ existing=false to workloads using this class."
          nullable: true
          type: boolean
        allowedForEphemeralVolumes:
          description: "Allows workloads to create ephemeral volumes using this storage\
            \ class. When disabled, users cannot (a) create PVC assets with autoDelete=true\
            \ and ephemeral=true, or (b) include PVC instances with isEphemeral=false\
            \ that use this storage class."
          nullable: true
          type: boolean
        allowedForPersistentVolumes:
          description: "Allows workloads to create persistent volumes using this storage\
            \ class. When disabled, users cannot (a) create PVC assets with autoDelete=true\
            \ and ephemeral=true, or (b) include PVC instances with isEphemeral=false\
            \ that use this storage class."
          nullable: true
          type: boolean
        allowDataSharing:
          description: Allows creation of PVCs using a shared volume.
          nullable: true
          type: boolean
      type: object
    PvcAccessModes:
      description: Default access mode(s) applied to newly created PVCs unless explicitly
        overridden.
