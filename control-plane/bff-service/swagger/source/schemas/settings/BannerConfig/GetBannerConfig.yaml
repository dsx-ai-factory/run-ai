type: object
properties:
  value:
    type: object
    properties:
      enabled:
        type: boolean
        nullable: true
        description: Whether the banner is displayed at the top of the UI for all authenticated users.
      text:
        type: string
        nullable: true
        description: Message displayed in the banner. Required when `enabled` is `true`. Maximum 500 characters.
      backgroundColor:
        type: string
        nullable: true
        description: Background color of the banner. Accepts any valid CSS color value (hex, rgb, named). Maximum 50 characters.
      fontColor:
        type: string
        nullable: true
        description: Text color of the banner. Accepts any valid CSS color value (hex, rgb, named). Maximum 50 characters.
      fontSize:
        type: integer
        nullable: true
        description: Font size in pixels. Maximum 20. Defaults to 14 if omitted or null.
  displayName:
    type: string
    description: Human-readable name for this setting
    readOnly: true
  description:
    type: string
    description: Short explanation of what this setting controls, shown alongside the setting
    readOnly: true
example:
  value:
    enabled: true
    text: "PRODUCTION ENVIRONMENT"
    backgroundColor: "#D32F2F"
    fontColor: "#FFFFFF"
  displayName: Banner configuration
  description: Configure a persistent banner displayed at the top of the Run:ai UI for all authenticated users.
