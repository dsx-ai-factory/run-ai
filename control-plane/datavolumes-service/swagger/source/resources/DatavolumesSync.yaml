post:
  summary: Sync the statuses of the datavolumes in the cluster
  operationId: sync_datavolumes
  x-service: datavolumes-service
  x-test-coverage:
    - src/test/suites/advancedSuite/datavolumes/datavolumesApi.test.ts
  x-authorize:
    resource-type: datavolumes
    action: sync
  tags:
    - Datavolumes
  description: Sync all datavolumes statuses from k8s cluster to Run:AI control-plane.
  requestBody:
    description: The statuses to sync.
    content:
      application/json:
        schema:
          $ref: '../schemas/Datavolumes/DatavolumesSyncRequest.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
get:
  summary: List datavolumes in cluster.
  operationId: get_datavolumes_internal
  x-service: datavolumes-service
  x-test-coverage:
    - src/test/suites/advancedSuite/datavolumes/datavolumesApi.test.ts
  x-authorize:
    resource-type: datavolumes
    action: sync
  tags:
    - Datavolumes
  description: Get all datavolumes in cluster with all shared scopes - used by the agent for the k8s cluster.
  parameters:
    - $ref: '../../../../infra/openapi/docs/parameters/query/optional/Offset.yaml'
    - $ref: '../../../../infra/openapi/docs/parameters/query/optional/Limit.yaml'
    - $ref: '../../../../infra/openapi/docs/parameters/query/mandatory/ClusterIdRequired.yaml'
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            type: object
            required:
              - datavolumes
            properties:
              next:
                type: integer
                example: 1
              datavolumes:
                $ref: '../schemas/Datavolumes/DatavolumesInternal.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'