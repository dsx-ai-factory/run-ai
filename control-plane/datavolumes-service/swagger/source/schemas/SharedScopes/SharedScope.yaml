allOf:
  - $ref: "./SharedScopeBase.yaml"
  - type: object
    required:
      - scopeName
    properties:
      scopeName:
        type: string
        description: The name of the scope
        example: "project-a"
      createdAt:
        type: string
        format: date-time
      createdBy:
        type: string
        example: "user@run.ai"