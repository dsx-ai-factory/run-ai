get:
  summary: List helm repos. [Experimental]
  description: List helm repos.
  operationId: list_helm_repos
  x-service: catalog-service
  x-internal: true
  x-authorize:
    resource-type: registries
    action: read
  tags:
    - HelmRepos
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../schemas/helmRepos/HelmRepoListResponse.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'

post:
  summary: Create helm repo. [Experimental]
  description: Create helm repo.
  operationId: create_helm_repo
  x-service: catalog-service
  x-internal: true
  x-authorize:
    resource-type: registries
    action: create
  tags:
    - HelmRepos
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../schemas/helmRepos/HelmRepoCreationRequest.yaml'
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../schemas/helmRepos/HelmRepo.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    409:
      $ref: '../../../../infra/openapi/docs/responses/409Conflict.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
