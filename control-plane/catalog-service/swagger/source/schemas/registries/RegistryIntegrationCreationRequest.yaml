type: object
required:
  - name
  - url
  - scopeType
  - scopeId
properties:
  name:
    type: string
    description: The name of the registry integration.
  url:
    type: string
    description: The URL of the registry integration.
  scopeType:
    $ref: '../../../../../infra/openapi/docs/schemas/scopes/ScopeType.yaml'
  scopeId:
    $ref: '../../../../../infra/openapi/docs/schemas/scopes/ScopeId.yaml'
    description: The ID of the scope. Mandatory for non-system scope registries.
    nullable: true
  description:
    type: string
    description: The description of the registry integration.
  version:
    type: string
    description: The version of the registry integration.
    x-internal: true