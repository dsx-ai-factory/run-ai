type: object
nullable: true
required: [allocationType, gpuCount, estimated]
properties:
  allocationType:
    type: string
    enum: [gpu_memory, gpu_count]
  gpuCount:
    type: integer
    format: int64
    minimum: 1
  gpuMemoryPerDeviceBytes:
    type: integer
    format: int64
    minimum: 1
  estimated:
    type: boolean
    description: Whether GPU count is a naive estimate. False describes allocation arithmetic only; it does not verify runtime or hardware compatibility.
  warning:
    type: string
    description: Conditional sizing prerequisites, unverified hardware/runtime compatibility, and limitations of an estimated count. Read before using the allocation.
