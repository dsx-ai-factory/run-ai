<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1630" viewBox="0 0 2200 1630">
  <rect x="0" y="0" width="2200" height="1630" rx="0" fill="#F5F7FB" />
  <text x="70" y="74" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#132C42" text-anchor="start" dominant-baseline="central">NIM sizing: from request to recommendation</text>
  <text x="70" y="131" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#52677D" text-anchor="start" dominant-baseline="central">Implemented API + CLI flow | Current PR behavior | No deployment or reservation</text>
  <rect x="70" y="175" width="42" height="42" rx="12" fill="#132C42" />
  <text x="91" y="196" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="130" y="196" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#132C42" text-anchor="start" dominant-baseline="central">Request, authorization and cluster inventory</text>
  <rect x="70" y="250" width="620" height="225" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="94" y="286" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">1  API or CLI request</text>
  <text x="94" y="331" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Model image + exact tag + clusterId</text>
  <text x="94" y="367" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Optional gpuType / --gpu-type</text>
  <text x="94" y="403" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">CLI uses the selected cluster context</text>
  <rect x="790" y="250" width="620" height="225" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="814" y="286" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">2  Authorize + validate</text>
  <text x="814" y="331" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Require inference-create permission</text>
  <text x="814" y="367" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Validate cluster, image, tag and type</text>
  <text x="814" y="403" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Rejected requests stop here</text>
  <rect x="1510" y="250" width="620" height="225" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="1534" y="286" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">3  Read + select inventory</text>
  <text x="1534" y="331" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Read every authorized node-pool page</text>
  <text x="1534" y="367" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Exact GPU type, or all type/capacity pairs</text>
  <text x="1534" y="403" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Empty inventory + all types: 200, results []</text>
  <polyline points="690,362 790,362" fill="none" stroke="#176BA7" stroke-width="4" stroke-linejoin="round" />
  <polygon points="790,362 773.0,354.0 773.0,370.0" fill="#176BA7" />
  <polyline points="1410,362 1510,362" fill="none" stroke="#176BA7" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1510,362 1493.0,354.0 1493.0,370.0" fill="#176BA7" />
  <rect x="70" y="575" width="42" height="42" rx="12" fill="#132C42" />
  <text x="91" y="596" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="130" y="596" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#132C42" text-anchor="start" dominant-baseline="central">Fetch profiles, select a baseline, size the allocation</text>
  <text x="2130" y="596" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52677D" text-anchor="end" dominant-baseline="central">Continue from right to left</text>
  <rect x="1510" y="660" width="620" height="225" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="1534" y="696" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">4  Fetch exact-tag NGC data</text>
  <text x="1534" y="741" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">One metadata lookup for the model/tag</text>
  <text x="1534" y="777" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">404 / no profiles: valid absence of data</text>
  <text x="1534" y="813" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Transport or malformed response: 503</text>
  <rect x="790" y="660" width="620" height="225" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="814" y="696" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">5  Match + select profiles</text>
  <text x="814" y="741" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">For each selected type/capacity pair</text>
  <text x="814" y="777" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Fit first; direct &gt; tested &gt; GPU-agnostic</text>
  <text x="814" y="813" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Lowest minimum, then profile ID</text>
  <rect x="70" y="660" width="620" height="225" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="94" y="696" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">6  Apply sharing policy</text>
  <text x="94" y="741" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Below 90%: allocate required memory</text>
  <text x="94" y="777" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">90% through capacity: one whole GPU</text>
  <text x="94" y="813" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Above capacity: estimated GPU count</text>
  <polyline points="1820,475 1820,660" fill="none" stroke="#176BA7" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1820,660 1828.0,643.0 1812.0,643.0" fill="#176BA7" />
  <rect x="1698.5" y="527" width="243" height="36" rx="5" fill="#F5F7FB" />
  <text x="1820" y="545" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#176BA7" text-anchor="middle" dominant-baseline="central">Selection nonempty</text>
  <polyline points="1510,772 1410,772" fill="none" stroke="#176BA7" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1410,772 1427.0,780.0 1427.0,764.0" fill="#176BA7" />
  <polyline points="790,772 690,772" fill="none" stroke="#176BA7" stroke-width="4" stroke-linejoin="round" />
  <polygon points="690,772 707.0,780.0 707.0,764.0" fill="#176BA7" />
  <rect x="70" y="985" width="42" height="42" rx="12" fill="#132C42" />
  <text x="91" y="1006" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="130" y="1006" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#132C42" text-anchor="start" dominant-baseline="central">Return a distinct API outcome</text>
  <text x="2130" y="1006" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52677D" text-anchor="end" dominant-baseline="central">HTTP 200 may mix result statuses</text>
  <rect x="70" y="1100" width="620" height="210" rx="20" fill="#EAF6EF" stroke="#23784E" stroke-width="2" />
  <text x="94" y="1136" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#23784E" text-anchor="start" dominant-baseline="central">200  recommended</text>
  <text x="94" y="1181" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Profile ID, precision, backend, minimum</text>
  <text x="94" y="1217" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Memory allocation or GPU count</text>
  <text x="94" y="1253" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Evidence + runtime caveats in warning</text>
  <rect x="790" y="1100" width="620" height="210" rx="20" fill="#FFF5E0" stroke="#986313" stroke-width="2" />
  <text x="814" y="1136" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#986313" text-anchor="start" dominant-baseline="central">200  no_recommendation</text>
  <text x="814" y="1181" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Missing capacity or usable profile data</text>
  <text x="814" y="1217" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Explain why this entry cannot be sized</text>
  <text x="814" y="1253" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">No suggested allocation for this entry</text>
  <rect x="1510" y="1100" width="620" height="210" rx="20" fill="#FFF0F2" stroke="#B32D42" stroke-width="2" />
  <text x="1534" y="1136" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#B32D42" text-anchor="start" dominant-baseline="central">Request failed</text>
  <text x="1534" y="1181" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">400: invalid input / absent explicit type</text>
  <text x="1534" y="1217" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">401 / 403: access boundary rejected it</text>
  <text x="1534" y="1253" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">503: inventory or NGC retrieval failed</text>
  <polyline points="380,885 380,970 740,970 740,1070 380,1070 380,1100" fill="none" stroke="#23784E" stroke-width="4" stroke-linejoin="round" />
  <polygon points="380,1100 388.0,1083.0 372.0,1083.0" fill="#23784E" />
  <rect x="205.0" y="912" width="350" height="36" rx="5" fill="#F5F7FB" />
  <text x="380" y="930" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#23784E" text-anchor="middle" dominant-baseline="central">Published minimum available</text>
  <polyline points="1100,885 1100,1100" fill="none" stroke="#986313" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1100,1100 1108.0,1083.0 1092.0,1083.0" fill="#986313" />
  <rect x="920.5" y="947" width="359" height="36" rx="5" fill="#F5F7FB" />
  <text x="1100" y="965" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#986313" text-anchor="middle" dominant-baseline="central">No usable minimum / capacity</text>
  <polyline points="1100,250 1100,225 2160,225 2160,1060" fill="none" stroke="#B32D42" stroke-width="3" />
  <polyline points="2130,362 2160,362" fill="none" stroke="#B32D42" stroke-width="3" />
  <polyline points="2130,772 2160,772" fill="none" stroke="#B32D42" stroke-width="3" />
  <polyline points="2160,1060 1820,1060 1820,1100" fill="none" stroke="#B32D42" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1820,1100 1828.0,1083.0 1812.0,1083.0" fill="#B32D42" />
  <rect x="70" y="1380" width="2060" height="145" rx="20" fill="#EEF1F5" stroke="#52677D" stroke-width="2" />
  <text x="94" y="1416" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#52677D" text-anchor="start" dominant-baseline="central">Current boundary</text>
  <text x="94" y="1461" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Sizing stops at the response. It does not deploy a model, reserve resources, check quota or automatically prefill a UI.</text>
  <text x="94" y="1497" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Installed capacity is not free capacity. Users or a separate integration may apply the suggestion through an existing deploy flow.</text>
  <text x="70" y="1580" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52677D" text-anchor="start" dominant-baseline="central">Blue: processing   Green: successful result   Amber: supported alternative / estimate   Red: failure   Gray: context</text>
</svg>