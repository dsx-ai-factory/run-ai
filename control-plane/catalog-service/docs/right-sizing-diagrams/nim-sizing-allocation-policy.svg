<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
  <rect x="0" y="0" width="2200" height="1700" rx="0" fill="#F5F7FB" />
  <text x="70" y="74" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#132C42" text-anchor="start" dominant-baseline="central">Allocation policy: minimum to resource request</text>
  <text x="70" y="131" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#52677D" text-anchor="start" dominant-baseline="central">After profile selection | Sharing cutoff defaults to 90% | Examples use decimal 80 GB capacity</text>
  <rect x="70" y="175" width="42" height="42" rx="12" fill="#132C42" />
  <text x="91" y="196" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="130" y="196" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#132C42" text-anchor="start" dominant-baseline="central">Start with the selected profile and reported capacity</text>
  <rect x="70" y="250" width="620" height="225" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="94" y="286" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">Published minimum</text>
  <text x="94" y="331" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Use the selected profile as published.</text>
  <text x="94" y="367" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Explicit TP=1 and PP=1 baseline.</text>
  <text x="94" y="403" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">No invented extra headroom.</text>
  <rect x="790" y="250" width="620" height="225" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="814" y="286" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">Reported device capacity</text>
  <text x="814" y="331" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Use per-device bytes from inventory.</text>
  <text x="814" y="367" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Positive capacity is required.</text>
  <text x="814" y="403" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Not free memory or project quota.</text>
  <rect x="1510" y="250" width="620" height="225" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="1534" y="286" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">One sharing-policy value</text>
  <text x="1534" y="331" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">WHOLE_GPU_CUTOFF_PERCENT</text>
  <text x="1534" y="367" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Default 90; valid range 1 through 100.</text>
  <text x="1534" y="403" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Invalid configuration is rejected.</text>
  <polyline points="380,475 380,525 1820,525 1820,475" fill="none" stroke="#176BA7" stroke-width="3" />
  <polyline points="1100,475 1100,525" fill="none" stroke="#176BA7" stroke-width="3" />
  <polyline points="1100,525 1100,595" fill="none" stroke="#176BA7" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1100,595 1108.0,578.0 1092.0,578.0" fill="#176BA7" />
  <rect x="70" y="530" width="42" height="42" rx="12" fill="#132C42" />
  <text x="91" y="551" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="130" y="551" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#132C42" text-anchor="start" dominant-baseline="central">Convert units and apply the cutoff</text>
  <rect x="70" y="595" width="2060" height="155" rx="20" fill="#EDF5FC" stroke="#176BA7" stroke-width="2" />
  <text x="94" y="631" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#176BA7" text-anchor="start" dominant-baseline="central">Compute in bytes without changing the published minimum</text>
  <text x="94" y="676" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">m = ceil(published minimum GB x 1,000,000,000); C = reported capacity bytes.</text>
  <text x="94" y="712" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Whole-GPU threshold = ceil(C x cutoffPercent / 100). Compare m with that threshold and C.</text>
  <rect x="70" y="780" width="42" height="42" rx="12" fill="#132C42" />
  <text x="91" y="801" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="130" y="801" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#132C42" text-anchor="start" dominant-baseline="central">Return one of three allocations</text>
  <text x="2130" y="801" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52677D" text-anchor="end" dominant-baseline="central">These ranges show the default 90% policy</text>
  <polyline points="1100,750 1100,850" fill="none" stroke="#176BA7" stroke-width="3" />
  <polyline points="380,850 1820,850" fill="none" stroke="#176BA7" stroke-width="3" />
  <polyline points="380,850 380,900" fill="none" stroke="#176BA7" stroke-width="4" stroke-linejoin="round" />
  <polygon points="380,900 388.0,883.0 372.0,883.0" fill="#176BA7" />
  <polyline points="1100,850 1100,900" fill="none" stroke="#176BA7" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1100,900 1108.0,883.0 1092.0,883.0" fill="#176BA7" />
  <polyline points="1820,850 1820,900" fill="none" stroke="#176BA7" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1820,900 1828.0,883.0 1812.0,883.0" fill="#176BA7" />
  <rect x="70" y="900" width="620" height="190" rx="20" fill="#EAF6EF" stroke="#23784E" stroke-width="2" />
  <text x="94" y="936" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#23784E" text-anchor="start" dominant-baseline="central">Below 90% of capacity</text>
  <text x="94" y="981" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">allocationType: gpu_memory; count: 1</text>
  <text x="94" y="1017" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">gpuMemoryPerDeviceBytes = m</text>
  <text x="94" y="1053" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">estimated: false</text>
  <rect x="790" y="900" width="620" height="190" rx="20" fill="#EAF6EF" stroke="#23784E" stroke-width="2" />
  <text x="814" y="936" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#23784E" text-anchor="start" dominant-baseline="central">90% through 100%</text>
  <text x="814" y="981" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">allocationType: gpu_count; count: 1</text>
  <text x="814" y="1017" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">gpuMemoryPerDeviceBytes = C</text>
  <text x="814" y="1053" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">estimated: false</text>
  <rect x="1510" y="900" width="620" height="190" rx="20" fill="#FFF5E0" stroke="#986313" stroke-width="2" />
  <text x="1534" y="936" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#986313" text-anchor="start" dominant-baseline="central">Above device capacity</text>
  <text x="1534" y="981" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">gpu_count = ceil(m / C)</text>
  <text x="1534" y="1017" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">No per-device memory allocation.</text>
  <text x="1534" y="1053" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">estimated: true + count warning</text>
  <rect x="70" y="1170" width="620" height="160" rx="20" fill="#EAF6EF" stroke="#23784E" stroke-width="2" />
  <text x="94" y="1206" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#23784E" text-anchor="start" dominant-baseline="central">Example: 71.9 / 80 GB</text>
  <text x="94" y="1251" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Below the 72 GB threshold.</text>
  <text x="94" y="1287" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Request 71.9 GB of GPU memory.</text>
  <rect x="790" y="1170" width="620" height="160" rx="20" fill="#EAF6EF" stroke="#23784E" stroke-width="2" />
  <text x="814" y="1206" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#23784E" text-anchor="start" dominant-baseline="central">Example: 72 / 80 GB</text>
  <text x="814" y="1251" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Exactly at the 90% threshold.</text>
  <text x="814" y="1287" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Request one whole GPU (80 GB).</text>
  <rect x="1510" y="1170" width="620" height="160" rx="20" fill="#FFF5E0" stroke="#986313" stroke-width="2" />
  <text x="1534" y="1206" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#986313" text-anchor="start" dominant-baseline="central">Example: 81 / 80 GB</text>
  <text x="1534" y="1251" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Requirement exceeds one device.</text>
  <text x="1534" y="1287" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Estimate two GPUs; TP is not validated.</text>
  <polyline points="380,1090 380,1170" fill="none" stroke="#23784E" stroke-width="4" stroke-linejoin="round" />
  <polygon points="380,1170 388.0,1153.0 372.0,1153.0" fill="#23784E" />
  <polyline points="1100,1090 1100,1170" fill="none" stroke="#23784E" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1100,1170 1108.0,1153.0 1092.0,1153.0" fill="#23784E" />
  <polyline points="1820,1090 1820,1170" fill="none" stroke="#986313" stroke-width="4" stroke-linejoin="round" />
  <polygon points="1820,1170 1828.0,1153.0 1812.0,1153.0" fill="#986313" />
  <rect x="70" y="1410" width="2060" height="175" rx="20" fill="#EEF1F5" stroke="#52677D" stroke-width="2" />
  <text x="94" y="1446" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#52677D" text-anchor="start" dominant-baseline="central">Meaning and limits</text>
  <text x="94" y="1491" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">The cutoff is a sharing rule, not OOM protection. Numerical allocation does not establish runtime compatibility.</text>
  <text x="94" y="1527" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Estimated counts do not verify device availability, a supported tensor-parallel configuration or schedulability.</text>
  <text x="94" y="1563" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#132C42" text-anchor="start" dominant-baseline="central">Upstream says minima include runtime overhead and baseline KV cache; exact settings await written confirmation.</text>
  <text x="70" y="1650" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52677D" text-anchor="start" dominant-baseline="central">Blue: processing   Green: successful result   Amber: supported alternative / estimate   Red: failure   Gray: context</text>
</svg>