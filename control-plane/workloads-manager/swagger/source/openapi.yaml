openapi: "3.0.3"
info:
  version: 1.0.0
  title: Workloads V2 Service
  contact:
    name: 'Run.AI'
    url: 'https://www.run.ai/'
    email: support@run.ai
servers:
  - url: https://app.run.ai
  - url: https://staging.run.ai
  - url: https://test.run.ai
  - url: http://localhost:8080
security:
  - bearerAuth: []
components:
  responses:
    $ref: "../../../infra/openapi/docs/responses/_index.yaml"
  securitySchemes:
    $ref: "./securitySchemes/_index.yaml"
  parameters:
    $ref: "./parameters/_index.yaml"
  schemas:
    $ref: "./schemas/_index.yaml"

paths:
  /:
    x-internal: true
    get:
      summary: health check
      x-service: workloads-manager
      x-no-authorization: true
      operationId: health
      tags:
        - Health
      responses:
        200:
          description: Executed successfully.


  /api/v2/workloads:
    $ref: "./resources/WorkloadsV2.yaml"
  /api/v2/workloads/{WorkloadV2Id}:
    $ref: "./resources/WorkloadsV2ById.yaml"
  /api/v2/workloads/{WorkloadV2Id}/runState:
    $ref: "./resources/WorkloadsV2ByIdRunState.yaml"
  /api/v2/workloads/updates:
    x-internal: true
    $ref: "./resources/WorkloadsV2Updates.yaml"
  ## Internal endpoint for v1-to-v2 converted workloads (trusted, skips GVK policy)
  /internal/v2/workloads:
    $ref: "./resources/InternalWorkloads.yaml"
  /internal/v2/workloads/{WorkloadV2Id}:
    $ref: "./resources/InternalWorkloadsById.yaml"

  /api/v2/workloads/nim-services:
    $ref: "./resources/NimServices.yaml"
  /api/v2/workloads/nim-services/{WorkloadV2Id}:
    $ref: "./resources/NimServiceById.yaml"

  /api/v2/workloads/settings:
    x-scope: [ system, tenant ]
    $ref: "./resources/Settings/WorkloadSettings.yaml"
  /api/v2/workloads/settings/{key}:
    x-scope: [ system, tenant ]
    $ref: "./resources/Settings/WorkloadSettingsByKey.yaml"

  ## batch workloads request from the workloads service, who currently manages
  ## the batch requests for all the workloads.
  /internal/workloads/batch:
    $ref: "./resources/Batch.yaml"
