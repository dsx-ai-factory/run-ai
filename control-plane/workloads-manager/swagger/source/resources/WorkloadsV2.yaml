  description: Submit a workload with metadata and a Kubernetes manifest.
  operationId: create_workload_v2
  x-service: workloads-manager
  x-test-coverage:
    - control-plane/workloads-manager/pkg/services/services_test.go
  x-authorize:
    resource-type: workloads
    action: create
  tags:
    - Workloads V2
  parameters:
