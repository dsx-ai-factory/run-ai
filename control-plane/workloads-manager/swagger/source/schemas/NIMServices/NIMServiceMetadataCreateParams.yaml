type: object
required:
  - name
  - projectId
properties:
  name:
    $ref: '../../../../../infra/openapi/docs/schemas/workloads/WorkloadName.yaml'
  useGivenNameAsPrefix:
    description: When true, the requested name will be treated as a prefix. The final
      name of the workload will be composed of the name followed by a random set of characters.
    type: boolean
    example: true
    default: false
  projectId:
    $ref: '../../../../../infra/openapi/docs/schemas/scopes/ProjectId.yaml'
