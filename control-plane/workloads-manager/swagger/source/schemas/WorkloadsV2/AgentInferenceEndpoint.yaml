type: object
nullable: true
additionalProperties: false
description: Server-resolved inference routing intent for the Agent. Omitted for workloads without managed inference routing.
required:
  - schemaVersion
  - spec
properties:
  schemaVersion:
    type: string
    description: Version of the transport envelope, currently v1. Consumers reject unsupported versions.
  spec:
    type: object
    additionalProperties: true
    description: Resolved InferenceEndpoint spec, validated against the installed CRD when applied. Does not include resource identity, ownership, or status.
