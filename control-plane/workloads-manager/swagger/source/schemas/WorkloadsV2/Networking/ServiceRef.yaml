type: object
description: Reference an existing Service. Requires authorization on the service and externalAccess on the endpoint. The Service and its destination Pods must belong to the same workload; the referenced Service is not modified.
nullable: true
properties:
  name:
    description: The name of the existing Kubernetes Service.
    type: string
    minLength: 1
    maxLength: 63
    example: existing-service
  port:
    description: The port on the existing Service to route traffic to.
    type: integer
    format: int32
    minimum: 1
    maximum: 65535
    example: 8000
required:
  - name
  - port
