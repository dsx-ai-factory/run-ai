type: object
description: Reference an existing Service.
nullable: true
properties:
  name:
    description: The name of the existing Kubernetes Service.
    type: string
    minLength: 1
    maxLength: 253
    example: existing-service
  port:
    description: The port on the existing Service to route traffic to.
    type: integer
    format: int32
    minimum: 1
    maximum: 65535
    example: 8000
required:
  - name
  - port
