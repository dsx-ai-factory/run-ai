type: object
description: Service specification to create for a workload endpoint.
nullable: true
properties:
  name:
    description: The Kubernetes Service name.
    type: string
    minLength: 1
    maxLength: 63
    example: workload-service
  type:
    description: Kubernetes service type that determines how the service is exposed.
    $ref: "./ServiceType.yaml"
  selector:
    description: Pod labels used to select destination Pods within this workload. All selector entries must match.
    type: object
    additionalProperties:
      type: string
    example:
      app: my-app
    nullable: true
  labels:
    description: Labels to apply to the Kubernetes Service. Run:ai metrics labels trigger metrics-specific behavior and validation.
    type: object
    additionalProperties:
      type: string
    example:
      app: my-app
  ports:
    description: Ports exposed by the Service. Attached Ingress and HTTPRoute backends and the authentication proxy use the first port.
    type: array
    minItems: 1
    maxItems: 1000
    items:
      $ref: "./ServicePort.yaml"
required:
  - name
  - selector
  - ports
