type: object
description: |-
  Access control for this networking endpoint. Requires externalAccess and an explicit authorizationType.
  Only the access list selected by authorizationType may be nonempty; authenticatedUsers requires both lists to be empty.
example:
  forceJsonResponse: false
  authorizationType: authenticatedUsers
allOf:
  - $ref: "../../../../../../infra/openapi/docs/schemas/workloads_spec/connectivity/Authorization.yaml"
  - type: object
    properties:
      forceJsonResponse:
        description: Force JSON errors instead of HTTP error pages or redirects.
        type: boolean
        default: false
        nullable: true
required:
  - authorizationType
nullable: true
