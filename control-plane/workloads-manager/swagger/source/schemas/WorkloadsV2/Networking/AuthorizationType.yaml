type: string
enum:
  - authenticatedUsers
  - authorizedUsers
  - authorizedGroups
description: |-
  Specifies who can access the endpoint through its authentication proxy. Must be provided explicitly.
  - `authenticatedUsers`: Any authenticated user or service account can access. Both access lists must be omitted or empty.
  - `authorizedUsers`: Only users or service accounts in the nonempty authorizedUsers list can access. authorizedGroups must be omitted or empty.
  - `authorizedGroups`: Only members of groups in the nonempty authorizedGroups list can access. authorizedUsers must be omitted or empty.
  Incompatible nonempty access lists are rejected, not ignored.
nullable: true
