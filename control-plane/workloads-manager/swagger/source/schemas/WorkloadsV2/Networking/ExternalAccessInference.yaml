type: object
nullable: true
additionalProperties: false
description: |-
  Server-resolved inference routing for this endpoint. Set only by the control plane; rejected in workload submissions.
  Requires httpRoute and one created Service on the same endpoint. The cluster then creates an InferenceEndpoint instead of the HTTPRoute,
  and derives its workload selector, target port, Gateway, hostnames and default backend from that Service and httpRoute.
required:
  - epp
properties:
  epp:
    type: object
    additionalProperties: true
    description: InferenceEndpoint spec.epp, for example the EPP profile. Validated against the installed CRD when applied.
  objectives:
    type: array
    nullable: true
    maxItems: 1000
    description: InferenceEndpoint spec.objectives. Omitted when there are none.
    items:
      type: object
      additionalProperties: true
  rewrites:
    type: array
    nullable: true
    maxItems: 1000
    description: InferenceEndpoint spec.rewrites. Omitted when there are none.
    items:
      type: object
      additionalProperties: true
