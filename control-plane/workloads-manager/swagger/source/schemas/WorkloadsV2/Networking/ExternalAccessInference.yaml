type: object
nullable: true
additionalProperties: false
description: |-
  Server-resolved inference routing for this endpoint. Set only by the control plane; rejected in workload submissions.
  Requires httpRoute and one created Service, or a reference to the NIMService's Service, on the same endpoint.
  The cluster then creates an InferenceEndpoint instead of the HTTPRoute, and derives its workload selector, target port,
  Gateway and hostnames from that Service and httpRoute.
required:
  - epp
properties:
  epp:
    type: object
    additionalProperties: true
    description: InferenceEndpoint spec.epp, for example the EPP profile. Validated against the installed CRD when applied.
  pathPrefix:
    type: string
    maxLength: 1024
    description: The path whose requests go through the endpoint picker. When omitted, the prefix is /v1.
