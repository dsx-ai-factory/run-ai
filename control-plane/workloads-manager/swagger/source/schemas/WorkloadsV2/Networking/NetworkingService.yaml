type: object
description: Service configuration for routing traffic to the workload. Provide exactly one of spec or ref.
properties:
  spec:
    description: Specification for a new Kubernetes service to create for this endpoint. Mutually exclusive with `ref`.
    $ref: "./ServiceSpec.yaml"
  ref:
    description: Reference to an existing Kubernetes service. Mutually exclusive with `spec`.
    $ref: "./ServiceRef.yaml"
  authorization:
    description: Access control configuration for traffic through this endpoint. Required when using ref. Requires externalAccess on the endpoint.
    $ref: "./Workloadv2Authorization.yaml"
