type: object
description: |-
  A single networking endpoint. Provide a Service, externalAccess containing an Ingress, Route, or HTTPRoute, or both.
  An endpoint may create or reference at most one Service. Authorization requires externalAccess.
properties:
  externalAccess:
    description: External access configuration for exposing the endpoint outside the cluster.
    $ref: "./ExternalAccess.yaml"
  services:
    description: Kubernetes service to create or reference for this endpoint (maximum one).
    type: array
    maxItems: 1
    items:
      $ref: "./NetworkingService.yaml"
    nullable: true
