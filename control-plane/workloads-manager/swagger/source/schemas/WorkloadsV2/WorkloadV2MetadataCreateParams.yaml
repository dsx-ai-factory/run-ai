type: object
properties:
  name:
    description: The name of the workload.
    type: string
    maxLength: 63
    example: my-workload-name
    pattern: .*
  useGivenNameAsPrefix:
    description: When true, the requested name will be treated as a prefix. The final
      name of the workload will be composed of the name followed by a random set of characters.
    type: boolean
    example: true
    default: false
  projectId:
    $ref: '../../../../../infra/openapi/docs/schemas/scopes/ProjectId.yaml'
  clusterId:
    $ref: '../../../../../infra/openapi/docs/schemas/scopes/ClusterId.yaml'
  priority:
    $ref: '../../../../../infra/openapi/docs/schemas/workloads_spec/resources/PriorityClass.yaml'
  category:
    $ref: '../../../../../infra/openapi/docs/schemas/workloads_spec/resources/Category.yaml'
  preemptibility:
    $ref: '../../../../../infra/openapi/docs/schemas/workloads_spec/advanced/Preemptibility.yaml'
  configuration:
    $ref: './WorkloadV2Configuration.yaml'