  schemas:
    ProjectId:
      description: The id of the project.
      example: "1"
      pattern: .*
      type: string
    ClusterId:
      description: The id of the cluster.
      example: 71f69d83-ba66-4822-adf5-55ce55efd210
      format: uuid
      type: string
    PriorityClass:
      description: "Specifies the priority class for the workload, which determines\
        \ its scheduling behavior. Valid values are: very-low, low, medium-low, medium,\
        \ medium-high, high, and very-high. Each workload type has a default priority.\
        \ To view the default priority for each workload type, use the GET /workload-types\
        \ endpoint. Once you change the priority from the default value defined for\
        \ that workload type, the preemptibility field is not automatically updated.\
        \ Make sure to set the desired preemptibility value."
      nullable: true
      pattern: .*
      type: string
    Category:
      description: Specify the workload category assigned to the workload. Categories
        are used to classify and monitor different types of workloads within the NVIDIA
        Run:ai platform.
      nullable: true
      pattern: .*
      type: string
    Preemptibility:
      description: "Specifies whether the workload can be preempted by higher-priority\
        \ workloads. Valid values are preemptible, semi-preemptible and non-preemptible.\
        \ If explicitly set, this value takes precedence. If not set, the system derives\
        \ the preemptibility from the priorityClassName field, ensuring backward compatibility.\
        \ Each workload type has a default preemptibility. To view the default preemptibility\
        \ for each workload type, use the GET /workload-types endpoint."
      enum:
      - preemptible
      - semi-preemptible
      - non-preemptible
      minLength: 1
      nullable: true
      type: string
    MnnvlMode:
      description: |
        MNNVL (Multi-Node NVLink) mode:
        - Required: The workload is configured to use MNNVL acceleration. The workload type and at least one project’s node pool must support MNNVL, or the request fails. When set, the workload is scheduled only on compatible nodes, and may remain pending until sufficient MNNVL-capable capacity is available.
        - None: The workload will not use MNNVL acceleration, even if MNNVL-capable nodes are available.
      enum:
      - Required
      - None
      example: Required
      type: string
    ExternalAccess:
      description: "External access configuration. Same shape as the networking plugin.\
        \ Include ingress (Kubernetes), route (OpenShift), or httpRoute (Gateway API).\
        \ Omit or leave empty for no external access."
      example:
        ingress: "{}"
        route: "{}"
        httpRoute: "{}"
      nullable: true
      properties:
        ingress:
          description: Full Kubernetes Ingress resource (networking.k8s.io/v1). Used
            when cluster uses Ingress.
          nullable: true
          type: object
        route:
          description: Full OpenShift Route resource (route.openshift.io/v1). Used
            when cluster uses Route.
          nullable: true
          type: object
        httpRoute:
          description: Full Gateway API HTTPRoute resource (gateway.networking.k8s.io/v1).
            Used when cluster uses Gateway API.
          nullable: true
          type: object
      type: object
    ServiceType:
      default: ClusterIP
      description: The type of Kubernetes Service to create for the endpoint.
      enum:
      - ClusterIP
      - NodePort
      - LoadBalancer
      nullable: true
      type: string
    ServiceProtocol:
      default: TCP
      description: Service port protocol.
      enum:
      - TCP
      - UDP
      - SCTP
      nullable: true
      type: string
    ServicePort:
      description: Service port specification.
      example:
        protocol: TCP
        port: 8000
        name: http
        targetPort: 8000
        nodePort: 30080
      properties:
        name:
          description: The Service port name.
          example: http
          maxLength: 63
          minLength: 1
          nullable: true
          type: string
        port:
          description: The port exposed by the Service.
          example: 8000
          format: int32
          maximum: 65535
          minimum: 1
          type: integer
        targetPort:
          description: The container port that receives traffic from the Service.
          example: 8000
          format: int32
          maximum: 65535
          minimum: 1
          nullable: true
          type: integer
        nodePort:
          description: The externally allocated port for NodePort Services.
          example: 30080
          format: int32
          maximum: 65535
          minimum: 1
          nullable: true
          type: integer
        protocol:
          $ref: '#/components/schemas/ServiceProtocol'
      required:
      - port
      type: object
    ServiceSpec:
      description: Service specification to create for a workload endpoint.
      example:
        name: workload-service
        selector:
          app: my-app
        type: ClusterIP
        ports:
        - protocol: TCP
          port: 8000
          name: http
          targetPort: 8000
          nodePort: 30080
        - protocol: TCP
          port: 8000
          name: http
          targetPort: 8000
          nodePort: 30080
        - protocol: TCP
          port: 8000
          name: http
          targetPort: 8000
          nodePort: 30080
        - protocol: TCP
          port: 8000
          name: http
          targetPort: 8000
          nodePort: 30080
        - protocol: TCP
          port: 8000
          name: http
          targetPort: 8000
          nodePort: 30080
        labels:
          app: my-app
      nullable: true
      properties:
        name:
          description: The Kubernetes Service name.
          example: workload-service
          maxLength: 63
          minLength: 1
          type: string
        type:
          $ref: '#/components/schemas/ServiceType'
        selector:
          additionalProperties:
            type: string
          description: Label selector to identify the pods that this service routes
            traffic to.
          example:
            app: my-app
          nullable: true
          type: object
        labels:
          additionalProperties:
            type: string
          description: Labels to apply to the Kubernetes Service.
          example:
            app: my-app
          type: object
        ports:
          description: Ports exposed by the service.
          items:
            $ref: '#/components/schemas/ServicePort'
          maxItems: 1000
          minItems: 1
          type: array
      required:
      - name
      - ports
      - selector
      type: object
    ServiceRef:
      description: Reference an existing Service. Requires authorization on the service
        and externalAccess on the endpoint.
      example:
        port: 8000
        name: existing-service
      nullable: true
      properties:
        name:
          description: The name of the existing Kubernetes Service.
          example: existing-service
          maxLength: 63
          minLength: 1
          type: string
        port:
          description: The port on the existing Service to route traffic to.
          example: 8000
          format: int32
          maximum: 65535
          minimum: 1
          type: integer
      required:
      - name
      - port
      type: object
    AuthorizationType:
      description: |
        Specifies who can access the connection URL:
        - `authenticatedUsers`: Any authenticated user or service account can access the URL; the authorizedUsers and authorizedGroups fields are ignored.
        - `authorizedUsers`: Only users listed in the authorizedUsers field are allowed to access the URL; the authorizedGroups field is ignored.
        - `authorizedGroups`: Only members of user groups listed in the authorizedGroups field are allowed to access the URL; the authorizedUsers field is ignored.
        If not specified, authorization is determined by whether authorizedUsers or authorizedGroups is present. If both fields are set, this results in an error. If neither is set, any authenticatedUser can access.
      enum:
      - authenticatedUsers
      - authorizedUsers
      - authorizedGroups
      nullable: true
      type: string
    AuthorizedUsers:
      description: List of users or service accounts that are allowed to access the
        URL. Note that authorizedUsers and authorizedGroups are mutually exclusive.
      example:
      - user-a
      - user-b
      items:
        maxLength: 253
        pattern: .*
        type: string
      maxItems: 1000
      nullable: true
      type: array
    AuthorizedGroups:
      description: List of groups that are allowed to access the URL. Note that authorizedUsers
        and authorizedGroups are mutually exclusive.
      example:
      - group-a
      - group-b
      items:
        maxLength: 253
        pattern: .*
        type: string
      maxItems: 1000
      nullable: true
      type: array
    Authorization:
      description: Authorization configuration.
      nullable: true
      properties:
        authorizationType:
          $ref: '#/components/schemas/AuthorizationType'
        authorizedUsers:
          description: List of users or service accounts that are allowed to access
            the URL. Note that authorizedUsers and authorizedGroups are mutually exclusive.
          example:
          - user-a
          - user-b
          items:
            maxLength: 253
            pattern: .*
            type: string
          maxItems: 1000
          nullable: true
          type: array
        authorizedGroups:
          description: List of groups that are allowed to access the URL. Note that
            authorizedUsers and authorizedGroups are mutually exclusive.
          example:
          - group-a
          - group-b
          items:
            maxLength: 253
            pattern: .*
            type: string
          maxItems: 1000
          nullable: true
          type: array
      type: object
    Workloadv2Authorization:
      allOf:
      - $ref: '#/components/schemas/Authorization'
      - properties:
          forceJsonResponse:
            default: false
            description: Force JSON errors instead of HTTP error pages or redirects.
            nullable: true
            type: boolean
        type: object
      description: |-
        Access control for this networking endpoint. Requires externalAccess.
        Only the access list selected by authorizationType may be nonempty; authenticatedUsers requires both lists to be empty.
      example:
        forceJsonResponse: false
        authorizationType: authenticatedUsers
      nullable: true
      type: object
    NetworkingService:
      description: Service configuration for routing traffic to the workload. Provide
        exactly one of spec or ref.
      example:
        authorization:
          forceJsonResponse: false
          authorizationType: authenticatedUsers
        ref:
          port: 8000
          name: existing-service
        spec:
          name: workload-service
          selector:
            app: my-app
          type: ClusterIP
          ports:
          - protocol: TCP
            port: 8000
            name: http
            targetPort: 8000
            nodePort: 30080
          - protocol: TCP
            port: 8000
            name: http
            targetPort: 8000
            nodePort: 30080
          - protocol: TCP
            port: 8000
            name: http
            targetPort: 8000
            nodePort: 30080
          - protocol: TCP
            port: 8000
            name: http
            targetPort: 8000
            nodePort: 30080
          - protocol: TCP
            port: 8000
            name: http
            targetPort: 8000
            nodePort: 30080
          labels:
            app: my-app
      properties:
        spec:
          $ref: '#/components/schemas/ServiceSpec'
        ref:
          $ref: '#/components/schemas/ServiceRef'
        authorization:
          $ref: '#/components/schemas/Workloadv2Authorization'
      type: object
    NetworkingEndpoint:
      description: |-
        A single networking endpoint. Provide a Service, externalAccess containing an Ingress, Route, or HTTPRoute, or both.
        An endpoint may create or reference at most one Service. Authorization requires externalAccess.
      example:
        services:
        - authorization:
            forceJsonResponse: false
            authorizationType: authenticatedUsers
          ref:
            port: 8000
            name: existing-service
          spec:
            name: workload-service
            selector:
              app: my-app
            type: ClusterIP
            ports:
            - protocol: TCP
              port: 8000
              name: http
              targetPort: 8000
              nodePort: 30080
            - protocol: TCP
              port: 8000
              name: http
              targetPort: 8000
              nodePort: 30080
            - protocol: TCP
              port: 8000
              name: http
              targetPort: 8000
              nodePort: 30080
            - protocol: TCP
              port: 8000
              name: http
              targetPort: 8000
              nodePort: 30080
            - protocol: TCP
              port: 8000
              name: http
              targetPort: 8000
              nodePort: 30080
            labels:
              app: my-app
        externalAccess:
          ingress: "{}"
          route: "{}"
          httpRoute: "{}"
      properties:
        externalAccess:
          $ref: '#/components/schemas/ExternalAccess'
        services:
          description: Kubernetes service to create or reference for this endpoint
            (maximum one).
          items:
            $ref: '#/components/schemas/NetworkingService'
          maxItems: 1
          nullable: true
          type: array
      type: object
    NetworkingConfiguration:
      description: |
        Networking endpoint configurations for the workload (external access, services with auth).
        Requires cluster version 3.0.0 or later.
      items:
        $ref: '#/components/schemas/NetworkingEndpoint'
      maxItems: 1000
      nullable: true
      type: array
    WorkloadV2UpdateConfigurationUserCredentialSource:
      additionalProperties: false
      example:
        ref: my-hf-token-abc1234567
      properties:
        ref:
          description: The name of the user credential.
          example: my-hf-token-abc1234567
          type: string
      required:
      - ref
      type: object
    WorkloadV2UpdateConfigurationUserCredentials:
      additionalProperties: false
      description: |
        User credentials to make available to the workload. Each entry references a
        user-created credential by name. User credentials can only be accessed by the
        user who created them.
      example:
        sources:
        - ref: my-hf-token-abc1234567
        - ref: my-hf-token-abc1234567
        - ref: my-hf-token-abc1234567
        - ref: my-hf-token-abc1234567
        - ref: my-hf-token-abc1234567
      nullable: true
      properties:
        sources:
          description: List of user credentials to make available to the workload.
          items:
            $ref: '#/components/schemas/WorkloadV2UpdateConfigurationUserCredentialSource'
          maxItems: 1000
          minItems: 1
          type: array
      type: object
    WorkloadV2UpdateConfigurationPvcMetadata:
      additionalProperties: false
      description: |
        PVC metadata forwarded to the created PVC as-is.
        The Namespace is determined by the WorkloadRunner.
      example:
        name: my-pytorch-pvc
        annotations:
          key: annotations
        labels:
          team: research
      properties:
        name:
          description: |
            PVC name. Must be unique across the workload's PVCs and conform to
            Kubernetes DNS-1123 subdomain rules.
          example: my-pytorch-pvc
          maxLength: 253
          minLength: 1
          pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
          type: string
        labels:
          additionalProperties:
            type: string
          description: |
            Labels to apply to the created PVC. Map of string keys and string values.
          example:
            team: research
          type: object
        annotations:
          additionalProperties:
            type: string
          description: |
            Annotations to apply to the created PVC. Map of string keys and string
            values. Commonly used to pass CSI driver hints.
          type: object
      required:
      - name
      type: object
    WorkloadV2UpdateConfigurationPvcAccessMode:
      description: |
        Access mode for the PVC. Values follow `v1.PersistentVolumeAccessMode`.
        - `ReadWriteOnce` mounts read/write by a single node.
        - `ReadOnlyMany` mounts read-only by many nodes.
        - `ReadWriteMany` mounts read/write by many nodes.
        - `ReadWriteOncePod` mounts read/write by a single pod.
      enum:
      - ReadWriteOnce
      - ReadOnlyMany
      - ReadWriteMany
      - ReadWriteOncePod
      example: ReadWriteOnce
      type: string
    WorkloadV2UpdateConfigurationPvcResources:
      additionalProperties: false
      description: Resource requirements for the PVC. Only `requests.storage` is supported.
      example:
        requests:
          storage: 1Gi
      properties:
        requests:
          $ref: '#/components/schemas/WorkloadV2UpdateConfigurationPvcResources_requests'
      required:
      - requests
      type: object
    WorkloadV2UpdateConfigurationPvcVolumeMode:
      description: |
        Volume mode for the PVC. `Filesystem` (default) presents the volume as a
        mounted filesystem; `Block` presents it as a raw block device.
      enum:
      - Filesystem
      - Block
      example: Filesystem
      type: string
    WorkloadV2UpdateConfigurationPvcSpec:
      additionalProperties: false
      description: |
        PersistentVolumeClaim spec. Subset of `v1.PersistentVolumeClaimSpec`.
      example:
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
        accessModes:
        - ReadWriteOnce
        volumeMode: ""
      properties:
        accessModes:
          description: Access modes the volume should support. At least one is required.
          example:
          - ReadWriteOnce
          items:
            $ref: '#/components/schemas/WorkloadV2UpdateConfigurationPvcAccessMode'
          maxItems: 4
          minItems: 1
          type: array
          uniqueItems: true
        resources:
          $ref: '#/components/schemas/WorkloadV2UpdateConfigurationPvcResources'
        storageClassName:
          description: |
            Name of the StorageClass to use. When omitted, the cluster's default
            StorageClass is used (if one is configured).
          example: standard
          maxLength: 253
          minLength: 1
          nullable: true
          pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
          type: string
        volumeMode:
          allOf:
          - $ref: '#/components/schemas/WorkloadV2UpdateConfigurationPvcVolumeMode'
          nullable: true
      required:
      - accessModes
      - resources
      type: object
    WorkloadV2UpdateConfigurationPvc:
      additionalProperties: false
      description: |
