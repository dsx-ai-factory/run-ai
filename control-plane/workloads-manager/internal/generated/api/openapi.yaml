openapi: 3.0.3
info:
  contact:
    email: support@run.ai
    name: Run.AI
    url: https://www.run.ai/
  title: Workloads V2 Service
  version: 1.0.0
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /:
    get:
      operationId: health
      responses:
        "200":
          description: Executed successfully.
      summary: health check
      tags:
      - Health
      x-service: workloads-manager
      x-no-authorization: true
    x-internal: true
  /api/v2/workloads:
    post:
      description: Submit a workload with metadata and a Kubernetes manifest.
      operationId: create_workload_v2
      parameters:
      - description: "True to perform validations only, without side effects."
        explode: true
        in: query
        name: dryRun
        required: false
        schema:
          default: false
          example: false
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadV2CreateRequest'
        description: Workload metadata and manifest
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadV2'
          description: Workload creation request accepted.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "409":
          content:
            application/json:
              example:
                code: 409
                message: Resource with this name already exists
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource already exists
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Create a workload.
      tags:
      - Workloads V2
      x-service: workloads-manager
      x-test-coverage:
      - control-plane/workloads-manager/pkg/services/services_test.go
      x-authorize:
        resource-type: workloads
        action: create
