  /api/v2/workloads/updates:
    post:
      description: "Retrieve pending updates for workloads that need to be processed\
        \ by the cluster agent, and report sync issues"
      operationId: get_workload_v2_updates
      parameters:
      - description: The id of the cluster
        explode: true
        in: query
        name: clusterId
        required: true
        schema:
          example: d73a738f-fab3-430a-8fa3-5241493d7128
          format: uuid
          type: string
        style: form
      - description: list only data with update counter greater than the provided
          value. for example updatesAfter=5 should fetch data with updates counter
          6 and above.
        explode: true
        in: query
        name: updatesAfter
        required: true
        schema:
          example: 12345
          format: int64
          type: integer
        style: form
      - description: The maximum number of entries to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 500
          minimum: 1
          type: integer
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterSyncReport'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadsV2Updates'
          description: Request completed successfully.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
