    NimServiceSpec_allOf_compute:
      example:
        cpuMemoryLimit: 30M
        gpuMemoryLimit: 10M
        cpuCoreLimit: 2
        gpuRequestType: portion
        cpuMemoryRequest: 20M
        gpuDevicesRequest: 1
        gpuMemoryRequest: 10M
        gpuMemoryPortionLimit: 0.5
        gpuPortionRequest: 0.5
        gpuComputeMode: time-slicing
        gpuMemoryPortionRequest: 0.5
        cpuCoreRequest: 0.5
        gpuPortionLimit: 0.5
      nullable: true
      properties:
        cpuCoreLimit:
          description: "Limitations on the number of CPUs consumed by the workload\
            \ (0.5, 1, .etc). The system guarantees that this workload will not be\
            \ able to consume more than this amount of CPUs."
          example: 2
          format: double
          minimum: 0
          nullable: true
          type: number
        cpuCoreRequest:
          description: "CPU units to allocate for the created workload (0.5, 1, .etc).\
            \ The workload will receive at least this amount of CPU. Note that the\
            \ workload will not be scheduled unless the system can guarantee this\
            \ amount of CPUs to the workload."
          example: 0.5
          format: double
          minimum: 0
          nullable: true
          type: number
        cpuMemoryLimit:
          description: "Limitations on the CPU memory to allocate for this workload\
            \ (1G, 20M, .etc). The system guarantees that this workload will not be\
            \ able to consume more than this amount of memory. The workload will receive\
            \ an error when trying to allocate more memory than this limit."
          example: 30M
          maxLength: 63
          nullable: true
          pattern: "^([+]?[0-9.]+)([eEinumkKMGTP]*[-+]?[0-9]*)$"
          type: string
        cpuMemoryRequest:
          description: "The amount of CPU memory to allocate for this workload (1G,\
            \ 20M, .etc). The workload will receive at least this amount of memory.\
            \ Note that the workload will not be scheduled unless the system can guarantee\
            \ this amount of memory to the workload"
          example: 20M
          maxLength: 63
          nullable: true
          pattern: "^([+]?[0-9.]+)([eEinumkKMGTP]*[-+]?[0-9]*)$"
          type: string
        gpuComputeMode:
          $ref: '#/components/schemas/GpuComputeMode'
        gpuDevicesRequest:
          description: "Requested number of GPU devices. Currently if more than one\
            \ device is requested, it is not possible to provide values for gpuMemory\
            \ or gpuPortion."
          example: 1
          format: int32
          minimum: 0
          nullable: true
          type: integer
        gpuMemoryLimit:
          description: "Limitation on the memory consumed by the workload, per GPU\
            \ device. The system guarantees The gpuMemoryLimit must be no less than\
            \ gpuMemoryRequest."
          example: 10M
          maxLength: 63
          nullable: true
          pattern: "^([+]?[0-9.]+)([eEinumkKMGTP]*[-+]?[0-9]*)$"
          type: string
        gpuMemoryPortionLimit:
          description: Maximum GPU memory fraction consumed per GPU device. Must be
            no less than gpuMemoryPortionRequest.
          example: 0.5
          format: double
          minimum: 0
          nullable: true
          type: number
          x-gorm-ignore: true
        gpuMemoryPortionRequest:
          description: "GPU memory fraction to allocate per GPU device, between 0\
            \ and 1. Required when gpuRequestType is portion."
          example: 0.5
          format: double
          maximum: 1
          minimum: 0
          nullable: true
          type: number
          x-gorm-ignore: true
        gpuMemoryRequest:
          description: "Required if and only if gpuRequestType is memory. States the\
            \ GPU memory to allocate for the created workload, per GPU device. Note\
            \ that the workload will not be scheduled unless the system can guarantee\
            \ this amount of GPU memory to the workload."
          example: 10M
          maxLength: 63
          nullable: true
          pattern: "^([+]?[0-9.]+)([eEinumkKMGTP]*[-+]?[0-9]*)$"
          type: string
        gpuPortionLimit:
          deprecated: true
          description: "Deprecated. Use gpuMemoryPortionLimit instead. Limitations\
            \ on the portion consumed by the workload, per GPU device. The system\
            \ guarantees The gpuPotionLimit must be no less than the gpuPortionRequest."
          example: 0.5
          format: double
          minimum: 0
          nullable: true
          type: number
        gpuPortionRequest:
          deprecated: true
          description: "Deprecated. Use gpuMemoryPortionRequest instead. Required\
            \ if and only if gpuRequestType is portion. States the portion of the\
            \ GPU to allocate for the created workload, per GPU device, between 0\
            \ and 1. The default is no allocated GPUs."
          example: 0.5
          format: double
          minimum: 0
          nullable: true
          type: number
        gpuRequestType:
          $ref: '#/components/schemas/GpuRequestType'
      type: object
