components:
  parameters:
    DryRun:
      description: "True to perform validations only, without side effects."
      explode: true
      in: query
      name: dryRun
      required: false
      schema:
        default: false
        example: false
        type: boolean
      style: form
    WorkloadV2Id:
      explode: false
      in: path
      name: WorkloadV2Id
      required: true
      schema:
        description: The ID of the workload.
        format: uuid
        type: string
      style: simple
    ClusterIdRequired:
      description: The id of the cluster
      explode: true
      in: query
      name: clusterId
      required: true
      schema:
        example: d73a738f-fab3-430a-8fa3-5241493d7128
        format: uuid
        type: string
      style: form
    UpdatesAfter:
      description: list only data with update counter greater than the provided value.
        for example updatesAfter=5 should fetch data with updates counter 6 and above.
      explode: true
      in: query
      name: updatesAfter
      required: true
      schema:
        example: 12345
        format: int64
        type: integer
      style: form
    Limit:
      description: The maximum number of entries to return.
      explode: true
      in: query
      name: limit
      required: false
      schema:
        default: 50
        format: int32
        maximum: 500
        minimum: 1
        type: integer
      style: form
    TenantId:
      description: If exists will return the relevant resource for the tenant ID
      example: "1008"
      explode: true
      in: query
      name: tenantId
      required: false
      schema:
        default: ""
        type: string
      style: form
      x-scope:
      - system
    WorkloadSettingsKey:
      description: The settings key
      explode: false
      in: path
      name: key
      required: true
      schema:
        $ref: '#/components/schemas/WorkloadsSettingsKeyEnum'
      style: simple
  responses:
    "400BadRequest":
