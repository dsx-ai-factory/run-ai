          format: int32
          minimum: 1
          nullable: true
          type: integer
        successThreshold:
          description: Minimum consecutive successes for the probe to be considered
            successful after having failed.
          format: int32
          minimum: 1
          nullable: true
          type: integer
        failureThreshold:
          description: "When a probe fails, the number of times to try before giving\
            \ up."
          format: int32
          minimum: 1
          nullable: true
          type: integer
        handler:
          $ref: '#/components/schemas/ProbeHandler'
      type: object
    Probes:
      description: Probes are used to determine if the container is healthy and ready
        to accept traffic.
      example:
        readiness:
          handler:
            httpGet:
              path: /
              scheme: HTTP
              port: 13285
              host: example.com
          failureThreshold: 1
          periodSeconds: 1
          timeoutSeconds: 1
          successThreshold: 1
          initialDelaySeconds: 0
      nullable: true
      properties:
        readiness:
          $ref: '#/components/schemas/Probe'
      type: object
    NimServiceReplicas:
      default: 1
      description: The number of replicas to deploy.
      example: 2
      format: int32
      maximum: 1000
      minimum: 0
      nullable: true
      type: integer
    RunAsGid:
      description: "The group id to run the entrypoint of the container which executes\
        \ the workspace. Default to the value specified in the environment asset `runAsGid`\
        \ field (optional). Use only when the source uid/gid of the environment asset\
        \ is not `fromTheImage`, and `overrideUidGidInWorkspace` is enabled."
      example: 30
      format: int64
      nullable: true
      type: integer
    RunAsUid:
      description: "The user id to run the entrypoint of the container which executes\
        \ the workspace. Default to the value specified in the environment asset `runAsUid`\
        \ field (optional). Use only when the source uid/gid of the environment asset\
        \ is not `fromTheImage`, and `overrideUidGidInWorkspace` is enabled."
      example: 500
      format: int64
      nullable: true
      type: integer
    ServingPortServiceType:
      default: ClusterIP
      description: "The type of Kubernetes service to create for the inference deployment.\
        \ Options include 'ClusterIP' (default), 'NodePort', 'LoadBalancer', and 'ExternalName'."
      enum:
      - ClusterIP
      - NodePort
      - LoadBalancer
      - ExternalName
      nullable: true
      type: string
    ServingPortPort:
      description: The port that the container running the inference service exposes
        (mandatory).
      example: 8000
      format: int32
      maximum: 65535
      minimum: 1
      nullable: true
      type: integer
    ServingPortGrpcPort:
      description: The GRPC port that the container running the inference service
        exposes.
      example: 8001
      format: int32
      maximum: 65535
      minimum: 1
      nullable: true
      type: integer
    ServingPortMetricsPort:
      description: "The port where metrics are exposed, required only if it's different\
        \ than the main port."
      example: 8002
      format: int32
      maximum: 65535
      minimum: 1
      nullable: true
      type: integer
    ServingPortExposeExternally:
      default: true
      description: "Indicates whether the inference serving endpoint should be accessible\
        \ outside the cluster. If set to true, the endpoint will be exposed externally.\
        \ To enable external access, your administrator must configure the cluster\
        \ as described in the [inference requirements](/run-ai/self-hosted/documentation/installation-and-configuration/system-requirements/networking-setup#standard-inference-wildcard-certificate).\
        \ section."
      nullable: true
      type: boolean
    ServingPortExposedUrl:
      description: "The custom URL to use for the serving port. If empty (default),\
        \ an autogenerated URL will be used."
      nullable: true
      pattern: .*
      type: string
    ServingPortExposedProtocol:
      description: "The protocol to use for the exposed URL. If grpcPort is set, this\
        \ defaults to grpc. Otherwise, it defaults to http."
      enum:
      - http
      - grpc
      nullable: true
      type: string
    NimServiceServingPortAuthorizationType:
      description: |
        Specifies who can send requests to the serving endpoint:

        Possible values:
        - `public`: No authorization is required. (Default)
        - `authenticatedUsers`: Any NVIDIA Run:ai authenticated user and service account can send requests.
        - `authorizedUsers`: Only users listed in the authorizedUsers field can send requests.
        - `authorizedGroups`: Only members of user groups listed in the authorizedGroups field can send requests.
      enum:
      - public
      - authenticatedUsers
      - authorizedUsers
      - authorizedGroups
      nullable: true
      type: string
    NimServiceServingPortAuthorizedUsers:
      description: A list of users and service accounts allowed to send requests to
        the serving endpoint. `Note:` Cannot be used together with authorizedGroups.
      example:
      - user.a@example.com
      - user.b@example.com
      items:
        maxLength: 253
        pattern: .*
        type: string
      maxItems: 1000
      nullable: true
      type: array
    NimServiceServingPortAuthorizedGroups:
      description: A list of user groups allowed to send requests to the serving endpoint.
        `Note:` Cannot be used together with authorizedUsers.
      example:
      - group-a
      - group-b
      items:
        maxLength: 253
        pattern: .*
        type: string
      maxItems: 1000
      nullable: true
      type: array
    NimServiceServingPort:
      description: |
        A port for accessing the inference service.
        Authorization fields (authorizationType, authorizedUsers, authorizedGroups) are supported for cluster version 2.25 and above.
      example:
        serviceType: ClusterIP
        port: 8000
        authorizedGroups:
        - group-a
        - group-b
        grpcPort: 8001
        authorizationType: public
        exposeExternally: true
        authorizedUsers:
        - user.a@example.com
        - user.b@example.com
        metricsPort: 8002
        exposedUrl: exposedUrl
        exposedProtocol: http
      nullable: true
      properties:
        serviceType:
          $ref: '#/components/schemas/ServingPortServiceType'
        port:
          description: The port that the container running the inference service exposes
            (mandatory).
          example: 8000
          format: int32
          maximum: 65535
          minimum: 1
          nullable: true
          type: integer
        grpcPort:
          description: The GRPC port that the container running the inference service
            exposes.
          example: 8001
          format: int32
          maximum: 65535
          minimum: 1
          nullable: true
          type: integer
        metricsPort:
