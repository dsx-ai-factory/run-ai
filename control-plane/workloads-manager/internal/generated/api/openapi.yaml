        exposeExternally:
          default: true
          description: "Indicates whether the inference serving endpoint should be\
            \ accessible outside the cluster. If set to true, the endpoint will be\
            \ exposed externally. To enable external access, your administrator must\
            \ configure the cluster as described in the [inference requirements](/run-ai/self-hosted/documentation/installation-and-configuration/system-requirements/networking-setup#standard-inference-wildcard-certificate).\
            \ section."
          nullable: true
          type: boolean
        exposedUrl:
          description: "The custom URL to use for the serving port. If empty (default),\
            \ an autogenerated URL will be used."
          nullable: true
          pattern: .*
          type: string
        exposedProtocol:
          $ref: '#/components/schemas/ServingPortExposedProtocol'
        authorizationType:
          $ref: '#/components/schemas/NimServiceServingPortAuthorizationType'
        authorizedUsers:
          description: A list of users and service accounts allowed to send requests
            to the serving endpoint. `Note:` Cannot be used together with authorizedGroups.
          example:
          - user.a@example.com
          - user.b@example.com
          items:
            maxLength: 253
            pattern: .*
            type: string
          maxItems: 1000
          nullable: true
          type: array
        authorizedGroups:
          description: A list of user groups allowed to send requests to the serving
            endpoint. `Note:` Cannot be used together with authorizedUsers.
          example:
          - group-a
          - group-b
          items:
            maxLength: 253
            pattern: .*
            type: string
          maxItems: 1000
          nullable: true
          type: array
      type: object
    TolerationOperator:
      description: "A key's relationship to the value. Equal uses key and value. Exists\
        \ is equivalent to wildcard for value, so that a workload can tolerate all\
        \ taints of a particular category. (mandatory)"
      enum:
      - Equal
      - Exists
      nullable: true
      type: string
    TolerationEffect:
      description: The taint effect to match. (mandatory)
      enum:
      - NoSchedule
      - NoExecute
      - PreferNoSchedule
      - Any
      nullable: true
      type: string
    Toleration:
      description: Toleration details.
      example:
