plugins {
    id 'java'
}

test {
    useJUnitPlatform()
    jvmArgs += [
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    ]
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

group = 'com.runai.keycloak'
description = 'Runai custom SPI package'

configurations {
    testImplementation.extendsFrom compileOnly
}

dependencies {
    // Keycloak SPI deps are provided at runtime by the server
    compileOnly "org.keycloak:keycloak-core:26.8.1"
    compileOnly "org.keycloak:keycloak-server-spi:26.8.1"
    compileOnly "org.keycloak:keycloak-services:26.8.1"
    compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    compileOnly 'jakarta.ws.rs:jakarta.ws.rs-api:4.0.0'
    compileOnly 'org.slf4j:slf4j-api:2.0.20'

    testImplementation 'org.glassfish.jersey.core:jersey-server:4.0.3'
    testImplementation 'org.slf4j:slf4j-simple:2.0.20'
    // The BOM keeps the launcher aligned with the engine; without an explicit
    // launcher Gradle injects its own, which fails against newer JUnit platforms.
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
