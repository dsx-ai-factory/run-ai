openapi: 3.0.3
info:
  title: Audit
  version: '1.0'
  description: An API for querying audit logs
  contact:
    name: Run.AI
    url: https://www.run.ai/
    email: support@run.ai
servers:
  - url: https://app.run.ai
  - url: https://staging.run.ai
  - url: https://test.run.ai
  - url: http://localhost:8080
security:
- BearerAuth: []

paths:
  /:
    x-internal: true
    get:
      summary: health check
      operationId: health
      x-service: audit-service
      x-no-authorization: true
      tags:
        - Health
      responses:
        '200':
          description: Executed successfully.

  /internal/api/v1/audit/log:
    x-internal: true
    post:
      description: save audit log
      summary: Save audit log
      operationId: saveAuditLog
      x-service: audit-service
      x-no-authorization: true
      x-test-coverage:
      - control-plane/audit-service/integration-tests/tests/audit_test.go
      tags:
        - InternalAuditLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schema.yaml#/AuditLog'
      responses:
        '200':
          description: Ok, Executed successfully
        '400':
          $ref: './errors.yaml#/400BadRequest'
        '401':
          $ref: './errors.yaml#/401Unauthorized'
        '403':
          $ref: './errors.yaml#/403Forbidden'
        '500':
          $ref: './errors.yaml#/500InternalServerError'
        '503':
          $ref: './errors.yaml#/503ServiceUnavailable'
  /api/v1/audit/log:
    x-scope:
      - system
      - tenant
    get:
      description: Get audit logs based on query params filter
      summary: Get audit logs
      operationId: getAuditLogs
      x-service: audit-service
      x-authorize:
        resource-type: events-history
        action: read
      x-test-coverage:
      - src/test/suites/defaultSuite/audit/auditApi.test.ts
      tags:
        - AuditLogs
      parameters:
        - $ref: './filter_params.yaml#/StartRequired'
        - $ref: './filter_params.yaml#/EndRequired'
        - $ref: './pagination_params.yaml#/Offset'
        - $ref: './pagination_params.yaml#/Limit'
        - $ref: './pagination_params.yaml#/SortOrder'
        - $ref: '#/components/parameters/AuditLogSort'
        - $ref: '#/components/parameters/AuditLogFilter'
      responses:
        '200':
          description: Executed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - logs
                properties:
                  total:
                    type: integer
                    example: 2000
                  next:
                    type: integer
                    example: 100
                  audit_logs:
                    $ref: './schema.yaml#/AuditLogs'
        '401':
          $ref: './errors.yaml#/401Unauthorized'
        '403':
          $ref: './errors.yaml#/403Forbidden'
        '500':
          $ref: './errors.yaml#/500InternalServerError'
        '503':
          $ref: './errors.yaml#/503ServiceUnavailable'

  /api/v1/audit/log/file:
    x-scope:
      - system
      - tenant
    get:
      description: Download audit logs as a file, based on query params filter
      summary: Download audit logs
      operationId: downloadAuditLogs
      x-service: audit-service
      x-authorize:
        resource-type: events-history
        action: read
      x-test-coverage:
      - src/test/suites/defaultSuite/audit/auditApi.test.ts
      tags:
        - AuditLogs
      parameters:
        - in: query
          name: file_type
          schema:
            type: string
            enum:
              - CSV
              - JSON
            default: CSV
          required: false
        - $ref: './filter_params.yaml#/StartRequired'
        - $ref: './filter_params.yaml#/EndRequired'
        - $ref: './pagination_params.yaml#/Offset'
        - $ref: './parameters/query/NumberOfSamplesFileDownload.yaml'
        - $ref: '#/components/parameters/AuditLogFilter'
      responses:
        '200':
          description: 'File downloaded'
          content:
            application/octet-stream:
              x-default: true
        '401':
          $ref: './errors.yaml#/401Unauthorized'
        '403':
          $ref: './errors.yaml#/403Forbidden'
        '500':
          $ref: './errors.yaml#/500InternalServerError'
        '503':
          $ref: './errors.yaml#/503ServiceUnavailable'


components:
  parameters:
    AuditLogSort:
      name: sortBy
      in: query
      required: false
      description: Sort results by a parameters.
      schema:
        type: string
        enum:
          - timestamp
          - subject
          - subject_type
          - source_ip
          - action
          - http_method
          - result
          - url
          - entity_type
          - entity_name
          - entity_id
    AuditLogFilter:
      name: filterBy
      in: query
      required: false
      explode: false
      description: Filter results by a parameter. Use the format field-name operator value. Operators are == Equals, != Not equals, <= Less than or equal, >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts with and =$ Ends with. Dates are in ISO 8601 timestamp format and available for operators ==, !=, <= and >=.
      schema:
        type: array
        items:
          type: string
          pattern: ^(timestamp|subject|subject_type|source_ip|action|result|url|entity_type|entity_name|cluster_name)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
        example:
          - cluster_name==my-cluster_name
          - entity_type==cluster,entity_name==test
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer authentication
