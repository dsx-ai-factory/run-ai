description: >-
  Exact nvidia.com/gpu.product node label for NIM Service placement. When GPU
  allocation is omitted from both the request and policy defaults, the backend
  requests a minimum allocation for this GPU type and the exact NIM image tag.
  If automatic sizing is unavailable, submission fails before creating a workload.
type: string
nullable: true
minLength: 1
maxLength: 63
pattern: '^[a-zA-Z0-9]([a-zA-Z0-9_.-]*[a-zA-Z0-9])?$'
