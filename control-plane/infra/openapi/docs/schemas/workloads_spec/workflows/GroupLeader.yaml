description: The name of the group's lead task. When the leader ends, the group ends with the leader's result,
  and the group's other tasks are stopped. Without a leader, the group ends when all its tasks have ended,
  and fails if any of them failed.
type: string
minLength: 1
maxLength: 63
example: train
nullable: true
pattern: "^[a-z][-a-z0-9]{0,62}$"
