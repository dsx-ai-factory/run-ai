description: Indicate the way to determine the user and group ids of the container.
  The options are
  a. `fromTheImage` - user and group ids are determined by the docker image that the container runs.
  this is the default option.
  b. `custom` - user and group ids can be specified in the environment asset and/or the workload creation request.
  c. `idpToken` - user and group IDs are automatically taken from the identity 
  provider (IdP) token (available only in SSO-enabled installations).
  For more information, see [User Identity](/run-ai/self-hosted/documentation/installation-and-configuration/configuration/security/user-identity-in-containers).
type: string
enum: [ fromTheImage, fromIdpToken, custom ]
nullable: true
