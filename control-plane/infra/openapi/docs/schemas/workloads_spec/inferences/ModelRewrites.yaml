description: Model name rewrites that the inference endpoint applies at runtime. Each rule maps a model name that clients
  request to one or more served model names. One target makes an alias; several targets split traffic by weight.
type: array
items:
  $ref: "./ModelRewrite.yaml"
maxItems: 1000
nullable: true
example:
  - model: llama
    targets:
      - model: llama-3.1-8b-instruct
        weight: 1
  - model: chat
    targets:
      - model: chat-v1
        weight: 90
      - model: chat-v2
        weight: 10
