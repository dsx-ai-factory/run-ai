description: A port for accessing the workload.
properties:
  container:
    description: The port that the container running the workload exposes. (mandatory)
    type: integer
    format: int32
    minimum: 1
    maximum: 65535
    example: 8080
    nullable: true
  serviceType:
    $ref: "./PortServiceType.yaml"
  external:
    description: The external port which allows a connection to the container port.
      If not specified, the port will be auto-generated by the system..
    type: integer
    format: int32
    nullable: true
    example: 30080
  toolType:
    description: The tool type that runs on this port.
    type: string
    example: pytorch
    nullable: true
    pattern: .*
    ##WAIT_FOR_35331## minLength: 1
    maxLength: 63
  toolName:
    description: A name describing the tool that runs on this port.
    type: string
    example: my-pytorch
    nullable: true
    pattern: .*
    ##WAIT_FOR_35331## minLength: 1
    maxLength: 253
  name:
    description: Unique name to identify the instance. primarily used for policy locked rules.
    type: string
    minLength: 1
    maxLength: 63
    example: port-instance-a
    nullable: true
    pattern: .*
  exclude:
    description: Use 'true' in case the item is defined in defaults of the policy, and you wish to exclude it from the workload.
    type: boolean
    default: false
    example: false
    nullable: true
nullable: true
type: object
