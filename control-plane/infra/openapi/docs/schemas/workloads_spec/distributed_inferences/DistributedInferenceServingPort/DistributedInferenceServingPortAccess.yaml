properties:
  authorizationType:
    $ref: "./DistributedInferenceServingPortAccessAuthorizationTypeEnum.yaml"
  authorizedUsers:
    description: A list of users and service accounts allowed to send inference requests to the serving endpoint. 
      `Note:` Cannot be used together with authorizedGroups.
    type: array
    items:
      type: string
      pattern: .*
    example:
      - user.a@example.com
      - user.b@example.com
    nullable: true
  authorizedGroups:
    description: A list of user groups allowed to send inference requests to the serving endpoint.
      `Note:` Cannot be used together with authorizedUsers.
    type: array
    items:
      type: string
      pattern: .*
    example:
      - group-a
      - group-b
    nullable: true
  exposeExternally:
    description: Indicates whether the inference serving endpoint should be accessible outside the cluster. 
      If set to true, the endpoint will be exposed externally. To enable external access, your administrator must configure the cluster as described in the [inference requirements](/run-ai/self-hosted/documentation/installation-and-configuration/system-requirements/networking-setup#standard-inference-wildcard-certificate). section.
    type: boolean
    nullable: true
    default: true
  exposedUrl:
    description: The custom URL to use for the serving port. If empty (default), an autogenerated URL will be used.
    type: string
    nullable: true
    pattern: .*
