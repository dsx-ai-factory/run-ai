description: Toleration details.
properties:
  name:
    description: The name of the toleration.
    type: string
    minLength: 1
    maxLength: 253
    nullable: true
    pattern: .*
  operator:
    $ref: "./TolerationOperator.yaml"
  key:
    description: The taint key that the toleration applies to. (mandatory)
    type: string
    ##WAIT_FOR_35331## minLength: 1
    maxLength: 253
    nullable: true
    pattern: .*
  value:
    description: The taint value the toleration matches to. Mandatory if operator is Exists, forbidden otherwise.
    type: string
    maxLength: 10000
    nullable: true
    pattern: .*
  effect:
    $ref: "./TolerationEffect.yaml"
  seconds:
    description: The period of time the toleration tolerates the taint. Valid only if effect is NoExecute.
      taint.
    type: integer
    minimum: 1
    nullable: true
  exclude:
    description: Use 'true' in case the label is defined in defaults of the policy, and you wish to exclude it from the workload.
    type: boolean
    example: false
    nullable: true
nullable: true
type: object
