description: Specifies whether the workload can be preempted by higher-priority workloads. 
  Valid values are preemptible, semi-preemptible and non-preemptible. 
  Semi-preemptible is intended for multi-pod workloads. Replicas up to the configured minimum are non-preemptible,
  while replicas above that minimum are preemptible. On single-pod workloads with a fixed replica count of one,
  semi-preemptible behaves as non-preemptible. The API continues to accept semi-preemptible for these workloads.
  If explicitly set, this value takes precedence. 
  If not set, the system derives the preemptibility from the priorityClassName field, ensuring backward compatibility. 
  Each workload type has a default preemptibility. To view the default preemptibility 
  for each workload type, use the GET /workload-types endpoint.
type: string
minLength: 1
enum:
  - preemptible
  - semi-preemptible
  - non-preemptible
nullable: true