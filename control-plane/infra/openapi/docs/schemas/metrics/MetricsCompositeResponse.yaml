type: object
required:
  - measurements
properties:
  measurements:
    type: array
    items:
      $ref: './MeasurementResponse.yaml'
  histogram:
    type: array
    nullable: true
    items:
      $ref: './HistogramSeries.yaml'
example:
  measurements:
    - type: "ALLOCATED_GPU"
      labels:
        gpu: "0"
      values:
        - value: "85"
          timestamp: "2024-12-20T14:30:00Z"
        - value: "92"
          timestamp: "2024-12-20T14:30:30Z"
        - value: "78"
          timestamp: "2024-12-20T14:37:00Z"
  histogram:
    - type: "NIM_TIME_TO_FIRST_TOKEN_SECONDS"
