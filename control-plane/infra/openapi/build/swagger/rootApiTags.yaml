- name: Clusters
  x-parent: Organizations
  description: Use these endpoints to create, manage and delete NVIDIA Run:ai Kubernetes clusters.
- name: Departments
  x-parent: Organizations
  description: |
    Departments, in the hierarchy of resource allocation, are above Projects. A Department can contain multiple Projects, and has its own quotas. 
    A Department's quota supersedes the total of the Project quotas in the Department, so tt is recommended 
    that a Department's quota be the total, or more than of all the Project quotas in the Department. 
    For further information see, [Working with Departments](/run-ai/self-hosted/documentation/platform-management/manage-ai-initiatives/organization/departments).
- name: Reports
  x-parent: Organizations
- name: NodePools
  x-parent: Organizations
  description: |
    Node pools assist in managing heterogeneous resources effectively. 
    A node pool is a set of nodes grouped into a bucket of resources using a predefined (for example, GPU-Type) or 
    administrator-defined label (for example, key & value). 
    For more information, see [Node Pools](/run-ai/self-hosted/documentation/platform-management/manage-ai-initiatives/resources/node-pools).
- name: Nodes
  x-parent: Organizations
  description: |
    Nodes are worker machines in Kubernetes and may be either a virtual or a physical machine, depending on the cluster. 
    Each Node is managed by the NVIDIA Run:ai control plane. For more information, see [Nodes](/run-ai/self-hosted/documentation/platform-management/manage-ai-initiatives/resources/nodes).
- name: Projects
  x-parent: Organizations
  description: |
    Projects implement resource allocation policies and create segregation between 
    different initiatives. It can represent a team, an individual, or an initiative that 
    shares resources or has a specific resources budget (quota). 
    See [Projects](/run-ai/self-hosted/documentation/platform-management/manage-ai-initiatives/organization/projects) 
    for more information.
- name: Logo
  x-parent: Organizations
  description: Use to manage tenant logo files.
- name: Researcher Command Line Interface
  x-parent: Organizations
- name: Researcher Command Line Interface Deprecated
  x-parent: Organizations
- name: Network Topologies
  x-parent: Organizations
  description: The Network Topologies API enables administrators to reflect the hierarchical network topology connectivity of nodes in a data center, such as racks, blocks, and other organizational units, to improve pod scheduling decisions for communication-intensive AI/ML workloads.
    To support topology-aware scheduling, this API allows administrators to define a multi-level network topology element using ordered Kubernetes node labels that represent the network connectivity of nodes in the data center.
    Nodes are labeled with the same key-value pairs labels that represent their location in the data center network.
    These labels are used by the NVIDIA Run:ai Scheduler to prefer scheduling pods on nodes that are "closer" to each other, minimizing communication overhead and optimizing workload performance.
- name: Access Keys
  x-parent: Authentication and Authorization
  description: |
    Access Keys allow users to authenticate and interact programmatically with the NVIDIA Run:ai API.
    Each access key consists of a client ID and secret that can be used to obtain authentication tokens.
    Access keys can be managed by individual users for their own use, or by administrators for organization-wide access.
    For more information, see [Access control](/run-ai/self-hosted/documentation/platform-management/authentication/overview).
- name: Access rules
  x-parent: Authentication and Authorization
  description: |
    Access rules provide user authorization to system resources and entities.
    It is managed using Role-based access control (RBAC) which is a policy-neutral 
    access control mechanism defined around roles and privileges. 
    The components of RBAC make it simple to manage access to system resources and entities.
    For more information, see [Access control](/run-ai/self-hosted/documentation/platform-management/authentication/overview).
- name: Service Accounts
  x-parent: Authentication and Authorization
  description: |
    Service accounts enable programmatic access to the NVIDIA Run:ai API, allowing applications or automated systems to authenticate and interact securely. 
    Each service account is associated with an access key which includes a client ID and secret used to generate access token. 
    Service accounts can be managed organization-wide or with a defined scope.
- name: Roles
  x-parent: Authentication and Authorization
  description: |
    The Roles API allows administrators to define and manage roles within the NVIDIA Run:ai platform. 
    A role represents a collection of permission sets that determine what actions can be performed across NVIDIA Run:ai resources.
    NVIDIA Run:ai provides a list of predefined roles that cover common operational needs, such as managing workloads, projects, or data and storage. 
    Administrators can also use this API to create custom roles by combining specific permission sets to match their organization's access model.
- name: Tokens
  x-parent: Authentication and Authorization
  description: |
    Use tokens to facilitate authentication to the NVIDIA Run:ai API. 
    The API server must be configured to use the NVIDIA Run:ai identity 
    service to validate authentication tokens.
- name: Users
  x-parent: Authentication and Authorization
- name: Idps
  x-parent: Authentication and Authorization
- name: Me
  x-parent: Authentication and Authorization
  description: |
    "Me" returns the authenticated user's permissions within the system. 
    It provides a comprehensive view of access rules (roles, subjects and scope) assigned to the current user.
    For more information see [Access control](/run-ai/self-hosted/documentation/platform-management/authentication/overview).
- name: Events
  x-parent: Workloads
  description: Workload events that occurred while the workload was running. Use to diagnose issue around workload scheduling.
- name: Pods
  x-parent: Workloads
  description: Retrieve data about workload pods from your NVIDIA Run:ai platform.
- name: Workloads
  x-parent: Workloads
  description: |
    Workloads are both native platform workloads, Workspaces, Training and Inference, as well as workloads that originate from third-party ML frameworks, tools, or the broader Kubernetes ecosystems. For more details on the supported workloads, see [Introduction to workloads](/run-ai/self-hosted/documentation/workloads-in-nvidia-run-ai/introduction-to-workloads). Workloads endpoints allow you to list, retrieve, count, and view telemetry or metrics data for all workload types in your environment.
- name: Workloads V2
  x-parent: Workloads
  description: |
    The Workloads V2 API allows you to create, retrieve, and delete workloads that originate from third-party ML frameworks, tools, or the broader Kubernetes ecosystem. These workloads are registered in the platform through the Workload Types API, some are already registered in NVIDIA Run:ai, while others can be added by administrators.
    Each submission combines the user's Kubernetes manifest with NVIDIA Run:ai scheduling metadata, enabling consistent orchestration, monitoring, and governance. See [Extending workload support](/run-ai/self-hosted/documentation/workloads-in-nvidia-run-ai/workload-types/extending-workload-support) for more details.
- name: NVIDIA NIM
  x-parent: Workloads
  description: |
    The NVIDIA NIM API provides endpoints to create and manage workloads that deploy NVIDIA Inference Microservices (NIM) through the NIM Operator. These workloads package optimized NVIDIA model servers and run as managed services on the NVIDIA Run:ai platform.
    Each request includes NVIDIA Run:ai scheduling metadata (for example, project, priority, and category) and a NIM service specification that defines the container image, compute resources, environment variables, storage, and networking configuration. Once submitted, NVIDIA Run:ai handles scheduling, orchestration, and lifecycle management of the NIM service to ensure reliable and efficient model serving.
- name: Workspaces
  x-parent: Workloads
  description: |
    A Workspace is a simplified tool for researchers to conduct experiments, build AI models, access standard MLOps tools, and collaborate with their peers.
    Workspaces abstract complex concepts related to running containerized workloads in a Kubernetes environment and are built from predefined setups that include
    networking, storage, secrets and other resources. All the setup and configurations for research, including container 
    images, data sets, resource requests, as well as all tools are included. for the research, in a single place. 
    It answers the research needs while ensuring infrastructure owners keep control and allocation efficiency.
    A workspace is associated with a specific NVIDIA Run:ai project and you can have multiple workspaces under a specific project. 
    For more information, see [Workspaces](/run-ai/self-hosted/documentation/workloads-in-nvidia-run-ai/using-workspaces/running-workspace).
- name: Trainings
  x-parent: Workloads
  description: |
    Trainings are dedicated workloads that are specifically used for training models. 
    They are by design preemptible workloads because they are used in unattended sessions where the  
    scientists and researchers do not need to be present. These workloads are allowed to utilize 
    resources over the project's quota.      
- name: Inferences
  x-parent: Workloads
  description: Inference workloads deploy trained models into a production environment to generate predictions from live data. These workloads are prioritized over Trainings and Workspaces during scheduling. NVIDIA Run:ai Inference workloads support auto-scaling to maintain service-level agreements (SLAs) by dynamically adjusting resources as demand changes.
- name: Revisions
  x-parent: Workloads
  description: Revisions are associated with an inference workload and represent a snapshot of its configuration. A revision is created on each change to the inference workload.
- name: Distributed
  x-parent: Workloads
  description: |
    Distributed Training, is the ability to split the training of a model among multiple processors. 
    It is often a necessity when multi-GPU training no longer applies; 
    typically when you require more GPUs than exist on a single node. 
    Each such split is a pod (see definition above). NVIDIA Run:ai spawns an additional launcher process that manages and 
    coordinates the other worker pods. For more information, see [Distributed training](/run-ai/self-hosted/documentation/workloads-in-nvidia-run-ai/using-training/distributed-training-models).
- name: Workloads batch
  x-parent: Workloads
- name: Workload properties
  x-parent: Workloads
  description: |
    Workload properties define the behavioral and scheduling characteristics of a workload submitted to the NVIDIA Run:ai platform. These properties such as type, category, and priority determine how workloads are classified, monitored, and scheduled.
    - Type - Defines the functional behavior of a workload, such as training or inference, and serves as the foundation for how it is classified within the platform. Each workload type includes a default category (used for monitoring) and a default priority (used for scheduling within a project).
    - Category - Represents the role or purpose of a workload, such as  Build, Train, Deploy. Each workload type is assigned a default category to ensure consistent classification across the platform for monitoring purposes. See [Monitor workloads by category](/run-ai/self-hosted/documentation/platform-management/monitor-performance/workload-categories).
    - Priority - Determines the scheduling order of workloads within a project and whether a workload can be preempted. Higher-priority workloads are scheduled first and may become non-preemptible, preventing interruption by lower-priority workloads. See [Workload priority control](/run-ai/self-hosted/documentation/platform-management/runai-scheduler/scheduling/workload-priority-control).
- name: Workload templates
  x-parent: Workloads
  description: |
    This set of endpoints manages workload templates used to define reusable workload configurations across various workload types in the NVIDIA Run:ai platform. 
    Templates help standardize workload definitions for consistent submission and resource usage across projects and users.
- name: Distributed Inferences
  x-parent: Workloads
  description: |
    Distributed inference enables running inference workloads across multiple pods, typically to scale model serving beyond a single container or node. This approach is useful when a single instance cannot meet resource requirements.NVIDIA Run:ai supports this model using Leader Worker Set (LWS). 
    Each pod plays a specific role, either as a leader or worker, and together they form a coordinated service. NVIDIA Run:ai manages the orchestration and configuration of these pods to ensure efficient and scalable inference execution
- name: Permissions
  x-parent: Authentication and Authorization
  description: |
    Permissions define the actions that users can perform on specific resources within the NVIDIA Run:ai platform. 
    Each permission consists of a resource type and an allowed action. 
    The Permission Sets API provides a catalog of all available permission sets in the NVIDIA Run:ai platform. 
    Each permission set is a predefined collection of permissions that represent the permissions required for a role to perform specific operations. 
    Permission sets serve as the building blocks for roles and are used in both NVIDIA Run:ai predefined roles and custom roles defined through the [Roles API](#tag/Roles).
- name: Settings
  x-parent: Organizations
  description: |
    View and manage configuration settings for your organization.
- name: Org unit
  x-parent: Authentication and Authorization
  description: Org unit.
- name: AuditLogs
  x-parent: Audit
  description: The audit log provides audit trail information for user activity, changes to business objects and other important information. For more information, see [Audit log](/run-ai/self-hosted/documentation/installation-and-configuration/operate/observability/event-history).
- name: Datavolumes
  x-parent: Datavolumes
- name: Distributed Inferences
  x-parent: Workloads
  description: |
    Distributed inference enables running inference workloads across multiple pods, typically to scale model serving beyond a single container or node. This approach is useful when a single instance cannot meet resource requirements.NVIDIA Run:ai supports this model using Leader Worker Set (LWS). 
    Each pod plays a specific role, either as a leader or worker, and together they form a coordinated service. NVIDIA Run:ai manages the orchestration and configuration of these pods to ensure efficient and scalable inference execution

- name: Compute
  x-parent: Workload assets
  description: |
    A compute resource is a building block that represents compute resources such as GPUs, CPU cores, and CPU memory.
    The compute resources may consist of multiple physical resources, for example, 0.5 GPU, 8 cores and 200 Megabytes of CPU memory. 
    A compute resource is available to a scope and and all of the organizational units within that scope. 
    
    For more information, see [Compute resource](/run-ai/self-hosted/documentation/workloads-in-nvidia-run-ai/assets/compute-resources).
- name: Credentials
  x-parent: Workload assets
  description: Credentials are used to unlock protected resources such as applications, containers, and other assets. For more information, see [Credentials](/run-ai/self-hosted/documentation/workloads-in-nvidia-run-ai/assets/credentials).
- name: Datasources
  x-parent: Workload assets
  description: Data source assets.
- name: Environment
  x-parent: Workload assets
  description: |
    An environment resource designates the container image, the image pull policy, working directory, security parameters, and others. 
    It exposes all the necessary tools (open source, 3rd party, or custom tools) along 
    with their connection interfaces including external node port and the container ports.
    You can also specify a standard, distributed, or inference workload architecture for the environment.
    An environment is a mandatory building block for the creation of a workload.
    For more information, see [Environments](/run-ai/self-hosted/documentation/workloads-in-nvidia-run-ai/assets/environments).
