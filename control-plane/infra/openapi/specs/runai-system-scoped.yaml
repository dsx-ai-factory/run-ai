              nullable: true
              pattern: /^(https?://)?([a-zA-Z0-9.-]+\.[a-zA-Z]{2,})(:[0-9]{1,5})?(/[^\s]*)?$|^$/
              example: https://example.com/logout
              maxLength: 2048
        displayName:
          type: string
          description: Human-readable name for this setting
          readOnly: true
        description:
          type: string
          description: Description of what this setting controls
          readOnly: true
      example:
