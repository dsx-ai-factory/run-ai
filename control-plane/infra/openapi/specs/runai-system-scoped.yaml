      name: verbosity
      in: query
      required: false
      description: |
        response verbosity level.
      example: full
      schema:
        type: string
        enum:
          - metadata
          - full
        default: full
    QueryIncludeRequestedForDelete:
      name: includeRequestedForDelete
      in: query
      required: false
      example: true
      schema:
        type: boolean
      description: When true, includes clusters that are marked for deletion
    ClustersMinimalFilterBy:
      name: filterBy
      in: query
      required: false
      description: Filter clusters by a parameter. Use the format field-name operator value. Operators are == Equals, != Not equals, <= Less than or equal, >= Greater than or equal. Dates are in ISO 8601 timestamp format and available for operators ==, !=, <= and >=.
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          pattern: ^(name)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
        example:
          - name==my-cluster
      explode: false
    Offset:
      name: offset
      in: query
      required: false
      description: The offset of the first item returned in the collection.
      schema:
        type: integer
        format: int32
        example: 100
    Limit:
      name: limit
      in: query
      required: false
      description: The maximum number of entries to return.
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 500
    QueryForceDelete:
      name: force
      in: query
      required: false
      description: |
        if true will force cluster instant deletion otherwise will start cluster graceful deletion process.
      example: true
      schema:
        type: boolean
        default: false
    StartRequired:
      name: start
      in: query
      description: Start date of time range to fetch data in ISO 8601 timestamp format.
      required: true
      schema:
        type: string
        format: date-time
        example: '2023-06-06T12:09:18.211Z'
    EndRequired:
      name: end
      in: query
      description: End date of time range to fetch data in ISO 8601 timestamp format.
      required: true
      schema:
        type: string
        format: date-time
        example: '2023-06-07T12:09:18.211Z'
    NumberOfSamples:
      name: numberOfSamples
      in: query
