      schema:
        type: string
    usersFilterBy:
      name: filterBy
      in: query
      required: false
      description: Filter results by a parameter. Use the format field-name operator value. Operators are <= Less than or equal, >= Greater than or equal, =@ contains. Dates are in ISO 8601 timestamp format and available for operators <=, >= and ==.
      schema:
        type: array
        items:
          type: string
          pattern: ^((username|createdBy|lastLogin|creationTime|lastUpdated|isLocal)(==|<=|>=|=@)|(firstName|lastName|fullName)(=@)).+$
        example:
          - username=@test,lastLogin>=2024-09-24T00:00:00.00Z,isLocal==false
      explode: false
    usersSortBy:
      name: sortBy
      in: query
      required: false
      description: Sort results by a parameters.
      schema:
        $ref: '#/components/schemas/UsersFilterSortFields'
    limit:
      name: limit
      in: query
      required: false
      description: The maximum number of entries to return.
      schema:
        type: integer
        format: int32
        default: 500
        minimum: 1
        maximum: 500
    search:
      name: search
      in: query
      required: false
      description: Filter results by a free text search.
      schema:
        type: string
        example: test@run
    usersMinimalFilterBy:
      name: filterBy
      in: query
      required: false
      description: |
        Filter results by username. Use the format field-name operator value. Supported operators are == (exact match) and =@ (contains).
        Multiple entries (up to 25) are allowed only with the == operator.
      schema:
        type: array
        maxItems: 25
        items:
          type: string
          pattern: ^username(==|=@).+$
        example:
          - username==test@run.ai
      explode: false
    usersMinimalSearch:
      name: search
      in: query
      required: false
      description: Filter results by a free text search across username, firstName and lastName (OR logic). Minimum 2 characters.
      schema:
        type: string
        minLength: 2
        maxLength: 100
        example: john
    usersMinimalId:
      name: id
      in: query
      required: false
      description: Bulk lookup by user IDs (comma-separated). Returns the matching users in addition to any results from `search` or `filterBy`. Up to 25 IDs per request.
      schema:
        type: array
        maxItems: 25
        items:
          type: string
        example:
          - 8e3f0a4b-4d3c-4f6e-9d2a-1c5e0a8b7f6d
      explode: false
