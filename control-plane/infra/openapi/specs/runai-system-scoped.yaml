    TokenRequestGrantTypeEnum:
      enum:
        - client_credentials
        - refresh_token
        - exchange_token
        - password
        - external_token_exchange
    TokenRequest:
      type: object
      properties:
        grantType:
          $ref: '#/components/schemas/TokenRequestGrantTypeEnum'
        code:
          type: string
          maxLength: 2048
        redirectUri:
          type: string
          maxLength: 2048
        refreshToken:
          type: string
          maxLength: 4096
        username:
          type: string
          maxLength: 255
        password:
          type: string
          maxLength: 255
        clientID:
          type: string
          maxLength: 255
        clientSecret:
          type: string
          maxLength: 500
        externalToken:
          type: string
          maxLength: 4096
        codeVerifier:
          type: string
          maxLength: 128
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        idToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Token lifetime in seconds
    OAuth2TokenResponse:
      type: object
      required:
        - access_token
        - token_type
      properties:
        access_token:
          type: string
          description: The access token issued by the authorization server
        token_type:
          type: string
          description: The type of the token issued (typically "Bearer")
          example: Bearer
        expires_in:
          type: integer
          description: The lifetime in seconds of the access token
          example: 3600
        refresh_token:
          type: string
          description: The refresh token, which can be used to obtain new access tokens
        id_token:
          type: string
          description: ID Token value associated with the authenticated session (OpenID Connect)
        scope:
          type: string
          description: The scope of the access token
    OAuth2Error:
      type: object
      description: OAuth 2.0 error response (RFC 6749 Section 5.2)
      required:
        - error
      properties:
        error:
          type: string
          description: A single ASCII error code
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - server_error
            - temporarily_unavailable
          example: invalid_client
        error_description:
          type: string
          description: Human-readable ASCII text providing additional information
          example: Client authentication failed
        error_uri:
          type: string
          description: URI identifying a human-readable web page with information about the error
    GetAutoRedirectSsoSetting:
      type: object
      properties:
        value:
          type: object
          properties:
            enabled:
              type: boolean
              nullable: true
            idpAlias:
              type: string
              pattern: ^[a-z0-9_-]*$
              nullable: true
              maxLength: 255
        displayName:
          type: string
          description: Human-readable name for this setting
          readOnly: true
        description:
          type: string
          description: Description of what this setting controls
          readOnly: true
      example:
        value:
          enabled: false
          idpAlias: oidc
        displayName: Auto Redirect SSO
        description: Automatically redirect users to the SSO login page after logging in to the application
    GetBrowserSessionTimeoutSetting:
      type: object
      properties:
        value:
          type: object
          properties:
            idleTimeout:
