    RightSizingRequest:
      type: object
      required:
        - clusterId
        - image
        - tag
      properties:
        clusterId:
          type: string
          format: uuid
          description: Cluster whose node-pool hardware metadata is evaluated.
        image:
          type: string
          description: Untagged public nvcr.io/nim/organization/model image reference.
        tag:
          type: string
          minLength: 1
          description: Exact image tag. NGC does not automatically refresh latest metadata.
        gpuType:
          type: string
          nullable: true
          description: Exact inventory GPU type. Omitted or null evaluates all reported types and capacities.
    RightSizingResponse:
      type: object
      required:
        - image
        - tag
        - results
      properties:
        image:
          type: string
        tag:
          type: string
        results:
          type: array
          items:
            type: object
            required:
              - gpuType
              - status
            properties:
              gpuType:
                type: string
              gpuMemoryCapacityBytes:
                type: integer
                format: int64
                description: Reported per-device capacity, not free memory or a quota guarantee.
              status:
                type: string
                enum:
                  - recommended
                  - no_recommendation
              minimumGpuMemoryPerDeviceGb:
                type: number
                format: double
                description: Published NGC minimum for the source profile, before allocation rounding.
              profileId:
                type: string
              precision:
                type: string
              inferenceBackend:
                type: string
              reason:
                type: string
                description: Explanation when sizing cannot be recommended.
              recommendation:
                type: object
                nullable: true
                required:
                  - allocationType
                  - gpuCount
                  - estimated
                properties:
                  allocationType:
                    type: string
                    enum:
                      - gpu_memory
                      - gpu_count
                  gpuCount:
                    type: integer
                    format: int64
                    minimum: 1
                  gpuMemoryPerDeviceBytes:
                    type: integer
                    format: int64
                    minimum: 1
                  estimated:
                    type: boolean
                    description: Whether GPU count is a naive estimate. False describes allocation arithmetic only; it does not verify runtime or hardware compatibility.
                  warning:
                    type: string
                    description: Conditional sizing prerequisites, unverified hardware/runtime compatibility, and limitations of an estimated count. Read before using the allocation.
    EnableNgcIntegrationSetting:
      type: object
      properties:
        enabled:
          type: boolean
          nullable: true
      example:
        enabled: false
    ComplianceIssues:
      properties:
        complianceIssues:
          type: array
          items:
            type: object
            required:
              - details
              - field
            properties:
              field:
                type: string
                example: compute.gpuDevicesRequest
              details:
                type: string
                example: value must be no less than 3
      nullable: true
      type: object
    SubmissionError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - $ref: '#/components/schemas/ComplianceIssues'
