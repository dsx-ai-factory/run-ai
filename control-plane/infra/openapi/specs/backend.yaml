            A limit (in seconds) for the duration of interactive jobs from this
            project.
          example: 3600
        interactiveJobMaxIdleDurationSecs:
          type: number
          description: >-
            Maximum duration (in seconds) that an interactive job can be idle
            before being terminated.
          example: 3000
        interactivePreemptibleJobMaxIdleDurationSecs:
          type: number
          description: >-
