    ProjectCommonFields:
      properties:
        deservedGpus:
          type: number
          description: >-
            Deprecated. Use 'deserved' for the relevant resource type under
            `NodePoolResources`. The project's deserved GPU allocation in case
            the cluster has those resources.
          example: 3
          deprecated: true
        maxAllowedGpus:
          type: number
          description: >-
            Deprecated. Instead, use `maxAllowed` for the relevant resource type
            under `NodePoolResources`. An upper limit for the amount of GPUs the
            project can get (Even if over quota is allowed and resources are
            available).
          example: 5
          deprecated: true
        gpuOverQuotaWeight:
          type: number
          description: >-
            Deprecated. Instead, use `overQuotaWeight` for the relevant resource
            type under `NodePoolResources`. The priority the project gets for
            over quota resources.
          maximum: 3
          minimum: 0
          example: 1
          deprecated: true
