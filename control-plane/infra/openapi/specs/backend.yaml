      required: true
      schema:
        type: string
        format: string
    uuid:
      in: path
      name: uuid
      description: Unique identifier of the cluster
      required: true
      schema:
        type: string
        format: uuid
    job_id:
      in: path
      name: job_id
      description: Unique identifier of the job
      required: true
      schema:
        type: string
        format: uuid
    jobId:
      name: jobId
      in: path
      description: Unique identifier of the job (UUID)
      required: true
      schema:
        type: string
        format: uuid
    podGroupId:
      name: podGroupId
      in: path
      description: Unique identifier of the podGroup (UUID)
      required: true
      schema:
        type: string
        format: uuid
    serviceId:
      name: serviceId
      in: path
