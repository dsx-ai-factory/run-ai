    CreatedByMe:
      in: query
      required: false
      name: onlyCreatedByMe
      schema:
        type: boolean
      description: >-
        Filter the returned entities to only those that created by the
        requesting subject
    ResourceId:
      in: path
      required: true
      name: id
      schema:
        type: string
    ResourceType:
      in: path
      required: true
      name: resourceType
      schema:
        type: string
    StartRequired:
      name: start
      in: query
      description: Start date of time range to fetch data in ISO 8601 timestamp format.
      required: true
      schema:
        type: string
        format: date-time
        example: '2023-06-06T12:09:18.211Z'
    EndRequired:
      name: end
      in: query
      description: End date of time range to fetch data in ISO 8601 timestamp format.
      required: true
      schema:
        type: string
        format: date-time
        example: '2023-06-07T12:09:18.211Z'
    MetricsType:
      name: metricType
      in: query
      required: true
      description: specifies what data to request
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/MetricsType'
    GroupName:
      in: path
      name: groupName
      required: true
      schema:
        description: Unique identifier of the group
        type: string
        format: string
        example: group1
    lastUpdated:
      name: lastUpdated
      in: query
      required: false
      description: The last timestamp of the previously received items.
      schema:
        type: string
        format: date-time
        example: '2021-12-14T16:04:15.099Z'
    includeDeleted:
      name: includeDeleted
      in: query
      required: false
