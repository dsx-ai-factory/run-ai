      required: true
      schema:
        type: string
        format: string
    secret_name:
      in: path
      name: secret_name
      description: secret name
      required: true
      schema:
        type: string
        format: string
    pvc_name:
      in: path
      name: pvc_name
      description: pvc name
      required: true
      schema:
        type: string
        format: string
    storage_class_name:
      in: path
