    JobResourceData:
      type: object
      required:
        - allocated
      properties:
        allocated:
          type: number
          example: 2.5
        utilization:
          description: 'Utilization percentage, values between 0 to 1.'
          type: number
          example: 0.8
    JobAdvancedData:
      type: object
      properties:
        idleSeconds:
          type: number
          example: 50
        grEngineActive:
          description: >-
            The fraction of time any portion of the graphics or compute engines
            were active
          type: number
        dramActive:
          description: >-
            The fraction of cycles where data was sent to or received from
            device memory
          type: number
        smActive:
          description: >-
            The fraction of time at least one warp was active on a
            multiprocessor, averaged over all multiprocessors
          type: number
        smOccupancy:
          description: >-
            The fraction of resident warps on a multiprocessor, relative to the
            maximum number of concurrent warps supported on a multiprocessor
          type: number
        pipeTensorActive:
          description: The fraction of cycles the tensor (HMMA / IMMA) pipe was active
          type: number
        pipeFp64Active:
          description: The fraction of cycles the FP64 (double precision) pipe was active
          type: number
        pipeFp32Active:
          description: >-
            The fraction of cycles the FMA (FP32 (single precision), and
            integer) pipe was active
          type: number
        pipeFp16Active:
          description: The fraction of cycles the FP16 (half precision) pipe was active
          type: number
        nvlinkTxBytes:
          description: >-
            The rate of data transmitted over NVLink, not including protocol
            headers, in bytes per second
          type: number
        nvlinkRxBytes:
          description: >-
            The rate of data received over NVLink, not including protocol
            headers, in bytes per second
          type: number
        pcieTxBytes:
          description: >-
            The rate of data transmitted over the PCIe bus, including both
            protocol headers and data payloads, in bytes per second
          type: number
        pcieRxBytes:
          description: >-
            The rate of data received over the PCIe bus, including both protocol
            headers and data payloads, in bytes per second
          type: number
    JobResourcesData:
      type: object
      required:
        - gpu
        - gpu-memory
        - cpu
        - cpu-memory
      properties:
        gpu:
          description: GPU resources in fractions. 0.7 = 70% of a gpu
          $ref: '#/components/schemas/JobResourceData'
        gpu-memory:
          description: GPU memory resources in megabytes. 1 = 10^6  (1000*1000)
          $ref: '#/components/schemas/JobResourceData'
        cpu:
          description: CPU resources in millicpus. 1000 = 1 cpu
          $ref: '#/components/schemas/JobResourceData'
        cpu-memory:
          description: CPU memory resources in megabytes. 1 = 10^6  (1000*1000)
          $ref: '#/components/schemas/JobResourceData'
        advanced:
          description: >-
            Advanced job metrics data, available only if advanced metrics
            enables and advanced query param is set
          $ref: '#/components/schemas/JobAdvancedData'
