openapi: 3.0.3
info:
  version: 2.0.0
  description: >
    # Introduction


    The NVIDIA Run:ai Control-Plane API reference is a guide that provides an
    easy-to-use programming interface for adding various tasks to your
    application, including workload submission, resource management, and
    administrative operations.


    NVIDIA Run:ai APIs are accessed using *bearer tokens*. To obtain a token,
    you need to create a **Service account** through the NVIDIA Run:ai user
    interface.

    To create a service account, in your UI, go to Access → Service Accounts
    (for organization-level service accounts) or User settings → Access Keys
    (for user access keys), and create a new one.


    After you have created a new service account, you will need to assign it
    access rules.

    To assign access rules to the service account, see [Create access
    rules](https://run-ai-docs.nvidia.com/self-hosted/latest/infrastructure-setup/authentication/accessrules#create-or-delete-rules).

    Make sure you assign the correct rules to your service account. Use the
    [Roles](https://run-ai-docs.nvidia.com/self-hosted/latest/infrastructure-setup/authentication/roles)
    to assign the correct access rules.


    To get your access token, follow the instructions in [Request a
    token](https://run-ai-docs.nvidia.com/self-hosted/latest/reference/api/rest-auth/#request-an-api-token).
  title: 'NVIDIA Run:ai'
  x-logo:
    url: ./runai-logo-api.png
    altText: 'NVIDIA Run:ai'
    href: 'https://run.ai'
  license:
    name: 'NVIDIA Run:ai'
    url: >-
      https://www.nvidia.com/en-us/agreements/enterprise-software/nvidia-software-license-agreement/
servers:
  - url: 'https://app.run.ai'
    description: Production server
  - url: 'https://staging.run.ai'
    description: Staging server
  - url: 'https://test.run.ai'
    description: Development server
  - url: 'https://localhost.runailabs.com'
    description: Local server
  - url: 'http://localhost:8080'
    description: Local Development server
security:
  - bearerAuth: []
paths:
  /v1/k8s/tenant:
    get:
      x-internal: true
      operationId: getTenant
      deprecated: true
      tags:
        - Tenant
      summary: Get tenant
      x-runai-team: Sphinx
      x-test-coverage:
        - src/test/suites/tenantSuite/tenantUserApi/tenantSystemApi.test.ts
      description: Get tenant
      parameters:
        - in: query
          required: false
          name: tenantName
          schema:
            $ref: '#/components/schemas/TenantName'
      responses:
        '200':
          description: Tenant object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /v1/k8s/setting:
    get:
      operationId: getTenantSettings
      tags:
        - Tenant
      summary: Get all tenant settings.
      x-runai-team: Sphinx
      x-test-coverage:
        - src/test/suites/tenantSuite/tenantUserApi/tenantSystemApi.test.ts
      description: Retrieve all tenant settings.
      parameters:
        - name: excludeMigrated
          in: query
          required: false
          description: >-
            When true, excludes settings that have been migrated to external
            services (e.g., Identity Manager).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The complete set of tenant settings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Setting'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    put:
      operationId: updateTenantSetting
      tags:
        - Tenant
      summary: Update a tenant setting.
      x-runai-team: Sphinx
      x-test-coverage:
        - src/test/suites/tenantSuite/tenantUserApi/tenantSystemApi.test.ts
      description: Use to update tenant settings.
      parameters:
        - name: tenantId
          in: query
          x-internal: true
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSettingCreationRequest'
      responses:
        '200':
          description: The updated tenant setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingCreationResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  '/v1/k8s/setting/{settingKey}':
    get:
      operationId: getTenantSettingsByKey
      tags:
        - Tenant
      summary: Get a tenant setting by key.
      x-runai-team: Sphinx
      x-test-coverage:
        - src/test/suites/tenantSuite/tenantUserApi/tenantSystemApi.test.ts
      description: Retrieve a specific tenant setting by key.
      parameters:
        - in: path
          name: settingKey
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The requested setting.
          content:
            application/json:
              schema:
                description: >-
                  A boolean value that indicates if the requested setting is
                  enabled.
                type: boolean
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /v1/k8s/config:
    get:
      x-internal: true
      operationId: getTenantConfig
      deprecated: true
      tags:
        - Tenant
      summary: Get tenant auth config
      x-runai-team: Sphinx
      x-test-coverage:
        - src/test/suites/tenantSuite/tenantUserApi/tenantSystemApi.test.ts
      description: 'Get tenant auth config, used for authentication.'
      parameters:
        - in: query
          required: false
          name: tenantName
          schema:
            $ref: '#/components/schemas/TenantName'
      responses:
        '200':
          description: Tenant config object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /v1/k8s/wandb/sweeps:
    post:
      operationId: createSweep
      tags:
        - Wandb
      summary: Create a sweep.
      description: Create a wandb sweep and return its id.
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WandbSweepsRequest'
      responses:
        '200':
          description: Sweep id.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/WandbSweepsResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  '/internal/tenants/all-tenants/setting/{key}':
    get:
      summary: Get setting by key for all tenants
      description: Retrieve a specific setting value for all tenants in the system
      operationId: getSettingByKeyForAllTenants
      x-internal: true
      x-no-authorization: true
      tags:
        - Internal
      parameters:
        - name: key
          in: path
          required: true
          description: The setting key to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved setting for all tenants
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Map of tenant IDs to setting values
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  '/v1/k8s/clusters/{uuid}/liveness':
    x-internal: true
    post:
      deprecated: true
      summary: >-
        Update liveness status for a specific cluster. This endpoint is reserved
        for internal run:ai purposes.
      x-runai-team: Griffin
      x-test-coverage: not-applicable
      operationId: updateClusterLiveness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                timeTag:
                  type: integer
                  format: int64
      tags:
        - Clusters
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        '204':
          description: Expected response to a valid request (No content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/v1/k8s/clusters/{uuid}/cluster-info':
    x-internal: true
    post:
      deprecated: true
      summary: >-
        Send cluster-info. This endpoint is reserved for internal run:ai
        purposes.
      x-runai-team: Griffin
      x-test-coverage: not-applicable
      operationId: updateClusterInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterInfo'
      tags:
        - Clusters
      parameters:
        - $ref: '#/components/parameters/uuid'
      responses:
        '201':
          description: Updated successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/k8s/clusters:
    post:
      deprecated: true
      x-internal: true
      x-runai-team: Griffin
      x-test-coverage: not-applicable
      tags:
        - Clusters
      summary: Create a cluster
      description: Create a new cluster for the tenant. This endpoint requires ADMIN role.
      operationId: createCluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCluster'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster1'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      x-internal: true
      deprecated: true
      tags:
        - Clusters
      summary: List clusters.
      x-runai-team: Griffin
      x-test-coverage: not-applicable
      description: Get a list of all the clusters of the tenant.
      responses:
        '200':
          description: A JSON array of Clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cluster1'
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/internal/tenants/{tenantId}/metric-store':
    parameters:
      - name: tenantId
        in: path
        required: true
        description: Unique identifier of the tenant.
        schema:
          type: string
    get:
      x-internal: true
      tags:
        - Internal
      summary: Get the metric store for a tenant
      x-runai-team: Sphinx
      x-test-coverage: null
      responses:
        '200':
          description: The metric store for the tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/serviceUnavailable'
  '/v1/k8s/clusters/{uuid}':
    parameters:
      - name: uuid
        in: path
        required: true
        description: Unique identifier of the cluster.
        schema:
          type: string
          format: uuid
    get:
      x-internal: true
      deprecated: true
      tags:
        - Clusters
      summary: Get cluster by id
      x-runai-team: Griffin
      x-test-coverage: not-applicable
      description: >-
        Retrieve a cluster given a cluster id. This endpoint requires ADMIN
        role.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster1'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      x-internal: true
      deprecated: true
      tags:
        - Clusters
      summary: Update a Cluster by Id
      x-runai-team: Griffin
      x-test-coverage: not-applicable
      operationId: updateCluster
      description: >-
        Update the details of a given cluster. This endpoint requires ADMIN
        role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cluster1'
            example:
              name: cluster-a
              description: group-a-cluster
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster1'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      x-internal: true
      deprecated: true
      tags:
        - Clusters
      summary: Delete a Cluster
      x-runai-team: Griffin
      x-test-coverage: not-applicable
      description: Delete a Cluster by Cluster ID. This endpoint requires ADMIN role.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  '/v1/k8s/clusters/{cluster_uuid}/installfile':
    get:
      tags:
        - Clusters
      summary: Get cluster installation file by id.
      x-runai-team: Griffin
      x-test-coverage:
        - e2e/src/test/suites/upgradeSuite/installCluster.test.ts
      description: >
        Retrieve the installation values file of a cluster by Retrieve the
        installation values file of a given cluster by ID. 

        Supports clusters 2.13 and lower.
      operationId: getInstallFile
      parameters:
        - name: cluster_uuid
          in: path
          required: true
          description: Unique identifier of the cluster.
          schema:
            type: string
            format: uuid
        - in: query
          name: cloud
          description: Cloud type identifier.
          schema:
            type: string
            enum:
              - gke
              - aws
              - aks
              - op
              - airgapped
              - openshift
        - in: query
          name: clusterip
          description: >-
            Comma-separated list of IP addresses that provide access to the
            cluster.
          schema:
            type: string
        - in: query
          name: format
          description: Format of the output file.
          schema:
            type: string
            enum:
              - json
              - yaml
            default: yaml
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  '/v1/k8s/clusters/{cluster_uuid}/config':
    x-internal: true
    get:
      tags:
        - Clusters
      summary: Get cluster configuration.
      x-runai-team: Griffin
      x-test-coverage: not-applicable
      description: >-
        Retrieve the configuration of a Kubernetes cluster by Universally Unique
        Identifier (UUID).
      parameters:
        - name: cluster_uuid
          in: path
          required: true
          description: The Universally Unique Identifier (UUID) of a cluster.
          schema:
            type: string
            format: uuid
        - name: cluster_domain
          in: query
          required: false
          description: The domain of the cluster.
          schema:
            type: string
            format: uri
        - name: cluster_version
          in: query
          required: false
          description: The version of the configuration.
          schema:
            type: string
            pattern: >-
              ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
      responses:
        '200':
          description: Cluster config returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    TenantName:
      type: string
      description: The name of the tenant
      example: runai
    TenantId:
      description: The id of the tenant.
      type: integer
      format: int32
      example: 1001
    Tenant:
      type: object
      required:
        - id
      properties:
        authSettingsId:
          type: integer
          example: 1
        displayName:
          type: string
          example: My Company
        ssoAuthSettingsId:
          type: integer
          example: 1
        authRealm:
          type: string
          example: runai
        id:
          $ref: '#/components/schemas/TenantId'
        name:
          type: string
          example: runai
        eulaSigningUser:
          type: string
          example: ...
        contractType:
          type: string
          example: normal
        smgEnabled:
          type: boolean
          example: true
        authClientID:
          type: string
          example: runai-admin-ui
        cliClientId:
          type: string
          example: runai-cli
    Error:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          minimum: 100
          maximum: 599
        message:
          type: string
        details:
          type: string
      example:
        code: 400
        message: Bad request - Resource should have a name
    Setting:
      properties:
        active:
          type: boolean
          example: true
        category:
          type: string
          example: Department
        description:
          type: string
          example: Enable the department feature
        source:
          type: string
          example: Tenant
        label:
          type: string
          example: Show departments
        stage:
          type: string
          example: Beta
        type:
          type: string
          example: Boolean
        key:
          type: string
          example: department.use
        value:
          type: string
          example: true
    TenantSettingCreationRequest:
      properties:
        key:
          type: string
          example: department.use
        value:
          example: true
    TenantSettingCreationResponse:
      properties:
        msg:
          type: string
          example: done
    Config:
      type: object
      properties:
        tenantName:
          type: string
          example: runai
        authClientName:
          type: string
          example: runai-admin-ui
        authUrl:
          type: string
          example: 'https://auth.run.ai'
        authRealm:
          type: string
          example: runai
    WandbSweepsRequest:
      required:
        - apiKey
        - project
        - config
      properties:
        apiKey:
          type: string
          description: Wandb API key.
          example: 703b507256379410b2dd15fd10500te065r307y0m
        baseUrl:
          type: string
          description: >-
            Wandb host URL, to be provided in case of a self-hosted W&B
            installation.
          nullable: true
          example: 'https://wandb.example.com/'
        project:
          type: string
          description: Wandb project.
          example: myproject
        config:
          type: object
          description: Sweep config JSON object.
          example:
            name: my-sweep
            method: random
            metric:
              goal: maximize
              name: val_acc
            parameters:
              lr:
                max: 0.1
                min: 0.0001
    WandbSweepsResponse:
      properties:
        sweepId:
          type: string
          example: myproject/wpvht20s
    ClusterId:
      description: The id of the cluster.
      type: string
      format: uuid
      example: 71f69d83-ba66-4822-adf5-55ce55efd210
    ClusterName:
      type: string
      example: cluster-a
    ResourceData:
      type: object
      description: >-
        quota equals to the given resources and allocated equal to the real
        count of used resources
      required:
        - quota
        - allocated
      properties:
        quota:
          type: number
          example: 3
        allocated:
          type: number
          example: 2.5
        utilization:
          type: number
          example: 0.765
    ResourcesData:
      type: object
      required:
        - numberOfPendingWorkloads
        - gpu
        - cpu
        - memory
      properties:
        numberOfPendingWorkloads:
          type: integer
          example: 1
        gpu:
          description: GPU resources in fractions. 0.7 = 70% of a gpu
          $ref: '#/components/schemas/ResourceData'
        cpu:
          description: CPU resources in millicpus. 1000 = 1 cpu
          $ref: '#/components/schemas/ResourceData'
        memory:
          description: Memory resources in megabytes. 1 = 10^6  (1000*1000)
          $ref: '#/components/schemas/ResourceData'
    NodepoolName:
      type: string
      example: nodepoola
    ProjectName:
      type: string
      example: project-a
    DepartmentName:
      type: string
      example: default
    nodepoolName:
      type: string
      example: nodepoola
    ResourcesDataOvertime:
      allOf:
        - $ref: '#/components/schemas/ResourcesData'
        - type: object
          required:
            - timestamp
          properties:
            timestamp:
              type: string
              format: date-time
              example: '2023-06-06T12:09:18.211Z'
    TimeRange:
      type: object
      description: >-
        Overtime metrics data. Returned only if both start and end query
        parameters are set.
      required:
        - resources
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourcesDataOvertime'
    cluster:
      type: object
      required:
        - metadata
        - current
      properties:
        metadata:
          type: object
          required:
            - clusterId
            - clusterName
          properties:
            clusterId:
              $ref: '#/components/schemas/ClusterId'
            clusterName:
              $ref: '#/components/schemas/ClusterName'
        current:
          type: object
          description: >-
            Current reported metrics data. resources holds data that is summed
            up to the cluster level and projectResources explains the division
            of it to projects
          required:
            - resources
            - projectResources
          properties:
            resources:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/ResourcesData'
                  - type: object
                    required:
                      - nodepoolName
                    properties:
                      nodepoolName:
                        $ref: '#/components/schemas/NodepoolName'
            projectResources:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/ResourcesData'
                  - type: object
                    required:
                      - projectName
                      - departmentName
                      - nodepoolName
                    properties:
                      projectName:
                        $ref: '#/components/schemas/ProjectName'
                      departmentName:
                        $ref: '#/components/schemas/DepartmentName'
                      nodepoolName:
                        $ref: '#/components/schemas/nodepoolName'
        timeRange:
          $ref: '#/components/schemas/TimeRange'
    DepartmentId:
      description: The id of the department
      type: integer
      format: int32
      minimum: 1
      example: 8
    Department:
      type: object
      required:
        - metadata
        - current
      properties:
        metadata:
          type: object
          required:
            - departmentId
            - departmentName
            - clusterId
            - clusterName
          properties:
            departmentId:
              $ref: '#/components/schemas/DepartmentId'
            departmentName:
