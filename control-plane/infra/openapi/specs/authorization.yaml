        - scopeId
        - scopeType
      properties:
        roleId:
          type: integer
          format: int32
          description: The ID of the role to assign.
          example: 53142648
        scopeId:
          type: string
          description: The unique identifier of the scope.
          example: a418ed33-9399-48c0-a890-122cadd13bfd
        scopeType:
          type: string
          description: The type of scope the access rule applies to.
          enum:
            - tenant
            - cluster
            - department
            - project
        clusterId:
          $ref: '#/components/schemas/ClusterId'
    AccessRulesMigrateDeprecatedFields:
      type: object
      description: Specifies the old (deprecated) role and the new (non-deprecated) role for access-rule migration.
      required:
        - oldRoleId
        - newRoleId
      properties:
        oldRoleId:
          type: integer
          format: int32
          description: The numeric ID of the deprecated role whose access rules should be migrated. Must be a deprecated role in the current tenant.
          example: 53142648
        newRoleId:
          type: integer
          format: int32
          description: The numeric ID of the non-deprecated role to migrate access rules to. Must not be a deprecated role, and must be enabled.
          example: 12345678
    AccessRulesMigrateDeprecatedFailureItem:
      type: object
      description: A single access rule that failed to migrate. The old access rule remains in place (still tied to the deprecated role).
      required:
        - oldAccessRuleId
        - step
        - code
        - message
      properties:
        oldAccessRuleId:
          type: integer
          format: int32
          description: The ID of the access rule on the deprecated role that failed to migrate. This rule is still alive and should be handled separately.
        step:
          type: string
          description: Which step of the migration failed. "create" means the new access rule could not be created. "delete" means the new rule was created (or already existed) but the old rule could not be deleted, so the transaction was rolled back.
          enum:
            - create
            - delete
        code:
          type: integer
          format: int32
          description: A numeric code representing the error type (typically an HTTP status code).
        message:
          type: string
          description: A human-readable message describing why the migration failed for this access rule.
    AccessRulesMigrateDeprecatedResponse:
      type: object
      description: The result of a migrate-deprecated operation.
      required:
        - succeeded
        - failed
      properties:
        succeeded:
          type: object
          description: Access rules that were successfully migrated. `created` + `preExisting` together account for one entry per deleted old rule, so `len(deleted) == len(created) + len(preExisting)`.
          required:
            - created
            - preExisting
            - deleted
          properties:
            created:
              type: array
              description: New-role access rules that were freshly created as part of this migration.
              items:
                $ref: '#/components/schemas/AccessRule'
            preExisting:
              type: array
              description: New-role access rules that already existed at the start of the call (same subject + scope + new role). No new rule was created for these, but the corresponding old (deprecated-role) rule was still deleted since the subject already has the new role on that scope.
              items:
                $ref: '#/components/schemas/AccessRule'
            deleted:
              $ref: '#/components/schemas/AccessRuleDeletionBatchIdsList'
        failed:
          type: array
          description: Access rules that failed to migrate. Each item identifies the old access rule (still alive) and the failure reason.
          items:
            $ref: '#/components/schemas/AccessRulesMigrateDeprecatedFailureItem'
