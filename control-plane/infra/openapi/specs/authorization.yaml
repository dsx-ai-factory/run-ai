components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: The maximum number of entries to return.
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 500
    Offset:
      name: offset
      in: query
      required: false
      description: The offset of the first item returned in the collection.
      schema:
        type: integer
        format: int32
        example: 100
    SortOrder:
      name: sortOrder
      in: query
      required: false
      description: Sort results in descending or ascending order.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    RolesSort:
      name: sortBy
      in: query
      required: false
      description: Sort results by a parameter.
      schema:
        $ref: '#/components/schemas/RolesSortFilterFields'
    RolesFilter:
      name: filterBy
      in: query
      required: false
      description: Filter results by a parameter. Use the format field-name operator value. Operators are == Equals, != Not equals, <= Less than or equal, >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts with and =$ Ends with. Dates are in ISO 8601 timestamp format and available for operators ==, !=, <= and >=.
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          pattern: ^(name|createdAt|createdBy|custom|scopeType|enabled)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
      example:
        - name!=some-access-rule-name
        - createdAt>=2023-01-01T00:00:00Z
      explode: false
    Search:
      name: search
      in: query
      required: false
      description: Filter results by a free text search.
      schema:
        type: string
        example: test project
    IncludeInternal:
      name: includeInternal
      in: query
      required: false
      x-internal: true
      schema:
        type: boolean
        example: false
        default: false
    RoleIdPath:
      name: roleIdPath
      in: path
      required: true
      description: The ID of the role
      example: 32
      schema:
        type: integer
        format: int32
        minimum: 0
    PermissionSetId:
      name: permissionSetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubjectTypeOptional:
      name: subjectType
      in: query
      required: false
      description: The type of resource we want to filter by.
      schema:
        type: string
        example: user
    SubjectIds:
      name: subjectIds
      in: query
      required: false
      description: The ids of the subjects to filter the response for.
      explode: false
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          example: some.user@run.ai
    LastUpdated:
      name: lastUpdated
      in: query
      required: false
      description: Filter by last update time.
      schema:
        type: string
        example: '2021-12-14T16:04:15.099Z'
    IncludeDeleted:
      name: includeDeleted
      in: query
      required: false
      description: True to include deleted objects in the result.
      schema:
        type: boolean
        example: false
        default: false
    FilterByCluster:
      name: clusterId
      in: query
      description: Filter using the Universally Unique Identifier (UUID) of the cluster.
      required: false
      schema:
        type: string
        format: uuid
        example: d73a738f-fab3-430a-8fa3-5241493d7128
    ScopeIdOptional:
      name: scopeId
      in: query
      required: false
      description: The scope resource id that we want to filter by.
      schema:
        type: string
        example: '2'
    AccessRulesSort:
      name: sortBy
      in: query
      required: false
      description: Sort results by a parameter.
      schema:
        $ref: '#/components/schemas/AccessRulesSortFilterFields'
    AccessRulesFilter:
      name: filterBy
      in: query
      required: false
      description: Filter results by a parameter. Use the format field-name operator value. Operators are == Equals, != Not equals, <= Less than or equal, >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts with and =$ Ends with. Dates are in ISO 8601 timestamp format and available for operators ==, !=, <= and >=.
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          pattern: ^(subjectId|subjectType|roleId|scopeId|scopeType|roleName|scopeName|createdAt|deletedAt|createdBy|phase)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
      example:
        - name!=some-access-rule-name
        - createdAt>=2023-01-01T00:00:00Z
      explode: false
    AccessRuleId:
      name: accessRuleId
      in: path
      required: true
      description: The id of the access rule to retrieve
      example: 32
      schema:
        type: integer
        format: int32
        minimum: 0
    ClusterUuid:
      name: clusterUuid
      in: path
      required: true
      description: The Universally Unique Identifier (UUID) of the cluster.
      schema:
        type: string
        format: uuid
        minLength: 1
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
    SubjectType:
      name: subjectType
      in: query
      required: true
      description: The type of resource we want to filter by.
      schema:
        type: string
        example: user
    SubjectId:
      name: subjectId
      in: query
      required: true
      description: The subject id that we want to filter by.
      schema:
        type: string
        example: some.user@run.ai
    DryRun:
      name: dryRun
      in: query
      required: false
      description: True to perform validations only, without side effects.
      schema:
        type: boolean
        example: false
        default: false
    Roles:
      name: roles
      in: query
      required: false
      description: The roles we want to filter by.
      schema:
        type: string
        example: ML engineer,L1 researcher
    DepartmentIds:
      name: departmentIds
      in: query
      required: false
      description: The department scope resource ids that we want to filter by.
      schema:
        type: string
        example: 1,2
    ProjectIds:
      name: projectIds
      in: query
      required: false
      description: The project scope resource ids that we want to filter by.
      schema:
        type: string
        example: 1,2
    ScopeType:
      name: scopeType
