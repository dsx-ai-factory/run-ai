openapi: 3.0.3
info:
  title: Authorization
  version: '1.0'
  description: An API for managing RunAi authorization objects and perform as the RunAi authorization layer.
  contact:
    name: Run.AI
    url: https://www.run.ai/
    email: support@run.ai
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /:
    x-internal: true
    x-service: authorization
    get:
      summary: health check
      x-no-authorization: true
      x-test-coverage: not-applicable
      x-service: authorization
      operationId: health
      tags:
        - Health
      responses:
        '200':
          description: Executed successfully.
  /api/v2/authorization/roles:
    x-scope:
      - system
      - tenant
    post:
      summary: Create a role.
      description: Creates a custom role with the specified permission sets.
      operationId: create_role
      x-service: authorization
      x-test-coverage:
        - e2e/src/test/suites/playwright/serial/sphinx/systemScopedCostumeRoles.test.ts
      x-authorize:
        resource-type: roles
        action: create
      tags:
        - Roles
      requestBody:
        description: The role to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreationFieldsInternal'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    get:
      summary: Get a list of roles.
      description: Retrieves a list of all available roles, including both NVIDIA Run:ai predefined roles and custom roles. Use this endpoint to review role configurations, permission sets and permissions.
      operationId: get_roles
      x-service: authorization
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/permissions/applicationAggregatedApi.test.ts
        - e2e/src/test/suites/advancedSuite/permissions/accessRulesApi.test.ts
        - e2e/src/test/suites/playwright/serial/sphinx/systemScopedCostumeRoles.test.ts
      x-authorize:
        resource-type: roles
        action: read
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/RolesSort'
        - $ref: '#/components/parameters/RolesFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IncludeInternal'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - roles
                properties:
                  roles:
                    $ref: '#/components/schemas/Roles'
                  next:
                    type: integer
                    example: 1
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v2/authorization/roles/{roleIdPath}:
    x-scope:
      - system
      - tenant
    get:
      summary: Get a role by id.
      description: Retrieves details for a specific role, including its name, description, scope, and associated permission sets.
      operationId: get_role
      x-service: authorization
      x-test-coverage:
        - control-plane/authorization/pkg/services/role_api_test.go
      x-authorize:
        resource-type: roles
        action: read
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    delete:
      summary: Delete a role by id.
      description: Deletes a custom role. Use this endpoint to permanently remove roles that are no longer needed. NVIDIA Run:ai predefined roles cannot be deleted.
      operationId: delete_role
      x-service: authorization
      x-test-coverage:
        - control-plane/authorization/pkg/services/role_api_test.go
      x-authorize:
        resource-type: roles
        action: delete
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    put:
      summary: Update a role by id.
      description: Updates a custom role, including its name, description, or associated permission sets. NVIDIA Run:ai predefined roles cannot be updated.
      operationId: update_role
      x-service: authorization
      x-test-coverage:
        - control-plane/authorization/pkg/services/role_api_test.go
      x-authorize:
        resource-type: roles
        action: update
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreationFieldsInternal'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v2/authorization/roles/{roleIdPath}/active:
    post:
      summary: Enable or Disable a role by id.
      operationId: role_active
      x-internal: true
      x-service: authorization
      x-test-coverage:
        - control-plane/authorization/pkg/services/role_api_test.go
      x-authorize:
        resource-type: roles
        action: update
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleActiveFields'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v2/authorization/roles/{roleIdPath}/enable:
    x-scope:
      - system
      - tenant
    post:
      summary: Enable a role by id.
      description: Enables a specific role. Disabled roles cannot be assigned to users and do not grant any permissions.
      operationId: role_enable
      x-service: authorization
      x-test-coverage:
        - control-plane/authorization/pkg/services/role_api_test.go
      x-authorize:
        resource-type: roles
        action: update
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleEnabledDisabledFields'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v2/authorization/roles/{roleIdPath}/disable:
    x-scope:
      - system
      - tenant
    post:
      summary: Disable a role by id.
      description: Disables a specific role. Disabled roles cannot be assigned to users and do not grant any permissions.
      operationId: role_disable
      x-service: authorization
      x-test-coverage:
        - control-plane/authorization/pkg/services/role_api_test.go
      x-authorize:
        resource-type: roles
        action: update
      tags:
        - Roles
      parameters:
        - $ref: '#/components/parameters/RoleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleEnabledDisabledFields'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/authorization/permission-sets:
    x-scope:
      - system
      - tenant
    get:
      summary: Get permission sets.
      description: Retrieve a list of all available permission sets. Each permission set defines a collection of permissions grouped by resource type and associated actions (such as create, read, update, or delete).
      operationId: get_permission_sets
      x-service: authorization
      x-authorize:
        resource-type: roles
        action: read
      tags:
        - Permissions
      x-test-coverage:
        - control-plane/authorization/pkg/services/permissions_sets_api_test.go
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - permissionSets
                properties:
                  permissionSets:
                    $ref: '#/components/schemas/PermissionSets'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/authorization/permission-sets/{permissionSetId}:
    x-scope:
      - system
      - tenant
    get:
      summary: Get permission set by id.
      description: Returns information about a single permission set, including its name, description, and the list of permissions it contains.
      operationId: get_permission_set
      x-service: authorization
      x-authorize:
        resource-type: roles
        action: read
      tags:
        - Permissions
      x-test-coverage:
        - control-plane/authorization/pkg/services/permissions_sets_api_test.go
      parameters:
        - $ref: '#/components/parameters/PermissionSetId'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSet'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/authorization/access-rules:
    x-scope:
      - system
      - tenant
    post:
      summary: Create an access rule.
      description: Use to bind a predefined role to a subject (user, group or service account) in a scope.
      operationId: create_access_rule
      x-service: authorization
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/permissions/applicationAggregatedApi.test.ts
        - e2e/src/test/suites/advancedSuite/permissions/accessRuleUserV2.test.ts
        - e2e/src/test/suites/advancedSuite/permissions/accessRulesApi.test.ts
        - e2e/src/test/suites/advancedSuite/authorization/authorizationUI.test.ts
      x-authorize:
        resource-type: access_rules
        action: create
      x-audit: true
      tags:
        - Access rules
      requestBody:
        description: The access rule to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRuleCreationFields'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRule'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    get:
      summary: List the access rules.
      description: Retrieve a list of access rules.
      operationId: get_access_rules
      x-service: authorization
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/permissions/applicationAggregatedApi.test.ts
        - e2e/src/test/suites/advancedSuite/permissions/accessRuleUserV2.test.ts
        - e2e/src/test/suites/advancedSuite/permissions/accessRulesApi.test.ts
        - e2e/src/test/suites/advancedSuite/authorization/authorizationUI.test.ts
      x-authorize:
        resource-type: access_rules
        action: read
      tags:
        - Access rules
      parameters:
        - $ref: '#/components/parameters/SubjectTypeOptional'
        - $ref: '#/components/parameters/SubjectIds'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/LastUpdated'
        - $ref: '#/components/parameters/IncludeDeleted'
        - $ref: '#/components/parameters/FilterByCluster'
        - $ref: '#/components/parameters/ScopeIdOptional'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/AccessRulesSort'
        - $ref: '#/components/parameters/AccessRulesFilter'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - totalRecords
                  - displayRecords
                  - accessRules
                properties:
                  totalRecords:
                    type: integer
                    example: 1
                  displayRecords:
                    type: integer
                    example: 1
                  accessRules:
                    $ref: '#/components/schemas/AccessRules'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/authorization/access-rules/sync:
    get:
      summary: List the access rules.
      description: Retrieve a list of access rules.
      operationId: get_access_rules_sync
      x-service: authorization
      x-internal: true
      x-test-coverage:
        - control-plane/authorization/pkg/services/access_rules_api_test.go
      x-authorize:
        resource-type: access_rules
        action: sync
      tags:
        - Access rules
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/LastUpdated'
        - $ref: '#/components/parameters/FilterByCluster'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accessRules
                properties:
                  next:
                    type: integer
                    example: 1
                  accessRules:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessRuleSync'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/authorization/access-rules/{accessRuleId}:
    x-scope:
      - system
      - tenant
    get:
      summary: Get an access rule.
      description: Use to retrieve the details of an access rule by id.
      operationId: get_access_rule
      x-service: authorization
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/permissions/accessRulesApi.test.ts
      x-authorize:
        resource-type: access_rules
        action: read
        resource-id: accessRuleId
      tags:
        - Access rules
      parameters:
        - $ref: '#/components/parameters/AccessRuleId'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRuleById'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    delete:
      summary: Delete an access rule.
      description: Use to delete the subject permissions assigned by access rule id.
      operationId: delete_access_rule
      x-service: authorization
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/permissions/accessRulesApi.test.ts
      x-authorize:
        resource-type: access_rules
        action: delete
        resource-id: accessRuleId
      x-audit: true
      tags:
        - Access rules
      parameters:
        - $ref: '#/components/parameters/AccessRuleId'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/authorization/access-rules/count:
    x-scope:
      - system
      - tenant
    get:
      summary: Count access rules.
      description: Use to retrieve the number of access rules.
      operationId: count_access_rules
      x-service: authorization
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/authorization/authorizationUI.test.ts
      x-authorize:
        resource-type: access_rules
        action: read
      tags:
        - Access rules
      parameters:
        - $ref: '#/components/parameters/IncludeDeleted'
        - $ref: '#/components/parameters/AccessRulesFilter'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
                    format: int64
                    example: 1
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/authorization/access-rules/{accessRuleId}/{clusterUuid}/status:
    x-internal: true
    put:
      summary: Update an access rule.
      description: Use to update the status of the access rule in the cluster by id.
      operationId: update_access_rule_status
      x-service: authorization
      x-internal: true
      x-test-coverage:
        - control-plane/authorization/pkg/services/access_rules_batch_api_test.go
      x-authorize:
        resource-type: access_rules
        action: sync
      tags:
        - Access rules
      parameters:
        - $ref: '#/components/parameters/AccessRuleId'
        - $ref: '#/components/parameters/ClusterUuid'
      requestBody:
        description: The status of the access rule in the cluster.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRuleStatusRequest'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/authorization/access-rules/{clusterUuid}/sync:
    x-internal: true
    post:
      summary: Sync access rules.
      description: Use to synchronize the statuses of the access rules in the cluster.
      operationId: sync_access_rules
      x-service: authorization
      x-internal: true
      x-test-coverage:
        - control-plane/authorization/pkg/services/access_rules_api_test.go
      x-authorize:
        resource-type: access_rules
        action: sync
      tags:
        - Access rules
      parameters:
        - $ref: '#/components/parameters/ClusterUuid'
      requestBody:
        description: The statuses to sync.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRulesSyncRequest'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/authorization/access-rules/batch:
    x-scope:
      - system
      - tenant
    post:
      summary: Delete Multiple Access Rules
      operationId: access_rules_batch
      x-service: authorization
      x-audit: true
      x-test-coverage:
        - control-plane/authorization/pkg/services/access_rules_batch_api_test.go
      x-authorize:
        resource-type: access_rules
        action: delete
      tags:
        - Access rules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRulesBatchFields'
      responses:
        '200':
          description: Request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRuleDeletionBatchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/authorization/access-rules/batch-create:
    x-scope:
      - system
      - tenant
    post:
      summary: Create Multiple Access Rules
      description: Creates a batch of access rules in a single operation. Requires a list of access rule objects, each specifying the subject, role, and scope. Returns the result of the operation, including which rules were successfully created and any that failed, along with error messages if applicable.
      operationId: access_rules_batch_create
      x-service: authorization
      x-audit: true
      x-test-coverage:
        - control-plane/authorization/pkg/services/access_rules_batch_api_test.go
