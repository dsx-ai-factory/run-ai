openapi: "3.0.0"
info:
  version: 2.0.0
  title: {{cookiecutter.app_name}}
  contact:
    email: support@run.ai
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
components:
  responses:
    $ref: "../../../infra/openapi/docs/responses/_index.yaml"
  securitySchemes:
    $ref: "./securitySchemes/_index.yaml"
  parameters:
    $ref: "./parameters/_index.yaml"
  schemas:
    $ref: "./schemas/_index.yaml"

paths:
  /:
    x-internal: true
    get:
      summary: health check
      x-no-authorization: true
      operationId: health
      tags:
        - Health
      responses:
        200:
          description: Executed successfully.

  /api/v1/datavolumes:
    $ref: './resources/Datavolumes.yaml'

  /api/v1/datavolumes/{datavolumeId}:
    $ref: './resources/Datavolume.yaml'

  /api/v1/datavolumes/{datavolumeId}/sharedScopes:
    $ref: './resources/SharedScopes.yaml'

  /api/v1/datavolumes/{datavolumeId}/status:
    x-internal: true
    $ref: './resources/DatavolumeStatus.yaml'
  /api/v1/datavolumes/sync:
    x-internal: true
    $ref: './resources/DatavolumesSync.yaml'

  /internal/datavolumes/{datavolumeId}/ancestors:
    x-internal: true
    $ref: './resources/DatavolumeAncestors.yaml'
