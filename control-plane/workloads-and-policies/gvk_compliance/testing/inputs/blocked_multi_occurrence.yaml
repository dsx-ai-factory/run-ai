policy:
  id: test-policy
  effectiveRules:
    # blocked:true over a selector that resolves to multiple instances.
    # Inverse of required_multi_occurrence_missing_item: here the rule fails
    # when ANY selected occurrence carries a value.
    - field: image
      specSelector: allContainers
      enforcements:
        - blocked: true

  breakdown:
    fields:
      image:
        - specSelectors: [allContainers]
          specRef: image
          formatter:
            builtin: KeyValue
    specSelectors:
      allContainers:
        query: |
          (
            .spec.template.spec.containers[]?,
            .spec.template.spec.initContainers[]?
          )
          | select(.)

workload:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: blocked-image-multi
  spec:
    template:
      spec:
        containers:
          - name: no-image     # passes: image absent
          - name: with-image   # fails: image present, blocked rejects it
            image: ubuntu
