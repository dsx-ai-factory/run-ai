policy:
  id: test-policy
  effectiveRules:
    # Same field ("name") validated through two different spec selectors that
    # resolve to different variations in the breakdown.

    # Variation 1 — entireWorkload: validates the Deployment's metadata.name.
    - field: name
      specSelector: entireWorkload
      enforcements:
        - length: { min: 8 }
    # Variation 2 — allContainers: validates each container's name.
    - field: name
      specSelector: allContainers
      enforcements:
        - length: { min: 5 }

    # Parameterized spec selector: validates only the specific container
    # named by selectorParams.containerName.
    - field: image
      specSelector: appContainerByName
      selectorParams:
        containerName: worker
      enforcements:
        - options: [redhat]

    # Same field ("environmentVariables-Name") validated through two different
    # item selectors on the same variation.

    # Item selector 1 — every env var name across all containers must be >= 3 chars.
    - field: environmentVariables-Name
      specSelector: allContainers
      itemSelector: allEnvVars
      enforcements:
        - length: { min: 3 }
    # Item selector 2 — env vars sourced from ConfigMaps must be named MY_CONFIG.
    - field: environmentVariables-Name
      specSelector: allContainers
      itemSelector: envVarFromConfigMap
      enforcements:
        - options: [MY_CONFIG]

  # Mirrors the seed from
  # control-plane/policy-service/pkg/services/system_mapping_deployment.go +
  # system_mapping_podspec_field_groups.go for apps/v1 Deployment.
  breakdown:
    fields:
      name:
        # Variation for the workload as a whole — specRef is the metadata name.
        - specSelectors: [entireWorkload]
          specRef: metadata.name
          formatter:
            builtin: KeyValue
        # Variation for each container — specRef is the container-level name.
        - specSelectors: [allContainers]
          specRef: name
          formatter:
            builtin: KeyValue
      image:
        - specSelectors: [appContainerByName]
          specRef: image
          formatter:
            builtin: KeyValue
      environmentVariables-Name:
        # Single variation with multiple item selectors.
        - specSelectors: [allContainers]
          specRef: name
          formatter:
            builtin: KeyValue
          itemSelectors:
            allEnvVars:
              query: "(.env // [])[]"
            envVarFromConfigMap:
              query: '(.env // [])[] | select(.valueFrom.configMapKeyRef != null)'
    specSelectors:
      entireWorkload:
        query: "."
      allContainers:
        query: |
          (
            .spec.template.spec.containers[]?,
            .spec.template.spec.initContainers[]?
          )
          | select(.)
      appContainerByName:
        query: |
          (
            .spec.template.spec.containers[]?
          )
          | select(.name == $ARGS.named.containerName)
        argsInfo:
          containerName: string

workload:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: d1                             # fails rule 1 (length.min 8)
  spec:
    template:
      spec:
        containers:
          - name: a                      # fails rule 2 (length.min 5)
            env:
              - name: AB                 # fails rule 4 (length.min 3)
                value: x
              - name: BAD_CONFIG         # fails rule 5 (not in options)
                valueFrom:
                  configMapKeyRef:
                    name: cm-x
                    key: k
          - name: worker
            image: ubuntu                # fails rule 3 (not in options)
