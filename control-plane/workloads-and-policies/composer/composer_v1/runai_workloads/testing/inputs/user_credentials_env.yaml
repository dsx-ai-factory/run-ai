image: ubuntu
command: python-3.8
args: "-x my-script.py"
environmentVariables:
  - name: HOME
    value: /home/my-folder
  - name: user-credentials-env
    userCredential:
      name: my-user-credential
      key: password
workingDir: /home/my-folder
nodePools:
  - my-node-pool-a
  - my-node-pool-b
autoDeletionTimeAfterCompletionSeconds: 864000

compute:
  gpuDevicesRequest: 1
  gpuRequestType: portion
  gpuPortionRequest: 0.5

storage:
  hostPath:
    - path: "/container/directory"
      readOnly: true
      mountPath: "/local/directory"
  nfs:
    - path: "/container/nfs"
      readOnly: true
      server: my.nfs.com
      mountPath: "/local/nfs"

security:
  uidGidSource: fromTheImage
  runAsNonRoot: true








