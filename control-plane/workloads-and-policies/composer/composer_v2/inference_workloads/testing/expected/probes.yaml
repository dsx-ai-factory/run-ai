Config: {}
Service:
  apiVersion: serving.knative.dev/v1
  kind: Service
  metadata:
    annotations:
      run.ai/submitted-by: tester
    labels:
      app: service
      createdBy: Service
      project: team-a
      release: my-llm
      run.ai/control-plane-managed: "true"
      run.ai/converted-from-native: "true"
      workloadKind: Inference
      workloadName: my-llm
    name: my-llm
    namespace: runai-team-a
  spec:
    template:
      metadata:
        labels:
          app: service
          createdBy: Service
          project: team-a
          release: my-llm
          workloadKind: Inference
          workloadName: my-llm
      spec:
        containers:
        - image: my-llm:latest
          name: my-llm
          ports:
          - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {}
        schedulerName: runai-scheduler
  status: {}
