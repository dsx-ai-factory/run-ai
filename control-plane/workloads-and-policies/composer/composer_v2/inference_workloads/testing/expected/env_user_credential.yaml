Config:
  userCredentials:
    sources:
    - ref: ngcgs-my-ngc-12345678-a
Service:
  apiVersion: serving.knative.dev/v1
  kind: Service
  metadata:
    annotations:
      run.ai/submitted-by: tester
    labels:
      app: service
      createdBy: Service
      project: team-a
      release: my-llm
      run.ai/control-plane-managed: "true"
      run.ai/converted-from-native: "true"
      workloadKind: Inference
      workloadName: my-llm
    name: my-llm
    namespace: runai-team-a
  spec:
    template:
      metadata:
        labels:
          app: service
          createdBy: Service
          project: team-a
          release: my-llm
          workloadKind: Inference
          workloadName: my-llm
      spec:
        containers:
        - env:
          - name: PLAIN
            value: hello
          - name: NGC_API_KEY
            valueFrom:
              secretKeyRef:
                key: apiKey
                name: pc-my-llm-ngcgs-my-ngc-12345678-a
          image: my-llm:latest
          name: my-llm
          ports:
          - containerPort: 8080
          resources: {}
        schedulerName: runai-scheduler
  status: {}
