Config:
  networking:
  - externalAccess:
      ingress:
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: infw-my-llm-url-authenticated-external-url
        spec:
          rules:
          - host: team-a-my-llm-url-authenticated-external-url.test.run.ai
            http:
              paths:
              - backend:
                  service:
                    name: infw-my-llm-url-authenticated-external-url
                    port:
                      number: 80
                path: /
                pathType: Prefix
    services:
    - spec:
        name: infw-my-llm-url-authenticated-external-url
        ports:
        - name: port-4181
          port: 80
          protocol: TCP
          targetPort: 4181
        selector:
          release: my-llm
        type: ClusterIP
Service:
  apiVersion: serving.knative.dev/v1
  kind: Service
  metadata:
    annotations:
      run.ai/submitted-by: tester
    labels:
      app: service
      createdBy: Service
      project: team-a
      release: my-llm
      run.ai/control-plane-managed: "true"
      run.ai/converted-from-native: "true"
      workloadKind: Inference
      workloadName: my-llm
    name: my-llm
    namespace: runai-team-a
  spec:
    template:
      metadata:
        labels:
          app: service
          createdBy: Service
          project: team-a
          release: my-llm
          workloadKind: Inference
          workloadName: my-llm
      spec:
        containers:
        - image: my-llm:latest
          name: my-llm
          resources: {}
        - args:
          - --provider=keycloak-oidc
          - --upstream=http://localhost:8080
          - --redirect-url=https://team-a-my-llm.test.run.ai/oauth2/callback
          - --oidc-issuer-url=https://test.run.ai/auth/realms/runai
          - --scope=openid
          - --http-address=0.0.0.0:4180
          - --proxy-prefix=/oauth2
          - --skip-provider-button=true
          - --whitelist-domain=team-a-my-llm.test.run.ai
          - --cookie-domain=team-a-my-llm.test.run.ai
          - --cookie-httponly=true
          - --cookie-secure=true
          - --code-challenge-method=S256
          - --cookie-refresh=10m
          - --cookie-samesite=lax
          - --skip-jwt-bearer-tokens=true
          - --extra-jwt-issuers=https://test.run.ai/auth/realms/runai=runai
          - --custom-templates-dir=/usr/share/oauth2-proxy
          - --pass-authorization-header=false
          - --cookie-name=InferenceWorkload-runai-team-a-my-llm-0
          - --session-store-type=redis
          - --redis-connection-url=redis://redis.runai-backend.svc.cluster.local
          - --force-json-errors=true
          - --allowed-group=serving-port-group
          - --email-domain=*
          env:
          - name: OAUTH2_PROXY_COOKIE_PATH
            value: /
          envFrom:
          - secretRef:
              name: runai-auth-secret
          image: test.registry/oauth2-proxy:latest
          imagePullPolicy: IfNotPresent
          name: runai-oauth2-proxy-0
          ports:
          - containerPort: 4180
          readinessProbe:
            tcpSocket:
              port: 8080
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          volumeMounts:
          - mountPath: /etc/runai/auth/users
            name: runai-auth
        - args:
          - --provider=keycloak-oidc
          - --upstream=http://localhost:9090
          - --redirect-url=https://team-a-my-llm-url-authenticated-external-url.test.run.ai/oauth2/callback
          - --oidc-issuer-url=https://test.run.ai/auth/realms/runai
          - --scope=openid
          - --http-address=0.0.0.0:4181
          - --proxy-prefix=/oauth2
          - --skip-provider-button=true
          - --whitelist-domain=team-a-my-llm-url-authenticated-external-url.test.run.ai
          - --cookie-domain=team-a-my-llm-url-authenticated-external-url.test.run.ai
          - --cookie-httponly=true
          - --cookie-secure=true
          - --code-challenge-method=S256
          - --cookie-refresh=10m
          - --cookie-samesite=lax
          - --skip-jwt-bearer-tokens=true
          - --extra-jwt-issuers=https://test.run.ai/auth/realms/runai=runai
          - --custom-templates-dir=/usr/share/oauth2-proxy
          - --pass-authorization-header=false
          - --cookie-name=my-llm-url-authenticated-external-url-auth-proxy
          - --session-store-type=redis
          - --redis-connection-url=redis://redis.runai-backend.svc.cluster.local
          - --authenticated-emails-file=/etc/runai/auth/users/dXJsLWF1dGhlbnRpY2F0ZWQtZXh0ZXJuYWwtdXJs
          env:
          - name: OAUTH2_PROXY_COOKIE_PATH
            value: /
          envFrom:
          - secretRef:
              name: runai-auth-secret
          image: test.registry/oauth2-proxy:latest
          imagePullPolicy: IfNotPresent
          name: runai-oauth2-proxy-1
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          volumeMounts:
          - mountPath: /etc/runai/auth/users
            name: runai-auth
        initContainers:
        - command:
          - sh
          - -c
          - echo -e "ZXh0ZXJuYWwtdXJsLXVzZXJAZXhhbXBsZS5jb20=" | base64 -d > /etc/runai/auth/users/dXJsLWF1dGhlbnRpY2F0ZWQtZXh0ZXJuYWwtdXJs
          image: test.registry/username-loader:latest
          imagePullPolicy: IfNotPresent
          name: runai-auth-user-loader
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 50m
              memory: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
          - mountPath: /etc/runai/auth/users
            name: runai-auth
        schedulerName: runai-scheduler
        volumes:
        - emptyDir: {}
          name: runai-auth
  status: {}
