authSecret: ngc-secret
env:
- name: DIRECT_VALUE
  value: test-value
- name: FROM_SECRET
  valueFrom:
    secretKeyRef:
      key: password
      name: my-secret
- name: FROM_CONFIGMAP
  valueFrom:
    configMapKeyRef:
      key: config-key
      name: my-config
- name: FROM_POD_FIELD
  valueFrom:
    fieldRef:
      fieldPath: metadata.name
expose:
  ingress:
    enabled: false
    spec: {}
  router: {}
  service:
    port: 8000
    type: ClusterIP
image:
  repository: nvidia/nim-llama3-8b-instruct
  tag: 1.0.0
livenessProbe: {}
metrics:
  enabled: true
  serviceMonitor: {}
readinessProbe: {}
replicas: 1
scale:
  hpa:
    maxReplicas: 0
schedulerName: runai-scheduler
startupProbe: {}
storage:
  nimCache:
    name: nim-cache
  pvc: {}
