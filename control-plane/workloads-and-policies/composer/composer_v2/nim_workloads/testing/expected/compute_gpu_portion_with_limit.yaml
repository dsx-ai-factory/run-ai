annotations:
  gpu-fraction: "0.5"
  gpu-fraction-num-devices: "1"
authSecret: ngc-secret
env:
- name: RUNAI_GPU_MEMORY_LIMIT
  value: "0.8"
expose:
  ingress:
    enabled: false
    spec: {}
  router: {}
  service:
    port: 8000
    type: ClusterIP
image:
  repository: nvidia/nim-llama3-8b-instruct
  tag: 1.0.0
livenessProbe: {}
metrics:
  enabled: true
  serviceMonitor: {}
readinessProbe: {}
replicas: 1
scale:
  hpa:
    maxReplicas: 0
schedulerName: runai-scheduler
startupProbe: {}
storage:
  nimCache:
    name: nim-cache
  pvc: {}
