authSecret: ngc-secret
expose:
  ingress:
    enabled: false
    spec: {}
  router: {}
  service:
    port: 8000
    type: ClusterIP
image:
  repository: nvidia/nim-llama3-8b-instruct
  tag: 1.0.0
livenessProbe: {}
metrics:
  enabled: true
  serviceMonitor: {}
readinessProbe:
  enabled: true
  probe:
    httpGet:
      port: 8080
replicas: 1
scale:
  hpa:
    maxReplicas: 0
schedulerName: runai-scheduler
startupProbe: {}
storage:
  nimCache:
    name: nim-cache
  pvc: {}
