ngcAuthSecret: "ngc-secret"
servingPort:
  port: 8000
image: "nvidia/nim-llama3-8b-instruct:1.0.0"
modelStore:
  nimCache:
    name: "nim-cache"
probes:
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
    handler:
      httpGet:
        path: "/health"
        port: 8000
        host: "localhost"
        scheme: "HTTP"
