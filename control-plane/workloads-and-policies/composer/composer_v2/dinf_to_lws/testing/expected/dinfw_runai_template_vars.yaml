Config:
  mnnvl: None
  networking:
  - services:
    - spec:
        name: dinfw-test-lws-sp-0
        ports:
        - name: serving-port
          port: 80
          protocol: TCP
          targetPort: 8080
        selector:
          leaderworkerset.sigs.k8s.io/name: test-lws-1234
          leaderworkerset.sigs.k8s.io/worker-index: "0"
        type: ClusterIP
LeaderWorkerSet:
  apiVersion: leaderworkerset.x-k8s.io/v1
  kind: LeaderWorkerSet
  metadata:
    annotations:
      run.ai/submitted-by: tester
    labels:
      app: leaderworkerset
      createdBy: LeaderWorkerSet
      project: team-a
      release: test-lws
      run.ai/control-plane-managed: "true"
      run.ai/converted-from-native: "true"
      workloadKind: DistributedInference
      workloadName: test-lws
    name: test-lws-1234
    namespace: runai-team-a
  spec:
    leaderWorkerTemplate:
      leaderTemplate:
        metadata:
          labels:
            app: leaderworkerset
            createdBy: LeaderWorkerSet
            project: team-a
            release: test-lws
            workloadKind: DistributedInference
            workloadName: test-lws
        spec:
          containers:
          - args:
            - --project=team-a
            - --job=test-lws
            - --uid=501
            - --gid=20
            command:
            - serve.sh
            env:
            - name: RUNAI_PROJECT
              value: team-a
            - name: RUNAI_JOB_NAME
              value: test-lws
            - name: LDAP_UID
              value: "501"
            - name: LDAP_GID
              value: "20"
            image: leader:latest
            name: leader
            ports:
            - containerPort: 8080
              name: port-8080
              protocol: TCP
            readinessProbe:
              tcpSocket:
                port: 8080
            resources: {}
            securityContext:
              runAsGroup: 20
              runAsUser: 501
          priorityClassName: very-high
          schedulerName: runai-scheduler
          securityContext:
            fsGroup: 20
      restartPolicy: RecreateGroupOnPodRestart
      size: 1
      workerTemplate:
        metadata:
          labels:
            app: leaderworkerset
            createdBy: LeaderWorkerSet
            project: team-a
            release: test-lws
            workloadKind: DistributedInference
            workloadName: test-lws
        spec:
          containers:
          - args:
            - --project=team-a
            - --job=test-lws
            - --uid=501
            - --gid=20
            command:
            - serve.sh
            env:
            - name: RUNAI_PROJECT
              value: team-a
            - name: RUNAI_JOB_NAME
              value: test-lws
            - name: LDAP_UID
              value: "501"
            - name: LDAP_GID
              value: "20"
            image: leader:latest
            name: worker
            resources: {}
            securityContext:
              runAsGroup: 20
              runAsUser: 501
          priorityClassName: very-high
          schedulerName: runai-scheduler
          securityContext:
            fsGroup: 20
    replicas: 1
    rolloutStrategy:
      type: RollingUpdate
    startupPolicy: LeaderCreated
  status: {}
