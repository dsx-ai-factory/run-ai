Config:
  mnnvl: None
  networking:
  - services:
    - spec:
        name: dinfw-test-lws-sp-0
        ports:
        - name: serving-port
          port: 80
          protocol: TCP
          targetPort: 8080
        selector:
          leaderworkerset.sigs.k8s.io/name: test-lws-1234
          leaderworkerset.sigs.k8s.io/worker-index: "0"
        type: ClusterIP
LeaderWorkerSet:
  apiVersion: leaderworkerset.x-k8s.io/v1
  kind: LeaderWorkerSet
  metadata:
    annotations:
      run.ai/submitted-by: tester
    labels:
      app: leaderworkerset
      createdBy: LeaderWorkerSet
      project: team-a
      release: test-lws
      run.ai/control-plane-managed: "true"
      run.ai/converted-from-native: "true"
      workloadKind: DistributedInference
      workloadName: test-lws
    name: test-lws-1234
    namespace: runai-team-a
  spec:
    leaderWorkerTemplate:
      leaderTemplate:
        metadata:
          annotations:
            example.com/role: leader
          labels:
            app: leaderworkerset
            createdBy: LeaderWorkerSet
            kai.scheduler/preemptibility: preemptible
            project: team-a
            release: test-lws
            role-label: leader
            workloadKind: DistributedInference
            workloadName: test-lws
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: run.ai/node-pool
                    operator: In
                    values:
                    - gpu-pool-a
          containers:
          - env:
            - name: RUNAI_PROJECT
              value: team-a
            - name: RUNAI_JOB_NAME
              value: test-lws
            - name: ROLE
              value: leader
            image: leader:latest
            name: leader
            ports:
            - containerPort: 8080
              name: port-8080
              protocol: TCP
            readinessProbe:
              tcpSocket:
                port: 8080
            resources:
              requests:
                cpu: "1"
                memory: 1Gi
            securityContext:
              runAsNonRoot: true
          dnsPolicy: ClusterFirstWithHostNet
          hostNetwork: true
          nodeSelector:
            run.ai/node-type: gpu
          priorityClassName: high
          schedulerName: runai-scheduler
      restartPolicy: RecreateGroupOnPodRestart
      size: 2
      workerTemplate:
        metadata:
          labels:
            app: leaderworkerset
            createdBy: LeaderWorkerSet
            kai.scheduler/preemptibility: preemptible
            project: team-a
            release: test-lws
            workloadKind: DistributedInference
            workloadName: test-lws
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: run.ai/node-pool
                    operator: In
                    values:
                    - gpu-pool-a
          containers:
          - env:
            - name: RUNAI_PROJECT
              value: team-a
            - name: RUNAI_JOB_NAME
              value: test-lws
            - name: ROLE
              value: worker
            image: worker:latest
            name: worker
            resources:
              requests:
                cpu: "2"
                memory: 2Gi
          nodeSelector:
            run.ai/node-type: cpu
          priorityClassName: high
          schedulerName: runai-scheduler
    replicas: 1
    rolloutStrategy:
      type: RollingUpdate
    startupPolicy: LeaderCreated
  status: {}
