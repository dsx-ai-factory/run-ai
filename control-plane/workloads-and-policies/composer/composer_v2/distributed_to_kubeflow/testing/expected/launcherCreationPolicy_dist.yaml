DistributedTarget:
  Config: {}
  Framework: MPI
  JaxJob: null
  MasterSpec: null
  MpiJob:
    apiVersion: kubeflow.org/v2beta1
    kind: MPIJob
    metadata:
      annotations:
        run.ai/submitted-by: tester
      labels:
        app: mpijob
        createdBy: MPIJob
        project: test
        release: launcherCreationPolicy
        run.ai/control-plane-managed: "true"
        run.ai/converted-from-native: "true"
        workloadKind: Distributed
        workloadName: launcherCreationPolicy
      name: launcherCreationPolicy
      namespace: runai-test
    spec:
      launcherCreationPolicy: AtStartup
      mpiReplicaSpecs:
        Launcher:
          replicas: 1
          template:
            metadata:
              annotations:
                user: tester
              labels:
                app: mpijob
                createdBy: MPIJob
                project: test
                release: launcherCreationPolicy
                workloadKind: Distributed
                workloadName: launcherCreationPolicy
            spec:
              containers:
              - args:
                - -x
                - master-script.py
                command:
                - run-master
                env:
                - name: RUNAI_PROJECT
                  value: test
                - name: RUNAI_JOB_NAME
                  value: launcherCreationPolicy
                - name: RUNAI_MPI_NUM_WORKERS
                  value: "1"
                image: redhat
                name: mpi
                resources: {}
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
              priorityClassName: low
              schedulerName: runai-scheduler
        Worker:
          replicas: 1
          template:
            metadata:
              annotations:
                gpu-fraction: "0.5"
                gpu-fraction-num-devices: "1"
                runai-nodepools: my-node-pool-a my-node-pool-b
                user: tester
              labels:
                app: mpijob
                createdBy: MPIJob
                project: test
                release: launcherCreationPolicy
                workloadKind: Distributed
                workloadName: launcherCreationPolicy
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: my-node-pool-a-key
                        operator: In
                        values:
                        - my-node-pool-a-value
                    - matchExpressions:
                      - key: my-node-pool-b-key
                        operator: In
                        values:
                        - my-node-pool-b-value
              containers:
              - args:
                - -x
                - my-script.py
                command:
                - python-3.8
                env:
                - name: RUNAI_PROJECT
                  value: test
                - name: RUNAI_JOB_NAME
                  value: launcherCreationPolicy
                - name: HOME
                  value: /home/my-folder
                - name: RUNAI_MPI_NUM_WORKERS
                  value: "1"
                image: ubuntu
                name: mpi
                resources: {}
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                workingDir: /home/my-folder
              priorityClassName: low
              schedulerName: runai-scheduler
      runPolicy:
        backoffLimit: 0
        cleanPodPolicy: None
      slotsPerWorker: 1
    status: {}
  ObjectMeta: null
  PyTorchJob: null
  RunPolicy: null
  TFJob: null
  TypeMeta: null
  WorkerSpec: null
  XgboostJob: null
Notification:
  clusterId: cluster-123-456
  createdAt: "0001-01-01T00:00:00Z"
  departmentId: department-456-123
  distributedFramework: MPIJob
  environments:
  - connections: []
    id: ""
    name: ""
    replicaType: null
  fullySaasWorkload: true
  group: run.ai
  id: 'id-launcherCreationPolicy/master_no_gpu, Framework: MPI'
  images:
  - ubuntu
  name: 'launcherCreationPolicy/master_no_gpu, Framework: MPI'
  projectId: project-654-321
  requestedNodePools:
  - my-node-pool-a
  - my-node-pool-b
  requestedPods:
    number: 1
  submittedBy: tester
  type: Distributed
  version: v2alpha1
