DistributedTarget:
  Config: {}
  Framework: PyTorch
  JaxJob: null
  MasterSpec: null
  MpiJob: null
  ObjectMeta: null
  PyTorchJob:
    apiVersion: kubeflow.org/v1
    kind: PyTorchJob
    metadata:
      annotations:
        run.ai/submitted-by: tester
      labels:
        app: pytorchjob
        createdBy: PyTorchJob
        project: test
        release: git
        run.ai/control-plane-managed: "true"
        run.ai/converted-from-native: "true"
        workloadKind: Distributed
        workloadName: git
      name: git
      namespace: runai-test
    spec:
      pytorchReplicaSpecs:
        Master:
          replicas: 1
          template:
            metadata:
              annotations:
                user: tester
              labels:
                app: pytorchjob
                createdBy: PyTorchJob
                project: test
                release: git
                workloadKind: Distributed
                workloadName: git
            spec:
              containers:
              - env:
                - name: RUNAI_PROJECT
                  value: test
                - name: RUNAI_JOB_NAME
                  value: git
                image: ubuntu
                name: pytorch
                resources: {}
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
                volumeMounts:
                - mountPath: /container/my-repository
                  name: code-sync-0
                - mountPath: /mount/git-defaults
                  name: code-sync-1
              initContainers:
              - env:
                - name: GITSYNC_REPO
                  value: http://runai.public.github.com
                - name: GITSYNC_REF
                  value: "12345678"
                - name: GITSYNC_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: User
                      name: my-password-secret
                - name: GITSYNC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: Password
                      name: my-password-secret
                - name: GITSYNC_ROOT
                  value: /code-git-master
                - name: GITSYNC_ONE_TIME
                  value: "true"
                - name: HOME
                  value: /tmp
                image: registry.k8s.io/git-sync/git-sync:v4.7.0
                name: git-sync-git-master
                resources: {}
                volumeMounts:
                - mountPath: /code-git-master
                  name: code-sync-0
              - env:
                - name: GITSYNC_REPO
                  value: https://runai.public.github.com
                - name: GITSYNC_ROOT
                  value: /code-git-master-1
                - name: GITSYNC_ONE_TIME
                  value: "true"
                - name: HOME
                  value: /tmp
                image: registry.k8s.io/git-sync/git-sync:v4.7.0
                name: git-sync-git-master-1
                resources: {}
                volumeMounts:
                - mountPath: /code-git-master-1
                  name: code-sync-1
              priorityClassName: low
              schedulerName: runai-scheduler
              volumes:
              - emptyDir: {}
                name: code-sync-0
              - emptyDir: {}
                name: code-sync-1
        Worker:
          replicas: 1
          template:
            metadata:
              annotations:
                user: tester
              labels:
                app: pytorchjob
                createdBy: PyTorchJob
                project: test
                release: git
                workloadKind: Distributed
                workloadName: git
            spec:
              containers:
              - env:
                - name: RUNAI_PROJECT
                  value: test
                - name: RUNAI_JOB_NAME
                  value: git
                image: ubuntu
                name: pytorch
                resources: {}
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
                volumeMounts:
                - mountPath: /container/my-repository
                  name: code-sync-0
                - mountPath: /mount/git-defaults
                  name: code-sync-1
              initContainers:
              - env:
                - name: GITSYNC_REPO
                  value: http://runai.public.github.com
                - name: GITSYNC_REF
                  value: "12345678"
                - name: GITSYNC_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: User
                      name: my-password-secret
                - name: GITSYNC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: Password
                      name: my-password-secret
                - name: GITSYNC_ROOT
                  value: /code-git-worker
                - name: GITSYNC_ONE_TIME
                  value: "true"
                - name: HOME
                  value: /tmp
                image: registry.k8s.io/git-sync/git-sync:v4.7.0
                name: git-sync-git-worker
                resources: {}
                volumeMounts:
                - mountPath: /code-git-worker
                  name: code-sync-0
              - env:
                - name: GITSYNC_REPO
                  value: https://runai.public.github.com
                - name: GITSYNC_ROOT
                  value: /code-git-worker-1
                - name: GITSYNC_ONE_TIME
                  value: "true"
                - name: HOME
                  value: /tmp
                image: registry.k8s.io/git-sync/git-sync:v4.7.0
                name: git-sync-git-worker-1
                resources: {}
                volumeMounts:
                - mountPath: /code-git-worker-1
                  name: code-sync-1
              priorityClassName: low
              schedulerName: runai-scheduler
              volumes:
              - emptyDir: {}
                name: code-sync-0
              - emptyDir: {}
                name: code-sync-1
      runPolicy:
        backoffLimit: 0
        cleanPodPolicy: None
