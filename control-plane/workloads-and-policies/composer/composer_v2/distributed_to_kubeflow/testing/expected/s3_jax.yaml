DistributedTarget:
  Config: {}
  Framework: JAX
  JaxJob:
    apiVersion: kubeflow.org/v1
    kind: JAXJob
    metadata:
      annotations:
        run.ai/submitted-by: tester
      labels:
        app: jaxjob
        createdBy: JAXJob
        project: test
        release: s3
        run.ai/control-plane-managed: "true"
        run.ai/converted-from-native: "true"
        workloadKind: Distributed
        workloadName: s3
      name: s3
      namespace: runai-test
    spec:
      jaxReplicaSpecs:
        Worker:
          replicas: 1
          template:
            metadata:
              annotations:
                user: tester
              labels:
                app: jaxjob
                createdBy: JAXJob
                project: test
                release: s3
                workloadKind: Distributed
                workloadName: s3
            spec:
              containers:
              - env:
                - name: RUNAI_PROJECT
                  value: test
                - name: RUNAI_JOB_NAME
                  value: s3
                image: ubuntu
                name: jax
                resources: {}
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
                volumeMounts:
                - mountPath: /container/my-bucket
                  mountPropagation: HostToContainer
                  name: s3-0
                - mountPath: /container/everyones
                  mountPropagation: HostToContainer
                  name: s3-1
                - mountPath: /container/my-very-secret-bucket
                  mountPropagation: HostToContainer
                  name: s3-2
              initContainers:
              - command:
                - goofys
                - -f
                - --dir-mode
                - "0777"
                - --file-mode
                - "0777"
                - -o
                - allow_other
                - --debug_s3
                - --endpoint
                - https://s3.amazonaws.com
                - private-bucket
                - /container/my-bucket
                env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      key: AccessKeyId
                      name: my-access-key-secret
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      key: SecretKey
                      name: my-access-key-secret
                image: nvcr.io/nvidia/runai/goofys:2.26.30
                imagePullPolicy: IfNotPresent
                name: s3-fs-0
                resources: {}
                restartPolicy: Always
                securityContext:
                  privileged: true
                volumeMounts:
                - mountPath: /container/my-bucket
                  mountPropagation: Bidirectional
                  name: s3-0
              - command:
                - goofys
                - -f
                - --dir-mode
                - "0777"
                - --file-mode
                - "0777"
                - -o
                - allow_other
                - --debug_s3
                - --endpoint
                - https://uswest.s3.amazonaws
                - public-bucket
                - /container/everyones
                image: nvcr.io/nvidia/runai/goofys:2.26.30
                imagePullPolicy: IfNotPresent
                name: s3-fs-1
                resources: {}
                restartPolicy: Always
                securityContext:
                  privileged: true
                volumeMounts:
                - mountPath: /container/everyones
                  mountPropagation: Bidirectional
                  name: s3-1
              - command:
                - goofys
                - -f
                - --dir-mode
                - "0777"
                - --file-mode
                - "0777"
                - -o
                - allow_other
                - --debug_s3
                - --endpoint
                - https://s3.amazonaws.com
                - private-bucket-with-token
                - /container/my-very-secret-bucket
                env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      key: AccessKeyId
                      name: my-access-key-secret
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      key: SecretKey
                      name: my-access-key-secret
                - name: AWS_SESSION_TOKEN
                  value: my-session-token
                image: nvcr.io/nvidia/runai/goofys:2.26.30
                imagePullPolicy: IfNotPresent
                name: s3-fs-2
                resources: {}
                restartPolicy: Always
                securityContext:
                  privileged: true
                volumeMounts:
                - mountPath: /container/my-very-secret-bucket
                  mountPropagation: Bidirectional
                  name: s3-2
              priorityClassName: low
              schedulerName: runai-scheduler
              volumes:
              - emptyDir: {}
                name: s3-0
              - emptyDir: {}
                name: s3-1
              - emptyDir: {}
                name: s3-2
      runPolicy:
        backoffLimit: 0
        cleanPodPolicy: None
    status: {}
  MasterSpec: null
  MpiJob: null
  ObjectMeta: null
  PyTorchJob: null
  RunPolicy: null
  TFJob: null
  TypeMeta: null
  WorkerSpec: null
  XgboostJob: null
Notification:
  clusterId: cluster-123-456
  createdAt: "0001-01-01T00:00:00Z"
  departmentId: department-456-123
  distributedFramework: JAXJob
  environments:
  - connections: []
    id: ""
    name: ""
    replicaType: null
  fullySaasWorkload: true
  group: run.ai
  id: 'id-s3/, Framework: JAX'
  images:
  - ubuntu
  name: 's3/, Framework: JAX'
  projectId: project-654-321
  requestedPods:
    number: 1
  submittedBy: tester
  type: Distributed
  version: v2alpha1
