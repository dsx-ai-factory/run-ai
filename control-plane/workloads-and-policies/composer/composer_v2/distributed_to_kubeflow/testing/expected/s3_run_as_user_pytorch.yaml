                    secretKeyRef:
                      key: AccessKeyId
                      name: my-access-key-secret
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      key: SecretKey
                      name: my-access-key-secret
                - name: AWS_SESSION_TOKEN
