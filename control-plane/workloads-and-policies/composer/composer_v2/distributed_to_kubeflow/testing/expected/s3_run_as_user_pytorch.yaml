                imagePullPolicy: IfNotPresent
                name: s3-fs-0
                resources: {}
                restartPolicy: Always
                securityContext:
                  privileged: true
                volumeMounts:
                - mountPath: /container/my-very-secret-bucket
                  mountPropagation: Bidirectional
                  name: s3-0
              priorityClassName: low
              schedulerName: runai-scheduler
              securityContext:
                fsGroup: 2000
              volumes:
              - emptyDir: {}
                name: s3-0
