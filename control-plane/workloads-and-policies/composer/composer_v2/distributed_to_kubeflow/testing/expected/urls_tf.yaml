  TFJob:
    apiVersion: kubeflow.org/v1
    kind: TFJob
    metadata:
      annotations:
        run.ai/submitted-by: tester
      labels:
        app: tfjob
        createdBy: TFJob
        project: test
        release: urls
        run.ai/control-plane-managed: "true"
        run.ai/converted-from-native: "true"
        workloadKind: Distributed
        workloadName: urls
      name: urls
      namespace: runai-test
    spec:
      runPolicy:
        backoffLimit: 0
        cleanPodPolicy: Running
      tfReplicaSpecs:
        Chief:
          replicas: 1
          template:
            metadata:
              annotations:
                user: tester
              labels:
                app: tfjob
                createdBy: TFJob
                project: test
                release: urls
                workloadKind: Distributed
                workloadName: urls
            spec:
              containers:
              - env:
                - name: RUNAI_PROJECT
                  value: test
                - name: RUNAI_JOB_NAME
                  value: urls
                image: ubuntu
                name: tensorflow
                ports:
                - containerPort: 8080
                  name: port-8080
                  protocol: TCP
                - containerPort: 8081
                  name: port-8081
                  protocol: TCP
                - containerPort: 8082
                  name: port-8082
                  protocol: TCP
                - containerPort: 8083
                  name: port-8083
                  protocol: TCP
                - containerPort: 8084
                  name: port-8084
                  protocol: TCP
                resources: {}
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
              initContainers:
              - command:
                - sh
                - -c
                - echo -e "dXNlci1hCnVzZXItYg==" | base64 -d > /etc/runai/auth/users/dXJsLW1hc3Rlci0y
                  && echo -e "dXNlci1hCnVzZXItYg==" | base64 -d > /etc/runai/auth/users/dXJsLW1hc3Rlci0z
