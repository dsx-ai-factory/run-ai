                imagePullPolicy: IfNotPresent
                name: runai-auth-user-loader
                resources:
                  limits:
                    cpu: 100m
                    memory: 100Mi
                  requests:
                    cpu: 50m
                    memory: 50Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  runAsUser: 65534
                volumeMounts:
                - mountPath: /etc/runai/auth/users
                  name: runai-auth
              - args:
                - --provider=keycloak-oidc
                - --upstream=http://localhost:8080
                - --redirect-url=http://google.com/runai/oauth2/callback
                - --oidc-issuer-url=/auth/realms/runai
                - --scope=openid
                - --http-address=0.0.0.0:4180
                - --proxy-prefix=/runai/oauth2
                - --skip-provider-button=true
                - --whitelist-domain=google.com
                - --cookie-domain=google.com
                - --cookie-httponly=true
                - --cookie-secure=true
                - --code-challenge-method=S256
                - --cookie-refresh=10m
                - --cookie-samesite=lax
                - --skip-jwt-bearer-tokens=true
                - --extra-jwt-issuers=/auth/realms/runai=runai
                - --custom-templates-dir=/usr/share/oauth2-proxy
                - --pass-authorization-header=false
                - --cookie-name=urls-url-master-auth-proxy
                - --email-domain=*
                env:
                - name: OAUTH2_PROXY_COOKIE_PATH
                  value: /runai
                envFrom:
                - secretRef: {}
                image: test.registry/oauth2-proxy:test
                imagePullPolicy: IfNotPresent
                name: runai-oauth2-proxy-0
                ports:
                - containerPort: 4180
                  name: port-4180
                  protocol: TCP
                resources: {}
                restartPolicy: Always
                securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                volumeMounts:
                - mountPath: /etc/runai/auth/users
                  name: runai-auth
              - args:
