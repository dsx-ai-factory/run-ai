      - spec:
          name: job-ports_and_urls-np
          ports:
          - name: port-8081
            port: 8081
            protocol: TCP
            targetPort: 8081
          selector:
            release: ports_and_urls
          type: NodePort
  Job:
    apiVersion: batch/v1
    kind: Job
    metadata:
      annotations:
        run.ai/submitted-by: tester
      labels:
        app: job
        createdBy: Job
        project: test
        release: ports_and_urls
        run.ai/control-plane-managed: "true"
        run.ai/converted-from-native: "true"
        workloadKind: Workspace
        workloadName: ports_and_urls
      name: ports_and_urls
      namespace: runai-test
    spec:
      backoffLimit: 0
      template:
        metadata:
          annotations:
            user: tester
          labels:
            app: job
            createdBy: Job
            project: test
            release: ports_and_urls
            workloadKind: Workspace
            workloadName: ports_and_urls
        spec:
          containers:
          - env:
            - name: RUNAI_PROJECT
              value: test
            - name: RUNAI_JOB_NAME
              value: ports_and_urls
            image: ubuntu
            name: ports_and_urls
            ports:
            - containerPort: 8082
              name: port-8082
              protocol: TCP
            - containerPort: 8081
              name: port-8081
              protocol: TCP
            resources: {}
          initContainers:
          - args:
            - --provider=keycloak-oidc
            - --upstream=http://localhost:8082
            - --redirect-url=https://test.run.ai/test/ports_and_urls/oauth2/callback
            - --oidc-issuer-url=/auth/realms/runai
            - --scope=openid
            - --http-address=0.0.0.0:4181
            - --proxy-prefix=/test/ports_and_urls/oauth2
            - --skip-provider-button=true
            - --whitelist-domain=test.run.ai
            - --cookie-domain=test.run.ai
            - --cookie-httponly=true
            - --cookie-secure=true
            - --code-challenge-method=S256
            - --cookie-refresh=10m
            - --cookie-samesite=lax
            - --skip-jwt-bearer-tokens=true
            - --extra-jwt-issuers=/auth/realms/runai=runai
            - --custom-templates-dir=/usr/share/oauth2-proxy
            - --pass-authorization-header=false
            - --cookie-name=ports_and_urls-url-1-auth-proxy
            - --email-domain=*
            env:
            - name: OAUTH2_PROXY_COOKIE_PATH
              value: /test/ports_and_urls
            envFrom:
            - secretRef: {}
            image: test.registry/oauth2-proxy:test
            imagePullPolicy: IfNotPresent
            name: runai-oauth2-proxy-0
            ports:
            - containerPort: 4181
              name: port-4181
              protocol: TCP
            resources: {}
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
            volumeMounts:
            - mountPath: /etc/runai/auth/users
              name: runai-auth
          - args:
            - --provider=keycloak-oidc
            - --upstream=http://localhost:8081
            - --redirect-url=https://test.run.ai/test/ports_and_urls/url-my-tool-name/oauth2/callback
            - --oidc-issuer-url=/auth/realms/runai
            - --scope=openid
            - --http-address=0.0.0.0:4180
            - --proxy-prefix=/test/ports_and_urls/url-my-tool-name/oauth2
            - --skip-provider-button=true
            - --whitelist-domain=test.run.ai
            - --cookie-domain=test.run.ai
            - --cookie-httponly=true
            - --cookie-secure=true
            - --code-challenge-method=S256
            - --cookie-refresh=10m
            - --cookie-samesite=lax
            - --skip-jwt-bearer-tokens=true
            - --extra-jwt-issuers=/auth/realms/runai=runai
            - --custom-templates-dir=/usr/share/oauth2-proxy
            - --pass-authorization-header=false
            - --cookie-name=ports_and_urls-url-my-tool-name-auth-proxy
            - --email-domain=*
            env:
            - name: OAUTH2_PROXY_COOKIE_PATH
              value: /test/ports_and_urls/url-my-tool-name
            envFrom:
            - secretRef: {}
            image: test.registry/oauth2-proxy:test
            imagePullPolicy: IfNotPresent
            name: runai-oauth2-proxy-1
            ports:
            - containerPort: 4180
              name: port-4180
              protocol: TCP
            resources: {}
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
            volumeMounts:
            - mountPath: /etc/runai/auth/users
              name: runai-auth
          priorityClassName: high
          restartPolicy: Never
          schedulerName: runai-scheduler
          volumes:
          - emptyDir: {}
            name: runai-auth
    status: {}
