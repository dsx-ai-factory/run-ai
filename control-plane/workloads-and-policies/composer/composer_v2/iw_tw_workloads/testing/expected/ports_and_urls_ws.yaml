BatchJobTarget:
  Config:
    networking:
    - externalAccess:
        ingress:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: job-ports_and_urls-url-1
          spec:
            rules:
            - host: test.run.ai
              http:
                paths:
                - backend:
                    service:
                      name: job-ports_and_urls-url-1
                      port:
                        number: 80
                  path: /test/ports_and_urls
                  pathType: Prefix
      services:
      - spec:
          name: job-ports_and_urls-url-1
          ports:
          - name: port-4181
