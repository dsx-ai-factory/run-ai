            - host: test.run.ai
              http:
                paths:
                - backend:
                    service:
                      name: job-ports_and_urls-url-my-tool-name
                      port:
                        number: 80
                  path: /test/ports_and_urls/url-my-tool-name
                  pathType: Prefix
      services:
      - spec:
          name: job-ports_and_urls-url-my-tool-name
          ports:
          - name: port-4180
            port: 80
            protocol: TCP
            targetPort: 4180
          selector:
            release: ports_and_urls
          type: ClusterIP
