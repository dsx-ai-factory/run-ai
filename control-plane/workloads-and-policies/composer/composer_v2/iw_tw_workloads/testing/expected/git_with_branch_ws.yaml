      template:
        metadata:
          annotations:
            user: tester
          labels:
            app: job
            createdBy: Job
            project: test
            release: git_with_branch
            workloadKind: Workspace
            workloadName: git_with_branch
        spec:
          containers:
          - env:
            - name: RUNAI_PROJECT
              value: test
            - name: RUNAI_JOB_NAME
              value: git_with_branch
            image: ubuntu
            name: git_with_branch
            resources: {}
            volumeMounts:
            - mountPath: /container/my-repository
              name: code-sync-0
            - mountPath: /mount/git-defaults
              name: code-sync-1
          initContainers:
          - env:
            - name: GITSYNC_REPO
              value: http://runai.public.github.com
            - name: GITSYNC_REF
              value: master
            - name: GITSYNC_USERNAME
              valueFrom:
                secretKeyRef:
                  key: User
                  name: my-password-secret
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: Password
                  name: my-password-secret
            - name: GITSYNC_ROOT
              value: /code-git
            - name: GITSYNC_ONE_TIME
              value: "true"
            - name: HOME
              value: /tmp
            image: registry.k8s.io/git-sync/git-sync:v4.7.0
            name: git-sync-git
            resources: {}
            volumeMounts:
            - mountPath: /code-git
              name: code-sync-0
          - env:
            - name: GITSYNC_REPO
              value: https://runai.public.github.com
            - name: GITSYNC_ROOT
              value: /code-git-1
            - name: GITSYNC_ONE_TIME
              value: "true"
            - name: HOME
              value: /tmp
            image: registry.k8s.io/git-sync/git-sync:v4.7.0
            name: git-sync-git-1
            resources: {}
            volumeMounts:
            - mountPath: /code-git-1
              name: code-sync-1
          priorityClassName: high
          restartPolicy: Never
          schedulerName: runai-scheduler
          volumes:
          - emptyDir: {}
            name: code-sync-0
          - emptyDir: {}
            name: code-sync-1
    status: {}
