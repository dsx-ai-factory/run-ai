BatchJobTarget:
  Config: {}
  Job:
    apiVersion: batch/v1
    kind: Job
    metadata:
      annotations:
        run.ai/submitted-by: tester
      labels:
        app: job
        createdBy: Job
        project: test
        release: git_with_branch
        run.ai/control-plane-managed: "true"
