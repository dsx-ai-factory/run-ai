image: ubuntu
command: python-3.8
args: "-x my-script.py"
environmentVariables:
  - name: HOME
    value: "/home/my-folder"
workingDir: /home/my-folder

compute:
  gpuDevicesRequest: 1
  gpuRequestType: portion
  gpuPortionRequest: 0.5

backoffLimit: 12

security:
  uidGidSource: fromTheImage
  runAsNonRoot: true








