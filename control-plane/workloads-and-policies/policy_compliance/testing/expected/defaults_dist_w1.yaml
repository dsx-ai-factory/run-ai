master:
  storage:
    hostPath:
    - mountPath: /mount/path/master/hp1/from-workload
      name: hp1
      path: /path/master/hp1/from-workload
    - mountPath: /mount/path/master/hp2
      name: hp2
      path: /path/master/hp2
    - mountPath: /mount/path/master/noname
      name: pol-2
      path: /path/master/noname
    - mountPath: /mount/path/master/noname/from-workload
      path: /path/master/noname/from-workload
    s3:
    - bucket: /default/master/bucket
      name: s3a
      path: /path/master/s3a/from-workload
      url: https://s3a.master.from-workload.master.amazonaws.com
    - bucket: /default/master/bucket
      name: s3b
      path: /path/master/s3b
      url: https://s3b.master.amazonaws.com
    - bucket: /default/master/bucket
      name: pol-2
      path: /path/master/noname
      url: https://noname.master.amazonaws.com
    - bucket: /default/master/bucket
      path: /path/master/noname/from-workload
      url: https://noname.master.from-workload.master.amazonaws.com
worker:
  image: worker-image
  storage:
    hostPath:
    - mountPath: /mount/path/worker/hp1/from-workload
      name: hp1
      path: /path/worker/hp1/from-workload
    - mountPath: /mount/path/worker/hp2
      name: hp2
      path: /path/worker/hp2
    - mountPath: /mount/path/worker/noname
      name: pol-2
      path: /path/worker/noname
    - mountPath: /mount/path/worker/noname/from-workload
      path: /path/worker/noname/from-workload
    s3:
    - bucket: /default/worker/bucket
      name: s3a
      path: /path/worker/s3a/from-workload
      url: https://s3a.worker.from-workload.amazonaws.com
    - bucket: /default/worker/bucket
      name: s3b
      path: /path/worker/s3b
      url: https://s3b.worker.amazonaws.com
    - bucket: /default/worker/bucket
      name: pol-2
      path: /path/worker/noname
      url: https://noname.worker.amazonaws.com
    - bucket: /default/worker/bucket
      path: /path/worker/noname/from-workload
      url: https://noname.worker.from-workload.amazonaws.com
