components:
  parameters:
    OperatingSystem:
      description: The operating system name.
      explode: false
      in: path
      name: operatingSystem
      required: true
      schema:
        enum:
        - linux
        - windows
        - darwin
        example: linux
        maxLength: 7
        minLength: 4
        type: string
      style: simple
    Architecture:
      description: The architecture type.
      explode: false
      in: path
      name: architecture
      required: true
      schema:
        example: arm64
        maxLength: 10
        minLength: 4
        type: string
      style: simple
    DocumentName:
      description: The manual document name.
      explode: false
      in: path
      name: documentName
      required: true
      schema:
        example: runai.md
        maxLength: 255
        minLength: 4
        pattern: "^[A-Za-z0-9_]+\\.md$"
        type: string
      style: simple
  responses:
    "400BadRequest":
      content:
        application/json:
          example:
            code: 400
            message: Required parameter is missing
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad request.
    "401Unauthorized":
      content:
        application/json:
          example:
            code: 401
            message: Issuer is not familiar.
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized
    "404NotFound":
      content:
        application/json:
          example:
            code: 404
            message: Resource id not found.
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource was not found
    "500InternalServerError":
      content:
        application/json:
          example:
            code: 500
            message: Something went wrong.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "503ServiceUnavailable":
      content:
        application/json:
          example:
            code: 503
            message: Please try again in few minutes.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "204NoContent":
      description: No Content.
    "400BadSubmissionRequest":
      content:
        application/json:
          example:
            code: 400
            message: The workload request does not comply with the policy set by the
              administrator
          schema:
            $ref: '#/components/schemas/SubmissionError'
      description: Bad submission request.
    "403Forbidden":
      content:
        application/json:
          example:
            code: 403
            message: You do not have sufficient permissions.
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden
    "406NotAcceptable":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Not acceptable request
    "409Conflict":
      content:
        application/json:
          example:
            code: 409
            message: Resource with this name already exists
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource already exists
    "412PreconditionFailed":
      content:
        application/json:
          example:
            code: 412
            message: Precondition failed
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource was not found.
    "413RequestEntityTooLarge":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Request entity too large
    "415UnsupportedMediaType":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unsupported media type
    "501NotImplemented":
      content:
        application/json:
          example:
            code: 501
            message: Not implemented
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
  schemas:
    Error:
      example:
        code: 400
        message: Bad request - Resource should have a name
      properties:
        code:
          maximum: 599
          minimum: 100
          type: integer
        message:
          type: string
        details:
          type: string
      required:
      - code
      - message
    Command:
      example:
        command: runai version
      properties:
        command:
          description: The commands that can be used to install the Run:AI CLI.
          example: runai version
          maxLength: 200
          minLength: 1
          type: string
      required:
      - command
      type: object
    Version:
      example:
        needUpgrade: false
        cpVersion: 2.50.0
        sdkVersion: 2.0.0
      properties:
        sdkVersion:
          description: The version of the CLI SDK
          example: 2.0.0
          maxLength: 100
          minLength: 1
          type: string
        cpVersion:
          description: The version of the CP
          example: 2.50.0
          maxLength: 100
          minLength: 1
          type: string
        needUpgrade:
          default: false
          description: Whether the CLI needs to be upgraded
          example: false
          type: boolean
      required:
      - cpVersion
      - needUpgrade
      - sdkVersion
      type: object
    ComplianceIssues:
      nullable: true
      properties:
        complianceIssues:
          items:
            $ref: '#/components/schemas/ComplianceIssues_complianceIssues_inner'
          type: array
      type: object
    SubmissionError:
      allOf:
      - $ref: '#/components/schemas/Error'
      - $ref: '#/components/schemas/ComplianceIssues'
    ComplianceIssues_complianceIssues_inner:
      properties:
        field:
          example: compute.gpuDevicesRequest
          type: string
        details:
          example: value must be no less than 3
          type: string
      required:
      - details
      - field
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Bearer authentication
      scheme: bearer
      type: http
