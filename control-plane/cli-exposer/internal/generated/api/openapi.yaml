  /api/v1/cli-exposer/dist/{operatingSystem}/{architecture}/runai:
    get:
      description: |
        This endpoint returns a binary file that run the Run:AI CLI.
      operationId: get_binary
      parameters:
      - description: The operating system name.
        explode: false
        in: path
        name: operatingSystem
        required: true
        schema:
          enum:
          - linux
          - windows
          - darwin
          example: linux
          maxLength: 7
          minLength: 4
          type: string
        style: simple
      - description: The architecture type.
        explode: false
        in: path
        name: architecture
        required: true
        schema:
          example: arm64
          maxLength: 10
          minLength: 4
          type: string
        style: simple
      responses:
        "200":
          content:
            application/octet-stream:
              example: !!binary |-
                Q29udGVudHMgb2YgdGhlIGZpbGU=
              schema:
                format: binary
                type: string
              x-default: true
          description: File download successful
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "404":
