get:
  summary: Download RunAI Researcher command line binary
  description: |
    This endpoint returns a binary file that run the Run:AI CLI.
  operationId: get_binary
  x-service: cli-exposer
  x-test-coverage:
    - cli-exposer/pkg/services/api_cli_service_test.go
  x-no-authorization: true
  tags:
    - Researcher Command Line Interface
  parameters:
    - $ref: '../parameters/OperatingSystem.yaml'
    - $ref: '../parameters/Architecture.yaml'
  responses:
    '200':
      description: File download successful
      content:
        application/octet-stream:
          x-default: true
          schema:
            type: string
            format: binary
          example: "Contents of the file"
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
