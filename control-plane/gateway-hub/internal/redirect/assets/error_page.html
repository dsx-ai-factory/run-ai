<html class="login-pf" lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Login to Run:AI</title>

    <!-- Hide body initially -->
    <style>
        body {
            visibility: hidden;
        }
        #loading-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            z-index: 9999;
        }
        .hidden {
            display: none;
        }
    </style>

    <link id="icon" rel="icon" href="/distribution-assets/cc/favicon.ico" />
    <link id="patternfly-v4" rel="stylesheet" />
    <link id="patternfly-v3" rel="stylesheet" />
    <link id="pficon" rel="stylesheet" />
    <link id="login-theme" rel="stylesheet" />
</head>
<body>
<div id="loading-screen">
    <p>Loading...</p>
</div>

<div class="login-pf-page">
    <div id="kc-header" class="login-pf-page-header">
        <div id="kc-header-wrapper" class=""><div class="kc-logo-text"><span>Run:AI</span></div></div>
    </div>
    <div class="card-pf">
        <header class="login-pf-header">
            <h1 id="kc-page-title">We are sorry...</h1>
        </header>
        <div id="kc-content">
            <div id="kc-content-wrapper">
                <div id="kc-error-message">
                    <p class="instruction">{{error_message}}</p>
                    <p><a href="/">Back to Sign In</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function fetchKeycloakResources() {
        const url = 'https://' + document.location.host + '/auth';
        try {
            const response = await fetch(url);
            const data = await response.text();

            const versionMatch = data.match(/\/auth\/resources\/([a-z0-9-]+)/);
            if (versionMatch) {
                const version = versionMatch[1];

                // Set all required styles
                document.getElementById('patternfly-v4').href = `/auth/resources/${version}/common/keycloak/vendor/patternfly-v4/patternfly.min.css`;
                document.getElementById('patternfly-v3').href = `/auth/resources/${version}/common/keycloak/vendor/patternfly-v3/css/patternfly.min.css`;
                document.getElementById('pficon').href = `/auth/resources/${version}/common/keycloak/lib/pficon/pficon.css`;
                document.getElementById('login-theme').href = `/auth/resources/${version}/login/runai-theme/css/nv-login.css`;

                // Reuse the centralized resolver so this standalone error page
                // stays aligned with Keycloak without theme-local artwork.
                const distributionAssetsScript = document.createElement('script');
                distributionAssetsScript.src = `/auth/resources/${version}/login/runai-theme/js/distribution-assets.js`;
                distributionAssetsScript.async = true;
                document.head.appendChild(distributionAssetsScript);

                // Wait until all stylesheets are fully loaded
                const stylesheets = document.querySelectorAll("link[rel=stylesheet]");
                const promises = Array.from(stylesheets).map(sheet => new Promise(resolve => {
                    sheet.onload = resolve;
                    sheet.onerror = resolve;
                }));

                await Promise.all(promises);

                // Hide loading screen & show content
                document.getElementById("loading-screen").classList.add("hidden");
                document.body.style.visibility = "visible";
            }
        } catch (error) {
            console.error('Error fetching Keycloak resources:', error);
            // Even if there's an error, show content
            document.getElementById("loading-screen").classList.add("hidden");
            document.body.style.visibility = "visible";
        }
    }

    fetchKeycloakResources();
</script>

</body>
</html>
