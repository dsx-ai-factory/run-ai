components:
  parameters:
    NotificationChannelName:
      description: Notification Channel name
      explode: false
      in: path
      name: name
      required: true
      schema:
        maxLength: 250
        minLength: 1
        type: string
      style: simple
    SubscriptionId:
      description: Subscription id
      explode: false
      in: path
      name: id
      required: true
      schema:
        maxLength: 100
        minLength: 1
        type: string
      style: simple
  responses:
    "401Unauthorized":
      content:
        application/json:
          example:
            code: 401
            message: Issuer is not familiar.
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized
    "403Forbidden":
      content:
        application/json:
          example:
            code: 403
            message: You do not have sufficient permissions.
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden
    "404NotFound":
      content:
        application/json:
          example:
            code: 404
            message: Resource id not found.
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource was not found
    "500InternalServerError":
      content:
        application/json:
          example:
            code: 500
            message: Something went wrong.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "501NotImplemented":
      content:
        application/json:
          example:
            code: 501
            message: Not implemented
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "503ServiceUnavailable":
      content:
        application/json:
          example:
            code: 503
            message: Please try again in few minutes.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "400BadRequest":
      content:
        application/json:
          example:
            code: 400
            message: Required parameter is missing
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad request.
    "409Conflict":
      content:
        application/json:
          example:
            code: 409
            message: Resource with this name already exists
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource already exists
  schemas:
    NotificationType:
      example:
        category: Workload status change
        type: Creating
        description: Workload and associated resources are being created in the cluster
      properties:
        category:
          type: string
        type:
          type: string
        description:
          type: string
      required:
      - category
      - description
      - type
      type: object
    NotificationTypes:
      items:
        $ref: '#/components/schemas/NotificationType'
      type: array
    Error:
      example:
        code: 400
        message: Bad request - Resource should have a name
      properties:
        code:
          maximum: 599
          minimum: 100
          type: integer
        message:
          type: string
        details:
          type: string
      required:
      - code
      - message
    NotificationStateStatus:
      example:
        enabled: true
      properties:
        enabled:
          nullable: true
          type: boolean
      type: object
    NotificationState:
      example:
        email:
          enabled: true
        slack:
          enabled: true
      properties:
        email:
          $ref: '#/components/schemas/NotificationStateStatus'
        slack:
          $ref: '#/components/schemas/NotificationStateStatus'
      type: object
    SlackDetails:
      properties:
        settings:
          $ref: '#/components/schemas/SlackDetails_settings'
      type: object
    DetailedNotificationState:
      example:
        email:
          enabled: true
        slack:
          enabled: true
          settings:
            workspaceName: <your_workspace_name>
            appCredentialsConfigured: true
      properties:
        email:
          $ref: '#/components/schemas/NotificationStateStatus'
        slack:
          $ref: '#/components/schemas/DetailedNotificationState_slack'
      type: object
    EmailAuthType:
      default: auth_login
      enum:
      - auth_login
      - auth_plain
      - auth_none
      - ""
      type: string
    EmailNotificationChannelConfig:
      example:
        username: email@gmail.com
        password: 123456
        smtpHost: smtp.gmail.com
        from: email@gmail.com
        subject: My subject
      properties:
        username:
          maxLength: 250
          type: string
        password:
          maxLength: 250
          type: string
        smtpHost:
          maxLength: 250
          type: string
        from:
          maxLength: 250
          type: string
        smtpPort:
          default: 587
          maximum: 65535
          type: integer
        authType:
          $ref: '#/components/schemas/EmailAuthType'
        smtpTlsEnabled:
          nullable: true
          type: boolean
        recipients:
          default: []
          items:
            type: string
          maxItems: 100
          minItems: 0
          type: array
        fromDisplayName:
          default: Run:ai
          maxLength: 250
          type: string
        directNotifications:
          nullable: true
          type: boolean
        useAttachments:
          nullable: true
          type: boolean
        subject:
          default: "Run:ai notification - {{ .category }} {{ .reason }}"
          maxLength: 250
          type: string
      type: object
    EmailChannelConfig:
      allOf:
      - $ref: '#/components/schemas/EmailNotificationChannelConfig'
      example:
        password: password
        smtpHost: smtpHost
        smtpTlsEnabled: true
        useAttachments: true
        recipients:
        - recipients
        - recipients
        - recipients
        - recipients
        - recipients
        subject: "Run:ai notification - {{ .category }} {{ .reason }}"
        smtpPort: 5248
