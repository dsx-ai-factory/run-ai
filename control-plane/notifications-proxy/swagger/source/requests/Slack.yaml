get:
  x-authorize:
    resource-type: notification-settings
    action: update
  x-service: notifications-proxy
  x-test-coverage:
    - src/test/suites/advancedSuite/notificationsService/notifications.test.ts
  tags:
    - Slack
  operationId: getSlack
  summary: Get slack notification channel
  description: Get slack notification channel
  responses:
    '200':
      description: Slack notification channel
      content:
        application/json:
          schema:
            $ref: '../schemas/SlackNotificationChannel.yaml'
    '400':
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    '401':
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    '403':
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    '404':
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    '409':
      $ref: '../../../../infra/openapi/docs/responses/409Conflict.yaml'
    '500':
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    '501':
      $ref: '../../../../infra/openapi/docs/responses/501NotImplemented.yaml'
    '503':
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'

patch:
  x-authorize:
    resource-type: notification-settings
    action: update
  x-service: notifications-proxy
  x-audit: true
  x-test-coverage:
    - src/test/suites/advancedSuite/notificationsService/notifications.test.ts
  tags:
    - Slack
  operationId: patchSlack
  summary: Patch slack notification channel
  description: Patch slack notification channel
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../parameters/SlackNotificationChannelPatchRequest.yaml'
  responses:
    '200':
      description: Slack notification channel patched
      content:
        application/json:
          schema:
            $ref: '../schemas/SlackNotificationChannel.yaml'