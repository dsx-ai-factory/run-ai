    resource-type: notification-settings
    action: update
  x-service: notifications-proxy
  x-audit: true
  x-test-coverage:
    - src/test/suites/playwright/serial/regression/phoenix/notifications/notifications.test.ts
  tags:
    - NotificationChannels
  operationId: createNotificationChannel
  summary: Create notification channel
  description: Create notification channel
  requestBody:
