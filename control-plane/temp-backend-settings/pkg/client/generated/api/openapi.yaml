openapi: 3.0.3
info:
  contact:
    email: support@run.ai
    name: Run.AI
    url: https://www.run.ai/
  description: |
    Temporary backend settings service that manages tenant-level feature flags
    and configuration settings. Migrated from the TypeScript backend's
    SettingController and InternalTenantController.
  title: Temp Backend Settings Service
  version: "1.0"
servers:
- url: http://localhost:8080
security:
- BearerAuth: []
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Executed successfully.
      summary: Health check
      tags:
      - Health
      x-no-authorization: true
      x-service: temp-backend-settings
    x-internal: true
  /v1/k8s/setting:
    get:
      deprecated: true
      description: "Retrieve all tenant settings. This endpoint is deprecated and\
        \ will be removed in a future release. Migrated settings are available under\
        \ [/api/docs#tag/Settings](/api/docs#tag/Settings)."
      operationId: getTenantSettings
      parameters:
      - description: "When true, excludes settings that have been migrated to external\
          \ services (e.g., Identity Manager)."
        explode: true
        in: query
        name: excludeMigrated
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: tenantId
        required: false
        schema:
          type: string
        style: form
        x-internal: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Setting'
                type: array
          description: The complete set of tenant settings.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get all tenant settings.
      tags:
      - Tenant
      x-no-authorization: true
      x-service: temp-backend-settings
      x-test-coverage:
      - src/test/suites/tenantSuite/tenantUserApi/tenantSystemApi.test.ts
    put:
      deprecated: true
      description: "Use to update tenant settings. This endpoint is deprecated and\
        \ will be removed in a future release. Migrated settings are available under\
        \ [/api/docs#tag/Settings](/api/docs#tag/Settings)."
      operationId: updateTenantSetting
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: false
        schema:
          type: string
        style: form
        x-internal: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSettingCreationRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingCreationResponse'
          description: The updated tenant setting.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                code: 404
                message: Resource id not found.
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource was not found
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Update a tenant setting.
      tags:
      - Tenant
      x-authorize:
        resource-type: settings
        action: update
      x-service: temp-backend-settings
      x-test-coverage:
      - src/test/suites/tenantSuite/tenantUserApi/tenantSystemApi.test.ts
    x-scope:
    - system
    - tenant
  /v1/k8s/setting/{settingKey}:
    get:
      deprecated: true
      description: "Retrieve a specific tenant setting by key. This endpoint is deprecated\
        \ and will be removed in a future release. Migrated settings are available\
        \ under [/api/docs#tag/Settings](/api/docs#tag/Settings)."
      operationId: getTenantSettingsByKey
      parameters:
      - description: The setting key to retrieve
        explode: false
        in: path
        name: settingKey
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: tenantId
        required: false
        schema:
          type: string
        style: form
        x-internal: true
      responses:
        "200":
          content:
            application/json:
              schema:
                description: A boolean value that indicates if the requested setting
                  is enabled.
                type: boolean
          description: The requested setting.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get a tenant setting by key.
      tags:
      - Tenant
      x-no-authorization: true
      x-service: temp-backend-settings
      x-test-coverage:
      - src/test/suites/tenantSuite/tenantUserApi/tenantSystemApi.test.ts
    x-scope:
    - system
    - tenant
  /internal/tenants/all-tenants/setting/{key}:
    get:
      description: Retrieve a specific setting value for all tenants in the system
      operationId: getSettingByKeyForAllTenants
      parameters:
      - description: The setting key to retrieve
        explode: false
        in: path
        name: key
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                description: Map of tenant IDs to setting values
                type: object
          description: Successfully retrieved setting for all tenants
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get setting by key for all tenants
      tags:
      - Internal
      x-no-authorization: true
      x-service: temp-backend-settings
    x-internal: true
components:
  parameters:
    excludeMigrated:
      description: "When true, excludes settings that have been migrated to external\
        \ services (e.g., Identity Manager)."
      explode: true
      in: query
      name: excludeMigrated
      required: false
      schema:
        default: false
        type: boolean
      style: form
    tenantId:
      explode: true
      in: query
      name: tenantId
      required: false
      schema:
        type: string
      style: form
      x-internal: true
    settingKey:
      description: The setting key to retrieve
      explode: false
      in: path
      name: settingKey
      required: true
      schema:
        type: string
      style: simple
    key:
      description: The setting key to retrieve
      explode: false
      in: path
      name: key
      required: true
      schema:
        type: string
      style: simple
  responses:
    "401Unauthorized":
      content:
        application/json:
          example:
            code: 401
            message: Issuer is not familiar.
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized
    "403Forbidden":
      content:
        application/json:
          example:
            code: 403
            message: You do not have sufficient permissions.
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden
    "500InternalServerError":
      content:
        application/json:
          example:
            code: 500
            message: Something went wrong.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "503ServiceUnavailable":
      content:
        application/json:
          example:
            code: 503
            message: Please try again in few minutes.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "400BadRequest":
      content:
        application/json:
          example:
            code: 400
            message: Required parameter is missing
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad request.
    "404NotFound":
      content:
        application/json:
          example:
            code: 404
            message: Resource id not found.
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource was not found
    "204NoContent":
      description: No Content.
    "400BadSubmissionRequest":
      content:
        application/json:
          example:
            code: 400
            message: The workload request does not comply with the policy set by the
              administrator
          schema:
            $ref: '#/components/schemas/SubmissionError'
      description: Bad submission request.
    "406NotAcceptable":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Not acceptable request
    "409Conflict":
      content:
        application/json:
          example:
            code: 409
            message: Resource with this name already exists
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource already exists
    "412PreconditionFailed":
      content:
        application/json:
          example:
            code: 412
            message: Precondition failed
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource was not found.
    "413RequestEntityTooLarge":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Request entity too large
    "415UnsupportedMediaType":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unsupported media type
    "501NotImplemented":
      content:
        application/json:
          example:
            code: 501
            message: Not implemented
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
  schemas:
    Setting:
      example:
        stage: Beta
        description: Enable to prevent projects' total quota from exceeding the department's
          quota
        active: true
        source: Tenant
        label: Limit projects from exceeding department quota
        category: Tenant
        type: Boolean
        value: true
        key: tenant.limit_quota_over_subscription
      properties:
        key:
          example: tenant.limit_quota_over_subscription
          type: string
        source:
          example: Tenant
          type: string
        category:
          example: Tenant
          type: string
        label:
          example: Limit projects from exceeding department quota
          type: string
        description:
          example: Enable to prevent projects' total quota from exceeding the department's
            quota
          type: string
        stage:
          example: Beta
          type: string
        type:
          example: Boolean
          type: string
        value:
          example: true
        active:
          example: true
          type: boolean
      required:
      - active
      - category
      - description
      - key
      - label
      - source
      - type
      type: object
    Error:
      example:
        code: 400
        message: Bad request - Resource should have a name
      properties:
        code:
          maximum: 599
          minimum: 100
          type: integer
        message:
          type: string
        details:
          type: string
      required:
      - code
      - message
    TenantSettingCreationRequest:
      example:
        key: tenant.limit_quota_over_subscription
        value: true
      properties:
        key:
          example: tenant.limit_quota_over_subscription
          type: string
        value:
          example: true
      type: object
    TenantSettingCreationResponse:
      example:
        msg: done
      properties:
        msg:
          example: done
          type: string
      type: object
    TenantSettingValue:
      description: A setting value for a specific tenant
      properties:
        tenantId:
          description: The tenant ID
          type: integer
        value:
          $ref: '#/components/schemas/TenantSettingValue_value'
      type: object
    TenantSettingsByKey:
      description: A setting value across all tenants
      example:
        key: CPUResourcesQuota
        values:
        - tenantId: 1
          value: true
        - tenantId: 2
          value: false
      properties:
        key:
          type: string
        values:
          items:
            $ref: '#/components/schemas/TenantSettingValue'
          type: array
      type: object
    TenantSetting:
      $ref: '#/components/schemas/Setting'
    ComplianceIssues:
      nullable: true
      properties:
        complianceIssues:
          items:
            $ref: '#/components/schemas/ComplianceIssues_complianceIssues_inner'
          type: array
      type: object
    SubmissionError:
      allOf:
      - $ref: '#/components/schemas/Error'
      - $ref: '#/components/schemas/ComplianceIssues'
    TenantSettingValue_value:
      description: The setting value (type varies based on the setting)
      oneOf:
      - type: boolean
      - type: number
      - type: string
      - type: object
    ComplianceIssues_complianceIssues_inner:
      properties:
        field:
          example: compute.gpuDevicesRequest
          type: string
        details:
          example: value must be no less than 3
          type: string
      required:
      - details
      - field
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Bearer authentication
      scheme: bearer
      type: http
