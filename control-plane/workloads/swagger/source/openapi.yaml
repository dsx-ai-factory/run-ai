  /api/v1/workloads/telemetry:
    $ref: './resources/WorkloadsTelemetry.yaml'

  /internal/workloads/telemetry:
    x-internal: true
    $ref: './resources/WorkloadsTelemetryInternal.yaml'

  /api/v1/workloads/podgroups/sync:
