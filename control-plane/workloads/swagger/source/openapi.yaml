openapi: "3.0.3"
info:
  title: WorkloadsService
  version: '1.0'
  description: An API for managing RunAi scheduler managed workloads.
  contact:
    name: 'Run.AI'
    url: 'https://www.run.ai/'
    email: 'support@run.ai'
servers:
  - url: http://localhost:8080
paths:
  /:
    x-internal: true
    x-service: workloads
    get:
      x-service: workloads
      summary: health check
      x-no-authorization: true
      operationId: health
      tags:
        - Health
      responses:
        200:
          description: Executed successfully.

  /api/v1/workloads/{workloadId}/actions:
    $ref: "./resources/WorkloadActions.yaml"

  /api/v1/workloads/scrapeable-metrics:
    $ref: './resources/WorkloadsScrapeableMetrics.yaml'

  /internal/workloads:
    $ref: './resources/InternalWorkloads.yaml'

  /internal/workloads/sync:
    $ref: './resources/InternalWorkloadsSync.yaml'

  /internal/workloads/pods/sync:
    $ref: './resources/InternalPodsSync.yaml'

  /internal/workloads/clusters/{clusterId}/nodes/{nodeName}/pods:
    $ref: './resources/InternalUpdateNodePods.yaml'

  /internal/workloads/resource-claim-templates/workloads:
    $ref: './resources/InternalResourceClaimTemplateWorkloads.yaml'

  /internal/workloads/sync-report:
    $ref: './resources/InternalSyncReport.yaml'

  /internal/workloads/enrich-ranking:
    $ref: './resources/InternalEnrichRanking.yaml'

  /api/v1/workloads:
    $ref: './resources/Workloads.yaml'

  /api/v1/workloads/slim:
    $ref: './resources/WorkloadsSlim.yaml'

  /internal/workloads/{workloadId}/ancestors:
    $ref: './resources/WorkloadAncestors.yaml'

