type: object
nullable: true
properties:
  gpu:
    type: number
    nullable: true
    format: double
    example: 1.5
    description: "Required if and only if gpuRequestType is portion. States the number of GPUs allocated for the created workload.
      The default is no allocated GPUs."
  gpuMemory:
    type: string
    pattern: "^([+-]?[0-9.]+)([eEinumkKMGTP]*[-+]?[0-9]*)$"
    nullable: true
    example: "200Mi"
  cpu:
    type: number
    nullable: true
    format: double
    description: States the amount of CPU cores used by the workload running.
    example: 0.5
  cpuMemory:
    type: string
    pattern: "^([+-]?[0-9.]+)([eEinumkKMGTP]*[-+]?[0-9]*)$"
    nullable: true
    example: "0B"
  extendedResources:
    $ref: "./WorkloadsExtendedResources.yaml"
