type: object
required:
  - workloads
  - projectId
properties:
  projectId:
    type: string
    example: "1"
  clusterId:
    type: string
    format: uuid
    example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
  workloads:
    type: array
    items:
      $ref: './WorkloadSyncFields.yaml'
  from:
    type: string
    format: uuid
    description: the first workload id to sync. if empty, all workloads before the first one sent will be deleted.
  to:
    type: string
    format: uuid
    description: the last workload to sync. if empty, all workloads after the last one sent will be deleted.
  idsToIgnore:
    type: array
    description: workload ids to ignore when deleting.
    items:
      type: string
      format: uuid
