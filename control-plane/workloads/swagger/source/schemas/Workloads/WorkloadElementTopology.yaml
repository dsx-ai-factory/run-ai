type: object
description: >
  The element's network topology. Returned only when the element's running pods
  resolve to an actual placement in the topology hierarchy; omitted otherwise
  (e.g. when the workload has no topology, the cluster doesn't support topology,
  or there are no running pods to place yet).
nullable: true
properties:
  name:
    type: string
    description: The name of the network topology associated with the element — either inherited from the workload's topology constraints, or inferred from the nodepools the element's running pods are scheduled on.
  actualPlacement:
    $ref: "./WorkloadTopologyActualPlacement.yaml"
