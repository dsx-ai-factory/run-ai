type: object
required:
  - variable
  - assetId
  - credentialType
properties:
  variable:
    type: string
    minLength: 1
    maxLength: 1024
    description: |
      Destination in Helm values. Supports dotted keys, escaped literal characters, array indexes,
      and double-quoted bracket keys. Destinations must not overlap.
      global.imagePullSecret.name and global.ngcApiSecret.name also set the sibling create value to false.
  assetId:
    type: string
    format: uuid
    description: Selected Run:ai credential asset ID. Never a credential value or a Kubernetes Secret name.
  credentialType:
    type: string
    enum:
      - ngc-api-key
      - image-pull-secret
      - generic
    description: |
      ngc-api-key selects an NGC asset's generic Secret. image-pull-secret selects a registry asset
      or the registry representation of an NGC asset. generic selects a generic Secret asset or
      an NGC asset's generic representation.
  userCredential:
    type: boolean
    readOnly: true
    description: Set by the server from the selected asset's ownership and visibility.
  existingSecretName:
    type: string
    readOnly: true
    description: Set by the server when the authorized credential asset references an existing Kubernetes Secret.
