type: object
required:
  - chartRef
description: |
  Select exactly one chart source: chartId for an existing uploaded archive, chartURL for a direct
  archive URL, or repo with chartName and an exact chartVersion. Sources cannot be combined.
  Inspection of a repository chart requires an explicit version; latest-version selection
  is not supported. Authentication uses the caller-accessible personal or shared credential asset.
properties:
  chartRef:
    $ref: './AIApplicationSpecChartRef.yaml'
  auth:
    $ref: './AIApplicationAuth.yaml'
