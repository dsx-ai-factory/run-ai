type: object
required: 
  - chartRef
properties:
  credentialBindings:
    type: array
    maxItems: 128
    description: |
      Active runtime credential selections, separate from Helm values and chart-download authentication.
      Each selected asset is authorized for the target project and resolved to a Kubernetes Secret name.
      Bindings override the corresponding values after chart defaults and user overrides are merged.
      The caller supplies only active selections; this API does not interpret questions.yaml.
    items:
      $ref: "./AIApplicationCredentialBinding.yaml"
  chartRef:
    $ref: "./AIApplicationSpecChartRef.yaml"
  values:
    type: object
    description: |
      Inline Helm values used to override the Helm chart’s default configuration. These values are merged with the Helm chart’s `values.yaml`. This field is mutually exclusive with `valuesBase64`.

      A complete string value can reference a personal credential using `USERCREDENTIAL:<name>`. Generic secret and Docker registry credentials use that form. NGC credentials require an explicit representation: `USERCREDENTIAL:<name>,generic-secret` or `USERCREDENTIAL:<name>,docker-registry`. Embedded or partial placeholders are not supported. The resolved value is a Kubernetes Secret name, never credential plaintext.
    additionalProperties: true
  valuesBase64:
    type: string
    description: |
      Base64-encoded Helm values used to override the Helm chart’s default configuration. This field is mutually exclusive with `values`. When the decoded content contains personal credential references, it must be a YAML object.

      String values support the same exact personal credential placeholder grammar as `values`: `USERCREDENTIAL:<name>` for generic secret and Docker registry credentials, or `USERCREDENTIAL:<name>,generic-secret` and `USERCREDENTIAL:<name>,docker-registry` for NGC credentials. Embedded or partial placeholders are not supported.
    format: byte
  auth:
    $ref: "./AIApplicationAuth.yaml"
