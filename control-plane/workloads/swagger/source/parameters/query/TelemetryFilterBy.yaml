name: filterBy
in: query
required: false
description: Filter results by a parameter. Use the format field-name operator value. Operators are == Equals, != Not equals, <= Less than or equal, >= Greater than or equal. Dates are in ISO 8601 timestamp format.
schema:
  type: array
  maxItems: 10
  items:
    type: string
    maxLength: 1000
    pattern: "^(createdAt|phaseUpdatedAt)(==|!=|<=|>=).+$"
  example: ["createdAt>=2026-09-01T00:00:00Z", "createdAt<=2026-09-02T00:00:00Z"]
explode: false
