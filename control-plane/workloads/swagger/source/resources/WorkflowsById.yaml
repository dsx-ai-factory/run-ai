delete:
  summary: Delete a workflow.
  operationId: delete_workflow
  description: Delete a workflow using a workflow id.
  x-service: workloads
  x-internal: true
  x-test-coverage:
    - control-plane/workloads/pkg/services_crud/workflows_service_test.go
  x-authorize:
    resource-type: workflows
    action: delete
    resource-id: workloadId
  tags:
    - Workflows
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/WorkloadId.yaml"
  responses:
    202:
      $ref: "../../../../infra/openapi/docs/responses/202Accepted.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
get:
  summary: Get workflow data.
  operationId: get_workflow
  description: Retrieve workflow details using a workflow id.
  x-service: workloads
  x-internal: true
  x-test-coverage:
    - control-plane/workloads/pkg/services_crud/workflows_service_test.go
  x-authorize:
    resource-type: workflows
    action: read
    resource-id: workloadId
  tags:
    - Workflows
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/WorkloadId.yaml"
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: "../../../../infra/openapi/docs/schemas/workflows/Workflow.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
