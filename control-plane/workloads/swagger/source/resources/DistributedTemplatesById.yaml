get:
  summary: Get a specific distributed training template by ID. [Experimental]
  operationId: get_distributed_template
  description: Get a specific distributed training template by ID.
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services_crud/templates_service_test.go
  x-authorize:
    resource-type: templates
    action: read
  tags:
    - Workload templates
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/TemplateId.yaml"
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: "../../../../infra/openapi/docs/schemas/distributed/DistributedTemplate.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
