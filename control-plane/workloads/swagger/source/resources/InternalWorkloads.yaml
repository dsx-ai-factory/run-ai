post:
  summary: Create a workload by the control plane.
  operationId: internal_create_workload
  x-service: workloads
  x-test-coverage:
    - e2e/src/test/suites/parallel/submitUI/distributedTrainingUI.test.ts
    - e2e/src/test/suites/parallel/workloads/jobsStatus.test.ts
  x-internal: true
  x-no-authorization: true
  tags:
    - Workloads
  requestBody:
    description: The workload info in the control plane.
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/Workloads/WorkloadCreationFields.yaml'
  responses:
