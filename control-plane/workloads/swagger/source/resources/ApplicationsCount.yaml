get:
  summary: Count AI applications. [Experimental]
  description: Get the total number of AI applications.
  operationId: count_applications
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services/ai_applications_service_test.go
  x-authorize:
    resource-type: workloads
    action: read
  tags:
    - AI Applications
  parameters:
    - $ref: '../parameters/query/ApplicationsFilter.yaml'
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/Search.yaml"
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: "../../../../infra/openapi/docs/schemas/common/CountResponse.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'

