get:
  summary: Get workload category by id.
  description: Retrieves a specific workload category by its ID. Workload categories are used to classify and monitor different types of workloads within the NVIDIA Run:ai platform.
  operationId: get_category_by_id
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services/workloads_types_api_test.go
  x-no-authorization: true # code implements validation - read on workloads or workload-properties
  tags:
    - Workload properties
  parameters:
    - name: categoryId
      description: The unique identifier of the workload category.
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    200:
      description: Category retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../schemas/WorkloadProperties/WorkloadCategory.yaml'
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

