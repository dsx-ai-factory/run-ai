put:
  summary: Upsert a single pod info from the cluster.
  operationId: upsert_pod
  x-internal: true
  x-service: workloads
  x-test-coverage:
    - e2e/src/test/suites/advancedSuite/workloads/workloadsApi.test.ts
    - e2e/src/test/suites/metricsSuite/metricsApi.test.ts
  x-authorize:
    resource-type: workloads
    action: sync
  tags:
    - Pods
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/PodId.yaml"
  requestBody:
    description: The pod info in the cluster.
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/Pods/PodSyncFields.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
delete:
  summary: Delete a pod as it does not exist in the cluster anymore.
  operationId: delete_pod
  x-internal: true
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services/pods_api_test.go
  x-authorize:
    resource-type: workloads
    action: sync
  tags:
    - Pods
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/PodId.yaml"
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'