delete:
  summary: Delete a distributed training by id.
  description: Use to delete a distributed training by workload id.
  operationId: delete_distributed
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services_crud/distributed_service_test.go
  x-authorize:
    resource-type: trainings
    action: delete
  tags:
    - Distributed
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/WorkloadId.yaml"
  responses:
    202:
      $ref: "../../../../infra/openapi/docs/responses/202Accepted.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
get:
  summary: Get distributed training's data. [Experimental]
  description: Retrieve the details of a distributed training by workload id.
  operationId: get_distributed
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services_crud/distributed_service_test.go
  x-authorize:
    resource-type: trainings
    action: read
  tags:
    - Distributed
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/WorkloadId.yaml"
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: "../../../../infra/openapi/docs/schemas/distributed/DistributedWorkload.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
