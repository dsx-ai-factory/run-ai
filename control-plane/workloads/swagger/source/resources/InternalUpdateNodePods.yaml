put:
  x-internal: true
  summary: Update pods on a specific node in a cluster
  description: Updates topology and other information for all pods running on a specific node
  operationId: internal_update_node_pods
  x-test-coverage:
    - control-plane/workloads/pkg/services/pods_api_test.go
  x-service: workloads
  x-authorize:
    resource-type: workloads
    action: sync
  tags:
    - Pods
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/ClusterId.yaml"
    - $ref: "../parameters/path/NodeName.yaml"
  requestBody:
    description: The data to update for all pods on this node
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/Pods/UpdateNodePodsRequest.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
