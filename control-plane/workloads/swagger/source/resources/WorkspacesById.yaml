delete:
  summary: Delete a workspace.
  description: Delete a workspace using the workspace id.
  operationId: delete_workspace
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services_crud/workspaces_service_test.go
  x-authorize:
    resource-type: workspaces
    action: delete
  tags:
    - Workspaces
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/WorkloadId.yaml"
  responses:
    202:
      $ref: "../../../../infra/openapi/docs/responses/202Accepted.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
get:
  summary: Get workspace data.
  description: Retrieve workspace details using a workload id.
  operationId: get_workspace
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services_crud/distributed_service_test.go
  x-authorize:
    resource-type: workspaces
    action: read
  tags:
    - Workspaces
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/WorkloadId.yaml"
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: "../../../../infra/openapi/docs/schemas/workspaces/Workspace.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
