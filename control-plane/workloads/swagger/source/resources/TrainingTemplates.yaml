post:
  summary: Create a new training template. [Experimental]
  operationId: create_training_template
  description: Create a new training template.
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services_crud/templates_service_test.go
  x-authorize:
    resource-type: templates
    action: create
  tags:
    - Workload templates
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../../../../infra/openapi/docs/schemas/trainings/TrainingTemplateCreationRequest.yaml"
  responses:
    202:
      description: Request completed successfully.
      content:
        application/json:
          schema:
            $ref: "../../../../infra/openapi/docs/schemas/trainings/TrainingTemplate.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
get:
  summary: List all training templates. [Experimental]
  description: List all training templates.
  operationId: list_training_templates
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services_crud/templates_service_test.go
  x-no-authorization: true
  tags:
    - Workload templates
  parameters:
    - $ref: '../../../../infra/openapi/docs/parameters/query/optional/Offset.yaml'
    - $ref: '../../../../infra/openapi/docs/parameters/query/optional/Limit.yaml'
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/SortOrder.yaml"
    - $ref: '../parameters/query/TemplatesSort.yaml'
    - $ref: '../parameters/query/TemplatesFilter.yaml'
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/Search.yaml"
    - $ref: "../parameters/query/IncludeTemplateAncestors.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/ComplyToProject.yaml"
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../../../../infra/openapi/docs/schemas/trainings/TrainingTemplatesListResponse.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
