delete:
  x-internal: true
  summary: Delete a revision.
  operationId: delete_revision
  description: Delete a revision using a revision id.
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services/revisions_api_test.go
  x-authorize:
    resource-type: inferences
    action: delete
    resource-id: revisionId
  tags:
    - Revisions
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/RevisionId.yaml"
  responses:
    204:
      $ref: "../../../../infra/openapi/docs/responses/204NoContent.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
get:
  summary: Get revision data.
  operationId: get_revision
  description: Retrieve revision details using a revision id. Supported for clusters v2.21+.
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services/revisions_api_test.go
  x-authorize:
    resource-type: inferences
    action: read
    resource-id: revisionId
  tags:
    - Revisions
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/RevisionId.yaml"
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: "../schemas/Revisions/Revision.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
