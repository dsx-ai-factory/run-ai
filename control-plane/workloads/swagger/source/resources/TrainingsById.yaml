delete:
  summary: Delete a training.
  operationId: delete_training
  description: Delete a training using a workload id.
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services_crud/trainings_service_test.go
  x-authorize:
    resource-type: trainings
    action: delete
  tags:
    - Trainings
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/WorkloadId.yaml"
  responses:
    202:
      $ref: "../../../../infra/openapi/docs/responses/202Accepted.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
get:
  summary: Get training data.
  operationId: get_training
  description: Retrieve training details using a workload id.
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services_crud/distributed_service_test.go
  x-authorize:
    resource-type: trainings
    action: read
  tags:
    - Trainings
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/WorkloadId.yaml"
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: "../../../../infra/openapi/docs/schemas/trainings/Training.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
