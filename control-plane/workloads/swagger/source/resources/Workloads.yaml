get:
  summary: List workloads.
  description: Retrieve a list of active workloads with details.
  operationId: get_workloads
  x-service: workloads
  x-test-coverage:
    - e2e/src/test/suites/parallel/workloads/jobsStatus.test.ts
    - e2e/src/test/suites/advancedSuite/workloads/workloadsApi.test.ts
  x-authorize:
    resource-type: workloads
    action: read
  tags:
    - Workloads
  parameters:
    - $ref: '../parameters/query/Deleted.yaml'
    - $ref: '../../../../infra/openapi/docs/parameters/query/optional/Offset.yaml'
    - $ref: '../../../../infra/openapi/docs/parameters/query/optional/Limit.yaml'
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/SortOrder.yaml"
    - $ref: '../parameters/query/WorkloadsSort.yaml'
    - $ref: '../parameters/query/WorkloadsFilter.yaml'
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/Search.yaml"
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            type: object
            required:
              - workloads
            properties:
              next:
                type: integer
                example: 1
              workloads:
                $ref: '../schemas/Workloads/Workloads.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
post:
  x-internal: true
  summary: Sync workloads.
  operationId: sync_workloads
  x-service: workloads
  x-test-coverage:
    - e2e/src/test/suites/parallel/workloads/jobsStatus.test.ts
    - e2e/src/test/suites/advancedSuite/workloads/workloadsApi.test.ts
  x-authorize:
    resource-type: workloads
    action: sync
  tags:
    - Workloads
  parameters:
    - $ref: '../parameters/query/WorkloadsFilter.yaml'
  requestBody:
    description: The workloads to sync.
    content:
      application/json:
        schema:
          $ref: '../schemas/Workloads/WorkloadsSyncRequest.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    207:
      description: Partial success.
      content:
        application/json:
          schema:
            type: object
            required:
              - successfullySyncedWorkloads
              - failedWorkloads
            properties:
              successfullySyncedWorkloads:
                type: array
                items:
                  type: string
                  format: uuid
              failedWorkloads:
                type: array
                items:
                  type: string
                  format: uuid
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'