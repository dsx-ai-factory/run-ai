patch:
  summary: patch the workload phase from the client.
  operationId: patch_workload_phase
  x-internal: true
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services/workloads_api_test.go
  x-authorize:
    resource-type: workloads
    action: update
    resource-id: workloadId
  tags:
    - Workloads
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/WorkloadId.yaml"
  requestBody:
    description: The workload info in the cluster.
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/Workloads/WorkloadPatchFields.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
put:
  summary: Upsert the workload info from the cluster.
  operationId: upsert_workload
  x-internal: true
  x-service: workloads
  x-test-coverage:
    - e2e/src/test/suites/advancedSuite/workloads/workloadsApi.test.ts
    - e2e/src/test/suites/parallel/workloads/jobsStatus.test.ts
  x-authorize:
    resource-type: workloads
    action: sync
  tags:
    - Workloads
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/WorkloadId.yaml"
  requestBody:
    description: The workload info in the cluster.
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/Workloads/WorkloadSyncFields.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
delete:
  summary: Delete the workload as is does not exist in the cluster anymore.
  operationId: delete_workload
  x-internal: true
  x-service: workloads
  x-test-coverage:
    - e2e/src/test/suites/advancedSuite/workloads/workloadsApi.test.ts
  x-authorize:
    resource-type: workloads
    action: sync
  tags:
    - Workloads
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/WorkloadId.yaml"
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
get:
  summary: Get a workload.
  operationId: get_workload
  description: Retrieve workload data using a `workloadId`.
  x-service: workloads
  x-test-coverage:
    - e2e/src/test/suites/advancedSuite/workloads/workloadsApi.test.ts
  x-authorize:
    resource-type: workloads
    action: read
    resource-id: workloadId
  tags:
    - Workloads
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/WorkloadId.yaml"
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../schemas/Workloads/WorkloadDetailed.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'