get:
  summary: Get AI application. [Experimental]
  description: Get AI application.
  operationId: get_application
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services/ai_applications_service_test.go
  x-authorize:
    resource-type: workloads
    action: read
  tags:
    - AI Applications
  parameters:
    - $ref: "../parameters/path/ApplicationId.yaml"
  responses:
    200:
      description: ok.
      content:
        application/json:
          schema:
            $ref: '../schemas/Applications/AIApplication.yaml'
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"

delete:
  summary: Delete AI application.
  description: Delete AI application.
  operationId: delete_application
  x-service: workloads
  x-test-coverage:
    - not-applicable
  x-authorize:
    resource-type: applications
    action: delete
  tags:
    - AI Applications
  parameters:
    - $ref: "../parameters/path/ApplicationId.yaml"
  responses:
    202:
      $ref: '../../../../infra/openapi/docs/responses/202Accepted.yaml'
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"