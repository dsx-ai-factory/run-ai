post:
  x-internal: true
  summary: Sync revisions.
  operationId: sync_revisions
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services/revisions_api_test.go
  x-authorize:
    resource-type: inferences
    action: sync
  tags:
    - Revisions
  requestBody:
    description: The revisions to sync.
    content:
      application/json:
        schema:
          $ref: '../schemas/Revisions/RevisionsSyncRequest.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    207:
      description: Partial success.
      content:
        application/json:
          schema:
            type: object
            required:
              - successfullySyncedRevisions
              - failedRevisions
            properties:
              successfullySyncedRevisions:
                type: array
                items:
                  type: string
                  format: uuid
              failedRevisions:
                type: array
                items:
                  type: string
                  format: uuid
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'