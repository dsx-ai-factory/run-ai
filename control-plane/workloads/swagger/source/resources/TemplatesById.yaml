get:
  summary: Get a template, any type. [Experimental]
  operationId: get_template_by_id
  description: Retrieve the details of a template using its id.
  x-service: workloads
  x-test-coverage:
    - control-plane/workloads/pkg/services_crud/templates_service_test.go
  x-authorize:
    resource-type: templates
    action: read
  tags:
    - Workload templates
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/TemplateId.yaml"
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: "../../../../infra/openapi/docs/schemas/templates/SupersetTemplate.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    500:
      $ref: "../../../../infra/openapi/docs/responses/500InternalServerError.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"