          $ref: '#/components/schemas/PvcAddedAttrValues'
      nullable: true
      type: object
    PvcFieldsUpdatable:
      properties:
        path:
          description: Local path within the workload to which the PVC bucket will be mapped. (mandatory)
          type: string
          minLength: 1
          maxLength: 4096
