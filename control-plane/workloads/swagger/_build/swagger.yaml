          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - totalElementsCount
                  - storedElementsCount
                properties:
                  storedElementsCount:
                    type: integer
                    format: int32
                    minimum: 0
                    description: The number of structure elements stored for this workload. When truncation occurs, this will be less than totalElementsCount.
