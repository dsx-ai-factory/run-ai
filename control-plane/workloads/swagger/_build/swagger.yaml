openapi: 3.0.3
info:
  title: WorkloadsService
  version: '1.0'
  description: An API for managing RunAi scheduler managed workloads.
  contact:
    name: Run.AI
    url: https://www.run.ai/
    email: support@run.ai
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /:
    x-internal: true
    x-service: workloads
    get:
      x-service: workloads
      summary: health check
      x-no-authorization: true
      operationId: health
      tags:
        - Health
      responses:
        '200':
          description: Executed successfully.
  /api/v1/workloads/{workloadId}/actions:
    get:
      summary: Get workload action history.
      description: Returns accepted workload actions. History remains available after a workload is deleted and is removed when the workload is permanently removed from the system.
      operationId: get_workload_actions_history
      x-service: workloads
      x-test-coverage:
        - control-plane/workloads/pkg/services/workload_actions_api_test.go
      x-authorize:
        resource-type: workloads
        action: read
        resource-id: workloadId
      tags:
        - Events
      parameters:
        - $ref: '#/components/parameters/WorkloadId'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkloadActionsResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/workloads/scrapeable-metrics:
    get:
      summary: Get workloads metrics in openmetrics format for scraping.
      operationId: get_workloads_scrapeable_metrics
      x-service: workloads
      x-internal: true
      x-authorize:
        resource-type: workload-integration-metrics
        action: read
      x-test-coverage:
        - e2e/src/test/suites/playwright/serial/nv/metrics/workloadsMetricsExporter.test.ts
      tags:
        - Metrics
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/workloads:
    post:
      summary: Create a workload by the control plane.
      operationId: internal_create_workload
      x-service: workloads
      x-test-coverage:
        - e2e/src/test/suites/parallel/submitUI/distributedTrainingUI.test.ts
        - e2e/src/test/suites/parallel/workloads/jobsStatus.test.ts
      x-internal: true
      x-no-authorization: true
      tags:
        - Workloads
      requestBody:
        description: The workload info in the control plane.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadCreationFields'
      responses:
        '201':
          description: Created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workload'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/workloads/sync:
    post:
      x-internal: true
      summary: Sync workloads.
      operationId: internal_sync_workloads
      x-service: workloads
      x-test-coverage: not-applicable
      x-authorize:
        resource-type: workloads
        action: sync
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/WorkloadsFilter'
      requestBody:
        description: The workloads to sync.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalWorkloadsSyncRequest'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '207':
          description: Partial success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - successfullySyncedWorkloads
                  - failedWorkloads
                properties:
                  successfullySyncedWorkloads:
                    type: array
                    items:
                      type: string
                      format: uuid
                  failedWorkloads:
                    type: array
                    items:
                      type: string
                      format: uuid
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/workloads/pods/sync:
    post:
      x-internal: true
      summary: Sync pods.
      operationId: internal_sync_pods
      x-service: workloads
      x-test-coverage: not-applicable
      x-authorize:
        resource-type: workloads
        action: sync
      tags:
        - Pods
      requestBody:
        description: The pods to sync.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalPodsSyncRequest'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '207':
          description: Partial success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - successfullySyncedPods
                  - failedPods
                properties:
                  successfullySyncedPods:
                    type: array
                    items:
                      type: string
                      format: uuid
                  failedPods:
                    type: array
                    items:
                      type: string
                      format: uuid
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/workloads/clusters/{clusterId}/nodes/{nodeName}/pods:
    put:
      x-internal: true
      summary: Update pods on a specific node in a cluster
      description: Updates topology and other information for all pods running on a specific node
      operationId: internal_update_node_pods
      x-test-coverage:
        - control-plane/workloads/pkg/services/pods_api_test.go
      x-service: workloads
      x-authorize:
        resource-type: workloads
        action: sync
      tags:
        - Pods
      parameters:
        - $ref: '#/components/parameters/ClusterId'
        - $ref: '#/components/parameters/NodeName'
      requestBody:
        description: The data to update for all pods on this node
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodePodsRequest'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/workloads/resource-claim-templates/workloads:
    post:
      x-internal: true
      summary: List the workloads referencing a resource claim template (Internal API).
      description: |
        Lists the workloads in the given scope whose pods reference the ResourceClaimTemplate with the given name, with the pods that use it and the ResourceClaim each pod is bound to. Standalone ResourceClaims are never included. Results are limited to the workloads the caller is permitted to read. Used by assets-service to serve the workloads view of a managed resource claim template.
      operationId: internal_get_resource_claim_template_workloads
      x-service: workloads
      x-test-coverage:
        - control-plane/workloads/pkg/services/resource_claims_api_test.go
      x-authorize:
        resource-type: workloads
        action: read
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalResourceClaimTemplateWorkloadsRequest'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceClaimTemplateWorkloadsResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/workloads/sync-report:
    post:
      summary: report workload sync issues
      description: needed when the updates are not sent directly from the cluster to the workloads service, but to another service (e.g workloads-manager) so the other service can use this API to notify the workload service about sync issues
      operationId: report_sync_issues
      x-internal: true
      x-service: workloads
      x-no-authorization: true
      x-test-coverage:
        - control-plane/workloads/pkg/services_crud/sync_test.go
      tags:
        - Sync
      parameters:
        - $ref: '#/components/parameters/ClusterIdRequired'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterSyncReport'
      responses:
        '204':
          description: No response.
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/workloads/enrich-ranking:
    post:
      summary: Enrich org unit ranking with workload counts (Internal API).
      description: |
        Internal API for enriching org unit ranking items with workload counts.

        Accepts an array of org unit IDs along with global context (cluster, type, nodepool)
        and returns workload counts for each ID.

        Phase-specific node pool filtering:
        - RUNNING workloads: filters by currentNodepools (where workload is running)
        - PENDING workloads: filters by requestedNodepools (only single-nodepool requests)

        Note: All IDs in a single request must be of the same orgUnitType (all projects OR all departments).
      operationId: internal_enrich_org_unit_ranking
      x-service: workloads
      x-internal: true
      x-no-authorization: true
      x-test-coverage:
        - pkg/services/internal_enrich_ranking_test.go
      tags:
        - Workloads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalEnrichOrgUnitRankingRequest'
      responses:
        '200':
          description: Successfully enriched ranking items with workload counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalEnrichOrgUnitRankingResponse'
              example:
                items:
                  - id: '123'
                    runningWorkloadsCount: 5
                    pendingWorkloadsCount: 2
                  - id: '456'
                    runningWorkloadsCount: 12
                    pendingWorkloadsCount: 7
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/workloads:
    get:
      summary: List workloads.
      description: Retrieve a list of active workloads with details.
      operationId: get_workloads
      x-service: workloads
      x-test-coverage:
        - e2e/src/test/suites/parallel/workloads/jobsStatus.test.ts
        - e2e/src/test/suites/advancedSuite/workloads/workloadsApi.test.ts
      x-authorize:
        resource-type: workloads
        action: read
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/Deleted'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/WorkloadsSort'
        - $ref: '#/components/parameters/WorkloadsFilter'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - workloads
                properties:
                  next:
                    type: integer
                    example: 1
                  workloads:
                    $ref: '#/components/schemas/Workloads'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    post:
      x-internal: true
      summary: Sync workloads.
      operationId: sync_workloads
      x-service: workloads
      x-test-coverage:
        - e2e/src/test/suites/parallel/workloads/jobsStatus.test.ts
        - e2e/src/test/suites/advancedSuite/workloads/workloadsApi.test.ts
      x-authorize:
        resource-type: workloads
        action: sync
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/WorkloadsFilter'
      requestBody:
        description: The workloads to sync.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadsSyncRequest'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '207':
          description: Partial success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - successfullySyncedWorkloads
                  - failedWorkloads
                properties:
                  successfullySyncedWorkloads:
                    type: array
                    items:
                      type: string
                      format: uuid
                  failedWorkloads:
                    type: array
                    items:
                      type: string
                      format: uuid
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/workloads/slim:
    get:
      x-internal: true
      summary: List workloads, slim.
      description: |
        Retrieve a list of active workloads with only their identity fields, sorted by id in ascending order.
        Workloads are read from the workloads table directly instead of the workloads view, so newly created workloads are returned immediately.
      operationId: get_workloads_slim
      x-service: workloads
      x-test-coverage:
        - control-plane/workloads/pkg/services/workloads_api_test.go
      x-authorize:
        resource-type: workloads
        action: read
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/WorkloadsSlimFilter'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkloadsSlimResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/workloads/{workloadId}/ancestors:
    get:
      summary: Get the workload ancestors.
      operationId: get_workload_ancestors
      x-no-authorization: true
      x-service: workloads
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/workloads/workloadsApi.test.ts
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ancestors'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/workloads/{workloadId}:
    patch:
      summary: patch the workload phase from the client.
      operationId: patch_workload_phase
      x-internal: true
      x-service: workloads
      x-test-coverage:
        - control-plane/workloads/pkg/services/workloads_api_test.go
      x-authorize:
        resource-type: workloads
        action: update
        resource-id: workloadId
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/WorkloadId'
      requestBody:
        description: The workload info in the cluster.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadPatchFields'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    put:
      summary: Upsert the workload info from the cluster.
      operationId: upsert_workload
      x-internal: true
      x-service: workloads
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/workloads/workloadsApi.test.ts
        - e2e/src/test/suites/parallel/workloads/jobsStatus.test.ts
      x-authorize:
        resource-type: workloads
        action: sync
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/WorkloadId'
      requestBody:
        description: The workload info in the cluster.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadSyncFields'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    delete:
      summary: Delete the workload as is does not exist in the cluster anymore.
      operationId: delete_workload
      x-internal: true
      x-service: workloads
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/workloads/workloadsApi.test.ts
      x-authorize:
        resource-type: workloads
        action: sync
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    get:
      summary: Get a workload.
      operationId: get_workload
      description: Retrieve workload data using a `workloadId`.
      x-service: workloads
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/workloads/workloadsApi.test.ts
      x-authorize:
        resource-type: workloads
        action: read
        resource-id: workloadId
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/WorkloadId'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadDetailed'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/workloads/{workloadId}:
    patch:
      summary: patch the workload phase from the client.
      operationId: internal_patch_workload_phase
      x-internal: true
      x-service: workloads
      x-test-coverage:
        - control-plane/workloads/pkg/services/workloads_api_test.go
      x-no-authorization: true
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/WorkloadId'
      requestBody:
        description: The workload info in the cluster.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadPatchFields'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/workloads/count:
    get:
      summary: Count workloads.
      description: Retrieve the number of workloads.
      operationId: count_workloads
      x-service: workloads
      x-test-coverage:
        - control-plane/workloads/pkg/services/workloads_api_test.go
      x-authorize:
        resource-type: workloads
        action: read
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/Deleted'
        - $ref: '#/components/parameters/WorkloadsFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Precise'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
                    format: int64
                    example: 1
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/workloads/telemetry:
    get:
      summary: Get the workloads telemetry.
      operationId: get_workloads_telemetry
      description: |
        Retrieves workload data by telemetry type. Optionally filter by specific workload phases.

        Telemetry Types:
        - WORKLOADS_COUNT: Count of workloads
        - GPU_ALLOCATION: GPU allocation metrics
        - PENDING_TIME_DISTRIBUTION: Distribution of workloads by current pending time (time since entering Pending phase).
          For this type, results are automatically grouped by 4 time buckets and any additional groupBy parameters.
        - IDLE_ALLOCATED_GPUS: Sum of idle allocated GPU devices across workloads
      x-service: workloads
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/dashboardsV2/SanityTelemetryApi.test.ts
      x-authorize:
        resource-type: workloads
        action: read
      tags:
        - Workloads
      parameters:
        - $ref: '#/components/parameters/FilterByCluster'
        - $ref: '#/components/parameters/FilterByNodepoolName'
        - $ref: '#/components/parameters/FilterByDepartment'
        - $ref: '#/components/parameters/FilterByProject'
        - $ref: '#/components/parameters/TelemetryGroupBy'
        - $ref: '#/components/parameters/TelemetryType'
        - $ref: '#/components/parameters/FilterByPhases'
        - $ref: '#/components/parameters/TelemetryFilterBy'
      responses:
