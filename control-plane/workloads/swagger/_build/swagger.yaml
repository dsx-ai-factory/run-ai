          description: Pod-local name of the claim entry (DNS_LABEL). Mirrors `pod.spec.resourceClaims[].name` and the key used by `pod.status.resourceClaimStatuses[].name` to publish the bound claim.
          example: gpu-1
        resourceClaimTemplateName:
          type: string
          nullable: true
