        resourceClaimName:
          type: string
          nullable: true
          description: Name of a standalone `ResourceClaim` that the pod references directly, when the claim entry is not created from a template. Mutually exclusive with `resourceClaimTemplateName`. Mirrors `pod.spec.resourceClaims[].resourceClaimName`.
          example: shared-infiniband
        allocatedResourceClaimName:
          type: string
          nullable: true
          description: Name of the actual `ResourceClaim` bound to the pod for this entry. For a template-generated entry this is populated from `pod.status.resourceClaimStatuses[].resourceClaimName` once Kubernetes publishes it, and is null until then. For a standalone entry it equals `resourceClaimName` and is populated immediately. This is the field the forward-view API surfaces as the "actual" bound claim.
          example: dra-gpu-test-gpu-1-mk4s8
