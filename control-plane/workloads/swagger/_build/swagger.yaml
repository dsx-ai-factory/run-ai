          description: for cluster supporting sub-domain, stores the sub-domain of the exposedUrl. e.g, myproject-myworkload-url-1., t when syncing from the cluster, this subdomain is patched woth the cluster domain to compose the complete connection path
          type: string
          nullable: true
        exposedUrlPath:
          x-internal: true
          description: for cluster not supporting sub-domain, stores the path of the exposedUrl. e.g. /myproject/myworkload/url-1 when syncing from the cluster, this path is patched with the cluster domain to compose the complete connection path
          type: string
          nullable: true
        portResourceName:
          x-internal: true
          description: stores the assigned name to the port resource in the cluster. e.g. workspace-nodeport-0 when syncing from the cluster, this name is used to match the connection with it's connection url.
          type: string
          nullable: true
        serviceResourceName:
          x-internal: true
          description: stores the assigned resource name to the service holding this port in the cluster. e.g. myworkload-service-0 when syncing from the cluster, this name, along with portResourceName, is used to match the connection with it's connection url
