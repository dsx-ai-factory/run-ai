            description: Service object containing details about the service.
            properties:
              name:
                type: string
                example: service1
                description: Name of the service.
              type:
                type: string
                example: ClusterIP
                description: Type of the service (e.g., ClusterIP, NodePort, etc.).
              ports:
                type: array
                description: List of ports exposed by the service.
                items:
                  type: object
                  description: Port object containing details about the port.
                  properties:
                    name:
                      type: string
                      example: port1
                      description: Name of the port.
                    targetPort:
                      type: string
                      example: '80'
                      description: Target port on the pod.
                    port:
                      type: integer
                      format: int32
                      example: 80
                      description: Port number exposed by the service.
                    protocol:
                      type: string
                      example: TCP
                      description: Protocol used by the port (e.g., TCP, UDP).
              loadBalancer:
                type: object
                description: Load balancer configuration for the service.
                properties:
                  ingress:
                    type: array
                    description: List of ingress points for the load balancer.
                    items:
                      type: object
                      description: Ingress object containing IP or hostname.
                      properties:
