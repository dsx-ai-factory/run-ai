                configMapVolume:
                  $ref: '#/components/schemas/ConfigMapItems'
                dataVolume:
                  $ref: '#/components/schemas/DataVolumeItems'
                emptyDirVolume:
                  $ref: '#/components/schemas/EmptyDirItems'
                git:
                  $ref: '#/components/schemas/GitItems'
                hostPath:
                  $ref: '#/components/schemas/HostPathItems'
                nfs:
                  $ref: '#/components/schemas/NfsItems'
                pvc:
                  $ref: '#/components/schemas/PvcItems'
                s3:
                  $ref: '#/components/schemas/S3Items'
                secretVolume:
                  $ref: '#/components/schemas/SecretItems'
              type: object
            terminateAfterPreemption:
              $ref: '#/components/schemas/TerminateAfterPreemption'
            terminationGracePeriodSeconds:
              $ref: '#/components/schemas/TerminationGracePeriod'
            tolerations:
              $ref: '#/components/schemas/Tolerations'
            tty:
              $ref: '#/components/schemas/Tty'
            workingDir:
              $ref: '#/components/schemas/WorkingDir'
          type: object
    WorkspaceSpec:
      description: The specifications of the workspace to be created.
      properties:
        spec:
          $ref: '#/components/schemas/WorkspaceSpecSpec'
    WorkspaceCreationRequest:
      allOf:
        - $ref: '#/components/schemas/WorkloadCreationMeta'
        - $ref: '#/components/schemas/SubmitWithTemplateId'
        - $ref: '#/components/schemas/SubmitWithAssetIds'
        - $ref: '#/components/schemas/WorkspaceSpec'
    DepartmentId:
      description: The id of the department.
      type: string
      minLength: 1
      example: 2
      pattern: .*
    WorkloadDesiredPhase:
      description: The desired phase of the workload.
      type: string
      enum:
        - Running
        - Stopped
        - Deleted
    WorkloadMeta:
      required:
        - name
        - requestedName
        - workloadId
        - projectId
        - clusterId
        - createdBy
        - createdAt
        - desiredPhase
      properties:
        name:
          $ref: '#/components/schemas/WorkloadName'
        requestedName:
          description: The name as was requested for the workload. If useGivenNameAsPrefix, in the creation request, is false, name and requestedName should be identical. Otherwise, name should be composed of requestedName followed by a suffix of random characters.
          type: string
        workloadId:
          $ref: '#/components/schemas/WorkloadId'
        projectId:
          $ref: '#/components/schemas/ProjectId'
        departmentId:
          $ref: '#/components/schemas/DepartmentId'
        clusterId:
          $ref: '#/components/schemas/ClusterId'
        createdBy:
          description: The user who created the workload
          type: string
          example: test@lab.com
        createdAt:
          description: The creation time of the workload.
          type: string
          format: date-time
          example: '2022-01-01T03:49:52.531Z'
        deletedAt:
          description: The deletion time of the workload.
          type: string
          nullable: true
          format: date-time
          example: '2022-01-01T03:49:52.531Z'
        desiredPhase:
          $ref: '#/components/schemas/WorkloadDesiredPhase'
        actualPhase:
          $ref: '#/components/schemas/Phase'
    Workspace:
      allOf:
        - $ref: '#/components/schemas/WorkloadMeta'
        - $ref: '#/components/schemas/WorkspaceSpec'
    PolicyRuleEnum:
      description: Indicates which validation rule (e.g., min, max, step, options, required, canEdit, canAdd) conflicted with policy restrictions, causing the asset or template to be rejected.
      type: string
      nullable: true
      enum:
        - min
        - max
        - step
        - options
        - required
        - canEdit
        - canAdd
        - locked
        - blocked
    ComplianceIssuesV2:
      properties:
        complianceIssues:
          type: array
          items:
            type: object
            required:
              - details
              - field
            properties:
              field:
                type: string
                example: compute.gpuDevicesRequest
              details:
                type: string
                example: value must be no less than 3
              rule:
                $ref: '#/components/schemas/PolicyRuleEnum'
      nullable: true
      type: object
    SubmissionErrorV2:
      allOf:
        - $ref: '#/components/schemas/Error'
        - $ref: '#/components/schemas/ComplianceIssuesV2'
    RequestInfo:
      required:
        - afterUpdate
      description: value that the agent sent to the afterUpdate query parameter.
      properties:
        afterUpdate:
          $ref: '#/components/schemas/UpdateCount'
    ResponseInfo:
      description: The lowest and highest update counts included in this bulk of updates. for example, it is possible that agent requester for afterUpdate=10 and received a bulk of four updates - 12, 13, 16, 18. in this case lowestUpdate=12, highestUpdate=18.
      properties:
        lowestUpdate:
          $ref: '#/components/schemas/UpdateCount'
        highestUpdate:
          $ref: '#/components/schemas/UpdateCount'
    SystemInfo:
      description: the highest update count that was assigned to the data being synchronized. for example, it is possible that the agent sent afterUpdate=12 and received a bulk containing only four updates (13, 15, 18, 19) but in the system there is already update 21 which was not included in this bulk and can be received in the following bulk.
      properties:
        highestUpdate:
          $ref: '#/components/schemas/UpdateCount'
    DistributedInferenceLeaderWorkerSpecSecurity:
      title: DistributedInferenceLeaderWorkerSpecSecurity
      nullable: true
      properties:
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        hostIpc:
          $ref: '#/components/schemas/HostIpc'
        hostNetwork:
          $ref: '#/components/schemas/HostNetwork'
        privileged:
          allOf:
            - $ref: '#/components/schemas/Privileged'
          x-internal: true
        readOnlyRootFilesystem:
          $ref: '#/components/schemas/ReadOnlyRootFileSystem'
        runAsGid:
          $ref: '#/components/schemas/RunAsGid'
        runAsNonRoot:
          $ref: '#/components/schemas/RunAsNonRoot'
        runAsUid:
          $ref: '#/components/schemas/RunAsUid'
        seccompProfileType:
          $ref: '#/components/schemas/SeccompProfileType'
        supplementalGroups:
          $ref: '#/components/schemas/SupplementalGroups'
        uidGidSource:
          $ref: '#/components/schemas/UidGidSource'
      type: object
    DistributedInferenceLeaderWorkerSpec:
      properties:
        annotations:
          $ref: '#/components/schemas/Annotations'
        args:
          $ref: '#/components/schemas/Args'
        command:
          $ref: '#/components/schemas/Command'
        compute:
          nullable: true
          properties:
            cpuCoreLimit:
              $ref: '#/components/schemas/CpuCoreLimit'
            cpuCoreRequest:
              $ref: '#/components/schemas/CpuCoreRequest'
            cpuMemoryLimit:
              $ref: '#/components/schemas/CpuMemoryLimit'
            cpuMemoryRequest:
              $ref: '#/components/schemas/CpuMemoryRequest'
            extendedResources:
              $ref: '#/components/schemas/ExtendedResources'
            gpuComputeMode:
              $ref: '#/components/schemas/GpuComputeMode'
            gpuDevicesRequest:
              $ref: '#/components/schemas/GpuDevicesRequest'
            gpuMemoryLimit:
              $ref: '#/components/schemas/GpuMemoryLimit'
            gpuMemoryPortionLimit:
              $ref: '#/components/schemas/GpuMemoryPortionLimit'
            gpuMemoryPortionRequest:
              $ref: '#/components/schemas/GpuMemoryPortionRequest'
            gpuMemoryRequest:
              $ref: '#/components/schemas/GpuMemoryRequest'
            gpuPortionLimit:
              $ref: '#/components/schemas/GpuPortionLimit'
            gpuPortionRequest:
              $ref: '#/components/schemas/GpuPortionRequest'
            gpuRequestType:
              $ref: '#/components/schemas/GpuRequestType'
            largeShmRequest:
              $ref: '#/components/schemas/LargeShmRequest'
          type: object
        createHomeDir:
          $ref: '#/components/schemas/CreateHomeDir'
        environmentVariables:
          $ref: '#/components/schemas/EnvironmentVariables'
        image:
          $ref: '#/components/schemas/Image'
        imagePullPolicy:
          $ref: '#/components/schemas/ImagePullPolicy'
        imagePullSecrets:
          $ref: '#/components/schemas/ImagePullSecrets'
        labels:
          $ref: '#/components/schemas/Labels'
        nodeAffinityRequired:
          $ref: '#/components/schemas/NodeAffinityRequired'
        nodeType:
          $ref: '#/components/schemas/NodeType'
        podAffinity:
          $ref: '#/components/schemas/PodAffinity'
        probes:
          $ref: '#/components/schemas/Probes'
        security:
          $ref: '#/components/schemas/DistributedInferenceLeaderWorkerSpecSecurity'
        storage:
          nullable: true
          properties:
            configMapVolume:
              $ref: '#/components/schemas/ConfigMapItems'
            emptyDirVolume:
              $ref: '#/components/schemas/EmptyDirItems'
            pvc:
              $ref: '#/components/schemas/PvcItems'
            secretVolume:
              $ref: '#/components/schemas/SecretItems'
          type: object
        tolerations:
          $ref: '#/components/schemas/Tolerations'
        workingDir:
          $ref: '#/components/schemas/WorkingDir'
      type: object
    DistributedInferenceLeaderSpecFields:
      properties:
        leader:
          description: Defines the pod specification for the leader. Must always be provided, regardless of the number of workers.
          allOf:
            - $ref: '#/components/schemas/DistributedInferenceLeaderWorkerSpec'
          nullable: true
          type: object
    DistributedInferenceWorkerSpecFields:
      properties:
        worker:
          description: Defines the pod specification for the workers. Required only if the number of workers is greater than 0.
          allOf:
            - $ref: '#/components/schemas/DistributedInferenceLeaderWorkerSpec'
          nullable: true
          type: object
    DistributedInferenceRestartPolicy:
      description: |
        Determines the behavior when a pod fails.
        - `RecreateGroupOnPodRestart`: Restarts all pods in the group if any pod fails.
        - `None`: No automatic restart behavior is applied.
      type: string
      enum:
        - RecreateGroupOnPodRestart
        - None
      nullable: true
      default: RecreateGroupOnPodRestart
    DistributedInferenceServingPortProtocol:
      description: The protocol used to access the port.
      type: string
      enum:
        - http
      nullable: true
      default: http
    DistributedInferenceServingPortContainerAndProtocol:
      properties:
        port:
          description: The port exposed by the container running the distributed inference service.
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          example: 8080
          nullable: true
        protocol:
          $ref: '#/components/schemas/DistributedInferenceServingPortProtocol'
    DistributedInferenceServingPortAccessAuthorizationTypeEnum:
      type: string
      description: |
        Specifies who can send inference requests to the serving endpoint:

        Possible values:
        - `public`: No authorization is required. (Default)
        - `authenticatedUsers`: Any NVIDIA Run:ai authenticated user and service account can send requests.
        - `authorizedUsers`: Only users listed in the authorizedUsers field can send requests.
        - `authorizedGroups`: Only members of user groups listed in the authorizedGroups field can send requests.
      enum:
        - public
        - authenticatedUsers
        - authorizedUsers
        - authorizedGroups
      nullable: true
    DistributedInferenceServingPortAccess:
      properties:
        authorizationType:
          $ref: '#/components/schemas/DistributedInferenceServingPortAccessAuthorizationTypeEnum'
        authorizedUsers:
          description: A list of users and service accounts allowed to send inference requests to the serving endpoint. `Note:` Cannot be used together with authorizedGroups.
          type: array
          items:
            type: string
            pattern: .*
          example:
            - user.a@example.com
            - user.b@example.com
          nullable: true
        authorizedGroups:
          description: A list of user groups allowed to send inference requests to the serving endpoint. `Note:` Cannot be used together with authorizedUsers.
          type: array
          items:
            type: string
            pattern: .*
          example:
            - group-a
            - group-b
          nullable: true
        exposeExternally:
          description: Indicates whether the inference serving endpoint should be accessible outside the cluster. If set to true, the endpoint will be exposed externally. To enable external access, your administrator must configure the cluster as described in the [inference requirements](/run-ai/self-hosted/documentation/installation-and-configuration/system-requirements/networking-setup#standard-inference-wildcard-certificate). section.
          type: boolean
          nullable: true
          default: true
        exposedUrl:
          description: The custom URL to use for the serving port. If empty (default), an autogenerated URL will be used.
          type: string
          nullable: true
          pattern: .*
    DistributedInferenceServingPort:
      description: Defines the configuration for the inference serving endpoint. This determines how applications or services can send inference requests to the workload.
      allOf:
        - $ref: '#/components/schemas/DistributedInferenceServingPortContainerAndProtocol'
        - $ref: '#/components/schemas/DistributedInferenceServingPortAccess'
      nullable: true
      type: object
    DistributedInferenceStartupPolicy:
      description: |
        Determines when the worker pods should start during workload initialization. 
         - `LeaderCreated`: Workers start after the leader pod is created.
         - `LeaderReady`: Workers start only after the leader pod is ready.
      type: string
      enum:
        - LeaderCreated
        - LeaderReady
      nullable: true
      default: LeaderCreated
    DistributedInferenceStartupPolicyField:
      properties:
        startupPolicy:
          $ref: '#/components/schemas/DistributedInferenceStartupPolicy'
      nullable: true
      type: object
    DistributedInferenceWorkersField:
      properties:
        workers:
          default: 0
          description: Specifies the number of worker nodes to run. If set to 0, only the leader node will run, and no worker pods will be created. In this case, worker spec is not required.
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          example: 4
          nullable: true
    DistributedInferenceReplicasField:
      properties:
        replicas:
          default: 1
          description: |
            Specifies the number of leader-worker sets to deploy. Each replica represents a group consisting of one leader pod and multiple worker pods. 
            For example, setting replicas: 3 will create 3 independent groups, each with its own leader and corresponding set of workers.
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          example: 2
          nullable: true
    DistributedInferenceCommonSpec:
      allOf:
        - nullable: true
          properties:
            category:
              $ref: '#/components/schemas/Category'
            nodePools:
              $ref: '#/components/schemas/NodePools'
            preemptibility:
              $ref: '#/components/schemas/Preemptibility'
            priorityClass:
              $ref: '#/components/schemas/PriorityClass'
            restartPolicy:
              $ref: '#/components/schemas/DistributedInferenceRestartPolicy'
            servingPort:
              $ref: '#/components/schemas/DistributedInferenceServingPort'
          type: object
        - $ref: '#/components/schemas/DistributedInferenceStartupPolicyField'
        - $ref: '#/components/schemas/DistributedInferenceWorkersField'
        - $ref: '#/components/schemas/DistributedInferenceReplicasField'
      nullable: true
      type: object
    MetricThresholdPercentageField:
      properties:
        metricThresholdPercentage:
          description: The percentage of metric threshold value to use for autoscaling. Defaults to 70. Applicable only with the 'throughput' and 'concurrency' metrics
          type: number
          format: float
          minimum: 1
          maximum: 100
          nullable: true
    InferencesMinReplicasField:
      properties:
        minReplicas:
          description: The minimum number of replicas for autoscaling. Defaults to 1. Use 0 to allow scale-to-zero
          type: integer
          format: int32
          minimum: 0
          nullable: true
    InferencesMaxReplicasField:
      properties:
        maxReplicas:
          description: The maximum number of replicas for autoscaling. Defaults to minReplicas, or to 1 if minReplicas is set to 0
          type: integer
          format: int32
          minimum: 1
          nullable: true
    InitialReplicasField:
      properties:
        initialReplicas:
          description: The number of replicas to run when initializing the workload for the first time. Defaults to minReplicas, or to 1 if minReplicas is set to 0
          type: integer
          format: int32
          minimum: 0
          nullable: true
    ActivationReplicasField:
      properties:
        activationReplicas:
          description: The number of replicas to run when scaling-up from zero. Defaults to minReplicas, or to 1 if minReplicas is set to 0
          type: integer
          format: int32
          minimum: 1
          nullable: true
    ConcurrencyHardLimitField:
      properties:
        concurrencyHardLimit:
          description: The maximum number of requests allowed to flow to a single replica at any time. 0 means no limit
          type: integer
          format: int32
          minimum: 0
          nullable: true
    ScaleToZeroRetentionField:
      properties:
        scaleToZeroRetentionSeconds:
          description: The minimum amount of time (in seconds) that the last replica will remain active after a scale-to-zero decision. Defaults to 0. Available only if minReplicas is set to 0
          type: integer
          format: int32
          minimum: 0
          maximum: 3600
          nullable: true
    ScaleDownDelayField:
      properties:
        scaleDownDelaySeconds:
          description: The minimum amount of time (in seconds) that a replica will remain active after a scale-down decision
          type: integer
          format: int32
          minimum: 0
          maximum: 3600
          nullable: true
    InitializationTimeoutField:
      properties:
        initializationTimeoutSeconds:
          description: Use `servingConfiguration.initializationTimeoutSeconds` instead.  If this field is set, it will be ignored and the value under `servingConfiguration` will be used. The maximum amount of time (in seconds) to wait for the container to become ready.
          type: integer
          format: int32
          minimum: 1
          nullable: true
          deprecated: true
    AutoScalingCommonFields:
      allOf:
        - $ref: '#/components/schemas/MetricThresholdPercentageField'
        - $ref: '#/components/schemas/InferencesMinReplicasField'
        - $ref: '#/components/schemas/InferencesMaxReplicasField'
        - $ref: '#/components/schemas/InitialReplicasField'
        - $ref: '#/components/schemas/ActivationReplicasField'
        - $ref: '#/components/schemas/ConcurrencyHardLimitField'
        - $ref: '#/components/schemas/ScaleToZeroRetentionField'
        - $ref: '#/components/schemas/ScaleDownDelayField'
        - $ref: '#/components/schemas/InitializationTimeoutField'
      nullable: true
      type: object
    AutoScalingMetric:
      description: The metric to use for autoscaling. Mandatory if minReplicas < maxReplicas, except for the special case where minReplicas is set to 0 and maxReplicas is set to 1, as in this case autoscaling decisions are made according to network activity rather than metrics. Use one of the built-in metrics of 'throughput', 'concurrency' or 'latency', or any other available custom metric. Only the 'throughput' and 'concurrency' metrics support scale-to-zero
      type: string
      pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
      example: http_requests_total
      nullable: true
    AutoScalingMetricField:
      properties:
        metric:
          $ref: '#/components/schemas/AutoScalingMetric'
    MetricThresholdField:
      properties:
        metricThreshold:
          description: The threshold to use with the specified metric for autoscaling. Mandatory if metric is specified
          type: integer
          format: int32
          nullable: true
    AutoScalingMetricFields:
      allOf:
        - $ref: '#/components/schemas/AutoScalingMetricField'
        - $ref: '#/components/schemas/MetricThresholdField'
      nullable: true
      type: object
    AutoScaling:
      allOf:
        - $ref: '#/components/schemas/AutoScalingCommonFields'
        - $ref: '#/components/schemas/AutoScalingMetricFields'
      nullable: true
      type: object
    AutoScalingField:
      properties:
        autoscaling:
          $ref: '#/components/schemas/AutoScaling'
    ServingConfiguration:
      description: The inference workload serving configuration.
      properties:
        initializationTimeoutSeconds:
          description: The maximum time (in seconds) allowed for a workload to initialize and become ready. If the workload does not start within this time, it will be moved to failed state.
          type: integer
          format: int32
          minimum: 1
          nullable: true
        requestTimeoutSeconds:
          description: The maximum time (in seconds) allowed to process an end-user request. If no response is returned within this time, the request will be ignored.Supported from Cluster version 2.22
          type: integer
          format: int32
          minimum: 1
          nullable: true
      nullable: true
      type: object
    ServingConfigurationField:
      properties:
        servingConfiguration:
          $ref: '#/components/schemas/ServingConfiguration'
    InferenceFields:
      allOf:
        - $ref: '#/components/schemas/AutoScalingField'
        - $ref: '#/components/schemas/ServingConfigurationField'
      nullable: true
      type: object
    CleanPodPolicy:
      description: The policy describes how to deal with pods when the job is finished.
      type: string
      enum:
        - None
        - All
        - Running
      nullable: true
    Completions:
      description: Used with Hyperparameter Optimization. Specifies the number of successful pods the job should reach to be completed. The Job will be marked as successful once the specified amount of pods has been reached (applicable to standard training only).
      type: integer
      format: int32
      example: 1
      nullable: true
    DistributedFramework:
      description: |
        The distributed training framework used in the workload.
        Note: The TF, XGBoost and JAX frameworks are deprecated and will be removed in a future release.
      type: string
      enum:
        - MPI
        - PyTorch
        - TF
        - XGBoost
        - JAX
      nullable: true
    MaxReplicas:
      description: the upper limit for the number of worker pods that can be set by the autoscaler. Cannot be smaller than MinReplicas. (applicable only for PyTorch)
      type: integer
      nullable: true
    MinReplicas:
      description: the lower limit for the number of worker pods to which the training job can scale down. (applicable only for PyTorch)
      type: integer
      nullable: true
    MpiLauncherCreationPolicy:
      description: Define whether the MPI Launcher is created in parallel with the workers, or if its creation is postponed until all workers are in  Ready state. This prevents failures when the launcher attempts to connect to workers that are not yet ready.
      type: string
      enum:
        - AtStartup
        - WaitForWorkersReady
      nullable: true
    NumWorkers:
      description: the number of workers that will be allocated for running the workload.
      type: integer
      minimum: 1
      nullable: true
    Parallelism:
      description: Used with Hyperparameter Optimization. Specifies the maximum number of pods the workload should run at any given time (applicable to standard training only).
      type: integer
      format: int32
      example: 1
      nullable: true
    SupersetRestartPolicy:
      type: string
      nullable: true
      minLength: 1
      pattern: .*
    SegmentSize:
      description: |
        The number of workers per topology segment.
        Workers in the same segment will be placed on nodes that are as close as possible, reducing latency between them.
        Set this to match your application's parallel segment size.
        Omit this field to disable segmentation.
      type: integer
      minimum: 1
      nullable: true
    SupersetServingPort:
      properties:
        port:
          type: integer
          format: int32
          nullable: true
        container:
          type: integer
          format: int32
          nullable: true
        protocol:
          type: string
          nullable: true
          pattern: .*
        authorizationType:
          type: string
          nullable: true
          pattern: .*
        authorizedUsers:
          type: array
          items:
            type: string
            pattern: .*
          nullable: true
        authorizedGroups:
          type: array
          items:
            type: string
            pattern: .*
          nullable: true
        clusterLocalAccessOnly:
          type: boolean
          nullable: true
        exposeExternally:
          type: boolean
          nullable: true
        exposedUrl:
          type: string
          nullable: true
          pattern: .*
      type: object
      nullable: true
    SlotsPerWorker:
      description: Specifies the number of slots per worker used in hostfile. Defaults to 1. (applicable only for MPI)
      type: integer
      minimum: 1
      nullable: true
      default: 1
    SshAuthMountPath:
      description: Specifies the directory where SSH keys are mounted. (applicable only for MPI)
      type: string
      nullable: true
      default: /root/.ssh
      pattern: .*
    SupersetSpec:
      allOf:
        - $ref: '#/components/schemas/DistributedInferenceLeaderSpecFields'
        - $ref: '#/components/schemas/DistributedInferenceWorkerSpecFields'
        - $ref: '#/components/schemas/DistributedInferenceCommonSpec'
        - $ref: '#/components/schemas/InferenceFields'
        - nullable: true
          properties:
            annotations:
              $ref: '#/components/schemas/Annotations'
            args:
              $ref: '#/components/schemas/Args'
            autoDeletionTimeAfterCompletionSeconds:
              $ref: '#/components/schemas/AutoDeletionTimeAfterPreemption'
            backoffLimit:
              $ref: '#/components/schemas/BackoffLimit'
            category:
              $ref: '#/components/schemas/Category'
            cleanPodPolicy:
              $ref: '#/components/schemas/CleanPodPolicy'
            command:
              $ref: '#/components/schemas/Command'
            completions:
              $ref: '#/components/schemas/Completions'
            compute:
              nullable: true
              properties:
                cpuCoreLimit:
                  $ref: '#/components/schemas/CpuCoreLimit'
                cpuCoreRequest:
                  $ref: '#/components/schemas/CpuCoreRequest'
                cpuMemoryLimit:
                  $ref: '#/components/schemas/CpuMemoryLimit'
                cpuMemoryRequest:
                  $ref: '#/components/schemas/CpuMemoryRequest'
                extendedResources:
                  $ref: '#/components/schemas/ExtendedResources'
                gpuComputeMode:
                  $ref: '#/components/schemas/GpuComputeMode'
                gpuDevicesRequest:
                  $ref: '#/components/schemas/GpuDevicesRequest'
                gpuMemoryLimit:
                  $ref: '#/components/schemas/GpuMemoryLimit'
                gpuMemoryPortionLimit:
                  $ref: '#/components/schemas/GpuMemoryPortionLimit'
                gpuMemoryPortionRequest:
                  $ref: '#/components/schemas/GpuMemoryPortionRequest'
                gpuMemoryRequest:
                  $ref: '#/components/schemas/GpuMemoryRequest'
                gpuPortionLimit:
                  $ref: '#/components/schemas/GpuPortionLimit'
                gpuPortionRequest:
                  $ref: '#/components/schemas/GpuPortionRequest'
                gpuRequestType:
                  $ref: '#/components/schemas/GpuRequestType'
                largeShmRequest:
                  $ref: '#/components/schemas/LargeShmRequest'
              type: object
            createHomeDir:
