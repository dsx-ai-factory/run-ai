                          type: string
                          description: IP address of the ingress point.
                        hostname:
                          type: string
                          description: Hostname of the ingress point.
              urls:
                type: array
                description: URLs reachable through this service.
                items:
                  type: object
                  description: URL object containing the reachable URL and its source resource.
                  properties:
                    url:
                      type: string
                      example: https://service1.example.com/
                      description: URL reachable through this service.
                    sourceKind:
                      type: string
                      example: Ingress
                      description: Kubernetes resource kind that produced the URL.
                    sourceName:
                      type: string
                      example: service1-ingress
                      description: Kubernetes resource name that produced the URL.
    OrgType:
