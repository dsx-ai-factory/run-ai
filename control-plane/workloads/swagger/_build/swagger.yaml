      type: array
      description: List of ids to perform the action on.
      items:
        type: string
        format: uuid
        description: Id to perform the action on.
      minLength: 1
    Action:
      type: string
      description: The action to perform on the list of ids.
      enum:
        - delete
        - suspend
        - resume
    WorkloadBatch:
      type: object
      description: The ids and action to perform on a batch of workloads. The number of ids is limited to 100.
      required:
        - ids
        - action
      properties:
        ids:
          $ref: '#/components/schemas/IdsList'
        action:
          $ref: '#/components/schemas/Action'
    BatchId:
      type: string
      format: uuid
      description: The ID of the batch operation.
    ErrorCode:
      type: integer
      format: int32
      description: A numeric code representing the error type.
    ErrorMessage:
      type: string
      description: The error message.
    BatchResponseFailureItem:
      type: object
      required:
        - id
        - code
        - message
      properties:
        id:
          type: string
          format: uuid
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          $ref: '#/components/schemas/ErrorMessage'
    BatchResponse:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/BatchId'
        succeeded:
          $ref: '#/components/schemas/IdsList'
        failed:
          type: array
          description: The IDs that failed to update.
          items:
            $ref: '#/components/schemas/BatchResponseFailureItem'
    WorkloadElementsResponse:
      type: object
      required:
        - elements
      properties:
        next:
          type: integer
          format: int32
          description: |
            Offset for the next page of results. Present only when there are more elements beyond the current page (i.e., the number of returned elements equals the limit).
        elements:
          type: array
          description: |
            A flat list of structure elements for this workload, ordered by hierarchy level. This page may contain fewer elements than are stored in the database — use the "next" field to retrieve additional pages. Use the /elements/count endpoint to retrieve total and stored counts.
          items:
            $ref: '#/components/schemas/WorkloadElement'
    WorkloadElementResponse:
      allOf:
        - $ref: '#/components/schemas/WorkloadElement'
        - type: object
          required:
            - podsRequestedResources
            - allocatedResources
          properties:
            podsRequestedResources:
              $ref: '#/components/schemas/WorkloadRequestResources'
            allocatedResources:
              $ref: '#/components/schemas/WorkloadAllocatedResources'
    ElementMetricType:
      type: string
      description: Specify which metric data to request for an element.
      enum:
        - GPU_UTILIZATION
        - GPU_ALLOCATION
        - GPU_MEMORY_USAGE_BYTES
        - GPU_MEMORY_REQUEST_BYTES
        - CPU_USAGE_CORES
        - CPU_REQUEST_CORES
        - CPU_LIMIT_CORES
        - CPU_MEMORY_USAGE_BYTES
        - CPU_MEMORY_REQUEST_BYTES
        - CPU_MEMORY_LIMIT_BYTES
    ResourceClaimTemplateRef:
      description: The ResourceClaimTemplate the claim was generated from. Absent for a standalone ResourceClaim that the pod references directly.
      nullable: true
      type: object
      required:
        - name
        - managed
      properties:
        name:
          type: string
          description: Name of the ResourceClaimTemplate in the pod's namespace.
          example: single-gpu
        managed:
          type: boolean
          description: Whether the template is managed by NVIDIA Run:ai (created through the resource claim templates API) rather than created directly in the cluster.
        id:
          type: string
          format: uuid
          nullable: true
          description: The id of the managed resource claim template. Null for an unmanaged template.
