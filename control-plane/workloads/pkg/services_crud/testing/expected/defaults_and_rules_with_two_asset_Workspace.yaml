policyInfo:
  worker:
    defaults:
      compute:
        cpuCoreLimit: 5
        extendedResources:
          attributes:
            quantity: 20M
          instances:
          - resource: aaa/bbb
          - quantity: 10M
            resource: ccc/ddd
      image: ubuntu
      storage:
        pvc:
          attributes:
            claimInfo:
              size: 1M
              storageClass: standard
          instances:
          - path: /aaa/bbb
    rules:
      image:
        required: true
      storage:
        pvc:
          attributes:
            claimInfo:
              storageClass:
                canEdit: false
          instances:
            canAdd: false
      workingDir:
        required: true
projectInfo:
  name: project-1
spec:
  worker:
    compute:
      cpuCoreLimit: 5
      extendedResources:
      - quantity: 20M
        resource: aaa/bbb
      - quantity: 10M
        resource: ccc/ddd
      largeShmRequest: true
    environmentVariables:
    - name: env_name_from_asset
      value: env_value_from_asset
    image: image_from_asset
    storage:
      pvc:
      - claimInfo:
          size: 1M
          storageClass: standard
        name: pol-0
        path: /aaa/bbb
