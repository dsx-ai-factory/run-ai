      - description: "The tenant Id of the current request, overrides the tenantId\
          \ in the header."
        explode: true
        in: query
        name: overrideTenantId
        required: false
        schema:
          example: 123
          format: int32
          type: integer
        style: form
        x-internal: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricInformation'
        description: Requested Metric Information
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getMetrics_200_response'
          description: Metric data.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "404":
          content:
            application/json:
              example:
                code: 404
                message: Resource id not found.
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource was not found
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "501":
          content:
            application/json:
              example:
                code: 501
                message: Not implemented
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get metrics.
      tags:
      - Metrics
      x-service: metrics-service
      x-test-coverage:
      - metrics-service/integration-tests/tests/metric_test.go
      x-no-authorization: true
  /internal/reports:
    get:
      operationId: list_reports
      parameters:
      - description: "Filter results by a parameter. Use the format field-name operator\
          \ value. Operators are == Equals, != Not equals, <= Less than or equal,\
          \ >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts\
          \ with and =$ Ends with. Dates are in ISO 8601 timestamp format and available\
          \ for operators ==, !=, <= and >=."
        explode: false
        in: query
        name: filterBy
        required: false
        schema:
          example:
          - name!=some-name
          items:
            pattern: ^(name|createdAt|createdBy|status)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
            type: string
          maxItems: 10
          type: array
        style: form
      - description: Sort results by a parameters.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          $ref: '#/components/schemas/ReportFilterAndSortFields'
        style: form
      - description: Sort results in descending or ascending order.
        explode: true
        in: query
        name: sortOrder
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: The offset of the first item returned in the collection.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          example: 100
          format: int32
          type: integer
        style: form
      - description: The maximum number of entries to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: int32
          maximum: 500
          minimum: 1
          type: integer
        style: form
      - description: Filter results by a free text search.
        explode: true
        in: query
        name: search
        required: false
        schema:
          example: test project
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list_reports_200_response'
          description: Executed successfully.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: List reports
      tags:
      - Reports
      x-no-authorization: true
      x-service: metrics-service
      x-test-coverage:
      - metrics-service/integration-tests/tests/report_test.go
    post:
      operationId: create_report
      requestBody:
