get:
  summary: count reports
  operationId: count_reports
  x-internal: true
  x-no-authorization: true
  x-service: metrics-service
  x-test-coverage:
    - metrics-service/integration-tests/tests/report_test.go
  tags:
    - Reports
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/ReportsFilterBy.yaml"
    - $ref: '../../../../infra/openapi/docs/parameters/query/optional/Search.yaml'
  responses:
    '200':
      description: Executed successfully.
      content:
        application/json:
          schema:
            type: object
            required:
              - count
            properties:
              count:
                type: integer
                format: int64
                example: 1
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'