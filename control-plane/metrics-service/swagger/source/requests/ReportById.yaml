get:
  summary: Get report
  operationId: get_report_by_id
  x-internal: true
  x-no-authorization: true
  x-service: metrics-service
  x-test-coverage:
    - metrics-service/integration-tests/tests/report_test.go
  tags:
    - Reports
  parameters:
    - $ref: '../../../../infra/openapi/docs/parameters/path/ReportId.yaml'
  responses:
    '200':
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../schemas/Report.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
delete:
  summary: Delete report
  operationId: delete_report_by_id
  x-internal: true
  x-no-authorization: true
  x-service: metrics-service
  x-test-coverage:
    - metrics-service/integration-tests/tests/report_test.go
  tags:
    - Reports
  parameters:
    - $ref: '../../../../infra/openapi/docs/parameters/path/ReportId.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'