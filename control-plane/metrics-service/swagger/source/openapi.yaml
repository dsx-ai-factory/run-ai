openapi: 3.0.3
info:
  title: Metrics
  version: '1.0'
  description: An API for querying metrics
  contact:
    name: Run.AI
    url: https://www.run.ai/
    email: support@run.ai
servers:
  - url: https://app.run.ai
  - url: https://staging.run.ai
  - url: https://test.run.ai
  - url: http://localhost:8080
paths:
  /:
    get:
      x-internal: true
      x-service: metrics-service
      summary: health check
      operationId: health
      x-no-authorization: true
      tags:
        - Health
      responses:
        '200':
          description: Executed successfully.

  '/internal/metrics':
    $ref: "./requests/Metrics.yaml"

  '/internal/reports':
    $ref: "./requests/Reports.yaml"

  '/internal/reports/count':
    $ref: "./requests/ReportsCount.yaml"

  '/internal/reports/{reportId}':
    $ref: "./requests/ReportById.yaml"
  '/internal/reports/batch-delete':
    $ref: "./requests/ReportsBatchDelete.yaml"
  '/internal/reports/batch-get':
    $ref: "./requests/ReportsBatchGet.yaml"

  '/internal/metric-stores':
    $ref: "./requests/MetricStores.yaml"
    
components:
  schemas:
    $ref: "./schemas/_index.yaml"
  responses:
    $ref: "../../../infra/openapi/docs/responses/_index.yaml"
  securitySchemes:
    $ref: "./securitySchemes/_index.yaml"
security:
- bearerAuth: []