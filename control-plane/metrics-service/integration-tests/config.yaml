log_level: debug
use_mocks: true
service_name: metrics-service
reports:
  processor_run_interval_sec: 2
  s3_config:
    bucket: metrics-service
datasources:
  datasource_url: http://prometheus:9090
metrics:
  example_metric:
    cross_version_query: sum(example_metric_new{FILTERS}) by(clusterId) or sum(example_metric_old{FILTERS}) by(clusterId)
    queries:
      2.12.0: sum(example_metric_new{FILTERS}) by(clusterId)
      2.11.0: sum(example_metric_old{FILTERS}) by(clusterId)
  example_metric_aggregation:
    cross_version_query: sum(sum_over_time(example_metric_new{FILTERS}[RANGE])) by(clusterId)
    queries:
      2.12.0: sum(sum_over_time(example_metric_new{FILTERS}[RANGE])) by(clusterId)
  example_metric_quantile:
    cross_version_query: histogram_quantile(QUANTILE, sum(rate(example_metric_histogram_bucket{FILTERS}[RANGE])) by (le, clusterId))
    queries:
      2.12.0: histogram_quantile(QUANTILE, sum(rate(example_metric_histogram_bucket{FILTERS}[RANGE])) by (le, clusterId))
  # vLLM token usage keys, copied verbatim from control-plane-chart/templates/metrics-service/configmap.yaml.
  runai_vllm_prompt_tokens_total_per_workload:
    cross_version_query: round(sum by (workload_id) (increase(runai_vllm_prompt_tokens_total_per_pod{FILTERS}[RANGE])))
    queries:
      3.1.0: round(sum by (workload_id) (increase(runai_vllm_prompt_tokens_total_per_pod{FILTERS}[RANGE])))
  runai_vllm_generation_tokens_total_per_workload:
    cross_version_query: round(sum by (workload_id) (increase(runai_vllm_generation_tokens_total_per_pod{FILTERS}[RANGE])))
    queries:
      3.1.0: round(sum by (workload_id) (increase(runai_vllm_generation_tokens_total_per_pod{FILTERS}[RANGE])))
  runai_vllm_prompt_tokens_cached_total_per_workload:
    cross_version_query: round(sum by (workload_id) (increase(runai_vllm_prompt_tokens_cached_total_per_pod{FILTERS}[RANGE])))
    queries:
      3.1.0: round(sum by (workload_id) (increase(runai_vllm_prompt_tokens_cached_total_per_pod{FILTERS}[RANGE])))
  runai_vllm_finished_engine_request_count_per_workload:
    cross_version_query: round(sum by (workload_id) (increase(runai_vllm_request_prompt_tokens_count_per_pod{FILTERS}[RANGE])))
    queries:
      3.1.0: round(sum by (workload_id) (increase(runai_vllm_request_prompt_tokens_count_per_pod{FILTERS}[RANGE])))
  runai_vllm_prompt_tokens_per_request_avg_per_workload:
    cross_version_query: sum by (workload_id) (increase(runai_vllm_request_prompt_tokens_sum_per_pod{FILTERS}[RANGE])) / (sum by (workload_id) (increase(runai_vllm_request_prompt_tokens_count_per_pod{FILTERS}[RANGE])) > 0)
    queries:
      3.1.0: sum by (workload_id) (increase(runai_vllm_request_prompt_tokens_sum_per_pod{FILTERS}[RANGE])) / (sum by (workload_id) (increase(runai_vllm_request_prompt_tokens_count_per_pod{FILTERS}[RANGE])) > 0)
  runai_vllm_prompt_tokens_per_request_percentile_per_workload:
    cross_version_query: (label_replace(histogram_quantile(0.50, sum by (le, workload_id) (increase(runai_vllm_request_prompt_tokens_bucket_per_pod{FILTERS}[RANGE]))), "quantile_label", "50", "ignored_src_label", ".*") or label_replace(histogram_quantile(0.95, sum by (le, workload_id) (increase(runai_vllm_request_prompt_tokens_bucket_per_pod{FILTERS}[RANGE]))), "quantile_label", "95", "ignored_src_label", ".*") or label_replace(histogram_quantile(0.99, sum by (le, workload_id) (increase(runai_vllm_request_prompt_tokens_bucket_per_pod{FILTERS}[RANGE]))), "quantile_label", "99", "ignored_src_label", ".*")) and on (workload_id) (sum by (workload_id) (increase(runai_vllm_request_prompt_tokens_count_per_pod{FILTERS}[RANGE])) > 0)
    queries:
      3.1.0: (label_replace(histogram_quantile(0.50, sum by (le, workload_id) (increase(runai_vllm_request_prompt_tokens_bucket_per_pod{FILTERS}[RANGE]))), "quantile_label", "50", "ignored_src_label", ".*") or label_replace(histogram_quantile(0.95, sum by (le, workload_id) (increase(runai_vllm_request_prompt_tokens_bucket_per_pod{FILTERS}[RANGE]))), "quantile_label", "95", "ignored_src_label", ".*") or label_replace(histogram_quantile(0.99, sum by (le, workload_id) (increase(runai_vllm_request_prompt_tokens_bucket_per_pod{FILTERS}[RANGE]))), "quantile_label", "99", "ignored_src_label", ".*")) and on (workload_id) (sum by (workload_id) (increase(runai_vllm_request_prompt_tokens_count_per_pod{FILTERS}[RANGE])) > 0)
  runai_vllm_generation_tokens_per_request_avg_per_workload:
    cross_version_query: sum by (workload_id) (increase(runai_vllm_request_generation_tokens_sum_per_pod{FILTERS}[RANGE])) / (sum by (workload_id) (increase(runai_vllm_request_generation_tokens_count_per_pod{FILTERS}[RANGE])) > 0)
    queries:
      3.1.0: sum by (workload_id) (increase(runai_vllm_request_generation_tokens_sum_per_pod{FILTERS}[RANGE])) / (sum by (workload_id) (increase(runai_vllm_request_generation_tokens_count_per_pod{FILTERS}[RANGE])) > 0)
  runai_vllm_generation_tokens_per_request_percentile_per_workload:
    cross_version_query: (label_replace(histogram_quantile(0.50, sum by (le, workload_id) (increase(runai_vllm_request_generation_tokens_bucket_per_pod{FILTERS}[RANGE]))), "quantile_label", "50", "ignored_src_label", ".*") or label_replace(histogram_quantile(0.95, sum by (le, workload_id) (increase(runai_vllm_request_generation_tokens_bucket_per_pod{FILTERS}[RANGE]))), "quantile_label", "95", "ignored_src_label", ".*") or label_replace(histogram_quantile(0.99, sum by (le, workload_id) (increase(runai_vllm_request_generation_tokens_bucket_per_pod{FILTERS}[RANGE]))), "quantile_label", "99", "ignored_src_label", ".*")) and on (workload_id) (sum by (workload_id) (increase(runai_vllm_request_generation_tokens_count_per_pod{FILTERS}[RANGE])) > 0)
    queries:
      3.1.0: (label_replace(histogram_quantile(0.50, sum by (le, workload_id) (increase(runai_vllm_request_generation_tokens_bucket_per_pod{FILTERS}[RANGE]))), "quantile_label", "50", "ignored_src_label", ".*") or label_replace(histogram_quantile(0.95, sum by (le, workload_id) (increase(runai_vllm_request_generation_tokens_bucket_per_pod{FILTERS}[RANGE]))), "quantile_label", "95", "ignored_src_label", ".*") or label_replace(histogram_quantile(0.99, sum by (le, workload_id) (increase(runai_vllm_request_generation_tokens_bucket_per_pod{FILTERS}[RANGE]))), "quantile_label", "99", "ignored_src_label", ".*")) and on (workload_id) (sum by (workload_id) (increase(runai_vllm_request_generation_tokens_count_per_pod{FILTERS}[RANGE])) > 0)
cleaner:
  is_cleanup_enabled: true
  cleaner_interval_hours: 12
  delete_report_ttl_days: 90
cron_jobs:
  reports:
    interval_seconds: 2
    max_retry_count: 1
    retry_failed_reports_min_age_minutes: 0
    retry_failed_reports_max_age_minutes: 30
    fail_stuck_processing_reports_min_age_minutes: 30