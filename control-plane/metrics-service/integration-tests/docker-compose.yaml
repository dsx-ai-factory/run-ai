version: '3.8'

services:
  metrics-integration-test:
    profiles:
      - run-tests
    build:
      context: ../
      dockerfile: ./integration-tests/Dockerfile
    depends_on:
      metrics-service:
        condition: service_healthy
    volumes:
      - ./secrets:/etc/secrets
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=runai
      - DB_SCHEMA=metrics
      - PUBSUB_TYPE=redis
      - PUBSUB_URL=redis:6379
      - PROMETHEUS_HOST=prometheus
      - SERVICE_NAME=metrics-service-integration-tests
      - METRICS_SERVER_HOST=metrics-service:8080
      - SECRETS_MOUNT_PATH=/etc/secrets
      - S3_ENDPOINT=minio:9000
      # The metrics-service container migrates the shared DB; the test process
      # must not run migrations (it has no migration files mounted).
      - DB_MIGRATION_AUTO=false
    links:
      - metrics-service
      - prometheus

  metrics-service:
    profiles:
      - run-setup
    build: ../
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ${CONFIG_FILE:-./config.yaml}:/config.yaml
      - ./secrets:/etc/secrets
    environment:
      - CONF_PATH=/config.yaml
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=runai
      - DB_SCHEMA=metrics
      - SECRETS_MOUNT_PATH=/etc/secrets
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - LOG_LEVEL=debug
      - CONFIG_KEY_DELIMITER=;
      - PUBSUB_TYPE=redis
      - PUBSUB_URL=redis:6379
      - CACHE_TYPE=redis
      - CACHE_URL=redis:6379
      - SERVICE_NAME=metrics-service
      - CRON_JOBS_REPORTS_FAIL_STUCK_DELETING_REPORTS_MIN_AGE_MINUTES=3

    healthcheck:
      test: ["CMD", "/metrics-service", "--health"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 2s
    ports: 
      - 8080:8080
    links:
      - prometheus
      - postgres

  postgres:
    profiles:
      - run-setup
    image: postgres:18.6
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: runai
      POSTGRES_PASSWORD: admin
    ports:
      - 5432:5432
    expose:
      - 5432
    volumes:
      - ./config/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    profiles:
      - run-setup
    build: ./prometheus-with-agent
    volumes:
      - ./prometheus.yaml:/prometheus.yaml
    command:
      - '--config.file=/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus/data'
      - '--web.enable-admin-api'
      - '--log.level=debug'
    ports:
      - 9090:9090
      - ${AGENT_PORT:-8090}:${AGENT_PORT:-8090}  # For promtool agent

  minio:
    profiles:
      - run-setup
    image: quay.io/minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"    # Exposing MinIO API port
      - "9001:9001"    # Exposing MinIO Console port
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    entrypoint: >
      /bin/sh -c "
        minio server /data --console-address ":9001" & 
        sleep 5;
        echo 'Waiting for MinIO to be ready...';
        mc alias set temp http://localhost:9000 minioadmin minioadmin &&
        if ! mc ls temp/metrics-service; then mc mb temp/metrics-service; fi &&
        mc alias rm temp;
        wait
      "
    restart: always
    
  redis:
    container_name: redis
    profiles:
      - run-setup
    image: redis:8.10-alpine
    ports:
      - '6379:6379'
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
