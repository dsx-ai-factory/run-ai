type: object
required:
- name
- realm

properties:
  name:
    type: string
    pattern: "^[a-z][-_a-z0-9]*[a-z0-9]$" # Lowercase alphanumeric with hyphens, must start and end with a letter
    description: The name of the service account. The name must be unique within the organization and can only contain lowercase alphanumeric characters and hyphens. It must start and end with a letter.
    minLength: 2
    maxLength: 255
  realm:
    type: string
    description: The realm in which to create the service account
    minLength: 1
    maxLength: 255

example:
  name: "service-account-123"
  realm: "realm"
