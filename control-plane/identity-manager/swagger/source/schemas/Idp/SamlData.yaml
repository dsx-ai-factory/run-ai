type: object
nullable: true
required:
- validateSignature

properties:
  signingCertificate:
    type: string
  singleSignOnServiceUrl:
    type: string
  entityId:
    type: string
  serviceProviderMetadataUrl:
    type: string
    description: "Service Provider (SP) metadata url"
  validateSignature:
    type: boolean
    description: "Whether the signature of SAML responses from the identity provider is validated"
