type: object
nullable: true
required:
- claim
- values

properties:
  claim:
    type: string
    pattern: '.*[a-zA-Z].*'
    minLength: 1
    maxLength: 255
  values:
    type: array
    minItems: 1
    maxItems: 100
    items:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^(?!.*\s).*?[a-zA-Z].*$'
