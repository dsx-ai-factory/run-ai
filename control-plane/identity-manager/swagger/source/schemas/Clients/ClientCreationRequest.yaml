ClientCreationRequest:
  type: object
  x-internal: true
  required:
  - type
  - clientId

  properties:
    type:
      $ref: '#/ClientType'
    clientId:
      type: string
    tenantId:
      type: string
    attributes:
      $ref: './ClientAttributeCreationRequest.yaml'


  example:
    clientId: "Agent123"
    type: "Agent"
    tenantId: "1234567"
    attributes: {"runai.cluster_id": "123"}

ClientType:
  type: string
  description: >-
    The kind of client to create. Application is a deprecated alias of ServiceAccount and is kept so
    existing callers keep working; use ServiceAccount.
  enum:
  - Agent
  - WorkloadsAuth
  - Installer
  - ServiceAccount
  - Application