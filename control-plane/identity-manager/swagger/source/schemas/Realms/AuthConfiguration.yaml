type: object
required:
- tenantName
- authClientID
- authHost
- isMultiTenant
- redirectUrl
properties:
  tenantName:
    type: string
  authClientID:
    type: string
  authHost:
    type: string
  isMultiTenant:
    type: boolean
  redirectUrl:
    type: string
example:
  tenantName: mytest
  authClientID: runai-admin-ui
  authHost: http://localhost:8080
  isMultiTenant: false
  redirectUrl: http://localhost:8080
