get:
  summary: Get external idp by alias
  x-service: identity-manager
  x-test-coverage:
  - e2e/src/test/suites/ssoSuite/IDP/idpApi.test.ts
  operationId: get_idp
  x-authorize:
    resource-type: security-settings
    action: read
  tags:
  - Idps
  parameters:
  - $ref: '../../parameters/idp.yaml'
  - $ref: "../../../../../infra/openapi/docs/parameters/query/optional/TenantId.yaml"
  responses:
    '200':
      description: Executed successfully.
      content:
        application/json:
          examples:
            saml:
              value:
                alias: "saml"
                type: "saml"
                redirectUri: "https://domain/auth/realms/name/broker/saml/endpoint"
                samlData: { signingCertificate: "signingCertificateExample", singleSignOnServiceUrl: "https://authhost/protocol/saml", entityId: "example.run.ai/runai", serviceProviderMetadataUrl: "https://example.runai.com/auth/realms/runai/broker/saml/endpoint/descriptor" }
                mappers: { "gid": "GID", "groups": "GROUPS", "supplementaryGroups": "SUPPLEMENTARYGROUPS", "uid": "UID", "email": "email" }
            oidc:
              value:
                alias: "oidc"
                type: "oidc"
                redirectUri: "https://domain/auth/realms/name/broker/oidc/endpoint"
                oidcData: { clientId: "my-client-id", clientSecret: "*******", scopes: [ "scope1", "scope2" ], mandatoryClaim: { claim: "my-claim", values: [ "val1", "val2" ] } }
                mappers: { "gid": "GID", "groups": "GROUPS", "supplementaryGroups": "SUPPLEMENTARYGROUPS", "uid": "UID", "email": "email" }
            openshift-v4:
              value:
                alias: "openshift-v4"
                type: "openshift-v4"
                redirectUri: "https://domain/auth/realms/name/broker/openshift-v4/endpoint"
                ocpData: { clientId: "my-client-id", clientSecret: "*******", idpBaseUrl: "https://authhost/ocp", scopes: [ "scope1", "scope2" ] }
                mappers: { "gid": "metadata.gid", "groups": "groups", "supplementaryGroups": "supplementarygroups", "uid": "metadata.uid", "email": "metadata.name" }
    '401':
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    '403':
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    '404':
      $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
    '500':
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    '503':
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
