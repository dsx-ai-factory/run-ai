get:
  tags:
  - OpenID Connect
  summary: OpenID Connect Discovery
  x-service: identity-manager
  x-test-coverage:
  - pkg/services/api_openid_configuration_service_test.go
  - integration-tests/tests/api_token_test.go
  description: |
    Returns the OpenID Connect discovery document containing metadata about the OAuth2/OIDC provider.
    This endpoint follows RFC 8414 (OAuth 2.0 Authorization Server Metadata) and OpenID Connect Discovery 1.0.
  operationId: get_openid_configuration
  x-no-authorization: true
  responses:
    '200':
      description: OpenID Connect Discovery Document
      content:
        application/json:
          schema:
            $ref: '../schemas/OpenIDConfiguration.yaml'
          examples:
            discovery:
              value:
                issuer: "http://localhost:8080"
                authorization_endpoint: "http://localhost:8080/api/v1/login"
                token_endpoint: "http://localhost:8080/api/v2/token"
                jwks_uri: "http://localhost:8080/auth/realms/runai/protocol/openid-connect/certs"
                response_types_supported: ["code", "token", "id_token"]
                subject_types_supported: ["public"]
                id_token_signing_alg_values_supported: ["RS256"]
                grant_types_supported: ["authorization_code", "client_credentials", "refresh_token", "password"]
                token_endpoint_auth_methods_supported: ["client_secret_post", "client_secret_basic"]
                scopes_supported: ["openid", "profile", "email"]
    '500':
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    '503':
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'

