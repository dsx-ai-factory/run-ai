post:
  summary: Regenerate an access key secret.
  description: Use to regenerate the access key secret by id.
  x-service: identity-manager
  operationId: regenerate_access_key_secret
  x-audit: true
  x-no-authorization: true
  x-test-coverage:
  - integration-tests/tests/api_access_keys_test.go
  - pkg/services/api_access_keys_service_test.go
  - e2e/src/test/suites/parallel/personalApplications/crudUserApplication.test.ts
  - e2e/src/test/suites/parallel/personalApplications/userApplicationUi.test.ts
  - e2e/src/test/suites/parallel/personalApplications/userAppStatusCodes.test.ts
  tags:
  - Access Keys
  parameters:
  - $ref: "../../parameters/accessKeyId.yaml"
  responses:
    '200':
      description: Regenerated successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              clientSecret:
                type: string
                description: Secret credential paired with the client ID. Used to obtain authentication tokens.
            example:
              clientSecret: "this-is-my-secret"
    '400':
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    '401':
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    '403':
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    '404':
      $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
    '500':
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    '503':
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'

