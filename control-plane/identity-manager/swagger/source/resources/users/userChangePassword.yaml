post:
  summary: change user password
  x-service: identity-manager
  x-test-coverage:
  - src/test/suites/parallel/users/resetPasswordLocalUser.test.ts
  operationId: change_user_password
  x-no-authorization: true
  x-audit: true
  tags:
  - Users
  requestBody:
    description: Password to change
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/Users/UserChangePasswordRequest.yaml'
  responses:
    '200':
      description: Password changed successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              currentPassword:
                type: string
              newPassword:
                type: string
            example:
              tempPassword: "<temporary-password>"
    '400':
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    '401':
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    '403':
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    '404':
      $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
    '500':
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    '503':
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
