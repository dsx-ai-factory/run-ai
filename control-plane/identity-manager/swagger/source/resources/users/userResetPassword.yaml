post:
  summary: Reset a user's password.
  description: Use to reset a user's password.
  x-service: identity-manager
  x-test-coverage:
  - src/test/suites/parallel/users/usersPassword.test.ts
  operationId: reset_user_password
  x-authorize:
    resource-type: users
    action: update
    resource-id: userId
  x-audit: true
  tags:
  - Users
  parameters:
  - $ref: '../../parameters/userId.yaml'
  responses:
    '200':
      description: Regenerated successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              tempPassword:
                type: string
            example:
              tempPassword: "asdasidjn9d"
    '400':
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    '401':
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    '403':
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    '404':
      $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
    '500':
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    '503':
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
