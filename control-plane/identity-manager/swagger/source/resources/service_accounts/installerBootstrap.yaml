post:
  summary: Mint a short-lived bootstrap JWT for the installer service account.
  description: |
    Returns a 2-hour Keycloak access token for the cluster's dedicated
    per-cluster installer service account, scoped to the given cluster.
    Called by cluster-service when generating the cluster install command.
    The token is passed to the Helm hook as
    --set controlPlane.bootstrapToken=<token> and used directly as a Bearer token
    to call GET /clusters/{uuid}/control-plane-config — the installer client
    secret never leaves the server.

    The per-cluster installer client is resolved (and, if needed,
    self-healed by creating it) internally, so callers only need to say
    which cluster the token is for.
  x-service: identity-manager
  x-test-coverage: not-applicable
  operationId: mint_installer_bootstrap_token
  x-no-authorization: true
  tags:
    - Service Accounts
  parameters:
    - $ref: "../../../../../infra/openapi/docs/parameters/query/optional/TenantId.yaml"
    - $ref: "../../../../../infra/openapi/docs/parameters/query/mandatory/ClusterIdRequired.yaml"
  responses:
    '200':
      description: Bootstrap token minted successfully.
      content:
        application/json:
          schema:
            $ref: '../../schemas/ServiceAccounts/InstallerBootstrapResponse.yaml'
    '500':
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    '503':
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
