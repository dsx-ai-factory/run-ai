get:
  summary: Get a list of service accounts.
  description: Retrieve a list of service accounts.
  x-service: identity-manager
  x-test-coverage:
  - src/test/suites/parallel/applicationsV2/applicationsApi.test.ts
  - src/test/suites/sphinxSuite/apps.test.ts
  operationId: get_service_accounts
  x-authorize:
    resource-type: service-account
    action: read
  tags:
  - Service Accounts
  responses:
    '200':
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../../schemas/ServiceAccounts/ServiceAccounts.yaml'
    '400':
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    '401':
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    '403':
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    '404':
      $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
    '500':
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    '503':
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
post:
  summary: Create a service account.
  description: Used to create a service account.
  x-service: identity-manager
  x-test-coverage:
  - src/test/suites/parallel/applicationsV2/applicationsApi.test.ts
  operationId: create_service_account
  x-authorize:
    resource-type: service-account
    action: create
  x-audit: true
  tags:
  - Service Accounts
  requestBody:
    description: Service account object to create
    required: true
    content:
      application/json:
        schema:
          $ref: '../../schemas/ServiceAccounts/ServiceAccountCreationRequest.yaml'
  responses:
    '201':
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../../schemas/ServiceAccounts/ServiceAccountPostResponse.yaml'
    '400':
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    '401':
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    '403':
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    '404':
      $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
    '409':
      $ref: '../../../../../infra/openapi/docs/responses/409Conflict.yaml'
    '500':
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    '503':
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'

