get:
  summary: Get service account by id.
  description: Retrieve the details of a service account by id.
  x-service: identity-manager
  x-test-coverage:
  - src/test/suites/parallel/applicationsV2/applicationsApi.test.ts
  operationId: get_service_account_by_id
  x-authorize:
    resource-type: service-account
    action: read
    resource-id: serviceAccountId
  tags:
  - Service Accounts
  parameters:
  - $ref: "../../parameters/serviceAccountId.yaml"
  responses:
    200:
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../../schemas/ServiceAccounts/ServiceAccount.yaml'
    400:
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
