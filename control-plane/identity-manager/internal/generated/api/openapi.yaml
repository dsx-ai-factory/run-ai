      properties:
        idpBaseUrl:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
        scopes:
          items:
            type: string
          type: array
      type: object
    Mappers:
      example:
        uid: uid
        firstName: firstName
        lastName: lastName
        gid: gid
        groups: groups
        supplementaryGroups: supplementaryGroups
        email: email
      properties:
