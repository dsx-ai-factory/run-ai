openapi: 3.0.3
info:
  contact:
    email: support@run.ai
    name: Run.AI
    url: https://www.run.ai/
  description: An API for managing runai realms in mappers
  title: identity-manager
  version: "1.0"
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Executed successfully.
      summary: health check
      tags:
      - Health
      x-service: identity-manager
      x-no-authorization: true
    x-internal: true
  /api/v1/config:
    get:
      description: Retrieve Run:ai configuration settings.
      operationId: get_tenant_configuration
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfiguration'
          description: Executed successfully.
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get configuration.
      tags:
      - Config
      x-service: identity-manager
      x-test-coverage:
      - src/test/suites/tenantSuite/tenantUserApi/tenantSystemApi.test.ts
      x-no-authorization: true
    x-internal: true
  /internal/realms:
    post:
      description: |
        Create a new realm for runai tenant.
      operationId: create_realm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealmCreationRequest'
        description: The tenant on behalf realm will be created.
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmCreationResponse'
          description: Created
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "409":
          content:
            application/json:
              example:
                code: 409
                message: Resource with this name already exists
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource already exists
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Create runai realm
      tags:
      - Realm
      x-service: identity-manager
      x-test-coverage: not-applicable
      x-no-authorization: true
    put:
      description: |
        Get an existing realm or create a new one for runai tenant.
      operationId: get_or_create_realm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealmCreationRequest'
        description: The tenant on behalf realm will be created.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmCreationResponse'
          description: OK
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmCreationResponse'
          description: Created
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "409":
          content:
            application/json:
              example:
                code: 409
                message: Resource with this name already exists
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource already exists
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
