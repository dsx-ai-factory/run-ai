    grant_token_v2_request:
      properties:
        grant_type:
          description: |
            The OAuth2 grant type. Determines the authentication flow and which parameters are required:

            `client_credentials` - Authenticate as a service account or user access key using clientId and clientSecret.

            `password` - Authenticate as a local user using username and password.

            `external_token_exchange` - Authenticate as a service account or user using a token issued by the configured identity provider (IdP) for a Run:ai token. Requires externalToken.
          enum:
          - client_credentials
          - password
          - external_token_exchange
          type: string
        client_id:
          description: The client identifier for a service account or user access
            key. Required when using the client_credentials grant type. Must be used
            together with clientSecret.
          type: string
        client_secret:
          description: The client secret corresponding to the clientId. Required when
            using the client_credentials grant type. Must be used together with clientId.
          format: password
          type: string
        username:
          description: The username of a local user account. Required when using the
            password grant type. Must be used together with password.
          type: string
        password:
          description: The password for the specified username. Required when using
            the password grant type. Must be used together with username.
          format: password
          type: string
        external_token:
          description: A valid token issued by the identity provider (IdP) that is
            configured in NVIDIA Run:ai. Required when using the external_token_exchange
            grant type.
          type: string
        refresh_token:
          description: The refresh token used to obtain a new access token. Required
            only when using the refresh_token grant type.
          type: string
          x-internal: true
        code:
          description: Authorization code issued by the authorization server. Used
            in the authorization_code grant to exchange the code for an access token.
          type: string
          x-internal: true
        redirect_uri:
          description: The redirect URI used during the authorization request. Required
            for the authorization_code grant to validate the redirect destination.
          type: string
          x-internal: true
        code_verifier:
          description: PKCE code verifier. Required when the authorization code was
            requested with a code_challenge.
          pattern: "^[A-Za-z0-9._~-]+$"
          type: string
          x-internal: true
      required:
      - grant_type
      type: object
