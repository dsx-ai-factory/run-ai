        uid:
          maxLength: 255
          type: string
        groups:
          maxLength: 255
          type: string
        supplementaryGroups:
          maxLength: 255
          type: string
        email:
          maxLength: 254
          type: string
        firstName:
          maxLength: 255
          type: string
        lastName:
