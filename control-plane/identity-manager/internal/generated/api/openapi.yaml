components:
  parameters:
    TenantId:
      description: If exists will return the relevant resource for the tenant ID
      example: "1008"
      explode: true
      in: query
      name: tenantId
      required: false
      schema:
        default: ""
        type: string
      style: form
      x-scope:
      - system
    idp:
      description: The alias of the idp
      explode: false
      in: path
      name: idp
      required: true
      schema:
        type: string
      style: simple
    usersFilterBy:
      description: "Filter results by a parameter. Use the format field-name operator\
        \ value. Operators are <= Less than or equal, >= Greater than or equal, =@\
        \ contains. Dates are in ISO 8601 timestamp format and available for operators\
        \ <=, >= and ==."
      explode: false
      in: query
      name: filterBy
      required: false
      schema:
        example:
        - "username=@test,lastLogin>=2024-09-24T00:00:00.00Z,isLocal==false"
        items:
          pattern: ^((username|createdBy|lastLogin|creationTime|lastUpdated|isLocal)(==|<=|>=|=@)|(firstName|lastName|fullName)(=@)).+$
          type: string
        type: array
      style: form
    usersSortBy:
      description: Sort results by a parameters.
      explode: true
      in: query
      name: sortBy
      required: false
      schema:
        $ref: '#/components/schemas/UsersFilterSortFields'
      style: form
    SortOrder:
      description: Sort results in descending or ascending order.
      explode: true
      in: query
      name: sortOrder
      required: false
      schema:
        default: asc
        enum:
        - asc
        - desc
        type: string
      style: form
    Offset:
      description: The offset of the first item returned in the collection.
      explode: true
      in: query
      name: offset
      required: false
      schema:
        example: 100
        format: int32
        type: integer
      style: form
    limit:
      description: The maximum number of entries to return.
      explode: true
      in: query
      name: limit
      required: false
      schema:
        default: 500
        format: int32
        maximum: 500
        minimum: 1
        type: integer
      style: form
    search:
      description: Filter results by a free text search.
      explode: true
      in: query
      name: search
      required: false
      schema:
        example: test@run
        type: string
      style: form
    usersMinimalFilterBy:
      description: |
        Filter results by username. Use the format field-name operator value. Supported operators are == (exact match) and =@ (contains).
        Multiple entries (up to 25) are allowed only with the == operator.
      explode: false
      in: query
      name: filterBy
      required: false
      schema:
        example:
        - username==test@run.ai
        items:
          pattern: ^username(==|=@).+$
          type: string
        maxItems: 25
        type: array
      style: form
    usersMinimalSearch:
      description: "Filter results by a free text search across username, firstName\
        \ and lastName (OR logic). Minimum 2 characters."
      explode: true
      in: query
      name: search
      required: false
      schema:
        example: john
        maxLength: 100
        minLength: 2
        type: string
      style: form
    usersMinimalId:
      description: Bulk lookup by user IDs (comma-separated). Returns the matching
        users in addition to any results from `search` or `filterBy`. Up to 25 IDs
        per request.
      explode: false
      in: query
      name: id
      required: false
      schema:
        example:
        - 8e3f0a4b-4d3c-4f6e-9d2a-1c5e0a8b7f6d
        items:
          type: string
        maxItems: 25
        type: array
      style: form
    userId:
      description: The id of the user
      explode: false
      in: path
      name: userId
      required: true
      schema:
        type: string
      style: simple
    realm:
      description: The name of the realm
      explode: false
      in: path
      name: realm
      required: true
      schema:
        type: string
      style: simple
    email:
      explode: false
      in: path
      name: email
      required: true
      schema:
        type: string
      style: simple
    ClusterIdRequired:
      description: The id of the cluster
      explode: true
      in: query
      name: clusterId
      required: true
      schema:
        example: d73a738f-fab3-430a-8fa3-5241493d7128
        format: uuid
        type: string
      style: form
    serviceAccountId:
      description: Service account id
      explode: false
      in: path
      name: serviceAccountId
      required: true
      schema:
        example: 6d2894ba-f998-4039-bba1-caba57caf681
        type: string
      style: simple
    accessKeyId:
      description: The access key ID
      explode: false
      in: path
      name: accessKeyId
      required: true
      schema:
        type: string
      style: simple
    clientId:
      description: The client "id" to retrieve
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    settingsKey:
      description: The settings key
      explode: false
      in: path
      name: key
      required: true
      schema:
        $ref: '#/components/schemas/settingsKeyEnum'
      style: simple
    isHardDelete:
      description: Boolean indicator for soft/hard delete
      explode: true
      in: query
      name: isHardDelete
      required: false
      schema:
        type: boolean
      style: form
    exchangeCode:
      description: The exchange code retrieved from the idp server
      explode: true
      in: query
      name: code
      required: true
      schema:
        type: string
      style: form
    redirectUri:
      description: The redirect uri to redirect to after the authorization server
        completes the authorization flow
      explode: true
      in: query
      name: redirect_uri
      required: true
      schema:
        type: string
      style: form
    refreshToken:
      description: The refresh token retrieved from the idp server
      explode: true
      in: query
      name: refresh_token
      required: true
      schema:
        type: string
      style: form
    appType:
      description: The type of application
      explode: true
      in: query
      name: appType
      required: true
      schema:
        enum:
        - Agent
        - MimirWriter
        type: string
      style: form
    code:
      $ref: '#/components/parameters/exchangeCode'
    redirect_url:
      $ref: '#/components/parameters/redirectUri'
    refresh_token:
      $ref: '#/components/parameters/refreshToken'
    app_type:
      $ref: '#/components/parameters/appType'
    is_hard_delete:
      $ref: '#/components/parameters/isHardDelete'
  responses:
    "500InternalServerError":
      content:
        application/json:
          example:
            code: 500
            message: Something went wrong.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "503ServiceUnavailable":
      content:
        application/json:
          example:
            code: 503
            message: Please try again in few minutes.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "400BadRequest":
      content:
        application/json:
          example:
            code: 400
            message: Required parameter is missing
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad request.
    "401Unauthorized":
      content:
        application/json:
          example:
            code: 401
            message: Issuer is not familiar.
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized
    "403Forbidden":
      content:
        application/json:
          example:
            code: 403
            message: You do not have sufficient permissions.
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden
    "409Conflict":
      content:
        application/json:
          example:
            code: 409
            message: Resource with this name already exists
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource already exists
    "404NotFound":
      content:
        application/json:
          example:
            code: 404
            message: Resource id not found.
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource was not found
    ClientCreationResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_internal_client_201_response'
      description: Executed successfully.
      x-internal: true
    "307TemporaryRedirect":
      description: The resource was not modified
      headers:
        Location:
          explode: false
          schema:
            format: uri
            type: string
          style: simple
    "204NoContent":
      description: No Content.
    "400BadSubmissionRequest":
      content:
        application/json:
          example:
            code: 400
            message: The workload request does not comply with the policy set by the
              administrator
          schema:
            $ref: '#/components/schemas/SubmissionError'
      description: Bad submission request.
    "406NotAcceptable":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Not acceptable request
    "412PreconditionFailed":
      content:
        application/json:
          example:
            code: 412
            message: Precondition failed
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource was not found.
    "413RequestEntityTooLarge":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Request entity too large
    "415UnsupportedMediaType":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unsupported media type
    "501NotImplemented":
      content:
        application/json:
          example:
            code: 501
            message: Not implemented
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
  schemas:
    AuthConfiguration:
      example:
        tenantName: mytest
        authClientID: runai-admin-ui
        authHost: http://localhost:8080
        isMultiTenant: false
        redirectUrl: http://localhost:8080
      properties:
        tenantName:
          type: string
        authClientID:
          type: string
        authHost:
          type: string
        isMultiTenant:
          type: boolean
        redirectUrl:
          type: string
      required:
      - authClientID
      - authHost
      - isMultiTenant
      - redirectUrl
      - tenantName
      type: object
    Error:
      example:
        code: 400
        message: Bad request - Resource should have a name
      properties:
        code:
          maximum: 599
          minimum: 100
          type: integer
        message:
          type: string
        details:
          type: string
      required:
      - code
      - message
    RealmCreationRequest:
      example:
        realm_name: runai
        tenant_id: 1
      properties:
        realm_name:
          maxLength: 255
          minLength: 2
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]$"
          type: string
        tenant_id:
          maxLength: 64
          minLength: 1
          pattern: "^[0-9]{1,}$"
          type: string
        external_redirect_uri:
          items:
            maxLength: 2048
            minLength: 1
            type: string
          maxItems: 100
          minItems: 0
          type: array
      required:
      - realm_name
      - tenant_id
      type: object
    Client:
      example:
        id: 3434c-12323ab-4ce2ea6-b44fc-db344d
        clientId: name123
        secret: e32r3re23h65y5766k8i7k988l
        redirectUris:
        - https://url1
        - https://url2
        attributes:
          key1: value
          key2: value
      properties:
        id:
          type: string
        clientId:
          type: string
        secret:
          type: string
        redirectUris:
          items:
            type: string
          type: array
        attributes:
          type: object
      required:
      - clientId
      - id
      - secret
      type: object
    RealmCreationResponse:
      example:
        clients:
        - id: 3434c-12323ab-4ce2ea6-b44fc-db344d
          clientId: name123
          secret: e32r3re23h65y5766k8i7k988l
          redirectUris:
          - https://url1
          - https://url2
          attributes:
            key1: value
            key2: value
        - id: 3434c-12323ab-4ce2ea6-b44fc-db344d
          clientId: name123
          secret: e32r3re23h65y5766k8i7k988l
          redirectUris:
          - https://url1
          - https://url2
          attributes:
            key1: value
            key2: value
        domain: domain
        realm_name: realm_name
      properties:
        realm_name:
          type: string
        domain:
          type: string
        clients:
          items:
            $ref: '#/components/schemas/Client'
          type: array
      required:
      - clients
      - domain
      - realm_name
      type: object
    SamlData:
      example:
        validateSignature: true
        signingCertificate: signingCertificate
        serviceProviderMetadataUrl: serviceProviderMetadataUrl
        singleSignOnServiceUrl: singleSignOnServiceUrl
        entityId: entityId
      nullable: true
      properties:
        signingCertificate:
          type: string
        singleSignOnServiceUrl:
          type: string
        entityId:
          type: string
        serviceProviderMetadataUrl:
          description: Service Provider (SP) metadata url
          type: string
        validateSignature:
          description: Whether the signature of SAML responses from the identity provider
            is validated
          type: boolean
      required:
      - validateSignature
      type: object
    MandatoryClaim:
      example:
        values:
        - values
        - values
        - values
        - values
        - values
        claim: claim
      nullable: true
      properties:
        claim:
          maxLength: 255
          minLength: 1
          pattern: ".*[a-zA-Z].*"
          type: string
        values:
          items:
            maxLength: 255
            minLength: 1
            pattern: "^(?!.*\\s).*?[a-zA-Z].*$"
            type: string
          maxItems: 100
          minItems: 1
          type: array
      required:
      - claim
      - values
      type: object
    OidcData:
      example:
        clientId: clientId
        mandatoryClaim:
          values:
          - values
          - values
          - values
          - values
          - values
          claim: claim
        clientSecret: clientSecret
        scopes:
        - scopes
        - scopes
      nullable: true
      properties:
        clientId:
