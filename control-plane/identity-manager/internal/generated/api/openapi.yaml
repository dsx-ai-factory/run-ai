          clientId: clientId
          mandatoryClaim:
            values:
            - values
            - values
            - values
            - values
            - values
            claim: claim
          clientSecret: clientSecret
          scopes:
          - scopes
          - scopes
        type: saml
        mappers:
          uid: uid
          firstName: firstName
          lastName: lastName
          gid: gid
          groups: groups
          supplementaryGroups: supplementaryGroups
          email: email
      properties:
        alias:
          pattern: "^[a-z0-9_-]+$"
          type: string
        type:
          enum:
