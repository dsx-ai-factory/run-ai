worker_processes 4;

events { worker_connections 1024; }
http {
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript font/woff font/woff2;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;

    server {
        include /etc/nginx/mime.types;
        listen 8080;

        location = /api/docs {
            root /usr/share/nginx/html;
            default_type application/yaml;
            add_header Content-Disposition 'attachment; filename="runai-api.yaml"';
            try_files /openapi/runai-api.yaml =404;
        }

        location /assets/ {
            root  /usr/share/nginx/html/frontend;
            try_files $uri =404;
        }

        location / {
            root  /usr/share/nginx/html/frontend;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /error-pages/404.html;
        location = /error-pages/404.html {
            root  /usr/share/nginx/html/frontend;
            internal;
        }

        error_page  500 502 503 504 /50x.html;
        location = /50x.html {
            root  /usr/share/nginx/html/frontend;
        }
    }
}
