name: filterBy
in: query
required: false
description: Filter results by a parameter. Use the format field-name operator value. Operators are == Equals, != Not equals, <= Less than or equal, >= Greater than or equal. Dates are in ISO 8601 timestamp format and available for operators ==, !=, <= and >=.
schema:
  type: array
  maxItems: 10
  items:
    type: string
    pattern: "^(clusterId)(==|!=|<=|>=).+$"
  example: ["clusterId==d73a738f-fab3-430a-8fa3-5241493d7128"]
explode: false

