post:
  summary: Update liveness status for a cluster.
  x-service: cluster-service
  x-no-audit: true
  description: Use to update the liveness probe status of a Kubernetes cluster by Universally Unique Identifier (UUID).
  x-test-coverage:
    - src/test/suites/advancedSuite/clusterService/clusterServiceApi.test.ts
    - cluster-service/pkg/services/api_clusters_service_test.go
  operationId: updateClusterLiveness
  x-authorize:
    resource-type: cluster
    action: sync
    resource-id: clusterUuid
  tags:
