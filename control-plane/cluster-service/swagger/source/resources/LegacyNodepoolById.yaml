  operationId: legacy_update_nodepool
  x-service: cluster-service
  description: >-
    Use to update the details of a node pool by Universally Unique Identifier (UUID). Deprecated, please use PATCH /api/v1/node-pools/{id} instead.
  deprecated: true
  x-test-coverage:
    - cluster-service/pkg/services/api_nodepools_service_test.go
  x-authorize:
    resource-type: nodepools
    resource-id: nodepoolId
