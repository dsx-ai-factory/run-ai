            $ref: '../schemas/LegacyError.yaml'
    404:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '../schemas/LegacyErrorInt32.yaml'
    503:
      description: unexpected error
      content:
        application/json:
          schema:
            $ref: '../schemas/LegacyErrorInt32.yaml'
