post:
  summary: Sync nodepools status
  operationId: sync_nodepools_status
  x-service: cluster-service
  description: Sync nodepools status
  x-test-coverage:
    - e2e/src/test/suites/playwright/serial/regression/node-pools/advancedNodePoolsApiV2.test.ts
  x-authorize:
    resource-type: nodepools
    action: sync
  x-internal: true
  tags:
    - NodePools
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/ClusterUuid.yaml"
  requestBody:
    description: Nodepools sync data.
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - nodepools
          properties:
            nodepools:
              type: array
              items:
                $ref: "../schemas/Nodepools/NodepoolSyncFields.yaml"
            deleteMissing:
              type: boolean
              default: false
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    207:
      description: Partial success.
      content:
        application/json:
          schema:
            type: object
            required:
              - successfullySyncedNodepools
              - failedNodepools
            properties:
              successfullySyncedNodepools:
                type: array
                items:
                  type: string
              failedNodepools:
                type: array
                items:
                  type: string
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'