get:
  summary: Get network topology by id.
  description: Retrieve network topology details by Universally Unique Identifier (UUID).
  x-service: cluster-service
  operationId: get_network_topology_by_id
  x-test-coverage:
    - cluster-service/pkg/services/api_network_topologies_service_test.go
  x-authorize:
    resource-type: network-topologies
    action: read
  tags:
    - Network Topologies
  parameters:
    - $ref: '../parameters/path/NetworkTopologyId.yaml'
  responses:
    '200':
      description: Executed successfully.
      content:
        application/json:
          schema:
            $ref: '../schemas/NetworkTopologies/NetworkTopology.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
delete:
  summary:  Delete network topology by ID.
  x-service: cluster-service
  description: Delete an existing network topology by its ID.
  operationId: delete_network_topology
  x-test-coverage:
    - cluster-service/pkg/services/api_network_topologies_service_test.go
  x-authorize:
    resource-type: network-topologies
    action: delete
  x-audit: true
  tags:
    - Network Topologies
  parameters:
    - $ref: '../parameters/path/NetworkTopologyId.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../infra/openapi/docs/responses/404NotFound.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml' 