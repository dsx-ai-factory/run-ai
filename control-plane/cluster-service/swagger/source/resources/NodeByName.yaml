put:
  summary: Update node details.
  description: Use to update the details of a node in a Kubernetes cluster by Universally Unique Identifier (UUID).
  operationId: upsert_node
  x-service: cluster-service
  x-test-coverage:
    - src/test/suites/advancedSuite/nodes/nodesStatuses.test.ts
  x-authorize:
    resource-type: nodes
    action: sync
  tags:
    - Nodes
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/ClusterUuid.yaml"
    - $ref: "../parameters/path/NodeName.yaml"
  requestBody:
    description: The node info in the cluster.
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/Nodes/NodeInfo.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
delete:
  summary: Delete a node from a cluster.
  description: Delete a node that doesn't exist in the Kubernetes cluster.
  operationId: delete_node
  x-service: cluster-service
  x-test-coverage:
    - src/test/suites/advancedSuite/nodes/nodesStatuses.test.ts
  x-authorize:
    resource-type: nodes
    action: sync
  tags:
    - Nodes
  parameters:
    - $ref: "../../../../infra/openapi/docs/parameters/path/ClusterUuid.yaml"
    - $ref: "../parameters/path/NodeName.yaml"
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'