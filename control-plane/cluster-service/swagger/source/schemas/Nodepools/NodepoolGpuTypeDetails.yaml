type: object
x-internal: true
required:
  - type
  - totalDevices
properties:
  type:
    type: string
    description: The GPU model, as reported by the GPU vendor labels on the node pool's nodes.
    example: NVIDIA-H100-80GB-HBM3
  gpuMemoryBytes:
    type: integer
    format: int64
    minimum: 0
    description: >-
      Memory of a single GPU device of this type, in bytes. Omitted when the node pool's
      nodes do not report GPU memory.
    example: 85899345920
  totalDevices:
    type: integer
    minimum: 0
    description: Total number of GPU devices of this type across the node pool's nodes.
    example: 16
  maxDevicesPerNode:
    type: integer
    format: int64
    minimum: 1
    description: >-
      Largest installed GPU count on a single node for this exact GPU type and
      per-device memory capacity. Not a sum across nodes or a free-device count.
      Omitted when per-node count evidence is unavailable.
    example: 8
x-schema-name: NodepoolGpuTypeDetails
