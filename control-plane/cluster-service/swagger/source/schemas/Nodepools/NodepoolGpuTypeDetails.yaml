type: object
x-internal: true
required:
  - type
  - totalDevices
properties:
  pciDeviceId:
    type: string
    pattern: "^$|^([1-9a-f][0-9a-f]{3}|0[1-9a-f][0-9a-f]{2}|00[1-9a-f][0-9a-f]|000[1-9a-f]):10de$"
    x-internal: true
    description: NVIDIA PCI device and vendor ID from reported physical hardware; omitted when unknown.
    example: "1eb8:10de"
  type:
    type: string
    description: The GPU model, as reported by the GPU vendor labels on the node pool's nodes.
    example: NVIDIA-H100-80GB-HBM3
  gpuMemoryBytes:
    type: integer
    format: int64
    minimum: 0
    description: >-
      Memory of a single GPU device of this type, in bytes. Omitted when the node pool's
      nodes do not report GPU memory.
    example: 85899345920
  totalDevices:
    type: integer
    minimum: 0
    description: Total number of GPU devices of this type across the node pool's nodes.
    example: 16
x-schema-name: NodepoolGpuTypeDetails
