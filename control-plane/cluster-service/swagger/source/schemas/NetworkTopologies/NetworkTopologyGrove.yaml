type: object
nullable: true
description: The linked Grove topology definition. Null if no Grove topology has been linked to this network topology
required:
  - name
properties:
  name:
    type: string
    description: Name of the linked Grove ClusterTopology
  domains:
    type: array
    items:
      type: string
    description: Topology levels defined in the linked Grove ClusterTopology
  conditions:
    type: array
    items:
      $ref: './NetworkTopologyGroveCondition.yaml'
    description: A list of conditions that describe the current state of the Grove ClusterTopology
