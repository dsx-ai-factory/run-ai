type: object
required:
  - name
  - totalCpuCores
  - allocatedCpuCores
  - totalCpuMemoryBytes
  - allocatedCpuMemoryBytes
  - totalGpus
  - allocatedGpus
properties:
  name:
    type: string
    description: The identifier of the NUMA node (for example, node-0).
    example: node-0
  totalCpuCores:
    type: number
    format: double
    minimum: 0
    multipleOf: 0.001
    description: Total CPU cores on this NUMA node that are available for allocation.
    example: 63.5
  allocatedCpuCores:
    type: number
    format: double
    minimum: 0
    multipleOf: 0.001
    description: CPU cores currently allocated to workloads on this NUMA node.
    example: 8.5
  totalCpuMemoryBytes:
    type: integer
    format: int64
    minimum: 0
    description: Total CPU memory on this NUMA node that is available for allocation.
    example: 270582939648
  allocatedCpuMemoryBytes:
    type: integer
    format: int64
    minimum: 0
    description: CPU memory currently allocated to workloads on this NUMA node, in bytes.
    example: 34359738368
  totalGpus:
    type: integer
    format: int32
    minimum: 0
    description: Total GPU devices on this NUMA node that are available for allocation.
    example: 4
  allocatedGpus:
    type: integer
    format: int32
    minimum: 0
    description: GPU devices currently allocated to workloads on this NUMA node.
    example: 2
x-schema-name: NumaNodeDetails
