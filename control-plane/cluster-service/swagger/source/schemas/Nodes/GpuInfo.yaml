type: object
nullable: true
required:
  - gpuType
  - gpuCount
properties:
  pciDeviceId:
    type: string
    pattern: "^$|^([1-9a-f][0-9a-f]{3}|0[1-9a-f][0-9a-f]{2}|00[1-9a-f][0-9a-f]|000[1-9a-f]):10de$"
    x-internal: true
    description: NVIDIA PCI device and vendor ID from reported physical hardware; omitted when unknown.
    example: "1eb8:10de"
  pciDeviceIdObservedAt:
    type: string
    format: date-time
    nullable: true
    x-internal: true
    description: >-
      Time the hardware collector observed pciDeviceId. Identity is unknown without
      a paired observation within five minutes and at most one minute in the future.
      This timestamp is never replaced by the control-plane ingestion time.
  gpuType:
    type: string
    example: Tesla-V100
  gpuCount:
    type: integer
  gpuMemoryBytes:
    type: integer
    format: int64
    minimum: 0
    x-internal: true
    description: >-
      Memory of a single GPU device on this node, in bytes, taken from the node's GPU
      vendor labels. Note this is per device, unlike the TOTAL_GPU_MEMORY_BYTES node
      telemetry type which reports the node's total across all of its devices.
      Omitted when the node's GPU labels do not report memory.
    example: 85899345920
x-schema-name: GpuInfo
