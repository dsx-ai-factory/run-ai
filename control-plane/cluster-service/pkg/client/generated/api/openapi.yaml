  responses:
    "404NotFound":
      content:
        application/json:
          example:
            code: 404
            message: Resource id not found.
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource was not found
    "500InternalServerError":
      content:
        application/json:
          example:
            code: 500
            message: Something went wrong.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "503ServiceUnavailable":
      content:
        application/json:
          example:
            code: 503
            message: Please try again in few minutes.
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
    "401Unauthorized":
      content:
        application/json:
          example:
            code: 401
            message: Issuer is not familiar.
          schema:
            $ref: '#/components/schemas/Error'
      description: Unauthorized
    "403Forbidden":
      content:
        application/json:
          example:
            code: 403
            message: You do not have sufficient permissions.
          schema:
            $ref: '#/components/schemas/Error'
      description: Forbidden
    "400BadRequest":
      content:
        application/json:
          example:
            code: 400
            message: Required parameter is missing
          schema:
            $ref: '#/components/schemas/Error'
      description: Bad request.
    "204NoContent":
      description: No Content.
    "202Accepted":
      content:
        application/json:
          example:
            code: 202
            message: Request has been accepted.
          schema:
            $ref: '#/components/schemas/HttpResponse'
      description: Accepted.
    "422UnprocessableEntity":
      content:
        application/json:
          example:
            code: 422
            message: Validation failed - Invalid workload configuration
          schema:
            $ref: '#/components/schemas/Error'
      description: Unprocessable entity - The request was well-formed but contains
        semantic errors.
    "400BadSubmissionRequest":
      content:
        application/json:
          example:
            code: 400
            message: The workload request does not comply with the policy set by the
              administrator
          schema:
            $ref: '#/components/schemas/SubmissionError'
      description: Bad submission request.
    "406NotAcceptable":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Not acceptable request
    "409Conflict":
      content:
        application/json:
          example:
            code: 409
            message: Resource with this name already exists
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource already exists
    "412PreconditionFailed":
      content:
        application/json:
          example:
            code: 412
            message: Precondition failed
          schema:
            $ref: '#/components/schemas/Error'
      description: The specified resource was not found.
    "413RequestEntityTooLarge":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Request entity too large
    "415UnsupportedMediaType":
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unsupported media type
    "501NotImplemented":
      content:
        application/json:
          example:
            code: 501
            message: Not implemented
          schema:
            $ref: '#/components/schemas/Error'
      description: unexpected error
  schemas:
    ClusterIdOptional:
      description: The id of the cluster.
      example: 71f69d83-ba66-4822-adf5-55ce55efd210
      format: uuid
      minLength: 1
      nullable: true
      type: string
    DepartmentIdOptional:
      description: The id of the department.
      example: "2"
      minLength: 1
      nullable: true
      pattern: .*
      type: string
    Ancestors:
      description: The ancestors of an org unit.
      example:
        tenant_id: "1"
        cluster_uuid: 71f69d83-ba66-4822-adf5-55ce55efd210
        department_id: "2"
        project_id: "1"
      properties:
        tenant_id:
          example: "1"
          type: string
        cluster_uuid:
          description: The id of the cluster.
          example: 71f69d83-ba66-4822-adf5-55ce55efd210
          format: uuid
          minLength: 1
          nullable: true
          type: string
        department_id:
          description: The id of the department.
          example: "2"
          minLength: 1
          nullable: true
          pattern: .*
          type: string
        project_id:
          example: "1"
          nullable: true
          type: string
      required:
      - tenant_id
      type: object
    Error:
      example:
        code: 400
        message: Bad request - Resource should have a name
      properties:
        code:
          maximum: 599
          minimum: 100
          type: integer
        message:
          type: string
        details:
          type: string
      required:
      - code
      - message
    TenantId:
      description: The id of the tenant.
      example: 1001
      format: int32
      type: integer
    ClusterReportedStatusPlatform:
      example:
        kubeVersion: kubeVersion
        type: vanilla
      nullable: true
      properties:
        type:
          description: the cluster platform type
          enum:
          - vanilla
          - openshift
          - rke
          - gke
          - aks
          - eks
          nullable: true
          type: string
        kubeVersion:
          description: the cluster kubernetes version
          nullable: true
          type: string
      type: object
    ClusterReportedResourceRequirements:
      description: Resource requests and limits reported by a cluster for a composed
        container.
      nullable: true
      properties:
        limits:
          additionalProperties:
            type: string
          description: Resource limits keyed by Kubernetes resource name.
          example:
            cpu: 100m
            memory: 128Mi
          type: object
        requests:
          additionalProperties:
            type: string
          description: Resource requests keyed by Kubernetes resource name.
          example:
            cpu: 100m
            memory: 128Mi
          type: object
      type: object
    FipsModeEnum:
      description: "the cluster's Go FIPS 140-3 runtime mode (off, on, or only), propagated\
        \ to injected init/sidecar containers via GODEBUG"
      enum:
      - "off"
      - "on"
      - only
      example: only
      nullable: true
      type: string
    ClusterReportedCustomCA:
      description: "Custom CA bundle reported by the cluster for a specific consumer\
        \ (git-sync, S3, oauth2-proxy)."
      nullable: true
      properties:
        enabled:
          description: indicates if a custom CA bundle is configured for this consumer
          example: true
          nullable: true
          type: boolean
        secretName:
          description: the name of the Secret holding the custom CA bundle
          example: runai-ca
          nullable: true
          type: string
        secretKey:
          description: the key within the Secret that holds the custom CA bundle
          example: runai-ca.pem
          nullable: true
          type: string
        optional:
          description: indicates if the Secret is optional (the consumer should tolerate
            a missing Secret)
          example: false
          nullable: true
          type: boolean
      type: object
    OpenshiftRouteTerminationPolicy:
      description: TLS termination policy for Run:ai-generated OpenShift Routes.
      enum:
      - edge
      - passthrough
      example: edge
      nullable: true
      type: string
    ClusterReportedConfig:
      description: Holds cluster configuration values.
      nullable: true
      properties:
        inferenceEndpointSchemaVersion:
          description: "InferenceEndpoint integration contract declared by the operator\
            \ when Agent, Anyworkload and inference-endpoint-controller are enabled.\
            \ Omitted by older clusters. Operand readiness and administrator Gateway\
            \ settings must also be checked before enabling new workloads."
          nullable: true
          type: string
        workloadOwnershipProtection:
          description: indicates if the cluster workload ownership protection is enabled
          example: false
          nullable: true
          type: boolean
        subdomainEnabled:
          description: indicates if the cluster subdomain is enabled
          example: false
          nullable: true
          type: boolean
        ingressClass:
          description: the ingress class that is configured for the cluster
          example: nginx
          nullable: true
          type: string
        ingressEnabled:
          description: indicates if Ingress or Route resources should be created for
            workload external URLs
          example: true
          nullable: true
          type: boolean
        gatewayName:
          description: the name of the Gateway API gateway resource configured for
            the cluster
          example: my-gateway
          nullable: true
          type: string
        gatewayNamespace:
          description: the namespace of the Gateway API gateway resource configured
            for the cluster
          example: gateway-system
          nullable: true
          type: string
        gatewayAPIEnabled:
          description: indicates if Gateway API HTTPRoute resources should be created
            for workload external URLs
          example: false
          nullable: true
          type: boolean
        gitSyncImage:
          description: the fully qualified git-sync image reference used by init containers
            (format "registry/name:tag")
          example: gcr.io/runai/git-sync:v4.2.0
          nullable: true
          type: string
        gitSyncResources:
          $ref: '#/components/schemas/ClusterReportedResourceRequirements'
        s3FileSystemImage:
          description: the fully qualified s3 file-system image reference used by
            init containers (format "registry/name:tag")
          example: gcr.io/runai/goofys:v0.24.0
          nullable: true
          type: string
        s3FileSystemResources:
          $ref: '#/components/schemas/ClusterReportedResourceRequirements'
        fipsMode:
          $ref: '#/components/schemas/FipsModeEnum'
        runaiOauth2ProxyImage:
          description: the fully qualified runai oauth2-proxy image reference used
            by init containers (format "registry/name:tag")
          example: gcr.io/runai/oauth2-proxy:v7.5.1
          nullable: true
          type: string
        runaiOauth2ProxyResources:
          $ref: '#/components/schemas/ClusterReportedResourceRequirements'
        runaiOauth2ProxyUsernameLoaderImage:
          description: the fully qualified runai oauth2-proxy username loader image
            reference used by init containers (format "registry/name:tag")
          example: gcr.io/runai/oauth2-proxy-username-loader:v1.0.0
          nullable: true
          type: string
        usernameLoaderResources:
          $ref: '#/components/schemas/ClusterReportedResourceRequirements'
        runaiOauth2ProxyRedisFQDN:
          description: the FQDN of the Redis backing oauth2-proxy
          example: cluster-redis.runai.svc.cluster.local:6379
          nullable: true
          type: string
        runaiOauth2ProxyWorkloadAuthSecretName:
          description: the name of the Secret holding the oauth2-proxy workload auth
            credentials
          example: runai-workload-auth
          nullable: true
          type: string
        runaiOauth2ProxySessionStoreType:
          description: the session store type used by oauth2-proxy
          example: cookie
          nullable: true
          type: string
        runaiOauth2ProxyOidcIssuerUrl:
          description: the absolute OIDC issuer URL oauth2-proxy uses to discover
            the OpenID provider
          example: http://localhost:8080/auth/realms/runai
          nullable: true
          type: string
        customCAGit:
          $ref: '#/components/schemas/ClusterReportedCustomCA'
        customCAS3:
          $ref: '#/components/schemas/ClusterReportedCustomCA'
        customCAOauth2Proxy:
          $ref: '#/components/schemas/ClusterReportedCustomCA'
        externalAuthUrlEnabled:
          description: indicates if OAuth2 proxy is used when submitting workloads
            with an external URL
          example: true
          nullable: true
          type: boolean
        openshiftRouteTerminationPolicy:
          $ref: '#/components/schemas/OpenshiftRouteTerminationPolicy'
        distGPUNetworkAcceleration:
          description: indicates if GPU network acceleration (MNNVL) is enabled for
            the workload-controller (distributed-training)
          example: false
          nullable: true
          type: boolean
        dinfGPUNetworkAcceleration:
          description: indicates if GPU network acceleration (MNNVL) is enabled for
            the inference-workload-controller (distributed-inference)
          example: false
          nullable: true
          type: boolean
      type: object
    ClusterDependencyStatus:
      example:
        reason: reason
        components:
          key: null
        available: true
      properties:
        available:
          description: whether the dependency is available
          type: boolean
        reason:
          description: the reason for the dependency status
          type: string
        components:
          additionalProperties:
            $ref: '#/components/schemas/ClusterDependencyStatus'
          type: object
      required:
      - available
      type: object
    ClusterDependenciesStatus:
      example:
        optional:
          key:
            reason: reason
            components:
              key: null
            available: true
        required:
          key:
            reason: reason
            components:
              key: null
            available: true
      properties:
        required:
          additionalProperties:
            $ref: '#/components/schemas/ClusterDependencyStatus'
          type: object
        optional:
