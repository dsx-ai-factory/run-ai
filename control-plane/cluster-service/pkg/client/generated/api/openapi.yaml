             - spread - Distribute CPU pods across as many nodes as possible to balance load across nodes.
      type: object
    TimeBasedFairShareWindowType:
      default: sliding
      description: |
        The method for evaluating the usage window.
         - sliding: A moving window that always evaluates the most recent time period. For example, a 7-day sliding window always considers the last 7 days.
         - tumbling: Fixed, non-overlapping intervals that reset at the end of each cycle. Requires tumblingWindowStartTime to define the cycle anchor.
      enum:
      - sliding
      - tumbling
      example: tumbling
      nullable: true
      type: string
    TimeBasedFairShare:
      description: "Time-based fairshare configuration for the node pool. [Experimental]."
      example:
        historicalUsageWeight: 1.5
        windowDuration: 2d
        decayHalfLife: 24h
        tumblingWindowStartTime: 2025-01-06T08:00:00Z
        enabled: true
        windowType: tumbling
      nullable: true
      properties:
        enabled:
          default: false
          description: |
            Enables time-based fairshare for the node pool. When true, the Scheduler adjusts fairshare based on historical resource usage over a defined time window, allowing past consumption to influence scheduling order. When false, scheduling is based only on the current queue state. [Experimental]
          example: true
          nullable: true
          type: boolean
        historicalUsageWeight:
          default: 1
          description: |
            Set the weight value that determines how a project’s historical resource usage affects its fairshare.
             - 0.0: Ignore historical usage data (100% current usage).
             - 1.0: Historical usage data has higher impact, it may cause fairshare to be 0.
             - Values between 0.0 and 1.0 combine historical and current usage to maintain a balanced fairshare
             - Values above 1 will cause historical usage to have an even higher impact on fairshare.
          example: 1.5
          format: float
          nullable: true
          type: number
        decayHalfLife:
          default: 0h
          description: |
            Set the half-life time to define the decay rate of a project’s historical resource usage. The half-life defines how long it takes for past usage to diminish to half of its original influence on a project's fairshare.
             - 0: disables decay; all historical usage is weighted equally.
             - > 0: older usage gradually contributes less over time (e.g., with a 24-hour half-life, usage from 24 hours ago contributes 50%, from 48 hours ago 25%, and so on).
          example: 24h
          nullable: true
          pattern: "^(0|[+]?((\\d+(\\.\\d+)?)(m|h|d))+$)"
          type: string
        windowType:
          $ref: '#/components/schemas/TimeBasedFairShareWindowType'
        windowDuration:
          default: 7d
          description: |
            The time period over which historical usage is evaluated. Only usage within this window contributes to fairshare. For sliding windows, this is a moving period (e.g., 7d = always the last 7 days). For tumbling windows, this is the fixed cycle duration after which the window resets.
          example: 2d
          nullable: true
          pattern: "^(0|[+]?((\\d+(\\.\\d+)?)(m|h|d))+$)"
          type: string
        tumblingWindowStartTime:
          description: |
            An RFC-3339 timestamp that defines the start time for all tumbling windows. Used only when windowType = Tumbling. This timestamp marks the beginning of the first fixed window, and subsequent windows repeat at intervals equal to the configured WindowDuration.
            For example, with a 7-day window, an anchor of 2025-01-06T08:00:00Z produces weekly windows starting every Monday at 08:00 UTC.
          example: 2025-01-06T08:00:00Z
          format: date-time
          nullable: true
          type: string
      type: object
    SchedulingConfiguration:
      example:
        numaAwareScheduling: true
        placementStrategy:
          cpu: spread
          gpu: spread
        minGuaranteedRuntime: 5d8h40m
        timeBasedFairShare:
          historicalUsageWeight: 1.5
          windowDuration: 2d
          decayHalfLife: 24h
          tumblingWindowStartTime: 2025-01-06T08:00:00Z
          enabled: true
