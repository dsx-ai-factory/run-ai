          description: Forbidden
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Count nodes
      tags:
      - Nodes
      x-service: cluster-service
      x-test-coverage:
      - control-plane/cluster-service/pkg/test/node_db_test.go
      x-authorize:
        resource-type: nodes
        action: read
