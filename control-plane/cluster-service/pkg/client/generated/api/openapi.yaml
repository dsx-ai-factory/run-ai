  /api/v1/clusters/minimal:
    get:
      description: "Retrieve essential cluster data required for common operations\
        \ (e.g., workload submission)"
      operationId: get_clusters_minimal_data
      parameters:
      - description: "Filter clusters by a parameter. Use the format field-name operator\
          \ value. Operators are == Equals, != Not equals, <= Less than or equal,\
          \ >= Greater than or equal. Dates are in ISO 8601 timestamp format and available\
          \ for operators ==, !=, <= and >=."
        explode: false
        in: query
        name: filterBy
        required: false
        schema:
          example:
          - name==my-cluster
          items:
            pattern: ^(name)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
            type: string
          maxItems: 10
          type: array
        style: form
      - description: The offset of the first item returned in the collection.
