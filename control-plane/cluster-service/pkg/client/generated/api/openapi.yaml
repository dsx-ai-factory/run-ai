        minGuaranteedRuntime:
          description: "Minimum duration (e.g., 5d8h40m) that a preemptible workload\
            \ is guaranteed to run once scheduled and bound to a node. During this\
            \ period, it is considered non-preemptible even if a higher-priority workload\
            \ becomes eligible. Defaults to 0 (immediate preemption allowed)."
          example: 5d8h40m
          nullable: true
          pattern: "^(0|[+]?((\\d+(\\.\\d+)?)(ns|us|µs|μs|ms|s|m|h|d|w))+$)"
          type: string
        timeBasedFairShare:
          $ref: '#/components/schemas/TimeBasedFairShare'
        numaAwareScheduling:
          description: "When enabled, the Scheduler places workloads so that GPU,\
            \ CPU, and CPU memory are allocated within the same NUMA node where possible,\
            \ minimizing cross-NUMA fragmentation and improving performance. Requires\
            \ the NodeResourceTopology (NRT) component and a Topology Manager policy\
            \ other than 'none' on the pool's nodes. When disabled, the Scheduler\
            \ places workloads using aggregate node capacity only, without considering\
            \ NUMA topology."
          nullable: true
          type: boolean
      type: object
