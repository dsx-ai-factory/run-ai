spec:
  image: gcr.io/run-ai-demo/jupyter-tensorboard-new
  imagePullPolicy: IfNotPresent

  uidGidSource: fromTheImage

  connections:
    - name: exposed-url-auto
      internalToolInfo:
        toolType: jupyter-notebook
        containerPort: 8001
        connectionType: ExternalUrl
    - name: exposed-url-custom
      internalToolInfo:
        toolType: tensorboard
        containerPort: 8002
        connectionType: ExternalUrl
        externalUrlInfo:
          isCustomUrl: true
    - name: exposed-port-auto
      internalToolInfo:
        toolType: visual-studio-code
        containerPort: 8003
        connectionType: NodePort
    - name: exposed-port-custom
      internalToolInfo:
        toolType: rstudio
        containerPort: 8004
        connectionType: NodePort
        nodePortInfo:
          isCustomPort: true
    - name: related-url
      isExternal: true
      externalToolInfo:
        toolType: wandb
        externalUrl: https://wandb.com


