spec:
  image: ubuntu
  command: python3
  args: -x myscript.py

  environmentVariables:
    - name: HOME
      value: /my/home
    - name: USER
      value: my-user
    - name: FROM-CONFIG
      configMap:
        name: existing
        key: my-config-map-key

  workingDir: /my/home
  createHomeDir: true

  uidGidSource: custom
  runAsUid: 500
  runAsGid: 30
  supplementalGroups: 2,3,5,8
  runAsNonRoot: true
  seccompProfileType: RuntimeDefault
  allowPrivilegeEscalation: false

  hostIpc: true
  hostNetwork: true

  overrideUidGidInWorkspace: true