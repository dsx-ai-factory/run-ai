spec:
  image: gcr.io/run-ai-demo/jupyter-tensorboard-new
  imagePullPolicy: IfNotPresent

  environmentVariables:
    - name: LOG_DIR
      value: "."

  connections:
    - name: Jupyter
      internalToolInfo:
        toolType: jupyter-notebook
        containerPort: 8888
        connectionType: ExternalUrl
    - name: TensorBoard
      internalToolInfo:
        toolType: tensorboard
        containerPort: 6006
        connectionType: ExternalUrl

  uidGidSource: fromTheImage
