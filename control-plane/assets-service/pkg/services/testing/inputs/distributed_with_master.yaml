assets:
  environment: basic
  compute: memory
  datasources:
    - kind: nfs
      id: basic

specificRunParams:
  command: python
  args: "-x worker-command"
  environmentVariables:
    - name: HOME
      value: "/home/worker"

distributed:
  numWorkers: 3
  noMaster: false
  framework: TF

  master:
    assets:
      environment: master-basic
      compute: master-memory

    specificRunParams:
      command: python
      args: "-x master-command"
      environmentVariables:
        - name: HOME
          value: "/home/master"
