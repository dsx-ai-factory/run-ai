defaults:
  command: my-command-1
  environmentVariables:
    instances:
      - name: LOG_DIR
        value: will-be-ignored
      - name: ADDED_VAR
        value: from-defaults
  tolerations:
    attributes:
      operator: Exists
      key: key1
      effect: NoSchedule
    instances:
      - name: tolerations2
        operator: Exists
        key: key2
        effect: NoSchedule
  priorityClass: interactive-preemptible
  security:
    runAsUid: 500
  storage:
    s3:
      attributes:
        bucket: bucket1
rules:
  command:
    options:
      - value: my-command-1
        displayed: command1
      - value: my-command-2
        displayed: command2
  tolerations:
    instances:
      locked:
        - tolerations2
  security:
    runAsUid:
      min: 1
  storage:
    nfs:
      instances:
        canAdd: false
    s3:
      attributes:
        bucket:
          options:
            - value: bucket1
            - value: bucket2
