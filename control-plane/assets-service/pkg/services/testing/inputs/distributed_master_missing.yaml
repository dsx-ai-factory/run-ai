assets:
  environment: basic
  compute: memory
  datasources:
    - kind: nfs
      id: basic

specificRunParams:
  command: python
  args: "-x worker-command"
  environmentVariables:
    - name: HOME
      value: "/home/worker"

distributed:
  numWorkers: 3
  noMaster: false
  framework: TF

  master:
    sameAsWorker: false