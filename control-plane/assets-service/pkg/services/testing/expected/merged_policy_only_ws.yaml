workspace:
  assets:
    environment:
      id: ""
      name: ""
  meta:
    clusterId: ""
    createdAt: "0001-01-01T00:00:00Z"
    createdBy: ""
    desiredPhase: ""
    name: ""
    projectId: ""
    requestedName: ""
    workloadId: ""
  policyInfo:
    attributeDefaults:
      assets:
        datasources:
          pvc: {}
          s3:
            bucket: bucket1
          secretVolume: {}
      specificRunParams:
        tolerations:
          effect: NoSchedule
          key: key1
          operator: Exists
    rules:
      assets:
        datasources:
          nfs:
            instances:
              canAdd: false
          s3:
            attributes:
              bucket:
                options:
                - value: bucket1
                - value: bucket2
      specificRunParams:
        command:
          options:
          - displayed: command1
            value: my-command-1
          - displayed: command2
            value: my-command-2
        runAsUid:
          min: 1
        tolerations:
          instances:
            locked:
            - tolerations2
  specificRunParams:
    allowOverQuota: true
    command: my-command-1
    environmentVariables:
    - name: LOG_DIR
      value: will-be-ignored
    - name: ADDED_VAR
      value: from-defaults
    priorityClass: interactive-preemptible
    runAsUid: 500
    tolerations:
    - effect: NoSchedule
      key: key2
      name: tolerations2
      operator: Exists
