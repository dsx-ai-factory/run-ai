post:
  x-internal: true
  summary: Sync events.
  description: Allow the cluster to report assets related events to the control plane.
  operationId: sync_events
  x-service: assets-service
  x-authorize:
    resource-type: events-history
    action: sync
  tags:
    - Events
  requestBody:
    description: The events to sync.
    content:
      application/json:
        schema:
          $ref: '../schemas/Events/EventsSyncRequest.yaml'
  responses:
    204:
      $ref: '../../../../infra/openapi/docs/responses/204NoContent.yaml'
    400:
      $ref: '../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'