parameters:
  - $ref: "../../../../infra/openapi/docs/parameters/path/AssetId.yaml"
get:
  summary: Get an environment asset.
  description: Use to retrieve the details of environment asset by id.
  operationId: get_environment_asset_by_id
  x-service: assets-service
  x-test-coverage:
    - control-plane/assets-service/pkg/services/api_environment_service_test.go
    - control-plane/assets-service/pkg/services/api_workloads_service_test.go
    - e2e/src/test/suites/defaultSuite/environment/environmentUI.test.ts
    - e2e/src/test/suites/parallel/submitUI/distributedTrainingUI.test.ts
    - e2e/src/test/suites/parallel/submitUI/connectToJupiterUI.test.ts
  x-authorize:
    resource-type: environments
    action: read
  parameters:
    - $ref: "../parameters/query/optional/IncludeUsageInfo.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/ComplyToProject.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/ComplyToWorkloadType.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/ComplyToReplicaType.yaml"
    - $ref: "../parameters/query/optional/IncludeStatus.yaml"
  tags:
    - Environment
  responses:
    200:
      description: Request completed successfully.
      content:
        application/json:
          schema:
            $ref: "../schemas/Environment/EnvironmentAsset.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
put:
  summary: Update an environment asset.
  description: Use to update the details of environment asset by id.
  operationId: update_environment_asset_by_id
  x-service: assets-service
  x-test-coverage:
    - control-plane/assets-service/pkg/services/api_environment_service_test.go
    - control-plane/assets-service/pkg/services/api_workloads_service_test.go
    - e2e/src/test/suites/defaultSuite/environment/environmentUI.test.ts
    - e2e/src/test/suites/parallel/submitUI/distributedTrainingUI.test.ts
    - e2e/src/test/suites/parallel/submitUI/connectToJupiterUI.test.ts
  x-authorize:
    resource-type: environments
    action: update
  x-audit: true
  tags:
    - Environment
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/Environment/EnvironmentUpdateRequest.yaml"
  responses:
    202:
      description: Request accepted successfully.
      content:
        application/json:
          schema:
            $ref: "../schemas/Environment/EnvironmentAsset.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    default:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
delete:
  summary: Delete an environment asset.
  description: Use to delete an environment asset by id.
  operationId: delete_environment_asset_by_id
  x-service: assets-service
  x-test-coverage:
    - control-plane/assets-service/pkg/services/api_environment_service_test.go
    - control-plane/assets-service/pkg/services/api_workloads_service_test.go
  x-authorize:
    resource-type: environments
    action: delete
  x-audit: true
  tags:
    - Environment
  responses:
    202:
      $ref: "../../../../infra/openapi/docs/responses/202Accepted.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
