post:
  summary: Create a training - assets based [Experimental]
  description: Creates a training from a given set of assets. The set must include one environment asset and can include one compute asset and multiple datasource assets.
  operationId: create_training_v2
  x-service: assets-service
  x-internal: true
  x-test-coverage:
    - e2e/src/test/suites/parallel/submitUI/distributedTrainingUI.test.ts
  x-no-authorization: true
  tags:
    - Trainings
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/Training/TrainingCreationRequestV2.yaml"
  responses:
    200:
      description: Request completed successfully.
      content:
        application/json:
          schema:
            $ref: "../schemas/Training/TrainingV2.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400SubmissionErrorV2.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
