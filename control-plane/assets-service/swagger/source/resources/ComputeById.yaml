parameters:
  - $ref: "../../../../infra/openapi/docs/parameters/path/AssetId.yaml"
get:
  summary: Retrieve a compute asset.
  description: Use to retrieve the details of a compute asset by id.
  operationId: get_compute_asset_by_id
  x-authorize:
    resource-type: compute-resources
    action: read
  x-service: assets-service
  x-test-coverage:
    - control-plane/assets-service/pkg/services/api_compute_service_test.go
    - control-plane/assets-service/pkg/services/api_workloads_service_test.go
    - e2e/src/test/suites/parallel/submitUI/distributedTrainingUI.test.ts
    - e2e/src/test/suites/parallel/submitUI/connectToJupiterUI.test.ts
  tags:
    - Compute
  parameters:
    - $ref: "../parameters/query/optional/IncludeUsageInfo.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/ComplyToProject.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/ComplyToWorkloadType.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/ComplyToReplicaType.yaml"
  responses:
    200:
      description: Request completed successfully.
      content:
        application/json:
          schema:
            $ref: "../schemas/Compute/ComputeAsset.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
put:
  summary: Update a compute asset.
  description: Use to update the details of a compute asset by id.
  operationId: update_compute_asset_by_id
  x-service: assets-service
  x-test-coverage:
    - control-plane/assets-service/pkg/services/api_compute_service_test.go
    - control-plane/assets-service/pkg/services/api_workloads_service_test.go
    - e2e/src/test/suites/parallel/submitUI/distributedTrainingUI.test.ts
    - e2e/src/test/suites/parallel/submitUI/connectToJupiterUI.test.ts
  x-authorize:
    resource-type: compute-resources
    action: update
  x-audit: true
  tags:
    - Compute
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/Compute/ComputeUpdateRequest.yaml"
  responses:
    202:
      description: Request accepted successfully.
      content:
        application/json:
          schema:
            $ref: "../schemas/Compute/ComputeAsset.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    default:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
delete:
  summary: Delete a compute asset.
  description: Use to delete a compute asset, by id.
  operationId: delete_compute_asset_by_id
  x-service: assets-service
  x-test-coverage:
    - control-plane/assets-service/pkg/services/api_compute_service_test.go
    - e2e/src/test/suites/parallel/submitUI/distributedTrainingUI.test.ts
    - e2e/src/test/suites/parallel/submitUI/connectToJupiterUI.test.ts
  x-authorize:
    resource-type: compute-resources
    action: delete
  x-audit: true
  tags:
    - Compute
  responses:
    202:
      $ref: "../../../../infra/openapi/docs/responses/202Accepted.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
