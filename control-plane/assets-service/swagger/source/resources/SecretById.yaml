parameters:
  - $ref: "../../../../infra/openapi/docs/parameters/path/AssetId.yaml"
get:
  summary: Get a Secret asset.
  description: Retrieve the details of Secret datasource asset by id.
  operationId: get_secret_asset_by_id
  x-service: assets-service
  x-test-coverage:
    - control-plane/assets-service/pkg/services/api_datasources_service_test.go
    - control-plane/assets-service/pkg/services/api_workloads_service_test.go
    - control-plane/assets-service/pkg/services/api_secret_volume_service_test.go
    - control-plane/assets-service/pkg/services/services_generic_test.go
  x-authorize:
    resource-type: secret-volume-assets
    action: read
  tags:
    - Secret
  parameters:
    - $ref: "../parameters/query/optional/IncludeUsageInfo.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/ComplyToProject.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/ComplyToWorkloadType.yaml"
    - $ref: "../parameters/query/optional/IncludeStatus.yaml"
    - $ref: "../../../../infra/openapi/docs/parameters/query/optional/ComplyToReplicaType.yaml"
  responses:
    200:
      description: Request completed successfully.
      content:
        application/json:
          schema:
            $ref: "../schemas/Secret/SecretAsset.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
put:
  summary: Update a Secret asset.
  description: Use to update the details of a Secret datasource asset by id.
  operationId: update_Secret_asset_by_id
  x-service: assets-service
  x-test-coverage:
    - control-plane/assets-service/pkg/services/api_datasources_service_test.go
    - control-plane/assets-service/pkg/services/api_workloads_service_test.go
    - control-plane/assets-service/pkg/services/api_secret_volume_service_test.go
    - control-plane/assets-service/pkg/services/services_generic_test.go
  x-no-authorization: true
  x-audit: true
  tags:
    - Secret
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/Secret/SecretAssetUpdateRequest.yaml"
  responses:
    202:
      description: Request accepted successfully.
      content:
        application/json:
          schema:
            $ref: "../schemas/Secret/SecretAsset.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    default:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
delete:
  summary: Delete a Secret asset.
  description: Use to delete a Secret datasource asset by id.
  operationId: delete_secret_asset_by_id
  x-service: assets-service
  x-test-coverage:
    - control-plane/assets-service/pkg/services/api_datasources_service_test.go
    - control-plane/assets-service/pkg/services/api_workloads_service_test.go
    - control-plane/assets-service/pkg/services/api_secret_volume_service_test.go
    - control-plane/assets-service/pkg/services/services_generic_test.go
  x-no-authorization: true
  x-audit: true
  tags:
    - Secret
  responses:
    202:
      $ref: "../../../../infra/openapi/docs/responses/202Accepted.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
