parameters:
  - $ref: "../../../../infra/openapi/docs/parameters/path/AssetId.yaml"
get:
  tags:
    - Credentials
  summary: Get a generic-secret.
  description: Returns the details of a generic-secret asset, by id.
  operationId: get_generic_secret_by_id
  x-service: assets-service
  x-test-coverage:
    - control-plane/assets-service/pkg/services/api_credentials_service_test.go
    - control-plane/assets-service/pkg/services/api_credentials_service_generic_secrets_test.go
  x-authorize:
    resource-type: credentials
    action: read
  parameters:
    - $ref: "../parameters/query/optional/IncludeUsageInfo.yaml"
    - $ref: "../parameters/query/optional/IncludeStatus.yaml"
  responses:
    200:
      description: Request completed successfully.
      content:
        application/json:
          schema:
            $ref: "../schemas/GenericSecret/GenericSecret.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
put:
  tags:
    - Credentials
  summary: Update a generic-secret.
  description: Updates the details of a generic-secret asset, by id.
  operationId: update_generic_secret
  x-service: assets-service
  x-test-coverage:
    - control-plane/assets-service/pkg/services/api_credentials_service_test.go
    - control-plane/assets-service/pkg/services/api_credentials_service_generic_secrets_test.go
  x-authorize:
    resource-type: credentials
    action: update
  x-audit: true
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/GenericSecret/GenericSecretUpdateRequest.yaml"
  responses:
    202:
      description: Request accepted successfully.
      content:
        application/json:
          schema:
            $ref: "../schemas/GenericSecret/GenericSecret.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
delete:
  tags:
    - Credentials
  summary: Delete a generic-secret.
  description: Use to delete a generic-secret asset, by id.
  operationId: delete_generic_secret
  x-service: assets-service
  x-test-coverage:
    - control-plane/assets-service/pkg/services/api_credentials_service_test.go
    - control-plane/assets-service/pkg/services/api_credentials_service_generic_secrets_test.go
  x-authorize:
    resource-type: credentials
    action: delete
  x-audit: true
  responses:
    204:
      $ref: "../../../../infra/openapi/docs/responses/204NoContent.yaml"
    400:
      $ref: "../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    401:
      $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    403:
      $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    404:
      $ref: "../../../../infra/openapi/docs/responses/404NotFound.yaml"
    412:
      $ref: "../../../../infra/openapi/docs/responses/412PreconditionFailed.yaml"
    503:
      $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
