post:
      summary: Sync asset resources ids.
      description: Informs the backend about existing asset resources ids as stored in the cluster, 
        in order to synchronize them with the assets at the control-plane.
      operationId: sync_assets_resources_ids
      x-service: assets-service
      x-test-coverage: null
      x-authorize:
        resource-type: pvc-assets
        action: sync
      x-internal: true
      tags:
        - Synchronization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../schemas/Sync/AssetResourcesIdsSyncRequest.yaml"
      responses:
        204:
          $ref: "../../../../infra/openapi/docs/responses/204NoContent.yaml"
        401:
          $ref: "../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
        403:
          $ref: "../../../../infra/openapi/docs/responses/403Forbidden.yaml"
        503:
          $ref: "../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"