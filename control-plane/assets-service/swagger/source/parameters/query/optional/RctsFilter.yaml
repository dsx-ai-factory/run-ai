name: filterBy
in: query
required: false
description: >-
  Filter results by a parameter. Use the format field-name operator value.
  Operators are `==` Equals, `!=` Not equals, `<=` Less than or equal,
  `>=` Greater than or equal, `=@` contains, `!@` Does not contain,
  `=^` Starts with and `=$` Ends with. Dates are in ISO 8601 timestamp format
  and available for operators `==`, `!=`, `<=` and `>=`.
  At most one scope anchor (clusterId, departmentId or projectId) may be
  provided. The anchor is combined with includeAncestors / includeDescendants
  to determine which scopes of the hierarchy are returned.
schema:
  type: array
  maxItems: 10
  items:
    type: string
    pattern: "^(name|clusterId|departmentId|projectId|description|createdAt|createdBy|updatedAt|updatedBy)(==|!=|<=|>=|=@|!@|=\\^|=\\$).+$"
  example: ["name=@gpu", "clusterId==11111111-1111-1111-1111-111111111111"]
explode: false
