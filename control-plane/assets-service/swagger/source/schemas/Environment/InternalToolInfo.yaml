description: Information of the internal tool.
required:
  - toolType
  - connectionType
  - containerPort
properties:
  toolType:
    $ref: "./InternalToolType.yaml"
  connectionType:
    $ref: "./InternalConnectionType.yaml"
  containerPort:
    description: The port within the container that the connection exposes.
    type: integer
    format: int32
    minimum: 1
    maximum: 65535
  nodePortInfo:
    $ref: "./NodePortInfo.yaml"
  externalUrlInfo:
    $ref: "./ExternalUrlInfo.yaml"
  servingPortInfo:
    $ref: "./ServingPortInfo.yaml"
nullable: true
type: object