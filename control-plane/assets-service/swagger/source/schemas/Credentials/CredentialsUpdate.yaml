type: object
required:
  - meta
  - updateCount
properties:
  meta:
    $ref: "../Asset/AssetMetaForSync.yaml"
  updateCount:
    $ref: "../../../../../infra/openapi/docs/schemas/sync/UpdateCount.yaml"
  isDeleted:
    description: the asset has been deleted
    type: boolean
    nullable: true
  spec:
    type: object
    properties:
      accessKey:
        allOf:
          - $ref: "../AccessKey/AccessKeyCreationSpec.yaml"
        nullable: true
      password:
        allOf:
          - $ref: "../Password/PasswordCreationSpec.yaml"
        nullable: true
      genericSecret:
        allOf:
          - $ref: "../GenericSecret/GenericSecretCreationSpec.yaml"
        nullable: true
      dockerRegistry:
        allOf:
          - $ref: "../DockerRegistry/DockerRegistryCreationSpec.yaml"
        nullable: true