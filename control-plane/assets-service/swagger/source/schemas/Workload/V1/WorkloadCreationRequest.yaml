description: Request to create a workload from a set of assets and an optional set of specific env parameters.
required:
  - name
  - clusterId
  - projectId
  - namespace
  - assets
properties:
  name:
    description: The name of the workload.
    type: string
    minLength: 1
  clusterId:
    $ref: "../../../../../../infra/openapi/docs/schemas/scopes/ClusterId.yaml"
  projectId:
    $ref: "../../General/ProjectIdAsNumber.yaml"
  namespace:
    $ref: "../../General/Namespace.yaml"
  assets:
    $ref: "../../../../../../infra/openapi/docs/schemas/assets/AssetsIds.yaml"
  specificEnv:
    $ref: "../SpecificRunParams.yaml"
  distributed:
    $ref: "./Distributed.yaml"
