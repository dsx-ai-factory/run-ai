type: object
required:
  - entries
properties:
  next:
    type: integer
    format: int32
    description: >
      Offset for the next page of results. Present only when there are more entries
      beyond the current page (i.e., the number of returned entries equals the limit).
  entries:
    type: array
    maxItems: 500
    items:
      $ref: "./Rct.yaml"
# Explicit example — otherwise the openapi-generator composes one from the
# nested schemas and picks up unrelated fragments (kind: s3, objectSpec: key: ""),
# producing five copies of a bogus entry. A single realistic RCT is enough.
example:
  entries:
    - meta:
        id: a418ed33-9399-48c0-a890-122cadd13bfd
        name: my-rct
        kind: resource-claim-template
        scope: project
        projectId: 4500001
        createdBy: test@run.ai
        createdAt: "2026-01-01T00:00:00Z"
        updatedBy: test@run.ai
        updatedAt: "2026-01-01T00:00:00Z"
      spec:
        objectMeta:
          labels:
            app: my-app
        objectSpec:
          devices:
            requests:
              - name: gpu
                exactly:
                  deviceClassName: gpu.nvidia.com
                  count: 1
                  allocationMode: ExactCount
