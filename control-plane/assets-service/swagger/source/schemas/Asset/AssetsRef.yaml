description: Reference information about a set of assets. used to describe
  - assets comprising a workspace
  - assets comprising a workspace template
  - assets that use other assets (e.g. s3 asset which uses access key).
required:
  - environment
properties:
  environment:
    description: environment asset.
    allOf:
      - $ref: "../Environment/EnvironmentAssetRef.yaml"
  compute:
    $ref: "./AssetsRefCompute.yaml"
  datasources:
    type: array
    items:
      $ref: "../Datasource/DatasourceRef.yaml"
  workloadVolumes:
    type: array
    items:
      type: string