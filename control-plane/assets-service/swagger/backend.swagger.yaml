          type: integer
          format: int32
          description: The unique id identifying the department.
          example: 2
        departmentAdmins:
          type: array
          items:
            type: string
          description: >-
            Id's of users with department admin role that are assigned to
            managed the department
    Department1:
      allOf:
        - $ref: '#/components/schemas/DepartmentUserDefinedProperties'
        - properties:
            tenantId:
              type: integer
              description: The tenant id this cluster belongs to.
              example: 42
            clusterUuid:
              type: string
              description: The cluster UUID this department belongs to.
              example: UUID
            createdAt:
              type: string
              description: The creation date of the department.
              format: date-time
              example: '2021-12-14T16:04:15.099Z'
            id:
              type: integer
              format: int32
              description: The unique id identifying the department.
              example: 2
            projects:
              type: array
              items:
                $ref: '#/components/schemas/Project1'
              description: Projects under this department.
              example:
                - id: 16
                  name: team-a
                  deserved_gpus: 3
            projectsDeservedGpus:
              type: string
              description: >-
                Total deserved GPUs of the projects under this department - as
