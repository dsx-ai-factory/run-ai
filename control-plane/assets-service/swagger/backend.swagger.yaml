              example: '3.00'
            departmentAdmins:
              type: array
              items:
                type: string
              description: >-
                Id's of users with department admin role that are assigned to
                managed the department
  responses:
    BadRequest:
      description: Bad request.Errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Bad Request
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Unauthorized
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Object not found
    InternalServerError:
      description: unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 500
            message: Internal Server Error
    ServiceUnavailable:
      description: unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 503
            message: Please try again in few minutes
    AlreadyExists:
      description: The specified resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 409
            message: Already exists
  parameters:
    Roles:
      in: query
      required: false
      name: roles
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Role'
      description: Filter the returned entities to only those with the required role
    CreatedByMe:
      in: query
      required: false
      name: onlyCreatedByMe
      schema:
        type: boolean
      description: >-
        Filter the returned entities to only those that created by the
        requesting subject
    ResourceId:
      in: path
      required: true
      name: id
      schema:
        type: string
    ResourceType:
      in: path
      required: true
      name: resourceType
      schema:
        type: string
    ClusterUuid:
      in: path
      name: clusterUuid
      required: true
      description: The unique uuid identifying the cluster.
      schema:
        type: string
        format: uuid
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
    DepartmentId:
      in: path
      name: departmentId
      schema:
        type: integer
      required: true
      description: The unique id identifying the department.
      example: 2
    ProjectId:
      in: path
      name: projectId
      schema:
        type: string
      required: true
      description: The unique project-id identifying the project.
    JobId:
      in: path
      name: jobId
      description: Unique identifier of the job (UUID)
      required: true
      schema:
        type: string
        format: uuid
    Start:
      name: start
      in: query
      description: timestamp from when to fetch data in UTC
      required: false
      schema:
        type: string
        format: date-time
        example: '2023-06-06 12:09:18.211'
    End:
      name: end
      in: query
      description: timestamp until when to fetch data in UTC
      required: false
      schema:
        type: string
        format: date-time
        example: '2023-06-07 12:09:18.211'
    NumberOfSamples:
      name: numberOfSamples
      in: query
      description: the number of samples to take in the time range from start to end.
      required: false
      schema:
        type: integer
        example: 20
        maximum: 100
        minimum: 0
