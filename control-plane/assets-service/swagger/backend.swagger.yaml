        resources:
          type: array
          items:
            $ref: '#/components/schemas/JobResourcesDataOvertime'
    JobResourcesDataOvertime:
      allOf:
        - $ref: '#/components/schemas/JobResourcesData'
        - type: object
          required:
            - timestamp
          properties:
            timestamp:
              type: string
              format: date-time
              example: '2023-06-06T12:09:18.211Z'
    OrgUnit:
      type: object
