          type: string
    ProjectCreateRequest:
      properties:
        name:
          type: string
          description: Project Name
          example: team-a
        departmentId:
          type: integer
          format: int32
          description: ID of the department owning the project
          example: 2
        deservedGpus:
          type: number
          description: >-
            The project GPU allocation that it is deserved to get in case the
            cluster has those resources
          example: 3
        maxAllowedGpus:
          type: number
          description: >-
            An upper limit for the amount of GPUs the project can get (Even if
            over quota is allowed and resources are available)
          example: 5
        gpuOverQuotaWeight:
          type: number
          description: The priority the project gets for over quota resources
          maximum: 3
          minimum: 0
          example: 1
        swapEnabled:
          type: boolean
          description: Flag for enabling thin provisioning for jobs of this project
          example: false
        defaultNodePools:
          type: array
          description: >-
            Default node pools for workload submission under this project (If a
            workload doesnt specify node pools list, this list will be used).
          items:
            type: string
          example:
            - default
        interactiveJobTimeLimitSecs:
          type: number
          description: >-
            A limit for the duration of interactive jobs from this project in
            seconds
          example: 3600
        interactiveJobMaxIdleDurationSecs:
          type: number
          description: >-
            Maximum time duration in seconds that interactive job can be idle
            before it will be terminated
          example: 3000
        interactivePreemptibleJobMaxIdleDurationSecs:
          type: number
          description: >-
            Maximum time duration in seconds that interactive preemptible job
            can be idle before it will be terminated
          example: 3000
        trainingJobTimeLimitSecs:
          type: number
          description: >-
            A limit for the duration of training jobs from this project in
            seconds. Available only from cluster version 2.12
          example: 3600
        trainingJobMaxIdleDurationSecs:
          type: number
          description: >-
            Maximum time duration in seconds that training job can be idle
            before it will be terminated
          example: 3000
        nodeAffinity:
          $ref: '#/components/schemas/JobsNodeAffinity'
          description: Node affinity configuration for jobs of this project
        permissions:
          $ref: '#/components/schemas/ResourcePermissions'
          description: Permissions for users to do CRUD operations on jobs of this project
        resources:
          $ref: '#/components/schemas/AssignedResources'
          description: >-
            Total resources assigned to this Project. If Node Pool feature is
            on, the resources are the sum of all Node Pool Resources.
        nodePoolsResources:
          type: array
          items:
            $ref: '#/components/schemas/NodePoolAssignedResources'
          description: Resources assigned to this Project per Node Pool
        namespace:
          type: string
          description: >-
            The name of an existing namespace to use for the project in the
            cluster.
          example: ns-proj1
    Project1:
      allOf:
        - $ref: '#/components/schemas/ProjectCreateRequest'
        - properties:
            id:
              type: integer
              format: int32
              description: The project id
              readOnly: true
              example: 5
            tenantId:
              type: integer
              format: int32
              description: ID of the tenant owning the project
              example: 2
            clusterUuid:
              type: string
              format: uuid
              description: ID of the cluster owning the project
              example: 71f69d83-ba66-4822-adf5-55ce55efd210
            departmentName:
              type: string
              description: Name of the department owning the project
              example: department-a
            interactiveNodeAffinity:
              type: string
              example: none
            trainNodeAffinity:
              type: string
              example: none
            createdAt:
              type: string
              description: The creation date of the project
              format: date-time
              example: '2021-12-14T16:04:15.099Z'
            status:
              $ref: '#/components/schemas/ProjectStatus'
            phase:
              type: string
              description: project's phase
              example: Ready
    ResourcePermissions:
      properties:
        users:
          type: array
          items:
            type: string
