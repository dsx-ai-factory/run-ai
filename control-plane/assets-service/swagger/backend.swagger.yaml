openapi: 3.0.3
info:
  version: 2.0.0
  description: |
    The aggregated API of Run:ai Control-Plane
  title: Runai API
  license:
    name: 'Run:ai'
    url: www.run.ai
servers:
  - url: 'https://app.run.ai'
  - url: 'https://staging.run.ai'
  - url: 'https://test.run.ai'
security:
  - bearerAuth: []
tags:
  - name: Jobs
    description: job related operations
  - name: Secrets
    description: secret related operations
  - name: Storage Classes
    description: storage class related operations
  - name: PVCs
    description: pvc related operations
  - name: Policy
    description: policy related operations
  - name: Pods
    description: pod related operations
  - name: Deployments
    description: deployment related operations
  - name: Workspaces
    description: workspaces related operations
  - name: Sso
    description: sso related operations
  - name: Authentication
    description: authentication related operations
  - name: Authorization
    description: authorization related operations
  - name: Application
    description: applications related operations
  - name: Tokens
    description: tokens related operations
  - name: Tenant
    description: tenant related operations
  - name: NodePools
    description: node pools related operations
  - name: Clusters
    description: clusters related operations
  - name: Metrics
    description: metrics related operations
  - name: Departments
    description: departments related operations
  - name: Projects
    description: projects related operations
  - name: Admin
    description: admin related operations
paths:
  '/internal/{resourceType}/{id}/ancestors':
    get:
      operationId: getAncestors
      tags:
        - Internal
      summary: Get scoped resource ancestors.
      description: Get the ancestors resource of a scoped resource.
      parameters:
        - $ref: '#/components/parameters/ResourceType'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The resource ancestors.
          content:
            application/json:
              schema:
                type: object
                required:
                  - tenant_id
                properties:
                  tenant_id:
                    type: string
                    example: '1'
                  cluster_uuid:
                    type: string
                    format: uuid
                    nullable: true
                  department_id:
                    type: string
                    example: '1'
                    nullable: true
                  project_id:
                    type: string
                    example: '1'
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/internal/{resourceType}/{id}/name':
    get:
      operationId: getScopeName
      tags:
        - Internal
      summary: Get scoped resource name.
      description: Get the name of a scoped resource.
      parameters:
        - $ref: '#/components/parameters/ResourceType'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The resource name.
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                properties:
                  name:
                    type: string
                    example: tenant-x
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/v1/k8s/clusters/{clusterId}/projects':
    post:
      tags:
        - Projects
      summary: Create a new project.
      description: >-
        Create a new project in the cluster. This endpoint requires EDITOR or
        RESEARCH MANAGER role.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '200':
          description: Project created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project1'
        '400':
          description: Bad Project request.
        '409':
          description: Project failed to be created.
    get:
      tags:
        - Projects
      summary: List all projects.
      description: List all the projects managed by the tenant on a specific cluster.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
        - in: query
          name: memoryUnitMb
          schema:
            type: boolean
          required: false
          description: >-
            should memory be returned in MB. default is "false", in which case
            it will be returned in MiB.
          example: true
      responses:
        '200':
          description: A list of projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project1'
  '/v1/k8s/clusters/{clusterId}/projects/{id}':
    put:
      tags:
        - Projects
      summary: Update a project.
      description: >-
        Updates project details. This endpoint requires EDITOR or RESEARCH
        MANAGER role.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The unique project-id identifying the project.
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project1'
      responses:
        '200':
          description: An updated project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project1'
        '400':
          description: Bad project request.
        '404':
          description: Project not found.
        '409':
          description: Could not update the project.
    delete:
      tags:
        - Projects
      summary: Delete a project.
      description: >-
        Delete a project from the cluster. This endpoint requires EDITOR or
        RESEARCH MANAGER  role.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: The unique id identifying the project.
          example: 2
      responses:
        '200':
          description: Project deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project1'
        '404':
          description: Project not found.
    get:
      tags:
        - Projects
      summary: Get a specific project.
      description: >-
        Get information about a specific project. This endpoint requires view
        permissions to the requested project.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: The unique project-id identifying the project.
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      responses:
        '200':
          description: A project details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project1'
        '404':
          description: Project not found.
  '/v1/k8s/clusters/{clusterId}/projects/status':
    x-internal: true
    put:
      tags:
        - Projects
      summary: Update Project status
      operationId: updateProjectStatus
      parameters:
        - name: clusterId
          in: path
          description: Unique identifier of the cluster
          required: true
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStatusRequest'
        required: true
      responses:
        '201':
          description: Project updated successfully.
        '400':
          description: Bad Project request.
        '404':
          description: Project not found.
  '/v1/k8s/clusters/{clusterId}/departments/{departmentId}':
    get:
      tags:
        - Departments
      summary: Get a department.
      description: Get a specific department by the ID.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: departmentId
          schema:
            type: integer
          required: true
          description: The unique id identifying the department.
          example: 2
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      responses:
        '200':
          description: Departments returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department1'
    put:
      tags:
        - Departments
      summary: Update a department.
      description: Update a department in the cluster. This endpoint requires EDITOR role.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: departmentId
          schema:
            type: integer
          required: true
          description: The unique id identifying the department.
          example: 2
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Department1'
      responses:
        '200':
          description: Department updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department1'
    delete:
      tags:
        - Departments
      summary: Delete a department.
      description: >-
        Delete a department from the cluster. This endpoint requires EDITOR
        role.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: departmentId
          schema:
            type: integer
          required: true
          description: The unique id identifying the department.
          example: 2
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      responses:
        '200':
          description: Department deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department1'
  '/v1/k8s/clusters/{clusterId}/departments':
    get:
      tags:
        - Departments
      summary: Get all departments.
      description: Get list of all the department in the cluster.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
        - in: query
          name: memoryUnitMb
          schema:
            type: boolean
          required: false
          description: >-
            should memory be returned in MB. default is "false", in which case
            it will be returned in MiB.
          example: true
      responses:
        '200':
          description: Departments list returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department1'
    post:
      tags:
        - Departments
      summary: Create a new department.
      description: >-
        Create a new department in the cluster. This endpoint requires EDITOR
        role.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: query
          name: excludePermissions
          schema:
            type: boolean
          required: false
          description: filter permissions
          example: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUserDefinedProperties'
      responses:
        '200':
          description: Department created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department1'
  '/v1/k8s/clusters/{clusterId}/departments/{departmentId}/access-control':
    put:
      tags:
        - Departments
      summary: Set the department admins.
      description: Set the department admins. This endpoint requires EDITOR role.
      parameters:
        - in: path
          name: clusterId
          schema:
            type: string
          required: true
          description: The unique uuid identifying the cluster.
          example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        - in: path
          name: departmentId
          schema:
            type: integer
          required: true
          description: The unique id identifying the department.
          example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentAccessControl'
      responses:
        '201':
          description: Department admin set successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentAccessControl'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
          description: Bad request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
          description: Unauthenticated
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error1'
          description: Forbidden
components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          minimum: 100
          maximum: 599
        message:
          type: string
      example:
        code: 418
        message: I'm a teapot
    ClusterId:
      description: Unique identifier of the cluster
      type: string
      format: uuid
      example: 4008188b-ab50-4aa5-a3f2-b78091ccf92d
    Dashboards:
      properties:
        promProxy:
          type: string
          example: 'http://prometheus-proxy:8080'
        logoutPage:
          type: string
          example: 'http://prometheus-proxy:8080/logout'
        loginPage:
          type: string
          example: 'http://prometheus-proxy:8080/login'
        nowDashboard:
          type: string
          example: 'http://prometheus-proxy:8080/d/now'
        longTermDashboard:
          type: string
          example: 'http://prometheus-proxy:8080/d/long-term'
        clustersDashboard:
          type: string
          example: 'http://prometheus-proxy:8080/d/clusters'
    DepartmentId:
      description: The id of the department
      type: integer
      format: int32
      minimum: 1
      example: 8
    Idp:
      description: Alias for identity provider
      type: string
      example: saml
    UserId:
      description: Unique identifier of the user
      type: string
      format: uuid
      example: 4008188b-ab50-4aa5-a3f2-b78091ccf92d
    Role:
      type: string
      enum:
        - admin
        - department_admin
        - researcher
        - editor
        - viewer
        - research_manager
        - ml_engineer
      example: viewer
    AuthEntityType:
      type: string
      description: The type of authentication entity.
      enum:
        - regular-user
        - sso-user
        - app
        - group
        - internal-user
        - super-admin
      example: regular-user
    AuthEntity:
      properties:
        entityType:
          $ref: '#/components/schemas/AuthEntityType'
        tenantId:
          $ref: '#/components/schemas/TenantId'
        userId:
          $ref: '#/components/schemas/UserId'
        permitAllClusters:
          type: boolean
          example: false
        permittedClusters:
          type: array
          description: A list of clusters that the user or application can access.
          items:
            $ref: '#/components/schemas/ClusterId'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
          description: The creation date of the application.
          example: '2021-12-14T16:04:15.099Z'
    User:
      allOf:
        - $ref: '#/components/schemas/AuthEntity'
        - required:
            - email
        - properties:
            email:
              type: string
              description: Email address of the user.
              example: user@email.com
            lastLogin:
              type: string
              format: date-time
              description: The last time the user logged into the system.
              example: '2021-12-14T16:04:15.099Z'
    UserCreationRequest:
      required:
        - email
        - password
        - roles
      properties:
        email:
          type: string
          description: Email address of the user.
          example: user@email.com
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        entityType:
          $ref: '#/components/schemas/AuthEntityType'
        tenantId:
          $ref: '#/components/schemas/TenantId'
        password:
          type: string
          description: The user's password.
          example: secret!123
        needToChangePassword:
          type: boolean
          description: >-
            True if the user is requested to change his password upon next
            login.
          example: true
        permitAllClusters:
          type: boolean
          example: false
        userId:
          $ref: '#/components/schemas/UserId'
        permittedClusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterId'
    UserCreationResponse:
      allOf:
        - $ref: '#/components/schemas/UserCreationRequest'
    App:
      allOf:
        - $ref: '#/components/schemas/AuthEntity'
        - required:
            - name
        - properties:
            clientId:
              type: string
              description: The client ID of the application.
              example: 6d2894ba-f998-4039-bba1-caba57caf681
            name:
              type: string
              description: The name of the application.
              example: MyApplication
            revoked:
              type: boolean
              description: Whether the application has been revoked.
              example: false
    Secret:
      required:
        - name
      properties:
        secret:
          type: object
          description: The secret.
          properties:
            type:
              type: string
              description: The type of the secret.
              enum:
                - password
                - secret
                - certificate
              example: secret
            value:
              type: string
              description: The value of the secret.
              example: my-secret
    ClientId:
      description: Unique identifier of the app
      type: string
      format: uuid
      example: 4008188b-ab50-4aa5-a3f2-b78091ccf92d
    TenantId:
      type: integer
      description: The id of the tenant
      format: int32
      minimum: 1
      example: 1
    TenantName:
      type: string
      description: The name of the tenant
      example: runai
    Tenant:
      type: object
      required:
        - id
      properties:
        authSettingsId:
          type: integer
          example: 1
        displayName:
          type: string
          example: My Company
        ssoAuthSettingsId:
          type: integer
          example: 1
        authRealm:
          type: string
          example: runai
        id:
          $ref: '#/components/schemas/TenantId'
        name:
          type: string
          example: runai
        eulaSigningUser:
          type: string
          example: ...
        contractType:
          type: string
          example: normal
        smgEnabled:
          type: boolean
          example: true
        authClientID:
          type: string
          example: runai-admin-ui
        cliClientId:
          type: string
          example: runai-cli
    TenantConfig:
      type: object
      properties:
        selfHosted:
          type: boolean
          example: true
        tenantName:
          type: string
          example: runai
        authClientName:
          type: string
          example: runai-admin-ui
        authUrl:
          type: string
          example: 'https://auth.run.ai'
        authRealm:
          type: string
          example: runai
    TenantSetting:
      properties:
        active:
          type: boolean
          example: true
        category:
          type: string
          example: Department
        description:
          type: string
          example: Enable the department feature
        source:
          type: string
          example: Tenant
        lable:
          type: string
          example: Show departments
        stage:
          type: string
          example: Beta
        type:
          type: string
          example: Boolean
        key:
          type: string
          example: department.use
        value:
          type: string
          example: true
    TenantSettingCreationRequest:
      properties:
        key:
          type: string
          example: department.use
        value:
          example: true
    TenantSettingCreationResponse:
      properties:
        msg:
          type: string
          example: done
    GroupCreationRequest:
      required:
        - email
        - password
        - roles
        - username
      properties:
        username:
          type: string
          description: Group's name
          example: group1
        email:
          type: string
          description: Empty email address
          example: ''
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        entityType:
          type: string
          example: sso-user
        tenantId:
          $ref: '#/components/schemas/TenantId'
        permitAllClusters:
          type: boolean
          example: false
        userId:
          type: string
          description: Group's name
          example: group1
        permittedClusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterId'
        createdBy:
          type: string
          description: uid of the user
          example: aaaaa-3333-4444-bbbbbb-111
    GroupCreationResponse:
      allOf:
        - $ref: '#/components/schemas/GroupCreationRequest'
    Group:
      properties:
        entityType:
          type: string
          example: group
        tenantId:
          $ref: '#/components/schemas/TenantId'
        userId:
          type: string
          description: Group's name
          example: group1
        permitAllClusters:
          type: boolean
          example: false
        permittedClusters:
          type: array
          description: A list of clusters that the user or application can access.
          items:
            $ref: '#/components/schemas/ClusterId'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        createdBy:
          type: string
          description: uid of the user
          example: aaaaa-3333-4444-bbbbbb-111
    Cluster:
      type: object
      required:
        - metadata
        - current
      properties:
        metadata:
          type: object
          required:
            - clusterId
            - clusterName
          properties:
            clusterId:
              $ref: '#/components/schemas/ClusterId'
            clusterName:
              $ref: '#/components/schemas/ClusterName'
        current:
          type: object
          description: >-
            Current reported metrics data. resources holds data that is summed
            up to the cluster level and projectResources explains the division
            of it to projects
          required:
            - resources
            - projectResources
          properties:
            resources:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/ResourcesData'
                  - type: object
                    required:
                      - nodepoolName
                    properties:
                      nodepoolName:
                        $ref: '#/components/schemas/NodepoolName'
            projectResources:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/ResourcesData'
                  - type: object
                    required:
                      - projectName
                      - departmentName
                      - nodepoolName
                    properties:
                      projectName:
                        $ref: '#/components/schemas/ProjectName'
                      departmentName:
                        $ref: '#/components/schemas/DepartmentName'
                      nodepoolName:
                        $ref: '#/components/schemas/NodepoolName'
        timeRange:
          $ref: '#/components/schemas/TimeRange'
    Department:
      type: object
      required:
        - metadata
        - current
      properties:
        metadata:
          type: object
          required:
            - departmentId
            - departmentName
            - clusterId
            - clusterName
          properties:
            departmentId:
              $ref: '#/components/schemas/DepartmentId'
            departmentName:
              $ref: '#/components/schemas/DepartmentName'
            clusterId:
              $ref: '#/components/schemas/ClusterId'
