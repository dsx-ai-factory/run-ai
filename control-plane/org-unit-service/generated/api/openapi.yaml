        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get department ancestors
      tags:
      - Departments
      x-no-authorization: true
      x-service: org-unit-service
      x-test-coverage: not-applicable
    x-internal: true
  /internal/org-unit/projects/{projectId}/ancestors:
    get:
      operationId: get_project_ancestors
      parameters:
      - description: The project id
        example: 575c19e8-c7c3-45b0-8290-2f47397a8383
