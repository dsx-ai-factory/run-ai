components:
  parameters:
    OrgUnitIds:
      description: "The org unit unique identifiers, seperated by ','."
      explode: true
      in: query
      name: orgUnitIds
      required: true
      schema:
        example: "7"
        maxLength: 5000
        type: string
      style: form
    DepartmentId:
      description: The id of the department.
      explode: false
      in: path
      name: departmentId
      required: true
      schema:
        example: "1"
        pattern: .*
        type: string
      style: simple
    ProjectId:
      description: The project id
      example: 575c19e8-c7c3-45b0-8290-2f47397a8383
      explode: false
      in: path
      name: projectId
      required: true
      schema:
        type: string
      style: simple
    FilterByCluster:
      description: Filter using the Universally Unique Identifier (UUID) of the cluster.
      explode: true
      in: query
      name: clusterId
      required: false
      schema:
        example: d73a738f-fab3-430a-8fa3-5241493d7128
        format: uuid
        type: string
      style: form
    FilterByNodepoolId:
      description: Filter using the nodepool.
      explode: true
      in: query
      name: nodepoolId
      required: false
      schema:
        example: "1"
        type: string
      style: form
    FilterByDepartment:
      description: Filter using the department id.
      explode: true
      in: query
      name: departmentId
      required: false
      schema:
        example: "1"
        type: string
      style: form
    FilterByProject:
      description: project id to filter by
      explode: true
      in: query
      name: projectId
      required: false
      schema:
        example: "1"
        type: string
      style: form
    ProjectsTelemetryFilterByCreatedAt:
      description: "Filter results by a parameter. Use the format field-name operator\
        \ value. Operators are == Equals, != Not equals, <= Less than or equal, >=\
        \ Greater than or equal. Dates are in ISO 8601 timestamp format."
      explode: false
      in: query
      name: filterBy
      required: false
      schema:
        example:
        - createdAt>=2026-09-01T00:00:00Z
        - createdAt<=2026-09-02T00:00:00Z
        items:
          maxLength: 1000
          pattern: ^(createdAt)(==|!=|<=|>=).+$
          type: string
        maxItems: 10
        type: array
      style: form
    TelemetryGroupByProjectInternal:
      description: project fields to group the data by. Rank is supported only on
        the internal projects telemetry API.
      explode: false
      in: query
      name: groupBy
      required: false
      schema:
        items:
          enum:
          - ClusterId
          - NodepoolId
          - ParentId
          - ProjectId
          - Rank
          type: string
        maxItems: 2
        type: array
      style: form
    TelemetryTypeInternal:
      description: specifies what data to request
      explode: true
      in: query
      name: telemetryType
      required: true
      schema:
        $ref: '#/components/schemas/OrgUnitTelemetryTypeInternal'
      style: form
    ProjectsFilterBy:
      description: "Filter results by a parameter. Use the format field-name operator\
        \ value. Operators are == Equals, != Not equals, <= Less than or equal, >=\
        \ Greater than or equal, =@ contains, !@ Does not contains, =^ Starts with\
        \ and =$ Ends with. Dates are in ISO 8601 timestamp format and available for\
        \ operators ==, !=, <= and >=."
      explode: false
      in: query
      name: filterBy
      required: false
      schema:
        example:
        - name!=some-name
        items:
          pattern: ^(name|clusterId|departmentId|parentId|parentName|phase|totalGpuQuota|gpuAllocated|createdAt|avgGpuAllocation24h|avgGpuUtilization24h|avgGpuMemoryUtilization24h|avgGpuAllocation7d|avgGpuUtilization7d|avgGpuMemoryUtilization7d|avgGpuAllocation30d|avgGpuUtilization30d|avgGpuMemoryUtilization30d)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
          type: string
        maxItems: 10
        type: array
      style: form
    Search:
      description: Filter results by a free text search.
      explode: true
      in: query
      name: search
      required: false
      schema:
        example: test project
        type: string
      style: form
    OrgUnitType:
      description: The org unit type.
      explode: true
      in: query
      name: orgUnitType
      required: true
      schema:
        enum:
        - department
        - project
        type: string
      style: form
    DefaultNodePool:
      description: is created/deleted nodepool is default nodepool
      example: true
      explode: true
      in: query
      name: default
      required: true
      schema:
        type: boolean
      style: form
    NodepoolId:
      description: The unique id identifying the Node Pool.
      explode: false
      in: path
      name: nodepoolId
      required: true
      schema:
        example: "17"
        type: string
      style: simple
    NodepoolSummaryType:
      description: Specify which summary to request.
      example: positiveQuota
      explode: true
      in: query
      name: nodepoolSummaryType
      required: true
      schema:
        $ref: '#/components/schemas/OrgUnitsNodepoolSummaryType'
      style: form
    ClusterId:
      description: The Universally Unique Identifier (UUID) of the cluster.
      explode: false
      in: path
      name: clusterId
      required: true
      schema:
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
        format: uuid
        minLength: 1
        type: string
      style: simple
    DeletedAfter:
      explode: true
      in: query
      name: deletedAfter
      required: true
      schema:
        format: date-time
        type: string
      style: form
    TenantId:
      description: If exists will return the relevant resource for the tenant ID
      example: "1008"
      explode: true
      in: query
      name: tenantId
      required: false
      schema:
        default: ""
        type: string
      style: form
      x-scope:
      - system
    OrgUnitSettingsKey:
      description: The settings key
      explode: false
      in: path
      name: key
      required: true
      schema:
        $ref: '#/components/schemas/OrgUnitSettingsKeyEnum'
      style: simple
    ReportsFilterBy:
      description: "Filter results by a parameter. Use the format field-name operator\
        \ value. Operators are == Equals, != Not equals, <= Less than or equal, >=\
        \ Greater than or equal, =@ contains, !@ Does not contains, =^ Starts with\
        \ and =$ Ends with. Dates are in ISO 8601 timestamp format and available for\
        \ operators ==, !=, <= and >=."
      explode: false
      in: query
      name: filterBy
      required: false
      schema:
        example:
        - name!=some-name
        items:
          pattern: ^(name|createdAt|createdBy|status)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
          type: string
        maxItems: 10
        type: array
      style: form
    ReportsSortBy:
      description: Sort results by a parameters.
      explode: true
      in: query
      name: sortBy
      required: false
      schema:
        $ref: '#/components/schemas/ReportFilterAndSortFields'
      style: form
    SortOrder:
      description: Sort results in descending or ascending order.
      explode: true
      in: query
      name: sortOrder
      required: false
      schema:
        default: asc
        enum:
        - asc
        - desc
        type: string
      style: form
    Offset:
      description: The offset of the first item returned in the collection.
      explode: true
      in: query
      name: offset
      required: false
      schema:
        example: 100
        format: int32
        type: integer
      style: form
    Limit:
      description: The maximum number of entries to return.
      explode: true
      in: query
      name: limit
      required: false
      schema:
        default: 50
        format: int32
        maximum: 500
        minimum: 1
        type: integer
      style: form
    ReportId:
      description: The report id
      example: 575c19e8-c7c3-45b0-8290-2f47397a8383
      explode: false
      in: path
