      x-service: org-unit-service
      x-test-coverage: not-applicable
    x-internal: true
  /internal/org-unit/projects/telemetry:
    get:
      description: |
        Internal endpoint to get projects telemetry data by the given query parameters
      operationId: get_internal_projects_telemetry
      parameters:
      - description: Filter using the Universally Unique Identifier (UUID) of the
          cluster.
        explode: true
        in: query
        name: clusterId
        required: false
        schema:
          example: d73a738f-fab3-430a-8fa3-5241493d7128
          format: uuid
          type: string
        style: form
      - description: Filter using the nodepool.
        explode: true
        in: query
        name: nodepoolId
        required: false
        schema:
          example: "1"
          type: string
        style: form
      - description: Filter using the department id.
        explode: true
        in: query
        name: departmentId
        required: false
        schema:
          example: "1"
          type: string
        style: form
      - description: project id to filter by
        explode: true
        in: query
        name: projectId
        required: false
        schema:
          example: "1"
          type: string
        style: form
      - description: "Filter results by a parameter. Use the format field-name operator\
          \ value. Operators are == Equals, != Not equals, <= Less than or equal,\
          \ >= Greater than or equal. Dates are in ISO 8601 timestamp format."
        explode: false
        in: query
        name: filterBy
        required: false
        schema:
          example:
          - createdAt>=2026-09-01T00:00:00Z
          - createdAt<=2026-09-02T00:00:00Z
          items:
            maxLength: 1000
            pattern: ^(createdAt)(==|!=|<=|>=).+$
            type: string
          maxItems: 10
          type: array
        style: form
      - description: project fields to group the data by. Rank is supported only on
          the internal projects telemetry API.
        explode: false
        in: query
        name: groupBy
        required: false
        schema:
          items:
            enum:
            - ClusterId
            - NodepoolId
            - ParentId
            - ProjectId
            - Rank
            type: string
          maxItems: 2
          type: array
        style: form
      - description: specifies what data to request
        explode: true
        in: query
        name: telemetryType
        required: true
        schema:
          $ref: '#/components/schemas/OrgUnitTelemetryTypeInternal'
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
          description: Executed successfully.
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get internal projects telemetry
      tags:
      - Projects
      x-no-authorization: true
      x-service: org-unit-service
      x-test-coverage:
      - control-plane/org-unit-service/pkg/test/project_telemetry_test.go
    x-internal: true
  /internal/org-unit/projects/count:
    get:
      description: |
        Internal endpoint to count projects by the given query parameters
      operationId: count_internal_projects
      parameters:
      - description: "Filter results by a parameter. Use the format field-name operator\
          \ value. Operators are == Equals, != Not equals, <= Less than or equal,\
          \ >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts\
          \ with and =$ Ends with. Dates are in ISO 8601 timestamp format and available\
          \ for operators ==, !=, <= and >=."
        explode: false
        in: query
        name: filterBy
        required: false
        schema:
          example:
          - name!=some-name
          items:
            pattern: ^(name|clusterId|departmentId|parentId|parentName|phase|totalGpuQuota|gpuAllocated|createdAt|avgGpuAllocation24h|avgGpuUtilization24h|avgGpuMemoryUtilization24h|avgGpuAllocation7d|avgGpuUtilization7d|avgGpuMemoryUtilization7d|avgGpuAllocation30d|avgGpuUtilization30d|avgGpuMemoryUtilization30d)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
            type: string
          maxItems: 10
          type: array
        style: form
      - description: Filter results by a free text search.
        explode: true
        in: query
        name: search
        required: false
        schema:
          example: test project
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
          description: ok
        "400":
          content:
            application/json:
              example:
                code: 400
                message: Required parameter is missing
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad request.
        "401":
          content:
            application/json:
              example:
                code: 401
                message: Issuer is not familiar.
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              example:
                code: 403
                message: You do not have sufficient permissions.
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Count internal projects
      tags:
      - Projects
      x-no-authorization: true
      x-service: org-unit-service
      x-test-coverage:
      - control-plane/org-unit-service/pkg/test/project_api_test.go
