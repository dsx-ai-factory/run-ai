openapi: 3.0.3
info:
  contact:
    email: support@run.ai
    name: Run.AI
    url: https://www.run.ai/
  description: An API for managing RunAi organizational units.
  title: Org unit
  version: "1.0"
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /:
    get:
      operationId: health
      responses:
        "200":
          description: Executed successfully.
      summary: health check.
      tags:
      - Health
      x-service: org-unit-service
      x-no-authorization: true
    x-internal: true
    x-service: org-unit-service
    x-test-coverage: not-applicable
  /internal/org-unit/departments/descendants:
    get:
      operationId: get_departments_descendants
      parameters:
      - description: "The org unit unique identifiers, seperated by ','."
        explode: true
        in: query
        name: orgUnitIds
        required: true
        schema:
          example: "7"
          maxLength: 5000
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Descendants'
          description: Executed successfully.
        "404":
          content:
            application/json:
              example:
                code: 404
                message: Resource id not found.
              schema:
                $ref: '#/components/schemas/Error'
          description: The specified resource was not found
        "500":
          content:
            application/json:
              example:
                code: 500
                message: Something went wrong.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
        "503":
          content:
            application/json:
              example:
                code: 503
                message: Please try again in few minutes.
              schema:
                $ref: '#/components/schemas/Error'
          description: unexpected error
      summary: Get department descendants
      tags:
      - Departments
      x-no-authorization: true
      x-service: org-unit-service
      x-test-coverage: not-applicable
    x-internal: true
  /internal/org-unit/departments/{departmentId}/ancestors:
    get:
      operationId: get_department_ancestors
