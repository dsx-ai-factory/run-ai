openapi: 3.0.3
info:
  title: Org unit
  version: '1.0'
  description: An API for managing RunAi organizational units.
  contact:
    name: Run.AI
    url: https://www.run.ai/
    email: support@run.ai
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /:
    x-internal: true
    x-service: org-unit-service
    x-test-coverage: not-applicable
    get:
      summary: health check.
      x-service: org-unit-service
      x-no-authorization: true
      operationId: health
      tags:
        - Health
      responses:
        '200':
          description: Executed successfully.
  /internal/org-unit/departments/descendants:
    x-internal: true
    get:
      summary: Get department descendants
      operationId: get_departments_descendants
      x-no-authorization: true
      x-internal: true
      x-service: org-unit-service
      x-test-coverage: not-applicable
      tags:
        - Departments
      parameters:
        - $ref: '#/components/parameters/OrgUnitIds'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Descendants'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/org-unit/departments/{departmentId}/ancestors:
    x-internal: true
    get:
      summary: Get department ancestors
      operationId: get_department_ancestors
      x-no-authorization: true
      x-internal: true
      x-service: org-unit-service
      x-test-coverage: not-applicable
      tags:
        - Departments
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ancestors'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/org-unit/projects/{projectId}/ancestors:
    x-internal: true
    get:
      summary: Get project ancestors
      operationId: get_project_ancestors
      x-no-authorization: true
      x-internal: true
      x-service: org-unit-service
      x-test-coverage: not-applicable
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ancestors'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/org-unit/projects/telemetry:
    x-internal: true
    get:
      summary: Get internal projects telemetry
      operationId: get_internal_projects_telemetry
      x-internal: true
      x-no-authorization: true
      x-service: org-unit-service
      x-test-coverage:
        - control-plane/org-unit-service/pkg/test/project_telemetry_test.go
      description: |
        Internal endpoint to get projects telemetry data by the given query parameters
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/FilterByCluster'
        - $ref: '#/components/parameters/FilterByNodepoolId'
        - $ref: '#/components/parameters/FilterByDepartment'
        - $ref: '#/components/parameters/FilterByProject'
        - $ref: '#/components/parameters/ProjectsTelemetryFilterByCreatedAt'
        - $ref: '#/components/parameters/TelemetryGroupByProjectInternal'
        - $ref: '#/components/parameters/TelemetryTypeInternal'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/org-unit/projects/count:
    x-internal: true
    get:
      summary: Count internal projects
      operationId: count_internal_projects
      x-internal: true
      x-no-authorization: true
      x-service: org-unit-service
      x-test-coverage:
        - control-plane/org-unit-service/pkg/test/project_api_test.go
      description: |
        Internal endpoint to count projects by the given query parameters
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/ProjectsFilterBy'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/org-unit/names:
    x-internal: true
    get:
      operationId: getOrgUnitsNames
      tags:
        - Org unit
      summary: Get the names of requested org units.
      x-no-authorization: true
      x-service: org-unit-service
      x-internal: true
      x-test-coverage:
        - control-plane/org-unit-service/pkg/test/org_tree_internal_api_test.go
      description: Get the names of requested org units.
      parameters:
        - $ref: '#/components/parameters/OrgUnitType'
        - $ref: '#/components/parameters/OrgUnitIds'
      responses:
        '200':
          description: The resource name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgUnit'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/org-unit/node-pools:
    post:
      summary: Node pool updated
      operationId: node_pool_updated
      x-service: org-unit-service
      x-no-authorization: true
      x-internal: true
      tags:
        - Notifications
      parameters:
        - $ref: '#/components/parameters/DefaultNodePool'
      requestBody:
        description: Node pool
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodePool'
      responses:
        '201':
          description: Created
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/org-unit/node-pools/{nodepoolId}/summary:
    get:
      summary: Get org units summary per nodepool
      operationId: orgs_node_pool_summary
      x-service: org-unit-service
      x-no-authorization: true
      x-internal: true
      x-test-coverage:
        - control-plane/org-unit-service/pkg/test/org_unit_test.go
      tags:
        - Org unit
      parameters:
        - $ref: '#/components/parameters/NodepoolId'
        - $ref: '#/components/parameters/NodepoolSummaryType'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - orgUnitsNodepoolSummary
                properties:
                  orgUnitsNodepoolSummary:
                    $ref: '#/components/schemas/OrgUnitsNodepoolSummary'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/org-unit/node-pools/resources/reset:
    post:
      summary: Reset resources of a specific nodepool for all departments and projects in the cluster.
      operationId: node_pool_reset_resources
      x-service: org-unit-service
      x-no-authorization: true
      x-internal: true
      x-test-coverage:
        - control-plane/org-unit-service/pkg/test/reset_resources_test.go
      tags:
        - Org unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUnitsNodepoolResourcesResetRequest'
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/org-unit/clusters/{clusterId}:
    delete:
      summary: Cluster deleted
      operationId: cluster_deleted
      x-no-authorization: true
      x-service: org-unit-service
      x-internal: true
      tags:
        - Notifications
      parameters:
        - $ref: '#/components/parameters/ClusterId'
      responses:
        '200':
          description: deleted
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/org-unit/settings:
    post:
      operationId: update_org_unit_settings
      tags:
        - Org unit
      x-no-authorization: true
      x-internal: true
      x-service: org-unit-service
      x-test-coverage:
        - control-plane/org-unit-service/pkg/test/settings_test.go
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgUnitSingleSetting'
      responses:
        '200':
          description: ok.
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/org-unit/org-tree:
    get:
      summary: Get internal org tree
      operationId: get_internal_org_tree
      x-internal: true
      x-no-authorization: true
      x-test-coverage:
        - control-plane/org-unit-service/pkg/test/org_tree_internal_api_test.go
      x-service: org-unit-service
      tags:
        - Org unit
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - orgUnits
                properties:
                  orgUnits:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrgUnit'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /internal/org-unit/deleted-org-units:
    get:
      summary: Get internal deleted org-units
      operationId: get_internal_deleted_org_units
      x-internal: true
      x-no-authorization: true
      x-test-coverage:
        - control-plane/org-unit-service/pkg/test/org_unit_test.go
      x-service: org-unit-service
      tags:
        - Org unit
      parameters:
        - $ref: '#/components/parameters/DeletedAfter'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - orgUnits
                properties:
                  orgUnits:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeletedOrgUnit'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/org-unit:
    x-internal: true
    get:
      summary: Get org tree
      operationId: get_org_tree
      x-no-authorization: true
      x-test-coverage:
        - e2e/src/test/suites/defaultSuite/orgUnit/getOrgApi.test.ts
      x-service: org-unit-service
      tags:
        - Org unit
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - orgUnits
                properties:
                  orgUnits:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrgUnit'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/org-unit/ranks:
    get:
      summary: Get ranks
      operationId: get_ranks
      x-no-authorization: true
      description: Get ranks.
      x-service: org-unit-service
      x-test-coverage:
        - control-plane/org-unit-service/pkg/test/org_unit_test.go
      tags:
        - Org unit
      responses:
        '200':
          description: List of all ranks
          content:
            application/json:
              schema:
                type: object
                properties:
                  ranks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rank'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          $ref: '#/components/responses/409Conflict'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/org-unit/settings:
    get:
      summary: Get org unit settings
      operationId: get_org_unit_settings
      x-service: org-unit-service
      x-test-coverage:
        - control-plane/org-unit-service/pkg/test/settings_test.go
      x-authorize:
        resource-type: settings
        action: read
      tags:
        - Settings
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnitSettingsGetResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/org-unit/settings/{key}:
    put:
      summary: Update org unit setting by key
      operationId: update_org_unit_setting_by_key
      x-service: org-unit-service
      x-test-coverage:
        - control-plane/org-unit-service/pkg/test/settings_test.go
      x-authorize:
        resource-type: settings
        action: update
      tags:
        - Settings
      parameters:
        - $ref: '#/components/parameters/OrgUnitSettingsKey'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgUnitSettingByKeyRequest'
            examples:
              limitQuotaOverSubscription:
                value:
                  enabled: false
      responses:
        '200':
          description: Setting successfully updated
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    get:
      summary: Get org unit setting by key
      operationId: get_org_unit_setting_by_key
      x-service: org-unit-service
      x-test-coverage:
        - control-plane/org-unit-service/pkg/test/settings_test.go
      x-authorize:
        resource-type: settings
        action: read
      tags:
        - Settings
      parameters:
        - $ref: '#/components/parameters/OrgUnitSettingsKey'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnitSetting'
              examples:
                limitQuotaOverSubscription:
                  value:
                    enabled: false
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/org-unit/reports:
    get:
      summary: List reports
      operationId: list_reports
      x-authorize:
        resource-type: project
        action: read
      x-service: org-unit-service
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/reportsApi/consumptionReport.test.ts
      tags:
        - Reports
      parameters:
        - $ref: '#/components/parameters/ReportsFilterBy'
        - $ref: '#/components/parameters/ReportsSortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - reports
                properties:
                  reports:
                    $ref: '#/components/schemas/Reports'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    post:
      summary: Create a new report request.
      operationId: create_report
      x-authorize:
        resource-type: project
        action: create
      x-service: org-unit-service
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/reportsApi/consumptionReport.test.ts
      x-audit: true
      tags:
        - Reports
      requestBody:
        description: Report to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequestFields'
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/org-unit/reports/count:
    get:
      summary: Count reports
      operationId: count_reports
      x-authorize:
        resource-type: project
        action: read
      x-service: org-unit-service
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/reportsApi/consumptionReport.test.ts
      tags:
        - Reports
      parameters:
        - $ref: '#/components/parameters/ReportsFilterBy'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/org-unit/reports/availability:
    get:
      summary: Reports availability
      operationId: are_reports_available
      x-no-authorization: true
      x-service: org-unit-service
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/reportsApi/consumptionReport.test.ts
      tags:
        - Reports
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - isAvailable
                properties:
                  isAvailable:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/org-unit/reports/batch-delete:
    post:
      summary: Delete multiple reports in batch.
      operationId: batch_delete_reports
      x-service: org-unit-service
      description: Deletes multiple reports in a single request. Returns per-report outcomes; deletion is processed asynchronously on the metrics side.
      x-authorize:
        resource-type: project
        action: delete
      x-audit: true
      x-test-coverage: control-plane/org-unit-service/pkg/test/reports_batch_api_test.go
      tags:
        - Reports
      requestBody:
        description: Batch of report IDs to delete.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteReportsRequest'
      responses:
        '202':
          description: Batch delete accepted. Check accepted and failed lists for per-report outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeleteReportsResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/org-unit/reports/{reportId}:
    get:
      summary: Get report
      operationId: get_report_by_id
      x-authorize:
        resource-type: project
        action: read
      x-service: org-unit-service
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/reportsApi/consumptionReport.test.ts
      parameters:
        - $ref: '#/components/parameters/ReportId'
      tags:
        - Reports
      responses:
        '200':
          description: Executed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
    delete:
      summary: Delete report
      operationId: delete_report_by_id
      x-authorize:
        resource-type: project
        action: delete
      x-service: org-unit-service
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/reportsApi/consumptionReport.test.ts
      x-audit: true
      parameters:
        - $ref: '#/components/parameters/ReportId'
      tags:
        - Reports
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /api/v1/org-unit/reports/{reportId}/file:
    get:
      summary: Download report
      operationId: download_report_by_id
      x-authorize:
        resource-type: project
        action: read
      x-service: org-unit-service
      x-test-coverage:
        - e2e/src/test/suites/advancedSuite/reportsApi/consumptionReport.test.ts
      parameters:
        - $ref: '#/components/parameters/ReportId'
      tags:
        - Reports
      responses:
        '200':
          description: Executed successfully.
