      properties:
        interactiveJobTimeLimitSeconds:
          type: integer
          description: interactive job time limit in seconds
          nullable: true
          example: 100
          minimum: 1
        interactiveJobMaxIdleDurationSeconds:
          type: integer
          description: interactive job max idle duration in seconds
          nullable: true
          example: 100
          minimum: 1
        interactiveJobPreemptIdleDurationSeconds:
          type: integer
          description: interactive job preempt idle duration in seconds
          nullable: true
          example: 100
          minimum: 1
        trainingJobMaxIdleDurationSeconds:
          type: integer
          description: training job max idle duration in seconds
          nullable: true
          example: 100
          minimum: 1
        trainingJobTimeLimitSeconds:
          type: integer
          description: training job time limit in seconds
          nullable: true
          example: 100
          minimum: 1
    NodeTypesPerWorkload:
      deprecated: true
      description: 'Deprecated: use a workload policy node selector to target node types instead. Node type configurations for different workload types (training, workspace). Specifies which node types are allowed for each workload type. Enforced when no node type is configured in the workload policy.'
      properties:
        training:
          type: array
          maxItems: 20
          description: ids of the node types for training workloads
          items:
            type: string
        workspace:
          type: array
          maxItems: 20
          description: ids of the node types for workspace workloads
          items:
            type: string
        names:
          nullable: true
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
          description: mapping of ids to names
    DataUpdatableDepartmentFields:
      type: object
      description: Updatable fields
      required:
        - resources
      properties:
        description:
          type: string
          description: The description of the department.
        schedulingRules:
          $ref: '#/components/schemas/SchedulingRules'
        defaultNodePools:
          description: An ordered list of node pools that defines the default scheduling preference for workloads in this department. The Scheduler will attempt to schedule workloads on node pools in this order. This setting is enforced if no node pool list is defined in the workload policy.
          type: array
          maxItems: 20
          nullable: true
          items:
            type: string
        nodeTypes:
          $ref: '#/components/schemas/NodeTypesPerWorkload'
    OvertimeRangeData:
      type: object
