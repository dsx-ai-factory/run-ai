components:
  parameters:
    OrgUnitIds:
      in: query
      required: true
      description: The org unit unique identifiers, seperated by ','.
      name: orgUnitIds
      schema:
        type: string
        maxLength: 5000
        example: '7'
    DepartmentId:
      name: departmentId
      in: path
      required: true
      description: The id of the department.
      schema:
        type: string
        example: '1'
        pattern: .*
    ProjectId:
      name: projectId
      in: path
      required: true
      description: The project id
      example: 575c19e8-c7c3-45b0-8290-2f47397a8383
      schema:
        type: string
    FilterByCluster:
      name: clusterId
      in: query
      description: Filter using the Universally Unique Identifier (UUID) of the cluster.
      required: false
      schema:
        type: string
        format: uuid
        example: d73a738f-fab3-430a-8fa3-5241493d7128
    FilterByNodepoolId:
      name: nodepoolId
      in: query
      description: Filter using the nodepool.
      required: false
      schema:
        type: string
        example: '1'
    FilterByDepartment:
      name: departmentId
      in: query
      description: Filter using the department id.
      required: false
      schema:
        type: string
        example: '1'
    FilterByProject:
      name: projectId
      in: query
      description: project id to filter by
      required: false
      schema:
        type: string
        example: '1'
    ProjectsTelemetryFilterByCreatedAt:
      name: filterBy
      in: query
      required: false
      description: Filter results by a parameter. Use the format field-name operator value. Operators are == Equals, != Not equals, <= Less than or equal, >= Greater than or equal. Dates are in ISO 8601 timestamp format.
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          maxLength: 1000
          pattern: ^(createdAt)(==|!=|<=|>=).+$
        example:
          - createdAt>=2026-09-01T00:00:00Z
          - createdAt<=2026-09-02T00:00:00Z
      explode: false
    TelemetryGroupByProjectInternal:
      name: groupBy
      in: query
      description: project fields to group the data by. Rank is supported only on the internal projects telemetry API.
      explode: false
      required: false
      schema:
        type: array
        maxItems: 2
        items:
          type: string
          enum:
            - ClusterId
            - NodepoolId
            - ParentId
            - ProjectId
            - Rank
    TelemetryTypeInternal:
      name: telemetryType
      in: query
      required: true
      description: specifies what data to request
      schema:
        $ref: '#/components/schemas/OrgUnitTelemetryTypeInternal'
    ProjectsFilterBy:
      name: filterBy
      in: query
      required: false
      description: Filter results by a parameter. Use the format field-name operator value. Operators are == Equals, != Not equals, <= Less than or equal, >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts with and =$ Ends with. Dates are in ISO 8601 timestamp format and available for operators ==, !=, <= and >=.
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          pattern: ^(name|clusterId|departmentId|parentId|parentName|phase|totalGpuQuota|gpuAllocated|createdAt|avgGpuAllocation24h|avgGpuUtilization24h|avgGpuMemoryUtilization24h|avgGpuAllocation7d|avgGpuUtilization7d|avgGpuMemoryUtilization7d|avgGpuAllocation30d|avgGpuUtilization30d|avgGpuMemoryUtilization30d)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
        example:
          - name!=some-name
      explode: false
    Search:
      name: search
      in: query
      required: false
      description: Filter results by a free text search.
      schema:
        type: string
        example: test project
    OrgUnitType:
      in: query
      required: true
      description: The org unit type.
      name: orgUnitType
      schema:
        type: string
        enum:
          - department
          - project
    DefaultNodePool:
      name: default
      in: query
      required: true
      description: is created/deleted nodepool is default nodepool
      example: true
      schema:
        type: boolean
    NodepoolId:
      name: nodepoolId
      in: path
      required: true
      description: The unique id identifying the Node Pool.
      schema:
        type: string
        example: 17
    NodepoolSummaryType:
      name: nodepoolSummaryType
      in: query
      required: true
      description: Specify which summary to request.
      example: positiveQuota
      schema:
        $ref: '#/components/schemas/OrgUnitsNodepoolSummaryType'
    ClusterId:
      name: clusterId
      in: path
      required: true
      description: The Universally Unique Identifier (UUID) of the cluster.
      schema:
        type: string
        format: uuid
        minLength: 1
        example: 9f55255e-11ed-47c7-acef-fc4054768dbc
    DeletedAfter:
      name: deletedAfter
      in: query
      required: true
      schema:
        type: string
        format: date-time
    TenantId:
      name: tenantId
      in: query
      required: false
      x-scope:
        - system
      description: If exists will return the relevant resource for the tenant ID
      example: '1008'
      schema:
        type: string
        default: ''
    OrgUnitSettingsKey:
      name: key
      in: path
      required: true
      description: The settings key
      schema:
        $ref: '#/components/schemas/OrgUnitSettingsKeyEnum'
    ReportsFilterBy:
      name: filterBy
      in: query
      required: false
      description: Filter results by a parameter. Use the format field-name operator value. Operators are == Equals, != Not equals, <= Less than or equal, >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts with and =$ Ends with. Dates are in ISO 8601 timestamp format and available for operators ==, !=, <= and >=.
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          pattern: ^(name|createdAt|createdBy|status)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
        example:
          - name!=some-name
      explode: false
    ReportsSortBy:
      name: sortBy
      in: query
      required: false
      description: Sort results by a parameters.
      schema:
        $ref: '#/components/schemas/ReportFilterAndSortFields'
    SortOrder:
      name: sortOrder
      in: query
      required: false
      description: Sort results in descending or ascending order.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    Offset:
      name: offset
      in: query
      required: false
      description: The offset of the first item returned in the collection.
      schema:
        type: integer
        format: int32
        example: 100
    Limit:
      name: limit
      in: query
      required: false
      description: The maximum number of entries to return.
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 500
    ReportId:
      name: reportId
      in: path
      required: true
      description: The report id
      example: 575c19e8-c7c3-45b0-8290-2f47397a8383
      schema:
        type: string
        format: uuid
    DepartmentsFilterBy:
      name: filterBy
      in: query
      required: false
      description: Filter results by a parameter. Use the format field-name operator value. Operators are == Equals, != Not equals, <= Less than or equal, >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts with and =$ Ends with. Dates are in ISO 8601 timestamp format and available for operators ==, !=, <= and >=.
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          pattern: ^(name|clusterId|totalGpuQuota|gpuAllocated|createdAt|avgGpuAllocation24h|avgGpuUtilization24h|avgGpuMemoryUtilization24h|avgGpuAllocation7d|avgGpuUtilization7d|avgGpuMemoryUtilization7d|avgGpuAllocation30d|avgGpuUtilization30d|avgGpuMemoryUtilization30d)(==|!=|<=|>=|=@|!@|=\^|=\$).+$
        example:
          - name!=some-name
      explode: false
    DepartmentsSortBy:
      name: sortBy
      in: query
      required: false
      description: Sort results by a parameters.
      schema:
        $ref: '#/components/schemas/DepartmentFilterSortFields'
    DepartmentsVerbosity:
      name: verbosity
      in: query
      required: false
      description: Departments verbosity. If it is set to "verbose", status will be returned. If it is not defined or set to "brief" only unit specific data will be returned.
      example: verbose
      schema:
        $ref: '#/components/schemas/Verbosity'
    OrgUnitMetricTypes:
      name: metricType
      in: query
      required: true
      description: Specify which data to request.
      explode: false
      schema:
        type: array
        maxItems: 10
        items:
          $ref: '#/components/schemas/OrgUnitMetricType'
    StartRequired:
      name: start
      in: query
      description: Start date of time range to fetch data in ISO 8601 timestamp format.
      required: true
      schema:
        type: string
        format: date-time
        example: '2023-06-06T12:09:18.211Z'
    EndRequired:
      name: end
      in: query
      description: End date of time range to fetch data in ISO 8601 timestamp format.
      required: true
      schema:
        type: string
        format: date-time
        example: '2023-06-07T12:09:18.211Z'
    NumberOfSamples:
      name: numberOfSamples
      in: query
      description: The number of samples to take in the specified time range.
      required: false
      schema:
        type: integer
        example: 20
        maximum: 1000
        minimum: 0
        default: 20
    FilterByNodepoolName:
      name: nodepoolName
      in: query
      description: Filter using the nodepool.
      required: false
      schema:
        type: string
        example: default
    MetricsGroupBy:
      name: groupBy
