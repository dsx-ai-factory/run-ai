        name:
          type: string
          example: organization1
        children:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentProjectChild'
    QuotaStatusResource:
      type: object
      properties:
        gpu:
          type: number
          format: double
          description: The number of GPUs (allocated/requested/...).
          example: 0
        cpu:
          type: number
          format: double
          description: CPU in Millicores (allocated/requested/...).
          example: 1000
        memory:
          type: number
          format: double
          description: Memory in MB (allocated/requested/...).
          example: 1000
    QuotaStatus:
      type: object
      description: Sum of all quota statuses of all the node pools
      properties:
        allocated:
          $ref: '#/components/schemas/QuotaStatusResource'
        allocatedNonPreemptible:
          $ref: '#/components/schemas/QuotaStatusResource'
        requested:
          $ref: '#/components/schemas/QuotaStatusResource'
    TotalResources:
      type: object
      properties:
        gpuQuota:
          type: number
          format: double
          description: Total gpu quota of the org unit
          nullable: true
        cpuQuota:
          type: number
          format: double
          description: Total cpu quota of the org unit in Millicores
          nullable: true
        memoryQuota:
          type: number
          format: double
          description: Total memory quota of the org unit in MB
          nullable: true
    NonNullResource:
      properties:
        deserved:
          type: number
          format: double
          description: The GPU quota assigned to this org-unit.
          example: 1000
          default: 0
        limit:
          type: number
          format: double
          description: The maximum GPU device allocation the org-unit can get from this node pool, representing the maximum sum of assigned quota and over-quota GPUs. Set to null for unlimited.
          nullable: true
          example: 0
        overQuotaWeight:
          type: number
          format: double
          description: |
            The weight assigned to determine the org-unit's share of over-quota resources within its rank. When multiple org-units share the same rank in a node pool, resources are distributed proportionally based on their weights. Valid values: 1–20. Requires over-quota weight to be enabled. When enabled, the default is 2. See [GPU over quota](/run-ai/self-hosted/documentation/platform-management/manage-ai-initiatives/organization/projects) for more details.
          nullable: true
          example: 2
    Resource:
      properties:
        deserved:
          type: number
          format: double
          description: The resource quota assigned to this org-unit.
          nullable: true
          example: 1000
        limit:
          type: number
          format: double
          description: The maximum resource allocation for this org-unit. Set to null for unlimited.
          nullable: true
          example: 0
        overQuotaWeight:
          type: number
          format: double
          description: |
            The weight assigned to determine the org-unit's share of over-quota resources within its rank. When multiple org-units share the same rank in a node pool, resources are distributed proportionally based on their weights. Valid values: 1–20. Requires over-quota weight to be enabled. When enabled, the default is 2. See [GPU over quota](/run-ai/self-hosted/documentation/platform-management/manage-ai-initiatives/organization/projects) for more details.
          nullable: true
          example: 2
