type: object
required:
  - capacity
  - orgUnits
properties:
  capacity:
    description: The GPUs the simulation split.
    allOf:
      - $ref: "./FairShareSimulationResources.yaml"
  parent:
    description: |
      When the requested org units are projects: their department's own result. Null when the caller can't read the
      department.
    nullable: true
    allOf:
      - $ref: "./FairShareSimulationResult.yaml"
  orgUnits:
    type: array
    description: One result per requested org unit, in the request's order.
    items:
      $ref: "./FairShareSimulationResult.yaml"
