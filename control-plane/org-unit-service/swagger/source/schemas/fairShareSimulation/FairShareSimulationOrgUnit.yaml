type: object
required:
  - id
  - type
properties:
  id:
    type: string
    example: "4500014"
  type:
    type: string
    enum:
      - department
      - project
  rank:
    type: string
    description: Sent together with resources. Replaces the stored rank.
    example: High
  resources:
    description: Sent together with rank. Replaces the stored resources; -1 means unlimited.
    nullable: true
    allOf:
      - $ref: "../ResourcesPerNodePool.yaml"
  demand:
    description: Resources a project asks for. Without it the project asks for the most it can get. Not allowed on departments, which ask for the sum of their projects' demand.
    nullable: true
    allOf:
      - $ref: "../QuotaStatusResource.yaml"
