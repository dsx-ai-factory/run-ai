type: object
description: A requested org unit. Each field replaces the stored value on its own; omitted fields keep it.
required:
  - id
properties:
  id:
    type: string
    example: "4500014"
  rank:
    type: string
    nullable: true
    description: Highest … Lowest. Only while ranks is on.
    example: High
  gpu:
    type: object
    nullable: true
    allOf:
      - $ref: "./FairShareSimulationGpuSettings.yaml"
  demand:
    type: object
    nullable: true
    description: GPUs the org unit asks for (the dragged slider). Above the limit it is capped. Without it, the default demand.
    allOf:
      - $ref: "./FairShareSimulationResources.yaml"
