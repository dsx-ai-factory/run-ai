type: object
required:
  - id
  - type
properties:
  id:
    type: string
    example: "4500014"
  type:
    type: string
    enum:
      - department
      - project
  rank:
    type: string
    description: Replaces the stored rank.
    example: High
  gpu:
    $ref: "./FairShareSimulationGpuSettings.yaml"
  demand:
    description: GPUs the org unit asks for. Without it, the most it can get; for a department, the sum of its projects' demand.
    allOf:
      - $ref: "./FairShareSimulationResources.yaml"
