type: object
required:
  - id
  - type
  - fairShare
  - guaranteed
  - overQuota
  - unmet
  - weightShareInRank
properties:
  id:
    type: string
    example: "4500014"
  type:
    type: string
    enum:
      - department
      - project
  parentId:
    type: string
    nullable: true
  fairShare:
    description: Resources the scheduler would give the org unit when the node pool is fully busy, the sum of guaranteed and overQuota.
    allOf:
      - $ref: "./FairShareSimulationResources.yaml"
  guaranteed:
    description: The part of the fair share that comes from the org unit's quota.
    allOf:
      - $ref: "./FairShareSimulationResources.yaml"
  overQuota:
    description: The part of the fair share above the org unit's quota.
    allOf:
      - $ref: "./FairShareSimulationResources.yaml"
  unmet:
    description: Demand the fair share does not cover. Without a demand, measured against the org unit's limit, else its parent's limit, else the node pool's capacity.
    allOf:
      - $ref: "./FairShareSimulationResources.yaml"
  weightShareInRank:
    type: number
    format: double
    description: The org unit's over-quota weight divided by the total weight of its rank among its siblings, including the ones the caller can't read. With ranks off, among all its siblings.
    example: 0.25
