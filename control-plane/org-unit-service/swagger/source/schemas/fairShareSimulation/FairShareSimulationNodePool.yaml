type: object
description: The node pool to simulate, saved or not.
required:
  - capacity
  - schedulingCapabilities
properties:
  capacity:
    description: |
      GPUs to split. 0 is valid; quotas are still granted, as the scheduler does, and nothing is given above them.
      Required; null is rejected.
    nullable: true
    allOf:
      - $ref: "./FairShareSimulationResources.yaml"
  schedulingCapabilities:
    description: Required; null is rejected.
    nullable: true
    allOf:
      - $ref: "./FairShareSimulationSchedulingCapabilities.yaml"
