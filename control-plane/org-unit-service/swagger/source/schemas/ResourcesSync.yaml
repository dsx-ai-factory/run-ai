required:
  - gpu
properties:
  nodePool:
    required:
      - id
    properties:
      id:
        type: string
        description: The ID of the node pool.
        example: 22
      name:
        type: string
        description: The name of the node pool.
        example: default
    description: The node pool to which this resource configuration applies.
    type: object
    nullable: true
  gpu:
    type: object
    required:
      - deserved
    allOf:
      - $ref: "./NonNullResource.yaml"
      - description: Defines the GPU quota assignment, maximum GPU device allocation, and weight assigned that determines the fairshare of over-quota resources.
  cpu:
    type: object
    nullable: true
    allOf:
      - $ref: "./Resource.yaml"
      - description: Defines the CPU quota assignment in millicores (1000 millicores = 1 CPU core), maximum CPU allocation, and weight.
  memory:
    type: object
    nullable: true
    allOf:
      - $ref: "./Resource.yaml"
      - description: Defines the CPU memory quota assignment, maximum allocation, and weight.
  rank:
    type: integer
    nullable: false
    example: 100
  priority:
    deprecated: true
    type: integer
    nullable: false
    example: 100