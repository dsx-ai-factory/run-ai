allOf:
  - $ref: "./DataDepartmentFields.yaml"
  - type: object
    required:
      - id
      - name
      - description
      - createdAt
      - updatedAt
      - totalResources
    properties:
      id:
        type: string
        example: 50
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
      createdBy:
        type: string
      updatedBy:
        type: string
      children:
        type: array
        nullable: true
        items:
          $ref: "./DepartmentProjectChild.yaml"
      projectsAggregatedResources:
        type: array
        nullable: true
        items:
          $ref: "../AggregatedResources.yaml"
      status:
        type: object
        properties:
          nodePoolQuotaStatuses:
            type: array
            items:
              $ref: '../QuotaStatusNodePool.yaml'
          quotaStatus:
            $ref: '../QuotaStatus.yaml'
      totalResources:
        $ref: "../TotalResources.yaml"
      resources:
        type: array
        items:
          $ref: "../../schemas/Resources.yaml"
        description: Resources assigned to this Organization per Node Pool