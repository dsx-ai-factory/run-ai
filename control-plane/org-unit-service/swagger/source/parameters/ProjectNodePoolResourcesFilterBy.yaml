name: filterBy
in: query
required: false
description: Filter results by a parameter. Use the format field-name operator value. Operators are == Equals, != Not equals, <= Less than or equal, >= Greater than or equal, =@ contains, !@ Does not contains, =^ Starts with and =$ Ends with. Dates are in ISO 8601 timestamp format and available for operators ==, !=, <= and >=. gpuLimit takes a number and the operators ==, !=, <= and >=; a missing limit counts as -1 (unlimited), so gpuLimit!=-1 matches only org units with a GPU limit.
schema:
  type: array
  maxItems: 10
  items:
    type: string
    pattern: "^((nodePoolName|nodePoolId|parentId|orgUnitId|orgUnitName|rank|clusterId)(==|!=|<=|>=|=@|!@|=\\^|=\\$)|gpuLimit(==|!=|<=|>=)).+$"
  example: ["nodePoolName!=some-name", "gpuLimit!=-1"]
explode: false
