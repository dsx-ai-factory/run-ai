summary: Patch project resources
operationId: patch_project_resources
x-service: org-unit-service
description: Updates the resources of the node pools in the request. Node pools that are not in the request stay unchanged. Each node pool in the request is replaced as a whole. GPU deserved is required for node pools with quota enabled, and other omitted fields are set to their defaults. To change only part of a node pool, for example only its rank, use the node pool resources batch patch.
x-test-coverage:
  - control-plane/org-unit-service/pkg/test/project_api_test.go
x-authorize:
  resource-type: project
  action: update
  resource-id: projectId
x-audit: true
tags:
  - Projects
parameters:
  - $ref: "../../parameters/ProjectId.yaml"
requestBody:
  description: Project resources to patch.
  required: true
  content:
    application/json:
      schema:
        $ref: "../../schemas/ResourcesUpdateRequest.yaml"
responses:
  200:
    description: Updated
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../schemas/Resources.yaml"
  400:
    $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
  401:
    $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
  403:
    $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
  404:
    $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
  503:
    $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
