get:
  summary: Get projects for sync
  operationId: get_sync_projects
  x-internal: true
  x-authorize:
    resource-type: project
    action: sync
  x-service: org-unit-service
  x-test-coverage:
    - e2e/src/test/suites/playwright/serial/regression/suricata/orgUnit/orgUnitSync.test.ts
  tags:
    - Projects
  parameters:
    - $ref: '../../../../../infra/openapi/docs/parameters/query/mandatory/ClusterIdRequired.yaml'
    - $ref: "../../parameters/UpdatedAfter.yaml"
    - $ref: '../../../../../infra/openapi/docs/parameters/query/optional/Offset.yaml'
    - $ref: '../../../../../infra/openapi/docs/parameters/query/optional/Limit.yaml'
    - $ref: "../../parameters/ExcludePermissions.yaml"
  responses:
    200:
      description: ok
      content:
        application/json:
          schema:
            type: object
            required:
              - projects
            properties:
              projects:
                type: array
                items:
                  $ref: "../../schemas/projects/ProjectSync.yaml"
              next:
                type: integer
                example: 1
    400:
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    503:
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
post:
  summary: Sync cluster projects
  operationId: sync_projects
  x-internal: true
  x-authorize:
    resource-type: project
    action: sync
  x-service: org-unit-service
  x-test-coverage:
    - e2e/src/test/suites/playwright/serial/regression/suricata/orgUnit/orgUnitSync.test.ts
  tags:
    - Projects
  requestBody:
    description: Projects sync data.
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - clusterId
            - projects
          properties:
            clusterId:
              type: string
              format: uuid
            projects:
              type: array
              items:
                $ref: "../../schemas/projects/ProjectInSyncRequest.yaml"
  responses:
    204:
      description: No content
    400:
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    503:
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'