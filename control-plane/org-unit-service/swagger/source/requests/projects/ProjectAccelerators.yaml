get:
  summary: List accelerator resources and models accessible to a project
  operationId: get_project_accelerators
  x-service: org-unit-service
  description: List observed accelerator resources and model selectors across the project's assigned node pools. Includes busy devices.
  x-test-coverage:
    - control-plane/org-unit-service/pkg/test/project_api_test.go
  x-authorize:
    resource-type: project
    action: read
    resource-id: projectId
  tags: [Projects]
  parameters:
    - $ref: "../../parameters/ProjectId.yaml"
    - in: query
      name: resourceName
      description: With deviceLabelKey and gpuType, check only this exact accelerator selection.
      schema:
        type: string
    - in: query
      name: deviceLabelKey
      description: Exact node label key to check, including administrator-defined keys.
      schema:
        type: string
    - in: query
      name: gpuType
      description: Exact device label value to check. Supply all three parameters for an exact lookup.
      schema:
        type: string
  responses:
    "400":
      $ref: "../../../../../infra/openapi/docs/responses/400BadRequest.yaml"
    "200":
      description: Project accelerator inventory
      content:
        application/json:
          schema:
            $ref: "../../../../../infra/openapi/docs/schemas/resources/ProjectAccelerators.yaml"
    "401":
      $ref: "../../../../../infra/openapi/docs/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../../../../infra/openapi/docs/responses/403Forbidden.yaml"
    "404":
      $ref: "../../../../../infra/openapi/docs/responses/404NotFound.yaml"
    "503":
      $ref: "../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml"
