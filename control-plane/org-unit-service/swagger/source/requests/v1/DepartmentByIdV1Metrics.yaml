get:
  deprecated: true
  summary: Get metrics for a specific department.
  description: "Get metrics for a specific department in the cluster. \nUse a time range to return historical data (optional). If you use a `start` date, an `end` date is required.\n"
  operationId: get_department_metrics_v1
  x-service: org-unit-service
  x-internal: true
  x-test-coverage:
    - control-plane/org-unit-service/pkg/test/metrics_v1_api_test.go
  x-authorize:
    resource-type: department
    action: read
    resource-id: departmentId
  tags:
    - Departments v1
  parameters:
    - $ref: "../../parameters/v1/ClusterUuidV1.yaml"
    - $ref: "../../../../../infra/openapi/docs/parameters/path/DepartmentId.yaml"
    - $ref: "../../../../../infra/openapi/docs/parameters/query/optional/Start.yaml"
    - $ref: "../../../../../infra/openapi/docs/parameters/query/optional/End.yaml"
    - $ref: "../../../../../infra/openapi/docs/parameters/query/optional/NumberOfSamples.yaml"
    - $ref: "../../parameters/v1/MetricsV1NodePool.yaml"
  responses:
    200:
      description: Successfully retrieved metrics for all departments.
      content:
        application/json:
          schema:
            $ref: "../../schemas/v1/metrics/DepartmentMetricsV1Response.yaml"
    400:
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    404:
      $ref: '../../../../../infra/openapi/docs/responses/404NotFound.yaml'
    503:
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
