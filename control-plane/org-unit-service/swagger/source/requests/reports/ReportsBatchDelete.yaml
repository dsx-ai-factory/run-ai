post:
  summary: Delete multiple reports in batch.
  operationId: batch_delete_reports
  x-service: org-unit-service
  # barak:todo Sherin to supply the customer-facing wording for this operation and the
  # docs page, now that the endpoint is published. It has to say that a 202 means the
  # reports were accepted rather than deleted, and that a report being generated cannot
  # be deleted until it finishes.
  description: Deletes multiple reports in a single request. Returns per-report outcomes; deletion is processed asynchronously on the metrics side.
  x-authorize:
    resource-type: project
    action: delete
  x-audit: true
  x-test-coverage: control-plane/org-unit-service/pkg/test/reports_batch_api_test.go
  tags:
    - Reports
  requestBody:
    description: Batch of report IDs to delete.
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/batch/BatchDeleteReportsRequest.yaml"
  responses:
    202:
      # barak:todo Sherin to supply the customer-facing wording for the accepted response.
      description: Batch delete accepted. Check accepted and failed lists for per-report outcomes.
      content:
        application/json:
          schema:
            $ref: "../../schemas/batch/BatchDeleteReportsResponse.yaml"
    400:
      $ref: '../../../../../infra/openapi/docs/responses/400BadRequest.yaml'
    401:
      $ref: '../../../../../infra/openapi/docs/responses/401Unauthorized.yaml'
    403:
      $ref: '../../../../../infra/openapi/docs/responses/403Forbidden.yaml'
    500:
      $ref: '../../../../../infra/openapi/docs/responses/500InternalServerError.yaml'
    503:
      $ref: '../../../../../infra/openapi/docs/responses/503ServiceUnavailable.yaml'
