keycloakx:
  enabled: true
  argoRollouts: false
  serviceAccount:
    name: keycloak-http
    automountServiceAccountToken: false
  name: keycloakx
  fullnameOverride: keycloak
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.6"
  imagePullSecrets:
    - name: runai-reg-creds
  command:
    - /bin/sh
    - -c
    - |
      KC_BOOTSTRAP_ADMIN_USERNAME="$(cat /run/secrets/keycloak/admin-username)" \
      KC_BOOTSTRAP_ADMIN_PASSWORD="$(cat /run/secrets/keycloak/admin-password)" \
      exec /opt/keycloak/bin/kc.sh start \
        --features=token-exchange,admin-fine-grained-authz:v1 \
  proxy:
    mode: xforwarded
    http:
      enabled: true
      relativePath: /auth
  database:
    vendor: postgres
    dbschema: keycloak
  adminUser: admin
  adminPassword: ""
  existingSecret: ''
  secretKeys:
    adminPasswordKey: admin-password
  config:
    otelEnable: false
    otelServiceName: keycloak
    otelTracesExporter: otlp
    otelLogsExporter: none
    otelMetricsExporter: none
    otelEndpoint: http://otel-collector:4318
  resources:
    requests:
      cpu: '1'
      memory: '2048Mi'
    limits:
      cpu: '2'
      memory: '4096Mi'
  affinity: |
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
            - key: node-role.kubernetes.io/runai-system
              operator: Exists
  extraInitContainers: |-
    {{- include "awaitingPostgresReadinessContainerFromMap" $ }}
    - name: keycloak-schema-init
      image: "{{ $.Values.global.postgresImage.registry }}/{{ $.Values.global.postgresImage.repository }}:{{ $.Values.global.postgresImage.tag }}"
      volumeMounts:
        - mountPath: /etc/secrets
          name: db-password
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 256Mi
      env:
        - name: KC_DB_USERNAME
          value: {{ .Values.global.postgresql.auth.username }}
        - name: KC_DB_URL_HOST
          value: {{ .Values.global.postgresql.auth.host }}
        - name: KC_DB_URL_PORT
          value: "{{ .Values.global.postgresql.auth.port }}"
        - name: KC_DB_URL_DATABASE
          value: {{ .Values.global.postgresql.auth.database }}
        - name: KC_DB_SCHEMA
          value: keycloak
      command:
      - sh
      - -c
      - PGPASSWORD="$(cat /etc/secrets/DB_PASSWORD)" psql "postgres://$(KC_DB_USERNAME)@$(KC_DB_URL_HOST):$(KC_DB_URL_PORT)/$(KC_DB_URL_DATABASE)" -c "create schema IF NOT EXISTS $(KC_DB_SCHEMA)"
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        {{- /* On OpenShift the keycloakx SCC injects its pinned uid; fixed uids
        fail SCC admission. Elsewhere the root-default postgres image needs an
        explicit non-root uid for runAsNonRoot. */}}
        {{- if ne .Values.global.config.kubernetesDistribution "openshift" }}
        runAsUser: 70
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
    {{- if ne .Values.global.fipsMode "off" }}
    # Seeds the image's bundled FIPS provider jars into the shared providers
    # volume — no-op on the default image, only matters when fipsMode is on.
    - name: keycloak-copy-fips-providers
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - cp -r /opt/keycloak/providers/. /providers/
      volumeMounts:
        - mountPath: /providers
          name: keycloak-providers
      resources:
        limits:
          cpu: 200m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
    {{- end }}
    - name: keycloak-copy-extensions
      image: {{ .Values.global.image.registry }}/keycloak-extensions:{{ .Values.global.image.tag }}
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /providers
          name: keycloak-providers
        - mountPath: /themes
          name: keycloak-themes
        - mountPath: /agent
          name: keycloak-agent
        - mountPath: /opt/keycloak/conf/secrets
          name: secret-configuration
          readOnly: true
        - mountPath: /conf
          name: keycloak-runtime-conf
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        {{- if ne .Values.global.config.kubernetesDistribution "openshift" }}
        runAsUser: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL

  extraVolumes: |-
    {{- if .Values.global.customCA.enabled | default false }}
    {{- .Values.global.customCA.volumes | toYaml }}
    {{- end }}
    - name: db-password
      secret:
        secretName: '{{ include "control-plane.postgresql.password.secret.name" . }}'
        items:
          - key: '{{ include "control-plane.postgresql.password.secret.key" . }}'
            path: DB_PASSWORD
    - name: secret-configuration
      projected:
        sources:
        - secret:
            name: runai-backend-keycloakx
        - secret:
            name: {{ include "control-plane.postgresql.password.secret.name" . }}
            items:
            - key: {{ include "control-plane.postgresql.password.secret.key" . }}
              path: KC_DB_PASSWORD
    - name: keycloak-runtime-conf
      emptyDir: {}
    - name: keycloak-admin-secret
      projected:
        sources:
        - secret:
            name: runai-backend-keycloakx
            items:
            - key: KEYCLOAK_ADMIN
              path: admin-username
        - secret:
            name: {{ include "control-plane.keycloakx.password.secret.name" . }}
            items:
            - key: {{ include "control-plane.keycloakx.password.secret.key" . }}
              path: admin-password
    - name: keycloak-providers
      emptyDir: {}
    - name: keycloak-themes
      emptyDir: {}
    - name: keycloak-agent
      emptyDir: {}
  extraVolumeMounts: |-
    {{- if .Values.global.customCA.enabled | default false }}
    {{- .Values.global.customCA.volumeMounts | toYaml }}
    {{- end }}
    - name: keycloak-runtime-conf
      mountPath: /opt/keycloak/conf/keycloak.conf
      subPath: keycloak.conf
    - name: keycloak-admin-secret
      mountPath: /run/secrets/keycloak
      readOnly: true
    - name: keycloak-providers
      mountPath: /opt/keycloak/providers
    - name: keycloak-themes
      mountPath: /opt/keycloak/themes
    - name: keycloak-agent
      mountPath: /opt/keycloak/agent
  extraEnvFrom: |
    - configMapRef:
        name: runai-backend-keycloakx
  extraEnv: ""
  securityContextConstraints:
    allowHostDirVolumePlugin: false
    allowHostIPC: false
    allowHostNetwork: false
    allowHostPID: false
    allowHostPorts: false
    allowPrivilegeEscalation: false
    allowPrivilegedContainer: false
    allowedCapabilities: null
    readOnlyRootFilesystem: false
    runAsUser:
      type: MustRunAsRange
      uidRangeMin: 70
      uidRangeMax: 65532
    seLinuxContext:
      type: MustRunAs
    seccompProfiles:
      - runtime/default

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

postgresql:
  global:
    compatibility:
      openshift:
        ## @param global.compatibility.openshift.adaptSecurityContext Adapt the securityContext sections of the deployment to make them compatible with Openshift restricted-v2 SCC: remove runAsUser, runAsGroup and fsGroup and let the platform use their allowed default IDs. Possible values: auto (apply if the detected running cluster is Openshift), force (perform the adaptation always), disabled (do not perform adaptation)
