telemetryService:
  name: telemetry-service
  nameOverride: telemetry-service
  fullnameOverride: runai-backend-telemetry-service
  replicaCount: 1

  exposedRules:
    - PathPrefix(`/api/v1/privacy-policy`)
    - PathPrefix(`/api/v1/diagnostics`)

  serviceAccount:
    name: telemetry-service

  service:
    type: ClusterIP
    port: 8080

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    cpuUtilizationPercentage: 80
    memoryUtilizationPercentage: 80

  extraInitContainers: |
    {{- include "awaitingPostgresReadinessContainerFromMap" $ }}

  extraVolumes: |-
    {{- if .Values.global.customCA.enabled | default false }}
    {{- .Values.global.customCA.volumes | toYaml }}
    {{- end }}
    - name: db-password
      secret:
        secretName: '{{ include "control-plane.postgresql.password.secret.name" . }}'
        items:
        - key: '{{ include "control-plane.postgresql.password.secret.key" . }}'
          path: DB_PASSWORD

  extraVolumeMounts: |-
    {{- if .Values.global.customCA.enabled | default false }}
    {{- .Values.global.customCA.volumeMounts | toYaml }}
    {{- end }}

  secretsMountPath: /etc/secrets

  customerId:
    existingSecret: runai-backend-gen-telemetry-service
    secretKey: CUSTOMER_ID

  database:
    host: '{{ .Values.global.postgresql.auth.host }}'
    port: '{{ .Values.global.postgresql.auth.port }}'
    name: '{{ .Values.global.postgresql.auth.database }}'
    schema: telemetry
    sslMode: '{{ .Values.global.postgresql.auth.dbSslMode }}'
    migrationFiles: file:///migrations
    user: '{{ .Values.global.postgresql.auth.username }}'
    passwordExistingSecret: '{{ include "control-plane.postgresql.password.secret.name" . }}'
    passwordSecretKey: '{{ include "control-plane.postgresql.password.secret.key" . }}'

  config:
    logLevel: Info
    customerName: ""
    ignorePolicy: true
    enableBasicDiagnostics: true
    metricsExportIntervalSeconds: 3600
    exportTypes: telemetry
    telemetryEndpoint: ""
    centralMetricStoreUrl: https://not-supported.com
    scrapeUrls:
      - runai-backend-telemetry-service:8080
    cloudRegisterUrl: https://not-supported.com
    policyServiceUrl: https://not-supported.com
    clusterServiceUrl: http://runai-backend-cluster-service:8080
    bffServiceUrl: http://runai-backend-bff-service:8080
    tenantsManagerUrl: http://runai-backend-tenants-manager:8080
    clientsMaxRetries: 10
    clientsRetryBackoffSeconds: 60

