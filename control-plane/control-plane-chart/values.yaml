    {{- end }}

  extraVolumeMounts: |-
    {{- if .Values.global.customCA.enabled | default false }}
    {{- .Values.global.customCA.volumeMounts | toYaml }}
    {{- end }}

  livenessProbe:
    failureThreshold: 15
    httpGet:
      path: /health
      port: http

  readinessProbe:
    failureThreshold: 15
    httpGet:
      path: /health
      port: http

  imagePullSecrets: []

  serviceAccount:
    create: true
    annotations: {}
    name: 'bff-service'

  podAnnotations: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 8080
    protocol: TCP
    extraPorts:
      - name: metrics
        port: 9090
        protocol: TCP

  serviceMonitor:
    port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 30s

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    minReplicas: 2
    maxReplicas: 4
    cpuUtilizationPercentage: 80
    memoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  config:
    logLevel: info
    cacheEnabled: true
    dbScheme: bff_service
    migrationFiles: file:///migrations
    secretsMountPath: /etc/secrets
    server:
