  extraVolumes: |-
    {{- if .Values.global.customCA.enabled | default false }}
    {{- .Values.global.customCA.volumes | toYaml }}
    {{- end }}

  extraVolumeMounts: |-
    {{- if .Values.global.customCA.enabled | default false }}
    {{- .Values.global.customCA.volumeMounts | toYaml }}
    {{- end }}

  livenessProbe:
    httpGet:
      path: /
      port: http

  readinessProbe:
    httpGet:
      path: /
      port: http

  imagePullSecrets: []

  serviceAccount:
    create: true
