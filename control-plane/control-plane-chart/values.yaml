    create: true
    annotations: {}
    name: "notifications-proxy"

  podAnnotations: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 8080
    protocol: TCP
    extraPorts:
      - name: metrics
        port: 9090
        protocol: TCP

  serviceMonitor:
    port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 30s

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    cpuUtilizationPercentage: 80
    memoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  config:
    db:
      encryptionKey: ""
    logLevel: Info
    cacheEnabled: true
    secretsMountPath: /etc/secrets
