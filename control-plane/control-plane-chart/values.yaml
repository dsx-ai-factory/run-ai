              name: '{{ include "control-plane.postgresql.password.secret.name" . }}'
              items:
                - key: '{{ include "control-plane.postgresql.password.secret.key" . }}'
                  path: DB_PASSWORD
          - secret:
              name: '{{ include "control-plane.cache.password.secret.name" . }}'
              items:
