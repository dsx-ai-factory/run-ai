      notifyUrl: http://runai-backend-notifications-service:5000
      configUrl: http://runai-backend-notifications-service:8080
    slack:
      existingSecret: ""
      secretKeys:
        clientId: SLACK_CLIENT_ID
        clientSecret: SLACK_CLIENT_SECRET
      clientId: ""
      clientSecret: ""

# =============================================================================
# PostgreSQL User Init Configuration
# =============================================================================
# Helm post-install/post-upgrade hook that grants CREATEROLE to the 
# application user. This hook is only used for Helm-managed DBs (postgresql.enabled=true).
# =============================================================================
postgresqlUserInit:
  name: postgresql-user-init
  argoRollouts: false

  command:
    - sh
    - -c
    - >-
      export PGPASSWORD="$(cat /etc/secrets/ADMIN_DB_PASSWORD)" &&
      psql -h "$PG_HOST" -p "$PG_PORT" -U postgres
      -c "ALTER ROLE \"$PG_USER\" NOSUPERUSER CREATEROLE INHERIT LOGIN;"

  env:
    - name: PG_HOST
      value: '{{ .Values.global.postgresql.auth.host }}'
    - name: PG_PORT
      value: '{{ .Values.global.postgresql.auth.port }}'
    - name: PG_USER
      value: '{{ .Values.global.postgresql.auth.username }}'

  volumes:
    - name: db-password
      projected:
        sources:
          - secret:
              name: '{{ include "control-plane.postgresql.password.secret.name" . }}'
              items:
                - key: '{{ include "control-plane.postgresql.password.secret.key" . }}'
                  path: DB_PASSWORD
          - secret:
              name: '{{ include "control-plane.postgresql.admin.password.secret.name" . }}'
              items:
                - key: '{{ include "control-plane.postgresql.admin.password.secret.key" . }}'
                  path: ADMIN_DB_PASSWORD

  volumeMounts:
    - mountPath: /etc/secrets
      name: db-password

  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

  podAnnotations: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 70
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  resources:
    limits:
      cpu: 100m
      memory: 100Mi
    requests:
      cpu: 50m
      memory: 50Mi

  serviceAccount:
    create: false

# =============================================================================
# Secret Generator Configuration
# =============================================================================
# The Secret Generator is a Helm pre-install/pre-upgrade hook that automatically
# generates and manages secrets for the control-plane. It:
# - Eliminates hardcoded default credentials
# - Preserves existing credentials across upgrades
# - Supports existingSecret patterns for externally managed secrets
# - Uses the cp-anchor ConfigMap for lifecycle ownership (garbage collection)
# =============================================================================
secretGenerator:
  name: secret-generator
  argoRollouts: false
  replicaCount: 1

  image:
    repository: secret-generator
    pullPolicy: IfNotPresent

  envFrom:
    - configMapRef:
        name: runai-backend-secret-generator

  env:
    - name: NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

  volumes:
    - name: secrets-config
      configMap:
        name: runai-backend-secret-generator-config

  volumeMounts:
    - name: secrets-config
      mountPath: /etc/secret-generator
      readOnly: true

  config:
    logLevel: Info
    configFilePath: /etc/secret-generator/secrets.json
    dryRun: false

  # Helm hook annotations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

  # Override annotations for the params ConfigMap (secrets.json) - runs before the Job
  paramsConfigMap:
    annotations:
      helm.sh/hook: pre-install,pre-upgrade
      helm.sh/hook-weight: "-10"
      helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

  restartPolicy: OnFailure

  # Pod annotations
  podAnnotations: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  # Resource limits and requests
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # Service account configuration
  serviceAccount:
    create: true
    annotations:
      helm.sh/hook: pre-install,pre-upgrade
      helm.sh/hook-weight: "-5"
      helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    name: secret-generator

  # Node selection
  nodeSelector: {}

  # Affinity rules
  affinity: {}

  # Tolerations
  tolerations: []

bffService:
  name: bff-service
  exposedRules:
    - PathPrefix(`/api/v1/ui-analytics/settings`)
    - PathPrefix(`/api/v1/notifications/settings`)
