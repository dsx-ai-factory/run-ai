        - ALL

  service:
    type: ClusterIP
    port: 8080
    protocol: TCP
    extraPorts:
      - name: metrics
        port: 9090
        protocol: TCP

  serviceMonitor:
    port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 30s
    metricRelabelings:
    - action: replace
      regex: runai_reports_count_per_status
      sourceLabels: [__name__]
      targetLabel: pod
      replacement: ""
    - action: replace
      regex: runai_reports_count_per_status
      sourceLabels: [__name__]
      targetLabel: service
      replacement: ""
    - action: replace
      regex: runai_reports_count_per_status
      sourceLabels: [__name__]
      targetLabel: instance
      replacement: ""
    - action: replace
      regex: runai_reports_count_per_status
      sourceLabels: [__name__]
      targetLabel: job
      replacement: ""

  resources:
    limits:
      cpu: 500m
      memory: 2048Mi
    requests:
      cpu: 250m
      memory: 1024Mi

  autoscaling:
    minReplicas: 2
    maxReplicas: 4
    cpuUtilizationPercentage: 80
    memoryUtilizationPercentage: 80

  config:
    logLevel: Info
    datasourceUrl: http://runai-backend-thanos-query:9090
    dbScheme: metrics
    migrationFiles: file:///migrations
    secretsMountPath: /etc/secrets
    configKeyDelimiter: ;
    server:
      writeTimeout: 1m
      readTimeout: 15s
      idleTimeout: 15s
    cleaner:
      isCleanupEnabled: true
      cleanerIntervalHours: 24
      deleteReportsTTLDays: 90
    dbCronJobs:
      reports:
        intervalSeconds: 60
        maxRetryCount: 1
        retryFailedReportsMinAgeMinutes: 1
        retryFailedReportsMaxAgeMinutes: 30
        failStuckProcessingReportsMinAgeMinutes: 30
    datasourceProvider:
      type: static
      auth:
        # Ignored if datasourceProvider.auth.existingSecret is set
        accessToken: ''
        existingSecret: ''
        secretKeys:
          accessTokenKey: DATASOURCE_AUTH_ACCESS_TOKEN
      staticDatasource:
        type: thanos
        read:
          url: http://runai-backend-thanos-query:9090
          auth:
            # Empty disables auth. Set to 'basic' to opt in; credentials are read from the secret.
            type: ''
            basic:
              # Ignored if datasourceProvider.staticDatasource.existingSecret is set
              username: ''
              # Ignored if datasourceProvider.staticDatasource.existingSecret is set
              password: ''
        write:
          url: ''
          auth:
            # Empty disables auth. Set to 'basic' to opt in; credentials are read from the secret.
            type: ''
            basic:
              # Ignored if datasourceProvider.staticDatasource.existingSecret is set
              username: ''
              # Ignored if datasourceProvider.staticDatasource.existingSecret is set
              password: ''
        existingSecret: ''
        secretKeys:
          readUserKey: STATIC_DATASOURCE_READ_USER
          readPasswordKey: STATIC_DATASOURCE_READ_PASSWORD
          writeUserKey: STATIC_DATASOURCE_WRITE_USER
          writePasswordKey: STATIC_DATASOURCE_WRITE_PASSWORD

  nodeSelector: {}

  tolerations: []

  affinity: {}

