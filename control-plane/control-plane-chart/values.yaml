                  path: DB_PASSWORD
    - name: runai-service-config
      projected:
        sources:
          - secret:
              name: runai-backend-authorization
          - secret:
              name: '{{ include "control-plane.postgresql.password.secret.name" . }}'
              items:
                - key: '{{ include "control-plane.postgresql.password.secret.key" . }}'
                  path: DB_PASSWORD
          - secret:
              name: '{{ include "control-plane.cache.password.secret.name" . }}'
              items:
                - key: '{{ include "control-plane.cache.password.secret.key" . }}'
                  path: CACHE_PASSWORD
          - secret:
              name: '{{ include "control-plane.pubsub.password.secret.name" . }}'
