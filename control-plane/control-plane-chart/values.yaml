  enabled: true
  argoRollouts: false
  image:
    registry: docker.io
    repository: bitnamilegacy/nats
    tag: 2.11.8-debian-12-r0
  global:
    compatibility:
      openshift:
        ## @param global.compatibility.openshift.adaptSecurityContext Adapt the securityContext sections of the deployment to make them compatible with Openshift restricted-v2 SCC: remove runAsUser, runAsGroup and fsGroup and let the platform use their allowed default IDs. Possible values: auto (apply if the detected running cluster is Openshift), force (perform the adaptation always), disabled (do not perform adaptation)
        adaptSecurityContext: disabled
    security:
      allowInsecureImages: true
  # NATS server configuration defined in templates/nats/_helpers.tpl
  configuration: '{{ include "control-plane.nats.configuration" . }}'
  # Inject the secret as environment variables into NATS pods (same as gen-cache-pubsub)
  # Override this if you want to use your own secret (must contain AUTH_TOKEN key)
  extraEnvVarsSecret: "runai-backend-gen-cache-pubsub"
  extraEnvVars:
    - name: GODEBUG
      value: fips140={{ .Values.global.fipsMode | default "off" }}
  jetstream:
    enabled: true
  replicaCount: 3
  affinity: *affinity
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi
  persistence:
    enabled: true
    size: 3Gi
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL
  securityContextConstraints:
