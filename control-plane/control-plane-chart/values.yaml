    dbUseServiceSession: false
    cacheEnabled: true
    skipDefaultTransaction: true
    auditEnabled: false
    secretsMountPath: /etc/secrets
    clusterCacheExpirationSeconds: 60
    clusterCacheCleanupSeconds: 1200
    # Max uploaded chart size (MB). Single source of truth: feeds both the backend
    # limit (CHART_MAX_UPLOAD_BYTES) and the nginx ingress proxy-body-size on the
    # upload path, so the ingress never rejects a body the backend would accept.
    chartUploadMaxSizeMB: 10
    # How long an uploaded chart is retained before the workloads cleaner reaps it
    # (CHART_RETENTION_MINUTES). Charts referenced by an already-deployed application
    # are removed regardless; this bounds abandoned/unclaimed uploads. Default 24h.
    chartRetentionMinutes: 1440
    server:
      writeTimeout: 2m
      readTimeout: 2m
      idleTimeout: 2m

