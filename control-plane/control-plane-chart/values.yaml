                - key: '{{ include "control-plane.pubsub.password.secret.key" . }}'
                  path: PUBSUB_PASSWORD
          - secret:
              name: '{{ include "control-plane.pubsub.additional-subscriber.password.secret.name" . }}'
              items:
                - key: '{{ include "control-plane.pubsub.additional-subscriber.password.secret.key" . }}'
                  path: PUBSUB_ADDITIONAL_SUBSCRIBER_PASSWORD
          - secret:
              name: '{{ include "control-plane.pubsub.user.secret.name" . }}'
              items:
                - key: '{{ include "control-plane.pubsub.user.secret.key" . }}'
                  path: PUBSUB_USER
          - secret:
              name: '{{ include "control-plane.pubsub.additional-subscriber.user.secret.name" . }}'
              items:
                - key: '{{ include "control-plane.pubsub.additional-subscriber.user.secret.key" . }}'
                  path: PUBSUB_ADDITIONAL_SUBSCRIBER_USER

  extraVolumes: |-
    {{- if .Values.global.customCA.enabled | default false }}
    {{- .Values.global.customCA.volumes | toYaml }}
    {{- end }}

  extraVolumeMounts: |-
    {{- if .Values.global.customCA.enabled | default false }}
    {{- .Values.global.customCA.volumeMounts | toYaml }}
    {{- end }}

  volumeMounts:
    - mountPath: '{{ .Values.authorization.config.secretsMountPath }}'
      name: runai-service-config

  imagePullSecrets: []

  livenessProbe:
    httpGet:
      path: /
      port: http

  readinessProbe:
    httpGet:
      path: /
      port: http

  startupProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10           # Check every 10 seconds
    failureThreshold: 20        # 3s + (20 × 10s) = 203s ~ 3.4 minutes
    timeoutSeconds: 2

  serviceAccount:
    create: true
    annotations: {}
    name: 'authorization'

  podAnnotations: {}

  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 8080
    protocol: TCP
    extraPorts:
      - name: metrics
        port: 9090
        protocol: TCP

  serviceMonitor:
    port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 30s

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    minReplicas: 2
    maxReplicas: 4
    cpuUtilizationPercentage: 80
    memoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  config:
    logLevel: Info
    dbScheme: authorization
    server:
      writeTimeout: 1m
      readTimeout: 1m
      idleTimeout: 1m
