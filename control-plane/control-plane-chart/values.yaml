    cacheMaxStoreSizeMb: 1000
    asyncClusterDeletion:
      enabled: true
    clusterInstallation:
      supportedVersionRange:
        # Inclusive
        min: 2.18
        # Inclusive
        # Defaults to the chart's app version
        max: ''
      helmRegistryUrl: https://helm.ngc.nvidia.com/nvidia/runai
      helmRegistryUsername: ''
      helmRegistryPasswordPlaceholder: ''
    maxWaitForClusterRemoteConfigStatusUpdate: 5m
