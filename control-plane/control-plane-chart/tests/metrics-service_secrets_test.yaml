suite: metrics-service datasource provider secrets and configmap
templates:
- templates/metrics-service/secret.yaml
- templates/metrics-service/configmap.yaml
- templates/metrics-service/deployment.yaml

tests:
- it: renders DATASOURCE_AUTH_ACCESS_TOKEN in Secret when no auth.existingSecret is set
  template: templates/metrics-service/secret.yaml
  set:
    fullnameOverride: runai-backend
    metricsService:
      enabled: true
      name: metrics-service
      config:
        datasourceProvider:
          type: grafanalabs
          auth:
            accessToken: plain-token
  documentSelector:
    path: kind
    value: Secret
  asserts:
  - equal:
      path: kind
      value: Secret
  - equal:
      path: metadata.name
      value: runai-backend-metrics-service
  - equal:
      path: data.DATASOURCE_AUTH_ACCESS_TOKEN
      # base64 of "plain-token"
      value: cGxhaW4tdG9rZW4=

- it: does not render DATASOURCE_AUTH_ACCESS_TOKEN when auth.existingSecret is set
  template: templates/metrics-service/secret.yaml
  set:
    fullnameOverride: runai-backend
    metricsService:
      enabled: true
      name: metrics-service
      config:
        datasourceProvider:
          type: grafanalabs
          auth:
            existingSecret: ext-auth-secret
            accessToken: should-be-ignored
  documentSelector:
    path: kind
    value: Secret
  asserts:
  - notExists:
      path: data.DATASOURCE_AUTH_ACCESS_TOKEN

- it: renders STATIC_DATASOURCE_* credentials when no staticDatasource.existingSecret is set
  template: templates/metrics-service/secret.yaml
  set:
    fullnameOverride: runai-backend
    metricsService:
      enabled: true
      name: metrics-service
      config:
        datasourceProvider:
          type: static
          staticDatasource:
            read:
              auth:
                basic:
                  username: read-user-val
                  password: read-pass
            write:
              auth:
                basic:
                  username: write-user-val
                  password: write-pass
  documentSelector:
    path: kind
    value: Secret
  asserts:
  - equal:
      path: data.STATIC_DATASOURCE_READ_USER
      # base64 of "read-user-val"
      value: cmVhZC11c2VyLXZhbA==
  - equal:
      path: data.STATIC_DATASOURCE_READ_PASSWORD
      # base64 of "read-pass"
      value: cmVhZC1wYXNz
  - equal:
      path: data.STATIC_DATASOURCE_WRITE_USER
      # base64 of "write-user-val"
      value: d3JpdGUtdXNlci12YWw=
  - equal:
      path: data.STATIC_DATASOURCE_WRITE_PASSWORD
      # base64 of "write-pass"
      value: d3JpdGUtcGFzcw==

- it: does not render STATIC_DATASOURCE_* keys when staticDatasource.existingSecret is set
  template: templates/metrics-service/secret.yaml
  set:
    fullnameOverride: runai-backend
    metricsService:
      enabled: true
      name: metrics-service
      config:
        datasourceProvider:
          type: static
          staticDatasource:
            existingSecret: ext-static-secret
            read:
              auth:
                basic:
                  username: ignored
                  password: ignored
  documentSelector:
    path: kind
    value: Secret
  asserts:
  - notExists:
      path: data.STATIC_DATASOURCE_READ_USER
  - notExists:
      path: data.STATIC_DATASOURCE_READ_PASSWORD

- it: renders datasource_provider block as static thanos without auth by default in configmap
  template: templates/metrics-service/configmap.yaml
  set:
    fullnameOverride: runai-backend
    metricsService:
      enabled: true
      name: metrics-service
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - matchRegex:
      path: data["config.yaml"]
      pattern: 'datasource_type: "static"'
  - matchRegex:
      path: data["config.yaml"]
      pattern: 'type: "thanos"'
  - notMatchRegex:
      path: data["config.yaml"]
      pattern: 'auth:'

- it: renders auth type in configmap when staticDatasource auth.type is set
  template: templates/metrics-service/configmap.yaml
  set:
    fullnameOverride: runai-backend
    metricsService:
      enabled: true
      name: metrics-service
      config:
        datasourceProvider:
          staticDatasource:
            read:
              auth:
                type: basic
            write:
              auth:
                type: basic
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - matchRegex:
      path: data["config.yaml"]
      pattern: 'type: "basic"'

- it: renders datasource_provider block as grafanalabs when overridden in configmap
  template: templates/metrics-service/configmap.yaml
  set:
    fullnameOverride: runai-backend
    metricsService:
      enabled: true
      name: metrics-service
      config:
        datasourceProvider:
          type: grafanalabs
  documentSelector:
    path: kind
    value: ConfigMap
  asserts:
  - matchRegex:
      path: data["config.yaml"]
      pattern: 'datasource_type: "grafanalabs"'

- it: deployment projects auth token and static credentials from chart-managed secret by default
  template: templates/metrics-service/deployment.yaml
  set:
    fullnameOverride: runai-backend
    metricsService:
      enabled: true
      name: metrics-service
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          name: runai-backend-metrics-service
          items:
          - key: DATASOURCE_AUTH_ACCESS_TOKEN
            path: DATASOURCE_PROVIDER.DATASOURCE_AUTH.TOKEN
          optional: true
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          name: runai-backend-metrics-service
          items:
          - key: STATIC_DATASOURCE_READ_USER
            path: DATASOURCE_PROVIDER.STATIC_DATASOURCE.READ.AUTH.BASIC.USER
          - key: STATIC_DATASOURCE_READ_PASSWORD
            path: DATASOURCE_PROVIDER.STATIC_DATASOURCE.READ.AUTH.BASIC.PASSWORD
          - key: STATIC_DATASOURCE_WRITE_USER
            path: DATASOURCE_PROVIDER.STATIC_DATASOURCE.WRITE.AUTH.BASIC.USER
          - key: STATIC_DATASOURCE_WRITE_PASSWORD
            path: DATASOURCE_PROVIDER.STATIC_DATASOURCE.WRITE.AUTH.BASIC.PASSWORD
          optional: true

- it: deployment uses external auth secret and static secret with custom keys when both existingSecrets are set
  template: templates/metrics-service/deployment.yaml
  set:
    fullnameOverride: runai-backend
    metricsService:
      enabled: true
      name: metrics-service
      config:
        datasourceProvider:
          auth:
            existingSecret: ext-auth
            secretKeys:
              accessTokenKey: my-token
          staticDatasource:
            existingSecret: ext-static
            secretKeys:
              readUserKey: ru
              readPasswordKey: rp
              writeUserKey: wu
              writePasswordKey: wp
  documentSelector:
    path: kind
    value: Deployment
  asserts:
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          name: ext-auth
          items:
          - key: my-token
            path: DATASOURCE_PROVIDER.DATASOURCE_AUTH.TOKEN
          optional: true
  - contains:
      path: spec.template.spec.volumes[2].projected.sources
      content:
        secret:
          name: ext-static
          items:
          - key: ru
            path: DATASOURCE_PROVIDER.STATIC_DATASOURCE.READ.AUTH.BASIC.USER
          - key: rp
            path: DATASOURCE_PROVIDER.STATIC_DATASOURCE.READ.AUTH.BASIC.PASSWORD
          - key: wu
            path: DATASOURCE_PROVIDER.STATIC_DATASOURCE.WRITE.AUTH.BASIC.USER
          - key: wp
            path: DATASOURCE_PROVIDER.STATIC_DATASOURCE.WRITE.AUTH.BASIC.PASSWORD
          optional: true
