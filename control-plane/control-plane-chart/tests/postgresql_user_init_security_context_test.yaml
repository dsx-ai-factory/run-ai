suite: Test PostgreSQL User Init Security Context

templates:
  - templates/helm-hooks/postgresql-user-init/job.yaml

# POC-TEMP: the chart default for postgresql.enabled is temporarily false; this hook only renders with the bundled database.
set:
  postgresql.enabled: true

tests:
  - it: should omit runAsUser on OpenShift
    set:
      global.config.kubernetesDistribution: openshift
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser

  - it: should set runAsUser on Kubernetes
    set:
      global.config.kubernetesDistribution: kubernetes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 70
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 70
