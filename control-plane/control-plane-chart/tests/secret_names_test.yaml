suite: secret names — existingSecret propagation
templates:
  - templates/helm-hooks/secret-generator/secret-generator-params-cm.yaml

values:
  - ./_values/secret-generator-defaults.yaml

# This suite pins down which existingSecret overrides DO and DO NOT flow into
# the secret-generator spec. The generator only needs existingSecretName for
# entities it creates (where it would source values from the user's secret at
# generation time). Purely render-time overrides (pubsub user, cache password)
# flow through the control-plane.* helpers, not through the generator.
tests:
  #
  # Generator-managed entity names (always present in the spec)
  #
  - it: generator spec includes all generator-managed target names
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-postgresql"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-keycloakx"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-cache-pubsub"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-diagnostics-service"'

  #
  # existingSecret overrides that DO propagate to the generator spec
  # (the generator will source values from these at generation time)
  #
  - it: postgresql existingSecret propagates as existingSecretName (name different from generator target)
    set:
      postgresql.enabled: false
      global.postgresql.auth.existingSecret: my-user-pg-secret
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-postgresql"[^{]*"legacySecretName":\s*"runai-backend-postgresql"[^{]*"existingSecretName":\s*"my-user-pg-secret"'

  - it: keycloakx existingSecret propagates as existingSecretName
    set:
      keycloakx.existingSecret: my-user-kc-secret
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-keycloakx"[^{]*"existingSecretName":\s*"my-user-kc-secret"'

  - it: additionalSubscriber.auth.existingSecret is render-time only and does not appear in the generator spec
    set:
      global.pubsub.additionalSubscriber.auth.existingSecret: my-user-subscriber-secret
    asserts:
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: my-user-subscriber-secret

  #
  # existingSecret overrides that propagate to per-component specs only
  # (the cache / pubsub-auth specs reconcile a single key into the same
  # gen-cache-pubsub Secret; their existingSecretName makes the generator
  # skip generating that key when consumers route elsewhere).
  #
  - it: pubsub.auth.existingSecret propagates only to the pubsub-auth spec
    set:
      global.pubsub.auth.existingSecret: my-user-pubsub-secret
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-pubsub-secret"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-pubsub-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"AUTH_TOKEN"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-pubsub-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"CACHE_PASSWORD"'

  - it: cache.auth.existingSecret propagates only to the cache spec
    set:
      global.cache.auth.existingSecret: my-user-cache-secret
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-cache-secret"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-cache-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"AUTH_TOKEN"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-cache-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"PUBSUB_PASSWORD"'

  #
  # Multiple existingSecret overrides set simultaneously — each propagates
  # independently and none collide with generator target names.
  #
  - it: all propagating existingSecrets coexist with their generator targets
    set:
      postgresql.enabled: false
      global.postgresql.auth.existingSecret: user-pg
      keycloakx.existingSecret: user-kc
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"user-pg"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"user-kc"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-postgresql"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-keycloakx"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-cache-pubsub"'
