suite: Test Affinity

excludeTemplates:
  # Excluding subcharts which will not be affected by affinity
  - charts/*

tests:
  - it: should render deployments with default pod anti affinity
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - exists:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm
  - it: should render deployments with merged default pod anti affinity and specific pod anti affinity
    set:
      assetsService:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: assets-service-test
                  topologyKey: kubernetes.io/hostname
                weight: 100
    templates:
      - templates/assets-service/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution
          value:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: assets-service
                topologyKey: kubernetes.io/hostname
              weight: 100
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: assets-service-test
                topologyKey: kubernetes.io/hostname
              weight: 100
  - it: should render deployments with required default pod anti affinity
    set:
      global:
        requireDefaultPodAntiAffinity: true
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - isKind:
          of: Deployment
      - exists:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution
  - it: should render deployments with global node affinity and pod anti affinity
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.affinity.nodeAffinity
          value: 
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/runai-system
                      operator: Exists
      - exists: 
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0]
  - it: should render deployments with specific node affinity overrides
    set:
      assetsService:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/runai-system-test
                      operator: Exists  
    templates:
      - templates/assets-service/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.affinity.nodeAffinity
          value:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/runai-system-test
                      operator: Exists
  - it: should render deployments with global pod affinity
    set:
      global:
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: global-app
                topologyKey: kubernetes.io/hostname
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 50
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: global-app
                  topologyKey: kubernetes.io/zone
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution
          value:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: global-app
              topologyKey: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.affinity.podAffinity.preferredDuringSchedulingIgnoredDuringExecution
          value:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: global-app
                topologyKey: kubernetes.io/zone
  - it: should render deployments with specific pod affinity overriding global pod affinity
    set:
      global:
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: global-app
                topologyKey: kubernetes.io/hostname
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 50
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: global-app
                  topologyKey: kubernetes.io/zone
      assetsService:
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: specific-app
                topologyKey: topology.kubernetes.io/zone
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: specific-app
                  topologyKey: topology.kubernetes.io/region
    templates:
      - templates/assets-service/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution
          value:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: specific-app
              topologyKey: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.affinity.podAffinity.preferredDuringSchedulingIgnoredDuringExecution
          value:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: specific-app
                topologyKey: topology.kubernetes.io/region
