suite: tenants-manager secrets
templates:
- templates/tenants-manager/secret.yaml
- templates/tenants-manager/configmap.yaml
- templates/tenants-manager/deployment.yaml

tests:
- it: fails when admin password is less than 8 characters
  template: templates/tenants-manager/secret.yaml
  set:
    fullnameOverride: runai-backend
    global.multiTenancy.enabled: false
    tenantsManager:
      enabled: true
      name: tenants-manager
      config:
        adminPassword: "Abc1@x"
  asserts:
  - failedTemplate:
      errorMessage: "tenantsManager.config.adminPassword must be at least 8 characters long"

- it: fails when admin password has no uppercase letter
  template: templates/tenants-manager/secret.yaml
  set:
    fullnameOverride: runai-backend
    global.multiTenancy.enabled: false
    tenantsManager:
      enabled: true
      name: tenants-manager
      config:
        adminPassword: "abcd1234@"
  asserts:
  - failedTemplate:
      errorMessage: "tenantsManager.config.adminPassword must contain at least 1 uppercase letter"

- it: fails when admin password has no lowercase letter
  template: templates/tenants-manager/secret.yaml
  set:
    fullnameOverride: runai-backend
    global.multiTenancy.enabled: false
    tenantsManager:
      enabled: true
      name: tenants-manager
      config:
        adminPassword: "ABCD1234@"
  asserts:
  - failedTemplate:
      errorMessage: "tenantsManager.config.adminPassword must contain at least 1 lowercase letter"

- it: fails when admin password has no digit
  template: templates/tenants-manager/secret.yaml
  set:
    fullnameOverride: runai-backend
    global.multiTenancy.enabled: false
    tenantsManager:
      enabled: true
      name: tenants-manager
      config:
        adminPassword: "AbcdEfgh@"
  asserts:
  - failedTemplate:
      errorMessage: "tenantsManager.config.adminPassword must contain at least 1 digit"

- it: fails when admin password has no special character
  template: templates/tenants-manager/secret.yaml
  set:
    fullnameOverride: runai-backend
    global.multiTenancy.enabled: false
    tenantsManager:
      enabled: true
      name: tenants-manager
      config:
        adminPassword: "Abcd1234"
  asserts:
  - failedTemplate:
      errorMessage: "tenantsManager.config.adminPassword must contain at least 1 special character (non-alphanumeric)"

- it: renders the chart-managed Secret without ADMIN_PASSWORD when validation passes
  # ADMIN_PASSWORD now lives in runai-backend-gen-tenants-manager (managed by the
  # secret-generator hook). The chart-managed Secret no longer carries it; this
  # test pins that the validation path still passes for a complex password and
  # the key does not leak back into the chart-managed Secret.
  template: templates/tenants-manager/secret.yaml
  set:
    fullnameOverride: runai-backend
    global.multiTenancy.enabled: false
    tenantsManager:
      enabled: true
      name: tenants-manager
      config:
        adminPassword: "ValidPass1@"
  documentSelector:
    path: kind
    value: Secret
  asserts:
  - equal: { path: kind, value: Secret }
  - notExists: { path: data.ADMIN_PASSWORD }

- it: renders TENANT_MNG_USER but not TENANT_MNG_PASSWORD in chart-managed Secret in MT mode
  # TENANT_MNG_PASSWORD has moved to runai-backend-gen-tenants-manager (managed
  # by the secret-generator hook). The username stays in the chart-managed
  # Secret since it isn't sensitive; the password resolves through
  # control-plane.management.password.secret.* helpers to the gen Secret.
  template: templates/tenants-manager/secret.yaml
  set:
    fullnameOverride: runai-backend
    global:
      multiTenancy:
        enabled: true
      management:
        user: admin@run.ai
        password: SomeMgmtPass1@
        existingSecret: ""
    tenantsManager:
      enabled: true
      name: tenants-manager
  documentSelector:
    path: kind
    value: Secret
  asserts:
  - equal: { path: kind, value: Secret }
  - exists: { path: data.TENANT_MNG_USER }
  - notExists: { path: data.TENANT_MNG_PASSWORD }

- it: skips adminPassword validation when value is empty (random generation path)
  # The new default is "" so the secret-generator produces a random password.
  # Validation must NOT trip on the empty string, and the chart-managed Secret
  # must still render cleanly.
  template: templates/tenants-manager/secret.yaml
  set:
    fullnameOverride: runai-backend
    global.multiTenancy.enabled: false
    tenantsManager:
      enabled: true
      name: tenants-manager
      config:
        adminPassword: ""
  documentSelector:
    path: kind
    value: Secret
  asserts:
  - equal: { path: kind, value: Secret }
  - notExists: { path: data.ADMIN_PASSWORD }
