suite: secret-generator configmap
templates:
  - templates/helm-hooks/secret-generator/secret-generator-params-cm.yaml

values:
  - ./_values/secret-generator-defaults.yaml

# The secret-generator ConfigMap drives a preinstall/preupgrade Job that
# materializes one Secret per entry in secrets.json. Each entry has:
#   - name:               target Secret the generator creates/manages
#   - legacySecretName:   legacy name to migrate values from (optional)
#   - existingSecretName: user-supplied override to source values from (optional)
#   - keys[]:             {name, type, length, chartValue?}
#
# Entities produced:
#   - runai-backend-gen-postgresql  (password, postgres-password) [always]
#   - runai-backend-gen-keycloakx   (KEYCLOAK_ADMIN_PASSWORD)     [always]
#   - runai-backend-gen-cache-pubsub (AUTH_TOKEN, cache-password, pubsub-password) [always]
#       - AUTH_TOKEN: alphanumeric when nats.enabled, static empty otherwise
#       - cache-password / pubsub-password: copyFrom AUTH_TOKEN by default;
#         chartValue from global.{cache,pubsub}.auth.password when set;
#         static empty when nats.enabled=false
#   - runai-backend-gen-notifications-proxy-encryption-key (DB_ENCRYPTION_KEY) [always]
#   - runai-backend-gen-diagnostics-service (CUSTOMER_ID alphanumeric) [when telemetryService.enabled]
#   - runai-backend-gen-telemetry-service (CUSTOMER_ID alphanumeric, migrated from
#     runai-backend-gen-diagnostics-service) [when telemetryService.enabled]
#   - runai-backend-gen-notifications-service (ENCRYPT_DECRYPT_KEY alphanumeric) [when notificationsService.enabled]
tests:
  #
  # Basic rendering
  #
  - it: renders the ConfigMap with the expected name
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: runai-backend-secret-generator-config

  - it: attaches pre-install/pre-upgrade helm hook annotations
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded

  #
  # PostgreSQL entity
  #
  - it: emits postgresql entity with password and postgres-password keys
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-postgresql"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"legacySecretName":\s*"runai-backend-postgresql"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"password"[^}]*"type":\s*"password"[^}]*"length":\s*24'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"postgres-password"[^}]*"type":\s*"password"[^}]*"length":\s*24'

  - it: does not mark postgresql keys externalOnly when bundled postgres is enabled
    set:
      postgresql.enabled: true
    asserts:
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"externalOnly"'

  - it: marks postgresql keys externalOnly when bundled postgres is disabled
    set:
      postgresql.enabled: false
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"externalOnly":\s*true'

  - it: writes chartValue for postgresql passwords when provided
    set:
      global.postgresql.auth.password: my-pg-user-password
      global.postgresql.auth.postgresPassword: my-pg-admin-password
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"chartValue":\s*"my-pg-user-password"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"chartValue":\s*"my-pg-admin-password"'

  #
  # Keycloak entity
  #
  - it: emits keycloak entity with KEYCLOAK_ADMIN_PASSWORD key
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-keycloakx"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"legacySecretName":\s*"runai-backend-keycloakx"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"KEYCLOAK_ADMIN_PASSWORD"[^}]*"type":\s*"password"[^}]*"length":\s*24'

  - it: writes chartValue for keycloak adminPassword when provided
    set:
      keycloakx.adminPassword: my-keycloak-admin-password
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"chartValue":\s*"my-keycloak-admin-password"'

  #
  # Tenants Manager — two independent specs targeting runai-backend-gen-tenants-manager,
  # mirroring the nats/cache/pubsub split on gen-cache-pubsub.
  #
  - it: admin spec emits ADMIN_PASSWORD key with legacySecretName
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-tenants-manager"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"legacySecretName":\s*"runai-backend-tenants-manager"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"ADMIN_PASSWORD"[^}]*"type":\s*"password"[^}]*"length":\s*24'

  - it: writes chartValue for tenants-manager adminPassword when provided
    set:
      tenantsManager.config.adminPassword: ValidAdmin1@
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"ADMIN_PASSWORD"[^}]*"chartValue":\s*"ValidAdmin1@"'

  - it: emits empty chartValue for tenants-manager adminPassword by default (random generation path)
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"ADMIN_PASSWORD"[^}]*"chartValue":\s*""'

  - it: admin spec is emitted even when multiTenancy is enabled
    set:
      global.multiTenancy.enabled: true
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-tenants-manager"'

  - it: admin spec sets existingSecretName when tenantsManager.config.existingSecret is set
    set:
      tenantsManager.config.existingSecret: my-tm-secret
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-tm-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"ADMIN_PASSWORD"'

  - it: admin spec does not set existingSecretName when tenantsManager.config.existingSecret is unset
    asserts:
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"legacySecretName":\s*"runai-backend-tenants-manager"[^{]*"existingSecretName"'

  - it: mgmt spec emits TENANT_MNG_PASSWORD key without legacySecretName
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"TENANT_MNG_PASSWORD"[^}]*"type":\s*"password"[^}]*"length":\s*24'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"TENANT_MNG_PASSWORD"[^{]*"legacySecretName"'

  - it: writes chartValue for management password when provided
    set:
      global.management.password: ConsolePass1@
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"TENANT_MNG_PASSWORD"[^}]*"chartValue":\s*"ConsolePass1@"'

  - it: emits empty chartValue for TENANT_MNG_PASSWORD by default (random generation path)
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"TENANT_MNG_PASSWORD"[^}]*"chartValue":\s*""'

  - it: mgmt spec sets existingSecretName when global.management.existingSecret is set
    set:
      global.management.existingSecret: my-mgmt-secret
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-mgmt-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"TENANT_MNG_PASSWORD"'

  - it: mgmt spec does not set existingSecretName when global.management.existingSecret is unset
    asserts:
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"TENANT_MNG_PASSWORD"[^{]*"existingSecretName"'

  - it: each spec independently defers when its own existingSecret is set
    set:
      tenantsManager.config.existingSecret: my-tm-secret
      global.management.existingSecret: my-mgmt-secret
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-tm-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"ADMIN_PASSWORD"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-mgmt-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"TENANT_MNG_PASSWORD"'

  #
  # NATS entity (target: runai-backend-gen-cache-pubsub, AUTH_TOKEN)
  #
  - it: emits AUTH_TOKEN entity targeting gen-cache-pubsub when nats is enabled
    set:
      nats.enabled: true
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-cache-pubsub"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"AUTH_TOKEN"[^}]*"type":\s*"alphanumeric"[^}]*"length":\s*32'

  - it: emits static empty AUTH_TOKEN entity when nats is disabled
    set:
      nats.enabled: false
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-cache-pubsub"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"AUTH_TOKEN"[^}]*"type":\s*"static"[^}]*"chartValue":\s*""'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"AUTH_TOKEN"[^}]*"type":\s*"alphanumeric"'

  - it: emits cache-password and pubsub-password aliasing AUTH_TOKEN via copyFrom when nats is enabled
    set:
      nats.enabled: true
    asserts:
      # chartValue is always emitted (defaults to ""); generator's chartValue
      # resolver for copyFrom keys ignores empty values and falls through to
      # the copyFrom source, so this is the no-override default path.
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"cache-password"[^}]*"copyFrom":\s*"AUTH_TOKEN"[^}]*"chartValue":\s*""'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"pubsub-password"[^}]*"copyFrom":\s*"AUTH_TOKEN"[^}]*"chartValue":\s*""'

  - it: emits static empty cache-password and pubsub-password when nats is disabled
    set:
      nats.enabled: false
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"cache-password"[^}]*"type":\s*"static"[^}]*"chartValue":\s*""'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"pubsub-password"[^}]*"type":\s*"static"[^}]*"chartValue":\s*""'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"cache-password"[^}]*"copyFrom"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"pubsub-password"[^}]*"copyFrom"'

  - it: writes chartValue for cache-password when global.cache.auth.password is provided (nats enabled)
    set:
      nats.enabled: true
      global.cache.auth.password: my-cache-password
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"cache-password"[^}]*"copyFrom":\s*"AUTH_TOKEN"[^}]*"chartValue":\s*"my-cache-password"'

  - it: writes chartValue for pubsub-password when global.pubsub.auth.password is provided (nats enabled)
    set:
      nats.enabled: true
      global.pubsub.auth.password: my-pubsub-password
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"pubsub-password"[^}]*"copyFrom":\s*"AUTH_TOKEN"[^}]*"chartValue":\s*"my-pubsub-password"'

  - it: writes chartValue for cache-password/pubsub-password when nats is disabled
    set:
      nats.enabled: false
      global.cache.auth.password: cache-only-pw
      global.pubsub.auth.password: pubsub-only-pw
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"cache-password"[^}]*"type":\s*"static"[^}]*"chartValue":\s*"cache-only-pw"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"pubsub-password"[^}]*"type":\s*"static"[^}]*"chartValue":\s*"pubsub-only-pw"'

  - it: sets existingSecretName and skips gen when nats.extraEnvVarsSecret differs from gen name
    set:
      nats.enabled: true
      nats.extraEnvVarsSecret: my-custom-nats-secret
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-cache-pubsub"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-custom-nats-secret"'

  - it: emits existingSecretName on nats spec only when nats.extraEnvVarsSecret equals the gen name
    # nats.extraEnvVarsSecret only affects the nats spec (AUTH_TOKEN); cache
    # and pubsub specs are governed by their own existingSecret knobs.
    # The generator no-ops at runtime when ExistingSecretName == Name, so
    # the default install is unaffected.
    set:
      nats.enabled: true
      nats.extraEnvVarsSecret: runai-backend-gen-cache-pubsub
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"runai-backend-gen-cache-pubsub"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"AUTH_TOKEN"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"runai-backend-gen-cache-pubsub"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"cache-password"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"runai-backend-gen-cache-pubsub"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"pubsub-password"'

  #
  # Notifications-proxy encryption key
  #
  - it: emits notifications-proxy DB_ENCRYPTION_KEY entity
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-notifications-proxy-encryption-key"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"DB_ENCRYPTION_KEY"[^}]*"type":\s*"alphanumeric"[^}]*"length":\s*32'

  #
  # Diagnostics service — CUSTOMER_ID must be generated once and migrated
  # from the legacy runai-backend-diagnostics-service Secret so the
  # customer_id stays stable across ArgoCD syncs. DB_USER
  # stays in the chart-managed legacy Secret and is NOT in this spec.
  #
  - it: emits telemetry-service entity with the CUSTOMER_ID key only
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-diagnostics-service"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"legacySecretName":\s*"runai-backend-diagnostics-service"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"CUSTOMER_ID"[^}]*"type":\s*"alphanumeric"[^}]*"length":\s*24'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-diagnostics-service"[^{]*"keys":\s*\[[^]]*"name":\s*"DB_USER"'

  - it: telemetry-service entity is omitted when telemetryService.enabled is false
    set:
      telemetryService.enabled: false
    asserts:
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-diagnostics-service"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-telemetry-service"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"CUSTOMER_ID"'

  - it: telemetry-service entity is omitted when not support-entitled (derived off)
    set:
      supportEntitled: false
    asserts:
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-diagnostics-service"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-telemetry-service"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"CUSTOMER_ID"'

  #
  # Telemetry-service rename — gen-diagnostics-service -> gen-telemetry-service.
  # Migrates CUSTOMER_ID forward from the still-generated
  # runai-backend-gen-diagnostics-service Secret so every upgrade path (from
  # a pre-generator install or from one that already has gen-diagnostics-service)
  # always has a source to migrate from.
  #
  - it: emits telemetry-service-rename entity migrating CUSTOMER_ID from gen-diagnostics-service
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-telemetry-service"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"legacySecretName":\s*"runai-backend-gen-diagnostics-service"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-telemetry-service"[^{]*"legacySecretName":\s*"runai-backend-gen-diagnostics-service"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"CUSTOMER_ID"'

  - it: telemetry-service-rename entity is omitted when telemetryService.enabled is false
    set:
      telemetryService.enabled: false
    asserts:
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-telemetry-service"'

  #
  # Notifications service — ENCRYPT_DECRYPT_KEY must be generated once and
  # migrated from the legacy {{ .Release.Name }}-notifications-service Secret so the
  # key used to encrypt stored sink credentials stays stable when the
  # standalone subchart is folded into control-plane-chart. Sink credentials
  # stay in the chart-managed legacy Secret and are NOT in this spec.
  #
  - it: emits notifications-service entity with the ENCRYPT_DECRYPT_KEY key only
    release:
      name: runai-backend
    set:
      notificationsService.enabled: true
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-notifications-service"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"legacySecretName":\s*"runai-backend-notifications-service"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"ENCRYPT_DECRYPT_KEY"[^}]*"type":\s*"alphanumeric"[^}]*"length":\s*32'

  # The legacy name tracks the RELEASE name (the old subchart's Secret was
  # {Release.Name}-notifications-service). On SaaS pools the release is not
  # runai-backend (e.g. saas-pool1), so a fullnameOverride-based default would
  # miss the legacy Secret and regenerate the key -- data loss. The gen target
  # name stays fullnameOverride-based.
  - it: derives legacySecretName from the release name (covers SaaS / non-runai-backend releases)
    release:
      name: saas-pool1
    set:
      notificationsService.enabled: true
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-notifications-service"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"legacySecretName":\s*"saas-pool1-notifications-service"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"legacySecretName":\s*"runai-backend-notifications-service"'

  - it: notifications-service entity is omitted when notificationsService.enabled is false
    set:
      notificationsService.enabled: false
    asserts:
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-notifications-service"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"ENCRYPT_DECRYPT_KEY"'

  - it: never serializes ENCRYPT_DECRYPT_KEY as a chartValue in the params ConfigMap (no plaintext key)
    set:
      notificationsService.enabled: true
      notificationsService.secrets.encryptDecryptKey: my-encrypt-decrypt-key
    asserts:
      # added at runtime by the secret-generator job into the target secret
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"ENCRYPT_DECRYPT_KEY"[^}]*"chartValue"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: 'my-encrypt-decrypt-key'

  #
  # existingSecret propagation — user-supplied name is DIFFERENT from the
  # generator's target name. The generator target remains unchanged; the
  # user's name is passed through as existingSecretName.
  #
  - it: postgresql with user existingSecret different from generator target — both names appear
    set:
      postgresql.enabled: false
      global.postgresql.auth.existingSecret: my-custom-pg-secret
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-postgresql"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-custom-pg-secret"'

  - it: keycloak with user existingSecret different from generator target — both names appear
    set:
      keycloakx.existingSecret: my-custom-kc-secret
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-keycloakx"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-custom-kc-secret"'

  #
  # Boundaries — chart-managed identities (pubsub user, additional-subscriber
  # user) and consumer-only overrides (pubsub.auth.existingSecret,
  # cache.auth.existingSecret) must NOT leak into the generator spec.
  #
  - it: pubsub-user is generator-managed and pubsub-additional-subscriber-user is not in the generator spec
    set:
      global.pubsub.auth.user: nats_client
      global.pubsub.additionalSubscriber.enabled: true
      global.pubsub.additionalSubscriber.auth.user: subscriber
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"pubsub-user"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"pubsub-additional-subscriber-user"'

  - it: pubsub.auth.existingSecret propagates as existingSecretName on the pubsub-auth spec only
    set:
      global.pubsub.auth.existingSecret: my-user-pubsub-secret
    asserts:
      # Pubsub-auth spec carries existingSecretName; nats spec does not.
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"name":\s*"runai-backend-gen-cache-pubsub"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"pubsub-password"'
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-pubsub-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"pubsub-password"'
      # nats spec for the same target name keeps no existingSecretName here
      # (only the pubsub-auth section is affected by global.pubsub.auth.existingSecret).
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-pubsub-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"AUTH_TOKEN"'

  - it: cache.auth.existingSecret propagates as existingSecretName on the cache spec only
    set:
      global.cache.auth.existingSecret: my-user-cache-secret
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-cache-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"cache-password"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-cache-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"AUTH_TOKEN"'

  #
  # nats.extraEnvVarsSecret affects the nats spec only; cache and pubsub
  # specs are each governed solely by their own existingSecret knob.
  #
  - it: nats.extraEnvVarsSecret does not cascade to cache or pubsub specs
    set:
      nats.extraEnvVarsSecret: my-user-nats-secret
    asserts:
      - matchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-nats-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"AUTH_TOKEN"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-nats-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"cache-password"'
      - notMatchRegex:
          path: data["secrets.json"]
          pattern: '"existingSecretName":\s*"my-user-nats-secret"[^{]*"keys":\s*\[\s*\{\s*"name":\s*"pubsub-password"'
