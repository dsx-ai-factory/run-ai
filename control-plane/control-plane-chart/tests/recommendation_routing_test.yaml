suite: Recommendation routing uses service namespaces
templates:
  - templates/traefik/configmap.yaml
tests:
  - it: keeps workload and catalog routes on their services without legacy inference exceptions
    asserts:
      - matchRegex:
          path: data["routes.yaml"]
          pattern: '(?m)^    workloads-service-router:\n      rule: [^\n]*PathPrefix\(`/api/v1/workloads`\)'
      - matchRegex:
          path: data["routes.yaml"]
          pattern: '(?m)^    catalog-service-router:\n      rule: [^\n]*PathPrefix\(`/api/v1/catalog`\)'
      - notMatchRegex:
          path: data["routes.yaml"]
          pattern: 'PathPrefix\(`/api/v[12]/(model-)?inference`\)'
      - notMatchRegex:
          path: data["routes.yaml"]
          pattern: 'right-sizing/recommendation'
