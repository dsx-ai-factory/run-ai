suite: cluster-service secrets
templates:
  - templates/cluster-service/secret.yaml
  - templates/cluster-service/configmap.yaml
  - templates/cluster-service/deployment.yaml

tests:
  - it: renders password in cluster-service Secret when no existingSecret is set (fallback to values)
    template: templates/cluster-service/secret.yaml
    set:
      fullnameOverride: runai-backend
      clusterService:
        enabled: true
        name: cluster-service
        config:
          applicationMetricsWrite:
            password: plain-pass
    documentSelector:
      path: kind
      value: Secret
    asserts:
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: runai-backend-cluster-service
      - equal:
          path: data.APPLICATION_METRIC_STORE_WRITE_PASSWORD
          # base64 of "plain-pass"
          value: cGxhaW4tcGFzcw==
  - it: deployment mounts chart-managed secret and default key when no existingSecret is set
    template: templates/cluster-service/deployment.yaml
    set:
      fullnameOverride: runai-backend
      clusterService:
        enabled: true
        name: cluster-service
        config:
          applicationMetricsWrite:
            password: plain-pass
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          # NOTE: helm-unittest lacks JSONPath filters; we assert on sources array directly
          path: spec.template.spec.volumes[1].projected.sources
          content:
            secret:
              name: runai-backend-cluster-service
              items:
                - key: APPLICATION_METRIC_STORE_WRITE_PASSWORD
                  path: APPLICATION_METRIC_STORE_WRITE_PASSWORD
              optional: true

  - it: does not render password in chart-managed Secret when existingSecret is provided
    template: templates/cluster-service/secret.yaml
    set:
      fullnameOverride: runai-backend
      clusterService:
        enabled: true
        name: cluster-service
        config:
          applicationMetricsWrite:
            existingSecret: ext-metrics-secret
            secretKeys:
              passwordKey: CUSTOM_KEY
            password: ignored-when-existing
    documentSelector:
      path: kind
      value: Secret
    asserts:
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: runai-backend-cluster-service
      - notExists:
          path: data.CUSTOM_KEY
      - notExists:
          path: data.APPLICATION_METRIC_STORE_WRITE_PASSWORD
  - it: deployment mounts existingSecret and maps custom key to expected path
    template: templates/cluster-service/deployment.yaml
    set:
      fullnameOverride: runai-backend
      clusterService:
        enabled: true
        name: cluster-service
        config:
          applicationMetricsWrite:
            existingSecret: ext-metrics-secret
            secretKeys:
              passwordKey: CUSTOM_KEY
            password: ignored-when-existing
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          # NOTE: helm-unittest lacks JSONPath filters; we assert on sources array directly
          path: spec.template.spec.volumes[1].projected.sources
          content:
            secret:
              name: ext-metrics-secret
              items:
                - key: CUSTOM_KEY
                  path: APPLICATION_METRIC_STORE_WRITE_PASSWORD
              optional: true

  - it: configmap uses the public NGC helm repository without credentials by default
    template: templates/cluster-service/configmap.yaml
    set:
      fullnameOverride: runai-backend
      clusterService:
        enabled: true
        name: cluster-service
    asserts:
      - equal:
          path: data.CLUSTER_INSTALLATION_HELM_REGISTRY_URL
          value: https://helm.ngc.nvidia.com/nvidia/runai-oss
      - notExists:
          path: data.CLUSTER_INSTALLATION_HELM_REGISTRY_USERNAME
      - notExists:
          path: data.CLUSTER_INSTALLATION_HELM_REGISTRY_PASSWORD_PLACEHOLDER

  - it: configmap disables static image pull secret when no global image pull secret is configured
    template: templates/cluster-service/configmap.yaml
    set:
      fullnameOverride: runai-backend
      clusterService:
        enabled: true
        name: cluster-service
        config:
          imagePullSecret:
            enabled: true
    asserts:
      - equal:
          path: data.IMAGE_PULL_SECRET_ENABLED
          value: "false"

  - it: configmap enables static image pull secret when global image pull secret is configured
    template: templates/cluster-service/configmap.yaml
    set:
      fullnameOverride: runai-backend
      global:
        imagePullSecrets:
          - name: runai-reg-creds
      clusterService:
        enabled: true
        name: cluster-service
        config:
          imagePullSecret:
            enabled: true
    asserts:
      - equal:
          path: data.IMAGE_PULL_SECRET_ENABLED
          value: "true"

  - it: configmap infers $oauthtoken for the NGC helm repository URL
    template: templates/cluster-service/configmap.yaml
    set:
      fullnameOverride: runai-backend
      clusterService:
        enabled: true
        name: cluster-service
        config:
          clusterInstallation:
            helmRegistryUrl: https://helm.ngc.nvidia.com
            helmRegistryPasswordPlaceholder: "<NGC_API_KEY>"
    asserts:
      - equal:
          path: data.CLUSTER_INSTALLATION_HELM_REGISTRY_USERNAME
          value: "$oauthtoken"
      - equal:
          path: data.CLUSTER_INSTALLATION_HELM_REGISTRY_PASSWORD_PLACEHOLDER
          value: "<NGC_API_KEY>"

  - it: configmap gives an explicit username precedence for authenticated NGC
    template: templates/cluster-service/configmap.yaml
    set:
      fullnameOverride: runai-backend
      clusterService:
        enabled: true
        name: cluster-service
        config:
          clusterInstallation:
            helmRegistryUsername: my-custom-user
            helmRegistryPasswordPlaceholder: "<My custom placeholder>"
    asserts:
      - equal:
          path: data.CLUSTER_INSTALLATION_HELM_REGISTRY_USERNAME
          value: my-custom-user
      - equal:
          path: data.CLUSTER_INSTALLATION_HELM_REGISTRY_PASSWORD_PLACEHOLDER
          value: "<My custom placeholder>"

  - it: configmap supports explicit credentials for a non-NGC repository
    template: templates/cluster-service/configmap.yaml
    set:
      fullnameOverride: runai-backend
      clusterService:
        enabled: true
        name: cluster-service
        config:
          clusterInstallation:
            helmRegistryUrl: https://my-registry.example.com/charts
            helmRegistryUsername: my-user
            helmRegistryPasswordPlaceholder: "<My custom placeholder>"
    asserts:
      - equal:
          path: data.CLUSTER_INSTALLATION_HELM_REGISTRY_USERNAME
          value: my-user
      - equal:
          path: data.CLUSTER_INSTALLATION_HELM_REGISTRY_PASSWORD_PLACEHOLDER
          value: "<My custom placeholder>"

  - it: configmap rejects a non-NGC password placeholder without a username
    template: templates/cluster-service/configmap.yaml
    set:
      fullnameOverride: runai-backend
      clusterService:
        enabled: true
        name: cluster-service
        # Keep the ConfigMap failure from being attributed to the deployment checksum render.
        envFrom: []
        env: []
        config:
          clusterInstallation:
            helmRegistryUrl: https://helm.ngc.nvidia.com.example.com/charts
            helmRegistryPasswordPlaceholder: "<My custom placeholder>"
    asserts:
      - failedTemplate:
          errorMessage: "helmRegistryUsername is required when configuring authentication for a non-NGC repository"

  # Projections remain present but are marked optional, so pod won't fail mount when not configured
  - it: deployment projects metrics password (placeholder) when not configured
    template: templates/cluster-service/deployment.yaml
    set:
      fullnameOverride: runai-backend
      clusterService:
        enabled: true
        name: cluster-service
        config: {}
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes[1].projected.sources
          content:
            secret:
              name: runai-backend-cluster-service
              items:
                - key: APPLICATION_METRIC_STORE_WRITE_PASSWORD
                  path: APPLICATION_METRIC_STORE_WRITE_PASSWORD
              optional: true
