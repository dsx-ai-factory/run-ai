# Shared default values for the secret-generator unit tests.
# Provides the minimum global.* and component blocks required by the
# secret-generator helpers so each test can stay focused on what it asserts
# and only override the keys it actually cares about.

fullnameOverride: runai-backend

supportEntitled: true

postgresql:
  enabled: true

keycloakx:
  existingSecret: ""
  adminUser: admin
  database:
    dbschema: public

tenantsManager:
  config:
    adminPassword: ""

global:
  # global.management.password drives TENANT_MNG_PASSWORD in the gen-tenants-manager Secret.
  # Overridden to empty here so the secret-generator's random-password path is
  # what these unit tests exercise; the chart default remains a non-empty value
  # so CI/dev keep a known password until existingSecret support lands.
  management:
    password: ""
  postgresql:
    auth:
      existingSecret: ""
      username: runai
      host: postgres
      port: 5432
      database: runai
      secretKeys:
        userPasswordKey: password
        adminPasswordKey: postgres-password
  pubsub:
    auth:
      user: ""
      existingSecret: ""
      secretKeys:
        passwordKey: pubsub-password
        userKey: pubsub-user
    additionalSubscriber:
      enabled: false
      auth:
        user: ""
        existingSecret: ""
        secretKeys:
          passwordKey: pubsub-additional-subscriber-password
          userKey: pubsub-additional-subscriber-user
  cache:
    auth:
      existingSecret: ""
      secretKeys:
        passwordKey: cache-password
