suite: notifications-service secrets
templates:
  - templates/notifications-service/secret.yaml
  - templates/notifications-service/deployment.yaml

# ENCRYPT_DECRYPT_KEY is used to encrypt stored sink credentials; losing it
# makes them unreadable. It is owned by the secret-generator hook in
# runai-backend-gen-notifications-service (migrated from the legacy
# {{ .Release.Name }}-notifications-service Secret) rather than rendered by the
# chart. The chart-managed runai-backend-notifications-service Secret now only
# holds inline sink credentials, so it renders solely when at least one exists.
tests:
  #
  # Chart-managed Secret (sink credentials only)
  #
  - it: does not render the chart-managed Secret when there are no inline sink credentials
    template: templates/notifications-service/secret.yaml
    set:
      notificationsService.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders inline sink credentials in the chart-managed Secret
    template: templates/notifications-service/secret.yaml
    set:
      notificationsService.enabled: true
      notificationsService.config.sinks.mysink.password: s3cret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: runai-backend-notifications-service
      - equal:
          path: stringData["mysink-password"]
          value: s3cret

  - it: never renders ENCRYPT_DECRYPT_KEY in the chart-managed Secret
    template: templates/notifications-service/secret.yaml
    set:
      notificationsService.enabled: true
      notificationsService.config.sinks.mysink.password: s3cret
    asserts:
      - notExists:
          path: data.ENCRYPT_DECRYPT_KEY
      - notExists:
          path: stringData.ENCRYPT_DECRYPT_KEY

  - it: does not keep the chart-managed Secret on uninstall (only sink credentials live here now)
    template: templates/notifications-service/secret.yaml
    set:
      notificationsService.enabled: true
      notificationsService.config.sinks.mysink.password: s3cret
    asserts:
      - notExists:
          path: metadata.annotations["helm.sh/resource-policy"]

  #
  # Deployment mounts ENCRYPT_DECRYPT_KEY from the generator-owned Secret
  #
  - it: deployment projects ENCRYPT_DECRYPT_KEY from the generator-owned Secret
    template: templates/notifications-service/deployment.yaml
    set:
      notificationsService.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes[1].projected.sources
          content:
            secret:
              name: runai-backend-gen-notifications-service
              items:
                - key: ENCRYPT_DECRYPT_KEY
                  path: ENCRYPT_DECRYPT_KEY

  - it: deployment does not project ENCRYPT_DECRYPT_KEY from the chart-managed Secret
    template: templates/notifications-service/deployment.yaml
    set:
      notificationsService.enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.volumes[1].projected.sources
          content:
            secret:
              name: runai-backend-notifications-service
              items:
                - key: ENCRYPT_DECRYPT_KEY
                  path: ENCRYPT_DECRYPT_KEY

  - it: deployment still projects inline sink credentials from the chart-managed Secret
    template: templates/notifications-service/deployment.yaml
    set:
      notificationsService.enabled: true
      notificationsService.config.sinks.mysink.password: s3cret
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes[1].projected.sources
          content:
            secret:
              name: runai-backend-notifications-service
              items:
                - key: mysink-password
                  path: sinks/mysink/password
