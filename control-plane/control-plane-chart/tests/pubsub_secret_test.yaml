suite: chart-managed pubsub secret
templates:
  - templates/pubsub/secret.yaml

values:
  - ./_values/secret-generator-defaults.yaml

# The chart-managed pubsub Secret (runai-backend-pubsub) holds:
#   - pubsub-user (when auth.existingSecret not set)
#   - pubsub-additional-subscriber-user (when additionalSubscriber.auth.existingSecret not set)
#   - pubsub-additional-subscriber-password (when additionalSubscriber.auth.existingSecret not set;
#     defaults to "" for no-auth Redis)
#
# The primary pubsub password (NATS AUTH_TOKEN) is generator-managed and NOT stored here.
# The Secret is not rendered when both components use existingSecret.
tests:
  - it: renders a Secret named runai-backend-pubsub
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: runai-backend-pubsub

  - it: stores configured user and password values
    set:
      global.pubsub.auth.user: nats_client
      global.pubsub.additionalSubscriber.auth.user: subscriber
      global.pubsub.additionalSubscriber.auth.password: redis_secret
    asserts:
      - notExists:
          path: data["pubsub-user"]
      - equal:
          path: data["pubsub-additional-subscriber-user"]
          # base64 of "subscriber"
          value: c3Vic2NyaWJlcg==
      - equal:
          path: data["pubsub-additional-subscriber-password"]
          # base64 of "redis_secret"
          value: cmVkaXNfc2VjcmV0

  - it: stores empty subscriber password by default (no-auth Redis)
    asserts:
      - exists:
          path: data["pubsub-additional-subscriber-password"]
      - equal:
          path: data["pubsub-additional-subscriber-password"]
          # base64 of ""
          value: ""

  - it: honors custom secretKeys names
    set:
      global.pubsub.auth.secretKeys.userKey: my-pubsub-user-key
      global.pubsub.additionalSubscriber.auth.secretKeys.userKey: my-subscriber-user-key
      global.pubsub.additionalSubscriber.auth.secretKeys.passwordKey: my-subscriber-password-key
      global.pubsub.auth.user: nats_client
      global.pubsub.additionalSubscriber.auth.user: subscriber
      global.pubsub.additionalSubscriber.auth.password: redis_secret
    asserts:
      - notExists:
          path: data["my-pubsub-user-key"]
      - equal:
          path: data["my-subscriber-user-key"]
          value: c3Vic2NyaWJlcg==
      - equal:
          path: data["my-subscriber-password-key"]
          value: cmVkaXNfc2VjcmV0

  #
  # existingSecret scenarios — when existingSecret is set for a component, all
  # keys for that component are omitted. The Secret is still rendered as long as
  # at least one component does NOT use existingSecret.
  #
  - it: excludes pubsub-user when auth.existingSecret is set
    set:
      global.pubsub.auth.existingSecret: my-user-pubsub-secret
      global.pubsub.auth.user: nats_client
    asserts:
      - equal:
          path: metadata.name
          value: runai-backend-pubsub
      - notExists:
          path: data["pubsub-user"]
      - exists:
          path: data["pubsub-additional-subscriber-user"]
      - exists:
          path: data["pubsub-additional-subscriber-password"]

  - it: excludes subscriber keys when additionalSubscriber.auth.existingSecret is set
    set:
      global.pubsub.additionalSubscriber.auth.existingSecret: my-user-subscriber-secret
      global.pubsub.additionalSubscriber.auth.user: subscriber
    asserts:
      - equal:
          path: metadata.name
          value: runai-backend-pubsub
      - notExists:
          path: data["pubsub-user"]
      - notExists:
          path: data["pubsub-additional-subscriber-user"]
      - notExists:
          path: data["pubsub-additional-subscriber-password"]

  - it: does not render when both existingSecrets are set
    set:
      global.pubsub.auth.existingSecret: my-user-pubsub-secret
      global.pubsub.additionalSubscriber.auth.existingSecret: my-user-subscriber-secret
    asserts:
      - hasDocuments:
          count: 0
