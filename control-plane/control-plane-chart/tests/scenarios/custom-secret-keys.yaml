# Customer-renamed secret keys. Producer (generator config) and consumers
# (workload secretKeyRefs / projected items) must agree on the new names.
global:
  cache:
    auth:
      secretKeys:
        passwordKey: my-cache-key
  pubsub:
    auth:
      secretKeys:
        passwordKey: my-pubsub-key
        userKey: my-pubsub-user-key
  postgresql:
    auth:
      secretKeys:
        userPasswordKey: my-pg-user-key
        adminPasswordKey: my-pg-admin-key
