# Every secret routed to a user-managed secret. The generator should defer
# entirely; chart consumers should resolve secret names/keys consistently.
global:
  cache:
    auth:
      existingSecret: my-cache-secret
  pubsub:
    auth:
      existingSecret: my-pubsub-secret
  postgresql:
    auth:
      existingSecret: my-postgresql-secret
keycloakx:
  existingSecret: my-keycloak-secret
global:
  management:
    existingSecret: my-management-secret
tenantsManager:
  config:
    existingSecret: my-tenants-manager-secret
