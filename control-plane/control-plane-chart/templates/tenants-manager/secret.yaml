{{- if .Values.tenantsManager.enabled }}
{{- include "common.secret" (list . .Values.tenantsManager "control-plane.tenantsManager.secret") }}
{{- end }}

{{- define "control-plane.tenantsManager.secret" -}}
{{- $top := first . }}
{{- /*
  ADMIN_PASSWORD is materialized into runai-backend-gen-tenants-manager by the
  secret-generator hook (templates/helm-hooks/secret-generator/_helpers.tpl).
  Validation here still applies whenever tenantsManager.config.adminPassword
  is supplied as a chart value and would actually be consumed (single-tenant
  install with no user-supplied existingSecret); it is skipped when the value
  is empty so the generator can produce a random password instead.
*/ -}}
{{- $adminPassword := $top.Values.tenantsManager.config.adminPassword | default "" }}
{{- if and (not $top.Values.global.multiTenancy.enabled) (not $top.Values.tenantsManager.config.existingSecret) $adminPassword }}
{{- if lt (len $adminPassword) 8 }}
{{- fail "tenantsManager.config.adminPassword must be at least 8 characters long" }}
{{- end }}
{{- if not (regexMatch `[A-Z]` $adminPassword) }}
{{- fail "tenantsManager.config.adminPassword must contain at least 1 uppercase letter" }}
{{- end }}
{{- if not (regexMatch `[a-z]` $adminPassword) }}
{{- fail "tenantsManager.config.adminPassword must contain at least 1 lowercase letter" }}
{{- end }}
{{- if not (regexMatch `[0-9]` $adminPassword) }}
{{- fail "tenantsManager.config.adminPassword must contain at least 1 digit" }}
{{- end }}
{{- if not (regexMatch `[^a-zA-Z0-9]` $adminPassword) }}
{{- fail "tenantsManager.config.adminPassword must contain at least 1 special character (non-alphanumeric)" }}
{{- end }}
{{- end }}
data:
  DB_USER: {{ $top.Values.tenantsManager.config.dbUsername | default $top.Values.global.postgresql.auth.username | b64enc }}
  {{- if $top.Values.global.multiTenancy.enabled }}
  {{- if not $top.Values.global.management.existingSecret }}
  TENANT_MNG_USER: {{ $top.Values.global.management.user | b64enc }}
  {{- end }}
  {{- end }}

{{- end }}
