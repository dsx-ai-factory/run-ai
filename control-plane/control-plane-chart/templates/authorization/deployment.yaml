{{- if .Values.authorization.enabled }}
{{- include "common.deployment" (list . .Values.authorization .Values.authorization.autoscaling .Values.authorization.serviceAccount "control-plane.authorization.deployment" ) }}
{{- end }}

{{- define "control-plane.authorization.deployment" -}}
{{- $top := first . }}
spec:
  template:
    spec:
      initContainers:
        {{- include "awaitingPostgresReadinessContainer" . | nindent 8 }}
        {{- if $top.Values.tempBackendSettings.enabled }}
        {{- include "awaitingTempBackendSettingsReadiness" . | nindent 8 }}
        {{- end }}
        {{- include "common.initContainer" . | nindent 8 }}
      containers:
      - {{- include "common.container" . | nindent 8 }}
{{- end }}