{{- if .Values.postgresql.enabled }}
{{- include "common.secret" (list . .Values.postgresql "control-plane.postgresql.secret") }}
{{- end }}
{{- define "control-plane.postgresql.secret" -}}
{{- $top := first . }}
data:
  {{- if $top.Values.postgresql.certFile  | default false }}
  tls.crt: {{ tpl $top.Values.postgresql.certFile $top | b64enc }}
  {{- end }}
  {{- if $top.Values.postgresql.keyFile  | default false }}
  tls.key: {{ tpl $top.Values.postgresql.keyFile $top | b64enc }}
  {{- end }}

{{- end }}
