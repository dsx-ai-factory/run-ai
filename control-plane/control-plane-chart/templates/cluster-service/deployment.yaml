{{- if .Values.clusterService.enabled }}
{{- include "common.deployment" (list . .Values.clusterService .Values.clusterService.autoscaling .Values.clusterService.serviceAccount "control-plane.clusterService.deployment" ) }}
{{- end }}

{{- define "control-plane.clusterService.deployment" -}}
{{- $top := first . }}
spec:
  template:
    spec:
      initContainers:
        {{- include "awaitingPostgresReadinessContainer" . | nindent 8 }}
        {{- if $top.Values.tempBackendSettings.enabled }}
        {{- include "awaitingTempBackendSettingsReadiness" . | nindent 8 }}
        {{- end }}
        {{- include "common.initContainer" . | nindent 8 }}
      containers:
      - {{- include "common.container" . | nindent 8 }}
{{- end }}