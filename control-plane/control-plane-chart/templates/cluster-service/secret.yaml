{{- if .Values.clusterService.enabled }}
{{- include "common.secret" (list . .Values.clusterService "control-plane.clusterService.secret") }}
{{- end }}

{{- define "control-plane.clusterService.secret" -}}
{{- $top := first . }}
data:
  DB_USER: {{ $top.Values.clusterService.config.dbUsername | default $top.Values.global.postgresql.auth.username | b64enc }}
  CLUSTER_HOST_TEMPLATE: {{ $top.Values.clusterService.config.clusterHostTemplate | default "placeholder" | b64enc }}
  {{- if $top.Values.clusterService.config.applicationMetricsWrite }}
  {{- if $top.Values.clusterService.config.applicationMetricsWrite.user }}
  APPLICATION_METRIC_STORE_WRITE_USERNAME: {{ $top.Values.clusterService.config.applicationMetricsWrite.user | b64enc }}
  {{- end }}
  {{- if and (not $top.Values.clusterService.config.applicationMetricsWrite.existingSecret) ($top.Values.clusterService.config.applicationMetricsWrite.password) }}
  {{ include "control-plane.clusterService.applicationMetricsWrite.password.secret.key" $top }}: {{ $top.Values.clusterService.config.applicationMetricsWrite.password | b64enc }}
  {{- end }}
  {{- if $top.Values.clusterService.config.applicationMetricsWrite.headers }}
  APPLICATION_METRIC_STORE_HEADERS: {{ $top.Values.clusterService.config.applicationMetricsWrite.headers | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}