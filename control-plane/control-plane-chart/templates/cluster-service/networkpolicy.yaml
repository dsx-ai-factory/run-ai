{{- if .Values.clusterService.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cluster-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cluster-service
  policyTypes:
    - Ingress
  ingress:
    # Allow all traffic from the same namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: {{ .Release.Namespace }}
        - podSelector: {}
{{- end }}
