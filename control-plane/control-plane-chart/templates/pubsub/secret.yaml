{{- if or (not .Values.global.pubsub.auth.existingSecret) (not .Values.global.pubsub.additionalSubscriber.auth.existingSecret) }}
{{- include "common.secret" (list . (dict "name" "pubsub") "control-plane.pubsub.password.secret") }}
{{- end }}

{{- define "control-plane.pubsub.password.secret" -}}
{{- $top := first . }}
data:
{{- if not $top.Values.global.pubsub.additionalSubscriber.auth.existingSecret }}
  {{- if $top.Values.global.pubsub.additionalSubscriber.auth.secretKeys.userKey }}
  {{ $top.Values.global.pubsub.additionalSubscriber.auth.secretKeys.userKey }}: {{ $top.Values.global.pubsub.additionalSubscriber.auth.user | b64enc | quote }}
  {{- end }}
  {{ $top.Values.global.pubsub.additionalSubscriber.auth.secretKeys.passwordKey | default "pubsub-additional-subscriber-password" }}: {{ $top.Values.global.pubsub.additionalSubscriber.auth.password | default "" | b64enc | quote }}
{{- end }}
{{- end }}
