{{- include "common.deployment" (list . .Values.bffService .Values.bffService.autoscaling .Values.bffService.serviceAccount "control-plane.bffService.deployment" ) }}

{{- define "control-plane.bffService.deployment" -}}
{{- $top := first . }}
spec:
  template:
    spec:
      initContainers:
        {{- include "awaitingPostgresReadinessContainer" . | nindent 8 }}
        {{- if $top.Values.tempBackendSettings.enabled }}
        {{- include "awaitingTempBackendSettingsReadiness" . | nindent 8 }}
        {{- end }}
        {{- include "awaitingTenantsManagerReadiness" . | nindent 8 }}
        {{- include "common.initContainer" . | nindent 8 }}
      containers:
      - {{- include "common.container" . | nindent 8 }}
{{- end }}