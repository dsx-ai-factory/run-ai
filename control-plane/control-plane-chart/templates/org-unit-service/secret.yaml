{{- if .Values.orgUnitService.enabled }}
{{- include "common.secret" (list . .Values.orgUnitService "control-plane.orgUnitService.secret") }}
{{- end }}
{{- define "control-plane.orgUnitService.secret" -}}
{{- $top := first . }}
data:
  DB_USER: {{ $top.Values.orgUnitService.config.dbUsername | default $top.Values.global.postgresql.auth.username | b64enc }}
  {{- if and (or ($top.Values.global.blobStorage.s3.enabled) ($top.Values.orgUnitService.config.s3Enabled)) (or ($top.Values.global.blobStorage.s3.accessKey) ($top.Values.orgUnitService.config.s3AccessKey)) }}
  S3.ACCESS_KEY: {{ $top.Values.orgUnitService.config.s3AccessKey | default $top.Values.global.blobStorage.s3.accessKey | b64enc }}
  {{- end }}
{{- end }}