{{- if .Values.notificationsService.enabled }}
{{- $svc := .Values.notificationsService }}
{{- $fullname := include "control-plane.notificationsService.fullname" . }}
{{- $extractedSecrets := include "control-plane.notificationsService.extractedSinkSecrets" . | fromJson }}
{{- if gt (len $extractedSecrets) 0 }}
apiVersion: v1
kind: Secret
metadata:
  {{- include "common.metadata" (list . $svc) | nindent 2 }}
  name: {{ $fullname }}
type: Opaque
stringData:
  {{- range $sinkName, $sinkFields := $extractedSecrets }}
  {{- range $fieldName, $fieldValue := $sinkFields }}
  {{ printf "%s-%s" $sinkName $fieldName | quote }}: {{ $fieldValue | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
