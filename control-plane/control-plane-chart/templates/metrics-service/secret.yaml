{{- include "common.secret" (list . .Values.metricsService "control-plane.metricsService.secret") }}

{{- define "control-plane.metricsService.secret" -}}
{{- $top := first . }}
data:
  DB_USER: {{ $top.Values.metricsService.config.dbUsername | default $top.Values.global.postgresql.auth.username | b64enc }}
  {{- if or ($top.Values.global.blobStorage.s3.enabled) ($top.Values.metricsService.config.s3Enabled) }}
  {{- if or ($top.Values.global.blobStorage.s3.accessKey) ($top.Values.metricsService.config.s3AccessKey) }}
  S3.ACCESS_KEY: {{ $top.Values.metricsService.config.s3AccessKey | default $top.Values.global.blobStorage.s3.accessKey | b64enc }}
  {{- end }}
  {{- end }}
  {{- with $top.Values.metricsService.config.datasourceProvider.auth }}
  {{- if not .existingSecret }}
  {{ include "control-plane.metricsService.config.datasourceProvider.auth.secret.accessTokenKey" $top }}: {{ .accessToken | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- with $top.Values.metricsService.config.datasourceProvider.staticDatasource }}
  {{- if not .existingSecret }}
  {{ include "control-plane.metricsService.config.datasourceProvider.staticDatasource.secret.readUserKey" $top }}: {{ .read.auth.basic.username | b64enc | quote }}
  {{ include "control-plane.metricsService.config.datasourceProvider.staticDatasource.secret.readPasswordKey" $top }}: {{ .read.auth.basic.password | b64enc | quote }}
  {{ include "control-plane.metricsService.config.datasourceProvider.staticDatasource.secret.writeUserKey" $top }}: {{ .write.auth.basic.username | b64enc | quote }}
  {{ include "control-plane.metricsService.config.datasourceProvider.staticDatasource.secret.writePasswordKey" $top }}: {{ .write.auth.basic.password | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
