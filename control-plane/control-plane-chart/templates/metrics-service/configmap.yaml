{{- if .Values.metricsService.enabled }}
{{- include "common.configMap" (list . .Values.metricsService "control-plane.metricsService.configmap") }}
{{- end }}

{{- define "control-plane.metricsService.configmap" -}}
{{- $top := first . }}
data:
  SERVICE_NAME: {{ $top.Values.metricsService.name | quote }}
  SERVER_WRITE_TIMEOUT: {{ $top.Values.metricsService.config.server.writeTimeout | quote }}
  SERVER_READ_TIMEOUT: {{ $top.Values.metricsService.config.server.readTimeout | quote }}
  SERVER_IDLE_TIMEOUT: {{ $top.Values.metricsService.config.server.idleTimeout | quote }}
  TRACING_ENABLED: {{ if hasKey $top.Values.metricsService.config "tracingEnabled" }}{{ $top.Values.metricsService.config.tracingEnabled | quote }}{{ else }}{{ $top.Values.global.config.tracingEnabled | quote }}{{ end }}
  AUDIT_ENABLED: {{ if hasKey $top.Values.metricsService.config "auditEnabled" }}{{ $top.Values.metricsService.config.auditEnabled | quote }}{{ else }}{{ $top.Values.global.config.auditEnabled | quote }}{{ end }}
  AUDIT_ENABLE_PRINT_TO_STDOUT: {{ if hasKey $top.Values.metricsService.config "auditEnablePrintToStdout" }}{{ $top.Values.metricsService.config.auditEnablePrintToStdout | quote }}{{ else }}{{ $top.Values.global.config.auditEnablePrintToStdout | quote }}{{ end }}
  AUDIT_SERVICE_URL: {{ printf "http://%s-%s:%s" $top.Values.fullnameOverride $top.Values.auditService.name ($top.Values.auditService.service.port | toString) | quote }}
  DB_MIGRATION_FILES: {{ $top.Values.metricsService.config.migrationFiles | quote }}
  DB_SCHEMA: {{ $top.Values.metricsService.config.dbScheme | default "metrics" | quote }}
  DB_NAME: {{ $top.Values.metricsService.config.dbName | default $top.Values.global.postgresql.auth.database | quote }}
  DB_HOST: {{ $top.Values.metricsService.config.dbHost | default $top.Values.global.postgresql.auth.host | quote }}
  DB_SSL_MODE: {{ $top.Values.metricsService.config.dbSslMode | default $top.Values.global.postgresql.auth.dbSslMode | quote }}
  DB_PORT: {{ $top.Values.metricsService.config.dbPort | default $top.Values.global.postgresql.auth.port | quote }}
  PUBSUB_URL: {{ $top.Values.global.pubsub.url | quote }}
  PUBSUB_TYPE: {{ $top.Values.global.pubsub.type | quote }}
  PUBSUB_ENABLE_ADDITIONAL_SUBSCRIBER: {{ $top.Values.global.pubsub.additionalSubscriber.enabled | quote }}
  {{- if $top.Values.global.pubsub.additionalSubscriber.enabled }}
  PUBSUB_ADDITIONAL_SUBSCRIBER_TYPE: {{ $top.Values.global.pubsub.additionalSubscriber.type | quote }}
  PUBSUB_ADDITIONAL_SUBSCRIBER_URL: {{ $top.Values.global.pubsub.additionalSubscriber.url | quote }}
  {{- end }}
  CONFIG_KEY_DELIMITER: {{ $top.Values.metricsService.config.configKeyDelimiter | quote }}
  {{- if or ($top.Values.global.blobStorage.s3.enabled) ($top.Values.metricsService.config.s3Enabled) }}
  S3_ENDPOINT: {{ $top.Values.metricsService.config.s3Endpoint | default $top.Values.global.blobStorage.s3.endpoint | quote }}
  {{- if or ($top.Values.metricsService.config.s3UseSSL) ($top.Values.global.blobStorage.s3.useSSL) }}
  S3_USE_SSL: {{ $top.Values.metricsService.config.s3UseSSL | default $top.Values.global.blobStorage.s3.useSSL | quote }}
  {{- end }}
  {{- if or ($top.Values.metricsService.config.s3AccessKeyId) ($top.Values.global.blobStorage.s3.accessKeyId) }}
  S3_ACCESS_KEY_ID: {{ $top.Values.metricsService.config.s3AccessKeyId | default $top.Values.global.blobStorage.s3.accessKeyId | quote }}
  {{- end }}
  {{- end }}
  config.yaml: |-
    log_level: {{ $top.Values.metricsService.config.logLevel | quote }}
    release: {{ $top.Release.Name | quote }}
    env: {{ $top.Values.global.config.environment | default "" | quote }}
    service_port: {{ $top.Values.metricsService.service.port | quote }}
    {{- if or ($top.Values.global.blobStorage.s3.enabled) ($top.Values.metricsService.config.s3Enabled) }}
    reports:
      s3_config:
        bucket: {{ $top.Values.metricsService.config.reportsBucket | quote }}
    {{- end }}
    datasources:
      datasource_url: {{ $top.Values.metricsService.config.datasourceUrl | quote }}
    datasource_provider:
      datasource_type: {{ $top.Values.metricsService.config.datasourceProvider.type | quote }}
      static_datasource:
        type: {{ $top.Values.metricsService.config.datasourceProvider.staticDatasource.type | quote }}
        {{- with $top.Values.metricsService.config.datasourceProvider.staticDatasource }}
        read:
          url: {{ .read.url | quote }}
          {{- with .read.auth.type }}
          auth:
            type: {{ . | quote }}
          {{- end }}
        write:
          url: {{ .write.url | default (printf "https://%s/api/v1/receive" $top.Values.global.domain) | quote }}
          {{- with .write.auth.type }}
          auth:
            type: {{ . | quote }}
          {{- end }}
        {{- end }}
    cleaner:
      is_cleanup_enabled: {{ $top.Values.metricsService.config.cleaner.isCleanupEnabled | quote }}
      cleaner_interval_hours: {{ $top.Values.metricsService.config.cleaner.cleanerIntervalHours | quote }}
      delete_report_ttl_days: {{ $top.Values.metricsService.config.cleaner.deleteReportsTTLDays | quote }}
    cron_jobs:
      reports:
        interval_seconds: {{ $top.Values.metricsService.config.dbCronJobs.reports.intervalSeconds | quote }}
        max_retry_count: {{ $top.Values.metricsService.config.dbCronJobs.reports.maxRetryCount | quote }}
        retry_failed_reports_min_age_minutes: {{ $top.Values.metricsService.config.dbCronJobs.reports.retryFailedReportsMinAgeMinutes | quote }}
        retry_failed_reports_max_age_minutes: {{ $top.Values.metricsService.config.dbCronJobs.reports.retryFailedReportsMaxAgeMinutes | quote }}
        fail_stuck_processing_reports_min_age_minutes: {{ $top.Values.metricsService.config.dbCronJobs.reports.failStuckProcessingReportsMinAgeMinutes | quote }}
    metrics:
      runai_workload_count_per_category:
        cross_version_query: sum(runai_workload_count_per_category{FILTERS}) by (workload_category, clusterId) or on(workload_category, clusterId) count(runai_workload_info_enriched{FILTERS}) by (workload_category, clusterId)
        queries:
              2.23.0: sum(runai_workload_count_per_category{FILTERS}) by (workload_category, clusterId)
              2.22.0: count(runai_workload_info_enriched{FILTERS}) by (workload_category, clusterId)
      runai_workload_count_per_nodepool:
        cross_version_query: sum(runai_workload_count_per_nodepool{FILTERS}) by(nodepool, clusterId) or on (nodepool, clusterId) count(runai_workload_info_enriched{FILTERS}) by (nodepool, clusterId)
        queries:
            2.23.0: sum(runai_workload_count_per_nodepool{FILTERS}) by(nodepool, clusterId)
            2.16.0: count(runai_workload_info_enriched{FILTERS}) by (nodepool, clusterId)
      runai_workload_count_per_project:
          cross_version_query: sum(runai_workload_count_per_project{FILTERS}) by(project, clusterId) or on (project, clusterId) count(runai_workload_info_enriched{FILTERS}) by (project, clusterId)
          queries:
              2.23.0: sum(runai_workload_count_per_project{FILTERS}) by(project, clusterId)
              2.16.0: count(runai_workload_info_enriched{FILTERS}) by (project, clusterId)
      runai_workload_count_per_department:
        cross_version_query: sum(runai_workload_count_per_department{FILTERS}) by(department, clusterId) or on (department, clusterId) count(runai_workload_info_enriched{FILTERS}) by (department, clusterId)
        queries:
            2.23.0: sum(runai_workload_count_per_department{FILTERS}) by(department, clusterId)
            2.16.0: count(runai_workload_info_enriched{FILTERS}) by (department, clusterId)
      runai_workload_count_per_tenant:
        cross_version_query: sum(runai_workload_count_per_cluster{FILTERS}) or count(runai_workload_info_enriched{FILTERS})
        queries:
            2.23.0: sum(runai_workload_count_per_cluster{FILTERS})
            2.16.0: count(runai_workload_info_enriched{FILTERS})
      runai_gpu_utilization_per_cluster:
        cross_version_query: runai_gpu_utilization_per_cluster{FILTERS}
        queries:
            2.11.0: runai_gpu_utilization_per_cluster{FILTERS}
      runai_gpu_memory_utilization_per_cluster:
        cross_version_query: runai_gpu_memory_utilization_per_cluster{FILTERS}
        queries:
            2.11.0: runai_gpu_memory_utilization_per_cluster{FILTERS}
      runai_cpu_utilization_per_cluster:
        cross_version_query: runai_cpu_utilization_per_cluster{FILTERS}
        queries:
            2.11.0: runai_cpu_utilization_per_cluster{FILTERS}
      runai_memory_utilization_per_cluster:
        cross_version_query: runai_memory_utilization_per_cluster{FILTERS}
        queries:
            2.11.0: runai_memory_utilization_per_cluster{FILTERS}
      runai_allocated_gpu_count_per_cluster:
        cross_version_query: runai_allocated_gpu_count_per_cluster{FILTERS}
        queries:
            2.11.0: runai_allocated_gpu_count_per_cluster{FILTERS}
      runai_gpu_count_per_cluster:
        cross_version_query: runai_gpu_count_per_cluster{FILTERS}
        queries:
            2.11.0: runai_gpu_count_per_cluster{FILTERS}


      runai_in_quota_gpu_hours_per_cluster:
        cross_version_query: sum_over_time((sum(runai_allocated_gpu_count_per_project{project!="", FILTERS}) by (clusterId) - sum(clamp_min(sum(runai_allocated_gpu_count_per_project{project!="", FILTERS}) by (clusterId, department, project) - on(clusterId, department, project) sum(runai_deserved_gpu_count_per_project{project!="", FILTERS} >= 0) by (clusterId, department, project), 0)) by (clusterId))[RANGE:30s]) / 120
        queries:
            2.24.0: (sum(sum_over_time(runai_allocated_gpu_count_per_project:hourly{project!="", FILTERS}[RANGE])) by (clusterId) - sum(clamp_min(sum(sum_over_time(runai_allocated_gpu_count_per_project:hourly{project!="", FILTERS}[RANGE])) by (clusterId, department, project) - on(clusterId, department, project) sum(sum_over_time(runai_deserved_gpu_count_per_project:hourly{project!="", FILTERS}[RANGE]) >= 0) by (clusterId, department, project), 0)) by (clusterId)) / 3600
            2.18.0: sum_over_time((sum(runai_allocated_gpu_count_per_project{project!="", FILTERS}) by (clusterId) - sum(clamp_min(sum(runai_allocated_gpu_count_per_project{project!="", FILTERS}) by (clusterId, department, project) - on(clusterId, department, project) sum(runai_deserved_gpu_count_per_project{project!="", FILTERS} >= 0) by (clusterId, department, project), 0)) by (clusterId))[RANGE:30s]) / 120
      runai_in_quota_gpu_hours_per_nodepool:
        cross_version_query: sum_over_time((sum(runai_allocated_gpu_count_per_nodepool{FILTERS}) by (clusterId, nodepool) - clamp_min(sum(runai_allocated_gpu_count_per_nodepool{FILTERS}) by (clusterId, nodepool) - sum(runai_deserved_gpu_count_per_queue{FILTERS} > 0) by (clusterId, nodepool),0))[RANGE:30s]) / 120
        queries:
            2.24.0: sum(sum_over_time(runai_allocated_gpu_count_per_nodepool:hourly{FILTERS}[RANGE]) - clamp_min((sum_over_time(runai_allocated_gpu_count_per_nodepool:hourly{FILTERS}[RANGE]) - sum(sum_over_time(runai_deserved_gpu_count_per_queue:hourly{FILTERS}[RANGE]) > 0) by (clusterId, nodepool)), 0)) by (clusterId, nodepool) / 3600
            2.18.0: sum_over_time((sum(runai_allocated_gpu_count_per_nodepool{FILTERS}) by (clusterId, nodepool) - clamp_min(sum(runai_allocated_gpu_count_per_nodepool{FILTERS}) by (clusterId, nodepool) - sum(runai_deserved_gpu_count_per_queue{FILTERS} > 0) by (clusterId, nodepool),0))[RANGE:30s]) / 120
      runai_in_quota_gpu_hours_per_department:
        cross_version_query: sum_over_time((sum(runai_allocated_gpu_count_per_department{FILTERS}) by (clusterId, department) - clamp_min(sum(runai_allocated_gpu_count_per_department{FILTERS}) by (clusterId, department) - sum(runai_deserved_gpu_count_per_department{FILTERS}) by (clusterId, department),0))[RANGE:30s]) / 120
        queries:
            2.24.0: sum(sum_over_time(runai_allocated_gpu_count_per_department:hourly{FILTERS}[RANGE]) - clamp_min((sum_over_time(runai_allocated_gpu_count_per_department:hourly{FILTERS}[RANGE]) - sum(sum_over_time(runai_deserved_gpu_count_per_department:hourly{FILTERS}[RANGE])) by (clusterId, department)), 0)) by (clusterId, department) / 3600
            2.18.0: sum_over_time((sum(runai_allocated_gpu_count_per_department{FILTERS}) by (clusterId, department) - clamp_min(sum(runai_allocated_gpu_count_per_department{FILTERS}) by (clusterId, department) - sum(runai_deserved_gpu_count_per_department{FILTERS}) by (clusterId, department),0))[RANGE:30s]) / 120
      runai_in_quota_gpu_hours_per_project:
        cross_version_query: sum_over_time((sum(runai_allocated_gpu_count_per_project{project!="", FILTERS}) by (clusterId, department, project) - on(clusterId, department, project) clamp_min(sum(runai_allocated_gpu_count_per_project{project!="", FILTERS}) by (clusterId, department, project) - on(clusterId, department, project) sum(runai_deserved_gpu_count_per_project{project!="", FILTERS} >= 0) by (clusterId, department, project), 0))[RANGE:30s]) / 120
        queries:
            2.24.0: (sum(sum_over_time(runai_allocated_gpu_count_per_project:hourly{project!="", FILTERS}[RANGE])) by (clusterId, department, project) - on(clusterId, department, project) clamp_min(sum(sum_over_time(runai_allocated_gpu_count_per_project:hourly{project!="", FILTERS}[RANGE])) by (clusterId, department, project) - on(clusterId, department, project) sum(sum_over_time(runai_deserved_gpu_count_per_project:hourly{project!="", FILTERS}[RANGE]) >= 0) by (clusterId, department, project), 0)) / 3600
            2.18.0: sum_over_time((sum(runai_allocated_gpu_count_per_project{project!="", FILTERS}) by (clusterId, department, project) - on(clusterId, department, project) clamp_min(sum(runai_allocated_gpu_count_per_project{project!="", FILTERS}) by (clusterId, department, project) - on(clusterId, department, project) sum(runai_deserved_gpu_count_per_project{project!="", FILTERS} >= 0) by (clusterId, department, project), 0))[RANGE:30s]) / 120


      runai_over_quota_gpu_hours_per_cluster:
        cross_version_query: sum_over_time((sum(clamp_min(sum(runai_allocated_gpu_count_per_project{project!="", FILTERS}) by (clusterId, department, project) - on(clusterId, department, project) sum(runai_deserved_gpu_count_per_project{project!="", FILTERS} >= 0) by (clusterId, department, project), 0)) by (clusterId))[RANGE:30s]) / 120
        queries:
            2.24.0: sum(clamp_min(sum(sum_over_time(runai_allocated_gpu_count_per_project:hourly{project!="", FILTERS}[RANGE])) by (clusterId, department, project) - on(clusterId, department, project) sum(sum_over_time(runai_deserved_gpu_count_per_project:hourly{project!="", FILTERS}[RANGE]) >= 0) by (clusterId, department, project), 0)) by (clusterId) / 3600
            2.18.0: sum_over_time((sum(clamp_min(sum(runai_allocated_gpu_count_per_project{project!="", FILTERS}) by (clusterId, department, project) - on(clusterId, department, project) sum(runai_deserved_gpu_count_per_project{project!="", FILTERS} >= 0) by (clusterId, department, project), 0)) by (clusterId))[RANGE:30s]) / 120
      runai_over_quota_gpu_hours_per_nodepool:
        cross_version_query: sum_over_time(clamp_min(sum by (clusterId, nodepool)(runai_allocated_gpu_count_per_nodepool{FILTERS}) - sum by (clusterId, nodepool)(runai_deserved_gpu_count_per_queue{project!="",FILTERS} > -1),0)[RANGE:30s]) / 120
        queries:
            2.24.0: sum(clamp_min((sum(sum_over_time(runai_allocated_gpu_count_per_nodepool:hourly{FILTERS}[RANGE])) by (clusterId, nodepool) - sum(sum_over_time(runai_deserved_gpu_count_per_queue:hourly{project!="",FILTERS}[RANGE]) > -1) by (clusterId, nodepool)), 0)) by (clusterId, nodepool) / 3600
            2.18.0: sum_over_time(clamp_min(sum by (clusterId, nodepool)(runai_allocated_gpu_count_per_nodepool{FILTERS}) - sum by (clusterId, nodepool)(runai_deserved_gpu_count_per_queue{project!="",FILTERS} > -1),0)[RANGE:30s]) / 120
      runai_over_quota_gpu_hours_per_department:
        cross_version_query: sum_over_time((sum by (department)(runai_allocated_gpu_count_per_department{FILTERS})-clamp_min(sum by (department)(runai_allocated_gpu_count_per_department{FILTERS})-sum by (department)(runai_deserved_gpu_count_per_department > 0),0))[RANGE:30s]) / 120
        queries:
            2.24.0: sum(clamp_min((sum(sum_over_time(runai_allocated_gpu_count_per_department:hourly{FILTERS}[RANGE])) by (clusterId, department) - sum(sum_over_time(runai_deserved_gpu_count_per_department:hourly{FILTERS}[RANGE]) > 0) by (clusterId, department)), 0)) by (clusterId, department) / 3600
            2.18.0: sum_over_time((sum by (department)(runai_allocated_gpu_count_per_department{FILTERS})-clamp_min(sum by (department)(runai_allocated_gpu_count_per_department{FILTERS})-sum by (department)(runai_deserved_gpu_count_per_department > 0),0))[RANGE:30s]) / 120
      runai_over_quota_gpu_hours_per_project:
        cross_version_query: sum_over_time((clamp_min(sum(runai_allocated_gpu_count_per_project{project!="", FILTERS}) by (clusterId, department, project) - on(clusterId, department, project) sum(runai_deserved_gpu_count_per_project{project!="", FILTERS} >= 0) by (clusterId, department, project), 0))[RANGE:30s]) / 120
        queries:
            2.24.0: clamp_min(sum(sum_over_time(runai_allocated_gpu_count_per_project:hourly{project!="", FILTERS}[RANGE])) by (clusterId, department, project) - on(clusterId, department, project) sum(sum_over_time(runai_deserved_gpu_count_per_project:hourly{project!="", FILTERS}[RANGE]) >= 0) by (clusterId, department, project), 0) / 3600
            2.18.0: sum_over_time((clamp_min(sum(runai_allocated_gpu_count_per_project{project!="", FILTERS}) by (clusterId, department, project) - on(clusterId, department, project) sum(runai_deserved_gpu_count_per_project{project!="", FILTERS} >= 0) by (clusterId, department, project), 0))[RANGE:30s]) / 120

      runai_departments_gpu_quota_per_cluster:
        cross_version_query: min(runai_deserved_gpu_count_per_department{FILTERS}<0) by(clusterId) or on(clusterId) sum(runai_deserved_gpu_count_per_department{FILTERS}>=0) by(clusterId)
        queries:
            2.16.0: min(runai_deserved_gpu_count_per_department{FILTERS}<0) by(clusterId) or on(clusterId) sum(runai_deserved_gpu_count_per_department{FILTERS}>=0) by(clusterId)
      runai_projects_gpu_quota_per_cluster:
        cross_version_query: min(runai_deserved_gpu_count_per_project{FILTERS}<0) by(clusterId) or on(clusterId) sum(runai_deserved_gpu_count_per_project{FILTERS}>=0) by(clusterId)
        queries:
            2.13.0: min(runai_deserved_gpu_count_per_project{FILTERS}<0) by(clusterId) or on(clusterId) sum(runai_deserved_gpu_count_per_project{FILTERS}>=0) by(clusterId)
      runai_departments_gpu_quota_per_nodepool:
        cross_version_query: min(runai_deserved_gpu_count_per_queue{project="",FILTERS}<0) by(clusterId, nodepool) or on(clusterId, nodepool) sum(runai_deserved_gpu_count_per_queue{project="",FILTERS}>=0) by(clusterId, nodepool)
        queries:
            2.16.0: min(runai_deserved_gpu_count_per_queue{project="",FILTERS}<0) by(clusterId, nodepool) or on(clusterId, nodepool) sum(runai_deserved_gpu_count_per_queue{project="",FILTERS}>=0) by(clusterId, nodepool)
      runai_projects_gpu_quota_per_nodepool:
        cross_version_query: min(runai_deserved_gpu_count_per_queue{project!="",FILTERS}<0) by(clusterId, nodepool) or on(clusterId, nodepool) sum(runai_deserved_gpu_count_per_queue{project!="",FILTERS}>=0) by(clusterId, nodepool)
        queries:
            2.16.0: min(runai_deserved_gpu_count_per_queue{project!="",FILTERS}<0) by(clusterId, nodepool) or on(clusterId, nodepool) sum(runai_deserved_gpu_count_per_queue{project!="",FILTERS}>=0) by(clusterId, nodepool)
      runai_gpu_count_per_node:
        cross_version_query: runai_gpu_count_per_node{FILTERS}
        queries:
            2.9.0: runai_gpu_count_per_node{FILTERS}
      runai_gpu_utilization_per_tenant:
        cross_version_query: sum(avg(runai_gpu_utilization_per_cluster{FILTERS}) by (clusterId) * on(clusterId) runai_gpu_count_per_cluster{FILTERS}) / sum(runai_gpu_count_per_cluster{FILTERS})
        queries:
            2.11.0: sum(avg(runai_gpu_utilization_per_cluster{FILTERS}) by (clusterId) * on(clusterId) runai_gpu_count_per_cluster{FILTERS}) / sum(runai_gpu_count_per_cluster{FILTERS})
      runai_gpu_memory_utilization_per_tenant:
        cross_version_query: (100 * sum(runai_gpu_memory_used_mebibytes_per_cluster{FILTERS}) / sum(runai_gpu_memory_total_mebibytes_per_cluster{FILTERS}))
        queries:
            2.11.0: (100 * sum(runai_gpu_memory_used_mebibytes_per_cluster{FILTERS}) / sum(runai_gpu_memory_total_mebibytes_per_cluster{FILTERS}))
      runai_cpu_utilization_per_tenant:
        cross_version_query: (100 * (sum(runai_used_cpu_cores_per_cluster{FILTERS}) / sum(runai_cpu_cores_count_per_cluster{FILTERS})))
        queries:
            2.11.0: 100 * (sum(runai_used_cpu_cores_per_cluster{FILTERS}) / sum(runai_cpu_cores_count_per_cluster{FILTERS}))
      runai_memory_utilization_per_tenant:
        cross_version_query: (100 * (sum(runai_used_memory_bytes_per_cluster{FILTERS}) / sum(runai_total_memory_bytes_per_cluster{FILTERS})))
        queries:
            2.11.0: 100 * (sum(runai_used_memory_bytes_per_cluster{FILTERS}) / sum(runai_total_memory_bytes_per_cluster{FILTERS}))
      runai_allocated_gpu_count_per_tenant:
        cross_version_query: sum(runai_allocated_gpu_count_per_cluster{FILTERS})
        queries:
            2.11.0: sum(runai_allocated_gpu_count_per_cluster{FILTERS})
      runai_gpu_count_per_tenant:
        cross_version_query: sum(sum(runai_gpu_count_per_cluster{FILTERS}))
        queries:
            2.11.0: sum(runai_gpu_count_per_cluster{FILTERS})
      runai_free_gpu_count_per_node:
        cross_version_query: sum(runai_free_gpu_count_per_node{FILTERS}) by (clusterId, node, nodepool) or on (node, clusterId) ((count((sum(((sum(runai_allocated_gpu_count_per_pod{gpu!="",FILTERS}) by(gpu, node) or count(runai_gpu_memory_used_mebibytes_per_pod_per_gpu{FILTERS}) by(node, gpu)) * on(gpu, node) group_right() group(runai_gpu_memory_total_mebibytes_per_gpu{FILTERS}) by(UUID, gpu, node, nodepool, modelName, clusterId)) or on(UUID) runai_gpu_memory_total_mebibytes_per_gpu{FILTERS}*0) by(UUID, gpu, node, nodepool, modelName, clusterId))==0) by (clusterId, node, nodepool)) * on(node) group_left(nodepool) (runai_node_nodepool==1 or on(node) kube_node_info))
