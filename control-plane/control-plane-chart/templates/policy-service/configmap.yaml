{{- include "common.configMap" (list . .Values.policyService "control-plane.policyService.configmap") }}
{{- define "control-plane.policyService.configmap" -}}
{{- $top := first . }}
data:
  LOG_LEVEL: {{ $top.Values.policyService.config.logLevel | quote }}
  SERVICE_PORT: {{ $top.Values.policyService.service.port | quote }}
  SERVICE_NAME: {{ $top.Values.policyService.name | quote }}
  TRACING_ENABLED: {{ if hasKey $top.Values.policyService.config "tracingEnabled" }}{{ $top.Values.policyService.config.tracingEnabled | quote }}{{ else }}{{ $top.Values.global.config.tracingEnabled | quote }}{{ end }}
  AUDIT_ENABLED: {{ if hasKey $top.Values.policyService.config "auditEnabled" }}{{ $top.Values.policyService.config.auditEnabled | quote }}{{ else }}{{ $top.Values.global.config.auditEnabled | quote }}{{ end }}
  AUDIT_ENABLE_PRINT_TO_STDOUT: {{ if hasKey $top.Values.policyService.config "auditEnablePrintToStdout" }}{{ $top.Values.policyService.config.auditEnablePrintToStdout | quote }}{{ else }}{{ $top.Values.global.config.auditEnablePrintToStdout | quote }}{{ end }}
  AUDIT_SERVICE_URL: {{ printf "http://%s-%s:%s" $top.Values.fullnameOverride $top.Values.auditService.name ($top.Values.auditService.service.port | toString) | quote }}
  AUTH_SERVICE_URL: {{ printf "http://%s-%s:%s" $top.Values.fullnameOverride $top.Values.authorization.name ($top.Values.authorization.service.port | toString) | quote }}
  ASSETS_SERVICE_URL: {{ printf "http://%s-%s:%s" $top.Values.fullnameOverride $top.Values.assetsService.name ($top.Values.assetsService.service.port | toString) | quote }}
  ORG_UNIT_SERVICE_URL: {{ printf "http://%s-%s:%s" $top.Values.fullnameOverride $top.Values.orgUnitService.name ($top.Values.orgUnitService.service.port | toString) | quote }}

  DB_NAME: {{ $top.Values.policyService.config.dbName | default $top.Values.global.postgresql.auth.database | quote }}
  DB_MIGRATION_FILES: {{ $top.Values.policyService.config.migrationFiles | quote }}
  DB_HOST: {{ $top.Values.policyService.config.dbHost | default $top.Values.global.postgresql.auth.host | quote }}
  DB_SSL_MODE: {{ $top.Values.policyService.config.dbSslMode | default $top.Values.global.postgresql.auth.dbSslMode | quote }}
  DB_PORT: {{ $top.Values.policyService.config.dbPort | default $top.Values.global.postgresql.auth.port | quote }}
  {{- if or ($top.Values.global.postgresql.auth.readHost) ($top.Values.policyService.config.dbReadHost) }}
  DB_READ_HOST: {{ $top.Values.policyService.config.dbReadHost | default $top.Values.global.postgresql.auth.readHost | quote }}
  {{- end }}
  {{- if or ($top.Values.global.postgresql.auth.dbReadPort) ($top.Values.policyService.config.dbReadPort) }}
  DB_READ_PORT: {{ $top.Values.policyService.config.dbReadPort | default $top.Values.global.postgresql.auth.readPort | quote }}
  {{- end }}
  DB_SCHEMA: {{ $top.Values.policyService.config.dbScheme | default $top.Values.global.postgresql.auth.scheme | quote }}
  DB_ASSETS_SCHEMA: {{ $top.Values.assetsService.config.dbScheme | default $top.Values.global.postgresql.auth.scheme | quote }}

  SYNC_API_WORKERS: {{ $top.Values.policyService.config.syncApiWorkers | quote }}
  SYNC_API_POLICIES_PER_BULK: {{ $top.Values.policyService.config.syncApiPoliciesPerBulk | quote }}
  CLUSTER_SERVICE_URL: {{ printf "http://%s-%s:%s" $top.Values.fullnameOverride $top.Values.clusterService.name ($top.Values.clusterService.service.port | toString) | quote }}
  PUBSUB_URL: {{ $top.Values.global.pubsub.url | quote }}
  PUBSUB_TYPE: {{ $top.Values.global.pubsub.type | quote }}
  PUBSUB_ENABLE_ADDITIONAL_SUBSCRIBER: {{ $top.Values.global.pubsub.additionalSubscriber.enabled | quote }}
  {{- if $top.Values.global.pubsub.additionalSubscriber.enabled }}
  PUBSUB_ADDITIONAL_SUBSCRIBER_TYPE: {{ $top.Values.global.pubsub.additionalSubscriber.type | quote }}
  PUBSUB_ADDITIONAL_SUBSCRIBER_URL: {{ $top.Values.global.pubsub.additionalSubscriber.url | quote }}
  {{- end }}
{{- end }}