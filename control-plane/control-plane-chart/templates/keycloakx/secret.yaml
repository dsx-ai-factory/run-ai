{{- include "common.secret" (list . .Values.keycloakx "control-plane.keycloakx.secret") }}
{{- define "control-plane.keycloakx.secret" -}}
{{- $top := first . }}
data:
  KC_DB_USERNAME: {{ $top.Values.keycloakx.database.username | default $top.Values.global.postgresql.auth.username | b64enc }}
  KEYCLOAK_ADMIN: {{ $top.Values.keycloakx.adminUser | b64enc }}
  KC_DB_URL_HOST: {{ $top.Values.keycloakx.database.hostname | default $top.Values.global.postgresql.auth.host | b64enc }}
  KC_DB_URL_PORT: {{ $top.Values.keycloakx.database.port | default $top.Values.global.postgresql.auth.port | toString | b64enc }}
  KC_DB_URL_DATABASE: {{ $top.Values.keycloakx.database.dbName | default $top.Values.global.postgresql.auth.database | b64enc }}
  KC_DB_SCHEMA: {{ $top.Values.keycloakx.database.dbschema | b64enc }}
{{- end }}
