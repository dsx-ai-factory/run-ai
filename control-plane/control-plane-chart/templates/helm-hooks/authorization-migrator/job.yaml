{{- if .Values.authorization.enabled }}
{{- include "common.job" (list . .Values.authorizationMigrator .Values.authorizationMigrator.serviceAccount "control-plane.authorizationMigrator.job") }}
{{- end }}

{{- define "control-plane.authorizationMigrator.job" -}}
spec:
  template:
    spec:
      containers:
      - {{- include "common.container" . | nindent 12 }}
      restartPolicy: OnFailure
      initContainers:
        {{- include "common.initContainer" . | nindent 12 }}
{{- end }}