{{- if .Values.orgUnitService.enabled }}
{{- include "common.job" (list . .Values.orgUnitsMigrator .Values.orgUnitsMigrator.serviceAccount "control-plane.orgUnitsMigrator.job") }}
{{- end }}

{{- define "control-plane.orgUnitsMigrator.job" -}}
spec:
  template:
    spec:
      containers:
        - {{- include "common.container" . | nindent 12 }}
      restartPolicy: OnFailure
      initContainers:
        {{- include "awaitingOrgUnitServiceReadiness" . | nindent 12 }}
{{- end }}