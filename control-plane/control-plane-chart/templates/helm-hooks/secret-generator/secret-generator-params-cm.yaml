{{- $paramsAnnotations := .Values.secretGenerator.paramsConfigMap.annotations | default dict }}
{{- $paramsOverrides := merge (dict "annotations" $paramsAnnotations) (dict "name" "secret-generator-config") }}
{{- $paramsValues := mergeOverwrite (deepCopy .Values.secretGenerator) $paramsOverrides }}
{{- include "common.configMap" (list . $paramsValues "control-plane.secretGenerator.config-params") }}
{{- define "control-plane.secretGenerator.config-params" -}}
{{- $top := first . }}    
data:
  secrets.json: |
    {
      {{- $secretConfigs := list }}

      {{- /*
        Collect secret configurations from all components.
        nats-configs MUST precede cache-configs / pubsub-auth-configs:
        the latter two reconcile single keys (CACHE_PASSWORD / PUBSUB_PASSWORD)
        into the same gen-cache-pubsub Secret via copyFrom: AUTH_TOKEN, which
        requires AUTH_TOKEN to already be present (or seeded from the legacy
        runai-backend-nats Secret) by the time they run.
      */ -}}
      {{- range $componentConfigs := list
        (include "secret-generator.postgres-configs" $top)
        (include "secret-generator.keycloak-configs" $top)
        (include "secret-generator.tenants-manager-admin-configs" $top)
        (include "secret-generator.tenants-manager-mgmt-configs" $top)
        (include "secret-generator.nats-configs" $top)
        (include "secret-generator.cache-configs" $top)
        (include "secret-generator.pubsub-auth-configs" $top)
        (include "secret-generator.notifications-proxy-encryption-key-configs" $top)
        (include "secret-generator.telemetry-service-configs" $top)
        (include "secret-generator.telemetry-service-rename-configs" $top)
        (include "secret-generator.notifications-service-configs" $top)
      }}
        {{- range ($componentConfigs | fromJson).items }}
          {{- $secretConfigs = append $secretConfigs . }}
        {{- end }}
      {{- end }}

      {{- /* Render secrets as JSON */ -}}
      "secrets": [
        {{- range $i, $secret := $secretConfigs }}
        {{- if $i }},{{ end }}
        {
          "name": {{ $secret.name | quote }},
          {{- if $secret.legacySecretName }}
          "legacySecretName": {{ $secret.legacySecretName | quote }},
          {{- end }}
          {{- if $secret.existingSecretName }}
          "existingSecretName": {{ $secret.existingSecretName | quote }},
          {{- end }}
          "keys": [
            {{- range $j, $key := $secret.keys }}
            {{- if $j }},{{ end }}
            {
              "name": {{ $key.name | quote }}
              {{- if $key.legacyKeyName }}
              ,"legacyKeyName": {{ $key.legacyKeyName | quote }}
              {{- end }}
              {{- if $key.type }}
              ,"type": {{ $key.type | quote }}
              {{- end }}
              {{- if $key.length }}
              ,"length": {{ $key.length }}
              {{- end }}
              {{- if $key.copyFrom }}
              ,"copyFrom": {{ $key.copyFrom | quote }}
              {{- end }}
              {{- if hasKey $key "chartValue" }}
              ,"chartValue": {{ $key.chartValue | quote }}
              {{- end }}
              {{- if $key.externalOnly }}
              ,"externalOnly": true
              {{- end }}
            }
            {{- end }}
          ]
        }
        {{- end }}
      ]
    }
{{- end }}
