{{- include "common.secret" (list . .Values.notificationsProxy "control-plane.notificationsProxy.secret") }}

{{- define "control-plane.notificationsProxy.secret" -}}
{{- $top := first . }}
data:
  DB_USER: {{ $top.Values.notificationsProxy.config.dbUsername | default $top.Values.global.postgresql.auth.username | b64enc }}

  {{- if not $top.Values.notificationsProxy.config.slack.existingSecret }}
  SLACK_CLIENT_ID: {{ $top.Values.notificationsProxy.config.slack.clientId | b64enc | quote }}
  SLACK_CLIENT_SECRET: {{ $top.Values.notificationsProxy.config.slack.clientSecret | b64enc | quote }}
  {{- end }}
{{- end }}