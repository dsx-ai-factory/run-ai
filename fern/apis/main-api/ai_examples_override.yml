  /api/v1/cli/docs/runai.md:
    get:
      x-fern-examples:
        - path-parameters:
            documentName: runai.md
          request:
            documentName: runai.md
          response:
            body: |
              # Run:ai CLI Help

              Welcome to the Run:ai command line interface (CLI) documentation.

              ## Overview
              The Run:ai CLI allows you to manage AI workloads, monitor resources, and interact with the Run:ai platform.

              ## Common Commands
              - `runai submit`: Submit a new AI job.
              - `runai list`: List all running and completed jobs.
              - `runai logs`: Fetch logs for a specific job.
              - `runai config`: Configure CLI settings.

              ## Usage
              ```bash
              runai [command] [flags]
              ```

              For detailed help on each command, use:
              ```bash
              runai [command] --help
              ```

              ## More Information
              Visit https://run.ai/docs for comprehensive guides and tutorials.
