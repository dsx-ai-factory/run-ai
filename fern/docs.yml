    permanent: true
  - source: /run-ai/self-hosted/documentation/platform-management/runai-scheduler/resource-optimization/gpu-fractions/compute-modes
    destination: /run-ai/self-hosted/documentation/scheduling/gpu-sharing/compute-modes
    permanent: true
  - source: /run-ai/self-hosted/documentation/platform-management/runai-scheduler/resource-optimization/gpu-fractions/dynamic-memory-fractions
    destination: /run-ai/self-hosted/documentation/scheduling/gpu-sharing/dynamic-memory-fractions
    permanent: true
  - source: /run-ai/self-hosted/documentation/platform-management/runai-scheduler/resource-optimization/gpu-fractions/memory-fractions
    destination: /run-ai/self-hosted/documentation/scheduling/gpu-sharing/memory-fractions
    permanent: true
  - source: /run-ai/self-hosted/documentation/platform-management/runai-scheduler/resource-optimization/quick-starts/compute-modes-quickstart
    destination: /run-ai/self-hosted/documentation/scheduling/gpu-sharing/quick-starts/compute-modes-quickstart
