  - source: /run-ai/self-hosted/documentation/platform-management/runai-scheduler/resource-optimization/quick-starts/dynamic-gpu-fractions-quickstart
    destination: /run-ai/self-hosted/documentation/scheduling/gpu-sharing/quick-starts/dynamic-gpu-fractions-quickstart
