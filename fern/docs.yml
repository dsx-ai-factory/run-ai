# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
- url: nvidia-run-ai.docs.buildwithfern.com/run-ai
  custom-domain: docs.nvidia.com/run-ai
  multi-source: true
title: NVIDIA Run:ai Documentation
global-theme: nvidia
logo:
  right-text: Run:ai
navbar-links:
- type: github
  value: https://github.com/dsx-ai-factory/run-ai

products:
  - display-name: Self-Hosted
    slug: self-hosted
    path: products/self-hosted.yml
    versions:
      - display-name: "v3.0"
        slug: v3.0
        path: products/self-hosted.yml
      - display-name: "v2.26"
        slug: v2.26
        path: archived-versions.yml
      - display-name: "v2.25"
        slug: v2.25
        path: archived-versions.yml
      - display-name: "v2.24"
        slug: v2.24
        path: archived-versions.yml
  - display-name: Multi-Tenant
    slug: multi-tenant
    path: products/multi-tenant.yml
    versions:
      - display-name: "v3.0"
        slug: v3.0
        path: products/multi-tenant.yml
      - display-name: "v2.26"
        slug: v2.26
        path: archived-versions.yml
      - display-name: "v2.25"
        slug: v2.25
        path: archived-versions.yml
      - display-name: "v2.24"
        slug: v2.24
        path: archived-versions.yml

redirects:
  - source: /self-hosted/reference/rest-api/endpoints/ai-applications/ai-applications
    destination: /run-ai/self-hosted/reference/rest-api/endpoints/ai-applications/list-applications
    permanent: true
  - source: /self-hosted/reference/rest-api/endpoints/ai-applications/ai-applications/:slug*
    destination: /run-ai/self-hosted/reference/rest-api/endpoints/ai-applications/:slug*
    permanent: true
  - source: /self-hosted/platform-management/runai-scheduler/resource-optimization/fractions
    destination: /self-hosted/platform-management/runai-scheduler/resource-optimization/gpu-fractions/memory-fractions
    permanent: true
  - source: /self-hosted/platform-management/runai-scheduler/resource-optimization/dynamic-fractions
    destination: /self-hosted/platform-management/runai-scheduler/resource-optimization/gpu-fractions/dynamic-memory-fractions
    permanent: true
  - source: /self-hosted/platform-management/runai-scheduler/resource-optimization/time-slicing
    destination: /self-hosted/platform-management/runai-scheduler/resource-optimization/gpu-fractions/compute-modes
    permanent: true
  - source: /self-hosted/v2.26/:slug*
    destination: https://run-ai-docs.nvidia.com/self-hosted
    permanent: false
  - source: /self-hosted/v2.25/:slug*
    destination: https://run-ai-docs.nvidia.com/self-hosted/2.25
    permanent: false
  - source: /self-hosted/v2.24/:slug*
    destination: https://run-ai-docs.nvidia.com/self-hosted/2.24
    permanent: false
  - source: /self-hosted/v2.23/:slug*
    destination: https://run-ai-docs.nvidia.com/self-hosted/2.23
    permanent: false
  - source: /multi-tenant/v2.26/:slug*
    destination: https://run-ai-docs.nvidia.com/multi-tenant
    permanent: false
  - source: /multi-tenant/v2.25/:slug*
    destination: https://run-ai-docs.nvidia.com/multi-tenant/2.25
    permanent: false
  - source: /multi-tenant/v2.24/:slug*
    destination: https://run-ai-docs.nvidia.com/multi-tenant/2.24
    permanent: false
  - source: /index.html
    destination: /run-ai/self-hosted/documentation/home
    permanent: true
  - source: /saas
    destination: https://run-ai-docs.nvidia.com/saas
    permanent: false
  - source: /saas/:slug*
    destination: https://run-ai-docs.nvidia.com/saas
    permanent: false
