# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
- url: nvidia-run-ai.docs.buildwithfern.com/run-ai
  custom-domain: docs.nvidia.com/run-ai
  multi-source: true
title: NVIDIA Run:ai Documentation
global-theme: nvidia
logo:
  right-text: Run:ai
navbar-links:
- type: github
  value: https://github.com/dsx-ai-factory/run-ai

products:
  - display-name: Self-Hosted
    slug: self-hosted
    path: products/self-hosted.yml
    versions:
      - display-name: "v3.0"
        slug: v3.0
        path: products/self-hosted.yml
      - display-name: "v2.26"
        slug: v2.26
        path: archived-versions.yml
      - display-name: "v2.25"
        slug: v2.25
        path: archived-versions.yml
      - display-name: "v2.24"
        slug: v2.24
        path: archived-versions.yml
  - display-name: Multi-Tenant
    slug: multi-tenant
    path: products/multi-tenant.yml
    versions:
      - display-name: "v3.0"
        slug: v3.0
        path: products/multi-tenant.yml
      - display-name: "v2.26"
        slug: v2.26
        path: archived-versions.yml
      - display-name: "v2.25"
        slug: v2.25
        path: archived-versions.yml
      - display-name: "v2.24"
        slug: v2.24
        path: archived-versions.yml

redirects:
  - source: /self-hosted/reference/rest-api/endpoints/ai-applications/ai-applications
    destination: /run-ai/self-hosted/reference/rest-api/endpoints/ai-applications/list-applications
    permanent: true
  - source: /self-hosted/reference/rest-api/endpoints/ai-applications/ai-applications/:slug*
    destination: /run-ai/self-hosted/reference/rest-api/endpoints/ai-applications/:slug*
    permanent: true
  - source: /self-hosted/platform-management/runai-scheduler/resource-optimization/fractions
    destination: /run-ai/self-hosted/documentation/scheduling/gpu-sharing/memory-fractions
    permanent: true
  - source: /self-hosted/platform-management/runai-scheduler/resource-optimization/dynamic-fractions
    destination: /run-ai/self-hosted/documentation/scheduling/gpu-sharing/dynamic-memory-fractions
    permanent: true
  - source: /self-hosted/platform-management/runai-scheduler/resource-optimization/time-slicing
    destination: /run-ai/self-hosted/documentation/scheduling/gpu-sharing/compute-modes
    permanent: true
  - source: /self-hosted/documentation/ai-applications/ai-applications
    destination: /run-ai/self-hosted/documentation/workloads-in-nvidia-run-ai/ai-applications/submit-ai-applications
    permanent: true
  - source: /run-ai/self-hosted/documentation/platform-management/authentication/cluster-authentication
    destination: /run-ai/self-hosted/documentation/installation-and-configuration/config/cluster-authentication
    permanent: true
  - source: /self-hosted/documentation/installation-and-configuration/config/cluster-configuration
    destination: /run-ai/self-hosted/documentation/installation-and-configuration/config/advanced-cluster-configuration
    permanent: true
  - source: /run-ai/self-hosted/documentation/platform-management/authentication/permissions
    destination: /run-ai/self-hosted/documentation/platform-management/authentication/roles/permissions
    permanent: true
  - source: /run-ai/self-hosted/documentation/ai-applications/introduction-to-ai-applications
    destination: /run-ai/self-hosted/documentation/workloads-in-nvidia-run-ai/ai-applications/introduction-to-ai-applications
    permanent: true
  - source: /run-ai/self-hosted/documentation/ai-applications/submit-ai-applications
    destination: /run-ai/self-hosted/documentation/workloads-in-nvidia-run-ai/ai-applications/submit-ai-applications
    permanent: true
  - source: /run-ai/self-hosted/documentation/platform-management/manage-ai-initiatives/resources/mig-profiles
    destination: /run-ai/self-hosted/documentation/scheduling/gpu-sharing/mig-profiles
