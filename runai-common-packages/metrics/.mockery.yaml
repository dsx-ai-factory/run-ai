template: testify
template-data:
  unroll-variadic: true
dir: "{{.InterfaceDir}}/mocks"
pkgname: "mocks"
structname: "Mock{{.InterfaceName}}"
filename: "mock_{{.InterfaceName}}.go"
packages:
  github.com/dsx-ai-factory/run-ai/runai-common-packages/metrics/runaimetrics:
    interfaces:
      MetricCounter:
      MetricGauge:
      MetricHistogram:
      MetricSummary:
      CounterVector:
      GaugeVector:
      HistogramVector:
      SummaryVector:

  github.com/dsx-ai-factory/run-ai/runai-common-packages/metrics:
    config:
      all: true
      dir: "{{.InterfaceDir}}/mocks"
      pkgname: "mocks"

  github.com/dsx-ai-factory/run-ai/runai-common-packages/metrics/internal/registry:
    config:
      all: true
      dir: "{{.InterfaceDir}}/mocks"
      pkgname: "mocks"

  github.com/prometheus/client_golang/prometheus:
    interfaces:
      Registerer:
        config:
          dir: internal/registry/mocks
          pkgname: "mocks"
          structname: "Registerer"
