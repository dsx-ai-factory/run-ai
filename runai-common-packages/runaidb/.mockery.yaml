template: testify
template-data:
  unroll-variadic: true
dir: "{{.InterfaceDir}}/mocks"
pkgname: "mocks"
structname: "{{.InterfaceName}}"
filename: "{{.InterfaceName}}.go"
packages:
  github.com/run-ai/runai/runai-common-packages/runaidb:
    interfaces:
      DBInitializer:
  github.com/run-ai/runai/runai-common-packages/runaidb/orm:
    interfaces:
      DB:
  github.com/run-ai/runai/runai-common-packages/runaidb/internal/logger:
    interfaces:
      Logger:
  github.com/run-ai/runai/runai-common-packages/runaidb/internal/postgres:
    interfaces:
      migrationStrategy:
        config:
          structname: "MigrationStrategy"
      migrationRunner:
        config:
          structname: "MigrationRunner"
  github.com/run-ai/runai/runai-common-packages/runaidb/internal/dbinit:
    interfaces:
      Factory:
      Connector:
      Migrator:
      SessionCreator:
