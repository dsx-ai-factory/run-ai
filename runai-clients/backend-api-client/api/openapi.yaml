      - $ref: '#/components/schemas/ClusterReportedStatus'
      example:
        operands:
          key:
            reasons:
            - reasons
            - reasons
            ready: true
            lastTransitionTime: 2000-01-23T04:56:07.000+00:00
            unreadyThresholdCrossed: true
        lastConnected: 2021-12-14T16:04:15.099Z
        state: WaitingToConnect
        conditions:
        - reason: reason
          lastTransitionTime: 2000-01-23T04:56:07.000+00:00
          message: message
          type: type
          observedGeneration: 0
          status: "True"
        - reason: reason
          lastTransitionTime: 2000-01-23T04:56:07.000+00:00
          message: message
          type: type
          observedGeneration: 0
          status: "True"
        dependencies:
          optional:
