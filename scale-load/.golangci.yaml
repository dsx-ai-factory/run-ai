version: "2"

run:
  tests: false
  timeout: 10m
  issues-exit-code: 1

output:
  formats:
    json:
      path: linter.json
    text:
      path: stdout
      colors: true

formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    - lll
    - unused
    - goconst

    - gosec
    - sqlclosecheck  
    - rowserrcheck   

    - noctx  

    - govet
    - ineffassign
    - staticcheck
  settings:
    lll:
      line-length: 220
      tab-width: 1
  exclusions:
    generated: lax
    paths:
      - bin
      - vendor
      - generated
    rules:
      - path: "_test\\.go"
        linters: [gosec, noctx]

issues:
  max-same-issues: 50
  max-issues-per-linter: 100

severity:
  default: error
