<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowMark — Scale &amp; Load Nightly</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js" integrity="sha512-WoViKhKD4qI2WruSZqv9+kvM4WfFhUMQCLN4QlDTt5aU56fLQy2gYoxWIqlEnXqJy/+Ac5q/hk1oWfqnMDhwMA==" crossorigin="anonymous"></script>
</head>
<body>
<header class="page-header">
  <div>
    <h1>FlowMark — Scale &amp; Load Nightly</h1>
    <div class="subtitle" id="subtitle">loading…</div>
  </div>
  <label class="cluster-pick">cluster type
    <select id="cluster-type"></select>
  </label>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="runs">Test Runs</button>
  <button class="tab" data-tab="metrics">Metrics</button>
</nav>

<main>
  <section class="tab-content" data-content="runs">
    <div id="runs"></div>
  </section>

  <section class="tab-content hidden" data-content="metrics">
    <div class="metrics-controls">
      <div class="subtabs" id="subtabs"></div>
      <input class="filter" id="filter" type="search" placeholder="filter charts, e.g. ttj or @500" autocomplete="off">
    </div>
    <div class="charts" id="charts"></div>
  </section>

  <p class="notice hidden" id="notice"></p>
</main>

<script src="app.js"></script>
</body>
</html>
